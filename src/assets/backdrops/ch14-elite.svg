<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch14-elite — The Kept Steps: the grand stair the marilith has held
       since before the god was a corpse, dressed for the hall's last
       guardians. The stair mass climbs the RIGHT half toward the Throne
       level; a six-armed warden-statue keeps its plinth mid-hall — the
       drilled school the demon teaches. Key light: a chain-censer
       upper-LEFT burning low blood-red; an essence basin set INTO the
       stair side seeps a dim second glow. The Slayer's gouges rake the
       left marble. Quiet mid band y38-63 (stair faces kept to two close
       values); seam y66.
       Ramps — void marble: #0c0a10 #131019 #1b1622 #251e2e (+#332a40);
       essence: #2a0b08 #3f100c #5a1812 #8a2418; brass: #54400f #6a521e
       #8a6c2a; censer-flame: #a33d1e #e8743a (+#ffb347 pinpoint).
       No baked-in vignette/grain. -->
  <defs>
    <radialGradient id="c14e-censer-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#a33d1e" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#a33d1e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c14e-basin-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c43a28" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8a2418" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c14e-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
  </defs>

