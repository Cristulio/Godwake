      <stop offset="45%" stop-color="#f4a742" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c2c-window-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8a04a" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#e8a04a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c2c-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f4a742" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
