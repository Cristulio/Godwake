<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch2-combat — Stormhaven, the City of Coin: a timber-and-plaster street
       at night. Key light: the hanging street lantern upper-LEFT; one lit
       window answers it; the right side falls to cool blue night around an
       alley mouth. Quiet mid band y38-63 (lower facades, plain plaster);
       cobbled floor band y66-84 with the gutter line (parallax seam y66).
       Ramps — plaster: #221e18 #2a2620 #322c22 #3a342a; timber: #120c08
       #1a120c #241710; night sky: #0a0c18 #11142a #181c3a; cool wall:
