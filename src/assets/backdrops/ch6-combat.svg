<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch6-combat — Beyond the Godwake, the rim road: the floor is the rim
       of the Loom itself, a tread of iron-bone plates wide enough to be a
       road, and past its edge there is only the turning dark. The far side
       of the wheel hangs as a faint arc in the void; soul-threads come off
       the upper-LEFT in a lit skein (the key) and run out toward the axle,
       beaded with what they carry. One has frayed. Quiet mid band y38-63
       (the void itself); floor seam y66 = the rim's edge-rail. Ramps —
       void: #05060c #0a0c14 #10131e #161a28; rim iron-bone: #12101a
       #1a1826 #242234 #2e2c42 (+#3a3852 edge); soul-thread: #1e3a44
       #2e5a68 #46818f #6ab4c4 (+#9adee8 core). -->
  <defs>
    <radialGradient id="c6c-knot-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6ab4c4" stop-opacity="0.26" />
      <stop offset="45%" stop-color="#2e5a68" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#2e5a68" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c6c-bead-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#46818f" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#2e5a68" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c6c-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#46818f" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#2e5a68" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ══ FAR: the void, and the far side of the wheel ══ -->
  <rect x="0" y="0" width="160" height="66" fill="#0a0c14" />
  <rect x="0" y="0" width="160" height="8" fill="#05060c" />
  <rect x="96" y="0" width="64" height="66" fill="#08090f" />
  <!-- the far arc of the wheel, rising right to left -->
  <rect x="0" y="14" width="22" height="4" fill="#161a28" />
  <rect x="22" y="16" width="24" height="4" fill="#161a28" />
  <rect x="46" y="18" width="26" height="4" fill="#141828" />
  <rect x="72" y="20" width="28" height="4" fill="#121624" />
  <rect x="100" y="22" width="30" height="4" fill="#101320" />
  <rect x="130" y="24" width="30" height="4" fill="#0e111c" />
  <rect x="0" y="14" width="22" height="1" fill="#1c2132" />
  <rect x="22" y="16" width="24" height="1" fill="#1a1f2e" />
  <rect x="46" y="18" width="26" height="1" fill="#181c2c" />
  <rect x="72" y="20" width="28" height="1" fill="#151a28" />
  <!-- far spokes dropping off the arc into the deep -->
  <rect x="34" y="20" width="2" height="14" fill="#10131e" />
  <rect x="35" y="34" width="1" height="8" fill="#0d101a" />
  <rect x="78" y="24" width="2" height="12" fill="#0e111c" />
  <rect x="79" y="36" width="1" height="6" fill="#0c0e18" />
  <rect x="118" y="26" width="2" height="12" fill="#0d101a" />
  <rect x="119" y="38" width="1" height="5" fill="#0b0d16" />
  <!-- teeth of the far rim, barely caught -->
  <rect x="10" y="18" width="2" height="2" fill="#1a1f2e" />
  <rect x="56" y="22" width="2" height="2" fill="#161a28" />
  <rect x="92" y="24" width="2" height="2" fill="#141828" />

  <!-- ══ The soul-thread skein (key, upper-LEFT) ══ -->
  <!-- the knot where they cross -->
  <rect x="14" y="6" width="5" height="4" fill="#2e5a68" />
  <rect x="15" y="7" width="3" height="2" fill="#46818f" />
  <rect x="16" y="7" width="2" height="1" fill="#6ab4c4" />
  <rect x="17" y="8" width="1" height="1" fill="#9adee8" />
  <rect x="-14" y="-16" width="76" height="60" fill="url(#c6c-knot-glow)" />
  <!-- thread 1: runs high and far, beaded -->
  <rect x="19" y="7" width="14" height="1" fill="#2e5a68" />
  <rect x="33" y="8" width="16" height="1" fill="#1e3a44" />
  <rect x="49" y="9" width="18" height="1" fill="#1e3a44" />
  <rect x="67" y="10" width="20" height="1" fill="#16303a" />
  <rect x="87" y="11" width="22" height="1" fill="#122832" />
  <rect x="109" y="12" width="24" height="1" fill="#0f2028" />
  <rect x="133" y="13" width="27" height="1" fill="#0c1a20" />
  <rect x="40" y="8" width="1" height="1" fill="#6ab4c4" />
  <rect x="74" y="10" width="1" height="1" fill="#46818f" />
  <rect x="120" y="12" width="1" height="1" fill="#2e5a68" />
  <!-- thread 2: sags beneath it -->
  <rect x="18" y="9" width="10" height="1" fill="#1e3a44" />
  <rect x="28" y="11" width="12" height="1" fill="#1e3a44" />
  <rect x="40" y="13" width="14" height="1" fill="#16303a" />
  <rect x="54" y="15" width="16" height="1" fill="#122832" />
  <rect x="70" y="16" width="18" height="1" fill="#0f2028" />
  <rect x="88" y="17" width="20" height="1" fill="#0c1a20" />
  <rect x="32" y="11" width="1" height="1" fill="#46818f" />
  <rect x="60" y="15" width="1" height="1" fill="#2e5a68" />
  <rect x="56" y="14" width="3" height="3" fill="url(#c6c-bead-glow)" />
  <!-- thread 3: dives toward the rim -->
  <rect x="16" y="10" width="6" height="1" fill="#1e3a44" />
  <rect x="20" y="12" width="6" height="1" fill="#16303a" />
  <rect x="24" y="14" width="5" height="1" fill="#16303a" />
  <rect x="27" y="16" width="5" height="1" fill="#122832" />
  <rect x="30" y="18" width="4" height="1" fill="#122832" />
  <rect x="33" y="20" width="3" height="1" fill="#0f2028" />
  <rect x="25" y="14" width="1" height="1" fill="#46818f" />
  <!-- the frayed one: snapped short, fibres adrift -->
  <rect x="19" y="5" width="8" height="1" fill="#2e5a68" />
  <rect x="27" y="4" width="5" height="1" fill="#1e3a44" />
  <rect x="32" y="4" width="2" height="1" fill="#46818f" />
  <rect x="36" y="6" width="2" height="1" fill="#16303a" opacity="0.8" />
  <rect x="40" y="9" width="1" height="1" fill="#122832" opacity="0.7" />
  <rect x="38" y="13" width="1" height="1" fill="#0f2028" opacity="0.6" />
  <rect x="42" y="17" width="1" height="1" fill="#0f2028" opacity="0.5" />
  <rect x="39" y="22" width="1" height="1" fill="#0c1a20" opacity="0.5" />

  <!-- ══ MID BAND (y38-63): the long fall — two close voids ══ -->
  <rect x="0" y="38" width="96" height="28" fill="#090b12" />
  <rect x="96" y="38" width="64" height="28" fill="#07080e" />
  <rect x="0" y="50" width="96" height="1" fill="#0a0d15" />
  <rect x="96" y="50" width="64" height="1" fill="#080a10" />
  <!-- the deepest hint of something turning far below -->
  <rect x="30" y="56" width="18" height="1" fill="#0c0e18" />
  <rect x="92" y="59" width="16" height="1" fill="#0a0c14" />

  <!-- ══ NEAR FLOOR (y66-84): the rim's tread ══ -->
  <!-- edge-rail at the seam: the lip you do not step past -->
  <rect x="0" y="66" width="160" height="2" fill="#2e2c42" />
  <rect x="0" y="66" width="160" height="1" fill="#3a3852" />
  <rect x="0" y="68" width="160" height="1" fill="#0d0b14" />
  <rect x="0" y="69" width="160" height="15" fill="#12101a" />
  <!-- rail bolt-heads, fading right -->
  <rect x="6" y="66" width="1" height="1" fill="#4a4866" />
  <rect x="22" y="66" width="1" height="1" fill="#4a4866" />
  <rect x="38" y="66" width="1" height="1" fill="#3a3852" />
  <rect x="54" y="66" width="1" height="1" fill="#3a3852" />
  <rect x="70" y="66" width="1" height="1" fill="#34324a" />
  <rect x="86" y="66" width="1" height="1" fill="#34324a" />
  <rect x="102" y="66" width="1" height="1" fill="#2e2c42" />
  <rect x="118" y="66" width="1" height="1" fill="#2e2c42" />
  <rect x="134" y="66" width="1" height="1" fill="#282640" />
  <rect x="150" y="66" width="1" height="1" fill="#282640" />
  <!-- tread plates, course by course -->
  <rect x="1" y="69" width="18" height="5" fill="#242234" />
  <rect x="20" y="69" width="16" height="5" fill="#2e2c42" />
  <rect x="37" y="69" width="17" height="5" fill="#242234" />
  <rect x="55" y="69" width="16" height="5" fill="#1f1d2e" />
  <rect x="72" y="69" width="17" height="5" fill="#1a1826" />
  <rect x="90" y="69" width="16" height="5" fill="#171522" />
  <rect x="107" y="69" width="17" height="5" fill="#14121e" />
  <rect x="125" y="69" width="16" height="5" fill="#12101a" />
  <rect x="142" y="69" width="17" height="5" fill="#100e18" />
  <rect x="20" y="69" width="16" height="1" fill="#3a3852" />
  <rect x="1" y="69" width="18" height="1" fill="#34324a" />
  <rect x="37" y="69" width="17" height="1" fill="#2e2c42" />
  <rect x="0" y="75" width="16" height="4" fill="#2e2c42" />
  <rect x="17" y="75" width="18" height="4" fill="#242234" />
  <rect x="36" y="75" width="16" height="4" fill="#28263a" />
  <rect x="53" y="75" width="18" height="4" fill="#1f1d2e" />
  <rect x="72" y="75" width="16" height="4" fill="#1a1826" />
  <rect x="89" y="75" width="18" height="4" fill="#161420" />
  <rect x="108" y="75" width="16" height="4" fill="#14121e" />
  <rect x="125" y="75" width="18" height="4" fill="#110f1a" />
  <rect x="144" y="75" width="15" height="4" fill="#0f0d16" />
  <rect x="0" y="75" width="16" height="1" fill="#3a3852" />
  <rect x="17" y="75" width="18" height="1" fill="#34324a" />
  <rect x="0" y="80" width="19" height="4" fill="#242234" />
  <rect x="20" y="80" width="17" height="4" fill="#2e2c42" />
  <rect x="38" y="80" width="18" height="4" fill="#242234" />
  <rect x="57" y="80" width="17" height="4" fill="#1f1d2e" />
  <rect x="75" y="80" width="18" height="4" fill="#1a1826" />
  <rect x="94" y="80" width="17" height="4" fill="#161420" />
  <rect x="112" y="80" width="18" height="4" fill="#13111c" />
  <rect x="131" y="80" width="28" height="4" fill="#100e18" />
  <rect x="20" y="80" width="17" height="1" fill="#3a3852" />
  <rect x="0" y="80" width="19" height="1" fill="#34324a" />
  <!-- plate rivets -->
  <rect x="28" y="71" width="1" height="1" fill="#3a3852" />
  <rect x="46" y="77" width="1" height="1" fill="#34324a" />
  <rect x="64" y="71" width="1" height="1" fill="#2e2c42" />
  <rect x="82" y="82" width="1" height="1" fill="#242234" />
  <rect x="100" y="77" width="1" height="1" fill="#242234" />
  <rect x="12" y="82" width="1" height="1" fill="#3a3852" />
  <!-- the worn-smooth path where the line of penitents walks -->
  <rect x="40" y="72" width="26" height="2" fill="#201e30" />
  <rect x="66" y="73" width="24" height="2" fill="#1c1a2a" />
  <rect x="90" y="74" width="22" height="1" fill="#181624" />
  <!-- thread-fluff drifted against the rail -->
  <rect x="32" y="65" width="3" height="1" fill="#1e3a44" />
  <rect x="34" y="64" width="2" height="1" fill="#16303a" />
  <rect x="74" y="65" width="3" height="1" fill="#16303a" />
  <rect x="112" y="65" width="2" height="1" fill="#122832" />
  <!-- a penitent's dropped hand-wrapping, still knotted -->
  <rect x="34" y="78" width="5" height="1" fill="#2a2838" />
  <rect x="38" y="77" width="2" height="1" fill="#34324a" />
  <rect x="33" y="79" width="2" height="1" fill="#242234" />
  <!-- the thread-light lying on the tread, left -->
  <rect x="-10" y="58" width="66" height="26" fill="url(#c6c-floor-pool)" />
</svg>
