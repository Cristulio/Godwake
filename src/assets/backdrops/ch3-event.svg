<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch3-event — Glassreach, the reading room: the calm corner of the
       asylum (events + rest). Tall shelves of confiscated grimoires, a
       lectern with one book left open, papers nobody will refile. Key
       light: pale moonlight through the high barred window upper-LEFT,
       falling as dithered rays; the lectern candle answers in warm.
       Event banners crop to roughly y28-54 — the rays, candle and open
       book all cross that band. Floor seam y66. Cool ramps: plaster
       #131614 #181c19 #1e2420; shelf wood #120d08 #1a140c #241710
       #2a1c12; moonlight #2a3a42 #3d5560 #5a7d8a; paper #262622 #2e2e28
       #3a382c; candle #a33d1e #e8743a #ffb347 #ffe9a8. -->
  <defs>
    <radialGradient id="c3v-moon-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8aacbe" stop-opacity="0.20" />
      <stop offset="50%" stop-color="#6a8a9a" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#6a8a9a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c3v-candle-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="c3v-ray" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#8aacbe" stop-opacity="0.28" />
      <stop offset="70%" stop-color="#7a9aac" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#7a9aac" stop-opacity="0" />
