<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch12-boss — At the Heart of the Fire: the breach in Karthen's inner
       keep, Hargan-Vor's ground. Set piece centred in the hero-enemy gap:
       twin gate towers x56-64 / x96-104 flanking the shattered keep gate,
       its splintered leaves hanging inward and the furnace of the taken
       keep glowing through. Flames crown the LEFT tower (key light biased
       upper-left; the component lays the blood-red boss ambience above).
       Outer flanks: a burning timber stack x20-30, a keep buttress
       x130-138 — verticals crossing the mid band as quiet darks. Molten
       slag seeps from the threshold. Quiet mid band y38-63; seam y66.
       Ramps — keep stone: #15161c #1a1c24 #232830 #2c3340 (+#3a4452);
       furnace: #3f100c #a33d1e #e8743a #ffb347 (+#ffe9a8 core); char:
       #0a0705 #16100a; slag: #5a1812. No baked-in vignette/grain. -->
  <defs>
    <radialGradient id="c12b-crown-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.26" />
      <stop offset="45%" stop-color="#e8743a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c12b-furnace-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#a33d1e" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#a33d1e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c12b-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
  </defs>

