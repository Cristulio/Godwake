  <!-- ch7-elite — The Drowned Archive, the reading-room: same biome, heavier
       dressing. A railed gallery above, a shelving-tier toppled in the
       drowning, a long reading table with two chained folios, an archive
       cage on the cold side. Key light: a lamp hung off the gallery rail
       (x~24,y~14). Second, dimmer glow: phosphorescent ink spilled across
       the right floor. Quiet mid band y38-63; floor seam y66.
       Shares the ch7 ramps (see ch7-combat.svg header); ink-glow
       #16343a #1f4a52 #2a6a76. -->
  <defs>
