      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#f4a742" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c7e-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f4a742" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
