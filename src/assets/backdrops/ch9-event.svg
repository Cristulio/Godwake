<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch9-event — The Cold Green-Room: the calm corner of the Court of
       Masks. The bare stone the palace never painted: a service door, a
       row of costume hooks, a long mirror leaning out the way it was left,
       the bench worn smooth by a hundred years of nerves, a brazier down
       to its last coal — and the back of the great arras, the one place
       the masquerade never looked. Key light: a candle stub on a crate,
       LEFT of centre. Event banners crop to roughly y28-54. Floor seam
       y66 (bare boards, not checks — this is backstage).
       Shares the ch9 ramps (see ch9-combat.svg header); bare stone:
       #1c1a1e #242228 #2a2830; boards: #1a1310 #1f160e #241a14. -->
  <defs>
    <radialGradient id="c9v-candle-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.26" />
      <stop offset="45%" stop-color="#f4a742" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c9v-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f4a742" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
    </radialGradient>
  </defs>

