<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch4-event — Zhal Vasha, the moon-shrine grotto: the calm corner of
       the Deepdark (events + rest). A heresy kept quiet — a cleft in the
       high rock lets down a pale silver light onto a still pool; dancers
       worn almost smooth circle the far wall; someone has left a candle
       burning on the shrine ledge and coins in the water. Key light: the
       cleft, upper-LEFT, falling as dithered rays; the candle answers in
       warm. Event banners crop to roughly y28-54 — rays, relief, candle
       and pool-edge all cross that band. Floor seam y66. Grotto ramps:
       rock #0d0b12 #14111a #1b1724 #241f30; moonlight #2a3a42 #3d5560
       #5a7d8a (+#8aacbe); water #0c1418 #16242c #2a4a52 (+#4a7a86);
       fungi #0c1c20 #14303a #1f4a56; candle #a33d1e #ffb347 #ffe9a8. -->
  <defs>
    <radialGradient id="c4v-moon-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8aacbe" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#6a8a9a" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#6a8a9a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c4v-candle-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="c4v-ray" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#8aacbe" stop-opacity="0.30" />
      <stop offset="70%" stop-color="#7a9aac" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#7a9aac" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- ══ FAR: grotto rock, rough-shelved ══ -->
  <rect x="0" y="0" width="160" height="66" fill="#0c0a11" />
  <rect x="0" y="0" width="160" height="3" fill="#06050a" />
  <!-- irregular rock masses, low contrast -->
  <rect x="0" y="3" width="14" height="20" fill="#14111a" />
