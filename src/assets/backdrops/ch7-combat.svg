<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch7-combat — The Drowned Archive: a stacks corridor the flood has only
       half let go. Tall shelf-cases either side, a black archway where the
       stacks run on into deeper water, loose leaves adrift in the air.
       Key light: a salvager's shuttered lamp hung on the left case (x~24,y~12)
       — amber against a cold drowned-green dark. High-water stain at y7.
       Quiet mid band y38-63 (case bases, near-black arch); floor seam y66.
       Ramps — drowned stone: #0c1014 #121a1e #182428 #1f2e32 (+#283a3e lit);
       waterlogged wood: #120d0a #1a1310 #241a14 #2e2218 (+#3a2c1e lit);
       spines: #2a1410 #14202a #1a2418 #3a3830; water: #05080a #0a1014
       glints #1d3a42 #2a525c; lamp: #a33d1e #e8743a #ffb347 #ffe9a8;
       phosphor ink: #16343a #1f4a52. -->
  <defs>
    <radialGradient id="c7c-lamp-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#f4a742" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c7c-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f4a742" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
