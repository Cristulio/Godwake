<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch13-combat — The Enclave Gallery: Szendra's halls, carved violet rock
       and a century of petrified kin posed mid-ambush in their niches. Key
       light: a drow cold-lamp on its sconce upper-LEFT (x~20, y~10), pale
       violet; the right side dies into deep stone dark. Statues stand in
       the arch niches y10-36 (far band) — grey-lilac, blades half-raised,
       never finished. Spider-sigil frieze along the top course. Quiet mid
       band y38-63 (fluted panels, two low-contrast values); polished floor
       y66-84 with inlay lines; seam y66.
       Ramps — drow stone: #110d18 #181222 #221a30 #2c2240 (+#3a2e52 edge);
       petrified kin: #2e2a38 #3a3444 #4a4456 (+#5a5468); cold-lamp:
       #4a4a7a #8a7aae #b8a8d8; depth dark: #0b0810 #0e0a14.
       No baked-in vignette/grain. -->
  <defs>
    <radialGradient id="c13c-lamp-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#b8a8d8" stop-opacity="0.20" />
      <stop offset="45%" stop-color="#8a7aae" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#8a7aae" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c13c-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8a7aae" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#8a7aae" stop-opacity="0" />
    </radialGradient>
  </defs>

