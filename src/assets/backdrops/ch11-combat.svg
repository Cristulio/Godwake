<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch11-combat — The Burning Causeway: a basalt shelf across Velnaris's
       pocket of Hell. Key light: a burning fissure in the left cliff
       (x~22,y~10) venting flame, matching the gameplay glow. The pit wall
       climbs in scorched strata; a bone-dry arch right-of-centre leads
       deeper, its legs crossing the mid band as quiet darks. Depth bands:
       far cliff y0-38 (fire-cracks, chains), mid y38-63 QUIET, floor y66-84
       (cracked basalt, ember veins). Wall/floor seam at y66.
       Ramps — basalt warm: #160b08 #221110 #2e1812 #3c2218 (+#4e2e1e edge);
       basalt cool: #120c14 #181020 #1f1628; ember: #5a1812 #a33d1e #e8743a
       #ffb347 (+#ffe9a8 core); ash: #241c20 #322830.
       No baked-in vignette/grain: the Battlefield overlays add those. -->
  <defs>
    <radialGradient id="c11c-fissure-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.26" />
      <stop offset="45%" stop-color="#e8743a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c11c-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
