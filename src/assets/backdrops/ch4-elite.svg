    <radialGradient id="c4e-sac-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2e6e80" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#2e6e80" stop-opacity="0" />
