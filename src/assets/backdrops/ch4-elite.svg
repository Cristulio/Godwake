  <!-- ch4-elite — Zhal Vasha, the web gallery: a house yard given over to
       the spiders. Same biome as ch4-combat, heavier dressing — the great
       orb-web wheeled between two carved columns, a body cocooned and hung,
       egg sacs banked at the column foot with their own faint cold sheen,
       the house's spider-sigil banner. Key light: faerzress lantern
       upper-LEFT on the column bracket. Quiet mid band y38-63 (flat cavern
       wall, column shafts as quiet darks); floor seam y66. Shares the ch4
       ramps (see ch4-combat.svg header). -->
