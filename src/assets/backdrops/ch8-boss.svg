<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch8-boss — Where the Line Still Holds: the centre of the old line.
       The Marshal's great burnt standard planted on its mound between the
       combatants, the dead of both sides massed into one column either
       side, smoke folding down. Twin pike-stand watch-fires flank the
       field — the LEFT one burns brighter (the key); the component lays
       the boss blood-red ambience above. Quiet mid band y38-63 outside
       the centre set piece; floor seam y66.
       Shares the ch8 ramps (see ch8-combat.svg header); drum walnut:
       #2a1a10 #38241a; brass: #54400f #6a521e #8a6c2a. -->
  <defs>
    <radialGradient id="c8b-brazier-l" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.30" />
      <stop offset="45%" stop-color="#e8743a" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c8b-brazier-r" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c8b-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
  </defs>

