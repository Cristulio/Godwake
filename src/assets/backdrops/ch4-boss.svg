  <!-- ch4-boss — The temple of Arachne: Zhal Vasha's set piece. The
       eight-legged sigil burns arterial red on the basalt above the
       Matron's altar; silk-wrapped columns flank the dais, their braziers
       carrying the violet temple-flame — the LEFT one tall (the key,
       upper-left bias), the right banked low. Silk swags hang from the
       dark. The component lays the boss blood-red ambience above this.
       Quiet mid band y38-63 outside the central altar; floor seam y66;
       the red-black runner leads in. Shares ch4 ramps (ch4-combat.svg)
       + sigil red: #3f100c #5a1812 #7a2018 (+#a02a20 core). -->
