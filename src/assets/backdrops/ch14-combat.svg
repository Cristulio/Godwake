<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch14-combat — The Long Approach: the dead god's hall, walked at last.
       Black marble chased with brass, and the murder of a god hung in
       basins along the colonnade — rendered essence, red-black, barely lit.
       Key light: the first hanging basin upper-LEFT (x~28, y~14), its
       red-gold glow the only warmth; a far doorway at the hall's end is
       rimmed with the deeper red of the Throne beyond. Columns cross the
       mid band as quiet darks. The harvest-channel runs the floor toward
       the unseen seat, a thread of red in the gold. Quiet mid band
       y38-63; seam y66.
       Ramps — void marble: #0c0a10 #131019 #1b1622 #251e2e (+#332a40
       polish); essence: #2a0b08 #3f100c #5a1812 #8a2418 (+#c43a28 gleam);
       brass: #54400f #6a521e #8a6c2a (+#a8862e); bone: #6a5e4c.
       No baked-in vignette/grain. -->
  <defs>
    <radialGradient id="c14c-basin-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c43a28" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#8a2418" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#8a2418" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c14c-door-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8a2418" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#5a1812" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c14c-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c43a28" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#c43a28" stop-opacity="0" />
    </radialGradient>
  </defs>

