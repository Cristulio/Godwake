<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch10-boss — The Temple of Rillifane, Defiled: the great house of the
       tree-father made a wyrm's den. Living-wood columns under a woven-
       bough roof, the altar of living oak smashed in two — claw-gouged,
       scorched, its raw split the palest thing in the room — coin and
       chalice scattered where a hoard has been dragged about, and the
       swamp-reek of the green wyrm hanging low. Key light: the burning
       canopy through the torn roof, upper-LEFT, falling as an amber shaft
       on the broken altar. The component lays the boss blood-red ambience
       above. Quiet mid band y38-63 outside the set piece; floor seam y66.
       Shares the ch10 ramps (see ch10-combat.svg header); oak: #241a14
       #2e2218 #3a2c1e, raw split: #4a3a22 #5a4630; gold: #54400f #6a521e
       #8a6c2a (+#a8862e glints); miasma: #16343a #1a2c1e. -->
  <defs>
    <radialGradient id="c10b-burn-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#a33d1e" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#a33d1e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="c10b-shaft" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#a33d1e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#a33d1e" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="c10b-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
  </defs>

