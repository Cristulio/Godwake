  <!-- ch9-boss — The Throne That Wears No Face: the hall ends at an empty
       throne on its dais, under a great arched mirror that reflects the
       room a half-step wrong and the throne not at all. Faded velvet
       flanks the glass; a porcelain mask waits on the seat. Twin column
       candle-stands — the LEFT burns brighter (the key); the component
       lays the boss blood-red ambience above. Quiet mid band y38-63
       outside the centre set piece; floor seam y66.
       Shares the ch9 ramps (see ch9-combat.svg header); throne walnut:
       #1f130d #2a1a10 #38241a; runner: #2a0b08 #3f100c. -->
  <defs>
