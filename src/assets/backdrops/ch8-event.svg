<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch8-event — The Lee of an Overturned Wagon: the calm corner of the
       Ashfall March. A foundry-wagon went over here and makes a windbreak
       the ashfall streams around instead of through; in the hollow behind
       it, a small tended fire, a kettle, a bedroll. The march has to go
       around. Key light: the camp-fire, LEFT of centre; the burning line
       is far off and dim. Event banners crop to roughly y28-54: the wagon
       mass, its raised wheel and the fire's smoke all cross that band.
       Floor seam y66. Shares the ch8 ramps (see ch8-combat.svg header). -->
  <defs>
    <radialGradient id="c8v-fire-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.26" />
      <stop offset="45%" stop-color="#e8743a" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c8v-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ══ FAR: a quieter stretch of the same smoke ══ -->
