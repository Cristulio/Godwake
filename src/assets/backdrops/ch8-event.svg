  <rect x="6" y="23" width="4" height="1" fill="#5a1812" />
  <rect x="0" y="24" width="160" height="4" fill="#0e0c08" />
  <rect x="38" y="23" width="22" height="1" fill="#0d0b07" />
  <rect x="0" y="28" width="160" height="1" fill="#16110b" />
  <!-- a dead snag on the cold horizon -->
  <rect x="146" y="13" width="2" height="12" fill="#0c0a07" />
