<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch14-boss — The Throne of the Slain God: the game's final arena.
       Set piece centred in the hero-enemy gap: the empty seat itself on a
       stepped dais (x56-104), its monolith back climbing the whole far
       field, gold-chased, and the seat beginning — faintly — to fill: a
       pale shimmer traced inside the dark where the new god gathers. The
       last of the essence steams in two pools flanking the dais foot;
       brass harvest-channels carry the red up the steps. Colossal columns
       x22-30 / x130-138 bear censers burning blood-red (flames above
       y28), chains rising into the void. One pale god-spark hangs above
       the crown. Key light: the LEFT censer + pool, halo biased
       upper-left (the component lays the blood-red boss ambience above).
       The throne back and dais cross the mid band as quiet darks; pools
       live in the floor band; seam y66.
       Ramps — void marble: #0c0a10 #131019 #1b1622 #251e2e (+#332a40);
       essence: #2a0b08 #3f100c #5a1812 #8a2418 (+#c43a28 #e85a3a gleam);
       brass: #54400f #6a521e #8a6c2a (+#a8862e); shimmer: #3a3e4e
       #4a5468 #6a7488 (tiny); censer-flame: #a33d1e #e8743a #ffb347.
       No baked-in vignette/grain. -->
  <defs>
    <radialGradient id="c14b-censer-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.20" />
      <stop offset="45%" stop-color="#a33d1e" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#a33d1e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c14b-pool-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c43a28" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#8a2418" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#8a2418" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c14b-seat-shimmer" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6a7488" stop-opacity="0.13" />
      <stop offset="60%" stop-color="#4a5468" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#4a5468" stop-opacity="0" />
    </radialGradient>
  </defs>

