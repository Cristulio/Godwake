<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch11-boss — The Heart-Vault: the chamber at the bottom of the pit where
       the Voice has a face. Set piece centred in the hero-enemy gap: a black
       dais bearing the stolen power of the Tree of Life — a charred
       root-pillar lit from within by gold-red seams, its roots gripping the
       steps. Flanking basalt columns carry chained sconces (flames above
       y28); their shafts cross the mid band as quiet darks. Key light:
       upper-LEFT sconce + the pillar's high seams (the component lays the
       blood-red boss ambience above). Vault ribs converge overhead. Quiet
       mid band y38-63; floor seam y66.
       Ramps — basalt warm: #160b08 #221110 #2e1812 #3c2218 (+#4e2e1e);
       basalt cool: #120c14 #181020 #1f1628; charred root: #0e0807 #1a100a
       #251710; power seams: #5a1812 #a33d1e #e8743a #ffb347 (+#ffe9a8);
       brass: #54400f #6a521e. No baked-in vignette/grain. -->
  <defs>
    <radialGradient id="c11b-sconce-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.24" />
      <stop offset="45%" stop-color="#a33d1e" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#a33d1e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c11b-heart-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.20" />
      <stop offset="50%" stop-color="#a33d1e" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#a33d1e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c11b-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
  </defs>

