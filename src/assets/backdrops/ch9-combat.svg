<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch9-combat — The Court of Masks: the masquerade hall. Tall mirrors in
       gilt frames between marble pilasters, a dead chandelier, a rotted
       curtain swag, the cracked dance-floor checkered underfoot — and the
       music a hundred years stopped. Key light: a bronze candelabra on the
       LEFT wall, three small flames; one cold glint answers from the
       cracked mirror. Quiet mid band y38-63 (wainscot, two values);
       floor seam y66.
       Ramps — marble: #1e1e26 #26262c #2c2c34 #34343f #3a3a44; gilt:
       #54400f #6a521e #8a6c2a; mirror glass: #101218 #15161c #1d242c,
       glint #3a5c6a; velvet: #1a1030 #2a1844 #3a2356; mask porcelain:
       #3a3a36 #4a4a44 #5a5a52; candle: #a33d1e #e8743a #ffb347 #ffe9a8;
       checker: #2c2c34 / #16161c. -->
