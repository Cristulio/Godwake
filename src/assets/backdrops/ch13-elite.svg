<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch13-elite — The Storm Road: the deep approach to Korvazel's lair,
       cobalt rock charged end to end with the half-dragon's storm. Key
       light: a crystal cluster upper-LEFT with a live arc playing across
       it (blue-white, tiny cores). Fulgurite lightning-trees — his old
       breath fused into the wall — branch up the right. The brood is near:
       a clutch of eggs in a scorched hollow low-RIGHT, one cracked and
       faintly glowing (the elite's second glow). Claw-gouges score the
       stone. Quiet mid band y38-63; fused-glass floor y66-84; seam y66.
       Ramps — storm rock: #0a1020 #122040 #16284a #1c3260 (+#2a4a8a edge);
       deep dark: #060a16 #080d1c; lightning: #2a4a8a #6a8aff #aac4ff
       (+#eef4ff core); fulgurite glass: #1c2a30 #2a4248 #3a5e66; egg:
       #1c2433 #28344a (+crack glow #4a6aae). No baked-in vignette. -->
  <defs>
    <radialGradient id="c13e-arc-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#aac4ff" stop-opacity="0.20" />
      <stop offset="45%" stop-color="#6a8aff" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#6a8aff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c13e-egg-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6a8aff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#4a6aae" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c13e-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6a8aff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#6a8aff" stop-opacity="0" />
    </radialGradient>
  </defs>

