<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch3-boss — The Director's theatre: Glassreach's set piece. The great
       round warded window — leaded glass, the asylum's warding circle lit
       cold from whatever burns behind it — over the Director's dais and
       high-backed chair, his long-hafted glaive racked beside it. Flanking
       specimen cabinets carry the candles: LEFT one burns tall (the key,
       upper-left bias), the right is guttering. The component lays the boss
       blood-red ambience above. Quiet mid band y38-63 outside the centre
       set piece (chair/dais sit in the hero-enemy gap); floor seam y66.
       Shares ch3 ramps (ch3-combat.svg) + silver trim: #6e7e8a #9eb4c0;
       runner teal: #102830 #14323a. -->
  <defs>
    <radialGradient id="c3b-candle-l" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.30" />
      <stop offset="45%" stop-color="#f4a742" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c3b-candle-r" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
