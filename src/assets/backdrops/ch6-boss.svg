<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch6-boss — The still centre: the Loom's set piece. The axle of the
       wheel comes down through the dark like a tower, and at its heart is
       the still point — the one pale unmoving place, the eye every thread
       runs back to. Two outer spokes flank the arena as quiet towers; the
       worn circle on the tread marks where everything before you stood.
       Key bias upper-LEFT: the radiant threads knot toward the axle's
       left shoulder. The component lays the boss blood-red ambience above.
       Quiet mid band y38-63 outside the axle; floor seam y66 (the rail).
       Shares the ch6 ramps (ch6-combat.svg header). -->
  <defs>
    <radialGradient id="c6b-still-glow" cx="0.45" cy="0.42" r="0.58">
      <stop offset="0%" stop-color="#9adee8" stop-opacity="0.30" />
      <stop offset="45%" stop-color="#46818f" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#2e5a68" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c6b-knot-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6ab4c4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#2e5a68" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c6b-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#46818f" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#2e5a68" stop-opacity="0" />
