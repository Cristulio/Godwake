<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch13-boss — The Vault That Breathes: Korvazel's chamber at the bottom
       of the dark. Set piece centred in the hero-enemy gap: the great
       fulgurite pillar — black glass raised where his breath has struck
       the same spot for a century — rising off a fused mound, lightning
       still crawling its upper reaches (bright arcs above y28 only).
       Flanking ribbed rock columns x24-31 / x129-136 cross the mid band
       as quiet darks. His hoard licks the mound's foot: brass gleams in
       the floor band. Key light: the pillar's high arcs, halo biased
       upper-LEFT (component lays blood-red boss ambience above). Quiet
       mid band y38-63; seam y66.
       Ramps — storm rock: #0a1020 #122040 #16284a #1c3260 (+#2a4a8a);
       deep dark: #060a16 #080d1c; fulgurite: #141c22 #1c2a30 #2a4248
       #3a5e66; lightning: #4a6aae #6a8aff #aac4ff (+#eef4ff); hoard
       brass: #54400f #6a521e #8a6c2a. No baked-in vignette/grain. -->
  <defs>
    <radialGradient id="c13b-pillar-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#aac4ff" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#6a8aff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#6a8aff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c13b-key-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#aac4ff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#6a8aff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c13b-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6a8aff" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#6a8aff" stop-opacity="0" />
    </radialGradient>
  </defs>

