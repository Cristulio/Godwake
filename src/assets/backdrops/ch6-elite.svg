    <radialGradient id="c6e-spindle-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#46818f" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2e5a68" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c6e-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#46818f" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#2e5a68" stop-opacity="0" />
