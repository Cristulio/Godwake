<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch6-elite — Beyond the Godwake, the spoke-gate: where a spoke of the
       Loom comes down to meet the rim, and the wheel's keepers wind what
       they catch. Same biome as ch6-combat, heavier dressing — the great
       spoke plunging in from upper-LEFT with its bound thread-windings
       (the key glows at its collar), two half-wound souls hung up to set,
       cable-rings, a winding-drum. Quiet mid band y38-63; floor seam y66
       (the rim rail). Shares the ch6 ramps (see ch6-combat.svg header). -->
  <defs>
    <radialGradient id="c6e-collar-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6ab4c4" stop-opacity="0.26" />
      <stop offset="45%" stop-color="#2e5a68" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#2e5a68" stop-opacity="0" />
