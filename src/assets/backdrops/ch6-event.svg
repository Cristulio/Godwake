  <rect x="55" y="66" width="1" height="1" fill="#3a3852" />
  <rect x="71" y="66" width="1" height="1" fill="#34324a" />
  <rect x="87" y="66" width="1" height="1" fill="#34324a" />
  <rect x="103" y="66" width="1" height="1" fill="#2e2c42" />
  <rect x="119" y="66" width="1" height="1" fill="#2e2c42" />
  <rect x="135" y="66" width="1" height="1" fill="#282640" />
  <rect x="151" y="66" width="1" height="1" fill="#282640" />
  <rect x="1" y="69" width="18" height="5" fill="#242234" />
  <rect x="20" y="69" width="16" height="5" fill="#2e2c42" />
  <rect x="37" y="69" width="17" height="5" fill="#242234" />
