  <rect x="0" y="80" width="19" height="4" fill="#242234" />
  <rect x="20" y="80" width="17" height="4" fill="#2e2c42" />
  <rect x="38" y="80" width="18" height="4" fill="#242234" />
  <rect x="57" y="80" width="17" height="4" fill="#1f1d2e" />
  <rect x="75" y="80" width="18" height="4" fill="#1a1826" />
  <rect x="94" y="80" width="17" height="4" fill="#161420" />
  <rect x="112" y="80" width="18" height="4" fill="#13111c" />
  <rect x="131" y="80" width="28" height="4" fill="#100e18" />
  <rect x="20" y="80" width="17" height="1" fill="#3a3852" />
  <rect x="0" y="80" width="19" height="1" fill="#34324a" />
  <!-- the firelight lying warm on the tread -->
  <rect x="20" y="56" width="58" height="28" fill="url(#c6v-fire-glow)" />
  <!-- a bundle of unburnt scraps, stacked neat out of habit -->
  <rect x="28" y="76" width="6" height="2" fill="#1c1a2a" />
  <rect x="29" y="75" width="4" height="1" fill="#242234" />
  <rect x="30" y="74" width="2" height="1" fill="#1f1d2e" />
  <!-- the path everyone took past this fire, worn into the plates -->
  <rect x="84" y="72" width="24" height="2" fill="#1c1a2a" />
  <rect x="108" y="73" width="22" height="2" fill="#181624" />
  <rect x="130" y="74" width="20" height="1" fill="#151320" />
  <!-- thread-fluff drifted against the sitting-stone -->
  <rect x="34" y="65" width="3" height="1" fill="#16303a" />
  <rect x="98" y="65" width="2" height="1" fill="#122832" />
</svg>
