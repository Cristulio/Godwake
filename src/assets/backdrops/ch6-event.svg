  <rect x="60" y="40" width="8" height="3" fill="#1a1826" />
  <rect x="59" y="43" width="10" height="9" fill="#1f1d2e" />
  <rect x="58" y="46" width="12" height="6" fill="#1f1d2e" />
  <rect x="62" y="38" width="5" height="3" fill="#1a1826" />
  <rect x="63" y="37" width="3" height="2" fill="#171522" />
  <!-- its firelit edge -->
  <rect x="59" y="43" width="1" height="9" fill="#322a2a" />
  <rect x="60" y="41" width="1" height="2" fill="#2e2826" />
  <rect x="62" y="38" width="1" height="3" fill="#2a2422" />
  <!-- the frays coming off its shoulders -->
  <rect x="68" y="39" width="3" height="1" fill="#16303a" />
  <rect x="70" y="41" width="3" height="1" fill="#122832" />
  <rect x="69" y="44" width="2" height="1" fill="#0f2028" />
  <rect x="71" y="38" width="1" height="1" fill="#1e3a44" />
  <!-- its hand, worn nearly smooth, held to the heat -->
  <rect x="56" y="47" width="3" height="2" fill="#2a2624" />
  <rect x="55" y="48" width="2" height="1" fill="#322a2a" />

  <!-- the fire, tended out of habit -->
  <rect x="44" y="52" width="9" height="2" fill="#1a1826" />
  <rect x="45" y="51" width="7" height="1" fill="#242234" />
  <rect x="46" y="48" width="5" height="3" fill="#a33d1e" />
  <rect x="47" y="45" width="3" height="3" fill="#e8743a" />
  <rect x="48" y="43" width="2" height="2" fill="#ffb347" />
  <rect x="48" y="46" width="1" height="3" fill="#ffe9a8" />
  <rect x="50" y="42" width="1" height="1" fill="#e8743a" />
  <!-- charred ends poking out -->
  <rect x="43" y="52" width="3" height="1" fill="#100e18" />
  <rect x="51" y="53" width="3" height="1" fill="#100e18" />
  <!-- embers that drift UP, against no wind -->
  <rect x="52" y="40" width="1" height="1" fill="#e8743a" opacity="0.9" />
  <rect x="55" y="35" width="1" height="1" fill="#a33d1e" opacity="0.8" />
  <rect x="50" y="30" width="1" height="1" fill="#a33d1e" opacity="0.6" />
  <rect x="22" y="22" width="56" height="50" fill="url(#c6v-fire-glow)" />

  <!-- the plate with the scored words, catching the firelight -->
  <rect x="72" y="50" width="16" height="4" fill="#1c1a2a" />
  <rect x="72" y="50" width="16" height="1" fill="#2e2c42" />
  <rect x="74" y="51" width="4" height="1" fill="#4a3e2e" />
  <rect x="80" y="51" width="6" height="1" fill="#4a3e2e" />
  <rect x="75" y="52" width="2" height="1" fill="#3a3226" />
  <rect x="82" y="52" width="3" height="1" fill="#3a3226" />
  <!-- the cup, poured and waiting -->
  <rect x="68" y="51" width="3" height="3" fill="#242234" />
  <rect x="68" y="51" width="3" height="1" fill="#34324a" />
  <rect x="69" y="50" width="1" height="1" fill="#2e2c42" />
  <!-- its faint steam -->
  <rect x="69" y="47" width="1" height="1" fill="#1c2132" opacity="0.8" />
  <rect x="70" y="45" width="1" height="1" fill="#181c2c" opacity="0.6" />

  <!-- the worn smooth sitting-place across the fire -->
  <rect x="36" y="54" width="8" height="3" fill="#1f1d2e" />
  <rect x="36" y="54" width="8" height="1" fill="#2a2838" />
  <rect x="37" y="57" width="6" height="1" fill="#171522" />

  <!-- ══ NEAR FLOOR (y66-84): the rim tread, at rest ══ -->
  <rect x="0" y="66" width="160" height="2" fill="#2e2c42" />
  <rect x="0" y="66" width="160" height="1" fill="#3a3852" />
  <rect x="0" y="68" width="160" height="1" fill="#0d0b14" />
  <rect x="0" y="69" width="160" height="15" fill="#12101a" />
  <rect x="7" y="66" width="1" height="1" fill="#4a4866" />
  <rect x="23" y="66" width="1" height="1" fill="#4a4866" />
