<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch6-event — A stillness before the wheel: the calm corner of the
       Loom (events + rest). The last seam of quiet at the rim — a
       guttering thing that was a pilgrim once tends a small fire out of
       habit, a cup already poured, and near it the two words something
       scored into the plate before going on. One thread passes far
       overhead with its slow beads (the cool key, upper-LEFT); the fire
       is the warm answer. Event banners crop to roughly y28-54 — the
       pilgrim, fire-glow, words and thread all cross that band. Floor
       seam y66 (the rim rail). Shares the ch6 ramps (ch6-combat.svg) +
       fire: #a33d1e #e8743a #ffb347 #ffe9a8. -->
  <defs>
    <radialGradient id="c6v-thread-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6ab4c4" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#2e5a68" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#2e5a68" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c6v-fire-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.26" />
      <stop offset="50%" stop-color="#e8743a" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ══ FAR: the void, gentler here ══ -->
  <rect x="0" y="0" width="160" height="66" fill="#0a0c14" />
  <rect x="0" y="0" width="160" height="8" fill="#05060c" />
  <rect x="100" y="0" width="60" height="66" fill="#08090f" />
  <!-- the far arc, low and at rest -->
  <rect x="0" y="22" width="26" height="3" fill="#141828" />
  <rect x="26" y="24" width="28" height="3" fill="#121624" />
  <rect x="54" y="26" width="30" height="3" fill="#101320" />
  <rect x="84" y="28" width="30" height="3" fill="#0e111c" />
  <rect x="114" y="30" width="30" height="3" fill="#0d101a" />
  <rect x="144" y="32" width="16" height="3" fill="#0c0e18" />
  <rect x="0" y="22" width="26" height="1" fill="#1a1f2e" />
  <rect x="26" y="24" width="28" height="1" fill="#181c2c" />
  <rect x="54" y="26" width="30" height="1" fill="#151a28" />
  <!-- one spoke far off, going up out of sight -->
  <rect x="120" y="0" width="3" height="30" fill="#10131e" />
  <rect x="120" y="0" width="1" height="30" fill="#141828" />
  <rect x="121" y="8" width="1" height="1" fill="#1c2132" />

  <!-- ══ The one passing thread (the cool key, upper-LEFT) ══ -->
  <rect x="0" y="6" width="18" height="1" fill="#2e5a68" />
  <rect x="18" y="7" width="20" height="1" fill="#1e3a44" />
  <rect x="38" y="8" width="22" height="1" fill="#16303a" />
  <rect x="60" y="9" width="24" height="1" fill="#122832" />
  <rect x="84" y="10" width="26" height="1" fill="#0f2028" />
  <rect x="110" y="11" width="28" height="1" fill="#0c1a20" />
  <rect x="138" y="12" width="22" height="1" fill="#0a161c" />
  <!-- its slow beads -->
  <rect x="8" y="6" width="1" height="1" fill="#9adee8" />
  <rect x="9" y="6" width="1" height="1" fill="#6ab4c4" />
  <rect x="46" y="8" width="1" height="1" fill="#46818f" />
  <rect x="92" y="10" width="1" height="1" fill="#2e5a68" />
  <rect x="-16" y="-14" width="72" height="52" fill="url(#c6v-thread-glow)" />
  <!-- a fibre it shed, going down slow -->
  <rect x="24" y="10" width="1" height="1" fill="#16303a" opacity="0.8" />
  <rect x="26" y="14" width="1" height="1" fill="#122832" opacity="0.7" />
  <rect x="25" y="19" width="1" height="1" fill="#0f2028" opacity="0.6" />

  <!-- ══ MID BAND backdrop (y33-63): the quiet dark ══ -->
  <rect x="0" y="33" width="100" height="33" fill="#090b12" />
  <rect x="100" y="33" width="60" height="33" fill="#07080e" />
  <rect x="0" y="48" width="100" height="1" fill="#0a0d15" />
  <rect x="100" y="48" width="60" height="1" fill="#080a10" />

  <!-- ══ The camp: fire, the one who tends it, the cup, the words ══ -->
