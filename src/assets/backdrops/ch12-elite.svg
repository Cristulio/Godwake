<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch12-elite — The Breach: where the giants came through Karthen's wall.
       The city wall fills the far field; its battlement is torn open
       x~58-94 and the fire of the siege camp glows THROUGH the gap. A
       burning hoarding atop the wall upper-LEFT is the key light; the
       breach-rim is the elite's second, dimmer glow. A flung boulder lies
       lodged at the breach foot; a siege ladder's hooks grip the parapet.
       Bands: wall y0-38 structural, mid y38-63 QUIET wall-face, rubble
       floor y66-84; seam y66.
       Ramps — wall stone: #15161c #1a1c24 #232830 #2c3340 (+#3a4452 lit
       warm #34271a #453524 near the fire); flame: #a33d1e #e8743a #ffb347
       #ffe9a8; ember sky: #2a1414; char: #0a0705. No baked-in vignette. -->
  <defs>
    <radialGradient id="c12e-hoarding-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.26" />
      <stop offset="45%" stop-color="#e8743a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c12e-breach-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.20" />
      <stop offset="55%" stop-color="#a33d1e" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#a33d1e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c12e-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
  </defs>

