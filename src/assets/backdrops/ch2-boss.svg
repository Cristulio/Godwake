<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch2-boss — The Magistrate's Hall: Stormhaven's civic set piece. A
       stained-glass arch bearing the city's scales, marble columns, teal
       banners, the magistrate's bench on its dais. Key light: the window
       itself, its glow biased upper-LEFT; two candles answer on the bench.
       The component lays the boss blood-red ambience above. Quiet mid band
       y38-63 (polished marble, column shafts, banner tails); checkered
       floor band y66-84 (parallax seam y66).
       Ramps — marble: #1e1e26 #26262c #2c2c34 #34343f #3a3a44; walnut:
       #1f130d #2a1a10 #38241a; teal banner: #102830 #14323a #1f4a52;
       silver: #6e7e8a #9eb4c0; glass: gold #6a521e #8a6c2a #a8862e, teal
       #14323a #2a6a76, blood #5a1812. -->
