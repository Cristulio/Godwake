      <stop offset="0%" stop-color="#c8a44a" stop-opacity="0.26" />
      <stop offset="50%" stop-color="#8a6c2a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8a6c2a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c2b-candle-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c2b-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c8a44a" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#c8a44a" stop-opacity="0" />
