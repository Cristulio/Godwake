<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch11-elite — The Trial Ground: the floor of the pit where one of the
       five altars poses its question, dressed for a harder fight. Key light:
       a black-iron pole brazier upper-LEFT burning dark red; an ember
       fissure low-right answers it dimly (the elite's second glow). Two
       soul-gibbets hang off the high dark; the five trial-glyphs are cut
       into the cliff course; the altar itself sits LOW in the centre gap,
       dark and quiet. Bands: far cliff y0-38, mid y38-63 QUIET, floor
       y66-84; seam at y66.
       Ramps — basalt warm: #160b08 #221110 #2e1812 #3c2218 (+#4e2e1e);
       basalt cool: #120c14 #181020 #1f1628; ember: #5a1812 #a33d1e #e8743a
       #ffb347; iron: #0c0809 #161013 #211a1c; ash: #241c20 #322830.
       No baked-in vignette/grain: the Battlefield overlays add those. -->
  <defs>
    <radialGradient id="c11e-brazier-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.24" />
      <stop offset="45%" stop-color="#a33d1e" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#a33d1e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c11e-fissure-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a33d1e" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#a33d1e" stop-opacity="0" />
    </radialGradient>
  </defs>

