<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch1-combat — The Iron Cells: a torch-lit cell-block corridor.
       Key light: wall torch upper-LEFT (x~24,y~14), matching the gameplay glow
       and the sprite rim convention. Right side falls into cool teal shadow.
       Depth bands: far wall y0-38 (structural interest), mid y38-63 QUIET
       (sprite torsos/HP bars live here), floor y66-84 (near detail).
       The wall/floor seam sits at y66 = the parallax near-band line (18/84).
       Ramps — stone lit: #140e09 #1d1510 #281d14 #34271a #453524 (+#5a4630 edge);
       stone cool: #101218 #15161c #1a1c24; iron: #0b0907 #16120d #211b13 #2d2519;
       torch: #a33d1e #e8743a #ffb347 #ffe9a8; moss: #1c2914 #2a3d1c #3a5226.
       No baked-in vignette/grain: the Battlefield overlays add those. -->
  <defs>
    <radialGradient id="c1c-torch-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.30" />
      <stop offset="45%" stop-color="#f4a742" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c1c-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f4a742" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ══ FAR: ceiling + back wall ══ -->
