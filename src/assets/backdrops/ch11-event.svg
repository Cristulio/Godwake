<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch11-event — A Still Pocket of the Pit: a dead fold of the burning where
       the flame has guttered to embers and nothing comes. The calm scene of
       the chapter (events + rest). Cool ash-violet rock; ONE warm note: a
       guttered fire-pit breathing its last in the centre. A high crack
       upper-LEFT leaks a faint red of the far burning (the key, dim). A
       previous walker sits where he stopped, at rest. Event banners crop to
       roughly y28-54: the overhang lip, the ember-pit and the seated bones
       all cross that band. Floor seam y66.
       Ramps — ash rock: #100c10 #171118 #1f1820 #282030 (+#332a3e edge);
       warm rock (near the crack): #1a100c #241712; ember: #2a0b08 #5a1812
       #a33d1e #e8743a; ash: #241c20 #322830 #3a3036.
       No baked-in vignette/grain. -->
  <defs>
    <radialGradient id="c11v-crack-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a33d1e" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#5a1812" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#5a1812" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c11v-ember-breath" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#a33d1e" stop-opacity="0" />
    </radialGradient>
  </defs>

