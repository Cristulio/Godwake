<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch2-event — A fountain court off the Coinward, at dusk: the calm
       corner of Stormhaven (events + rest). Violet evening over the roofs,
       a small fountain still talking to itself, ivy, an arcade going dark.
       Key light: the door lamp upper-LEFT; the dusk and one lit tower
       window answer far off. Event banners crop to roughly y28-54: the
       lamp, fountain bowl and arcade all cross that band. Floor seam y66.
       Ramps — dusk sky: #1a1030 #2a1844 #3a2356 #4a2f60 #6a4258; plaster:
       #1c161a #241c20 #2c2228 #382c30; ivy: #162112 #22311a #2e4224;
       water: #141824 #232b40 #3a3f60; lamp: #a33d1e #ffb347 #ffe9a8. -->
  <defs>
    <radialGradient id="c2v-lamp-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.26" />
      <stop offset="45%" stop-color="#f4a742" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c2v-dusk-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6a4258" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#6a4258" stop-opacity="0" />
    </radialGradient>
  </defs>

