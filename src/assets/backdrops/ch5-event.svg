<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch5-event — The reliquary of first mornings: the calm corner of the
       Godwake (events + rest). A side-shrine off the climb — the pale slab
       with the dead god's keepsakes: the phial of the first light (still
       faintly lit), the sword-form drilled into the stone, the litany
       glowing low on the wall in a script older than letters. The kneeling
       has worn the floor to fit a shape you recognise. Key light: a small
       dawn-rent upper-LEFT; the phial answers faint at the slab. Event
       banners crop to roughly y28-54 — the litany, slab top and phial all
       sit in that band. Floor seam y66. Shares ch5 ramps (ch5-combat.svg);
       litany glow #6a3a28 #a05a32 (+#d08848 px). -->
  <defs>
    <radialGradient id="c5v-dawn-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f0b868" stop-opacity="0.24" />
      <stop offset="45%" stop-color="#d08848" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#d08848" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c5v-phial-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd890" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#f0b868" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="c5v-ray" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#f0b868" stop-opacity="0.20" />
      <stop offset="70%" stop-color="#d08848" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#d08848" stop-opacity="0" />
    </linearGradient>
  </defs>

