      <stop offset="45%" stop-color="#f4a742" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c3c-ward-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2a6a56" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#2a6a56" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c3c-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f4a742" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
