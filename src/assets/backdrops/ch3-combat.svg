  <!-- ch3-combat — Glassreach, a ward corridor: the mage-asylum's cell block.
       Institutional plaster over a glazed-tile wainscot, iron-banded ward
       doors, and the biome signature: a warded observation window glowing
       sigil-teal. One cell door hangs ajar. Key light: caged wall-lamp
       upper-LEFT; the right side falls to a sickly green-grey cold.
       Quiet mid band y38-63 (wainscot tile, two values per zone); floor
       seam y66 (wainscot base shadow), tiled floor y66-84 with the drain.
       Ramps — plaster lit: #201c12 #2a2517 #342e1d #3e3724 (+#4c4430 edge);
       plaster cool: #131614 #181c19 #1e2420; wainscot lit: #242218 #2c2a1e;
       wainscot cool: #161a18 #1c2220; iron: #0b0907 #16120d #211b13 #2d2519;
       ward-glass: #0e2620 #1a4438 #2a6a56 (+#3f9a7a core); chalk: #4a4a3e;
       lamp: #a33d1e #e8743a #ffb347 #ffe9a8. -->
  <defs>
