  <rect x="115" y="72" width="14" height="5" fill="#0d0a11" />
  <rect x="130" y="72" width="29" height="5" fill="#0b090e" />
  <rect x="38" y="72" width="14" height="1" fill="#221e2e" />
  <!-- near slab row -->
  <rect x="0" y="78" width="18" height="6" fill="#0e0b13" />
  <rect x="19" y="78" width="17" height="6" fill="#100d15" />
  <rect x="37" y="78" width="18" height="6" fill="#1a1522" />
  <rect x="56" y="78" width="17" height="6" fill="#171320" />
  <rect x="74" y="78" width="18" height="6" fill="#14111b" />
  <rect x="93" y="78" width="17" height="6" fill="#110e16" />
  <rect x="111" y="78" width="18" height="6" fill="#0e0c12" />
  <rect x="130" y="78" width="29" height="6" fill="#0c0a0f" />
  <rect x="37" y="78" width="18" height="1" fill="#262034" />
  <rect x="19" y="78" width="17" height="1" fill="#161220" />
  <!-- the camp-stone's contact -->
  <rect x="70" y="66" width="22" height="1" fill="#030204" />
  <!-- the worn path from the hall's edge to the stone -->
  <rect x="42" y="74" width="10" height="1" fill="#1a1626" />
  <rect x="52" y="71" width="10" height="1" fill="#1c1828" />
  <rect x="62" y="69" width="8" height="1" fill="#1e1a2a" />
  <!-- dust drifted deep where no rite ever reaches -->
  <rect x="98" y="74" width="6" height="1" fill="#0d0b12" />
  <rect x="120" y="70" width="6" height="1" fill="#0b090f" />
  <rect x="140" y="75" width="6" height="1" fill="#0a080d" />
  <rect x="100" y="73" width="3" height="1" fill="#100e15" />
  <!-- one mote settling in the rim-light, caught red -->
  <rect x="38" y="73" width="1" height="1" fill="#5a1812" opacity="0.8" />
  <rect x="40" y="69" width="1" height="1" fill="#3f100c" opacity="0.7" />
</svg>
