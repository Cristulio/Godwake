  <rect x="49" y="67" width="12" height="1" fill="#221e2e" />
  <!-- the rim-light's thin fall across the floor by the edge -->
  <rect x="36" y="66" width="2" height="1" fill="#3f100c" />
  <rect x="35" y="68" width="2" height="10" fill="#1e1014" />
  <rect x="37" y="70" width="1" height="6" fill="#241114" />
  <rect x="36" y="78" width="1" height="4" fill="#180d10" />
  <!-- mid slab row -->
  <rect x="0" y="72" width="15" height="5" fill="#0d0a12" />
  <rect x="16" y="72" width="14" height="5" fill="#0e0b13" />
  <rect x="31" y="72" width="4" height="5" fill="#100d15" />
