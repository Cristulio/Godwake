<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch5-boss — The brink of morning: the Godwake's set piece. The last
       arch of the climb stands full of the false dawn — the Hollow Dawn's
       own light, gold at the heart and rose where it grieves against the
       stone — flanked by two kneeling colossi worn faceless by the
       mornings. The kneel-slab waits on the dais at centre. Key bias
       upper-LEFT: the arch-light cores toward its left shoulder. The
       component lays the boss blood-red ambience above (gold + red = the
       morning that means you harm). Quiet mid band y38-63 outside the
       centre; floor seam y66. Shares the ch5 ramps (ch5-combat.svg). -->
  <defs>
    <radialGradient id="c5b-dawn-core" cx="0.42" cy="0.42" r="0.62">
      <stop offset="0%" stop-color="#ffd890" stop-opacity="0.36" />
      <stop offset="45%" stop-color="#f0b868" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#d08848" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c5b-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f0b868" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#d08848" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="c5b-ray" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#f0b868" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#d08848" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#d08848" stop-opacity="0" />
    </linearGradient>
  </defs>

