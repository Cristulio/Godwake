<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch4-combat — Zhal Vasha, a street under the webs: the Deepdark city
       carved out of the living basalt. House facades flank a street that
       falls away into cavern dark; a faerzress lantern burns violet on its
       bracket (the key, upper-LEFT); webs curtain the high corners and a
       far bridge crosses the black with one pin of light. Quiet mid band
       y38-63 (plain lower facades, flat street dark in the gap); floor
       seam y66, fitted basalt flags below with a cold fungi cluster.
       Ramps — basalt: #0d0b12 #14111a #1b1724 #241f30 (+#2f2840 edge);
       faerzress: #1a1234 #2a1e54 #3d2c78 #5a44a8 (+#7a5fd0 core);
       web: #2a2a32 #3a3a44 #4e4e5a; fungi: #0c1c20 #14303a #1f4a56
       (+#2e6e80); old red (house sigils, unlit): #2a0b08 #3f100c. -->
  <defs>
    <radialGradient id="c4c-lantern-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7a5fd0" stop-opacity="0.34" />
      <stop offset="45%" stop-color="#3d2c78" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3d2c78" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c4c-fungi-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2e6e80" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#2e6e80" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c4c-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5a44a8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#5a44a8" stop-opacity="0" />
