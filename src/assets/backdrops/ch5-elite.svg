  <!-- ch5-elite — The Godwake, the processional stair: where the turned
       pilgrims marshalled before the last flight. Same biome as ch5-combat,
       heavier dressing — the broken triumphal arch the processions passed
       under, prayer-banners gone to rags, a hedge of swords planted by
       those who knelt and stayed, kneel-hollows worn in rows. Key light:
       the dawn-rent upper-LEFT; a second seam leaks across the floor.
       Quiet mid band y38-63; floor seam y66. Shares the ch5 ramps (see
       ch5-combat.svg header). -->
