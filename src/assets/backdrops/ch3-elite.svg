  <!-- ch3-elite — Glassreach, the vivisection ward: where the wardens do the
       Director's work. Same biome as ch3-combat, heavier dressing — hanging
       chains and hooks from the ceiling beam, the subjects' chart with its
       crossed-out names, a specimen shelf (one jar still lit), the slab
       table low in the centre, a shrouded gurney in the cold half, drains
       fed by old blood. Key light: caged wall-lamp upper-LEFT. Quiet mid
       band y38-63; floor seam y66. Shares the ch3 ramps (see ch3-combat.svg)
       + blood old: #2a0b08 #3f100c #5a1812; paper: #3a382c; steel: #3a3f44. -->
