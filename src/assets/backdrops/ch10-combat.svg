<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch10-combat — Tor Maladin: a white-stone causeway through the hidden
       city, under a canopy burning slow from the crowns. Great trunks
       either side, a carved balustrade over the gulf between them, embers
       coming down like the city's own ashfall. Key light: the burn is
       brighter to the upper-LEFT; a fallen branch carries its embers down
       to the hero's end of the walk. Quiet mid band y38-63 (the dark gulf
       beyond the rail); floor seam y66 (the carved kerb).
       Ramps — canopy fire: #2a1206 #3f1c08 #5a2c0e (+#a33d1e #e8743a
       points); night air: #11101a #1c1410; bark: #14141a #1c1c24 #24242e
       (+warm edge #3a2c1e); elven stone: #1e2026 #262830 #2e303a
       (+#3a3d48 lit); leaves: #16210f #1f2e16 #2a3d1c. -->
  <defs>
    <linearGradient id="c10c-canopy-glow" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#a33d1e" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#a33d1e" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="c10c-branch-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
  </defs>

