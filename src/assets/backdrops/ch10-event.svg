<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch10-event — A Talonha Balcony: the calm corner of Tor Maladin. A
       carved balcony of one of the high houses, open to the night: below
       and beyond the rail, the city burns slow in the crowns of its own
       trees; overhead, one low bough of the Tree of Life still holds its
       silver-green light. Cushions, cold tea, an unstrung bow against the
       rail. Key light: the living bough, upper-LEFT and COOL (the calm
       scene's key, answered warm by the distant burn). Event banners crop
       to roughly y28-54: the vista and the rail-line live there.
       Floor seam y66 (the carved deck border).
       Shares the ch10 ramps (see ch10-combat.svg header); Tree silver-
       green: #2a4a3a #3a6a52 #4f8a6a (+#6aa886 brightest, 1px); cushion
       teal: #16282c #1d3a40; violet: #221338 #2a1844. -->
  <defs>
    <radialGradient id="c10v-bough-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4f8a6a" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#3a6a52" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#3a6a52" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c10v-burn-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a33d1e" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#a33d1e" stop-opacity="0" />
    </radialGradient>
  </defs>

