<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch13-event — A Drow Watch-Niche: the carved recess where Szendra's
       living sentries once sat, the chapter's calm scene (events + rest).
       Still violet-grey stone; the niche holds a bench, an arrow-slit to
       the dark, and a cold-lamp burned down to its last grain (key light
       upper-LEFT, very dim, with one amber fleck of dying oil-flame as the
       warm counter-note). Far left, a rank of the petrified kin keeps its
       century of watch, barely told from the dark. Event banners squeeze
       the full frame: the niche arch, bench and slit all sit y16-58.
       Quiet mid band y38-63; seam y66.
       Ramps — drow stone: #110d18 #181222 #221a30 #2c2240 (+#3a2e52);
       petrified: #262232 #2e2a38 #3a3444; cold-lamp: #3a3a5e #5a5488
       #8a7aae; oil-fleck: #a33d1e #e8743a. No baked-in vignette/grain. -->
  <defs>
    <radialGradient id="c13v-lamp-dim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8a7aae" stop-opacity="0.13" />
      <stop offset="55%" stop-color="#5a5488" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#5a5488" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c13v-slit-breath" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5a5488" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#3a3a5e" stop-opacity="0" />
    </radialGradient>
  </defs>

