<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch1-event — The light-well: a collapsed corner of the Iron Cells where
       a high grate lets the outside in. The calm scene of the biome (events
       + rest). Key light: the pale shaft from the grate, upper-LEFT, falling
       as dithered god-rays; one candle answers it in warm. Heavy moss, a
       still pool, a fallen beam. Event banners crop to roughly y28-54, so
       the rays / pool / rubble all cross that band. Floor seam y66.
       Cool ramps: stone #0d0f12 #14171c #1b1f26 #232830; light #2a3a42
       #3d5560 #5a7d8a; moss #1c2914 #2a3d1c #3a5226 #4f7032. -->
  <defs>
    <radialGradient id="c1v-well-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8aacbe" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#6a8a9a" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#6a8a9a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c1v-candle-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="c1v-ray" x1="0" y1="0" x2="0.35" y2="1">
