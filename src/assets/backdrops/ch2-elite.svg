<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch2-elite — Stormhaven docks: the Coinward wharf after the lamps are
       doused. Same city, heavier dressing — a warehouse crane, stacked
       cargo, a tarred cog hull looming at her moorings. Key light: the
       crane-beam lantern upper-LEFT; the harbour answers with a cold
       shimmer. Quiet mid band y38-63 (hull strakes + plain siding); plank
       floor band y66-84 (parallax seam y66).
       Ramps — timber: #120c08 #1a120c #241710 #322015; tarred hull: #0c0a0e
       #14121a #1c1a24 #262430; sky: #0a0c18 #11142a; water: #0c1418 #16242c
       #2a4a52; lantern: #a33d1e #e8743a #ffb347 #ffe9a8. -->
  <defs>
    <radialGradient id="c2e-lantern-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.30" />
      <stop offset="45%" stop-color="#f4a742" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c2e-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f4a742" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
    </radialGradient>
  </defs>

