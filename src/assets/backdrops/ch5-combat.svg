<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch5-combat — The Godwake, the long climb: the last mile out of the
       Deepdark, where the rock goes pale and a dawn-coloured light leaks
       up through the floor of the world. A rent in the high wall pours
       the false morning in (the key, upper-LEFT); behind, the way back
       down still stands black-violet. Pilgrims drilled their sword-forms
       into the stone and left their gear where they knelt. Quiet mid band
       y38-63 (worn pale courses); floor seam y66; a floor-crack leaks
       dawn between the flags. Ramps — pale stone: #1c1815 #28231d #353026
       #423c30 #4f4839 (+#5a5444 edge); dawn: #6a3a28 #a05a32 #d08848
       #f0b868 (+#ffd890 core); rose bloom: #8a4a52; shadow violet:
       #14101c #1c1628 #261e36. -->
  <defs>
    <radialGradient id="c5c-dawn-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f0b868" stop-opacity="0.30" />
      <stop offset="45%" stop-color="#d08848" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#d08848" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c5c-crack-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f0b868" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#d08848" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="c5c-ray" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#f0b868" stop-opacity="0.26" />
      <stop offset="70%" stop-color="#d08848" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#d08848" stop-opacity="0" />
    </linearGradient>
  </defs>

