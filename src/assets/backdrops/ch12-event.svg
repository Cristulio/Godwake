  <rect x="130" y="71" width="22" height="1" fill="#0a1115" />
  <rect x="20" y="79" width="24" height="1" fill="#0b1216" />
  <rect x="56" y="81" width="28" height="1" fill="#0a1115" />
  <!-- column reflections, broken soft -->
  <rect x="53" y="67" width="5" height="6" fill="#0d1318" />
  <rect x="54" y="74" width="3" height="4" fill="#0c1216" />
  <rect x="54" y="79" width="3" height="2" fill="#0b1115" />
  <rect x="105" y="67" width="5" height="5" fill="#0c1115" />
  <rect x="106" y="73" width="3" height="4" fill="#0b1014" />
