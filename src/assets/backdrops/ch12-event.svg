  <rect x="82" y="50" width="22" height="12" fill="#0f1116" />
  <rect x="111" y="50" width="49" height="12" fill="#0e1014" />

  <!-- ══ The refugees' ledge (x116-152, y42-56) ══ -->
  <rect x="116" y="48" width="38" height="3" fill="#1a1c24" />
  <rect x="116" y="48" width="38" height="1" fill="#262c36" />
  <rect x="116" y="51" width="38" height="5" fill="#12141a" />
  <rect x="118" y="56" width="34" height="6" fill="#0f1116" />
  <!-- the folded blanket -->
  <rect x="120" y="45" width="7" height="3" fill="#2a2230" />
