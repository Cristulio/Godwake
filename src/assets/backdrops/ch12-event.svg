  <rect x="2" y="8" width="6" height="1" fill="#0c0a0c" opacity="0.8" />
  <rect x="6" y="13" width="5" height="1" fill="#0b090b" opacity="0.6" />
  <rect x="-12" y="-8" width="60" height="52" fill="url(#c12v-stair-wash)" />

  <!-- ══ Columns standing in the water ══ -->
