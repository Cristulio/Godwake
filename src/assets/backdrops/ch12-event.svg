<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch12-event — A Cistern the Fire Has Not Found: the stone water-vault
       under a burned house, the chapter's calm scene (events + rest). Cool
       and still: vault columns stand in black water; the stair from the
       street descends upper-LEFT, a faint warm wash of the burning far
       above leaking down it (the key, dim). On a dry ledge right, the
       refugees' things sit waiting — a folded blanket, bowls, a doll — by
       one small candle (the warm counter-note). The WATERLINE is the floor
       seam: kerb at y62-66, water y66-84. Quiet mid band y38-63.
       Ramps — vault stone: #101218 #15161c #1a1c24 #232830 (+#2c3340);
       water: #0a1014 #0c1418 #16242c (+gleam #2a4a52); stair warm wash:
       #241712 #332218; candle: #a33d1e #e8743a #ffb347.
       No baked-in vignette/grain. -->
  <defs>
    <radialGradient id="c12v-stair-wash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.13" />
      <stop offset="55%" stop-color="#a33d1e" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#a33d1e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c12v-candle-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ══ FAR: the vault ══ -->
  <rect x="0" y="0" width="160" height="66" fill="#0d0f14" />
  <!-- barrel-ceiling courses -->
  <rect x="0" y="0" width="160" height="4" fill="#08090c" />
  <rect x="0" y="4" width="160" height="1" fill="#15161c" />
  <rect x="0" y="5" width="34" height="6" fill="#1a1c24" />
