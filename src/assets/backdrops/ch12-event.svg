  <rect x="128" y="5" width="32" height="6" fill="#101218" />
  <rect x="0" y="5" width="34" height="1" fill="#232830" />
  <!-- back wall courses -->
  <rect x="0" y="12" width="26" height="12" fill="#171a20" />
  <rect x="27" y="12" width="24" height="12" fill="#1a1c24" />
  <rect x="52" y="12" width="26" height="12" fill="#15161c" />
  <rect x="79" y="12" width="24" height="12" fill="#13151b" />
  <rect x="104" y="12" width="26" height="12" fill="#111319" />
  <rect x="131" y="12" width="29" height="12" fill="#101218" />
  <rect x="27" y="12" width="24" height="1" fill="#262c36" />
  <rect x="0" y="25" width="30" height="13" fill="#1a1c24" />
  <rect x="31" y="25" width="26" height="13" fill="#171a20" />
  <rect x="58" y="25" width="24" height="13" fill="#14171d" />
  <rect x="83" y="25" width="26" height="13" fill="#121419" />
  <rect x="110" y="25" width="50" height="13" fill="#101218" />
  <rect x="31" y="25" width="26" height="1" fill="#232830" />
  <!-- damp staining down the back wall -->
  <rect x="46" y="13" width="2" height="11" fill="#0e1014" opacity="0.8" />
  <rect x="47" y="25" width="2" height="9" fill="#0d0f13" opacity="0.8" />
  <rect x="90" y="14" width="2" height="10" fill="#0d0f13" opacity="0.7" />
