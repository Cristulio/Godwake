    <linearGradient id="c10e-canopy-glow" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.17" />
      <stop offset="55%" stop-color="#a33d1e" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#a33d1e" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="c10e-lamp-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.24" />
      <stop offset="45%" stop-color="#f4a742" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c10e-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f4a742" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
