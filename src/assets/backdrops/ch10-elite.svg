<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch10-elite — Tor Maladin, the gate of the turned watch: same burning
       city, heavier dressing. A carved elven gate whose watch changed
       sides without putting out their own lamp, a barricade of beautiful
       furniture dragged across the gap, a charmed company's spent arrows,
       and the tree-father's guardian statue toppled full-length across
       the stones. Key light: the canopy burn upper-LEFT + the watch-lamp
       still burning on the left pylon. A charred banner smoulders dim on
       the right. Quiet mid band y38-63; floor seam y66.
       Shares the ch10 ramps (see ch10-combat.svg header). -->
