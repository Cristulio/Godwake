<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch7-boss — Where the Keeper Drowned the Library: the great rotunda.
       The floodgate-wheel stands locked open on its dais between the
       combatants, the half-raised gate weeping black water behind it.
       Key light: a drowned oculus upper-LEFT, leaking a cold green-white
       shaft down onto the wheel — the library's own lamps are dead
       verdigris. Phosphor glints in the pool below the dais. The component
       lays the boss blood-red ambience above. Quiet mid band y38-63
       outside the centre set piece; floor seam y66.
       Ramps — ch7 stone/water (see ch7-combat.svg); iron: #0b0907 #16120d
       #211b13 #2d2519; verdigris: #16343a #1f4a52; cold light: #1d3a42
       #2a525c #3a6a74. -->
  <defs>
    <radialGradient id="c7b-oculus-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3a6a74" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#2a525c" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#2a525c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="c7b-ray" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#3a6a74" stop-opacity="0.26" />
      <stop offset="65%" stop-color="#2a525c" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#2a525c" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="c7b-pool-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2a525c" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1d3a42" stop-opacity="0" />
    </radialGradient>
  </defs>

