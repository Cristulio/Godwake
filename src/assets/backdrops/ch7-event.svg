  <rect x="18" y="24" width="22" height="1" fill="#241a14" />
  <rect x="19" y="19" width="2" height="5" fill="#2a1410" />
  <rect x="21" y="20" width="3" height="4" fill="#241a14" />
  <rect x="24" y="19" width="2" height="5" fill="#1a2418" />
  <rect x="26" y="20" width="2" height="4" fill="#14202a" />
  <rect x="28" y="19" width="3" height="5" fill="#241a14" />
  <rect x="31" y="20" width="2" height="4" fill="#2a1410" />
  <rect x="33" y="19" width="2" height="5" fill="#3a3830" />
  <!-- the dead lamp on its chain -->
  <rect x="49" y="17" width="1" height="3" fill="#16120d" />
