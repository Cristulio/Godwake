  <rect x="66" y="67" width="2" height="1" fill="#343229" opacity="0.8" />
  <rect x="90" y="69" width="2" height="1" fill="#2e2c24" opacity="0.7" />
  <rect x="124" y="67" width="1" height="1" fill="#2a281f" opacity="0.7" />
  <rect x="58" y="73" width="2" height="1" fill="#2e2c24" opacity="0.6" />
