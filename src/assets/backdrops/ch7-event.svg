  <rect x="52" y="69" width="1" height="1" fill="#a33d1e" opacity="0.7" />
  <rect x="53" y="72" width="1" height="1" fill="#e8743a" opacity="0.5" />
  <rect x="52" y="76" width="1" height="1" fill="#a33d1e" opacity="0.4" />
  <rect x="36" y="62" width="44" height="22" fill="url(#c7v-water-glow)" />
  <!-- the stacks' reflections, long and dark -->
  <rect x="72" y="68" width="18" height="1" fill="#070a0d" opacity="0.9" />
  <rect x="74" y="70" width="14" height="2" fill="#060809" opacity="0.8" />
  <rect x="104" y="68" width="22" height="1" fill="#060809" opacity="0.9" />
  <rect x="106" y="70" width="18" height="2" fill="#05080b" opacity="0.8" />
  <rect x="140" y="69" width="16" height="2" fill="#05080b" opacity="0.8" />
  <!-- cold glints where the water remembers the high windows -->
  <rect x="96" y="67" width="4" height="1" fill="#1d3a42" opacity="0.8" />
  <rect x="130" y="68" width="3" height="1" fill="#12242a" opacity="0.8" />
  <rect x="148" y="67" width="3" height="1" fill="#16303a" opacity="0.7" />
