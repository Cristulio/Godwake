  <rect x="1" y="67" width="13" height="4" fill="#1f2e32" />
  <rect x="15" y="67" width="12" height="4" fill="#182428" />
  <rect x="28" y="67" width="13" height="4" fill="#1f2e32" />
  <rect x="1" y="67" width="13" height="1" fill="#283a3e" />
