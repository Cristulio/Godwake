<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch7-event — A Dry Carrel: the calm corner of the Drowned Archive.
       One reading-carrel built high enough that the flood stopped at its
       step — a hard bench, a dead lamp, one candle somebody left burning,
       and the black water lapping a hand's breadth below, carrying its
       small warm reflection out into the dark of the drowned stacks.
       Key light: the carrel candle, upper-LEFT bias. Event banners crop
       to roughly y28-54: candle, desk and waterline all cross that band.
       Floor seam y66 = the water's surface / the carrel footing.
       Ramps — ch7 stone/wood/water (see ch7-combat.svg header); candle:
       #a33d1e #e8743a #ffb347 #ffe9a8; pages: #3a3830 #45433a. -->
  <defs>
    <radialGradient id="c7v-candle-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.26" />
      <stop offset="45%" stop-color="#f4a742" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c7v-water-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f4a742" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ══ FAR: the flooded reading-hall ══ -->
  <rect x="0" y="0" width="160" height="66" fill="#0c1013" />
  <rect x="96" y="0" width="64" height="66" fill="#090d10" />
  <rect x="0" y="0" width="160" height="4" fill="#07090b" />
  <rect x="0" y="4" width="160" height="1" fill="#111921" />
  <!-- high-water stain: the flood has been higher than this -->
  <rect x="0" y="7" width="160" height="1" fill="#1d2a2e" opacity="0.7" />
  <rect x="74" y="8" width="1" height="3" fill="#15212a" opacity="0.6" />
  <rect x="118" y="8" width="1" height="2" fill="#101a20" opacity="0.6" />

  <!-- ══ Drowned stacks standing in the water, right ══ -->
  <rect x="68" y="10" width="26" height="56" fill="#0a0d10" />
  <rect x="68" y="10" width="26" height="1" fill="#11181c" />
  <rect x="70" y="16" width="22" height="1" fill="#0d1115" />
  <rect x="70" y="26" width="22" height="1" fill="#0d1115" />
  <rect x="70" y="36" width="22" height="1" fill="#0c1014" />
  <rect x="72" y="12" width="3" height="4" fill="#0d1014" />
  <rect x="78" y="11" width="4" height="5" fill="#0e1216" />
  <rect x="85" y="12" width="3" height="4" fill="#0d1014" />
