  <rect x="80" y="20" width="3" height="5" fill="#0c0f13" />
  <rect x="86" y="19" width="4" height="6" fill="#0d1014" />
  <rect x="100" y="8" width="30" height="58" fill="#080b0e" />
  <rect x="100" y="8" width="30" height="1" fill="#0e1418" />
  <rect x="102" y="18" width="26" height="1" fill="#0b0e12" />
  <rect x="102" y="30" width="26" height="1" fill="#0a0d11" />
  <rect x="104" y="10" width="4" height="6" fill="#0b0e12" />
  <rect x="111" y="11" width="3" height="5" fill="#0a0d11" />
  <rect x="118" y="10" width="4" height="6" fill="#0b0e12" />
  <rect x="125" y="11" width="3" height="5" fill="#090c10" />
  <rect x="136" y="12" width="22" height="54" fill="#070a0d" />
  <rect x="136" y="12" width="22" height="1" fill="#0c1115" />
  <rect x="138" y="24" width="18" height="1" fill="#090c10" />
