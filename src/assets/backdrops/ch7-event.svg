  <!-- the bench -->
  <rect x="22" y="48" width="24" height="2" fill="#1a1310" />
  <rect x="22" y="48" width="24" height="1" fill="#2e2218" />
  <rect x="23" y="50" width="2" height="6" fill="#120d0a" />
  <rect x="43" y="50" width="2" height="6" fill="#120d0a" />
  <!-- the carrel floor + its stone footing -->
  <rect x="12" y="56" width="48" height="2" fill="#241a14" />
  <rect x="12" y="56" width="48" height="1" fill="#2e2218" />
  <rect x="10" y="58" width="52" height="8" fill="#121a1e" />
  <rect x="10" y="58" width="52" height="1" fill="#1f2e32" />
  <rect x="10" y="62" width="52" height="1" fill="#0e1418" />
  <!-- the step the flood stopped at -->
  <rect x="50" y="62" width="14" height="4" fill="#182428" />
  <rect x="50" y="62" width="14" height="1" fill="#243438" />

  <!-- ══ MID BAND (y38-66) left of the carrel: bare quiet wall ══ -->
  <rect x="0" y="38" width="13" height="14" fill="#0e1316" />
  <rect x="0" y="52" width="13" height="14" fill="#0c1114" />
  <!-- a stack of books hauled up from the water, drying -->
  <rect x="2" y="58" width="9" height="8" fill="#10121a" />
  <rect x="2" y="60" width="8" height="2" fill="#241a14" />
  <rect x="3" y="58" width="7" height="2" fill="#1a2418" />
  <rect x="2" y="62" width="9" height="2" fill="#16100c" />
  <rect x="3" y="58" width="7" height="1" fill="#22311a" />

  <!-- ══ Loose leaves adrift ══ -->
  <rect x="62" y="22" width="2" height="1" fill="#454337" opacity="0.7" />
  <rect x="86" y="30" width="1" height="1" fill="#343229" opacity="0.6" />
  <rect x="120" y="20" width="1" height="1" fill="#2e2c24" opacity="0.6" />
  <rect x="142" y="34" width="2" height="1" fill="#2a281f" opacity="0.5" />

  <!-- ══ NEAR (y66-84): the carrel platform, then the black water ══ -->
