  <rect x="48" y="60" width="3" height="1" fill="#1a140d" />
  <rect x="92" y="62" width="5" height="2" fill="#13100a" />
  <rect x="126" y="61" width="6" height="3" fill="#110e09" />
  <rect x="128" y="60" width="3" height="1" fill="#14110b" />

  <!-- ══ The ashfall, streaking through everything ══ -->
  <rect x="34" y="8" width="1" height="2" fill="#4a4438" opacity="0.7" />
