<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch8-combat — The Ashfall March: the open field that has burned for a
       hundred years. A ridge on fire far off to the LEFT (the key light,
       with a burning snag-tree carrying it nearer), smoke standing in
       columns, ash falling through everything, the relics of the march
       planted where they fell — spears, a torn standard, a dead limber.
       Quiet mid band y38-63 (drifting haze, two values); floor seam y66.
       Ramps — smoke: #141008 #1a1410 #1f1a14 #241e16; char ground:
       #0c0a08 #14100c #1c1610 #241c12; ash: #2c2820 #3a3328 (+#4a4438
       flecks); iron: #0b0907 #16120d #211b13; fire: #5a1812 #a33d1e
       #e8743a #ffb347 (+#ffe9a8 core); old blood: #2a0b08 #3f100c. -->
  <defs>
    <radialGradient id="c8c-fire-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.26" />
      <stop offset="45%" stop-color="#e8743a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c8c-fireline-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a33d1e" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#a33d1e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c8c-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ══ FAR: the standing smoke ══ -->
  <rect x="0" y="0" width="160" height="66" fill="#1f1a14" />
  <rect x="104" y="0" width="56" height="66" fill="#181410" />
  <rect x="0" y="0" width="160" height="6" fill="#141008" />
  <rect x="0" y="6" width="160" height="6" fill="#1a1410" />
  <rect x="0" y="12" width="160" height="1" fill="#221c14" />
  <!-- smoke columns leaning off the fire -->
  <rect x="20" y="3" width="4" height="18" fill="#100d08" />
  <rect x="22" y="0" width="4" height="6" fill="#0e0b06" />
  <rect x="48" y="8" width="3" height="13" fill="#120f09" />
  <rect x="50" y="4" width="3" height="6" fill="#100d08" />
  <rect x="96" y="6" width="3" height="15" fill="#13100a" />
  <!-- carrion birds riding the heat -->
  <rect x="70" y="7" width="1" height="1" fill="#0a0805" />
  <rect x="72" y="6" width="1" height="1" fill="#0a0805" />
  <rect x="74" y="7" width="1" height="1" fill="#0a0805" />
  <rect x="112" y="11" width="1" height="1" fill="#0c0a06" />
  <rect x="114" y="10" width="1" height="1" fill="#0c0a06" />

  <!-- ══ The burning line on the ridge, LEFT — the key light ══ -->
  <rect x="0" y="21" width="72" height="2" fill="#5a1812" />
  <rect x="6" y="20" width="8" height="2" fill="#a33d1e" />
  <rect x="24" y="20" width="9" height="2" fill="#a33d1e" />
  <rect x="44" y="21" width="6" height="1" fill="#a33d1e" />
  <rect x="9" y="19" width="3" height="1" fill="#e8743a" />
  <rect x="27" y="19" width="2" height="1" fill="#e8743a" />
  <rect x="10" y="18" width="1" height="1" fill="#ffb347" />
  <rect x="-14" y="2" width="100" height="40" fill="url(#c8c-fireline-glow)" />
