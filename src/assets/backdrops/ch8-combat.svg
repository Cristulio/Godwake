  <rect x="17" y="12" width="1" height="24" fill="#1c1610" />
  <rect x="12" y="14" width="5" height="2" fill="#0c0a08" />
  <rect x="10" y="12" width="3" height="2" fill="#0a0805" />
  <rect x="21" y="9" width="5" height="2" fill="#0c0a08" />
  <rect x="25" y="7" width="3" height="2" fill="#0a0805" />
  <rect x="20" y="6" width="2" height="4" fill="#0c0a08" />
