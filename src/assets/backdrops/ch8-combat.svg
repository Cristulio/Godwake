  <rect x="0" y="23" width="160" height="5" fill="#0e0c08" />
  <rect x="36" y="22" width="20" height="2" fill="#0e0c08" />
  <rect x="76" y="22" width="30" height="2" fill="#0d0b07" />
  <rect x="120" y="24" width="40" height="4" fill="#0c0a07" />
  <rect x="0" y="28" width="160" height="1" fill="#16110b" />

