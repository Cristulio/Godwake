  <rect x="33" y="17" width="1" height="1" fill="#a33d1e" opacity="0.8" />
  <rect x="40" y="24" width="1" height="1" fill="#a33d1e" opacity="0.6" />

  <!-- ══ The relics of the march, planted on the field ══ -->
  <rect x="38" y="26" width="1" height="12" fill="#16120d" />
  <rect x="37" y="26" width="3" height="1" fill="#1c1610" />
  <rect x="60" y="24" width="1" height="14" fill="#16120d" />
