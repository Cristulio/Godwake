<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch8-elite — The Ashfall March, the cairn line: same field, heavier
       relics. A wrecked wagon still burning rib by rib (key light, upper-
       LEFT), the leaning standards of three dead companies, the cairn of
       helms the march forgot, and the cold field-forge — its last coals
       the scene's second, dimmer glow. Quiet mid band y38-63; floor seam
       y66. Shares the ch8 ramps (see ch8-combat.svg header). -->
  <defs>
    <radialGradient id="c8e-fire-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.26" />
      <stop offset="45%" stop-color="#e8743a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c8e-coal-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#a33d1e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c8e-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
  </defs>

