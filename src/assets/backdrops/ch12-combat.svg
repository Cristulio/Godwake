  <rect x="6" y="13" width="2" height="11" fill="#0a0705" />
  <rect x="17" y="13" width="2" height="10" fill="#0a0705" />
  <rect x="22" y="14" width="2" height="9" fill="#0a0705" />
  <rect x="32" y="14" width="2" height="9" fill="#0a0705" />
