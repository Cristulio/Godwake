  <rect x="0" y="10" width="46" height="56" fill="#1d1510" />
  <!-- eave + roof edge, fire eating through -->
  <rect x="0" y="10" width="46" height="2" fill="#0a0705" />
  <rect x="0" y="12" width="46" height="1" fill="#34271a" />
  <rect x="8" y="8" width="8" height="2" fill="#a33d1e" />
