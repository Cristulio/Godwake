<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch12-combat — The Burning Street: a Karthen row mid-siege. Key light:
       the LEFT rowhouse's upper windows are ablaze (x~10-34, y6-16), flame
       crowning the eave; the street runs to a dull fire-glow at its far end.
       Right-hand houses stand dark and shuttered (cool side). Smoke rolls
       across a red-underlit night sky. Bands: sky+facades y0-38, mid y38-63
       QUIET (lower storeys, two dark doorways), cobbles y66-84; seam y66.
       Ramps — sky/smoke: #0e0a10 #181018 #241620 (+underlit #2a1414);
       timber/facade warm: #140e09 #1d1510 #281d14 #34271a (+#453524);
       cool stone: #101218 #15161c #1a1c24; flame: #a33d1e #e8743a #ffb347
       #ffe9a8; char: #0a0705 #16100a. No baked-in vignette/grain. -->
  <defs>
    <radialGradient id="c12c-blaze-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.30" />
      <stop offset="45%" stop-color="#e8743a" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c12c-street-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a33d1e" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#a33d1e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c12c-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e8743a" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#e8743a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ══ SKY (y0-16): smoke night, underlit by the burning city ══ -->
  <rect x="0" y="0" width="160" height="18" fill="#181018" />
  <rect x="0" y="0" width="160" height="6" fill="#0e0a10" />
  <rect x="96" y="2" width="64" height="8" fill="#241620" />
  <rect x="120" y="6" width="40" height="6" fill="#2a1414" />
  <rect x="60" y="4" width="40" height="4" fill="#1c1219" />
  <!-- rolling smoke banks -->
  <rect x="30" y="2" width="44" height="3" fill="#0c0810" opacity="0.9" />
  <rect x="44" y="5" width="36" height="2" fill="#120c12" opacity="0.8" />
  <rect x="98" y="1" width="34" height="2" fill="#0c0810" opacity="0.8" />
  <!-- distant burning skyline over the roofs -->
  <rect x="104" y="10" width="3" height="4" fill="#0a0608" />
  <rect x="112" y="9" width="2" height="5" fill="#0a0608" />
  <rect x="108" y="11" width="1" height="2" fill="#5a1812" />
  <rect x="116" y="12" width="2" height="2" fill="#3f100c" />
  <rect x="126" y="11" width="1" height="2" fill="#5a1812" />
  <!-- drifting cinders on the wind -->
  <rect x="52" y="3" width="1" height="1" fill="#e8743a" opacity="0.8" />
  <rect x="78" y="7" width="1" height="1" fill="#a33d1e" opacity="0.7" />
  <rect x="96" y="4" width="1" height="1" fill="#e8743a" opacity="0.55" />
  <rect x="64" y="11" width="1" height="1" fill="#a33d1e" opacity="0.5" />

