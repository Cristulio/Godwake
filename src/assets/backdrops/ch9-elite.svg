    <radialGradient id="c9e-ghost-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3a5c6a" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#2a4450" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="c9e-floor-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f4a742" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
