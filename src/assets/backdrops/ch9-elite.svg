<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 84" shape-rendering="crispEdges" preserveAspectRatio="none">
  <!-- ch9-elite — The Court of Masks, the gallery of mirrors: the receiving
       line. Mirror after mirror in a duelling rhythm, one half-shrouded, a
       toppled courtier's statue, the drift of cast-off masks heaped along
       the east wall, a chalk line and a dropped rapier where the last
       affair of honour stopped mid-figure. Key light: a twin girandole on
       the LEFT wall — answered, wrongly, by a cold gleam in a far mirror
       no candle is lighting. Quiet mid band y38-63; floor seam y66.
       Shares the ch9 ramps (see ch9-combat.svg header). -->
  <defs>
    <radialGradient id="c9e-candle-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.27" />
      <stop offset="45%" stop-color="#f4a742" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#f4a742" stop-opacity="0" />
