<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 28 32"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
    >
      <!-- Ember backlight + ground shadow -->
      <ellipse cx="16" cy="18" rx="13" ry="15" fill="#d4641a" opacity="0.09" />
      <ellipse cx="16" cy="31" rx="10" ry="1.5" fill="#000" opacity="0.42" />

      <!-- Cowl — dark ramp, key light upper-left -->
      <polygon points="9,9 16,1 23,9" fill="#2a1e1c" />
      <polygon points="10,9 16,3 22,9" fill="#3a2c2a" />
      <polygon points="10,9 16,3 18,9" fill="#4a3632" opacity="0.6" />
      <polygon points="9,9 12,6 11,9" fill="#5a4642" opacity="0.5" />

      <!-- Shadowed face hollow + smoulder eyes -->
      <ellipse cx="16" cy="10" rx="6" ry="7" fill="#2a201e" />
      <ellipse cx="16" cy="11" rx="4" ry="5" fill="#140e0c" />
      <rect x="14" y="10" width="2" height="2" fill="#f4942a" />
      <rect x="17" y="10" width="2" height="2" fill="#f4942a" />
      <rect x="14" y="10" width="1" height="1" fill="#ffd070" />
      <rect x="17" y="10" width="1" height="1" fill="#ffd070" />
      <rect x="15" y="14" width="3" height="1" fill="#d4641a" opacity="0.6" />

      <!-- Robe — dark ramp, ember veins, dither -->
      <rect x="10" y="16" width="13" height="15" fill="#3a2c2a" />
      <rect x="10" y="16" width="13" height="1" fill="#4a3632" />
      <rect x="10" y="16" width="3" height="15" fill="#46342f" />
      <rect x="10" y="16" width="1" height="13" fill="#5a4642" opacity="0.7" />
      <rect x="21" y="16" width="2" height="15" fill="#241a18" />
      <rect x="15" y="17" width="3" height="14" fill="#241a18" />
      <rect x="11" y="19" width="11" height="1" fill="#a83a14" opacity="0.6" />
      <rect x="12" y="23" width="9" height="1" fill="#d4641a" opacity="0.45" />
      <rect x="11" y="27" width="11" height="1" fill="#6a3a1a" opacity="0.5" />
      <rect x="13" y="21" width="1" height="1" fill="#e87820" opacity="0.45" />
      <rect x="19" y="25" width="1" height="1" fill="#241a18" />
      <rect x="10" y="31" width="13" height="1" fill="#140e0c" />

      <!-- Left arm + censer chain -->
      <rect x="7" y="17" width="3" height="2" fill="#3a2c2a" />
      <rect x="7" y="17" width="3" height="1" fill="#4a3632" />
      <rect x="5" y="18" width="3" height="2" fill="#46342f" />
      <line x1="6" y1="20" x2="6" y2="25" stroke="#5a4e42" stroke-width="1" />
      <line x1="6" y1="20" x2="6" y2="25" stroke="#7a6e60" stroke-width="0.4" opacity="0.6" />

      <!-- Swinging censer — iron bowl + flame -->
      <rect x="4" y="25" width="5" height="4" fill="#2a201e" />
      <rect x="4" y="25" width="5" height="1" fill="#4a3632" />
      <rect x="4" y="25" width="1" height="4" fill="#46342f" />
      <rect x="5" y="26" width="3" height="2" fill="#f4942a" />
      <rect x="6" y="26" width="1" height="1" fill="#ffd070" />
      <rect x="3" y="29" width="2" height="2" fill="#e87820" opacity="0.7" />
      <rect x="7" y="30" width="2" height="2" fill="#d4641a" opacity="0.55" />
      <rect x="5" y="31" width="1" height="1" fill="#f4942a" opacity="0.7" />

      <!-- Rising cinders -->
      <rect x="4" y="22" width="1" height="1" fill="#ffd070" opacity="0.5" />
      <rect x="9" y="20" width="1" height="1" fill="#f4942a" opacity="0.4" />
    </svg>
