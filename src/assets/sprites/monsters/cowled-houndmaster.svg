<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 38 62"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Cowled Houndmaster"
    >
      <!-- Cold leash-light backlight + ground shadow -->
      <ellipse cx="19" cy="30" rx="18" ry="27" fill="#4a78c0" opacity="0.14" />
      <ellipse cx="22" cy="59.6" rx="13" ry="2.2" fill="#000" opacity="0.45" />

      <!-- ══ The shadow-hound — straining at the leash ══ -->
      <!-- hound body entering frame at ground level -->
      <rect x="0" y="44" width="10" height="10" fill="#150d08" />
      <rect x="1" y="45" width="8" height="8" fill="#10141f" />
      <rect x="1" y="45" width="3" height="8" fill="#181e2c" />
      <!-- hound head, jaws open -->
      <rect x="4" y="38" width="9" height="8" fill="#150d08" />
      <rect x="5" y="39" width="7" height="6" fill="#181e2c" />
      <rect x="5" y="39" width="3" height="6" fill="#222a3c" />
      <!-- ears pinned back -->
      <rect x="3" y="36" width="3" height="3" fill="#150d08" />
      <rect x="4" y="37" width="1" height="1" fill="#222a3c" />
      <!-- cold eye -->
      <rect x="7" y="41" width="2" height="2" fill="#7ad0e8" />
      <rect x="7" y="41" width="1" height="1" fill="#d6f4ff" />
      <!-- muzzle + bared shadow teeth -->
      <rect x="10" y="42" width="4" height="3" fill="#150d08" />
      <rect x="11" y="43" width="2" height="1" fill="#0c0a12" />
      <rect x="11" y="44" width="1" height="1" fill="#a8c4d8" />
      <rect x="13" y="44" width="1" height="1" fill="#8aa8bc" />
      <!-- smoke wisps off the hound -->
      <rect x="2" y="42" width="1" height="2" fill="#2a3650" opacity="0.7" />
      <rect x="0" y="39" width="1" height="2" fill="#222a3c" opacity="0.6" />

      <!-- ══ The leash — taut shadow-chain to the fist ══ -->
      <rect x="12" y="40" width="3" height="1" fill="#4a78c0" />
      <rect x="14" y="38" width="3" height="1" fill="#3a5e9a" />
      <rect x="16" y="36" width="3" height="1" fill="#4a78c0" />
      <rect x="18" y="34" width="3" height="1" fill="#3a5e9a" />
      <rect x="20" y="32" width="3" height="1" fill="#4a78c0" />
      <rect x="15" y="38" width="1" height="1" fill="#7ec8ff" />
      <rect x="19" y="34" width="1" height="1" fill="#7ec8ff" />

      <!-- ══ Hood — grey cowl family ══ -->
      <rect x="15" y="1" width="12" height="4" fill="#150d08" />
      <rect x="13" y="4" width="16" height="6" fill="#150d08" />
      <rect x="16" y="2" width="10" height="3" fill="#4a4858" />
      <rect x="16" y="2" width="4" height="2" fill="#5a5868" />
      <rect x="14" y="5" width="14" height="5" fill="#3e3c4c" />
      <rect x="14" y="5" width="5" height="4" fill="#4a4858" />
      <rect x="25" y="5" width="3" height="5" fill="#322f40" />
      <!-- hood opening — hard jaw visible, eyes shadowed -->
      <rect x="14" y="9" width="14" height="9" fill="#150d08" />
      <rect x="15" y="10" width="12" height="8" fill="#0c0a12" />
      <!-- lower face catching light -->
      <rect x="16" y="14" width="9" height="4" fill="#a89678" />
      <rect x="16" y="14" width="4" height="4" fill="#c4b49a" />
      <rect x="23" y="14" width="2" height="4" fill="#8a7a5e" />
      <!-- grim mouth + scar through the lip -->
      <rect x="17" y="16" width="7" height="1" fill="#5e4630" />
      <rect x="21" y="15" width="1" height="3" fill="#6e5232" />
      <!-- one cold eye glinting in the hood shadow -->
      <rect x="17" y="11" width="2" height="2" fill="#7ad0e8" />
      <rect x="17" y="11" width="1" height="1" fill="#d6f4ff" />
      <rect x="22" y="11" width="2" height="2" fill="#3a5e9a" />

      <!-- ══ Bone whistle on a cord ══ -->
      <rect x="19" y="18" width="1" height="4" fill="#3a2a16" />
      <rect x="18" y="22" width="4" height="3" fill="#150d08" />
      <rect x="19" y="23" width="2" height="1" fill="#cdbfa2" />
      <rect x="19" y="23" width="1" height="1" fill="#e8dcc4" />

      <!-- ══ Short working robe ══ -->
      <rect x="12" y="18" width="18" height="6" fill="#150d08" />
      <rect x="13" y="19" width="16" height="5" fill="#3e3c4c" />
      <rect x="13" y="19" width="6" height="4" fill="#4a4858" />
      <rect x="25" y="19" width="4" height="5" fill="#322f40" />
      <rect x="12" y="23" width="18" height="20" fill="#150d08" />
      <rect x="13" y="24" width="16" height="18" fill="#322f40" />
      <rect x="13" y="24" width="6" height="18" fill="#3e3c4c" />
      <rect x="13" y="24" width="3" height="13" fill="#4a4858" />
      <rect x="25" y="24" width="4" height="18" fill="#262334" />
      <rect x="27" y="24" width="2" height="18" fill="#1e1b2a" />
      <!-- center seam -->
      <rect x="20" y="24" width="2" height="18" fill="#262334" />
      <!-- leather chest strap -->
      <rect x="13" y="26" width="16" height="2" fill="#2e2014" />
      <rect x="13" y="26" width="6" height="1" fill="#3c2c1c" />
      <rect x="18" y="25" width="3" height="4" fill="#150d08" />
      <rect x="19" y="26" width="1" height="2" fill="#6e6a78" />

      <!-- ══ Left arm — down to the taut leash ══ -->
      <rect x="9" y="20" width="6" height="8" fill="#150d08" />
      <rect x="10" y="21" width="4" height="6" fill="#3e3c4c" />
      <rect x="10" y="21" width="2" height="6" fill="#4a4858" />
      <rect x="8" y="26" width="7" height="7" fill="#150d08" />
      <rect x="9" y="27" width="5" height="5" fill="#322f40" />
      <rect x="9" y="27" width="2" height="5" fill="#3e3c4c" />
      <!-- gloved fist wrapped in the leash -->
      <rect x="9" y="31" width="7" height="6" fill="#150d08" />
      <rect x="10" y="32" width="5" height="4" fill="#3c2c1c" />
      <rect x="10" y="32" width="2" height="4" fill="#4a3824" />
      <rect x="21" y="31" width="3" height="1" fill="#4a78c0" />
      <rect x="12" y="33" width="1" height="1" fill="#7ec8ff" opacity="0.8" />

      <!-- ══ Right arm — braced behind ══ -->
      <rect x="26" y="20" width="7" height="8" fill="#150d08" />
      <rect x="27" y="21" width="5" height="6" fill="#2a2736" />
      <rect x="27" y="21" width="2" height="6" fill="#322f40" />
      <rect x="28" y="26" width="7" height="8" fill="#150d08" />
      <rect x="29" y="27" width="5" height="6" fill="#262334" />
      <!-- gloved hand, coiled spare leash -->
      <rect x="29" y="32" width="6" height="6" fill="#150d08" />
      <rect x="30" y="33" width="4" height="4" fill="#3c2c1c" />
      <rect x="30" y="33" width="2" height="4" fill="#4a3824" />
      <rect x="30" y="35" width="4" height="1" fill="#2a3650" />
      <rect x="30" y="36" width="4" height="1" fill="#222a3c" />

      <!-- ══ Belt ══ -->
      <rect x="12" y="36" width="18" height="3" fill="#150d08" />
      <rect x="13" y="37" width="16" height="1" fill="#3a2a1c" />
      <rect x="13" y="37" width="6" height="1" fill="#5a4228" />
      <rect x="19" y="36" width="3" height="3" fill="#150d08" />
      <rect x="20" y="37" width="1" height="1" fill="#9a96a4" />

      <!-- ══ Braced legs ══ -->
      <rect x="13" y="42" width="8" height="10" fill="#150d08" />
      <rect x="14" y="43" width="6" height="9" fill="#2a2736" />
      <rect x="14" y="43" width="2" height="9" fill="#322f40" />
      <rect x="18" y="43" width="2" height="9" fill="#1e1b2a" />
      <rect x="21" y="42" width="8" height="10" fill="#150d08" />
      <rect x="22" y="43" width="6" height="9" fill="#262334" />
      <rect x="22" y="43" width="2" height="9" fill="#2a2736" />

      <!-- ══ Boots ══ -->
      <rect x="12" y="51" width="10" height="6" fill="#150d08" />
      <rect x="13" y="52" width="8" height="4" fill="#2e2014" />
      <rect x="13" y="52" width="8" height="1" fill="#4a3824" />
      <rect x="13" y="55" width="8" height="1" fill="#16100a" />
      <rect x="21" y="51" width="10" height="6" fill="#150d08" />
      <rect x="22" y="52" width="8" height="4" fill="#241808" />
      <rect x="22" y="52" width="8" height="1" fill="#3c2c1c" />
      <rect x="22" y="55" width="8" height="1" fill="#120c06" />

      <!-- cold motes -->
      <rect x="33" y="24" width="1" height="1" fill="#7ad0e8" opacity="0.5" />
      <rect x="5" y="30" width="1" height="1" fill="#7ec8ff" opacity="0.45" />
    </svg>
