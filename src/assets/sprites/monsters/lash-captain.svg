<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 34"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Lash-Captain"
    >
      <!-- Torch backlight + ground shadow -->
      <ellipse cx="11" cy="17" rx="11" ry="16" fill="#c47a2a" opacity="0.07" />
      <ellipse cx="10" cy="33" rx="8" ry="1.3" fill="#000" opacity="0.4" />

      <!-- Coiled whip arcing overhead — leather ramp + ember tip -->
      <rect x="14" y="2" width="6" height="1" fill="#3a2e22" />
      <rect x="14" y="2" width="6" height="1" fill="#5a4838" opacity="0.6" />
      <rect x="19" y="2" width="1" height="4" fill="#3a2e22" />
      <rect x="20" y="5" width="3" height="1" fill="#3a2e22" />
      <rect x="22" y="6" width="1" height="3" fill="#3a2e22" />
      <rect x="20" y="8" width="3" height="1" fill="#3a2e22" />
      <rect x="22" y="8" width="1" height="2" fill="#7a1a0a" />
      <rect x="22" y="8" width="1" height="1" fill="#e8501a" />

      <!-- Shaved head + topknot — skin ramp, key light upper-left -->
      <rect x="6" y="3" width="7" height="6" fill="#8a6a4a" />
      <rect x="6" y="3" width="7" height="1" fill="#b08a6a" />
      <rect x="6" y="3" width="2" height="6" fill="#c49a72" />
      <rect x="6" y="3" width="1" height="4" fill="#d8b088" />
      <rect x="12" y="3" width="1" height="6" fill="#6a4a2a" />
      <rect x="9" y="1" width="2" height="2" fill="#2a1a10" />
      <!-- Eyes + scarred brow -->
      <rect x="7" y="5" width="2" height="1" fill="#1a1410" />
      <rect x="10" y="5" width="2" height="1" fill="#1a1410" />
      <rect x="7" y="5" width="1" height="1" fill="#e8501a" opacity="0.7" />
      <rect x="10" y="5" width="1" height="1" fill="#c4641a" opacity="0.6" />
      <rect x="7" y="7" width="5" height="1" fill="#5a3a22" />

      <!-- Studded leather torso — ramp + steel studs -->
      <rect x="4" y="9" width="11" height="12" fill="#4a3422" />
      <rect x="4" y="9" width="11" height="1" fill="#5a4430" />
      <rect x="4" y="9" width="2" height="11" fill="#5a4028" />
      <rect x="4" y="9" width="1" height="11" fill="#3a2818" />
      <rect x="13" y="9" width="2" height="11" fill="#2a1e12" />
      <rect x="4" y="17" width="11" height="2" fill="#2a1e12" />
      <!-- Stud rows + speculars -->
      <rect x="6" y="11" width="1" height="1" fill="#8a8a6a" />
      <rect x="9" y="11" width="1" height="1" fill="#8a8a6a" />
      <rect x="12" y="11" width="1" height="1" fill="#6a6a4a" />
      <rect x="6" y="14" width="1" height="1" fill="#8a8a6a" />
      <rect x="9" y="14" width="1" height="1" fill="#8a8a6a" />
      <rect x="12" y="14" width="1" height="1" fill="#6a6a4a" />
      <rect x="6" y="11" width="1" height="1" fill="#cacaa0" opacity="0.5" />
      <rect x="9" y="14" width="1" height="1" fill="#cacaa0" opacity="0.5" />

      <!-- Whip arm — skin ramp -->
      <rect x="14" y="9" width="3" height="6" fill="#8a6a4a" />
      <rect x="14" y="9" width="3" height="1" fill="#b08a6a" />
      <rect x="14" y="9" width="1" height="6" fill="#c49a72" />
      <rect x="16" y="9" width="1" height="6" fill="#6a4a2a" />

      <!-- Off arm -->
      <rect x="1" y="10" width="3" height="8" fill="#8a6a4a" />
      <rect x="1" y="10" width="1" height="8" fill="#b08a6a" />
      <rect x="3" y="10" width="1" height="8" fill="#6a4a2a" />

      <!-- Legs — ramp -->
      <rect x="5" y="21" width="4" height="8" fill="#3a2a1a" />
      <rect x="11" y="21" width="4" height="8" fill="#3a2a1a" />
      <rect x="5" y="21" width="1" height="8" fill="#4a3624" />
      <rect x="11" y="21" width="1" height="8" fill="#4a3624" />
      <rect x="8" y="21" width="1" height="8" fill="#2a1e12" />
      <rect x="14" y="21" width="1" height="8" fill="#2a1e12" />

      <!-- Boots -->
      <rect x="4" y="29" width="5" height="4" fill="#2a1e12" />
      <rect x="11" y="29" width="5" height="4" fill="#2a1e12" />
      <rect x="4" y="29" width="5" height="1" fill="#3a2e22" />
      <rect x="11" y="29" width="5" height="1" fill="#3a2e22" />
    </svg>
