<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 45"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Lash-Captain"
    >
      <!-- Torch backlight + ground shadow -->
      <ellipse cx="15" cy="21" rx="14" ry="20" fill="#c47a2a" opacity="0.07" />
      <ellipse cx="14" cy="43.6" rx="10" ry="1.7" fill="#000" opacity="0.4" />

      <!-- ── Whip arcing overhead — leather coils, ember-barbed tip ── -->
      <rect x="17" y="2" width="9" height="2" fill="#150d08" />
      <rect x="18" y="3" width="7" height="1" fill="#5a4838" />
      <rect x="18" y="3" width="3" height="1" fill="#7a6248" />
      <rect x="25" y="3" width="2" height="5" fill="#150d08" />
      <rect x="26" y="4" width="1" height="4" fill="#3a2e22" />
      <rect x="26" y="7" width="4" height="2" fill="#150d08" />
      <rect x="27" y="8" width="3" height="1" fill="#5a4838" />
      <rect x="29" y="9" width="2" height="4" fill="#150d08" />
      <rect x="30" y="10" width="1" height="3" fill="#3a2e22" />
      <rect x="28" y="12" width="3" height="2" fill="#150d08" />
      <rect x="28" y="13" width="2" height="1" fill="#5a4838" />
      <!-- barbed ember tip -->
      <rect x="27" y="14" width="2" height="3" fill="#150d08" />
      <rect x="27" y="14" width="1" height="2" fill="#7a1a0a" />
      <rect x="27" y="14" width="1" height="1" fill="#e8501a" />
      <rect x="26" y="16" width="1" height="1" fill="#ffb040" />

      <!-- ── Shaved head + topknot — sun-browned skin ── -->
      <rect x="11" y="0" width="4" height="3" fill="#150d08" />
      <rect x="12" y="1" width="2" height="2" fill="#2a1a10" />
      <rect x="12" y="1" width="1" height="1" fill="#4a3320" />
      <rect x="7" y="2" width="12" height="10" fill="#150d08" />
      <rect x="8" y="3" width="10" height="8" fill="#8a6a4a" />
      <rect x="8" y="3" width="10" height="1" fill="#b08a6a" />
      <rect x="8" y="3" width="3" height="7" fill="#c49a72" />
      <rect x="8" y="3" width="1" height="5" fill="#d8b088" />
      <rect x="15" y="4" width="3" height="7" fill="#6a4a2a" />
      <rect x="17" y="5" width="1" height="6" fill="#54381e" />
      <rect x="17" y="7" width="1" height="2" fill="#3e5650" />
      <!-- brand-scar on the cheek -->
      <rect x="15" y="8" width="2" height="1" fill="#7a2010" />
      <rect x="16" y="7" width="1" height="1" fill="#7a2010" />

      <!-- heavy brow shading the eyes -->
      <rect x="9" y="5" width="3" height="1" fill="#54381e" />
      <rect x="13" y="5" width="3" height="1" fill="#442c16" />
      <!-- eyes — narrow slits, one ember glint -->
      <rect x="9" y="6" width="3" height="1" fill="#1a1410" />
      <rect x="13" y="6" width="3" height="1" fill="#1a1410" />
      <rect x="10" y="6" width="1" height="1" fill="#e8501a" />
      <rect x="14" y="6" width="1" height="1" fill="#8a4214" />
      <rect x="10" y="6" width="1" height="1" fill="#ffb060" opacity="0.55" />
      <!-- broad nose + hard cheekbones -->
      <rect x="12" y="7" width="2" height="2" fill="#6a4a2a" />
      <rect x="9" y="8" width="2" height="1" fill="#6a4a2a" opacity="0.6" />
      <!-- scowl + clenched jaw -->
      <rect x="9" y="9" width="7" height="1" fill="#3a2412" />
      <rect x="10" y="10" width="5" height="1" fill="#54381e" />

      <!-- ── Studded-leather harness torso — broad, whip-arm bare ── -->
      <rect x="5" y="12" width="18" height="16" fill="#150d08" />
      <rect x="6" y="13" width="16" height="14" fill="#4a3422" />
      <rect x="6" y="13" width="16" height="1" fill="#5a4430" />
      <rect x="6" y="13" width="3" height="13" fill="#5a4028" />
      <rect x="6" y="13" width="1" height="13" fill="#6e5036" />
      <rect x="19" y="13" width="3" height="13" fill="#2a1e12" />
      <rect x="21" y="14" width="1" height="12" fill="#221809" />
      <!-- crossed chest strap -->
      <rect x="6" y="15" width="16" height="2" fill="#2a1e12" />
      <rect x="6" y="15" width="16" height="1" fill="#3a2e22" />
      <!-- stud rows, lit + shadow -->
      <rect x="8" y="15" width="1" height="1" fill="#cacaa0" />
      <rect x="12" y="15" width="1" height="1" fill="#8a8a6a" />
      <rect x="16" y="15" width="1" height="1" fill="#8a8a6a" />
      <rect x="20" y="15" width="1" height="1" fill="#6a6a4a" />
      <rect x="8" y="20" width="1" height="1" fill="#8a8a6a" />
      <rect x="12" y="20" width="1" height="1" fill="#cacaa0" />
      <rect x="16" y="20" width="1" height="1" fill="#6a6a4a" />
      <rect x="8" y="24" width="1" height="1" fill="#8a8a6a" />
      <rect x="13" y="24" width="1" height="1" fill="#6a6a4a" />
      <rect x="18" y="24" width="1" height="1" fill="#6a6a4a" />
      <!-- slave-ring keys at the belt -->
      <rect x="9" y="26" width="2" height="2" fill="#150d08" />
      <rect x="9" y="26" width="1" height="1" fill="#8a8a6a" />

      <!-- ── Whip arm — raised, bare and corded ── -->
      <rect x="18" y="9" width="6" height="5" fill="#150d08" />
      <rect x="19" y="10" width="4" height="3" fill="#8a6a4a" />
      <rect x="19" y="10" width="4" height="1" fill="#b08a6a" />
      <rect x="19" y="10" width="1" height="3" fill="#c49a72" />
      <rect x="21" y="6" width="5" height="5" fill="#150d08" />
      <rect x="22" y="7" width="3" height="3" fill="#8a6a4a" />
      <rect x="22" y="7" width="1" height="2" fill="#c49a72" />
      <rect x="24" y="8" width="1" height="2" fill="#6a4a2a" />
      <!-- fist on the whip-stock -->
      <rect x="23" y="4" width="4" height="4" fill="#150d08" />
      <rect x="24" y="5" width="2" height="2" fill="#b08a6a" />
      <rect x="24" y="5" width="1" height="1" fill="#d8b088" />
      <!-- iron arm-ring -->
      <rect x="19" y="12" width="4" height="1" fill="#5a5048" />
      <rect x="19" y="12" width="2" height="1" fill="#8a8a8a" />

      <!-- ── Off arm — knuckles wrapped, hanging ready ── -->
      <rect x="2" y="14" width="5" height="11" fill="#150d08" />
      <rect x="3" y="15" width="3" height="9" fill="#8a6a4a" />
      <rect x="3" y="15" width="1" height="9" fill="#b08a6a" />
      <rect x="5" y="15" width="1" height="9" fill="#6a4a2a" />
      <!-- wrapped fist -->
      <rect x="2" y="24" width="5" height="4" fill="#150d08" />
      <rect x="3" y="25" width="3" height="2" fill="#5a4838" />
      <rect x="3" y="25" width="3" height="1" fill="#7a6248" />
      <rect x="3" y="26" width="1" height="1" fill="#b08a6a" />

      <!-- ── Heavy belt ── -->
      <rect x="6" y="28" width="16" height="3" fill="#150d08" />
      <rect x="7" y="29" width="14" height="1" fill="#3a2e22" />
      <rect x="13" y="28" width="3" height="3" fill="#5a5048" />
      <rect x="13" y="29" width="2" height="1" fill="#8a8a8a" />

      <!-- ── Legs — breeches + wrapped shins ── -->
      <rect x="6" y="31" width="6" height="8" fill="#150d08" />
      <rect x="7" y="32" width="4" height="7" fill="#3a2a1a" />
      <rect x="7" y="32" width="1" height="7" fill="#4a3624" />
      <rect x="10" y="32" width="1" height="7" fill="#2a1e12" />
      <rect x="16" y="31" width="6" height="8" fill="#150d08" />
      <rect x="17" y="32" width="4" height="7" fill="#2e2014" />
      <rect x="17" y="32" width="1" height="7" fill="#3a2a1a" />
      <!-- shin wraps -->
      <rect x="7" y="35" width="4" height="1" fill="#5a4838" />
      <rect x="7" y="37" width="4" height="1" fill="#5a4838" />
      <rect x="17" y="35" width="4" height="1" fill="#4a3a2c" />
      <rect x="17" y="37" width="4" height="1" fill="#4a3a2c" />

      <!-- ── Iron-toed boots ── -->
      <rect x="5" y="39" width="8" height="4" fill="#150d08" />
      <rect x="6" y="40" width="6" height="2" fill="#2a1e12" />
      <rect x="6" y="40" width="6" height="1" fill="#3a2e22" />
      <rect x="6" y="41" width="2" height="1" fill="#6a6a4a" />
      <rect x="15" y="39" width="8" height="4" fill="#150d08" />
      <rect x="16" y="40" width="6" height="2" fill="#221809" />
      <rect x="16" y="40" width="6" height="1" fill="#2e2014" />
      <rect x="16" y="41" width="2" height="1" fill="#5a5a3c" />
    </svg>
