<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 49"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Veiled Enforcer"
    >
      <!-- Arcane backlight + ground shadow -->
      <ellipse cx="15" cy="23" rx="15" ry="22" fill="#8a6ad0" opacity="0.07" />
      <ellipse cx="15" cy="47.6" rx="10" ry="1.8" fill="#000" opacity="0.42" />

      <!-- ── Staff with silver finial — upright at the right ── -->
      <rect x="26" y="2" width="3" height="42" fill="#150d08" />
      <rect x="27" y="3" width="1" height="40" fill="#3a2418" />
      <rect x="27" y="3" width="1" height="14" fill="#5a3a22" />
      <!-- silver finial orb -->
      <rect x="25" y="0" width="5" height="5" fill="#150d08" />
      <rect x="26" y="1" width="3" height="3" fill="#9a9ab0" />
      <rect x="26" y="1" width="2" height="2" fill="#d8d8e8" />
      <rect x="26" y="1" width="1" height="1" fill="#ffffff" />
      <rect x="28" y="3" width="1" height="1" fill="#5a5a78" />

      <!-- ── Hood peak — stepped grey wedge ── -->
      <rect x="13" y="0" width="4" height="3" fill="#150d08" />
      <rect x="14" y="1" width="2" height="2" fill="#5a5868" />
      <rect x="14" y="1" width="1" height="1" fill="#7a7888" />
      <rect x="11" y="2" width="8" height="3" fill="#150d08" />
      <rect x="12" y="3" width="6" height="2" fill="#4a4858" />
      <rect x="12" y="3" width="3" height="1" fill="#6a6878" />
      <rect x="16" y="4" width="2" height="1" fill="#3a3848" />
      <!-- hood frame -->
      <rect x="8" y="5" width="14" height="8" fill="#150d08" />
      <rect x="9" y="6" width="12" height="6" fill="#4a4858" />
      <rect x="9" y="6" width="12" height="1" fill="#7a7888" />
      <rect x="9" y="6" width="3" height="6" fill="#5a5868" />
      <rect x="9" y="6" width="1" height="4" fill="#6a6878" />
      <rect x="18" y="7" width="3" height="5" fill="#3a3848" />
      <rect x="20" y="8" width="1" height="4" fill="#2a2838" />

      <!-- ── Silver full-mask — expressionless, hard speculars ── -->
      <rect x="10" y="7" width="10" height="8" fill="#150d08" />
      <rect x="11" y="8" width="8" height="6" fill="#b5b5c8" />
      <rect x="11" y="8" width="8" height="1" fill="#e8e8f0" />
      <rect x="11" y="8" width="2" height="5" fill="#d0d0e0" />
      <rect x="11" y="8" width="1" height="3" fill="#f4f4fa" />
      <rect x="17" y="9" width="2" height="5" fill="#8a8aa4" />
      <rect x="18" y="10" width="1" height="4" fill="#6a6a88" />
      <!-- black eye slits -->
      <rect x="12" y="10" width="3" height="1" fill="#0a0a18" />
      <rect x="16" y="10" width="3" height="1" fill="#0a0a18" />
      <rect x="12" y="9" width="3" height="1" fill="#8a8aa4" opacity="0.6" />
      <rect x="16" y="9" width="3" height="1" fill="#6a6a88" opacity="0.6" />
      <!-- mouth seam + chin -->
      <rect x="13" y="12" width="4" height="1" fill="#5a5a78" />
      <rect x="11" y="13" width="8" height="1" fill="#9a9ab0" />
      <rect x="11" y="13" width="3" height="1" fill="#d0d0e0" />

      <!-- ── Mantled shoulders ── -->
      <rect x="5" y="15" width="20" height="4" fill="#150d08" />
      <rect x="6" y="16" width="18" height="2" fill="#4a4858" />
      <rect x="6" y="16" width="18" height="1" fill="#6a6878" />
      <rect x="6" y="16" width="5" height="1" fill="#7a7888" />
      <rect x="21" y="16" width="3" height="2" fill="#2a2838" />

      <!-- ── Robe torso — slate ramp, deep center shadow ── -->
      <rect x="6" y="19" width="18" height="14" fill="#150d08" />
      <rect x="7" y="20" width="16" height="12" fill="#3a3848" />
      <rect x="7" y="20" width="16" height="1" fill="#5a5868" />
      <rect x="7" y="20" width="3" height="11" fill="#4a4858" />
      <rect x="7" y="20" width="1" height="11" fill="#5a5868" />
      <rect x="20" y="20" width="3" height="11" fill="#2a2838" />
      <rect x="22" y="21" width="1" height="10" fill="#1f1f2c" />
      <!-- center fold -->
      <rect x="14" y="20" width="2" height="12" fill="#2a2838" />
      <rect x="15" y="20" width="1" height="12" fill="#1f1f2c" />
      <!-- chest sigil-gem -->
      <ellipse cx="15" cy="24" rx="3.4" ry="3" fill="#8a6ad0" opacity="0.2" />
      <rect x="13" y="22" width="4" height="4" fill="#150d08" />
      <rect x="14" y="23" width="2" height="2" fill="#8a6ad0" />
      <rect x="14" y="23" width="2" height="1" fill="#c4a8ff" />
      <rect x="14" y="23" width="1" height="1" fill="#f0e4ff" />
      <!-- robe dither -->
      <rect x="10" y="26" width="1" height="1" fill="#4a4858" />
      <rect x="19" y="29" width="1" height="1" fill="#2a2838" />

      <!-- ── Left sleeve — wide, orb conjured under the cuff ── -->
      <rect x="2" y="18" width="6" height="9" fill="#150d08" />
      <rect x="3" y="19" width="4" height="7" fill="#3a3848" />
      <rect x="3" y="19" width="4" height="1" fill="#5a5868" />
      <rect x="3" y="19" width="1" height="7" fill="#4a4858" />
      <rect x="2" y="26" width="6" height="3" fill="#150d08" />
      <rect x="3" y="27" width="4" height="1" fill="#7a7888" />
      <rect x="3" y="28" width="3" height="1" fill="#d8c4a8" />
      <rect x="3" y="28" width="1" height="1" fill="#ece0c4" />
      <!-- conjured arcane orb below the open palm -->
      <circle cx="5" cy="33" r="4.4" fill="#8a6ad0" opacity="0.4" />
      <circle cx="5" cy="33" r="3" fill="#a88ae8" opacity="0.65" />
      <circle cx="5" cy="33" r="1.8" fill="#c4a8ff" opacity="0.9" />
      <rect x="4" y="32" width="2" height="2" fill="#e8dcff" />
      <rect x="4" y="32" width="1" height="1" fill="#ffffff" />
      <!-- orbiting spark motes -->
      <rect x="1" y="30" width="1" height="1" fill="#c4a8ff" opacity="0.7" />
      <rect x="8" y="35" width="1" height="1" fill="#a88ae8" opacity="0.6" />
      <rect x="2" y="36" width="1" height="1" fill="#8a6ad0" opacity="0.5" />

      <!-- ── Right sleeve — gripping the staff ── -->
      <rect x="22" y="18" width="6" height="9" fill="#150d08" />
      <rect x="23" y="19" width="4" height="7" fill="#2f2f3c" />
      <rect x="23" y="19" width="1" height="7" fill="#3a3848" />
      <rect x="23" y="26" width="5" height="3" fill="#150d08" />
      <rect x="24" y="27" width="3" height="1" fill="#6a6878" />
      <rect x="24" y="28" width="2" height="1" fill="#c4b08a" />

      <!-- ── Cinch belt — silver clasp ── -->
      <rect x="7" y="33" width="16" height="2" fill="#150d08" />
      <rect x="8" y="33" width="14" height="1" fill="#2a2838" />
      <rect x="13" y="33" width="3" height="2" fill="#9a9ab0" />
      <rect x="13" y="33" width="2" height="1" fill="#d8d8e8" />

      <!-- ── Robe skirt — long, scalloped hem ── -->
      <rect x="6" y="35" width="18" height="10" fill="#150d08" />
      <rect x="7" y="36" width="16" height="8" fill="#3a3848" />
      <rect x="7" y="36" width="16" height="1" fill="#5a5868" />
      <rect x="7" y="36" width="3" height="8" fill="#4a4858" />
      <rect x="7" y="36" width="1" height="6" fill="#5a5868" />
      <rect x="20" y="36" width="3" height="8" fill="#2a2838" />
      <rect x="22" y="37" width="1" height="7" fill="#1f1f2c" />
      <!-- fold shadows -->
      <rect x="11" y="37" width="1" height="7" fill="#2a2838" />
      <rect x="17" y="37" width="1" height="7" fill="#1f1f2c" />
      <!-- scalloped hem bites -->
      <rect x="9" y="43" width="2" height="2" fill="#150d08" />
      <rect x="14" y="43" width="2" height="2" fill="#150d08" />
      <rect x="19" y="43" width="2" height="2" fill="#150d08" />

      <!-- ── Boots under the hem ── -->
      <rect x="8" y="45" width="5" height="3" fill="#150d08" />
      <rect x="9" y="46" width="3" height="1" fill="#1a1828" />
      <rect x="17" y="45" width="5" height="3" fill="#150d08" />
      <rect x="18" y="46" width="3" height="1" fill="#14141f" />
    </svg>
