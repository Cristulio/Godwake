<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 22 34"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Asylum Fleshwright"
    >
      <!-- Cold clinical backlight + ground shadow -->
      <ellipse cx="11" cy="17" rx="10" ry="15" fill="#8a96a0" opacity="0.07" />
      <ellipse cx="11" cy="32" rx="7" ry="1.3" fill="#000" opacity="0.4" />

      <!-- High pale forehead — flesh ramp, key upper-left -->
      <rect x="7" y="2" width="8" height="7" fill="#c8c0b0" />
      <rect x="7" y="2" width="8" height="1" fill="#8a8276" />
      <rect x="7" y="3" width="8" height="1" fill="#d8d0c0" />
      <rect x="7" y="3" width="2" height="6" fill="#d2cabc" />
      <rect x="7" y="3" width="1" height="4" fill="#e2dacc" />
      <rect x="14" y="3" width="1" height="6" fill="#9a9286" />

      <!-- Spectacles pushed up on the brow -->
      <rect x="7" y="3" width="3" height="1" fill="#5a5a62" />
      <rect x="12" y="3" width="3" height="1" fill="#5a5a62" />
      <rect x="8" y="3" width="1" height="1" fill="#9aa6c0" opacity="0.7" />

      <!-- Sunken eyes + thin mouth -->
      <rect x="8" y="5" width="2" height="1" fill="#1a1a14" />
      <rect x="12" y="5" width="2" height="1" fill="#1a1a14" />
      <rect x="9" y="7" width="4" height="1" fill="#7a4a4a" />

      <!-- Blood-stiff apron over robe — ramp + stains -->
      <rect x="5" y="9" width="12" height="13" fill="#8a8278" />
      <rect x="7" y="9" width="8" height="13" fill="#b0a898" />
      <rect x="7" y="9" width="8" height="1" fill="#c4bcac" />
      <rect x="7" y="9" width="2" height="13" fill="#bcb4a4" />
      <rect x="7" y="9" width="1" height="8" fill="#cac2b2" />
      <rect x="13" y="9" width="2" height="13" fill="#9a9286" />
      <rect x="5" y="9" width="1" height="13" fill="#7a7268" />
      <!-- blood -->
      <rect x="9" y="11" width="1" height="2" fill="#7a1a0a" />
      <rect x="11" y="14" width="2" height="1" fill="#7a1a0a" />
      <rect x="8" y="17" width="2" height="1" fill="#7a1a0a" />
      <rect x="9" y="11" width="1" height="1" fill="#a83020" opacity="0.7" />
      <rect x="10" y="9" width="2" height="13" fill="#9a9286" />

      <!-- Bone-saw arm — toothed steel -->
      <rect x="16" y="11" width="3" height="6" fill="#8a8278" />
      <rect x="16" y="11" width="1" height="6" fill="#9a9286" />
      <rect x="18" y="9" width="1" height="8" fill="#3a2e22" />
      <rect x="19" y="9" width="2" height="9" fill="#c8c4b8" />
      <rect x="19" y="9" width="2" height="1" fill="#e8e4d8" />
      <rect x="19" y="10" width="2" height="1" fill="#9a968a" />
      <rect x="19" y="12" width="2" height="1" fill="#9a968a" />
      <rect x="19" y="14" width="2" height="1" fill="#9a968a" />
      <rect x="20" y="9" width="1" height="1" fill="#ffffff" />

      <!-- Gloved off-hand -->
      <rect x="2" y="11" width="3" height="8" fill="#8a8278" />
      <rect x="2" y="11" width="1" height="8" fill="#9a9286" />
      <rect x="2" y="18" width="3" height="2" fill="#c8c0b0" />
      <rect x="2" y="18" width="3" height="1" fill="#d8d0c0" />

      <!-- Legs -->
      <rect x="6" y="22" width="4" height="8" fill="#6a6258" />
      <rect x="12" y="22" width="4" height="8" fill="#6a6258" />
      <rect x="6" y="22" width="1" height="8" fill="#7a7268" />
      <rect x="9" y="22" width="1" height="8" fill="#5a5248" />
      <rect x="12" y="22" width="1" height="8" fill="#7a7268" />
      <rect x="15" y="22" width="1" height="8" fill="#5a5248" />

      <!-- Shoes -->
      <rect x="5" y="30" width="5" height="3" fill="#2a2620" />
      <rect x="12" y="30" width="5" height="3" fill="#2a2620" />
      <rect x="5" y="30" width="5" height="1" fill="#3a3630" />
      <rect x="12" y="30" width="5" height="1" fill="#3a3630" />
    </svg>
