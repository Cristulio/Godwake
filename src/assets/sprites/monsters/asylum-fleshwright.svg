<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 40 62"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Asylum Fleshwright"
    >
      <!-- Cold clinical backlight + ground shadow -->
      <ellipse cx="20" cy="30" rx="19" ry="27" fill="#8a96a0" opacity="0.08" />
      <ellipse cx="20" cy="59.6" rx="14" ry="2.2" fill="#000" opacity="0.45" />

      <!-- ══ The grafted third arm — rising over the shoulder ══ -->
      <rect x="27" y="8" width="6" height="6" fill="#150d08" />
      <rect x="28" y="9" width="4" height="4" fill="#9a8e7a" />
      <rect x="28" y="9" width="2" height="4" fill="#aaa08a" />
      <rect x="30" y="4" width="6" height="6" fill="#150d08" />
      <rect x="31" y="5" width="4" height="4" fill="#8a7e6a" />
      <rect x="31" y="5" width="2" height="4" fill="#9a8e7a" />
      <!-- its hand, holding a hooked needle -->
      <rect x="32" y="0" width="6" height="6" fill="#150d08" />
      <rect x="33" y="1" width="4" height="4" fill="#aaa08a" />
      <rect x="33" y="1" width="2" height="4" fill="#beb49a" />
      <rect x="36" y="2" width="3" height="1" fill="#b8c4ba" />
      <rect x="38" y="1" width="1" height="2" fill="#e0e8e0" />
      <!-- graft stitches where it meets the back -->
      <rect x="27" y="13" width="5" height="1" fill="#5a1208" />
      <rect x="28" y="12" width="1" height="3" fill="#5a1208" />
      <rect x="30" y="12" width="1" height="3" fill="#4a0e06" />

      <!-- ══ Bald stitched head ══ -->
      <rect x="11" y="2" width="16" height="16" fill="#150d08" />
      <rect x="12" y="3" width="14" height="14" fill="#c8c0b0" />
      <rect x="12" y="3" width="5" height="14" fill="#d8d2c0" />
      <rect x="12" y="3" width="2" height="9" fill="#e6e2d2" />
      <rect x="23" y="3" width="3" height="14" fill="#aaa292" />
      <rect x="25" y="3" width="1" height="14" fill="#948c7c" />
      <!-- the great scalp stitch -->
      <rect x="14" y="4" width="10" height="1" fill="#8a3424" />
      <rect x="15" y="3" width="1" height="3" fill="#5a1208" />
      <rect x="18" y="3" width="1" height="3" fill="#5a1208" />
      <rect x="21" y="3" width="1" height="3" fill="#4a0e06" />
      <!-- sunken intent eyes -->
      <rect x="14" y="8" width="4" height="3" fill="#1a1812" />
      <rect x="20" y="8" width="4" height="3" fill="#1a1812" />
      <rect x="15" y="9" width="2" height="1" fill="#b8d0d8" />
      <rect x="21" y="9" width="2" height="1" fill="#98b0b8" />
      <rect x="15" y="9" width="1" height="1" fill="#e8f4f8" />
      <rect x="21" y="9" width="1" height="1" fill="#c8dce4" />
      <!-- pinched nose + thin smiling mouth -->
      <rect x="18" y="10" width="2" height="3" fill="#aaa292" />
      <rect x="14" y="14" width="9" height="1" fill="#6e6454" />
      <rect x="14" y="13" width="2" height="1" fill="#6e6454" />
      <rect x="21" y="13" width="2" height="1" fill="#6e6454" />
      <!-- cheek stitch -->
      <rect x="22" y="11" width="1" height="3" fill="#8a3424" />

      <!-- ══ Blood-stained apron over robes ══ -->
      <rect x="8" y="18" width="24" height="26" fill="#150d08" />
      <rect x="9" y="19" width="22" height="24" fill="#5a5448" />
      <rect x="9" y="19" width="7" height="24" fill="#6a6454" />
      <rect x="9" y="19" width="3" height="18" fill="#7a7462" />
      <rect x="26" y="19" width="5" height="24" fill="#4a4438" />
      <rect x="29" y="19" width="2" height="24" fill="#3c362c" />
      <!-- apron bib + straps -->
      <rect x="13" y="19" width="14" height="20" fill="#8a8270" />
      <rect x="13" y="19" width="5" height="20" fill="#9a9280" />
      <rect x="24" y="19" width="3" height="20" fill="#7a7260" />
      <rect x="12" y="19" width="1" height="20" fill="#3c362c" />
      <rect x="27" y="19" width="1" height="20" fill="#3c362c" />
      <!-- blood stains, old and new -->
      <rect x="15" y="22" width="3" height="2" fill="#5a1208" opacity="0.85" />
      <rect x="20" y="26" width="4" height="3" fill="#4a0e06" opacity="0.9" />
      <rect x="14" y="30" width="2" height="4" fill="#5a1208" opacity="0.7" />
      <rect x="22" y="33" width="3" height="2" fill="#6e1a0e" opacity="0.8" />
      <rect x="18" y="36" width="2" height="2" fill="#4a0e06" opacity="0.7" />
      <!-- tool loops on the apron -->
      <rect x="14" y="20" width="1" height="3" fill="#2e2014" />
      <rect x="17" y="20" width="1" height="3" fill="#2e2014" />
      <!-- small hooked tools in the loops -->
      <rect x="14" y="18" width="1" height="2" fill="#b8c4ba" />
      <rect x="17" y="18" width="1" height="2" fill="#9aa89e" />

      <!-- ══ Left arm — raising the bone-saw ══ -->
      <rect x="4" y="19" width="7" height="7" fill="#150d08" />
      <rect x="5" y="20" width="5" height="5" fill="#6a6454" />
      <rect x="5" y="20" width="2" height="5" fill="#7a7462" />
      <rect x="2" y="24" width="7" height="8" fill="#150d08" />
      <rect x="3" y="25" width="5" height="6" fill="#c8c0b0" />
      <rect x="3" y="25" width="2" height="6" fill="#d8d2c0" />
      <!-- gripping hand -->
      <rect x="2" y="30" width="7" height="5" fill="#150d08" />
      <rect x="3" y="31" width="5" height="3" fill="#beb49a" />
      <rect x="3" y="31" width="2" height="3" fill="#d0c6ac" />
      <!-- the bone-saw — flat blade with teeth -->
      <rect x="0" y="35" width="12" height="5" fill="#150d08" />
      <rect x="1" y="36" width="10" height="3" fill="#8a96a0" />
      <rect x="1" y="36" width="10" height="1" fill="#b0bcc4" />
      <rect x="1" y="36" width="4" height="1" fill="#d0dce2" />
      <!-- saw teeth -->
      <rect x="1" y="39" width="1" height="1" fill="#d0dce2" />
      <rect x="3" y="39" width="1" height="1" fill="#b0bcc4" />
      <rect x="5" y="39" width="1" height="1" fill="#b0bcc4" />
      <rect x="7" y="39" width="1" height="1" fill="#9aa6ae" />
      <rect x="9" y="39" width="1" height="1" fill="#9aa6ae" />
      <!-- dried blood on the saw -->
      <rect x="6" y="37" width="3" height="1" fill="#5a1208" opacity="0.8" />

      <!-- ══ Right arm — flesh-sample jar ══ -->
      <rect x="29" y="19" width="7" height="8" fill="#150d08" />
      <rect x="30" y="20" width="5" height="6" fill="#4a4438" />
      <rect x="30" y="20" width="2" height="6" fill="#5a5448" />
      <rect x="30" y="26" width="7" height="7" fill="#150d08" />
      <rect x="31" y="27" width="5" height="5" fill="#aaa08a" />
      <rect x="31" y="27" width="2" height="5" fill="#beb49a" />
      <!-- the jar — murky glass, something inside -->
      <rect x="30" y="32" width="8" height="9" fill="#150d08" />
      <rect x="31" y="33" width="6" height="7" fill="#3a4a44" />
      <rect x="31" y="33" width="2" height="7" fill="#4a5e54" />
      <rect x="31" y="33" width="6" height="1" fill="#6a8278" />
      <!-- the specimen -->
      <rect x="33" y="35" width="2" height="3" fill="#8a6a5e" />
      <rect x="33" y="35" width="1" height="1" fill="#a8847a" />
      <!-- jar lid -->
      <rect x="31" y="31" width="6" height="2" fill="#2e2a38" />
      <rect x="31" y="31" width="2" height="1" fill="#4a4654" />

      <!-- ══ Robe hem ══ -->
      <rect x="8" y="44" width="24" height="3" fill="#3c362c" />
      <rect x="9" y="47" width="22" height="9" fill="#150d08" />
      <rect x="10" y="48" width="20" height="7" fill="#4a4438" />
      <rect x="10" y="48" width="6" height="7" fill="#5a5448" />
      <rect x="25" y="48" width="5" height="7" fill="#3c362c" />
      <rect x="16" y="48" width="1" height="7" fill="#3c362c" />
      <rect x="23" y="48" width="1" height="7" fill="#332e24" />
      <rect x="10" y="54" width="20" height="1" fill="#26221a" />

      <!-- ══ Worn shoes ══ -->
      <rect x="12" y="55" width="7" height="4" fill="#150d08" />
      <rect x="13" y="56" width="5" height="2" fill="#2e2014" />
      <rect x="21" y="55" width="7" height="4" fill="#150d08" />
      <rect x="22" y="56" width="5" height="2" fill="#241808" />

      <!-- clinical motes -->
      <rect x="6" y="12" width="1" height="1" fill="#b8d0d8" opacity="0.5" />
      <rect x="35" y="46" width="1" height="1" fill="#98b0b8" opacity="0.4" />
    </svg>
