<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 42"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Hoarding Fiend of Greed"
    >
      <!-- Avarice-gold backlight + ground shadow -->
      <ellipse cx="16" cy="24" rx="15" ry="18" fill="#c0a040" opacity="0.08" />
      <ellipse cx="16" cy="39" rx="13" ry="1.8" fill="#000" opacity="0.45" />

      <!-- Bloated belly — fiend ramp, key light upper-left -->
      <ellipse cx="16" cy="27" rx="14" ry="13" fill="#5a3a10" />
      <ellipse cx="16" cy="26" rx="13" ry="12" fill="#6a4612" />
      <ellipse cx="14" cy="24" rx="10" ry="9" fill="#7a4e14" opacity="0.7" />
      <ellipse cx="12" cy="22" rx="6" ry="5" fill="#8a5e1c" opacity="0.55" />
      <ellipse cx="22" cy="32" rx="9" ry="7" fill="#3a2408" opacity="0.5" />

      <!-- Coins heaped on the gut — gold ramp + specular -->
      <rect x="6" y="30" width="3" height="3" fill="#c0a040" />
      <rect x="6" y="30" width="3" height="1" fill="#f4d042" />
      <rect x="11" y="33" width="3" height="3" fill="#9a7e2e" />
      <rect x="11" y="33" width="3" height="1" fill="#c0a040" />
      <rect x="18" y="32" width="3" height="3" fill="#c0a040" />
      <rect x="18" y="32" width="3" height="1" fill="#f4d042" />
      <rect x="23" y="29" width="3" height="3" fill="#9a7e2e" />
      <rect x="23" y="29" width="3" height="1" fill="#c0a040" />
      <rect x="9" y="27" width="2" height="2" fill="#f4d042" opacity="0.85" />
      <rect x="21" y="26" width="2" height="2" fill="#f4d042" opacity="0.85" />
      <rect x="15" y="34" width="3" height="3" fill="#c0a040" />
      <rect x="15" y="34" width="1" height="1" fill="#fff0b0" />
      <rect x="19" y="32" width="1" height="1" fill="#fff0b0" />
      <!-- Set gem in the pile -->
      <polygon points="14,22 16,18 18,22 16,24" fill="#f4d042" opacity="0.75" />
      <polygon points="15,21 16,19 17,21 16,23" fill="#fff0b0" opacity="0.7" />

      <!-- Head — fiend ramp -->
      <rect x="11" y="4" width="10" height="8" fill="#7a4e14" />
      <rect x="11" y="4" width="10" height="2" fill="#9a6a1e" />
      <rect x="11" y="4" width="2" height="8" fill="#8a5e1c" />
      <rect x="11" y="4" width="1" height="5" fill="#a87a28" />
      <rect x="19" y="4" width="2" height="8" fill="#5a3a10" />
      <!-- Horns -->
      <polygon points="11,4 9,0 13,3" fill="#3a2408" />
      <polygon points="21,4 23,0 19,3" fill="#3a2408" />
      <polygon points="11,4 9,0 11,2" fill="#5a3a10" opacity="0.7" />
      <!-- Greedy gold eyes + spec -->
      <rect x="12" y="7" width="3" height="2" fill="#f4d042" />
      <rect x="17" y="7" width="3" height="2" fill="#f4d042" />
      <rect x="12" y="7" width="1" height="1" fill="#fff0b0" />
      <rect x="17" y="7" width="1" height="1" fill="#fff0b0" />
      <rect x="14" y="8" width="1" height="1" fill="#a8801e" />
      <rect x="19" y="8" width="1" height="1" fill="#a8801e" />
      <!-- Fanged grin -->
      <rect x="12" y="10" width="8" height="2" fill="#2a1a06" />
      <rect x="13" y="10" width="1" height="2" fill="#f4d042" />
      <rect x="15" y="10" width="1" height="2" fill="#e8dcc4" />
      <rect x="18" y="10" width="1" height="2" fill="#f4d042" />

      <!-- Arms + greedy claws -->
      <rect x="3" y="16" width="6" height="11" fill="#6a4612" />
      <rect x="3" y="16" width="2" height="11" fill="#7a4e14" />
      <rect x="3" y="16" width="1" height="9" fill="#8a5e1c" />
      <rect x="2" y="24" width="5" height="3" fill="#7a4e14" />
      <polygon points="2,26 3,30 6,28" fill="#2a1a06" />
      <rect x="23" y="16" width="6" height="11" fill="#6a4612" />
      <rect x="28" y="16" width="1" height="11" fill="#3a2408" />
      <rect x="25" y="24" width="5" height="3" fill="#7a4e14" />
      <rect x="26" y="26" width="2" height="2" fill="#f4d042" opacity="0.7" />

      <!-- Legs / feet -->
      <rect x="9" y="36" width="6" height="5" fill="#5a3a10" />
      <rect x="17" y="36" width="6" height="5" fill="#5a3a10" />
      <rect x="9" y="36" width="1" height="5" fill="#6a4612" />
      <rect x="17" y="36" width="1" height="5" fill="#6a4612" />
      <rect x="8" y="40" width="8" height="2" fill="#2a1a06" />
      <rect x="17" y="40" width="8" height="2" fill="#2a1a06" />

      <!-- Glint motes -->
      <rect x="5" y="20" width="1" height="1" fill="#f4d042" opacity="0.6" />
      <rect x="27" y="20" width="1" height="1" fill="#f4d042" opacity="0.5" />
    </svg>
