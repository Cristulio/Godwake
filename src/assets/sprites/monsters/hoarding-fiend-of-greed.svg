<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 42 50"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Hoarding Fiend of Greed"
    >
      <!-- Hoard-glow backlight + heavy ground shadow -->
      <ellipse cx="21" cy="28" rx="20" ry="20" fill="#c89a48" opacity="0.06" />
      <ellipse cx="21" cy="48.3" rx="16" ry="1.9" fill="#000" opacity="0.46" />

      <!-- Head — small, sunken into the swell, crown grown into the skull -->
      <rect x="15" y="3" width="12" height="9" fill="#150d08" />
      <rect x="16" y="4" width="10" height="7" fill="#5a3028" />
      <rect x="16" y="4" width="10" height="1" fill="#7a4438" />
      <rect x="16" y="4" width="4" height="1" fill="#96584a" />
      <rect x="16" y="4" width="1" height="5" fill="#7a4438" />
      <rect x="24" y="5" width="2" height="6" fill="#48241e" />
      <!-- the crown it ate, fused at the brow -->
      <rect x="14" y="1" width="14" height="3" fill="#150d08" />
      <rect x="15" y="2" width="12" height="1" fill="#9a7232" />
      <rect x="15" y="2" width="5" height="1" fill="#c89a48" />
      <rect x="16" y="1" width="2" height="1" fill="#ecc46a" />
      <rect x="21" y="1" width="2" height="1" fill="#c89a48" />
      <rect x="25" y="1" width="2" height="1" fill="#9a7232" />
      <!-- coin-slot eyes, gold-hungry -->
      <rect x="17" y="6" width="3" height="2" fill="#1a1206" />
      <rect x="22" y="6" width="3" height="2" fill="#1a1206" />
      <rect x="18" y="6" width="2" height="1" fill="#ecc46a" />
      <rect x="23" y="6" width="2" height="1" fill="#ecc46a" />
      <rect x="18" y="6" width="1" height="1" fill="#fff0b8" />
      <rect x="23" y="6" width="1" height="1" fill="#fff0b8" />
      <!-- the maw — it eats the trove, it will eat you -->
      <rect x="17" y="9" width="8" height="3" fill="#150d08" />
      <rect x="18" y="9" width="6" height="2" fill="#2e0c12" />
      <!-- coin caught in the teeth -->
      <rect x="19" y="9" width="1" height="1" fill="#d4c8a8" />
      <rect x="22" y="9" width="1" height="1" fill="#d4c8a8" />
      <rect x="20" y="10" width="2" height="1" fill="#c89a48" />

      <!-- The swell — a belly that is mostly hoard -->
      <rect x="7" y="12" width="28" height="24" fill="#150d08" />
      <rect x="8" y="13" width="26" height="22" fill="#5a3028" />
      <rect x="8" y="13" width="26" height="1" fill="#7a4438" />
      <rect x="8" y="13" width="9" height="1" fill="#96584a" />
      <rect x="8" y="13" width="3" height="22" fill="#683a30" />
      <rect x="8" y="13" width="1" height="14" fill="#7a4438" />
      <rect x="30" y="13" width="4" height="22" fill="#48241e" />
      <rect x="33" y="13" width="1" height="22" fill="#3a1c18" />
      <!-- stretch-seams over the swallowed trove -->
      <rect x="12" y="16" width="18" height="1" fill="#48241e" />
      <rect x="10" y="22" width="22" height="1" fill="#48241e" />
      <rect x="12" y="28" width="18" height="1" fill="#48241e" />
      <!-- the gold crust — coins fused through the hide -->
      <rect x="13" y="18" width="3" height="2" fill="#150d08" />
      <rect x="13" y="18" width="2" height="1" fill="#c89a48" />
      <rect x="13" y="18" width="1" height="1" fill="#ecc46a" />
      <rect x="19" y="19" width="3" height="2" fill="#150d08" />
      <rect x="19" y="19" width="2" height="1" fill="#ecc46a" />
      <rect x="20" y="20" width="1" height="1" fill="#9a7232" />
      <rect x="25" y="18" width="3" height="2" fill="#150d08" />
      <rect x="25" y="18" width="2" height="1" fill="#9a7232" />
      <rect x="25" y="18" width="1" height="1" fill="#c89a48" />
      <rect x="15" y="24" width="3" height="2" fill="#150d08" />
      <rect x="15" y="24" width="2" height="1" fill="#ecc46a" />
      <rect x="22" y="25" width="3" height="2" fill="#150d08" />
      <rect x="22" y="25" width="2" height="1" fill="#c89a48" />
      <rect x="27" y="23" width="3" height="2" fill="#150d08" />
      <rect x="27" y="23" width="2" height="1" fill="#9a7232" />
      <rect x="18" y="30" width="3" height="2" fill="#150d08" />
      <rect x="18" y="30" width="2" height="1" fill="#c89a48" />
      <rect x="18" y="30" width="1" height="1" fill="#fff0b8" />
      <rect x="24" y="31" width="3" height="2" fill="#150d08" />
      <rect x="24" y="31" width="2" height="1" fill="#9a7232" />
      <rect x="11" y="30" width="3" height="2" fill="#150d08" />
      <rect x="11" y="30" width="2" height="1" fill="#ecc46a" opacity="0.9" />
      <!-- a gem it is especially proud of, set where a heart would be -->
      <rect x="20" y="14" width="3" height="3" fill="#150d08" />
      <rect x="21" y="15" width="1" height="1" fill="#7e1f2c" />
      <rect x="21" y="15" width="1" height="1" fill="#c84a64" opacity="0.8" />

      <!-- Grasping arm — a fistful of fused treasure -->
      <rect x="32" y="14" width="8" height="6" fill="#150d08" />
      <rect x="33" y="15" width="6" height="4" fill="#5a3028" />
      <rect x="33" y="15" width="6" height="1" fill="#7a4438" />
      <rect x="37" y="16" width="2" height="3" fill="#48241e" />
      <!-- the treasure-fist — coins, a cup, a blade-hilt, all one lump -->
      <rect x="33" y="20" width="9" height="9" fill="#150d08" />
      <rect x="34" y="21" width="7" height="7" fill="#9a7232" />
      <rect x="34" y="21" width="7" height="1" fill="#c89a48" />
      <rect x="34" y="21" width="3" height="1" fill="#ecc46a" />
      <rect x="34" y="21" width="1" height="5" fill="#c89a48" />
      <rect x="39" y="22" width="2" height="6" fill="#7a5a26" />
      <!-- the cup sticking out -->
      <rect x="35" y="22" width="2" height="2" fill="#ecc46a" />
      <rect x="35" y="22" width="1" height="1" fill="#fff0b8" />
      <!-- the hilt sticking out -->
      <rect x="38" y="25" width="3" height="1" fill="#5a5058" />
      <rect x="38" y="25" width="1" height="1" fill="#7a7078" />
      <!-- coins dribbling from the grip -->
      <rect x="36" y="29" width="2" height="1" fill="#ecc46a" />
      <rect x="39" y="31" width="1" height="1" fill="#c89a48" />
      <rect x="35" y="33" width="1" height="1" fill="#9a7232" />

      <!-- Off arm clutched protectively over the swell -->
      <rect x="2" y="15" width="7" height="5" fill="#150d08" />
      <rect x="3" y="16" width="5" height="3" fill="#5a3028" />
      <rect x="3" y="16" width="5" height="1" fill="#7a4438" />
      <rect x="1" y="19" width="5" height="8" fill="#150d08" />
      <rect x="2" y="20" width="3" height="6" fill="#48241e" />
      <rect x="2" y="20" width="1" height="6" fill="#5a3028" />
      <!-- the clutching claw, knuckles gilt-scabbed -->
      <rect x="2" y="26" width="6" height="4" fill="#150d08" />
      <rect x="3" y="27" width="4" height="2" fill="#5a3028" />
      <rect x="3" y="27" width="2" height="1" fill="#7a4438" />
      <rect x="4" y="27" width="1" height="1" fill="#c89a48" />
      <rect x="6" y="28" width="1" height="1" fill="#ecc46a" />

      <!-- Stub legs — the hoard does the standing -->
      <rect x="10" y="36" width="9" height="9" fill="#150d08" />
      <rect x="11" y="37" width="7" height="7" fill="#48241e" />
      <rect x="11" y="37" width="7" height="1" fill="#5a3028" />
      <rect x="11" y="37" width="2" height="6" fill="#52291f" />
      <rect x="16" y="38" width="2" height="6" fill="#3a1c18" />
      <rect x="23" y="36" width="9" height="9" fill="#150d08" />
      <rect x="24" y="37" width="7" height="7" fill="#3f1f1a" />
      <rect x="24" y="37" width="7" height="1" fill="#48241e" />
      <rect x="29" y="38" width="2" height="6" fill="#321713" />
      <!-- gilt anklets sunk into the flesh -->
      <rect x="11" y="42" width="7" height="1" fill="#9a7232" />
      <rect x="12" y="42" width="2" height="1" fill="#c89a48" />
      <rect x="24" y="42" width="7" height="1" fill="#7a5a26" />
      <!-- splayed feet under the weight -->
      <rect x="8" y="45" width="11" height="3" fill="#150d08" />
      <rect x="9" y="46" width="9" height="1" fill="#3a1c18" />
      <rect x="9" y="46" width="4" height="1" fill="#48241e" />
      <rect x="23" y="45" width="11" height="3" fill="#150d08" />
      <rect x="24" y="46" width="9" height="1" fill="#321713" />
      <!-- toe-claws -->
      <rect x="7" y="47" width="2" height="1" fill="#150d08" />
      <rect x="7" y="47" width="1" height="1" fill="#d4c8a8" />
      <rect x="33" y="47" width="2" height="1" fill="#150d08" />
      <rect x="34" y="47" width="1" height="1" fill="#b4a692" />

      <!-- The spilling it cannot stop -->
      <rect x="5" y="33" width="1" height="1" fill="#ecc46a" opacity="0.6" />
      <rect x="37" y="37" width="1" height="1" fill="#c89a48" opacity="0.55" />
      <rect x="20" y="46" width="1" height="1" fill="#ecc46a" opacity="0.5" />
      <rect x="3" y="11" width="1" height="1" fill="#fff0b8" opacity="0.4" />
    </svg>
