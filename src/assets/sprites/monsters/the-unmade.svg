<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 44"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="The Unmade"
    >
      <!-- Void bloom backlight + ground shadow -->
      <ellipse cx="16" cy="22" rx="16" ry="21" fill="#3a1a6a" opacity="0.12" />
      <ellipse cx="16" cy="20" rx="10" ry="14" fill="#2a4a6a" opacity="0.08" />
      <ellipse cx="16" cy="42" rx="11" ry="1.7" fill="#000" opacity="0.42" />

      <!-- Sigil halo — gold rings + spokes, lit upper-left arc -->
      <circle cx="16" cy="22" r="15" fill="none" stroke="#d4b062" stroke-width="0.8" opacity="0.55" />
      <path d="M5 13 A15 15 0 0 1 27 11" fill="none" stroke="#f4d042" stroke-width="0.7" opacity="0.6" />
      <circle cx="16" cy="22" r="11" fill="none" stroke="#d4b062" stroke-width="0.6" opacity="0.5" />
      <line x1="16" y1="7" x2="16" y2="37" stroke="#f4d042" stroke-width="0.5" opacity="0.45" />
      <line x1="1" y1="22" x2="31" y2="22" stroke="#f4d042" stroke-width="0.5" opacity="0.45" />
      <line x1="5" y1="11" x2="27" y2="33" stroke="#f4d042" stroke-width="0.5" opacity="0.4" />
      <line x1="27" y1="11" x2="5" y2="33" stroke="#f4d042" stroke-width="0.5" opacity="0.4" />
      <line x1="9" y1="8" x2="23" y2="36" stroke="#f4d042" stroke-width="0.4" opacity="0.35" />
      <line x1="23" y1="8" x2="9" y2="36" stroke="#f4d042" stroke-width="0.4" opacity="0.35" />

      <!-- Void body — layered ramp -->
      <ellipse cx="16" cy="20" rx="9" ry="14" fill="#0e0a18" />
      <ellipse cx="16" cy="19" rx="8" ry="12" fill="#1a1230" />
      <ellipse cx="14" cy="16" rx="6" ry="6" fill="#241838" />
      <ellipse cx="13" cy="14" rx="3" ry="3" fill="#2a1e44" opacity="0.7" />
      <!-- Void dither -->
      <rect x="19" y="24" width="1" height="1" fill="#060410" />
      <rect x="12" y="27" width="1" height="1" fill="#1a1230" />
      <rect x="18" y="13" width="1" height="1" fill="#2a1e44" />

      <!-- Constellation of eyes -->
      <rect x="13" y="13" width="2" height="2" fill="#a48ee0" />
      <rect x="17" y="13" width="2" height="2" fill="#a48ee0" />
      <rect x="13" y="13" width="1" height="1" fill="#f4f0ff" />
      <rect x="17" y="13" width="1" height="1" fill="#f4f0ff" />
      <rect x="15" y="16" width="2" height="2" fill="#8ce0d0" opacity="0.85" />
      <rect x="15" y="16" width="1" height="1" fill="#d4fff0" />
      <rect x="11" y="18" width="2" height="2" fill="#a48ee0" opacity="0.55" />
      <rect x="19" y="18" width="2" height="2" fill="#a48ee0" opacity="0.55" />
      <rect x="14" y="21" width="2" height="2" fill="#a48ee0" opacity="0.45" />
      <rect x="17" y="24" width="2" height="2" fill="#8ce0d0" opacity="0.4" />

      <!-- Sigil-gold brow lights -->
      <rect x="10" y="10" width="2" height="1" fill="#f4d042" />
      <rect x="20" y="10" width="2" height="1" fill="#f4d042" />

      <!-- Void wings -->
      <polygon points="7,18 1,12 3,20" fill="#1a1230" />
      <polygon points="25,18 31,12 29,20" fill="#1a1230" />
      <polygon points="7,18 2,13 3,19" fill="#241838" opacity="0.6" />
      <rect x="0" y="11" width="2" height="2" fill="#0e0a18" />
      <rect x="30" y="11" width="2" height="2" fill="#0e0a18" />

      <!-- Lower void + dripping legs -->
      <rect x="8" y="32" width="16" height="3" fill="#0e0a18" />
      <polygon points="8,35 11,40 14,35" fill="#1a1230" />
      <polygon points="13,35 16,41 19,35" fill="#1a1230" />
      <polygon points="18,35 21,40 24,35" fill="#1a1230" />
      <rect x="10" y="40" width="4" height="3" fill="#0e0a18" />
      <rect x="18" y="40" width="4" height="3" fill="#0e0a18" />

      <!-- Crowning sigil spark -->
      <rect x="14" y="0" width="4" height="3" fill="#f4d042" opacity="0.5" />
      <rect x="15" y="-1" width="2" height="2" fill="#f4f0ff" opacity="0.75" />
    </svg>
