      <rect x="8" y="27" width="5" height="2" fill="#0e0a18" />
      <rect x="42" y="24" width="8" height="3" fill="#060410" />
      <rect x="46" y="21" width="7" height="4" fill="#0e0a18" />
      <rect x="50" y="18" width="5" height="4" fill="#1a1230" />
      <rect x="43" y="27" width="5" height="2" fill="#0e0a18" />

