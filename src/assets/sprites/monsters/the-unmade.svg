      <rect x="17" y="66" width="2" height="4" fill="#0e0a18" opacity="0.85" />
      <rect x="21" y="59" width="3" height="11" fill="#060410" />
      <rect x="22" y="70" width="2" height="3" fill="#0e0a18" opacity="0.7" />
