<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 22 34"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Famished Ghast"
    >
      <!-- Cold grave backlight + ground shadow -->
      <ellipse cx="11" cy="17" rx="10" ry="15" fill="#4a8278" opacity="0.07" />
      <ellipse cx="11" cy="33" rx="7" ry="1.3" fill="#000" opacity="0.4" />

      <!-- Gaunt head — necrotic ramp, key upper-left -->
      <rect x="7" y="2" width="8" height="7" fill="#8a8a72" />
      <rect x="7" y="2" width="8" height="1" fill="#9a9a82" />
      <rect x="7" y="2" width="2" height="6" fill="#9a9a82" />
      <rect x="7" y="2" width="1" height="4" fill="#aeae94" />
      <rect x="13" y="3" width="2" height="6" fill="#5a5a48" />
      <rect x="6" y="4" width="1" height="3" fill="#4a6a64" opacity="0.6" />
      <rect x="15" y="4" width="1" height="3" fill="#3a3a30" />

      <!-- Hollow eyes — hungry amber glow + spark -->
      <rect x="7" y="4" width="3" height="3" fill="#0a0a08" />
      <rect x="12" y="4" width="3" height="3" fill="#0a0a08" />
      <rect x="8" y="5" width="1" height="1" fill="#d4a430" />
      <rect x="13" y="5" width="1" height="1" fill="#d4a430" />
      <rect x="8" y="5" width="1" height="1" fill="#ffd070" opacity="0.6" />

      <!-- Unhinged jaw + teeth -->
      <rect x="7" y="8" width="8" height="3" fill="#14110d" />
      <rect x="8" y="8" width="1" height="2" fill="#d4c8a8" />
      <rect x="10" y="8" width="1" height="3" fill="#e8dcc4" />
      <rect x="12" y="8" width="1" height="2" fill="#a89878" />
      <rect x="9" y="10" width="1" height="1" fill="#d4c8a8" />
      <rect x="11" y="10" width="1" height="1" fill="#d4c8a8" />

      <!-- Starved ribcage torso — dark hollow with lit ribs -->
      <rect x="6" y="11" width="10" height="10" fill="#3a3a30" />
      <rect x="7" y="11" width="1" height="10" fill="#9a9a82" />
      <rect x="14" y="11" width="1" height="10" fill="#6a6a58" />
      <rect x="6" y="12" width="3" height="1" fill="#8a8a72" />
      <rect x="13" y="12" width="2" height="1" fill="#6a6a58" />
      <rect x="6" y="14" width="3" height="1" fill="#8a8a72" />
      <rect x="13" y="14" width="2" height="1" fill="#6a6a58" />
      <rect x="6" y="16" width="3" height="1" fill="#7a7a64" />
      <rect x="13" y="16" width="2" height="1" fill="#5a5a48" />
      <rect x="6" y="18" width="3" height="1" fill="#7a7a64" />
      <rect x="13" y="18" width="2" height="1" fill="#5a5a48" />
      <rect x="10" y="11" width="1" height="8" fill="#6a6a58" />

      <!-- Raking claws raised — necrotic ramp + dark talons -->
      <rect x="2" y="9" width="4" height="3" fill="#8a8a72" />
      <rect x="2" y="9" width="4" height="1" fill="#9a9a82" />
      <rect x="2" y="9" width="1" height="3" fill="#4a6a64" opacity="0.6" />
      <polygon points="1,12 0,14 2,13" fill="#3a3228" />
      <polygon points="2,12 2,15 3,13" fill="#3a3228" />
      <polygon points="4,12 4,15 5,13" fill="#3a3228" />
      <rect x="1" y="12" width="1" height="1" fill="#5a5248" />
      <rect x="16" y="9" width="4" height="3" fill="#8a8a72" />
      <rect x="16" y="9" width="4" height="1" fill="#9a9a82" />
      <rect x="19" y="9" width="1" height="3" fill="#3a3a30" />
      <polygon points="21,12 22,14 20,13" fill="#3a3228" />
      <polygon points="20,12 20,15 19,13" fill="#3a3228" />
      <polygon points="18,12 18,15 17,13" fill="#3a3228" />

      <!-- Spindly legs -->
      <rect x="7" y="21" width="3" height="9" fill="#8a8a72" />
      <rect x="7" y="21" width="1" height="9" fill="#9a9a82" />
      <rect x="12" y="21" width="3" height="9" fill="#8a8a72" />
      <rect x="14" y="21" width="1" height="9" fill="#5a5a48" />

      <!-- Taloned feet -->
      <rect x="6" y="30" width="5" height="2" fill="#6a6a58" />
      <rect x="11" y="30" width="5" height="2" fill="#6a6a58" />
      <rect x="6" y="30" width="5" height="1" fill="#8a8a72" />
      <rect x="11" y="30" width="5" height="1" fill="#7a7a64" />
      <polygon points="6,32 5,34 7,32" fill="#3a3228" />
      <polygon points="9,32 9,34 11,32" fill="#3a3228" />
      <polygon points="11,32 11,34 13,32" fill="#3a3228" />
      <polygon points="15,32 15,34 17,32" fill="#3a3228" />
    </svg>
