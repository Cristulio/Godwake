<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 46"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Famished Ghast"
    >
      <!-- Cold grave backlight + ground shadow -->
      <ellipse cx="15" cy="22" rx="14" ry="20" fill="#4a8278" opacity="0.08" />
      <ellipse cx="15" cy="44.6" rx="10" ry="1.7" fill="#000" opacity="0.4" />

      <!-- ── Raking claws thrown high — drawn first, behind the head ── -->
      <!-- left claw raised above the shoulder -->
      <rect x="1" y="4" width="6" height="5" fill="#150d08" />
      <rect x="2" y="5" width="4" height="3" fill="#9a9a82" />
      <rect x="2" y="5" width="2" height="2" fill="#aeae94" />
      <rect x="2" y="5" width="1" height="1" fill="#c6c6aa" />
      <!-- talons -->
      <rect x="1" y="2" width="1" height="3" fill="#150d08" />
      <rect x="3" y="1" width="1" height="4" fill="#150d08" />
      <rect x="5" y="2" width="1" height="3" fill="#150d08" />
      <rect x="1" y="3" width="1" height="1" fill="#d4c8a8" />
      <rect x="3" y="2" width="1" height="2" fill="#e8dcc4" />
      <rect x="5" y="3" width="1" height="1" fill="#d4c8a8" />
      <!-- left arm bone, wasted -->
      <rect x="2" y="8" width="5" height="10" fill="#150d08" />
      <rect x="3" y="9" width="3" height="8" fill="#8a8a72" />
      <rect x="3" y="9" width="1" height="8" fill="#aeae94" />
      <rect x="5" y="9" width="1" height="8" fill="#5a5a48" />

      <!-- right claw raised, shadow side -->
      <rect x="23" y="4" width="6" height="5" fill="#150d08" />
      <rect x="24" y="5" width="4" height="3" fill="#6a6a58" />
      <rect x="24" y="5" width="2" height="2" fill="#8a8a72" />
      <rect x="24" y="2" width="1" height="3" fill="#150d08" />
      <rect x="26" y="1" width="1" height="4" fill="#150d08" />
      <rect x="28" y="2" width="1" height="3" fill="#150d08" />
      <rect x="24" y="3" width="1" height="1" fill="#c2b794" />
      <rect x="26" y="2" width="1" height="2" fill="#d4c8a8" />
      <rect x="28" y="3" width="1" height="1" fill="#a89878" />
      <rect x="23" y="8" width="5" height="10" fill="#150d08" />
      <rect x="24" y="9" width="3" height="8" fill="#5a5a48" />
      <rect x="24" y="9" width="1" height="8" fill="#6a6a58" />
      <rect x="26" y="9" width="1" height="8" fill="#3a3a30" />
      <rect x="26" y="12" width="1" height="3" fill="#2e4a4e" />

      <!-- ── Gaunt head — necrotic ramp, key upper-left ── -->
      <rect x="8" y="1" width="14" height="11" fill="#150d08" />
      <rect x="9" y="2" width="12" height="9" fill="#8a8a72" />
      <rect x="9" y="2" width="12" height="1" fill="#9a9a82" />
      <rect x="9" y="2" width="3" height="8" fill="#9a9a82" />
      <rect x="9" y="2" width="1" height="5" fill="#c6c6aa" />
      <rect x="18" y="3" width="3" height="8" fill="#5a5a48" />
      <rect x="20" y="4" width="1" height="7" fill="#3a3a30" />
      <rect x="20" y="6" width="1" height="3" fill="#2e4a4e" />
      <!-- sunken temples + cheek pits -->
      <rect x="10" y="6" width="2" height="2" fill="#6a6a58" />
      <rect x="17" y="6" width="2" height="2" fill="#44443a" />
      <rect x="13" y="3" width="2" height="1" fill="#6a6a58" />

      <!-- ── Hollow eyes — starved amber blaze ── -->
      <rect x="9" y="4" width="4" height="3" fill="#0a0a08" />
      <rect x="16" y="4" width="4" height="3" fill="#0a0a08" />
      <rect x="10" y="5" width="2" height="1" fill="#d4a430" />
      <rect x="17" y="5" width="2" height="1" fill="#b08820" />
      <rect x="10" y="5" width="1" height="1" fill="#ffd070" />
      <rect x="17" y="5" width="1" height="1" fill="#f0b850" />
      <rect x="9" y="4" width="4" height="1" fill="#1a1208" />
      <rect x="16" y="4" width="4" height="1" fill="#1a1208" />

      <!-- pinched nasal slits -->
      <rect x="13" y="7" width="1" height="2" fill="#1a1a14" />
      <rect x="15" y="7" width="1" height="2" fill="#1a1a14" />

      <!-- ── UNHINGED jaw — dropped past the collarbone, lined with teeth ── -->
      <rect x="9" y="9" width="12" height="9" fill="#150d08" />
      <rect x="10" y="10" width="10" height="7" fill="#14110d" />
      <!-- upper teeth row -->
      <rect x="10" y="10" width="1" height="2" fill="#e8dcc4" />
      <rect x="12" y="10" width="1" height="3" fill="#f0e6cc" />
      <rect x="14" y="10" width="1" height="2" fill="#e8dcc4" />
      <rect x="16" y="10" width="1" height="3" fill="#d4c8a8" />
      <rect x="18" y="10" width="1" height="2" fill="#a89878" />
      <!-- black gullet -->
      <rect x="11" y="13" width="8" height="2" fill="#050403" />
      <!-- lower teeth on the dropped chin -->
      <rect x="10" y="15" width="1" height="2" fill="#d4c8a8" />
      <rect x="13" y="15" width="1" height="2" fill="#e8dcc4" />
      <rect x="16" y="15" width="1" height="2" fill="#c2b794" />
      <rect x="18" y="15" width="1" height="2" fill="#a89878" />
      <!-- chin rim -->
      <rect x="10" y="17" width="10" height="1" fill="#5a5a48" />
      <rect x="10" y="17" width="3" height="1" fill="#8a8a72" />
      <!-- grave-drool strand -->
      <rect x="14" y="18" width="1" height="2" fill="#a8c478" opacity="0.6" />

      <!-- ── Starved ribcage torso — every rib countable ── -->
      <rect x="7" y="18" width="16" height="13" fill="#150d08" />
      <rect x="8" y="19" width="14" height="11" fill="#3a3a30" />
      <!-- spine-side columns -->
      <rect x="8" y="19" width="2" height="11" fill="#8a8a72" />
      <rect x="8" y="19" width="1" height="11" fill="#aeae94" />
      <rect x="20" y="19" width="2" height="11" fill="#5a5a48" />
      <!-- rib bars -->
      <rect x="9" y="20" width="5" height="1" fill="#9a9a82" />
      <rect x="16" y="20" width="5" height="1" fill="#6a6a58" />
      <rect x="9" y="22" width="5" height="1" fill="#8a8a72" />
      <rect x="16" y="22" width="5" height="1" fill="#5a5a48" />
      <rect x="9" y="24" width="5" height="1" fill="#8a8a72" />
      <rect x="16" y="24" width="5" height="1" fill="#5a5a48" />
      <rect x="9" y="26" width="4" height="1" fill="#7a7a64" />
      <rect x="17" y="26" width="4" height="1" fill="#44443a" />
      <!-- sternum knuckle -->
      <rect x="14" y="19" width="2" height="9" fill="#6a6a58" />
      <rect x="14" y="19" width="1" height="9" fill="#7a7a64" />
      <!-- hollow gut shadow -->
      <rect x="10" y="28" width="10" height="2" fill="#22221c" />
      <rect x="12" y="29" width="6" height="1" fill="#1a1a14" />

      <!-- ── Rag scraps at the waist ── -->
      <rect x="7" y="31" width="16" height="4" fill="#150d08" />
      <rect x="8" y="32" width="14" height="2" fill="#3a2e22" />
      <rect x="8" y="32" width="14" height="1" fill="#52402e" />
      <rect x="11" y="33" width="1" height="3" fill="#2a1f16" />
      <rect x="15" y="33" width="1" height="2" fill="#2a1f16" />
      <rect x="18" y="33" width="1" height="3" fill="#2a1f16" />

      <!-- ── Spindly legs — knees locked wrong ── -->
      <rect x="8" y="35" width="5" height="8" fill="#150d08" />
      <rect x="9" y="36" width="3" height="7" fill="#8a8a72" />
      <rect x="9" y="36" width="1" height="7" fill="#9a9a82" />
      <rect x="11" y="36" width="1" height="7" fill="#5a5a48" />
      <rect x="9" y="38" width="3" height="1" fill="#44443a" />
      <rect x="17" y="35" width="5" height="8" fill="#150d08" />
      <rect x="18" y="36" width="3" height="7" fill="#6a6a58" />
      <rect x="18" y="36" width="1" height="7" fill="#8a8a72" />
      <rect x="20" y="36" width="1" height="7" fill="#44443a" />
      <rect x="18" y="38" width="3" height="1" fill="#3a3a30" />

      <!-- ── Long-toed feet, claws splayed ── -->
      <rect x="6" y="42" width="8" height="3" fill="#150d08" />
      <rect x="7" y="43" width="6" height="1" fill="#8a8a72" />
      <rect x="7" y="42" width="6" height="1" fill="#9a9a82" />
      <rect x="6" y="44" width="1" height="1" fill="#d4c8a8" />
      <rect x="9" y="44" width="1" height="1" fill="#e8dcc4" />
      <rect x="12" y="44" width="1" height="1" fill="#d4c8a8" />
      <rect x="16" y="42" width="8" height="3" fill="#150d08" />
      <rect x="17" y="43" width="6" height="1" fill="#5a5a48" />
      <rect x="17" y="42" width="6" height="1" fill="#6a6a58" />
      <rect x="16" y="44" width="1" height="1" fill="#c2b794" />
      <rect x="19" y="44" width="1" height="1" fill="#d4c8a8" />
      <rect x="22" y="44" width="1" height="1" fill="#a89878" />
    </svg>
