<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 28 36"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Rakshasa"
    >
      <!-- Warm fiend backlight + ground shadow -->
      <ellipse cx="14" cy="18" rx="14" ry="17" fill="#c87838" opacity="0.08" />
      <ellipse cx="14" cy="31" rx="11" ry="1.7" fill="#000" opacity="0.42" />

      <!-- Ears — fur ramp, inner shadow -->
      <polygon points="8,8 8,2 11,4" fill="#c87838" />
      <polygon points="20,8 20,2 17,4" fill="#a85c28" />
      <polygon points="8,8 8,3 10,4" fill="#d88a44" opacity="0.7" />
      <rect x="8" y="3" width="3" height="3" fill="#3a2410" />
      <rect x="17" y="3" width="3" height="3" fill="#3a2410" />

      <!-- Tiger face — fur ramp, key light upper-left -->
      <rect x="8" y="4" width="12" height="9" fill="#c87838" />
      <rect x="8" y="4" width="12" height="1" fill="#e89a52" />
      <rect x="8" y="4" width="3" height="9" fill="#d88a44" />
      <rect x="8" y="4" width="1" height="6" fill="#f0aa64" />
      <rect x="18" y="4" width="2" height="9" fill="#a85c28" />
      <rect x="19" y="5" width="1" height="7" fill="#8a4a1c" />
      <!-- Stripes -->
      <rect x="9" y="5" width="10" height="1" fill="#2a1808" />
      <rect x="9" y="7" width="2" height="1" fill="#2a1808" />
      <rect x="17" y="7" width="2" height="1" fill="#2a1808" />
      <!-- Burning gold eyes + spec -->
      <rect x="11" y="6" width="2" height="2" fill="#1a1008" />
      <rect x="15" y="6" width="2" height="2" fill="#1a1008" />
      <rect x="11" y="6" width="1" height="1" fill="#f0d050" />
      <rect x="15" y="6" width="1" height="1" fill="#f0d050" />
      <rect x="11" y="6" width="1" height="1" fill="#fff0a0" opacity="0.6" />
      <!-- Snout + nose + fangs -->
      <rect x="13" y="9" width="2" height="1" fill="#1a0c04" />
      <polygon points="11,10 17,10 14,13" fill="#3a1a10" />
      <rect x="11" y="11" width="1" height="2" fill="#f0e8d8" />
      <rect x="16" y="11" width="1" height="2" fill="#f0e8d8" />

      <!-- Crimson robe — silk ramp + gold bands -->
      <rect x="9" y="13" width="10" height="13" fill="#6a1828" />
      <rect x="9" y="13" width="10" height="1" fill="#8a2438" />
      <rect x="9" y="13" width="2" height="13" fill="#7e1e30" />
      <rect x="9" y="13" width="1" height="13" fill="#9a2e42" />
      <rect x="17" y="13" width="2" height="13" fill="#4e1020" />
      <rect x="18" y="14" width="1" height="12" fill="#3a0c14" />
      <rect x="13" y="14" width="2" height="12" fill="#8a2438" opacity="0.6" />
      <rect x="10" y="16" width="8" height="1" fill="#c0a040" opacity="0.6" />
      <rect x="10" y="20" width="8" height="1" fill="#c0a040" opacity="0.5" />
      <rect x="10" y="16" width="2" height="1" fill="#f0d050" opacity="0.6" />

      <!-- Arms + clawed paws -->
      <rect x="6" y="14" width="3" height="3" fill="#6a1828" />
      <rect x="6" y="14" width="1" height="3" fill="#7e1e30" />
      <rect x="3" y="15" width="3" height="2" fill="#c87838" />
      <rect x="3" y="15" width="3" height="1" fill="#d88a44" />
      <polygon points="3,15 1,13 2,17" fill="#f0e8d8" />
      <rect x="19" y="14" width="3" height="3" fill="#6a1828" />
      <rect x="21" y="14" width="1" height="3" fill="#4e1020" />
      <rect x="22" y="13" width="3" height="2" fill="#c87838" />
      <polygon points="25,13 27,11 26,15" fill="#f0e8d8" />

      <!-- Legs / feet -->
      <rect x="10" y="26" width="3" height="6" fill="#4e1020" />
      <rect x="15" y="26" width="3" height="6" fill="#4e1020" />
      <rect x="10" y="26" width="1" height="6" fill="#6a1828" />
      <rect x="15" y="26" width="1" height="6" fill="#6a1828" />
      <rect x="10" y="31" width="4" height="1" fill="#1a0c06" />
      <rect x="15" y="31" width="4" height="1" fill="#1a0c06" />

      <!-- Embers -->
      <rect x="6" y="11" width="1" height="1" fill="#f0d050" opacity="0.5" />
      <rect x="22" y="20" width="1" height="1" fill="#e89a52" opacity="0.45" />
    </svg>
