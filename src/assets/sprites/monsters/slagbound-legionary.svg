<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 36 42"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Slagbound Legionary"
    >
      <!-- Deep heat backlight + heavy ground shadow -->
      <ellipse cx="18" cy="24" rx="17" ry="17" fill="#a83a14" opacity="0.06" />
      <ellipse cx="18" cy="40.3" rx="13" ry="1.8" fill="#000" opacity="0.48" />

      <!-- Helm sunk straight into the shoulders — no neck left -->
      <rect x="12" y="2" width="12" height="9" fill="#150d08" />
      <rect x="13" y="3" width="10" height="7" fill="#3a3038" />
      <rect x="13" y="3" width="10" height="1" fill="#544a52" />
      <rect x="13" y="3" width="4" height="1" fill="#6a6068" />
      <rect x="13" y="3" width="2" height="7" fill="#4a4048" />
      <rect x="21" y="4" width="2" height="6" fill="#241c26" />
      <!-- crest mount melted over the crown -->
      <rect x="15" y="1" width="6" height="2" fill="#150d08" />
      <rect x="16" y="1" width="4" height="1" fill="#2a2028" />
      <rect x="16" y="1" width="1" height="1" fill="#4a4048" />
      <!-- visor recess — ember eyes far back in the dark -->
      <rect x="14" y="6" width="8" height="3" fill="#1a1410" />
      <rect x="15" y="7" width="2" height="1" fill="#d4641a" />
      <rect x="15" y="7" width="1" height="1" fill="#f4942a" />
      <rect x="19" y="7" width="2" height="1" fill="#d4641a" />
      <rect x="19" y="7" width="1" height="1" fill="#f4942a" />

      <!-- Pauldrons — sagged like cooled wax over both shoulders -->
      <rect x="3" y="8" width="12" height="8" fill="#150d08" />
      <rect x="4" y="9" width="10" height="6" fill="#42383f" />
      <rect x="4" y="9" width="10" height="1" fill="#5a5058" />
      <rect x="4" y="9" width="4" height="1" fill="#6a6068" />
      <rect x="4" y="9" width="1" height="5" fill="#544a52" />
      <rect x="4" y="13" width="3" height="2" fill="#332a31" />
      <!-- melt-drips frozen mid-fall -->
      <rect x="5" y="15" width="2" height="2" fill="#150d08" />
      <rect x="5" y="15" width="1" height="1" fill="#332a31" />
      <rect x="9" y="15" width="1" height="2" fill="#150d08" />
      <rect x="21" y="8" width="12" height="8" fill="#150d08" />
      <rect x="22" y="9" width="10" height="6" fill="#332a31" />
      <rect x="22" y="9" width="10" height="1" fill="#4a4048" />
      <rect x="29" y="10" width="3" height="5" fill="#241c26" />
      <rect x="27" y="15" width="2" height="2" fill="#150d08" />
      <rect x="27" y="15" width="1" height="1" fill="#241c26" />
      <rect x="31" y="14" width="1" height="3" fill="#150d08" />

      <!-- Torso — one cooled pour, plate and ribs run together -->
      <rect x="9" y="11" width="18" height="18" fill="#150d08" />
      <rect x="10" y="12" width="16" height="16" fill="#3a3038" />
      <rect x="10" y="12" width="16" height="1" fill="#4a4048" />
      <rect x="10" y="12" width="2" height="16" fill="#42383f" />
      <rect x="10" y="12" width="1" height="10" fill="#544a52" />
      <rect x="23" y="12" width="3" height="16" fill="#2a2028" />
      <rect x="25" y="12" width="1" height="16" fill="#241c26" />
      <!-- the old lorica ridges, half-melted, run sideways -->
      <rect x="11" y="15" width="13" height="1" fill="#2a2028" />
      <rect x="11" y="15" width="5" height="1" fill="#4a4048" />
      <rect x="11" y="18" width="13" height="1" fill="#2a2028" />
      <rect x="11" y="18" width="4" height="1" fill="#4a4048" />
      <rect x="11" y="21" width="13" height="1" fill="#2a2028" />
      <rect x="11" y="21" width="3" height="1" fill="#42383f" />
      <!-- a face shape half-swallowed in the chest pour -->
      <rect x="17" y="16" width="4" height="5" fill="#332a31" />
      <rect x="18" y="17" width="2" height="1" fill="#241c26" />
      <rect x="18" y="19" width="2" height="1" fill="#241c26" />
      <!-- deep heat in the core seams -->
      <rect x="13" y="23" width="10" height="1" fill="#6a1c0a" />
      <rect x="15" y="23" width="3" height="1" fill="#a83a14" />
      <rect x="16" y="23" width="1" height="1" fill="#d4641a" />
      <rect x="12" y="26" width="1" height="2" fill="#6a1c0a" />
      <rect x="22" y="25" width="1" height="3" fill="#6a1c0a" opacity="0.8" />

      <!-- Left arm — a hanging ingot ending in an anvil fist -->
      <rect x="2" y="16" width="7" height="14" fill="#150d08" />
      <rect x="3" y="17" width="5" height="12" fill="#3a3038" />
      <rect x="3" y="17" width="5" height="1" fill="#4a4048" />
      <rect x="3" y="17" width="1" height="10" fill="#544a52" />
      <rect x="7" y="17" width="1" height="12" fill="#2a2028" />
      <!-- slag drip line down the forearm -->
      <rect x="5" y="20" width="1" height="6" fill="#241c26" />
      <rect x="5" y="25" width="1" height="1" fill="#a83a14" opacity="0.7" />
      <!-- fist -->
      <rect x="1" y="29" width="8" height="7" fill="#150d08" />
      <rect x="2" y="30" width="6" height="5" fill="#332a31" />
      <rect x="2" y="30" width="6" height="1" fill="#4a4048" />
      <rect x="2" y="30" width="1" height="4" fill="#42383f" />
      <rect x="6" y="31" width="2" height="4" fill="#241c26" />
      <!-- knuckle seam with heat in it -->
      <rect x="3" y="32" width="4" height="1" fill="#6a1c0a" />
      <rect x="4" y="32" width="1" height="1" fill="#d4641a" />

      <!-- Right arm — drawn back, same dead weight -->
      <rect x="27" y="16" width="7" height="14" fill="#150d08" />
      <rect x="28" y="17" width="5" height="12" fill="#2e262c" />
      <rect x="28" y="17" width="5" height="1" fill="#42383f" />
      <rect x="31" y="18" width="2" height="11" fill="#241c26" />
      <rect x="30" y="21" width="1" height="5" fill="#1f181d" />
      <!-- fist -->
      <rect x="27" y="29" width="8" height="7" fill="#150d08" />
      <rect x="28" y="30" width="6" height="5" fill="#2a2028" />
      <rect x="28" y="30" width="6" height="1" fill="#3a3038" />
      <rect x="31" y="31" width="3" height="4" fill="#241c26" />
      <rect x="29" y="32" width="4" height="1" fill="#6a1c0a" opacity="0.8" />

      <!-- Skirt of fused tassets, drips at the hem -->
      <rect x="9" y="28" width="18" height="5" fill="#150d08" />
      <rect x="10" y="29" width="16" height="3" fill="#332a31" />
      <rect x="10" y="29" width="16" height="1" fill="#42383f" />
      <rect x="10" y="29" width="5" height="1" fill="#4a4048" />
      <rect x="22" y="30" width="4" height="2" fill="#241c26" />
      <rect x="12" y="32" width="2" height="2" fill="#150d08" />
      <rect x="12" y="32" width="1" height="1" fill="#2a2028" />
      <rect x="19" y="32" width="1" height="2" fill="#150d08" />
      <rect x="24" y="32" width="2" height="1" fill="#150d08" />

      <!-- Legs — short pillars, no hurry in them -->
      <rect x="10" y="32" width="7" height="8" fill="#150d08" />
      <rect x="11" y="33" width="5" height="6" fill="#3a3038" />
      <rect x="11" y="33" width="2" height="6" fill="#4a4048" />
      <rect x="14" y="33" width="2" height="6" fill="#2a2028" />
      <rect x="19" y="32" width="7" height="8" fill="#150d08" />
      <rect x="20" y="33" width="5" height="6" fill="#2e262c" />
      <rect x="20" y="33" width="1" height="6" fill="#3a3038" />
      <rect x="23" y="33" width="2" height="6" fill="#241c26" />
      <!-- heat split on the lead shin -->
      <rect x="12" y="35" width="1" height="3" fill="#6a1c0a" />
      <rect x="12" y="36" width="1" height="1" fill="#a83a14" />
      <!-- fused sabaton blocks -->
      <rect x="9" y="38" width="9" height="3" fill="#150d08" />
      <rect x="10" y="38" width="7" height="2" fill="#2a2028" />
      <rect x="10" y="38" width="3" height="1" fill="#3a3038" />
      <rect x="18" y="38" width="9" height="3" fill="#150d08" />
      <rect x="19" y="38" width="7" height="2" fill="#241c26" />
      <rect x="19" y="38" width="2" height="1" fill="#2a2028" />

      <!-- A few embers shaken loose by each step -->
      <rect x="7" y="34" width="1" height="1" fill="#f4942a" opacity="0.5" />
      <rect x="28" y="27" width="1" height="1" fill="#d4641a" opacity="0.45" />
      <rect x="25" y="37" width="1" height="1" fill="#a83a14" opacity="0.5" />
    </svg>
