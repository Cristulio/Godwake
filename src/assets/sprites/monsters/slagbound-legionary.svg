<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 28 32"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Slagbound Legionary"
    >
      <!-- Molten backlight + ground shadow -->
      <ellipse cx="14" cy="16" rx="13" ry="15" fill="#d4641a" opacity="0.08" />
      <ellipse cx="14" cy="30" rx="9" ry="1.6" fill="#000" opacity="0.42" />

      <!-- Scorched helm — charred ramp, key upper-left -->
      <rect x="9" y="1" width="10" height="8" fill="#4a3e34" />
      <rect x="9" y="1" width="10" height="1" fill="#5a4e42" />
      <rect x="9" y="1" width="3" height="8" fill="#5a4e42" />
      <rect x="9" y="1" width="1" height="5" fill="#6a5e50" />
      <rect x="17" y="1" width="2" height="8" fill="#3a3028" />
      <rect x="13" y="0" width="2" height="2" fill="#6a3a1a" />
      <!-- Visor + ember eyes + spark -->
      <rect x="10" y="6" width="8" height="2" fill="#120e0a" />
      <rect x="11" y="6" width="2" height="2" fill="#e87820" />
      <rect x="15" y="6" width="2" height="2" fill="#e87820" />
      <rect x="11" y="6" width="1" height="1" fill="#ffd070" />
      <rect x="15" y="6" width="1" height="1" fill="#ffd070" />

      <!-- Cuirass — charred ramp + glowing crack-seams + dither -->
      <rect x="6" y="9" width="16" height="15" fill="#3a3028" />
      <rect x="6" y="9" width="16" height="2" fill="#4a3e34" />
      <rect x="6" y="9" width="16" height="1" fill="#5a4e42" />
      <rect x="6" y="9" width="3" height="15" fill="#4a3e34" />
      <rect x="6" y="9" width="1" height="15" fill="#5a4e42" />
      <rect x="20" y="9" width="2" height="15" fill="#2a221c" />
      <rect x="11" y="11" width="6" height="13" fill="#2a221c" />
      <rect x="8" y="13" width="2" height="9" fill="#4a3e34" />
      <rect x="18" y="13" width="2" height="9" fill="#4a3e34" />
      <rect x="7" y="16" width="14" height="1" fill="#a83a14" opacity="0.7" />
      <rect x="9" y="19" width="10" height="1" fill="#e87820" opacity="0.5" />
      <rect x="13" y="12" width="2" height="6" fill="#d4641a" opacity="0.4" />
      <rect x="9" y="14" width="1" height="1" fill="#5a4e42" />
      <rect x="17" y="21" width="1" height="1" fill="#2a221c" />

      <!-- Left arm + ember-lit fist -->
      <rect x="1" y="11" width="6" height="13" fill="#4a3e34" />
      <rect x="1" y="11" width="6" height="1" fill="#5a4e42" />
      <rect x="1" y="11" width="1" height="13" fill="#5a4e42" />
      <rect x="2" y="14" width="4" height="4" fill="#2a221c" />
      <rect x="3" y="15" width="2" height="2" fill="#6a3a1a" />
      <rect x="3" y="15" width="1" height="1" fill="#e87820" opacity="0.7" />
      <rect x="0" y="20" width="3" height="3" fill="#3a3028" />

      <!-- Right arm + ember-charged weapon stub -->
      <rect x="22" y="12" width="5" height="4" fill="#3a3028" />
      <rect x="23" y="15" width="3" height="9" fill="#4a3e34" />
      <rect x="23" y="15" width="1" height="9" fill="#5a4e42" />
      <rect x="23" y="22" width="4" height="3" fill="#2a221c" />
      <rect x="24" y="22" width="2" height="2" fill="#e87820" opacity="0.75" />
      <rect x="24" y="22" width="1" height="1" fill="#ffd070" opacity="0.7" />

      <!-- Legs + ember stripes + boots -->
      <rect x="7" y="24" width="5" height="8" fill="#3a3028" />
      <rect x="16" y="24" width="5" height="8" fill="#3a3028" />
      <rect x="7" y="24" width="1" height="8" fill="#4a3e34" />
      <rect x="16" y="24" width="1" height="8" fill="#4a3e34" />
      <rect x="9" y="26" width="1" height="4" fill="#d4641a" opacity="0.5" />
      <rect x="18" y="26" width="1" height="4" fill="#d4641a" opacity="0.5" />
      <rect x="7" y="30" width="6" height="2" fill="#120e0a" />
      <rect x="16" y="30" width="6" height="2" fill="#120e0a" />
    </svg>
