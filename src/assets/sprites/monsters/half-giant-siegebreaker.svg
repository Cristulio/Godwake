<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 42 50"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Half-Giant Siegebreaker"
    >
      <!-- Siege-dust backlight + heavy ground shadow -->
      <ellipse cx="21" cy="27" rx="20" ry="21" fill="#d4641a" opacity="0.05" />
      <ellipse cx="21" cy="48.3" rx="16" ry="1.9" fill="#000" opacity="0.46" />

      <!-- Head — low, thick, behind the shoulder line -->
      <rect x="13" y="3" width="13" height="11" fill="#150d08" />
      <rect x="14" y="4" width="11" height="9" fill="#b08458" />
      <rect x="14" y="4" width="11" height="1" fill="#c89a68" />
      <rect x="14" y="4" width="4" height="1" fill="#dcb47c" />
      <rect x="14" y="4" width="2" height="8" fill="#bc9060" />
      <rect x="22" y="5" width="3" height="8" fill="#926842" />
      <rect x="24" y="5" width="1" height="8" fill="#785236" />
      <!-- scarred scalp, iron skull-cap -->
      <rect x="12" y="2" width="14" height="3" fill="#150d08" />
      <rect x="13" y="3" width="12" height="1" fill="#3a3038" />
      <rect x="13" y="3" width="5" height="1" fill="#4a4048" />
      <!-- small deep eyes under the heavy brow -->
      <rect x="15" y="7" width="8" height="1" fill="#785236" />
      <rect x="15" y="8" width="2" height="2" fill="#1a1410" />
      <rect x="20" y="8" width="2" height="2" fill="#1a1410" />
      <rect x="15" y="8" width="1" height="1" fill="#e8dcc4" />
      <rect x="20" y="8" width="1" height="1" fill="#e8dcc4" />
      <!-- broken nose + the set jaw -->
      <rect x="17" y="9" width="2" height="2" fill="#926842" />
      <rect x="15" y="12" width="8" height="1" fill="#785236" />
      <!-- tusk-teeth at the lip corners -->
      <rect x="15" y="11" width="1" height="2" fill="#e8dcc4" />
      <rect x="22" y="11" width="1" height="2" fill="#dcd0b4" />

      <!-- Shoulders — slabbed muscle in a scarred ox-harness -->
      <rect x="3" y="12" width="17" height="10" fill="#150d08" />
      <rect x="4" y="13" width="15" height="8" fill="#a87a4e" />
      <rect x="4" y="13" width="15" height="1" fill="#bc9060" />
      <rect x="4" y="13" width="6" height="1" fill="#cca26e" />
      <rect x="4" y="13" width="2" height="7" fill="#b08458" />
      <rect x="16" y="14" width="3" height="7" fill="#8a5e3c" />
      <rect x="22" y="12" width="17" height="10" fill="#150d08" />
      <rect x="23" y="13" width="15" height="8" fill="#926842" />
      <rect x="23" y="13" width="15" height="1" fill="#a87a4e" />
      <rect x="33" y="14" width="5" height="7" fill="#785236" />
      <rect x="37" y="14" width="1" height="7" fill="#64432a" />
      <!-- the harness strap across each shoulder -->
      <rect x="5" y="14" width="13" height="2" fill="#3a2c20" />
      <rect x="5" y="14" width="13" height="1" fill="#4a3a2a" />
      <rect x="24" y="15" width="13" height="2" fill="#32261b" />
      <rect x="9" y="14" width="1" height="2" fill="#7a7078" />
      <rect x="30" y="15" width="1" height="2" fill="#5a5058" />
      <!-- old wall-scars -->
      <rect x="7" y="17" width="3" height="1" fill="#785236" />
      <rect x="27" y="18" width="3" height="1" fill="#64432a" />

      <!-- Torso — bare slab over a riveted ram-belt -->
      <rect x="11" y="14" width="20" height="20" fill="#150d08" />
      <rect x="12" y="15" width="18" height="18" fill="#a87a4e" />
      <rect x="12" y="15" width="18" height="1" fill="#bc9060" />
      <rect x="12" y="15" width="7" height="1" fill="#cca26e" />
      <rect x="12" y="15" width="3" height="18" fill="#b08458" />
      <rect x="12" y="15" width="1" height="12" fill="#c89a68" />
      <rect x="27" y="15" width="3" height="18" fill="#8a5e3c" />
      <rect x="29" y="15" width="1" height="18" fill="#785236" />
      <!-- pectoral cut + the standing vein of the trade -->
      <rect x="13" y="19" width="6" height="1" fill="#8a5e3c" />
      <rect x="22" y="19" width="6" height="1" fill="#8a5e3c" />
      <rect x="20" y="16" width="2" height="8" fill="#926842" />
      <!-- rope-burn weals across the ribs -->
      <rect x="14" y="23" width="5" height="1" fill="#96584a" />
      <rect x="23" y="24" width="4" height="1" fill="#96584a" />
      <!-- the ram-belt — iron plates riveted on leather -->
      <rect x="12" y="28" width="18" height="4" fill="#150d08" />
      <rect x="13" y="29" width="16" height="2" fill="#3a2c20" />
      <rect x="13" y="29" width="16" height="1" fill="#4a3a2a" />
      <rect x="15" y="29" width="2" height="2" fill="#3a3038" />
      <rect x="20" y="29" width="2" height="2" fill="#4a4048" />
      <rect x="25" y="29" width="2" height="2" fill="#3a3038" />
      <rect x="15" y="29" width="1" height="1" fill="#6e6470" />
      <rect x="20" y="29" width="1" height="1" fill="#7a7078" />

      <!-- The ram-maul — a roof-beam with an iron head, over the shoulder -->
      <!-- haft running diagonally up behind the head -->
      <rect x="26" y="20" width="5" height="4" fill="#150d08" />
      <rect x="27" y="21" width="3" height="2" fill="#6a3a1a" />
      <rect x="27" y="21" width="3" height="1" fill="#8c5226" />
      <rect x="29" y="16" width="5" height="5" fill="#150d08" />
      <rect x="30" y="17" width="3" height="3" fill="#6a3a1a" />
      <rect x="30" y="17" width="1" height="3" fill="#8c5226" />
      <rect x="32" y="12" width="5" height="5" fill="#150d08" />
      <rect x="33" y="13" width="3" height="3" fill="#5a3018" />
      <rect x="33" y="13" width="1" height="3" fill="#6a3a1a" />
      <!-- the iron ram-head, scarred from gates -->
      <rect x="33" y="3" width="9" height="11" fill="#150d08" />
      <rect x="34" y="4" width="7" height="9" fill="#3a3038" />
      <rect x="34" y="4" width="7" height="1" fill="#5a5058" />
      <rect x="34" y="4" width="3" height="1" fill="#6e6470" />
      <rect x="34" y="4" width="1" height="7" fill="#4a4048" />
      <rect x="39" y="5" width="2" height="8" fill="#2a2028" />
      <rect x="40" y="5" width="1" height="8" fill="#241c26" />
      <!-- the striking face, peened over -->
      <rect x="34" y="12" width="7" height="2" fill="#241c26" />
      <rect x="34" y="12" width="3" height="1" fill="#3a3038" />
      <!-- binding rings on the head -->
      <rect x="34" y="7" width="7" height="1" fill="#241c26" />
      <rect x="34" y="7" width="2" height="1" fill="#5a5058" />
      <rect x="34" y="10" width="7" height="1" fill="#241c26" />
      <!-- gate-splinters still in the iron -->
      <rect x="36" y="5" width="1" height="1" fill="#8c5226" />
      <rect x="38" y="8" width="1" height="1" fill="#6a3a1a" />

      <!-- Both fists on the haft -->
      <rect x="25" y="22" width="6" height="4" fill="#150d08" />
      <rect x="26" y="23" width="4" height="2" fill="#b08458" />
      <rect x="26" y="23" width="4" height="1" fill="#c89a68" />
      <rect x="29" y="18" width="5" height="4" fill="#150d08" />
      <rect x="30" y="19" width="3" height="2" fill="#926842" />
      <rect x="30" y="19" width="2" height="1" fill="#a87a4e" />

      <!-- Off arm — hanging heavy, knuckles scarred -->
      <rect x="2" y="16" width="7" height="13" fill="#150d08" />
      <rect x="3" y="17" width="5" height="11" fill="#a87a4e" />
      <rect x="3" y="17" width="5" height="1" fill="#bc9060" />
      <rect x="3" y="17" width="2" height="10" fill="#b08458" />
      <rect x="3" y="17" width="1" height="6" fill="#c89a68" />
      <rect x="6" y="18" width="2" height="10" fill="#8a5e3c" />
      <!-- harness cuff -->
      <rect x="2" y="24" width="7" height="2" fill="#150d08" />
      <rect x="3" y="25" width="5" height="1" fill="#3a2c20" />
      <!-- the fist -->
      <rect x="1" y="28" width="8" height="7" fill="#150d08" />
      <rect x="2" y="29" width="6" height="5" fill="#926842" />
      <rect x="2" y="29" width="6" height="1" fill="#a87a4e" />
      <rect x="2" y="29" width="1" height="4" fill="#a87a4e" />
      <rect x="6" y="30" width="2" height="4" fill="#785236" />
      <!-- knuckle scars -->
      <rect x="3" y="31" width="4" height="1" fill="#96584a" />

      <!-- Legs — pillars in rope-bound wraps -->
      <rect x="12" y="34" width="9" height="11" fill="#150d08" />
      <rect x="13" y="35" width="7" height="9" fill="#4a3a2a" />
      <rect x="13" y="35" width="7" height="1" fill="#5e4a34" />
      <rect x="13" y="35" width="2" height="9" fill="#54422e" />
      <rect x="18" y="35" width="2" height="9" fill="#3a2c20" />
      <rect x="21" y="34" width="9" height="11" fill="#150d08" />
      <rect x="22" y="35" width="7" height="9" fill="#3e2f22" />
      <rect x="22" y="35" width="1" height="9" fill="#4a3a2a" />
      <rect x="27" y="35" width="2" height="9" fill="#32261b" />
      <!-- rope bindings -->
      <rect x="13" y="38" width="7" height="1" fill="#8a7050" />
      <rect x="13" y="38" width="3" height="1" fill="#a8845e" />
      <rect x="22" y="39" width="7" height="1" fill="#6a5440" />
      <rect x="13" y="42" width="7" height="1" fill="#8a7050" />
      <rect x="22" y="42" width="7" height="1" fill="#6a5440" />
      <!-- bare slab feet -->
      <rect x="10" y="45" width="11" height="3" fill="#150d08" />
      <rect x="11" y="46" width="9" height="1" fill="#926842" />
      <rect x="11" y="46" width="4" height="1" fill="#a87a4e" />
      <rect x="21" y="45" width="11" height="3" fill="#150d08" />
      <rect x="22" y="46" width="9" height="1" fill="#785236" />
      <!-- toes -->
      <rect x="9" y="46" width="2" height="2" fill="#150d08" />
      <rect x="9" y="46" width="1" height="1" fill="#b08458" />
      <rect x="31" y="46" width="2" height="2" fill="#150d08" />
      <rect x="32" y="46" width="1" height="1" fill="#926842" />

      <!-- Mortar-dust it never quite sheds -->
      <rect x="4" y="9" width="1" height="1" fill="#9a949e" opacity="0.45" />
      <rect x="37" y="17" width="1" height="1" fill="#7a7480" opacity="0.45" />
      <rect x="3" y="38" width="1" height="1" fill="#9a949e" opacity="0.4" />
      <rect x="38" y="40" width="1" height="1" fill="#7a7480" opacity="0.4" />
    </svg>
