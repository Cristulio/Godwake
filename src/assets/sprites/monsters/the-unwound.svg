<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 28 32"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="The Unwound"
    >
      <!-- Warm unraveling backlight + ground shadow -->
      <ellipse cx="14" cy="16" rx="13" ry="14" fill="#c47a3a" opacity="0.07" />
      <ellipse cx="13" cy="30" rx="7" ry="1.3" fill="#000" opacity="0.36" />

      <!-- Head — tawny ramp, key upper-left -->
      <rect x="10" y="2" width="7" height="7" fill="#6a4a3a" />
      <rect x="10" y="2" width="7" height="1" fill="#8a6450" />
      <rect x="10" y="2" width="2" height="6" fill="#7a5a4a" />
      <rect x="10" y="2" width="1" height="5" fill="#9a7460" />
      <rect x="15" y="3" width="2" height="6" fill="#5a3e30" />
      <rect x="16" y="3" width="1" height="6" fill="#4a3024" />
      <!-- Fire eyes + spark -->
      <rect x="11" y="4" width="2" height="2" fill="#f48030" />
      <rect x="14" y="4" width="2" height="2" fill="#f48030" />
      <rect x="11" y="4" width="1" height="1" fill="#ffd060" />
      <rect x="14" y="4" width="1" height="1" fill="#ffd060" />
      <rect x="11" y="4" width="1" height="1" fill="#fff0c0" opacity="0.6" />
      <rect x="12" y="7" width="3" height="1" fill="#2a1a14" />

      <!-- Torso — tawny ramp, unraveling at the edge -->
      <rect x="9" y="9" width="9" height="11" fill="#5a3e30" />
      <rect x="9" y="9" width="9" height="1" fill="#7a5a4a" />
      <rect x="9" y="9" width="2" height="10" fill="#6a4a3a" />
      <rect x="9" y="9" width="1" height="9" fill="#8a6450" />
      <rect x="16" y="10" width="2" height="9" fill="#4a3024" />
      <rect x="17" y="10" width="1" height="9" fill="#3a261c" />
      <rect x="12" y="10" width="2" height="9" fill="#8a6450" opacity="0.6" />
      <!-- Dither -->
      <rect x="11" y="14" width="1" height="1" fill="#7a5a4a" />
      <rect x="15" y="16" width="1" height="1" fill="#4a3024" />

      <!-- Stub arms -->
      <rect x="16" y="11" width="2" height="2" fill="#6a4a3a" />
      <rect x="16" y="11" width="2" height="1" fill="#8a6450" />
      <rect x="9" y="13" width="2" height="2" fill="#6a4a3a" />
      <rect x="9" y="13" width="2" height="1" fill="#8a6450" />

      <!-- Unraveling threads — base + lit highlight -->
      <line x1="18" y1="10" x2="27" y2="5" stroke="#5a3e30" stroke-width="0.9" />
      <line x1="18" y1="12" x2="28" y2="13" stroke="#5a3e30" stroke-width="0.9" />
      <line x1="9" y1="11" x2="1" y2="7" stroke="#5a3e30" stroke-width="0.9" />
      <line x1="9" y1="15" x2="0" y2="17" stroke="#5a3e30" stroke-width="0.9" />
      <line x1="17" y1="18" x2="26" y2="24" stroke="#5a3e30" stroke-width="0.9" />
      <line x1="10" y1="19" x2="3" y2="26" stroke="#5a3e30" stroke-width="0.9" />
      <line x1="18" y1="10" x2="27" y2="5" stroke="#a87850" stroke-width="0.3" />
      <line x1="9" y1="11" x2="1" y2="7" stroke="#a87850" stroke-width="0.3" />
      <line x1="17" y1="18" x2="26" y2="24" stroke="#a87850" stroke-width="0.3" />

      <!-- Leg threads -->
      <polygon points="9,20 11,28 13,20" fill="#5a3e30" />
      <polygon points="9,20 10,28 13,20" fill="#6a4a3a" />
      <polygon points="14,20 16,28 18,20" fill="#4a3024" />
      <line x1="11" y1="28" x2="9" y2="32" stroke="#8a6450" stroke-width="0.7" />
      <line x1="16" y1="28" x2="18" y2="32" stroke="#8a6450" stroke-width="0.7" />
      <line x1="13" y1="24" x2="13" y2="31" stroke="#8a6450" stroke-width="0.6" />
    </svg>
