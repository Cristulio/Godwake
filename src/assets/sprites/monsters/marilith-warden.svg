<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 40 44"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Marilith of the Throne"
    >
      <!-- Infernal backlight + ground shadow -->
      <ellipse cx="20" cy="26" rx="18" ry="17" fill="#7a1810" opacity="0.1" />
      <ellipse cx="20" cy="41" rx="14" ry="2" fill="#0a0204" opacity="0.45" />

      <!-- Coiled serpent tail — scaled red ramp -->
      <polygon points="11,26 5,32 3,40 9,40 13,32" fill="#4a0e0a" />
      <polygon points="29,26 35,32 37,40 31,40 27,32" fill="#4a0e0a" />
      <polygon points="13,30 9,38 15,40 20,34" fill="#6a140e" />
      <polygon points="27,30 31,38 25,40 20,34" fill="#6a140e" />
      <polygon points="14,32 20,30 26,32 24,40 16,40" fill="#7a1810" />
      <polygon points="16,33 20,31 22,34 19,39 17,39" fill="#8c2010" opacity="0.7" />
      <rect x="11" y="34" width="1" height="1" fill="#b53c4a" opacity="0.6" />
      <rect x="28" y="36" width="1" height="1" fill="#b53c4a" opacity="0.6" />
      <rect x="19" y="38" width="2" height="1" fill="#3a0a08" />
      <rect x="22" y="35" width="1" height="1" fill="#4a0e0a" />

      <!-- Scaled torso — ramp + central groove + scale dither -->
      <rect x="14" y="12" width="12" height="15" fill="#6a140e" />
      <rect x="14" y="12" width="12" height="1" fill="#8c2010" />
      <rect x="14" y="12" width="3" height="15" fill="#7a1810" />
      <rect x="14" y="12" width="1" height="15" fill="#9a2818" />
      <rect x="24" y="12" width="2" height="15" fill="#4a0e0a" />
      <rect x="19" y="13" width="2" height="13" fill="#4a0e0a" />
      <rect x="15" y="16" width="10" height="1" fill="#3a0a08" opacity="0.6" />
      <rect x="15" y="20" width="10" height="1" fill="#3a0a08" opacity="0.5" />
      <rect x="17" y="18" width="1" height="1" fill="#8c2010" />
      <rect x="22" y="23" width="1" height="1" fill="#4a0e0a" />

      <!-- Horned head — ramp + horns + gold eyes + spark -->
      <rect x="16" y="3" width="8" height="9" fill="#7a1810" />
      <rect x="16" y="3" width="3" height="9" fill="#8c2010" />
      <rect x="16" y="3" width="1" height="6" fill="#a82e1c" />
      <rect x="22" y="3" width="2" height="9" fill="#5a1208" />
      <polygon points="16,3 15,-1 18,2" fill="#5a1208" />
      <polygon points="24,3 25,-1 22,2" fill="#5a1208" />
      <polygon points="16,3 15,-1 17,1" fill="#7a1810" opacity="0.7" />
      <rect x="17" y="6" width="2" height="2" fill="#f4d042" />
      <rect x="21" y="6" width="2" height="2" fill="#f4d042" />
      <rect x="17" y="6" width="1" height="1" fill="#fff8d0" />
      <rect x="21" y="6" width="1" height="1" fill="#fff8d0" />

      <!-- Six arms — scaled red -->
      <polygon points="14,14 8,9 6,11 13,17" fill="#6a140e" />
      <polygon points="14,16 6,14 5,17 13,19" fill="#6a140e" />
      <polygon points="14,18 7,20 8,23 14,21" fill="#6a140e" />
      <polygon points="26,14 32,9 34,11 27,17" fill="#6a140e" />
      <polygon points="26,16 34,14 35,17 27,19" fill="#6a140e" />
      <polygon points="26,18 33,20 32,23 26,21" fill="#6a140e" />
      <polygon points="14,14 8,9 7,10 13,16" fill="#7a1810" opacity="0.6" />
      <polygon points="14,16 6,14 6,15 13,18" fill="#7a1810" opacity="0.6" />

      <!-- Six raised blades — steel ramp + bright specular tips -->
      <polygon points="8,9 4,2 6,2 9,8" fill="#c8d0d8" />
      <polygon points="6,14 1,11 2,9 7,12" fill="#c8d0d8" />
      <polygon points="7,20 2,21 3,23 8,21" fill="#c8d0d8" />
      <polygon points="32,9 36,2 34,2 31,8" fill="#c8d0d8" />
      <polygon points="34,14 39,11 38,9 33,12" fill="#c8d0d8" />
      <polygon points="33,20 38,21 37,23 32,21" fill="#c8d0d8" />
      <polygon points="8,9 5,4 6,4 9,8" fill="#eef4f8" opacity="0.7" />
      <polygon points="32,9 35,4 34,4 31,8" fill="#9aa6b0" opacity="0.7" />
      <rect x="4" y="3" width="1" height="3" fill="#eef4f8" />
      <rect x="35" y="3" width="1" height="3" fill="#eef4f8" />
    </svg>
