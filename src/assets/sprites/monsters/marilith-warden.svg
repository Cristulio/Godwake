<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 60 66"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Marilith of the Throne"
    >
      <!-- Infernal backlight + ground shadow -->
      <ellipse cx="30" cy="36" rx="28" ry="26" fill="#7a1810" opacity="0.1" />
      <ellipse cx="30" cy="63.4" rx="24" ry="2.5" fill="#0a0204" opacity="0.5" />

      <!-- ══ The serpent coil — looping beneath her ══ -->
      <!-- outer loop -->
      <rect x="4" y="44" width="52" height="6" fill="#150d08" />
      <rect x="2" y="48" width="56" height="8" fill="#150d08" />
      <rect x="6" y="55" width="48" height="7" fill="#150d08" />
      <rect x="5" y="45" width="50" height="4" fill="#5e120c" />
      <rect x="3" y="49" width="54" height="6" fill="#6e1810" />
      <rect x="7" y="56" width="46" height="5" fill="#4e0e0a" />
      <!-- lit crest of the coil -->
      <rect x="5" y="45" width="18" height="2" fill="#8a2014" />
      <rect x="6" y="45" width="9" height="1" fill="#a83020" />
      <rect x="3" y="49" width="14" height="2" fill="#7e1c12" />
      <!-- scale rows -->
      <rect x="5" y="47" width="50" height="1" fill="#3e0b08" />
      <rect x="3" y="52" width="54" height="1" fill="#360a06" />
      <rect x="7" y="58" width="46" height="1" fill="#2e0805" />
      <!-- scale glints -->
      <rect x="10" y="46" width="2" height="1" fill="#c84028" />
      <rect x="20" y="50" width="2" height="1" fill="#a83020" />
      <rect x="34" y="51" width="2" height="1" fill="#8a2014" />
      <rect x="44" y="57" width="2" height="1" fill="#6e1810" />
      <rect x="14" y="57" width="2" height="1" fill="#8a2014" />
      <!-- belly plates where the coil faces out -->
      <rect x="26" y="53" width="20" height="2" fill="#b07a4a" />
      <rect x="26" y="53" width="7" height="1" fill="#cc9258" />
      <rect x="26" y="55" width="20" height="1" fill="#8a5e38" />
      <!-- tail tip rising at the right -->
      <rect x="52" y="38" width="5" height="8" fill="#150d08" />
      <rect x="54" y="32" width="4" height="8" fill="#150d08" />
      <rect x="53" y="39" width="3" height="6" fill="#6e1810" />
      <rect x="55" y="33" width="2" height="6" fill="#5e120c" />
      <rect x="55" y="33" width="1" height="4" fill="#8a2014" />
      <!-- tail spade -->
      <rect x="53" y="28" width="5" height="5" fill="#150d08" />
      <rect x="54" y="29" width="3" height="3" fill="#a83020" />
      <rect x="54" y="29" width="1" height="2" fill="#c84028" />

      <!-- ══ Demon torso rising from the coil ══ -->
      <rect x="20" y="16" width="22" height="30" fill="#150d08" />
      <rect x="21" y="17" width="20" height="28" fill="#6e1810" />
      <rect x="21" y="17" width="7" height="28" fill="#7e1c12" />
      <rect x="21" y="17" width="3" height="20" fill="#8e2418" />
      <rect x="36" y="17" width="5" height="28" fill="#5e120c" />
      <rect x="39" y="17" width="2" height="28" fill="#4e0e0a" />
      <!-- gilded gorget + chest harness -->
      <rect x="22" y="20" width="18" height="3" fill="#150d08" />
      <rect x="23" y="21" width="16" height="2" fill="#c89a48" />
      <rect x="23" y="21" width="6" height="1" fill="#ecc46a" />
      <rect x="33" y="21" width="6" height="2" fill="#8a6420" />
      <!-- harness straps crossing -->
      <rect x="24" y="24" width="3" height="2" fill="#2e2014" />
      <rect x="27" y="26" width="3" height="2" fill="#2e2014" />
      <rect x="30" y="28" width="3" height="2" fill="#271b11" />
      <rect x="33" y="26" width="3" height="2" fill="#271b11" />
      <rect x="36" y="24" width="3" height="2" fill="#221709" />
      <!-- navel gem -->
      <rect x="29" y="38" width="4" height="4" fill="#150d08" />
      <rect x="30" y="39" width="2" height="2" fill="#f4d042" />
      <rect x="30" y="39" width="1" height="1" fill="#fff8d0" />

      <!-- ══ Head — crowned, regal, cruel ══ -->
      <rect x="23" y="2" width="16" height="15" fill="#150d08" />
      <rect x="24" y="3" width="14" height="13" fill="#7e1c12" />
      <rect x="24" y="3" width="5" height="13" fill="#8e2418" />
      <rect x="24" y="3" width="2" height="9" fill="#a83020" />
      <rect x="34" y="3" width="4" height="13" fill="#5e120c" />
      <rect x="36" y="3" width="2" height="13" fill="#4e0e0a" />
      <!-- swept-back horns -->
      <rect x="19" y="0" width="5" height="4" fill="#150d08" />
      <rect x="20" y="1" width="3" height="2" fill="#e8c0a0" />
      <rect x="20" y="1" width="2" height="1" fill="#f4d8b8" />
      <rect x="38" y="0" width="5" height="4" fill="#150d08" />
      <rect x="39" y="1" width="3" height="2" fill="#c8a888" />
      <!-- gold circlet -->
      <rect x="24" y="3" width="14" height="2" fill="#c89a48" />
      <rect x="24" y="3" width="5" height="1" fill="#ecc46a" />
      <rect x="30" y="2" width="2" height="2" fill="#f4d042" />
      <!-- serpent eyes -->
      <rect x="25" y="8" width="4" height="2" fill="#1a0a06" />
      <rect x="32" y="8" width="4" height="2" fill="#1a0a06" />
      <rect x="26" y="8" width="2" height="2" fill="#f4d042" />
      <rect x="33" y="8" width="2" height="2" fill="#d4a830" />
      <rect x="26" y="8" width="1" height="1" fill="#fff8d0" />
      <rect x="33" y="8" width="1" height="1" fill="#ffe890" />
      <!-- nose + proud mouth -->
      <rect x="30" y="9" width="2" height="3" fill="#5e120c" />
      <rect x="27" y="13" width="8" height="1" fill="#3e0b08" />
      <rect x="27" y="13" width="2" height="1" fill="#4e0e0a" />
      <!-- fang tips at the lip -->
      <rect x="27" y="14" width="1" height="1" fill="#e8e0cc" />
      <rect x="34" y="14" width="1" height="1" fill="#cdc4ac" />

      <!-- ══ Six arms — three per side, bladed ══ -->
      <!-- LEFT TOP — scimitar raised high -->
      <rect x="14" y="16" width="8" height="6" fill="#150d08" />
      <rect x="15" y="17" width="6" height="4" fill="#8e2418" />
      <rect x="15" y="17" width="3" height="4" fill="#a83020" />
      <rect x="11" y="12" width="7" height="6" fill="#150d08" />
      <rect x="12" y="13" width="5" height="4" fill="#7e1c12" />
      <!-- fist + upswept scimitar -->
      <rect x="10" y="8" width="6" height="5" fill="#150d08" />
      <rect x="11" y="9" width="4" height="3" fill="#8e2418" />
      <rect x="6" y="0" width="6" height="3" fill="#150d08" />
      <rect x="8" y="2" width="6" height="3" fill="#150d08" />
      <rect x="10" y="4" width="5" height="4" fill="#150d08" />
      <rect x="7" y="1" width="4" height="1" fill="#c8ccd8" />
      <rect x="9" y="3" width="4" height="1" fill="#9aa2b4" />
      <rect x="11" y="5" width="3" height="2" fill="#7a8294" />
      <rect x="7" y="1" width="2" height="1" fill="#e8ecf4" />
      <!-- LEFT MID — blade thrust out -->
      <rect x="12" y="22" width="9" height="6" fill="#150d08" />
      <rect x="13" y="23" width="7" height="4" fill="#7e1c12" />
      <rect x="13" y="23" width="3" height="4" fill="#8e2418" />
      <rect x="8" y="25" width="7" height="6" fill="#150d08" />
      <rect x="9" y="26" width="5" height="4" fill="#6e1810" />
      <!-- fist + straight blade out-left -->
      <rect x="5" y="27" width="6" height="5" fill="#150d08" />
      <rect x="6" y="28" width="4" height="3" fill="#7e1c12" />
      <rect x="0" y="28" width="7" height="3" fill="#150d08" />
      <rect x="1" y="29" width="5" height="1" fill="#9aa2b4" />
      <rect x="1" y="29" width="2" height="1" fill="#c8ccd8" />
      <!-- LEFT LOW — dagger held down -->
      <rect x="14" y="30" width="8" height="6" fill="#150d08" />
      <rect x="15" y="31" width="6" height="4" fill="#6e1810" />
      <rect x="15" y="31" width="2" height="4" fill="#7e1c12" />
      <rect x="11" y="34" width="7" height="6" fill="#150d08" />
      <rect x="12" y="35" width="5" height="4" fill="#5e120c" />
      <rect x="10" y="38" width="6" height="5" fill="#150d08" />
      <rect x="11" y="39" width="4" height="3" fill="#6e1810" />
      <rect x="11" y="42" width="3" height="7" fill="#150d08" />
      <rect x="12" y="43" width="1" height="5" fill="#7a8294" />
      <rect x="12" y="43" width="1" height="2" fill="#9aa2b4" />
      <!-- RIGHT TOP — scimitar angled up -->
      <rect x="40" y="16" width="8" height="6" fill="#150d08" />
      <rect x="41" y="17" width="6" height="4" fill="#5e120c" />
      <rect x="41" y="17" width="2" height="4" fill="#6e1810" />
      <rect x="44" y="12" width="7" height="6" fill="#150d08" />
      <rect x="45" y="13" width="5" height="4" fill="#4e0e0a" />
      <rect x="46" y="8" width="6" height="5" fill="#150d08" />
      <rect x="47" y="9" width="4" height="3" fill="#5e120c" />
      <rect x="50" y="0" width="6" height="3" fill="#150d08" />
      <rect x="48" y="2" width="6" height="3" fill="#150d08" />
      <rect x="47" y="4" width="5" height="4" fill="#150d08" />
      <rect x="51" y="1" width="4" height="1" fill="#7a8294" />
      <rect x="49" y="3" width="4" height="1" fill="#5a6274" />
      <rect x="48" y="5" width="3" height="2" fill="#46506a" />
      <!-- RIGHT MID — blade out-right -->
      <rect x="39" y="22" width="9" height="6" fill="#150d08" />
      <rect x="40" y="23" width="7" height="4" fill="#4e0e0a" />
      <rect x="45" y="25" width="7" height="6" fill="#150d08" />
      <rect x="46" y="26" width="5" height="4" fill="#440c08" />
      <rect x="49" y="27" width="6" height="5" fill="#150d08" />
      <rect x="50" y="28" width="4" height="3" fill="#5e120c" />
      <rect x="53" y="28" width="7" height="3" fill="#150d08" />
      <rect x="54" y="29" width="5" height="1" fill="#5a6274" />
      <!-- RIGHT LOW — dagger reversed -->
      <rect x="40" y="30" width="8" height="6" fill="#150d08" />
      <rect x="41" y="31" width="6" height="4" fill="#440c08" />
      <rect x="44" y="34" width="7" height="6" fill="#150d08" />
      <rect x="45" y="35" width="5" height="4" fill="#3e0b08" />
      <rect x="45" y="38" width="6" height="5" fill="#150d08" />
      <rect x="46" y="39" width="4" height="3" fill="#4e0e0a" />
      <rect x="47" y="42" width="3" height="6" fill="#150d08" />
      <rect x="48" y="43" width="1" height="4" fill="#5a6274" />

      <!-- ══ Blood sheen + motes ══ -->
      <rect x="24" y="30" width="1" height="1" fill="#c84028" />
      <rect x="37" y="33" width="1" height="1" fill="#3e0b08" />
      <rect x="4" y="14" width="1" height="1" fill="#e8581e" opacity="0.6" />
      <rect x="56" y="18" width="1" height="1" fill="#c84028" opacity="0.55" />
      <rect x="18" y="6" width="1" height="1" fill="#ffd070" opacity="0.5" />
      <rect x="44" y="6" width="1" height="1" fill="#e8a020" opacity="0.45" />
    </svg>
