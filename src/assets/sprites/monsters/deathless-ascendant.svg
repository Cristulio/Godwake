<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 44"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Deathless Ascendant"
    >
      <!-- Gilded backlight + ground shadow -->
      <ellipse cx="16" cy="22" rx="14" ry="20" fill="#c9b87a" opacity="0.07" />
      <ellipse cx="16" cy="42" rx="12" ry="2" fill="#0a0805" opacity="0.5" />

      <!-- Halo -->
      <circle cx="16" cy="7" r="7" fill="none" stroke="#c9b87a" stroke-width="0.5" opacity="0.45" />
      <circle cx="16" cy="7" r="7" fill="none" stroke="#f4e8b0" stroke-width="0.3" opacity="0.3" />
      <rect x="15" y="0" width="2" height="14" fill="#c9b87a" opacity="0.22" />
      <rect x="9" y="6" width="14" height="2" fill="#c9b87a" opacity="0.22" />

      <!-- Head wrappings — bone-gold ramp, key upper-left -->
      <rect x="12" y="4" width="8" height="9" fill="#a89568" />
      <rect x="12" y="4" width="8" height="2" fill="#cdbb88" />
      <rect x="12" y="4" width="2" height="8" fill="#b8a578" />
      <rect x="12" y="4" width="1" height="6" fill="#d4c490" />
      <rect x="18" y="5" width="2" height="7" fill="#8a7a50" />
      <rect x="19" y="5" width="1" height="7" fill="#6a5d3a" />
      <!-- Hollow eyes + cold spark -->
      <rect x="13" y="7" width="2" height="2" fill="#1a1610" />
      <rect x="17" y="7" width="2" height="2" fill="#1a1610" />
      <rect x="13" y="7" width="1" height="1" fill="#f4e8b0" />
      <rect x="17" y="7" width="1" height="1" fill="#f4e8b0" />
      <rect x="12" y="11" width="8" height="1" fill="#5a4c30" />

      <!-- Wrapped robe — ramp -->
      <polygon points="10,13 22,13 23,26 18,32 14,32 9,26" fill="#3a3424" />
      <polygon points="12,15 20,15 21,25 16,30 11,25" fill="#5d543c" />
      <polygon points="12,15 16,15 16,30 11,25" fill="#6a5d3a" />
      <rect x="15" y="15" width="2" height="15" fill="#7a6f48" opacity="0.7" />
      <!-- Wrap bands + gilt -->
      <rect x="11" y="18" width="10" height="1" fill="#2e2a1c" />
      <rect x="11" y="23" width="10" height="1" fill="#2e2a1c" />
      <rect x="11" y="17" width="10" height="1" fill="#8a7a48" opacity="0.5" />
      <rect x="14" y="20" width="4" height="1" fill="#c9b87a" opacity="0.6" />
      <rect x="14" y="20" width="1" height="1" fill="#f4e8b0" />

      <!-- Left wrapped arm -->
      <polygon points="10,14 5,18 6,27 9,24 10,18" fill="#4a4230" />
      <polygon points="10,14 6,18 9,24 10,18" fill="#5d543c" />
      <polygon points="4,17 7,16 5,26 3,24" fill="#3a3424" />
      <rect x="3" y="22" width="2" height="6" fill="#7a6f48" />
      <rect x="3" y="22" width="1" height="6" fill="#8c7f56" />

      <!-- Right arm + gilded mace -->
      <rect x="24" y="18" width="3" height="9" fill="#3a3424" />
      <rect x="24" y="18" width="1" height="9" fill="#4a4230" />
      <polygon points="22,14 27,15 28,12 31,14 29,20 24,19" fill="#8a8276" />
      <polygon points="27,9 31,13 29,15 25,12" fill="#b0a89a" />
      <polygon points="28,8 32,12 30,14 27,11" fill="#d4ccbe" />
      <rect x="29" y="10" width="1" height="1" fill="#ffffff" />

      <!-- Legs -->
      <rect x="12" y="32" width="3" height="8" fill="#3a3424" />
      <rect x="12" y="32" width="1" height="8" fill="#4a4230" />
      <rect x="17" y="32" width="3" height="8" fill="#2e2a1c" />
      <polygon points="10,40 15,40 14,43 11,43" fill="#241f15" />
      <polygon points="17,40 22,40 21,43 18,43" fill="#1e1a12" />

      <!-- Drifting motes -->
      <rect x="14" y="20" width="1" height="1" fill="#f4e8b0" opacity="0.6" />
      <rect x="24" y="24" width="1" height="1" fill="#c9b87a" opacity="0.5" />
    </svg>
