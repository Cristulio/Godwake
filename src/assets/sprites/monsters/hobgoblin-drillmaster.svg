<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 22 36"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Hobgoblin Drillmaster"
    >
      <!-- Warm war-camp backlight + ground shadow -->
      <ellipse cx="11" cy="17" rx="11" ry="16" fill="#d8a23a" opacity="0.15" />
      <ellipse cx="11" cy="35" rx="8" ry="1.4" fill="#000" opacity="0.42" />

      <!-- Helmet crest -->
      <rect x="9" y="0" width="4" height="1" fill="#1a1410" />
      <rect x="10" y="-1" width="2" height="1" fill="#2a2218" />

      <!-- Helmet band — steel ramp, key upper-left -->
      <rect x="6" y="1" width="10" height="4" fill="#3a3228" />
      <rect x="6" y="1" width="10" height="1" fill="#6a6058" />
      <rect x="6" y="2" width="2" height="3" fill="#4a4038" />
      <rect x="6" y="2" width="1" height="3" fill="#5a5048" />
      <rect x="5" y="2" width="1" height="3" fill="#1a1410" />
      <rect x="14" y="2" width="2" height="3" fill="#2a221c" />
      <rect x="16" y="2" width="1" height="3" fill="#1a1410" />
      <rect x="7" y="1" width="3" height="1" fill="#7a7068" />

      <!-- Cheek guards -->
      <rect x="6" y="5" width="2" height="3" fill="#3a3228" />
      <rect x="6" y="5" width="1" height="3" fill="#4a4038" />
      <rect x="14" y="5" width="2" height="3" fill="#2a221c" />
      <rect x="15" y="5" width="1" height="3" fill="#1a1410" />

      <!-- Face — orange-tan ramp -->
      <rect x="8" y="5" width="6" height="5" fill="#a85420" />
      <rect x="8" y="5" width="6" height="1" fill="#c46a2a" />
      <rect x="8" y="5" width="2" height="4" fill="#c46a2a" />
      <rect x="8" y="5" width="1" height="3" fill="#e08a3a" />
      <rect x="12" y="6" width="2" height="4" fill="#8a3e14" />
      <rect x="13" y="6" width="1" height="4" fill="#6a3010" />

      <!-- Pointed ears -->
      <rect x="4" y="3" width="2" height="2" fill="#a85420" />
      <rect x="4" y="3" width="1" height="2" fill="#c46a2a" />
      <rect x="3" y="4" width="1" height="1" fill="#6a3010" />
      <rect x="16" y="3" width="2" height="2" fill="#8a3e14" />
      <rect x="18" y="4" width="1" height="1" fill="#6a3010" />

      <!-- Eyes — dark socket + amber glare + spark -->
      <rect x="8" y="6" width="2" height="1" fill="#160f0a" />
      <rect x="12" y="6" width="2" height="1" fill="#160f0a" />
      <rect x="8" y="6" width="1" height="1" fill="#f4a02a" />
      <rect x="13" y="6" width="1" height="1" fill="#f4a02a" />
      <rect x="8" y="6" width="1" height="1" fill="#ffe0a0" opacity="0.6" />

      <!-- Snout / nose -->
      <rect x="10" y="7" width="2" height="2" fill="#8a3e14" />
      <rect x="11" y="8" width="1" height="1" fill="#5a2810" />

      <!-- Fanged mouth -->
      <rect x="9" y="9" width="4" height="1" fill="#160f0a" />
      <rect x="9" y="9" width="1" height="1" fill="#e8dcc4" />
      <rect x="12" y="9" width="1" height="1" fill="#d4c8a8" />
      <rect x="9" y="10" width="4" height="1" fill="#8a3e14" />

      <!-- Pauldrons — steel ramp -->
      <rect x="2" y="11" width="4" height="4" fill="#2a221c" />
      <rect x="16" y="11" width="4" height="4" fill="#1f1814" />
      <rect x="3" y="12" width="2" height="2" fill="#5a5048" />
      <rect x="3" y="12" width="1" height="1" fill="#7a7068" />
      <rect x="17" y="12" width="2" height="2" fill="#4a4038" />

      <!-- Cuirass — dark steel hollow with lit edges -->
      <rect x="5" y="11" width="12" height="11" fill="#3a3228" />
      <rect x="6" y="12" width="10" height="9" fill="#2a221c" />
      <rect x="5" y="11" width="12" height="1" fill="#6a6058" />
      <rect x="5" y="11" width="2" height="10" fill="#4a4038" />
      <rect x="5" y="11" width="1" height="10" fill="#5a5048" />
      <rect x="15" y="11" width="2" height="10" fill="#1f1814" />
      <rect x="5" y="21" width="12" height="1" fill="#1a1410" />
      <!-- Sternum ridge + rivets -->
      <rect x="10" y="12" width="2" height="9" fill="#4a4038" />
      <rect x="10" y="12" width="1" height="9" fill="#5a5048" />
      <rect x="7" y="14" width="1" height="1" fill="#6a6058" />
      <rect x="13" y="16" width="1" height="1" fill="#3a3228" />

      <!-- Shoulder strap highlight -->
      <polygon points="6,15 8,11 9,11 7,15" fill="#8a3e14" />

      <!-- Belt buckle -->
      <rect x="9" y="15" width="4" height="3" fill="#8c6232" />
      <rect x="9" y="15" width="4" height="1" fill="#b08840" />
      <rect x="10" y="16" width="2" height="1" fill="#160f0a" />

      <!-- Belt -->
      <rect x="4" y="22" width="14" height="2" fill="#1a1410" />
      <rect x="4" y="22" width="14" height="1" fill="#3a2418" />
      <rect x="10" y="22" width="2" height="2" fill="#8c6232" />
      <rect x="10" y="22" width="1" height="1" fill="#b08840" />

      <!-- Arms — orange ramp -->
      <rect x="3" y="15" width="3" height="7" fill="#a85420" />
      <rect x="3" y="15" width="1" height="7" fill="#c46a2a" />
      <rect x="5" y="15" width="1" height="7" fill="#6a3010" />
      <rect x="16" y="15" width="3" height="7" fill="#8a3e14" />
      <rect x="18" y="15" width="1" height="7" fill="#6a3010" />
      <rect x="16" y="15" width="1" height="7" fill="#a85420" />

      <!-- Bracers -->
      <rect x="3" y="19" width="3" height="3" fill="#3a3228" />
      <rect x="3" y="19" width="3" height="1" fill="#5a5048" />
      <rect x="16" y="19" width="3" height="3" fill="#2a221c" />
      <rect x="16" y="19" width="3" height="1" fill="#4a4038" />

      <!-- Hands -->
      <rect x="2" y="22" width="4" height="2" fill="#1a1410" />
      <rect x="16" y="22" width="4" height="2" fill="#1a1410" />

      <!-- Spear — bone-pale shaft ramp + specular + amber tip -->
      <rect x="18" y="3" width="2" height="20" fill="#9a8a68" />
      <rect x="19" y="3" width="1" height="20" fill="#e8dcc4" />
      <rect x="18" y="3" width="1" height="20" fill="#b5a282" />
      <rect x="19" y="5" width="1" height="2" fill="#fff4d0" />
      <rect x="17" y="22" width="4" height="1" fill="#5a4030" />
      <rect x="18" y="22" width="2" height="3" fill="#3a2418" />
      <rect x="19" y="2" width="1" height="1" fill="#8c6232" />

      <!-- Tasset / skirt -->
      <rect x="5" y="24" width="12" height="3" fill="#3a3228" />
      <rect x="5" y="24" width="12" height="1" fill="#5a5048" />
      <rect x="7" y="25" width="1" height="2" fill="#1a1410" />
      <rect x="11" y="25" width="1" height="2" fill="#1a1410" />
      <rect x="14" y="25" width="1" height="2" fill="#1a1410" />

      <!-- Legs — orange ramp -->
      <rect x="6" y="27" width="4" height="6" fill="#a85420" />
      <rect x="6" y="27" width="1" height="6" fill="#c46a2a" />
      <rect x="9" y="27" width="1" height="6" fill="#6a3010" />
      <rect x="12" y="27" width="4" height="6" fill="#8a3e14" />
      <rect x="15" y="27" width="1" height="6" fill="#6a3010" />
      <rect x="12" y="27" width="1" height="6" fill="#a85420" />

      <!-- Greaves -->
      <rect x="6" y="30" width="4" height="3" fill="#3a3228" />
      <rect x="12" y="30" width="4" height="3" fill="#2a221c" />
      <rect x="6" y="30" width="4" height="1" fill="#5a5048" />
      <rect x="12" y="30" width="4" height="1" fill="#4a4038" />

      <!-- Boots -->
      <rect x="5" y="33" width="6" height="3" fill="#1a1410" />
      <rect x="11" y="33" width="6" height="3" fill="#140e0a" />
      <rect x="5" y="33" width="6" height="1" fill="#3a3228" />
      <rect x="11" y="33" width="6" height="1" fill="#2a221c" />
    </svg>
