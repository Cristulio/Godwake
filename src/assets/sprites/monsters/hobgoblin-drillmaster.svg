<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 38 62"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Hobgoblin Drillmaster"
    >
      <!-- War-camp backlight + ground shadow -->
      <ellipse cx="19" cy="30" rx="18" ry="27" fill="#d8a23a" opacity="0.13" />
      <ellipse cx="18" cy="59.6" rx="14" ry="2.2" fill="#000" opacity="0.45" />

      <!-- ══ Banner-spear — pennant snapping ══ -->
      <!-- shaft -->
      <rect x="29" y="2" width="4" height="52" fill="#150d08" />
      <rect x="30" y="3" width="2" height="50" fill="#4a2810" />
      <rect x="30" y="3" width="1" height="50" fill="#8c5226" />
      <!-- spearhead -->
      <rect x="29" y="0" width="4" height="3" fill="#150d08" />
      <rect x="30" y="0" width="2" height="2" fill="#9a96a4" />
      <rect x="30" y="0" width="1" height="1" fill="#e8e4f0" />
      <!-- the legion pennant -->
      <rect x="14" y="3" width="16" height="3" fill="#150d08" />
      <rect x="10" y="5" width="20" height="3" fill="#150d08" />
      <rect x="13" y="7" width="17" height="3" fill="#150d08" />
      <rect x="15" y="4" width="14" height="2" fill="#8e2420" />
      <rect x="11" y="6" width="18" height="1" fill="#a93340" />
      <rect x="14" y="7" width="15" height="2" fill="#7e1f2c" />
      <rect x="15" y="4" width="5" height="1" fill="#c84a64" />
      <!-- legion mark on the cloth -->
      <rect x="20" y="5" width="3" height="3" fill="#1a1410" />
      <rect x="21" y="6" width="1" height="1" fill="#ecc46a" />
      <!-- frayed fly-end -->
      <rect x="10" y="6" width="1" height="2" fill="#5e1620" />

      <!-- ══ Head — scarred drill-bark face ══ -->
      <rect x="9" y="6" width="17" height="14" fill="#150d08" />
      <rect x="10" y="7" width="15" height="12" fill="#b85c2e" />
      <rect x="10" y="7" width="5" height="12" fill="#cc6c38" />
      <rect x="10" y="7" width="2" height="8" fill="#e07e44" />
      <rect x="22" y="7" width="3" height="12" fill="#94481e" />
      <rect x="24" y="7" width="1" height="12" fill="#7a3814" />
      <!-- iron half-helm -->
      <rect x="9" y="6" width="17" height="4" fill="#150d08" />
      <rect x="10" y="7" width="15" height="3" fill="#3a3644" />
      <rect x="10" y="7" width="5" height="2" fill="#56525e" />
      <rect x="22" y="7" width="3" height="3" fill="#2e2a38" />
      <rect x="10" y="7" width="15" height="1" fill="#6e6a78" />
      <!-- pointed ears -->
      <rect x="6" y="9" width="4" height="4" fill="#150d08" />
      <rect x="7" y="10" width="2" height="2" fill="#cc6c38" />
      <rect x="25" y="9" width="4" height="4" fill="#150d08" />
      <rect x="26" y="10" width="2" height="2" fill="#94481e" />
      <!-- scar across the left eye -->
      <rect x="13" y="10" width="1" height="5" fill="#7a3814" />
      <!-- hard yellow eyes -->
      <rect x="11" y="11" width="4" height="2" fill="#1a1006" />
      <rect x="19" y="11" width="4" height="2" fill="#1a1006" />
      <rect x="12" y="11" width="2" height="2" fill="#e8b830" />
      <rect x="20" y="11" width="2" height="2" fill="#c89220" />
      <rect x="12" y="11" width="1" height="1" fill="#fff0b0" />
      <rect x="20" y="11" width="1" height="1" fill="#ffe070" />
      <!-- flat nose -->
      <rect x="16" y="12" width="3" height="3" fill="#94481e" />
      <rect x="16" y="12" width="1" height="3" fill="#b85c2e" />
      <!-- barking mouth — open, teeth bared -->
      <rect x="12" y="16" width="11" height="3" fill="#1a0a06" />
      <rect x="13" y="16" width="1" height="1" fill="#e8dcc4" />
      <rect x="16" y="16" width="1" height="1" fill="#e8dcc4" />
      <rect x="19" y="16" width="1" height="1" fill="#cdbfa2" />
      <rect x="21" y="16" width="1" height="1" fill="#cdbfa2" />
      <rect x="14" y="18" width="6" height="1" fill="#5e1620" />

      <!-- ══ Scale cuirass + rank sash ══ -->
      <rect x="6" y="20" width="23" height="20" fill="#150d08" />
      <rect x="7" y="21" width="21" height="18" fill="#3e3a30" />
      <rect x="7" y="21" width="7" height="18" fill="#4e4a3c" />
      <rect x="7" y="21" width="3" height="13" fill="#5e5a48" />
      <rect x="24" y="21" width="4" height="18" fill="#302c24" />
      <rect x="26" y="21" width="2" height="18" fill="#262218" />
      <!-- scale rows -->
      <rect x="7" y="24" width="21" height="1" fill="#262218" />
      <rect x="7" y="28" width="21" height="1" fill="#262218" />
      <rect x="7" y="32" width="21" height="1" fill="#221e16" />
      <rect x="7" y="36" width="21" height="1" fill="#221e16" />
      <!-- scale glints -->
      <rect x="9" y="22" width="1" height="1" fill="#74705c" />
      <rect x="15" y="26" width="1" height="1" fill="#5e5a48" />
      <rect x="10" y="30" width="1" height="1" fill="#5e5a48" />
      <rect x="18" y="34" width="1" height="1" fill="#4e4a3c" />
      <!-- rank sash — wine red with studs -->
      <rect x="7" y="21" width="6" height="3" fill="#7e1f2c" />
      <rect x="10" y="24" width="6" height="3" fill="#7e1f2c" />
      <rect x="13" y="27" width="6" height="3" fill="#6e1a26" />
      <rect x="16" y="30" width="6" height="3" fill="#5e1620" />
      <rect x="19" y="33" width="6" height="3" fill="#531320" />
      <rect x="22" y="36" width="6" height="3" fill="#481020" />
      <rect x="7" y="21" width="3" height="1" fill="#a93340" />
      <!-- rank studs -->
      <rect x="9" y="22" width="1" height="1" fill="#ecc46a" />
      <rect x="12" y="25" width="1" height="1" fill="#ecc46a" />
      <rect x="15" y="28" width="1" height="1" fill="#c89a48" />
      <rect x="18" y="31" width="1" height="1" fill="#c89a48" />

      <!-- ══ Left arm — barking gesture, finger pointed ══ -->
      <rect x="2" y="21" width="7" height="8" fill="#150d08" />
      <rect x="3" y="22" width="5" height="6" fill="#4e4a3c" />
      <rect x="3" y="22" width="2" height="6" fill="#5e5a48" />
      <rect x="1" y="27" width="7" height="8" fill="#150d08" />
      <rect x="2" y="28" width="5" height="6" fill="#b85c2e" />
      <rect x="2" y="28" width="2" height="6" fill="#cc6c38" />
      <!-- pointing hand -->
      <rect x="1" y="33" width="7" height="5" fill="#150d08" />
      <rect x="2" y="34" width="5" height="3" fill="#cc6c38" />
      <rect x="0" y="34" width="3" height="2" fill="#150d08" />
      <rect x="1" y="35" width="2" height="1" fill="#e07e44" />

      <!-- ══ Right arm — gripping the banner-spear ══ -->
      <rect x="24" y="21" width="7" height="8" fill="#150d08" />
      <rect x="25" y="22" width="5" height="6" fill="#302c24" />
      <rect x="25" y="22" width="2" height="6" fill="#3e3a30" />
      <!-- fist on the shaft -->
      <rect x="26" y="28" width="8" height="7" fill="#150d08" />
      <rect x="27" y="29" width="6" height="5" fill="#b85c2e" />
      <rect x="27" y="29" width="2" height="5" fill="#cc6c38" />
      <rect x="29" y="31" width="1" height="1" fill="#94481e" />
      <rect x="31" y="31" width="1" height="1" fill="#94481e" />

      <!-- ══ War-skirt + legs ══ -->
      <rect x="6" y="39" width="23" height="5" fill="#150d08" />
      <rect x="7" y="40" width="21" height="3" fill="#2e2014" />
      <rect x="7" y="40" width="7" height="2" fill="#3c2c1c" />
      <!-- studded strips -->
      <rect x="10" y="40" width="1" height="3" fill="#56525e" />
      <rect x="17" y="40" width="1" height="3" fill="#56525e" />
      <rect x="24" y="40" width="1" height="3" fill="#46424e" />
      <!-- legs -->
      <rect x="7" y="44" width="9" height="10" fill="#150d08" />
      <rect x="8" y="45" width="7" height="9" fill="#94481e" />
      <rect x="8" y="45" width="3" height="9" fill="#b85c2e" />
      <rect x="13" y="45" width="2" height="9" fill="#7a3814" />
      <rect x="19" y="44" width="9" height="10" fill="#150d08" />
      <rect x="20" y="45" width="7" height="9" fill="#7a3814" />
      <rect x="20" y="45" width="2" height="9" fill="#94481e" />
      <rect x="25" y="45" width="2" height="9" fill="#622c10" />

      <!-- ══ Iron-shod boots ══ -->
      <rect x="5" y="53" width="12" height="6" fill="#150d08" />
      <rect x="6" y="54" width="10" height="4" fill="#3a3644" />
      <rect x="6" y="54" width="10" height="1" fill="#5e5a68" />
      <rect x="6" y="54" width="4" height="1" fill="#74707e" />
      <rect x="6" y="57" width="10" height="1" fill="#1e1a26" />
      <rect x="18" y="53" width="12" height="6" fill="#150d08" />
      <rect x="19" y="54" width="10" height="4" fill="#2e2a38" />
      <rect x="19" y="54" width="10" height="1" fill="#4a4654" />
      <rect x="19" y="57" width="10" height="1" fill="#191522" />

      <!-- camp embers -->
      <rect x="3" y="16" width="1" height="1" fill="#ffd070" opacity="0.5" />
      <rect x="34" y="42" width="1" height="1" fill="#e8b830" opacity="0.45" />
    </svg>
