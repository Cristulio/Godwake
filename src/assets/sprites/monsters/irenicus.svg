      <rect x="28" y="28" width="1" height="3" fill="#e8a020" opacity="0.7" />
      <rect x="28" y="41" width="1" height="3" fill="#e8a020" opacity="0.6" />
      <rect x="20" y="36" width="3" height="1" fill="#e8a020" opacity="0.65" />
      <rect x="33" y="36" width="3" height="1" fill="#e8a020" opacity="0.6" />
      <rect x="22" y="30" width="1" height="1" fill="#ffd070" opacity="0.7" />
      <rect x="33" y="30" width="1" height="1" fill="#ffd070" opacity="0.6" />
      <rect x="22" y="42" width="1" height="1" fill="#e8401a" opacity="0.6" />
      <rect x="33" y="42" width="1" height="1" fill="#e8401a" opacity="0.55" />
