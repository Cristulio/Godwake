      <rect x="19" y="1" width="18" height="4" fill="#150d08" />
      <rect x="20" y="2" width="16" height="3" fill="#0e0810" />
      <rect x="27" y="4" width="3" height="2" fill="#0e0810" />
      <rect x="22" y="3" width="4" height="1" fill="#241a2c" />
      <!-- hair falls at the temples -->
      <rect x="17" y="4" width="4" height="16" fill="#150d08" />
      <rect x="18" y="5" width="2" height="14" fill="#0e0810" />
      <rect x="18" y="5" width="1" height="10" fill="#241a2c" />
      <rect x="35" y="4" width="4" height="16" fill="#150d08" />
      <rect x="36" y="5" width="2" height="14" fill="#0e0810" />
      <!-- pointed ears through the hair -->
      <rect x="15" y="9" width="3" height="4" fill="#150d08" />
      <rect x="16" y="10" width="2" height="2" fill="#cfc2b0" />
      <rect x="38" y="9" width="3" height="4" fill="#150d08" />
      <rect x="39" y="10" width="1" height="2" fill="#a89c88" />
      <!-- gaunt face -->
      <rect x="19" y="4" width="18" height="18" fill="#150d08" />
      <rect x="20" y="5" width="16" height="16" fill="#cfc2b0" />
      <rect x="20" y="5" width="6" height="16" fill="#dccfbd" />
      <rect x="20" y="5" width="3" height="12" fill="#ece2d2" />
      <rect x="32" y="5" width="4" height="16" fill="#a89c88" />
      <rect x="34" y="5" width="2" height="16" fill="#8e8270" />
      <rect x="20" y="5" width="16" height="2" fill="#0e0810" />
      <rect x="21" y="7" width="14" height="1" fill="#a89c88" />
