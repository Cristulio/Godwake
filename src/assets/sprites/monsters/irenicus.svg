      <rect x="38" y="34" width="1" height="1" fill="#8a6420" opacity="0.7" />
      <rect x="38" y="44" width="1" height="1" fill="#c89a48" opacity="0.5" />
      <!-- THE SOUL-WOUND — stolen divinity burning through -->
      <ellipse cx="28" cy="36" rx="8" ry="8" fill="#5a1010" opacity="0.85" />
      <rect x="23" y="31" width="10" height="10" fill="#5a1010" />
      <rect x="24" y="32" width="8" height="8" fill="#a02810" />
      <rect x="25" y="33" width="6" height="6" fill="#e8401a" />
      <rect x="26" y="34" width="4" height="4" fill="#e8a020" />
      <rect x="26" y="34" width="3" height="3" fill="#ffd070" />
      <rect x="27" y="35" width="2" height="2" fill="#fff4d0" />
      <rect x="27" y="35" width="1" height="1" fill="#ffffff" />
