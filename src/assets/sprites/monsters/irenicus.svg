      <rect x="21" y="10" width="5" height="3" fill="#10202a" />
      <rect x="30" y="10" width="5" height="3" fill="#10202a" />
      <rect x="22" y="11" width="3" height="2" fill="#7ac0e0" />
      <rect x="31" y="11" width="3" height="2" fill="#5a9cc0" />
      <rect x="22" y="11" width="1" height="1" fill="#d0f0ff" />
      <rect x="31" y="11" width="1" height="1" fill="#a8d8f0" />
      <!-- hollow cheeks -->
      <rect x="21" y="14" width="2" height="4" fill="#b0a490" />
      <rect x="33" y="14" width="2" height="4" fill="#7e7260" />
      <!-- sharp nose -->
      <rect x="27" y="12" width="2" height="4" fill="#b0a490" />
      <rect x="27" y="12" width="1" height="4" fill="#cfc2b0" />
      <rect x="27" y="15" width="2" height="1" fill="#8e8270" />
