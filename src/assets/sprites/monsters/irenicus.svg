<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 56 80"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Jon Velnaris"
    >
      <!-- Stolen-divinity aura — layered bloom + ground shadow -->
      <ellipse cx="28" cy="38" rx="27" ry="36" fill="#5a1010" opacity="0.18" />
      <ellipse cx="28" cy="34" rx="20" ry="28" fill="#c0301a" opacity="0.12" />
      <ellipse cx="28" cy="38" rx="11" ry="16" fill="#e8a020" opacity="0.08" />
      <ellipse cx="28" cy="77.4" rx="18" ry="2.4" fill="#0a0408" opacity="0.55" />

      <!-- ══ Staff — dark wood, burning orb ══ -->
      <rect x="42" y="8" width="4" height="52" fill="#150d08" />
      <rect x="43" y="9" width="2" height="50" fill="#3a2648" />
      <rect x="43" y="9" width="1" height="50" fill="#4c3460" />
      <!-- gold ferrules -->
      <rect x="42" y="14" width="4" height="2" fill="#c89a48" />
      <rect x="42" y="14" width="2" height="1" fill="#ecc46a" />
      <rect x="42" y="52" width="4" height="2" fill="#8a6420" />
      <!-- the orb of stolen fire -->
      <ellipse cx="44" cy="5" rx="8" ry="8" fill="#5a1010" opacity="0.6" />
      <rect x="40" y="1" width="8" height="8" fill="#150d08" />
      <rect x="41" y="2" width="6" height="6" fill="#a02810" />
      <rect x="42" y="3" width="4" height="4" fill="#e8401a" />
      <rect x="42" y="3" width="3" height="3" fill="#ffb040" />
      <rect x="43" y="4" width="2" height="2" fill="#fff4d0" />
      <rect x="43" y="4" width="1" height="1" fill="#ffffff" />
      <!-- flame licks off the orb -->
      <rect x="40" y="0" width="1" height="2" fill="#e8401a" opacity="0.8" />
      <rect x="47" y="0" width="1" height="3" fill="#ffb040" opacity="0.7" />
      <rect x="44" y="0" width="1" height="1" fill="#ffd070" />

      <!-- ══ Robe wings behind ══ -->
      <rect x="10" y="22" width="7" height="38" fill="#160a14" />
      <rect x="11" y="24" width="5" height="34" fill="#1c1020" />
      <rect x="11" y="24" width="2" height="30" fill="#2c1a34" />
      <rect x="39" y="22" width="7" height="38" fill="#120810" />
      <rect x="40" y="24" width="5" height="34" fill="#160a14" />

      <!-- ══ Gaunt elven head ══ -->
