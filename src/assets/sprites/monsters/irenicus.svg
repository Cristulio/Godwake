      <rect x="14" y="28" width="28" height="29" fill="#1c1020" />
      <rect x="14" y="28" width="9" height="29" fill="#241430" />
      <rect x="14" y="28" width="4" height="25" fill="#2c1a34" />
      <rect x="14" y="28" width="1" height="18" fill="#3c2648" />
      <rect x="36" y="28" width="6" height="29" fill="#160a18" />
      <rect x="40" y="28" width="2" height="29" fill="#100818" />
