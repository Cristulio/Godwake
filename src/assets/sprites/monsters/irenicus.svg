      <ellipse cx="10" cy="49" rx="7" ry="5" fill="#7ac0e0" opacity="0.18" />
      <rect x="6" y="45" width="9" height="5" fill="#150d08" />
      <rect x="7" y="46" width="7" height="3" fill="#cfc2b0" />
      <rect x="7" y="46" width="3" height="3" fill="#dccfbd" />
      <rect x="7" y="46" width="7" height="1" fill="#ece2d2" />
      <!-- cold flame hovering -->
      <rect x="9" y="42" width="3" height="3" fill="#7ac0e0" />
      <rect x="9" y="42" width="2" height="2" fill="#d0f0ff" />
      <rect x="10" y="40" width="1" height="2" fill="#7ac0e0" opacity="0.8" />
      <rect x="8" y="43" width="1" height="1" fill="#5a9cc0" opacity="0.8" />

      <!-- ══ Right arm — to the staff ══ -->
      <rect x="37" y="27" width="8" height="8" fill="#150d08" />
      <rect x="38" y="28" width="6" height="6" fill="#160a18" />
      <rect x="38" y="28" width="2" height="6" fill="#1c1020" />
      <!-- hand on the staff -->
      <rect x="40" y="33" width="7" height="6" fill="#150d08" />
      <rect x="41" y="34" width="5" height="4" fill="#a89c88" />
      <rect x="41" y="34" width="2" height="4" fill="#cfc2b0" />
      <rect x="42" y="36" width="1" height="1" fill="#8e8270" />
      <rect x="44" y="36" width="1" height="1" fill="#8e8270" />

      <!-- ══ Robe hem ══ -->
      <rect x="12" y="57" width="32" height="3" fill="#100818" />
      <rect x="11" y="60" width="34" height="13" fill="#150d08" />
      <rect x="12" y="61" width="32" height="11" fill="#1c1020" />
      <rect x="12" y="61" width="8" height="11" fill="#241430" />
      <rect x="12" y="61" width="3" height="9" fill="#2c1a34" />
      <rect x="38" y="61" width="6" height="11" fill="#160a18" />
      <!-- fold lines -->
      <rect x="22" y="61" width="1" height="11" fill="#100818" />
      <rect x="32" y="61" width="2" height="11" fill="#0e0714" />
      <!-- wound light catching the hem -->
      <rect x="27" y="61" width="2" height="6" fill="#e8a020" opacity="0.25" />
      <!-- tattered hem -->
      <rect x="14" y="70" width="3" height="2" fill="#0e0714" />
      <rect x="20" y="71" width="3" height="1" fill="#0e0714" />
      <rect x="27" y="70" width="3" height="2" fill="#0e0714" />
      <rect x="35" y="71" width="3" height="1" fill="#0e0714" />
      <rect x="12" y="72" width="32" height="1" fill="#0a0408" />

      <!-- ══ Drifting soul-motes ══ -->
      <rect x="8" y="20" width="1" height="1" fill="#7ac0e0" opacity="0.6" />
      <rect x="48" y="26" width="1" height="1" fill="#e8401a" opacity="0.6" />
      <rect x="12" y="56" width="1" height="1" fill="#e8a020" opacity="0.5" />
      <rect x="47" y="46" width="1" height="1" fill="#ffd070" opacity="0.45" />
      <rect x="18" y="2" width="1" height="1" fill="#e8a020" opacity="0.4" />
      <rect x="50" y="62" width="1" height="1" fill="#7ac0e0" opacity="0.4" />
    </svg>
