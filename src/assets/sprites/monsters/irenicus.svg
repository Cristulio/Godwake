      <rect x="24" y="18" width="8" height="1" fill="#7a2424" />
      <rect x="24" y="18" width="3" height="1" fill="#8e3030" />
      <!-- ritual scar on the left cheek -->
      <rect x="23" y="13" width="1" height="3" fill="#9a8a74" />

      <!-- ══ High collar ══ -->
      <rect x="16" y="22" width="24" height="5" fill="#150d08" />
      <rect x="17" y="23" width="22" height="4" fill="#2c1a34" />
      <rect x="17" y="23" width="7" height="4" fill="#3c2648" />
      <rect x="17" y="23" width="22" height="1" fill="#4c3460" />
