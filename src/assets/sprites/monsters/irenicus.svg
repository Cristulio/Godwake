      <rect x="9" y="27" width="8" height="8" fill="#150d08" />
      <rect x="10" y="28" width="6" height="6" fill="#241430" />
      <rect x="10" y="28" width="2" height="6" fill="#2c1a34" />
      <rect x="7" y="33" width="8" height="10" fill="#150d08" />
      <rect x="8" y="34" width="6" height="8" fill="#1c1020" />
      <rect x="8" y="34" width="2" height="8" fill="#241430" />
      <!-- wide sleeve cuff -->
