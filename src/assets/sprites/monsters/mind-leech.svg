<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 20 16"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Mind Leech"
    >
      <!-- bulbous body -->
      <ellipse cx="10" cy="8" rx="7" ry="5" fill="#5a4a5a" />
      <ellipse cx="10" cy="7" rx="6" ry="4" fill="#6a5a6a" />
      <ellipse cx="9" cy="6" rx="3" ry="2" fill="#7a6a7a" />

      <!-- segmentation -->
      <rect x="6" y="4" width="1" height="7" fill="#4a3a4a" opacity="0.6" />
      <rect x="10" y="3" width="1" height="9" fill="#4a3a4a" opacity="0.6" />
      <rect x="14" y="4" width="1" height="7" fill="#4a3a4a" opacity="0.6" />

      <!-- underside mouth -->
      <ellipse cx="10" cy="12" rx="4" ry="2" fill="#1a0a14" />
      <rect x="8" y="11" width="1" height="2" fill="#a85a6a" />
      <rect x="11" y="11" width="1" height="2" fill="#a85a6a" />

      <!-- feeding tendrils -->
      <line x1="6" y1="12" x2="4" y2="15" stroke="#4a3a4a" stroke-width="0.8" />
      <line x1="10" y1="13" x2="10" y2="16" stroke="#4a3a4a" stroke-width="0.8" />
      <line x1="14" y1="12" x2="16" y2="15" stroke="#4a3a4a" stroke-width="0.8" />

      <!-- pale psychic shine -->
      <rect x="7" y="5" width="2" height="1" fill="#9aa8d0" opacity="0.6" />
    </svg>
