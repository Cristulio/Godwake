<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 28 22"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Mind Leech"
    >
      <!-- Psychic backlight + ground-contact shadow -->
      <ellipse cx="14" cy="11" rx="14" ry="9" fill="#a85a6a" opacity="0.09" />
      <ellipse cx="14" cy="20.6" rx="10" ry="1.3" fill="#000" opacity="0.36" />

      <!-- ── Dome body — slick violet-grey mantle, key upper-left ── -->
      <rect x="6" y="2" width="16" height="3" fill="#150d08" />
      <rect x="4" y="4" width="20" height="3" fill="#150d08" />
      <rect x="3" y="6" width="22" height="8" fill="#150d08" />
      <!-- fill -->
      <rect x="7" y="3" width="14" height="2" fill="#5a4a5a" />
      <rect x="5" y="5" width="18" height="2" fill="#5a4a5a" />
      <rect x="4" y="7" width="20" height="6" fill="#4a3a4a" />
      <!-- lit dome top -->
      <rect x="7" y="3" width="7" height="2" fill="#6a5a6a" />
      <rect x="7" y="3" width="4" height="1" fill="#7a6a7a" />
      <rect x="7" y="3" width="2" height="1" fill="#948494" />
      <rect x="5" y="5" width="5" height="2" fill="#6a5a6a" />
      <rect x="5" y="5" width="2" height="1" fill="#7a6a7a" />
      <!-- cool shadow flank -->
      <rect x="19" y="6" width="4" height="7" fill="#3a2c3a" />
      <rect x="21" y="8" width="3" height="5" fill="#2e222e" />
      <rect x="23" y="10" width="1" height="3" fill="#26303a" />
      <!-- slick wet glints -->
      <rect x="8" y="4" width="2" height="1" fill="#b8a8b8" />
      <rect x="6" y="6" width="1" height="1" fill="#a894a8" />
      <!-- pulsing psychic vein down the mantle -->
      <rect x="13" y="3" width="2" height="10" fill="#3a2c3a" />
      <rect x="13" y="4" width="1" height="8" fill="#7a4458" />
      <rect x="13" y="5" width="1" height="3" fill="#a85a6a" />
      <rect x="13" y="6" width="1" height="1" fill="#d88a92" />
      <!-- mottled dither -->
      <rect x="10" y="8" width="1" height="1" fill="#3a2c3a" />
      <rect x="16" y="7" width="1" height="1" fill="#5a4a5a" />
      <rect x="18" y="10" width="1" height="1" fill="#2e222e" />
      <rect x="7" y="10" width="1" height="1" fill="#5a4a5a" />

      <!-- ── Eye cluster — three pin-eyes on the lit brow ── -->
      <rect x="8" y="7" width="2" height="2" fill="#1a0e14" />
      <rect x="8" y="7" width="1" height="1" fill="#e0c4d0" />
      <rect x="11" y="6" width="2" height="2" fill="#1a0e14" />
      <rect x="11" y="6" width="1" height="1" fill="#f0dce4" />
      <rect x="15" y="7" width="2" height="2" fill="#1a0e14" />
      <rect x="15" y="7" width="1" height="1" fill="#c8a8b8" />

      <!-- ── Skirt of feeler-cilia at the ground line ── -->
      <rect x="3" y="13" width="22" height="3" fill="#150d08" />
      <rect x="4" y="14" width="20" height="1" fill="#3a2c3a" />
      <rect x="4" y="13" width="20" height="1" fill="#4a3a4a" />
      <rect x="4" y="13" width="5" height="1" fill="#5a4a5a" />
      <!-- sucker mouth peeking under the lip — pink rasp rings -->
      <rect x="9" y="14" width="10" height="3" fill="#150d08" />
      <rect x="10" y="15" width="8" height="2" fill="#7a4458" />
      <rect x="11" y="15" width="6" height="1" fill="#a85a6a" />
      <rect x="12" y="15" width="4" height="1" fill="#d88a92" />
      <rect x="13" y="16" width="2" height="1" fill="#4a2434" />
      <!-- cilia legs, uneven crawl -->
      <rect x="4" y="16" width="2" height="3" fill="#150d08" />
      <rect x="4" y="16" width="1" height="2" fill="#3a2c3a" />
      <rect x="7" y="17" width="2" height="3" fill="#150d08" />
      <rect x="7" y="17" width="1" height="2" fill="#4a3a4a" />
      <rect x="11" y="17" width="2" height="4" fill="#150d08" />
      <rect x="11" y="17" width="1" height="3" fill="#3a2c3a" />
      <rect x="15" y="17" width="2" height="4" fill="#150d08" />
      <rect x="15" y="17" width="1" height="3" fill="#2e222e" />
      <rect x="19" y="17" width="2" height="3" fill="#150d08" />
      <rect x="19" y="17" width="1" height="2" fill="#2e222e" />
      <rect x="22" y="16" width="2" height="3" fill="#150d08" />
      <rect x="22" y="16" width="1" height="2" fill="#26202a" />

      <!-- ── Trailing dorsal feeler, tasting the air ── -->
      <rect x="22" y="3" width="2" height="2" fill="#150d08" />
      <rect x="22" y="3" width="1" height="1" fill="#3a2c3a" />
      <rect x="24" y="1" width="2" height="3" fill="#150d08" />
      <rect x="24" y="2" width="1" height="1" fill="#5a4a5a" />
      <rect x="26" y="0" width="2" height="2" fill="#150d08" opacity="0.8" />
      <rect x="26" y="0" width="1" height="1" fill="#7a4458" />

      <!-- ── Psychic motes lifting off the vein ── -->
      <rect x="12" y="1" width="1" height="1" fill="#d88a92" opacity="0.6" />
      <rect x="15" y="0" width="1" height="1" fill="#a85a6a" opacity="0.5" />
      <rect x="2" y="9" width="1" height="1" fill="#a85a6a" opacity="0.4" />
    </svg>
