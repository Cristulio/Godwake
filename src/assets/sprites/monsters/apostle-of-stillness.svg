<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 40"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Apostle of Stillness"
    >
      <!-- Sanctified pale backlight + ground shadow -->
      <ellipse cx="12" cy="20" rx="11" ry="18" fill="#d8c878" opacity="0.07" />
      <ellipse cx="12" cy="38" rx="8" ry="1.4" fill="#000" opacity="0.35" />

      <!-- Thin still halo of fixed light -->
      <circle cx="12" cy="3" r="6" fill="none" stroke="#d8c878" stroke-width="0.6" opacity="0.7" />
      <circle cx="12" cy="3" r="6" fill="none" stroke="#fff8e0" stroke-width="0.3" opacity="0.5" />

      <!-- Pale ruined head — bone ramp, key upper-left -->
      <rect x="8" y="3" width="8" height="8" fill="#c0bcae" />
      <rect x="8" y="3" width="8" height="1" fill="#d4d0c2" />
      <rect x="8" y="3" width="2" height="8" fill="#d4d0c2" />
      <rect x="8" y="3" width="1" height="5" fill="#e8e4d4" />
      <rect x="14" y="4" width="2" height="7" fill="#9a9484" />
      <rect x="15" y="4" width="1" height="7" fill="#8a8678" />

      <!-- Two coins of unmoving light for eyes -->
      <circle cx="10" cy="6" r="1.3" fill="#f4e8b0" />
      <circle cx="14" cy="6" r="1.3" fill="#f4e8b0" />
      <circle cx="10" cy="6" r="0.6" fill="#fff8e0" />
      <circle cx="14" cy="6" r="0.6" fill="#fff8e0" />
      <!-- Stilled mouth -->
      <rect x="10" y="9" width="4" height="1" fill="#9a9080" />

      <!-- Pale robe — bone ramp, lit centre, shadow flank -->
      <polygon points="7,11 17,11 20,38 4,38" fill="#b0ac9e" />
      <polygon points="7,11 14,11 12,38 6,38" fill="#c8c4b6" />
      <rect x="11" y="11" width="2" height="27" fill="#dcd8c8" />
      <polygon points="16,11 17,11 20,38 17,38" fill="#8a8678" />
      <rect x="7" y="11" width="1" height="27" fill="#9aa6a8" opacity="0.5" />
      <!-- robe dither -->
      <rect x="9" y="22" width="1" height="1" fill="#c8c4b6" />
      <rect x="15" y="28" width="1" height="1" fill="#8a8678" />
      <rect x="8" y="32" width="1" height="1" fill="#c8c4b6" />

      <!-- Raised hand, finger to lips -->
      <rect x="9" y="11" width="2" height="3" fill="#c0bcae" />
      <rect x="9" y="11" width="1" height="3" fill="#d4d0c2" />
      <rect x="10" y="9" width="2" height="3" fill="#c0bcae" />
      <rect x="11" y="8" width="1" height="2" fill="#e8e0d0" />

      <!-- Other arm at side, still -->
      <rect x="16" y="13" width="3" height="11" fill="#b0ac9e" />
      <rect x="16" y="13" width="1" height="11" fill="#c0bcae" />
      <rect x="18" y="13" width="1" height="11" fill="#8a8678" />
      <rect x="16" y="22" width="3" height="2" fill="#c8c4b6" />
      <rect x="16" y="22" width="3" height="1" fill="#d4d0c2" />

      <!-- Gold orphrey down the robe -->
      <rect x="11" y="14" width="2" height="18" fill="#c8a850" opacity="0.7" />
      <rect x="11" y="14" width="1" height="18" fill="#e8c870" opacity="0.5" />
      <rect x="11" y="16" width="1" height="1" fill="#fff0b0" opacity="0.6" />

      <!-- Hem -->
      <polygon points="4,38 7,34 10,38" fill="#9a968a" />
      <polygon points="10,38 13,34 16,38" fill="#9a968a" />
      <polygon points="16,38 19,34 20,38" fill="#9a968a" />
      <polygon points="7,34 8,36 6,36" fill="#c0bcae" opacity="0.6" />
      <polygon points="13,34 14,36 12,36" fill="#c0bcae" opacity="0.6" />
    </svg>
