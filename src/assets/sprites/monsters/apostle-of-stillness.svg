<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 40"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Apostle of Stillness"
    >
      <!-- thin still halo of fixed light -->
      <circle cx="12" cy="3" r="6" fill="none" stroke="#d8c878" stroke-width="0.6" opacity="0.7" />

      <!-- pale ruined head -->
      <rect x="8" y="3" width="8" height="8" fill="#d8d0c0" />
      <rect x="8" y="3" width="8" height="1" fill="#b8b0a0" />
      <!-- two coins of unmoving light for eyes -->
      <circle cx="10" cy="6" r="1.3" fill="#f4e8b0" />
      <circle cx="14" cy="6" r="1.3" fill="#f4e8b0" />
      <circle cx="10" cy="6" r="0.6" fill="#fff8e0" />
      <circle cx="14" cy="6" r="0.6" fill="#fff8e0" />
      <!-- stilled mouth -->
      <rect x="10" y="9" width="4" height="1" fill="#9a9080" />

      <!-- pale robe -->
      <polygon points="7,11 17,11 20,38 4,38" fill="#c0bcae" />
      <polygon points="7,11 17,11 18,26 6,26" fill="#d4d0c2" />
      <rect x="11" y="11" width="2" height="25" fill="#e0dccc" />

      <!-- raised hand, finger to lips -->
      <rect x="9" y="11" width="2" height="3" fill="#d8d0c0" />
      <rect x="10" y="9" width="2" height="3" fill="#d8d0c0" />
      <rect x="11" y="8" width="1" height="2" fill="#e8e0d0" />

      <!-- other arm at side, still -->
      <rect x="16" y="13" width="3" height="11" fill="#c0bcae" />
      <rect x="16" y="22" width="3" height="2" fill="#d8d0c0" />

      <!-- gold orphrey down the robe -->
      <rect x="11" y="14" width="2" height="18" fill="#c8a850" opacity="0.6" />

      <!-- hem -->
      <polygon points="4,38 7,34 10,38" fill="#9a968a" />
      <polygon points="10,38 13,34 16,38" fill="#9a968a" />
      <polygon points="16,38 19,34 20,38" fill="#9a968a" />
    </svg>
