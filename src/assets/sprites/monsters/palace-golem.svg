<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 38"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Rillifane Palace Golem"
    >
      <!-- Grove backlight + ground shadow -->
      <ellipse cx="16" cy="19" rx="15" ry="16" fill="#4e7a38" opacity="0.07" />
      <ellipse cx="16" cy="33" rx="14" ry="4" fill="#0e0c06" opacity="0.4" />

      <!-- Head — carved-wood ramp, key upper-left -->
      <rect x="11" y="2" width="10" height="9" fill="#4a3c26" />
      <rect x="11" y="2" width="10" height="1" fill="#6e5c3a" />
      <rect x="11" y="2" width="2" height="9" fill="#5a4a2e" />
      <rect x="11" y="2" width="1" height="7" fill="#7a6440" />
      <rect x="19" y="3" width="2" height="8" fill="#3e3220" />
      <rect x="11" y="10" width="10" height="1" fill="#2e2614" />
      <!-- Green eyes + spark -->
      <rect x="13" y="5" width="2" height="2" fill="#1a1208" />
      <rect x="17" y="5" width="2" height="2" fill="#1a1208" />
      <rect x="13" y="5" width="1" height="1" fill="#9ad06a" />
      <rect x="17" y="5" width="1" height="1" fill="#9ad06a" />
      <rect x="13" y="5" width="1" height="1" fill="#d4ffa0" opacity="0.6" />
      <rect x="14" y="8" width="4" height="1" fill="#2a2012" />
      <!-- Leaf crest -->
      <polygon points="11,2 16,-1 21,2" fill="#3e6a2e" />
      <polygon points="11,2 16,-1 16,2" fill="#4e7a38" />
      <rect x="15" y="0" width="2" height="2" fill="#5e9a42" />

      <!-- Torso — wood ramp + mossy heart panel -->
      <rect x="8" y="11" width="16" height="16" fill="#473a24" />
      <rect x="8" y="11" width="16" height="2" fill="#62502e" />
      <rect x="8" y="11" width="16" height="1" fill="#74603c" />
      <rect x="8" y="11" width="2" height="15" fill="#4e4028" />
      <rect x="8" y="11" width="1" height="14" fill="#62502e" />
      <rect x="22" y="12" width="2" height="14" fill="#3a2e1c" />
      <rect x="23" y="12" width="1" height="14" fill="#2e2614" />
      <!-- Moss core (glowing green) -->
      <rect x="13" y="13" width="6" height="6" fill="#3e6a2e" opacity="0.6" />
      <rect x="14" y="14" width="4" height="4" fill="#5e9a42" opacity="0.55" />
      <rect x="15" y="15" width="2" height="2" fill="#9ad06a" opacity="0.6" />
      <rect x="15" y="15" width="1" height="1" fill="#d4ffa0" opacity="0.5" />
      <rect x="8" y="20" width="16" height="1" fill="#2e2614" opacity="0.6" />
      <!-- Dither -->
      <rect x="11" y="23" width="1" height="1" fill="#62502e" />
      <rect x="20" y="16" width="1" height="1" fill="#3a2e1c" />

      <!-- Left arm — segmented -->
      <rect x="2" y="12" width="6" height="4" fill="#4e4028" />
      <rect x="2" y="12" width="6" height="1" fill="#62502e" />
      <rect x="1" y="15" width="5" height="9" fill="#574629" />
      <rect x="1" y="15" width="1" height="9" fill="#6e5c3a" />
      <rect x="0" y="23" width="6" height="5" fill="#3e3220" />
      <rect x="1" y="24" width="2" height="3" fill="#2a2012" />
      <rect x="4" y="24" width="2" height="3" fill="#2a2012" />
      <!-- Right arm -->
      <rect x="24" y="12" width="6" height="4" fill="#3e3220" />
      <rect x="24" y="12" width="6" height="1" fill="#4e4028" />
      <rect x="26" y="15" width="5" height="9" fill="#473a24" />
      <rect x="30" y="15" width="1" height="9" fill="#2e2614" />
      <rect x="26" y="23" width="6" height="5" fill="#332815" />
      <rect x="27" y="24" width="2" height="3" fill="#221a0e" />
      <rect x="30" y="24" width="2" height="3" fill="#221a0e" />

      <!-- Legs -->
      <rect x="9" y="27" width="6" height="7" fill="#3e3220" />
      <rect x="9" y="27" width="1" height="7" fill="#574629" />
      <rect x="17" y="27" width="6" height="7" fill="#332815" />
      <rect x="11" y="29" width="1" height="4" fill="#5e7a3e" opacity="0.4" />
      <rect x="19" y="29" width="1" height="4" fill="#5e7a3e" opacity="0.4" />
      <rect x="8" y="33" width="8" height="2" fill="#1a1208" />
      <rect x="16" y="33" width="8" height="2" fill="#140e06" />
      <rect x="4" y="18" width="1" height="1" fill="#9ad06a" opacity="0.4" />
    </svg>
