<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 42 48"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Rillifane Palace Golem"
    >
      <!-- Temple-light backlight + heavy ground shadow -->
      <ellipse cx="21" cy="27" rx="20" ry="19" fill="#3a8a52" opacity="0.05" />
      <ellipse cx="21" cy="46.3" rx="15" ry="1.9" fill="#000" opacity="0.46" />

      <!-- Head — a carved ironwood helm-block, leaf-crested -->
      <rect x="14" y="2" width="14" height="10" fill="#150d08" />
      <rect x="15" y="3" width="12" height="8" fill="#6a3a1a" />
      <rect x="15" y="3" width="12" height="1" fill="#8c5226" />
      <rect x="15" y="3" width="5" height="1" fill="#b07434" />
      <rect x="15" y="3" width="2" height="7" fill="#7a4620" />
      <rect x="25" y="4" width="2" height="7" fill="#4a2810" />
      <rect x="26" y="4" width="1" height="7" fill="#3a2010" />
      <!-- the leaf-crest of the Leaflord's house -->
      <rect x="18" y="0" width="6" height="3" fill="#150d08" />
      <rect x="19" y="1" width="4" height="1" fill="#3a8a52" />
      <rect x="19" y="1" width="2" height="1" fill="#4a9a5e" />
      <rect x="20" y="0" width="2" height="1" fill="#2e5e3c" />
      <!-- eyes — sap-light, the only thing that moves first -->
      <rect x="16" y="6" width="10" height="3" fill="#1a1410" />
      <rect x="17" y="7" width="3" height="1" fill="#6ac482" />
      <rect x="17" y="7" width="1" height="1" fill="#a8f0c0" />
      <rect x="22" y="7" width="3" height="1" fill="#6ac482" />
      <rect x="22" y="7" width="1" height="1" fill="#a8f0c0" />
      <!-- carved jaw-line -->
      <rect x="16" y="10" width="10" height="1" fill="#4a2810" />

      <!-- Pauldrons — grown burls, gold-banded -->
      <rect x="4" y="10" width="13" height="8" fill="#150d08" />
      <rect x="5" y="11" width="11" height="6" fill="#8c5226" />
      <rect x="5" y="11" width="11" height="1" fill="#b07434" />
      <rect x="5" y="11" width="4" height="1" fill="#d4985a" />
      <rect x="5" y="11" width="1" height="5" fill="#a8652e" />
      <rect x="13" y="12" width="3" height="5" fill="#6a3a1a" />
      <!-- gold band -->
      <rect x="5" y="14" width="11" height="1" fill="#9a7232" />
      <rect x="5" y="14" width="4" height="1" fill="#c89a48" />
      <rect x="6" y="14" width="1" height="1" fill="#ecc46a" />
      <rect x="25" y="10" width="13" height="8" fill="#150d08" />
      <rect x="26" y="11" width="11" height="6" fill="#6a3a1a" />
      <rect x="26" y="11" width="11" height="1" fill="#8c5226" />
      <rect x="33" y="12" width="4" height="5" fill="#4a2810" />
      <rect x="36" y="12" width="1" height="5" fill="#3a2010" />
      <rect x="26" y="14" width="11" height="1" fill="#9a7232" />
      <rect x="26" y="14" width="3" height="1" fill="#c89a48" />

      <!-- Torso — one grown bole, grain flowing, sap-runes alight -->
      <rect x="11" y="12" width="20" height="20" fill="#150d08" />
      <rect x="12" y="13" width="18" height="18" fill="#7a4620" />
      <rect x="12" y="13" width="18" height="1" fill="#8c5226" />
      <rect x="12" y="13" width="7" height="1" fill="#b07434" />
      <rect x="12" y="13" width="3" height="18" fill="#86501f" />
      <rect x="12" y="13" width="1" height="12" fill="#a8652e" />
      <rect x="27" y="13" width="3" height="18" fill="#5a3018" />
      <rect x="29" y="13" width="1" height="18" fill="#4a2810" />
      <!-- the grain flowing like muscle -->
      <rect x="17" y="14" width="1" height="16" fill="#5a3018" />
      <rect x="24" y="14" width="1" height="16" fill="#5a3018" />
      <rect x="20" y="15" width="2" height="14" fill="#6a3a1a" />
      <!-- the living gold inlay — the palace ward-script -->
      <rect x="14" y="16" width="5" height="1" fill="#9a7232" />
      <rect x="14" y="16" width="2" height="1" fill="#ecc46a" />
      <rect x="23" y="16" width="5" height="1" fill="#9a7232" />
      <rect x="25" y="16" width="2" height="1" fill="#c89a48" />
      <rect x="15" y="20" width="3" height="1" fill="#c89a48" />
      <rect x="24" y="20" width="3" height="1" fill="#9a7232" />
      <rect x="14" y="24" width="4" height="1" fill="#9a7232" />
      <rect x="15" y="24" width="1" height="1" fill="#ecc46a" />
      <rect x="24" y="24" width="4" height="1" fill="#9a7232" />
      <!-- the heart-rune, sap-green, still keeping its one order -->
      <rect x="19" y="18" width="4" height="5" fill="#150d08" />
      <rect x="20" y="19" width="2" height="3" fill="#2e5e3c" />
      <rect x="20" y="19" width="2" height="1" fill="#3a8a52" />
      <rect x="20" y="19" width="1" height="1" fill="#6ac482" />
      <rect x="21" y="21" width="1" height="1" fill="#1e3a28" />
      <!-- moss in the shaded joints -->
      <rect x="27" y="26" width="3" height="2" fill="#234a30" />
      <rect x="28" y="27" width="2" height="1" fill="#1e3a28" />
      <rect x="13" y="28" width="2" height="1" fill="#2e5e3c" />

      <!-- Left arm — slammer, swung back -->
      <rect x="3" y="17" width="8" height="14" fill="#150d08" />
      <rect x="4" y="18" width="6" height="12" fill="#8c5226" />
      <rect x="4" y="18" width="6" height="1" fill="#b07434" />
      <rect x="4" y="18" width="2" height="11" fill="#a8652e" />
      <rect x="4" y="18" width="1" height="7" fill="#b07434" />
      <rect x="8" y="19" width="2" height="11" fill="#6a3a1a" />
      <!-- grain rings at the elbow -->
      <rect x="4" y="23" width="6" height="1" fill="#5a3018" />
      <rect x="4" y="23" width="2" height="1" fill="#8c5226" />
      <!-- the grown fist — a maul of rootwood -->
      <rect x="1" y="30" width="10" height="8" fill="#150d08" />
      <rect x="2" y="31" width="8" height="6" fill="#7a4620" />
      <rect x="2" y="31" width="8" height="1" fill="#a8652e" />
      <rect x="2" y="31" width="2" height="5" fill="#86501f" />
      <rect x="7" y="32" width="3" height="5" fill="#5a3018" />
      <!-- gold knuckle-band -->
      <rect x="2" y="33" width="8" height="1" fill="#9a7232" />
      <rect x="2" y="33" width="3" height="1" fill="#c89a48" />

      <!-- Right arm — mid-slam forward -->
      <rect x="31" y="17" width="8" height="14" fill="#150d08" />
      <rect x="32" y="18" width="6" height="12" fill="#6a3a1a" />
      <rect x="32" y="18" width="6" height="1" fill="#8c5226" />
      <rect x="36" y="19" width="2" height="11" fill="#4a2810" />
      <rect x="34" y="23" width="4" height="1" fill="#3a2010" />
      <!-- fist -->
      <rect x="31" y="30" width="10" height="8" fill="#150d08" />
      <rect x="32" y="31" width="8" height="6" fill="#5f3416" />
      <rect x="32" y="31" width="8" height="1" fill="#7a4620" />
      <rect x="37" y="32" width="3" height="5" fill="#44250e" />
      <rect x="32" y="33" width="8" height="1" fill="#9a7232" />
      <rect x="33" y="33" width="2" height="1" fill="#c89a48" />

      <!-- Hip block + skirt of carved fronds -->
      <rect x="11" y="32" width="20" height="5" fill="#150d08" />
      <rect x="12" y="33" width="18" height="3" fill="#6a3a1a" />
      <rect x="12" y="33" width="18" height="1" fill="#8c5226" />
      <rect x="12" y="33" width="5" height="2" fill="#7a4620" />
      <rect x="26" y="34" width="4" height="2" fill="#4a2810" />
      <!-- frond cuts -->
      <rect x="16" y="34" width="1" height="3" fill="#150d08" />
      <rect x="21" y="34" width="1" height="3" fill="#150d08" />
      <rect x="26" y="34" width="1" height="3" fill="#150d08" />

      <!-- Legs — grown columns -->
      <rect x="12" y="36" width="8" height="9" fill="#150d08" />
      <rect x="13" y="37" width="6" height="7" fill="#7a4620" />
      <rect x="13" y="37" width="2" height="7" fill="#86501f" />
      <rect x="13" y="37" width="1" height="5" fill="#a8652e" />
      <rect x="17" y="37" width="2" height="7" fill="#5a3018" />
      <rect x="22" y="36" width="8" height="9" fill="#150d08" />
      <rect x="23" y="37" width="6" height="7" fill="#5f3416" />
      <rect x="23" y="37" width="1" height="7" fill="#6a3a1a" />
      <rect x="27" y="37" width="2" height="7" fill="#44250e" />
      <!-- grain ring at the knees -->
      <rect x="13" y="40" width="6" height="1" fill="#5a3018" />
      <rect x="23" y="40" width="6" height="1" fill="#3a2010" />
      <!-- root-block feet gripping the temple floor -->
      <rect x="10" y="44" width="10" height="3" fill="#150d08" />
      <rect x="11" y="44" width="8" height="2" fill="#5a3018" />
      <rect x="11" y="44" width="4" height="1" fill="#6a3a1a" />
      <rect x="22" y="44" width="10" height="3" fill="#150d08" />
      <rect x="23" y="44" width="8" height="2" fill="#48260e" />
      <rect x="23" y="44" width="3" height="1" fill="#5a3018" />
      <!-- root toes -->
      <rect x="8" y="45" width="3" height="2" fill="#150d08" />
      <rect x="9" y="45" width="2" height="1" fill="#4a2810" />
      <rect x="31" y="45" width="3" height="2" fill="#150d08" />
      <rect x="32" y="45" width="2" height="1" fill="#3a2010" />

      <!-- Pollen-dust of the dead palace -->
      <rect x="6" y="13" width="1" height="1" fill="#ecc46a" opacity="0.4" />
      <rect x="36" y="26" width="1" height="1" fill="#c89a48" opacity="0.4" />
      <rect x="9" y="40" width="1" height="1" fill="#6ac482" opacity="0.35" />
      <rect x="33" y="14" width="1" height="1" fill="#3a8a52" opacity="0.4" />
    </svg>
