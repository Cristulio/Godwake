<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 34 42"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Masquerade-Warden"
    >
      <!-- Revel-light backlight + ground shadow -->
      <ellipse cx="17" cy="22" rx="16" ry="17" fill="#58525c" opacity="0.08" />
      <ellipse cx="17" cy="40.4" rx="10" ry="1.6" fill="#000" opacity="0.38" />

      <!-- The swirl of false faces it keeps dancing — orbiting masks -->
      <!-- upper-left mask, three-quarter -->
      <rect x="2" y="4" width="6" height="7" fill="#150d08" />
      <rect x="3" y="5" width="4" height="5" fill="#e8dcc4" />
      <rect x="3" y="5" width="4" height="1" fill="#f8f2e2" />
      <rect x="6" y="6" width="1" height="4" fill="#cdbfa2" />
      <rect x="4" y="7" width="1" height="1" fill="#0e0c12" />
      <rect x="6" y="7" width="1" height="1" fill="#0e0c12" />
      <rect x="4" y="9" width="2" height="1" fill="#a93340" />
      <!-- right mask, tilted, laughing -->
      <rect x="27" y="8" width="6" height="7" fill="#150d08" />
      <rect x="28" y="9" width="4" height="5" fill="#f0e6d2" />
      <rect x="28" y="9" width="4" height="1" fill="#f8f2e2" />
      <rect x="31" y="10" width="1" height="4" fill="#cdbfa2" />
      <rect x="29" y="11" width="1" height="1" fill="#0e0c12" />
      <rect x="31" y="11" width="1" height="1" fill="#0e0c12" />
      <rect x="29" y="13" width="3" height="1" fill="#531320" />
      <!-- low-left mask, half-dissolved -->
      <rect x="3" y="24" width="5" height="6" fill="#150d08" />
      <rect x="4" y="25" width="3" height="4" fill="#cdbfa2" opacity="0.85" />
      <rect x="4" y="25" width="3" height="1" fill="#e8dcc4" opacity="0.85" />
      <rect x="5" y="26" width="1" height="1" fill="#0e0c12" />
      <rect x="4" y="28" width="2" height="1" fill="#7e1f2c" opacity="0.8" />
      <!-- trailing mask-shimmer between them -->
      <rect x="8" y="3" width="1" height="1" fill="#cdbfa2" opacity="0.4" />
      <rect x="26" y="6" width="1" height="1" fill="#e8dcc4" opacity="0.4" />
      <rect x="7" y="22" width="1" height="1" fill="#b4a486" opacity="0.4" />
      <rect x="30" y="17" width="1" height="1" fill="#cdbfa2" opacity="0.35" />

      <!-- Its own head — the master's mask, horned in gilt -->
      <rect x="11" y="2" width="12" height="11" fill="#150d08" />
      <rect x="12" y="3" width="10" height="9" fill="#e8dcc4" />
      <rect x="12" y="3" width="10" height="1" fill="#f8f2e2" />
      <rect x="12" y="3" width="4" height="2" fill="#f8f2e2" />
      <rect x="12" y="3" width="1" height="7" fill="#f0e6d2" />
      <rect x="20" y="4" width="2" height="8" fill="#cdbfa2" />
      <rect x="21" y="5" width="1" height="7" fill="#b4a486" />
      <rect x="13" y="12" width="8" height="1" fill="#cdbfa2" />
      <!-- gilt crescent horns of the revel-master -->
      <rect x="9" y="0" width="4" height="3" fill="#150d08" />
      <rect x="10" y="1" width="2" height="1" fill="#c89a48" />
      <rect x="10" y="1" width="1" height="1" fill="#ecc46a" />
      <rect x="21" y="0" width="4" height="3" fill="#150d08" />
      <rect x="22" y="1" width="2" height="1" fill="#9a7232" />
      <rect x="22" y="1" width="1" height="1" fill="#c89a48" />
      <!-- its eyes — two different sockets, neither honest -->
      <rect x="13" y="6" width="3" height="2" fill="#0e0c12" />
      <rect x="18" y="6" width="3" height="3" fill="#0e0c12" />
      <rect x="14" y="6" width="1" height="1" fill="#e8f4f8" />
      <rect x="19" y="7" width="1" height="1" fill="#c4b0f0" />
      <!-- the smile painted too wide -->
      <rect x="14" y="10" width="6" height="1" fill="#a93340" />
      <rect x="13" y="9" width="1" height="1" fill="#a93340" />
      <rect x="20" y="9" width="1" height="1" fill="#a93340" />

      <!-- Revel-master's doublet — midnight violet, gilt chains -->
      <rect x="10" y="13" width="14" height="15" fill="#150d08" />
      <rect x="11" y="14" width="12" height="13" fill="#332550" />
      <rect x="11" y="14" width="12" height="1" fill="#473570" />
      <rect x="11" y="14" width="5" height="1" fill="#5a4690" />
      <rect x="11" y="14" width="2" height="13" fill="#3d2d60" />
      <rect x="11" y="14" width="1" height="8" fill="#503d78" />
      <rect x="20" y="14" width="3" height="13" fill="#281c44" />
      <rect x="22" y="14" width="1" height="13" fill="#201638" />
      <!-- shade at the collar -->
      <rect x="14" y="13" width="6" height="2" fill="#221e26" />
      <!-- the warden's chain of office — masks strung on gilt -->
      <rect x="12" y="16" width="1" height="1" fill="#c89a48" />
      <rect x="13" y="17" width="1" height="1" fill="#9a7232" />
      <rect x="14" y="18" width="1" height="1" fill="#c89a48" />
      <rect x="16" y="19" width="2" height="2" fill="#e8dcc4" />
      <rect x="16" y="19" width="2" height="1" fill="#f0e6d2" />
      <rect x="16" y="20" width="1" height="1" fill="#0e0c12" />
      <rect x="19" y="18" width="1" height="1" fill="#c89a48" />
      <rect x="20" y="17" width="1" height="1" fill="#9a7232" />
      <rect x="21" y="16" width="1" height="1" fill="#c89a48" />
      <!-- wine sash of the revels -->
      <rect x="11" y="23" width="12" height="2" fill="#531320" />
      <rect x="11" y="23" width="12" height="1" fill="#7e1f2c" />
      <rect x="11" y="23" width="4" height="1" fill="#a93340" />

      <!-- Right arm — the curved revel-knife, held low out of the crowd -->
      <rect x="23" y="15" width="6" height="4" fill="#150d08" />
      <rect x="24" y="16" width="4" height="2" fill="#332550" />
      <rect x="24" y="16" width="4" height="1" fill="#473570" />
      <rect x="26" y="19" width="4" height="4" fill="#150d08" />
      <rect x="27" y="20" width="2" height="2" fill="#3d2d60" />
      <rect x="27" y="20" width="1" height="1" fill="#503d78" />
      <!-- the curve of the blade — a smile done in steel -->
      <rect x="28" y="22" width="5" height="2" fill="#150d08" />
      <rect x="29" y="22" width="3" height="1" fill="#b8d8e0" />
      <rect x="31" y="21" width="2" height="2" fill="#150d08" />
      <rect x="31" y="21" width="1" height="1" fill="#e8f4f8" />
      <rect x="27" y="23" width="2" height="2" fill="#150d08" />
      <rect x="27" y="23" width="1" height="1" fill="#8fb8c0" />
      <!-- gilt pommel -->
      <rect x="26" y="22" width="1" height="1" fill="#ecc46a" />

      <!-- Left arm sweeping the false faces up — conductor's gesture -->
      <rect x="6" y="13" width="5" height="4" fill="#150d08" />
      <rect x="7" y="14" width="3" height="2" fill="#332550" />
      <rect x="7" y="14" width="3" height="1" fill="#473570" />
      <rect x="4" y="10" width="5" height="5" fill="#150d08" />
      <rect x="5" y="11" width="3" height="3" fill="#3d2d60" />
      <rect x="5" y="11" width="3" height="1" fill="#503d78" />
      <!-- raised gloved hand mid-flourish -->
      <rect x="5" y="7" width="4" height="4" fill="#150d08" />
      <rect x="6" y="8" width="2" height="2" fill="#2e2a32" />
      <rect x="6" y="8" width="1" height="1" fill="#46404c" />

      <!-- Long coat skirts, parted on shade -->
      <rect x="10" y="28" width="14" height="11" fill="#150d08" />
      <rect x="11" y="29" width="12" height="9" fill="#2b1f48" />
      <rect x="11" y="29" width="12" height="1" fill="#332550" />
      <rect x="11" y="29" width="3" height="9" fill="#332550" />
      <rect x="20" y="29" width="3" height="9" fill="#221638" />
      <rect x="22" y="29" width="1" height="9" fill="#1c1230" />
      <!-- gilt hem -->
      <rect x="11" y="36" width="12" height="1" fill="#9a7232" opacity="0.85" />
      <rect x="12" y="36" width="3" height="1" fill="#c89a48" />
      <!-- the parted shade beneath -->
      <rect x="15" y="31" width="4" height="7" fill="#221e26" />
      <rect x="16" y="32" width="2" height="6" fill="#16131a" />
      <!-- boots stepping out of the dark -->
      <rect x="12" y="38" width="5" height="2" fill="#150d08" />
      <rect x="13" y="38" width="3" height="1" fill="#28242c" />
      <rect x="18" y="38" width="5" height="2" fill="#150d08" />
      <rect x="19" y="38" width="3" height="1" fill="#221e26" />

      <!-- Confetti of the dead revel, still falling -->
      <rect x="25" y="28" width="1" height="1" fill="#a93340" opacity="0.45" />
      <rect x="8" y="32" width="1" height="1" fill="#c89a48" opacity="0.4" />
      <rect x="27" y="34" width="1" height="1" fill="#cdbfa2" opacity="0.4" />
      <rect x="9" y="19" width="1" height="1" fill="#7e1f2c" opacity="0.4" />
    </svg>
