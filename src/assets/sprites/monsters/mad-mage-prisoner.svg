<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 22 36"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Mad Mage Prisoner"
    >
      <!-- Cold dungeon backlight + ground shadow -->
      <ellipse cx="11" cy="18" rx="11" ry="16" fill="#5a6ad0" opacity="0.07" />
      <ellipse cx="11" cy="35" rx="8" ry="1.4" fill="#000" opacity="0.42" />

      <!-- Wild hair spikes — grey ramp -->
      <rect x="4" y="0" width="2" height="3" fill="#6a5a3a" />
      <rect x="4" y="0" width="1" height="3" fill="#8c7a52" />
      <rect x="7" y="0" width="1" height="4" fill="#8c7a52" />
      <rect x="10" y="0" width="2" height="2" fill="#a89878" />
      <rect x="13" y="0" width="1" height="3" fill="#6a5a3a" />
      <rect x="16" y="0" width="2" height="4" fill="#5a4c34" />

      <!-- Gaunt face — pale ramp, key upper-left -->
      <rect x="5" y="3" width="12" height="5" fill="#c2b794" />
      <rect x="5" y="3" width="12" height="1" fill="#d4c8a8" />
      <rect x="5" y="3" width="3" height="5" fill="#d4c8a8" />
      <rect x="5" y="3" width="1" height="4" fill="#e8dcc4" />
      <rect x="4" y="4" width="1" height="4" fill="#8c7a52" />
      <rect x="15" y="4" width="2" height="4" fill="#a89878" />
      <rect x="17" y="4" width="1" height="4" fill="#7a6848" />

      <!-- Hair sides -->
      <rect x="3" y="3" width="3" height="6" fill="#6a5a3a" />
      <rect x="3" y="3" width="1" height="6" fill="#8c7a52" />
      <rect x="16" y="3" width="3" height="6" fill="#5a4c34" />
      <rect x="2" y="5" width="2" height="3" fill="#6a5a3a" />
      <rect x="18" y="5" width="2" height="3" fill="#5a4c34" />

      <!-- Manic eyes — dark, red-rimmed, amber spark -->
      <rect x="6" y="5" width="2" height="2" fill="#0a0808" />
      <rect x="14" y="5" width="2" height="2" fill="#0a0808" />
      <rect x="6" y="5" width="2" height="1" fill="#b53c4a" />
      <rect x="14" y="5" width="2" height="1" fill="#b53c4a" />
      <rect x="7" y="5" width="1" height="1" fill="#f4d042" />
      <rect x="15" y="5" width="1" height="1" fill="#f4d042" />

      <!-- Manic grin -->
      <rect x="8" y="7" width="6" height="1" fill="#5a1208" />
      <rect x="9" y="7" width="1" height="1" fill="#d4c8a8" />
      <rect x="12" y="7" width="1" height="1" fill="#d4c8a8" />

      <!-- Beard / collar — pale ramp -->
      <rect x="4" y="8" width="14" height="3" fill="#b2a684" />
      <rect x="4" y="8" width="14" height="1" fill="#d4c8a8" />
      <rect x="5" y="9" width="12" height="2" fill="#a89878" />
      <rect x="6" y="10" width="10" height="1" fill="#7a6848" />

      <!-- Robe torso — blue-grey ramp -->
      <rect x="4" y="11" width="14" height="13" fill="#34425a" />
      <rect x="4" y="11" width="14" height="1" fill="#4a5870" />
      <rect x="4" y="11" width="2" height="12" fill="#3a4860" />
      <rect x="4" y="11" width="1" height="12" fill="#52608a" />
      <rect x="16" y="11" width="2" height="12" fill="#2a3848" />
      <rect x="17" y="11" width="1" height="12" fill="#202c3a" />
      <rect x="10" y="11" width="2" height="13" fill="#2a3848" />
      <!-- Stains + dither -->
      <rect x="6" y="14" width="2" height="2" fill="#5a4058" opacity="0.7" />
      <rect x="12" y="17" width="3" height="2" fill="#5a4058" opacity="0.7" />
      <rect x="8" y="20" width="4" height="1" fill="#5a1208" opacity="0.5" />
      <rect x="7" y="15" width="1" height="1" fill="#4a5870" />
      <rect x="14" y="20" width="1" height="1" fill="#2a3848" />

      <!-- Rope belt -->
      <rect x="4" y="22" width="14" height="2" fill="#5a4028" />
      <rect x="4" y="22" width="14" height="1" fill="#7a5a38" />
      <rect x="10" y="22" width="2" height="3" fill="#5a4028" />

      <!-- Arms + manacles -->
      <rect x="2" y="13" width="2" height="6" fill="#34425a" />
      <rect x="2" y="13" width="1" height="6" fill="#3a4860" />
      <rect x="18" y="13" width="2" height="6" fill="#2a3848" />
      <rect x="18" y="13" width="1" height="6" fill="#34425a" />
      <rect x="2" y="19" width="2" height="3" fill="#b5a282" />
      <rect x="2" y="19" width="2" height="1" fill="#d4c8a8" />
      <rect x="18" y="19" width="2" height="3" fill="#a89878" />
      <rect x="18" y="19" width="2" height="1" fill="#c2b794" />

      <!-- Steel cuffs + chain -->
      <rect x="0" y="20" width="3" height="2" fill="#8a91a4" />
      <rect x="0" y="20" width="3" height="1" fill="#c0c8d8" />
      <rect x="0" y="21" width="3" height="1" fill="#5a606e" />
      <circle cx="0" cy="21.5" r="0.7" fill="#0a0808" />
      <rect x="19" y="20" width="3" height="2" fill="#8a91a4" />
      <rect x="19" y="20" width="3" height="1" fill="#c0c8d8" />
      <rect x="19" y="21" width="3" height="1" fill="#5a606e" />
      <circle cx="22" cy="21.5" r="0.7" fill="#0a0808" />
      <circle cx="2" cy="22" r="0.6" fill="#6a7080" />
      <circle cx="3" cy="23" r="0.6" fill="#5a606e" />
      <circle cx="2" cy="24" r="0.6" fill="#6a7080" />
      <circle cx="20" cy="22" r="0.6" fill="#6a7080" />
      <circle cx="19" cy="23" r="0.6" fill="#5a606e" />
      <circle cx="20" cy="24" r="0.6" fill="#6a7080" />

      <!-- Wild-magic orb at the wrist -->
      <circle cx="2" cy="13" r="2.5" fill="#a48ee0" opacity="0.4" />
      <circle cx="2" cy="13" r="1.5" fill="#e8d4ff" opacity="0.7" />
      <circle cx="2" cy="13" r="0.6" fill="#ffffff" />

      <!-- Ragged robe skirt -->
      <rect x="5" y="25" width="12" height="8" fill="#34425a" />
      <rect x="5" y="25" width="12" height="1" fill="#4a5870" />
      <rect x="5" y="25" width="2" height="8" fill="#3a4860" />
      <rect x="15" y="25" width="2" height="8" fill="#2a3848" />
      <polygon points="5,33 7,30 9,33" fill="#34425a" />
      <polygon points="9,33 11,30 13,33" fill="#2e3c52" />
      <polygon points="13,33 15,30 17,33" fill="#2a3848" />

      <!-- Bare feet -->
      <rect x="6" y="33" width="3" height="3" fill="#1a1410" />
      <rect x="13" y="33" width="3" height="3" fill="#140e0a" />
      <rect x="6" y="33" width="3" height="1" fill="#3a2418" />
    </svg>
