<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 53"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Hollow Seraph"
    >
      <!-- Faded-halo backlight + ground shadow -->
      <ellipse cx="16" cy="25" rx="15" ry="23" fill="#c8b878" opacity="0.08" />
      <ellipse cx="16" cy="51.6" rx="10" ry="1.8" fill="#000" opacity="0.42" />

      <!-- ── Broken halo — a tarnished ring, hanging askew ── -->
      <ellipse cx="16" cy="3.5" rx="6" ry="3.4" fill="#c8b878" opacity="0.16" />
      <rect x="10" y="1" width="9" height="1" fill="#9a8850" />
      <rect x="10" y="1" width="4" height="1" fill="#c8b878" />
      <rect x="9" y="2" width="1" height="2" fill="#9a8850" />
      <rect x="19" y="2" width="1" height="1" fill="#7a6c40" />
      <rect x="10" y="4" width="5" height="1" fill="#7a6c40" />
      <!-- the missing arc — just absence -->

      <!-- ── Soot-light wings — stepped stubs, molting ── -->
      <rect x="0" y="10" width="3" height="4" fill="#150d08" />
      <rect x="1" y="11" width="2" height="2" fill="#5a5048" />
      <rect x="2" y="8" width="3" height="9" fill="#150d08" />
      <rect x="3" y="9" width="2" height="7" fill="#6a6058" />
      <rect x="3" y="9" width="1" height="4" fill="#8a8070" />
      <rect x="5" y="9" width="3" height="11" fill="#150d08" />
      <rect x="6" y="10" width="2" height="9" fill="#5a5048" />
      <rect x="6" y="10" width="1" height="5" fill="#6a6058" />
      <!-- molted gap -->
      <rect x="4" y="13" width="1" height="2" fill="#150d08" />
      <rect x="29" y="10" width="3" height="4" fill="#150d08" />
      <rect x="29" y="11" width="2" height="2" fill="#4a443c" />
      <rect x="27" y="8" width="3" height="9" fill="#150d08" />
      <rect x="28" y="9" width="2" height="7" fill="#4a443c" />
      <rect x="24" y="9" width="3" height="11" fill="#150d08" />
      <rect x="25" y="10" width="2" height="9" fill="#3a352e" />
      <rect x="25" y="16" width="1" height="2" fill="#2e4a4e" />
      <!-- falling soot-feathers -->
      <rect x="2" y="20" width="1" height="2" fill="#5a5048" opacity="0.6" />
      <rect x="30" y="19" width="1" height="2" fill="#3a352e" opacity="0.6" />
      <rect x="4" y="25" width="1" height="1" fill="#6a6058" opacity="0.4" />

      <!-- ── Helm — tarnished gold, the face simply absent ── -->
      <rect x="10" y="5" width="12" height="11" fill="#150d08" />
      <rect x="11" y="6" width="10" height="9" fill="#8a7a48" />
      <rect x="11" y="6" width="10" height="1" fill="#c8b878" />
      <rect x="11" y="6" width="3" height="9" fill="#9a8850" />
      <rect x="11" y="6" width="1" height="6" fill="#b8a868" />
      <rect x="11" y="6" width="1" height="2" fill="#d4c488" />
      <rect x="18" y="7" width="3" height="8" fill="#6a5c34" />
      <rect x="20" y="8" width="1" height="7" fill="#5a4c28" />
      <!-- the void where a face was -->
      <rect x="12" y="9" width="8" height="4" fill="#05070a" />
      <rect x="12" y="9" width="8" height="1" fill="#0a0c10" />
      <!-- one cold ember drifting in the hollow -->
      <rect x="14" y="10" width="1" height="1" fill="#6a90b0" />
      <rect x="14" y="10" width="1" height="1" fill="#a8c8e0" opacity="0.6" />
      <!-- chin guard -->
      <rect x="12" y="13" width="8" height="2" fill="#7a6c40" />
      <rect x="12" y="13" width="3" height="1" fill="#9a8850" />

      <!-- ── Gorget + pauldrons — tarnished gold plate ── -->
      <rect x="6" y="16" width="20" height="4" fill="#150d08" />
      <rect x="7" y="17" width="18" height="2" fill="#8a7a48" />
      <rect x="7" y="17" width="18" height="1" fill="#b8a868" />
      <rect x="7" y="17" width="5" height="1" fill="#c8b878" />
      <rect x="21" y="17" width="4" height="2" fill="#6a5c34" />

      <!-- ── Cuirass — gold husk, dented; nothing holds it up ── -->
      <rect x="7" y="20" width="18" height="15" fill="#150d08" />
      <rect x="8" y="21" width="16" height="13" fill="#8a7a48" />
      <rect x="8" y="21" width="16" height="1" fill="#b8a868" />
      <rect x="8" y="21" width="3" height="12" fill="#9a8850" />
      <rect x="8" y="21" width="1" height="9" fill="#b8a868" />
      <rect x="8" y="21" width="1" height="3" fill="#d4c488" />
      <rect x="21" y="21" width="3" height="12" fill="#6a5c34" />
      <rect x="23" y="22" width="1" height="11" fill="#5a4c28" />
      <rect x="23" y="26" width="1" height="4" fill="#4e5a50" />
      <!-- sternum seam -->
      <rect x="15" y="21" width="1" height="12" fill="#9a8850" />
      <rect x="16" y="21" width="1" height="12" fill="#5a4c28" />
      <!-- the hollow rent — punched through, light leaks out ── -->
      <rect x="12" y="24" width="8" height="6" fill="#150d08" />
      <rect x="13" y="25" width="6" height="4" fill="#05070a" />
      <!-- faint god-light still pooled at the bottom of the husk -->
      <rect x="13" y="28" width="6" height="1" fill="#6a90b0" opacity="0.5" />
      <rect x="14" y="27" width="2" height="1" fill="#6a90b0" opacity="0.3" />
      <!-- torn metal petals around the rent -->
      <rect x="11" y="25" width="1" height="2" fill="#c8b878" />
      <rect x="20" y="26" width="1" height="2" fill="#6a5c34" />
      <rect x="13" y="23" width="2" height="1" fill="#d4c488" />
      <rect x="17" y="30" width="2" height="1" fill="#5a4c28" />
      <!-- dents + tarnish dither -->
      <rect x="10" y="22" width="1" height="1" fill="#6a5c34" />
      <rect x="19" y="22" width="1" height="1" fill="#5a4c28" />
      <rect x="9" y="31" width="1" height="1" fill="#b8a868" />
      <rect x="21" y="31" width="1" height="1" fill="#4e4222" />

      <!-- ── Left arm — gauntlet open, palm up: an offering of nothing ── -->
      <rect x="3" y="20" width="5" height="11" fill="#150d08" />
      <rect x="4" y="21" width="3" height="9" fill="#8a7a48" />
      <rect x="4" y="21" width="1" height="9" fill="#b8a868" />
      <rect x="6" y="21" width="1" height="9" fill="#6a5c34" />
      <rect x="2" y="30" width="6" height="3" fill="#150d08" />
      <rect x="3" y="31" width="4" height="1" fill="#9a8850" />
      <rect x="3" y="31" width="2" height="1" fill="#c8b878" />
      <!-- nothing in the palm but a mote -->
      <rect x="4" y="28" width="1" height="1" fill="#a8c8e0" opacity="0.6" />

      <!-- ── Right arm — the cold-light blade, point down at rest ── -->
      <rect x="24" y="20" width="5" height="11" fill="#150d08" />
      <rect x="25" y="21" width="3" height="9" fill="#6a5c34" />
      <rect x="25" y="21" width="1" height="9" fill="#8a7a48" />
      <rect x="27" y="21" width="1" height="9" fill="#5a4c28" />
      <rect x="24" y="30" width="5" height="3" fill="#150d08" />
      <rect x="25" y="31" width="3" height="1" fill="#7a6c40" />
      <!-- the blade — a bar of cold light driven at the floor -->
      <rect x="25" y="33" width="3" height="16" fill="#150d08" />
      <rect x="26" y="34" width="1" height="14" fill="#cfe8ff" />
      <rect x="27" y="34" width="1" height="13" fill="#8aa0c0" />
      <rect x="26" y="34" width="1" height="5" fill="#ffffff" />
      <ellipse cx="26.5" cy="41" rx="2.6" ry="7" fill="#a8c8e0" opacity="0.18" />
      <!-- guard -->
      <rect x="24" y="33" width="5" height="1" fill="#9a8850" />
      <rect x="24" y="33" width="2" height="1" fill="#c8b878" />

      <!-- ── Faulds + greaves — the husk continues, empty ── -->
      <rect x="8" y="35" width="16" height="4" fill="#150d08" />
      <rect x="9" y="36" width="14" height="2" fill="#7a6c40" />
      <rect x="9" y="36" width="14" height="1" fill="#9a8850" />
      <rect x="12" y="36" width="1" height="2" fill="#5a4c28" />
      <rect x="16" y="36" width="1" height="2" fill="#4e4222" />
      <rect x="20" y="36" width="1" height="2" fill="#5a4c28" />
      <rect x="8" y="39" width="7" height="9" fill="#150d08" />
      <rect x="9" y="40" width="5" height="7" fill="#8a7a48" />
      <rect x="9" y="40" width="1" height="7" fill="#b8a868" />
      <rect x="12" y="40" width="2" height="7" fill="#6a5c34" />
      <rect x="9" y="43" width="5" height="1" fill="#5a4c28" />
      <rect x="17" y="39" width="7" height="9" fill="#150d08" />
      <rect x="18" y="40" width="5" height="7" fill="#6a5c34" />
      <rect x="18" y="40" width="1" height="7" fill="#8a7a48" />
      <rect x="21" y="40" width="2" height="7" fill="#5a4c28" />
      <rect x="18" y="43" width="5" height="1" fill="#4e4222" />
      <!-- poleyn glints -->
      <rect x="10" y="42" width="2" height="1" fill="#d4c488" />
      <rect x="19" y="42" width="1" height="1" fill="#9a8850" />

      <!-- ── Sabatons ── -->
      <rect x="7" y="48" width="8" height="4" fill="#150d08" />
      <rect x="8" y="49" width="6" height="2" fill="#6a5c34" />
      <rect x="8" y="49" width="6" height="1" fill="#9a8850" />
      <rect x="16" y="48" width="8" height="4" fill="#150d08" />
      <rect x="17" y="49" width="6" height="2" fill="#5a4c28" />
      <rect x="17" y="49" width="6" height="1" fill="#7a6c40" />

      <!-- ── Gold dust shedding off the husk ── -->
      <rect x="5" y="16" width="1" height="1" fill="#c8b878" opacity="0.5" />
      <rect x="27" y="15" width="1" height="1" fill="#b8a868" opacity="0.45" />
      <rect x="2" y="37" width="1" height="1" fill="#9a8850" opacity="0.4" />
      <rect x="30" y="28" width="1" height="1" fill="#c8b878" opacity="0.4" />
    </svg>
