<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 26 30"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="God-Essence Mote"
    >
      <!-- Murder-glow backlight + the small shadow of a hovering thing -->
      <ellipse cx="13" cy="13" rx="12" ry="11" fill="#a82a20" opacity="0.1" />
      <ellipse cx="13" cy="28.4" rx="7" ry="1.2" fill="#000" opacity="0.3" />

      <!-- The clot — a gobbet of congealed murder, hovering -->
      <rect x="5" y="4" width="16" height="14" fill="#150d08" />
      <rect x="6" y="5" width="14" height="12" fill="#7a1a10" />
      <rect x="6" y="5" width="14" height="1" fill="#a82a20" />
      <rect x="6" y="5" width="6" height="1" fill="#d84838" />
      <rect x="6" y="5" width="2" height="10" fill="#8c2014" />
      <rect x="6" y="5" width="1" height="6" fill="#a82a20" />
      <rect x="17" y="6" width="3" height="11" fill="#5e120c" />
      <rect x="19" y="6" width="1" height="11" fill="#481018" />
      <!-- the wet sheen across the top -->
      <rect x="8" y="6" width="3" height="1" fill="#e85a48" />
      <rect x="9" y="7" width="1" height="1" fill="#ff8a78" />
      <!-- lumps in the congealing -->
      <rect x="9" y="9" width="3" height="3" fill="#5e120c" />
      <rect x="13" y="11" width="4" height="3" fill="#5e120c" />
      <rect x="14" y="12" width="2" height="1" fill="#481018" />
      <!-- the appetite — a fold that opens where it likes -->
      <rect x="9" y="12" width="7" height="3" fill="#150d08" />
      <rect x="10" y="13" width="5" height="2" fill="#2e0c12" />
      <rect x="11" y="13" width="3" height="1" fill="#1c060a" />
      <!-- teeth it grew because it wanted them -->
      <rect x="10" y="13" width="1" height="1" fill="#e8d8c8" />
      <rect x="13" y="13" width="1" height="1" fill="#e8d8c8" />
      <rect x="12" y="14" width="1" height="1" fill="#c8b8a8" />

      <!-- The reach — a pseudopod slung toward the warmth -->
      <rect x="19" y="8" width="5" height="3" fill="#150d08" />
      <rect x="20" y="9" width="3" height="1" fill="#7a1a10" />
      <rect x="20" y="9" width="2" height="1" fill="#a82a20" />
      <rect x="22" y="6" width="3" height="3" fill="#150d08" />
      <rect x="23" y="7" width="1" height="1" fill="#8c2014" />
      <rect x="24" y="5" width="2" height="2" fill="#150d08" />
      <rect x="24" y="5" width="1" height="1" fill="#d84838" />
      <!-- a second, lazier reach -->
      <rect x="3" y="10" width="3" height="3" fill="#150d08" />
      <rect x="4" y="11" width="1" height="1" fill="#7a1a10" />
      <rect x="1" y="12" width="3" height="2" fill="#150d08" />
      <rect x="2" y="12" width="1" height="1" fill="#a82a20" />

      <!-- Dripping back toward the pool it was skimmed from -->
      <rect x="8" y="17" width="3" height="3" fill="#150d08" />
      <rect x="9" y="18" width="1" height="1" fill="#7a1a10" />
      <rect x="9" y="20" width="2" height="3" fill="#150d08" />
      <rect x="10" y="21" width="1" height="1" fill="#5e120c" />
      <rect x="10" y="23" width="1" height="2" fill="#481018" opacity="0.8" />
      <rect x="10" y="26" width="1" height="1" fill="#7a1a10" opacity="0.6" />
      <rect x="14" y="17" width="4" height="2" fill="#150d08" />
      <rect x="15" y="18" width="2" height="1" fill="#5e120c" />
      <rect x="15" y="19" width="2" height="2" fill="#150d08" />
      <rect x="16" y="20" width="1" height="1" fill="#481018" />
      <rect x="16" y="22" width="1" height="2" fill="#5e120c" opacity="0.7" />
      <rect x="16" y="25" width="1" height="1" fill="#a82a20" opacity="0.5" />
      <rect x="12" y="17" width="2" height="2" fill="#2e0c12" />

      <!-- Spatter where the drips land -->
      <rect x="9" y="27" width="2" height="1" fill="#481018" opacity="0.7" />
      <rect x="15" y="26" width="2" height="1" fill="#2e0c12" opacity="0.7" />
      <rect x="12" y="28" width="3" height="1" fill="#481018" opacity="0.5" />

      <!-- Flecks of the harvest drifting off it -->
      <rect x="3" y="5" width="1" height="1" fill="#d84838" opacity="0.5" />
      <rect x="22" y="13" width="1" height="1" fill="#a82a20" opacity="0.55" />
      <rect x="5" y="16" width="1" height="1" fill="#e85a48" opacity="0.4" />
    </svg>
