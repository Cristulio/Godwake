<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 32"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="The Slain God-Essence Mote"
    >
      <!-- Murderous backlight bloom -->
      <ellipse cx="12" cy="18" rx="11" ry="13" fill="#8c1810" opacity="0.16" />
      <ellipse cx="12" cy="20" rx="10" ry="11" fill="#1a0610" opacity="0.4" />

      <!-- Faceted soul-shard — crimson ramp toward a burning core -->
      <polygon points="12,5 17,9 19,17 16,26 8,26 5,17 7,9" fill="#5a1208" />
      <polygon points="12,7 16,11 17,18 14,24 10,24 7,18 8,11" fill="#8c2010" />
      <polygon points="11,9 15,13 14,20 10,20 9,13" fill="#b53c4a" opacity="0.85" />
      <polygon points="12,5 14,8 11,10 8,9" fill="#a82e1c" opacity="0.7" />
      <polygon points="7,9 9,13 7,17" fill="#3a0a08" opacity="0.6" />
      <!-- facet edge speculars -->
      <rect x="9" y="9" width="1" height="1" fill="#d8586a" opacity="0.8" />
      <rect x="13" y="11" width="1" height="1" fill="#e87a6a" opacity="0.7" />

      <!-- Burning divine core + spark -->
      <rect x="10" y="13" width="2" height="2" fill="#f4d042" opacity="0.95" />
      <rect x="13" y="14" width="2" height="2" fill="#f4d042" opacity="0.95" />
      <rect x="11" y="14" width="2" height="2" fill="#fff0b0" />
      <rect x="11" y="14" width="1" height="1" fill="#ffffff" />

      <!-- Splinter shard + specular -->
      <polygon points="18,16 23,13 21,18 18,19" fill="#5a1208" />
      <polygon points="20,14 22,13 21,16" fill="#8c2010" />
      <rect x="22" y="12" width="1" height="1" fill="#d8586a" />
      <rect x="21" y="13" width="1" height="1" fill="#fff0b0" opacity="0.7" />

      <!-- Dripping lower fangs -->
      <rect x="6" y="25" width="3" height="3" fill="#5a1208" opacity="0.9" />
      <rect x="15" y="25" width="3" height="3" fill="#5a1208" opacity="0.9" />
      <rect x="6" y="25" width="1" height="3" fill="#8c2010" opacity="0.7" />
      <polygon points="9,28 11,31 12,28" fill="#3a0a08" opacity="0.75" />
      <polygon points="13,28 14,31 16,28" fill="#3a0a08" opacity="0.75" />

      <!-- Drifting blood-motes -->
      <rect x="9" y="11" width="1" height="1" fill="#d85a5a" opacity="0.6" />
      <rect x="14" y="10" width="1" height="1" fill="#d85a5a" opacity="0.5" />
      <rect x="11" y="22" width="1" height="1" fill="#3a0a08" opacity="0.5" />
      <rect x="4" y="16" width="1" height="1" fill="#b53c4a" opacity="0.4" />
      <rect x="19" y="22" width="1" height="1" fill="#8c2010" opacity="0.4" />
    </svg>
