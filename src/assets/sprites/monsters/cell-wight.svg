<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 22 34"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Cell Wight"
    >
      <!-- head -->
      <rect x="7" y="2" width="8" height="8" fill="#7a7a6a" />
      <rect x="7" y="2" width="8" height="1" fill="#5a5a4a" />
      <rect x="6" y="4" width="1" height="4" fill="#5a5a4a" />
      <rect x="15" y="4" width="1" height="4" fill="#5a5a4a" />

      <!-- sunken eyes, cold light -->
      <rect x="8" y="4" width="2" height="2" fill="#0a0a08" />
      <rect x="12" y="4" width="2" height="2" fill="#0a0a08" />
      <rect x="8" y="4" width="1" height="1" fill="#6aa0c4" />
      <rect x="12" y="4" width="1" height="1" fill="#6aa0c4" />

      <rect x="9" y="7" width="4" height="1" fill="#1a1a14" />

      <!-- torso -->
      <rect x="5" y="10" width="12" height="11" fill="#6a6a5a" />
      <rect x="6" y="11" width="10" height="1" fill="#5a5a48" />
      <rect x="10" y="10" width="2" height="11" fill="#5a5a48" />
      <rect x="5" y="14" width="12" height="1" fill="#3a3228" />

      <!-- left arm (normal claw) -->
      <rect x="2" y="11" width="3" height="8" fill="#6a6a5a" />
      <rect x="2" y="11" width="1" height="8" fill="#5a5a48" />
      <polygon points="2,19 1,21 3,20" fill="#3a3228" />
      <polygon points="4,19 3,21 5,20" fill="#3a3228" />

      <!-- right arm, fused manacle -->
      <rect x="17" y="11" width="3" height="6" fill="#6a6a5a" />
      <rect x="17" y="16" width="4" height="3" fill="#2a2a30" />
      <rect x="18" y="17" width="2" height="1" fill="#4a4a52" />
      <polygon points="17,19 16,21 18,20" fill="#3a3228" />
      <polygon points="20,19 19,21 21,20" fill="#3a3228" />

      <!-- withering glow at the grip hand -->
      <rect x="16" y="20" width="2" height="2" fill="#6aa0c4" opacity="0.5" />

      <!-- legs -->
      <rect x="6" y="21" width="4" height="9" fill="#6a6a5a" />
      <rect x="12" y="21" width="4" height="9" fill="#6a6a5a" />
      <rect x="6" y="21" width="1" height="9" fill="#5a5a48" />
      <rect x="15" y="21" width="1" height="9" fill="#5a5a48" />
      <rect x="6" y="25" width="4" height="1" fill="#3a3228" />
      <rect x="12" y="25" width="4" height="1" fill="#3a3228" />

      <!-- feet -->
      <rect x="5" y="30" width="5" height="3" fill="#5a5a48" />
      <rect x="12" y="30" width="5" height="3" fill="#5a5a48" />
      <polygon points="5,33 4,32 6,33" fill="#3a3228" />
      <polygon points="9,33 9,32 11,33" fill="#3a3228" />
      <polygon points="12,33 11,32 13,33" fill="#3a3228" />
      <polygon points="16,33 15,32 17,33" fill="#3a3228" />
    </svg>
