<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 46"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Cell Wight"
    >
      <!-- Cold dungeon backlight + ground shadow -->
      <ellipse cx="15" cy="22" rx="14" ry="21" fill="#4a82a4" opacity="0.08" />
      <ellipse cx="15" cy="44.6" rx="10" ry="1.7" fill="#000" opacity="0.4" />

      <!-- ── Gaunt head — corpse ramp, key upper-left ── -->
      <rect x="8" y="1" width="13" height="11" fill="#150d08" />
      <rect x="9" y="2" width="11" height="9" fill="#5a5a48" />
      <rect x="9" y="2" width="11" height="1" fill="#7a7a6a" />
      <rect x="9" y="2" width="3" height="8" fill="#6a6a5a" />
      <rect x="9" y="2" width="1" height="5" fill="#8e8e7c" />
      <rect x="17" y="3" width="3" height="8" fill="#3a3a2c" />
      <rect x="19" y="4" width="1" height="7" fill="#2a2a22" />
      <rect x="19" y="6" width="1" height="3" fill="#2e4a4e" />
      <!-- dead hair strands plastered down -->
      <rect x="9" y="2" width="2" height="1" fill="#2a2a22" />
      <rect x="13" y="1" width="3" height="2" fill="#2a2a22" />
      <rect x="18" y="2" width="2" height="2" fill="#22221c" />
      <!-- hollow cheeks -->
      <rect x="10" y="7" width="2" height="2" fill="#3a3a2c" />
      <rect x="16" y="7" width="2" height="2" fill="#2a2a22" />

      <!-- ── Eyes — cold corpse-light, fixed and lidless ── -->
      <rect x="10" y="4" width="3" height="3" fill="#0a0a08" />
      <rect x="15" y="4" width="3" height="3" fill="#0a0a08" />
      <rect x="10" y="5" width="2" height="1" fill="#6aa0c4" />
      <rect x="16" y="5" width="2" height="1" fill="#54849e" />
      <rect x="10" y="5" width="1" height="1" fill="#a0d0e8" />
      <rect x="16" y="5" width="1" height="1" fill="#88bcd8" />
      <rect x="10" y="4" width="3" height="1" fill="#12120e" />
      <rect x="15" y="4" width="3" height="1" fill="#12120e" />

      <!-- ── Grimace — lips rotted back from the teeth ── -->
      <rect x="10" y="9" width="9" height="2" fill="#1a1a14" />
      <rect x="10" y="9" width="1" height="2" fill="#d4c8a8" />
      <rect x="12" y="9" width="1" height="2" fill="#e8dcc4" />
      <rect x="14" y="9" width="1" height="2" fill="#d4c8a8" />
      <rect x="16" y="9" width="1" height="2" fill="#b8ac90" />
      <rect x="18" y="9" width="1" height="2" fill="#a89878" />

      <!-- ── Scrawny neck ── -->
      <rect x="12" y="12" width="6" height="2" fill="#150d08" />
      <rect x="13" y="12" width="4" height="2" fill="#4a4a3a" />
      <rect x="13" y="12" width="1" height="2" fill="#5a5a48" />

      <!-- ── Shoulders — prisoner's rag tunic ── -->
      <rect x="4" y="14" width="22" height="4" fill="#150d08" />
      <rect x="5" y="15" width="20" height="2" fill="#3a3a3e" />
      <rect x="5" y="15" width="20" height="1" fill="#52525a" />
      <rect x="5" y="15" width="5" height="1" fill="#6a6a74" />
      <rect x="21" y="15" width="4" height="2" fill="#2a2a30" />

      <!-- ── Wasted torso in rotted prison rags ── -->
      <rect x="6" y="18" width="18" height="13" fill="#150d08" />
      <rect x="7" y="19" width="16" height="11" fill="#3a3a3e" />
      <rect x="7" y="19" width="16" height="1" fill="#52525a" />
      <rect x="7" y="19" width="3" height="10" fill="#46464e" />
      <rect x="7" y="19" width="1" height="10" fill="#5a5a64" />
      <rect x="20" y="19" width="3" height="10" fill="#2a2a30" />
      <rect x="22" y="20" width="1" height="9" fill="#1f1f24" />
      <!-- torn rents showing corpse-flesh beneath -->
      <rect x="10" y="21" width="3" height="2" fill="#150d08" />
      <rect x="11" y="21" width="2" height="2" fill="#4a4a3a" />
      <rect x="11" y="21" width="1" height="1" fill="#5a5a48" />
      <rect x="16" y="25" width="3" height="2" fill="#150d08" />
      <rect x="17" y="25" width="2" height="2" fill="#3a3a2c" />
      <!-- cell-number scratch on the breast -->
      <rect x="9" y="26" width="1" height="2" fill="#22222a" />
      <rect x="11" y="26" width="1" height="2" fill="#22222a" />
      <!-- ragged hem -->
      <rect x="7" y="30" width="16" height="1" fill="#1f1f24" />
      <rect x="9" y="29" width="2" height="1" fill="#2a2a30" />
      <rect x="14" y="29" width="3" height="1" fill="#2a2a30" />

      <!-- ── Left arm — reaching out, grave-cold claw ── -->
      <rect x="2" y="16" width="5" height="10" fill="#150d08" />
      <rect x="3" y="17" width="3" height="8" fill="#5a5a48" />
      <rect x="3" y="17" width="1" height="8" fill="#6a6a5a" />
      <rect x="5" y="17" width="1" height="8" fill="#3a3a2c" />
      <!-- the withering grip, palm open -->
      <ellipse cx="4" cy="28" rx="4" ry="3.2" fill="#6aa0c4" opacity="0.2" />
      <rect x="1" y="25" width="6" height="4" fill="#150d08" />
      <rect x="2" y="26" width="4" height="2" fill="#5a5a48" />
      <rect x="2" y="26" width="2" height="1" fill="#6a6a5a" />
      <rect x="1" y="29" width="1" height="2" fill="#150d08" />
      <rect x="3" y="29" width="1" height="2" fill="#150d08" />
      <rect x="5" y="29" width="1" height="2" fill="#150d08" />
      <rect x="1" y="29" width="1" height="1" fill="#6aa0c4" />
      <rect x="3" y="29" width="1" height="1" fill="#88bcd8" />
      <rect x="5" y="29" width="1" height="1" fill="#6aa0c4" />
      <rect x="3" y="27" width="1" height="1" fill="#a0d0e8" />

      <!-- ── Right arm — the manacle arm, iron fused to wristbone ── -->
      <rect x="23" y="16" width="5" height="9" fill="#150d08" />
      <rect x="24" y="17" width="3" height="7" fill="#4a4a3a" />
      <rect x="24" y="17" width="1" height="7" fill="#5a5a48" />
      <rect x="26" y="17" width="1" height="7" fill="#2a2a22" />
      <!-- THE MANACLE — rusted iron, grown into the arm -->
      <rect x="22" y="24" width="7" height="5" fill="#150d08" />
      <rect x="23" y="25" width="5" height="3" fill="#3a3e46" />
      <rect x="23" y="25" width="5" height="1" fill="#5a6068" />
      <rect x="23" y="25" width="2" height="1" fill="#788088" />
      <rect x="27" y="26" width="1" height="2" fill="#23262c" />
      <!-- rust bleeding into the flesh -->
      <rect x="24" y="24" width="2" height="1" fill="#6b3a22" />
      <rect x="26" y="28" width="2" height="1" fill="#5a3010" />
      <!-- bolt heads -->
      <rect x="24" y="26" width="1" height="1" fill="#8a929c" />
      <rect x="26" y="26" width="1" height="1" fill="#23262c" />
      <!-- claw below the iron -->
      <rect x="23" y="29" width="5" height="3" fill="#150d08" />
      <rect x="24" y="30" width="3" height="1" fill="#4a4a3a" />
      <rect x="23" y="31" width="1" height="2" fill="#150d08" />
      <rect x="25" y="31" width="1" height="2" fill="#150d08" />
      <rect x="27" y="31" width="1" height="2" fill="#150d08" />

      <!-- ── Hanging chain — swings from the manacle ── -->
      <rect x="28" y="28" width="2" height="2" fill="#150d08" />
      <rect x="28" y="28" width="1" height="1" fill="#5a6068" />
      <rect x="27" y="31" width="2" height="2" fill="#150d08" />
      <rect x="27" y="31" width="1" height="1" fill="#3a3e46" />
      <rect x="28" y="34" width="2" height="2" fill="#150d08" />
      <rect x="28" y="34" width="1" height="1" fill="#5a6068" />
      <rect x="27" y="37" width="2" height="2" fill="#150d08" />
      <rect x="27" y="37" width="1" height="1" fill="#3a3e46" />
      <!-- broken end link -->
      <rect x="28" y="40" width="2" height="2" fill="#150d08" />
      <rect x="28" y="40" width="1" height="1" fill="#6b3a22" />

      <!-- ── Legs — dead march stance ── -->
      <rect x="8" y="31" width="6" height="9" fill="#150d08" />
      <rect x="9" y="32" width="4" height="8" fill="#5a5a48" />
      <rect x="9" y="32" width="1" height="8" fill="#6a6a5a" />
      <rect x="12" y="32" width="1" height="8" fill="#3a3a2c" />
      <rect x="16" y="31" width="6" height="9" fill="#150d08" />
      <rect x="17" y="32" width="4" height="8" fill="#4a4a3a" />
      <rect x="17" y="32" width="1" height="8" fill="#5a5a48" />
      <rect x="20" y="32" width="1" height="8" fill="#2a2a22" />
      <!-- shackle scar on the ankle -->
      <rect x="9" y="37" width="4" height="1" fill="#3a3a2c" />
      <rect x="17" y="37" width="4" height="1" fill="#2a2a22" />

      <!-- ── Cracked bare feet ── -->
      <rect x="6" y="40" width="8" height="3" fill="#150d08" />
      <rect x="7" y="41" width="6" height="1" fill="#4a4a3a" />
      <rect x="7" y="40" width="6" height="1" fill="#6a6a5a" />
      <rect x="7" y="42" width="1" height="1" fill="#8e8e7c" />
      <rect x="10" y="42" width="1" height="1" fill="#6a6a5a" />
      <rect x="15" y="40" width="8" height="3" fill="#150d08" />
      <rect x="16" y="41" width="6" height="1" fill="#3a3a2c" />
      <rect x="16" y="40" width="6" height="1" fill="#4a4a3a" />
      <rect x="16" y="42" width="1" height="1" fill="#6a6a5a" />
      <rect x="19" y="42" width="1" height="1" fill="#5a5a48" />
    </svg>
