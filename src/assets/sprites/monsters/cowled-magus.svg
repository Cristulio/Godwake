<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 38 62"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Veiled Magus"
    >
      <!-- Arcane backlight + ground shadow -->
      <ellipse cx="19" cy="30" rx="18" ry="27" fill="#9a5ad0" opacity="0.16" />
      <ellipse cx="19" cy="59.6" rx="13" ry="2.2" fill="#000" opacity="0.45" />

      <!-- ══ Hood peak — deep grey cowl ══ -->
      <rect x="13" y="2" width="12" height="4" fill="#150d08" />
      <rect x="11" y="5" width="16" height="6" fill="#150d08" />
      <rect x="14" y="3" width="10" height="3" fill="#4a4858" />
      <rect x="14" y="3" width="4" height="2" fill="#5a5868" />
      <rect x="12" y="6" width="14" height="5" fill="#3e3c4c" />
      <rect x="12" y="6" width="5" height="4" fill="#4a4858" />
      <rect x="12" y="6" width="2" height="3" fill="#5a5868" />
      <rect x="23" y="6" width="3" height="5" fill="#322f40" />
      <!-- hood opening — shadowed face, glowing eyes only -->
      <rect x="12" y="10" width="14" height="9" fill="#150d08" />
      <rect x="13" y="11" width="12" height="8" fill="#0c0a12" />
      <rect x="14" y="12" width="10" height="6" fill="#060508" />
      <!-- arcane eyes -->
      <rect x="15" y="14" width="3" height="2" fill="#a48ee0" />
      <rect x="21" y="14" width="3" height="2" fill="#8a6ec8" />
      <rect x="15" y="14" width="1" height="1" fill="#e8d4ff" />
      <rect x="21" y="14" width="1" height="1" fill="#d4c4f8" />
      <!-- hood drape over the shoulders -->
      <rect x="10" y="17" width="18" height="4" fill="#150d08" />
      <rect x="11" y="18" width="16" height="3" fill="#3e3c4c" />
      <rect x="11" y="18" width="6" height="2" fill="#4a4858" />

      <!-- ══ Raised arms — palms up, channeling ══ -->
      <!-- left arm -->
      <rect x="6" y="19" width="8" height="6" fill="#150d08" />
      <rect x="7" y="20" width="6" height="4" fill="#3e3c4c" />
      <rect x="7" y="20" width="2" height="4" fill="#4a4858" />
      <rect x="4" y="16" width="7" height="6" fill="#150d08" />
      <rect x="5" y="17" width="5" height="4" fill="#322f40" />
      <rect x="5" y="17" width="2" height="4" fill="#3e3c4c" />
      <!-- left palm -->
      <rect x="4" y="13" width="6" height="5" fill="#150d08" />
      <rect x="5" y="14" width="4" height="3" fill="#c4b49a" />
      <rect x="5" y="14" width="2" height="3" fill="#d8caae" />
      <!-- right arm -->
      <rect x="24" y="19" width="8" height="6" fill="#150d08" />
      <rect x="25" y="20" width="6" height="4" fill="#322f40" />
      <rect x="25" y="20" width="2" height="4" fill="#3e3c4c" />
      <rect x="27" y="16" width="7" height="6" fill="#150d08" />
      <rect x="28" y="17" width="5" height="4" fill="#2a2736" />
      <!-- right palm -->
      <rect x="28" y="13" width="6" height="5" fill="#150d08" />
      <rect x="29" y="14" width="4" height="3" fill="#a89678" />
      <rect x="29" y="14" width="2" height="3" fill="#c4b49a" />

      <!-- ══ Robe — charcoal, rune trim ══ -->
      <rect x="10" y="21" width="18" height="26" fill="#150d08" />
      <rect x="11" y="22" width="16" height="25" fill="#322f40" />
      <rect x="11" y="22" width="6" height="25" fill="#3e3c4c" />
      <rect x="11" y="22" width="3" height="19" fill="#4a4858" />
      <rect x="24" y="22" width="3" height="25" fill="#262334" />
      <rect x="26" y="22" width="1" height="25" fill="#1e1b2a" />
      <!-- center panel -->
      <rect x="17" y="22" width="4" height="25" fill="#262334" />
      <rect x="17" y="22" width="1" height="25" fill="#1e1b2a" />
      <!-- violet rune trim down the panel -->
      <rect x="18" y="24" width="2" height="2" fill="#6a52a0" />
      <rect x="18" y="25" width="1" height="1" fill="#a48ee0" />
      <rect x="18" y="29" width="2" height="2" fill="#6a52a0" />
      <rect x="19" y="30" width="1" height="1" fill="#a48ee0" />
      <rect x="18" y="34" width="2" height="2" fill="#5a4488" />
      <rect x="18" y="39" width="2" height="2" fill="#5a4488" />
      <rect x="19" y="40" width="1" height="1" fill="#8a6ec8" />
      <rect x="18" y="44" width="2" height="2" fill="#4a3870" />

      <!-- ══ Rune belt + scroll tubes ══ -->
      <rect x="10" y="32" width="18" height="3" fill="#150d08" />
      <rect x="11" y="33" width="16" height="1" fill="#5a4488" />
      <rect x="11" y="33" width="6" height="1" fill="#6a52a0" />
      <!-- hanging scroll tubes -->
      <rect x="12" y="35" width="3" height="7" fill="#150d08" />
      <rect x="13" y="36" width="1" height="5" fill="#8a6a3a" />
      <rect x="13" y="36" width="1" height="2" fill="#a8854e" />
      <rect x="23" y="35" width="3" height="6" fill="#150d08" />
      <rect x="24" y="36" width="1" height="4" fill="#6e5232" />

      <!-- ══ Robe hem ══ -->
      <rect x="9" y="47" width="20" height="11" fill="#150d08" />
      <rect x="10" y="48" width="18" height="9" fill="#322f40" />
      <rect x="10" y="48" width="6" height="9" fill="#3e3c4c" />
      <rect x="10" y="48" width="2" height="7" fill="#4a4858" />
      <rect x="24" y="48" width="4" height="9" fill="#262334" />
      <!-- fold lines -->
      <rect x="15" y="48" width="1" height="9" fill="#262334" />
      <rect x="21" y="48" width="1" height="9" fill="#1e1b2a" />
      <!-- violet hem thread -->
      <rect x="10" y="55" width="18" height="1" fill="#5a4488" opacity="0.8" />
      <rect x="10" y="55" width="6" height="1" fill="#6a52a0" />
      <rect x="10" y="56" width="18" height="1" fill="#100e18" />

      <!-- ══ Lightning arcing palm to palm, across the chest ══ -->
      <ellipse cx="19" cy="16" rx="12" ry="4" fill="#7ec8ff" opacity="0.12" />
      <rect x="8" y="15" width="3" height="1" fill="#bfe4ff" />
      <rect x="11" y="16" width="3" height="1" fill="#7ec8ff" opacity="0.9" />
      <rect x="14" y="17" width="4" height="1" fill="#e8f6ff" />
      <rect x="18" y="16" width="3" height="1" fill="#7ec8ff" opacity="0.85" />
      <rect x="21" y="17" width="4" height="1" fill="#bfe4ff" />
      <rect x="25" y="16" width="3" height="1" fill="#7ec8ff" opacity="0.9" />
      <rect x="28" y="15" width="3" height="1" fill="#bfe4ff" opacity="0.8" />
      <rect x="13" y="16" width="1" height="1" fill="#ffffff" />
      <rect x="24" y="16" width="1" height="1" fill="#ffffff" />
      <rect x="17" y="18" width="1" height="1" fill="#7ec8ff" opacity="0.7" />
      <rect x="22" y="18" width="1" height="1" fill="#7ec8ff" opacity="0.6" />

      <!-- arcane motes -->
      <rect x="3" y="24" width="1" height="1" fill="#a48ee0" opacity="0.6" />
      <rect x="34" y="28" width="1" height="1" fill="#8a6ec8" opacity="0.5" />
      <rect x="6" y="42" width="1" height="1" fill="#7ec8ff" opacity="0.45" />
      <rect x="32" y="46" width="1" height="1" fill="#a48ee0" opacity="0.4" />
    </svg>
