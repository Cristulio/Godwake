<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 46"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Veiled Conjurer"
    >
      <!-- Cold conjuring backlight + ground shadow -->
      <ellipse cx="15" cy="22" rx="15" ry="21" fill="#4a6ad0" opacity="0.08" />
      <ellipse cx="15" cy="44.6" rx="10" ry="1.8" fill="#000" opacity="0.42" />

      <!-- ── Summoning circle — cold blue rite hanging in the air ── -->
      <ellipse cx="25" cy="20" rx="5.5" ry="6" fill="#4a6ad0" opacity="0.2" />
      <!-- rotated square frame -->
      <rect x="22" y="15" width="6" height="1" fill="#6a8af0" />
      <rect x="22" y="24" width="6" height="1" fill="#4a6ad0" />
      <rect x="21" y="16" width="1" height="8" fill="#4a6ad0" />
      <rect x="28" y="16" width="1" height="8" fill="#6a8af0" />
      <!-- inner glyph -->
      <rect x="23" y="17" width="4" height="1" fill="#4a6ad0" opacity="0.7" />
      <rect x="23" y="22" width="4" height="1" fill="#4a6ad0" opacity="0.7" />
      <rect x="23" y="18" width="1" height="4" fill="#4a6ad0" opacity="0.6" />
      <rect x="26" y="18" width="1" height="4" fill="#6a8af0" opacity="0.6" />
      <rect x="24" y="19" width="2" height="2" fill="#9ab4ff" opacity="0.8" />
      <rect x="24" y="19" width="1" height="1" fill="#dce6ff" />
      <!-- something pushing through -->
      <rect x="24" y="21" width="2" height="1" fill="#16223c" />
      <rect x="24" y="20" width="1" height="1" fill="#0a1224" />
      <!-- rite sparks -->
      <rect x="20" y="13" width="1" height="1" fill="#9ab4ff" opacity="0.7" />
      <rect x="29" y="25" width="1" height="1" fill="#6a8af0" opacity="0.6" />
      <rect x="22" y="26" width="1" height="1" fill="#9ab4ff" opacity="0.5" />

      <!-- ── Pointed cowl — tall stepped slate wedge ── -->
      <rect x="12" y="0" width="4" height="3" fill="#150d08" />
      <rect x="13" y="1" width="2" height="2" fill="#545462" />
      <rect x="13" y="1" width="1" height="1" fill="#64647a" />
      <rect x="10" y="2" width="8" height="3" fill="#150d08" />
      <rect x="11" y="3" width="6" height="2" fill="#4a4a56" />
      <rect x="11" y="3" width="3" height="1" fill="#5e5e6e" />
      <rect x="15" y="4" width="2" height="1" fill="#3a3a44" />
      <rect x="8" y="5" width="12" height="4" fill="#150d08" />
      <rect x="9" y="6" width="10" height="3" fill="#3a3a44" />
      <rect x="9" y="6" width="3" height="3" fill="#4a4a56" />
      <rect x="9" y="6" width="1" height="2" fill="#5e5e6e" />
      <rect x="16" y="6" width="3" height="3" fill="#2a2a32" />

      <!-- ── Hood mouth — black hollow, silver half-mask ── -->
      <rect x="8" y="9" width="12" height="7" fill="#150d08" />
      <rect x="9" y="10" width="10" height="5" fill="#0e0e12" />
      <rect x="10" y="11" width="8" height="4" fill="#8a8a9a" />
      <rect x="10" y="11" width="8" height="1" fill="#b4b4c4" />
      <rect x="10" y="11" width="2" height="4" fill="#a4a4b4" />
      <rect x="10" y="11" width="1" height="2" fill="#d0d0e0" />
      <rect x="16" y="11" width="2" height="4" fill="#6a6a7a" />
      <!-- eye slits -->
      <rect x="11" y="12" width="2" height="1" fill="#0e0e12" />
      <rect x="15" y="12" width="2" height="1" fill="#0e0e12" />
      <!-- mask ends above the mouth — dark jaw beneath -->
      <rect x="10" y="15" width="8" height="1" fill="#0e0e12" />

      <!-- ── Robe body — slate ramp, silver collar ── -->
      <rect x="6" y="16" width="18" height="14" fill="#150d08" />
      <rect x="7" y="17" width="16" height="12" fill="#34343e" />
      <rect x="7" y="17" width="16" height="1" fill="#4a4a56" />
      <rect x="7" y="17" width="3" height="11" fill="#3e3e48" />
      <rect x="7" y="17" width="1" height="11" fill="#4a4a56" />
      <rect x="20" y="17" width="3" height="11" fill="#26262e" />
      <rect x="22" y="18" width="1" height="10" fill="#1d1d24" />
      <!-- silver collar -->
      <rect x="9" y="17" width="12" height="1" fill="#9a9aaa" />
      <rect x="9" y="17" width="4" height="1" fill="#c0c0d0" />
      <!-- center shadow fold -->
      <rect x="14" y="18" width="2" height="11" fill="#26262e" />
      <rect x="15" y="18" width="1" height="11" fill="#1d1d24" />
      <!-- robe dither -->
      <rect x="10" y="21" width="1" height="1" fill="#4a4a56" />
      <rect x="18" y="25" width="1" height="1" fill="#26262e" />

      <!-- ── Gesturing arm thrust toward the circle ── -->
      <rect x="19" y="17" width="6" height="4" fill="#150d08" />
      <rect x="20" y="18" width="4" height="2" fill="#34343e" />
      <rect x="20" y="18" width="4" height="1" fill="#4a4a56" />
      <!-- pale commanding hand, two fingers crooked -->
      <rect x="23" y="17" width="4" height="3" fill="#150d08" />
      <rect x="24" y="18" width="2" height="1" fill="#e0dcd0" />
      <rect x="24" y="18" width="1" height="1" fill="#f4f0e4" />
      <rect x="25" y="17" width="1" height="1" fill="#c8c4b8" />
      <rect x="24" y="19" width="1" height="1" fill="#c8c4b8" />
      <!-- rite-light on the fingertips -->
      <rect x="26" y="17" width="1" height="1" fill="#9ab4ff" opacity="0.8" />

      <!-- ── Off arm folded into the sleeve ── -->
      <rect x="4" y="18" width="5" height="8" fill="#150d08" />
      <rect x="5" y="19" width="3" height="6" fill="#2f2f38" />
      <rect x="5" y="19" width="1" height="6" fill="#3e3e48" />
      <rect x="4" y="25" width="5" height="2" fill="#150d08" />
      <rect x="5" y="25" width="3" height="1" fill="#54546a" />

      <!-- ── Knotted cord belt ── -->
      <rect x="7" y="29" width="16" height="2" fill="#150d08" />
      <rect x="8" y="29" width="14" height="1" fill="#54546a" />
      <rect x="13" y="29" width="2" height="4" fill="#3e3e48" />

      <!-- ── Skirt — floor-length, hem flaring with the rite-wind ── -->
      <rect x="5" y="31" width="20" height="11" fill="#150d08" />
      <rect x="6" y="32" width="18" height="9" fill="#34343e" />
      <rect x="6" y="32" width="18" height="1" fill="#4a4a56" />
      <rect x="6" y="32" width="3" height="9" fill="#3e3e48" />
      <rect x="6" y="32" width="1" height="7" fill="#4a4a56" />
      <rect x="21" y="32" width="3" height="9" fill="#26262e" />
      <rect x="23" y="33" width="1" height="8" fill="#1d1d24" />
      <!-- fold shadows -->
      <rect x="10" y="33" width="1" height="8" fill="#26262e" />
      <rect x="14" y="33" width="2" height="8" fill="#26262e" />
      <rect x="15" y="33" width="1" height="8" fill="#1d1d24" />
      <rect x="19" y="33" width="1" height="8" fill="#26262e" />
      <!-- hem kick at the right where the wind pulls -->
      <rect x="24" y="36" width="2" height="5" fill="#150d08" />
      <rect x="24" y="37" width="1" height="3" fill="#26262e" />
      <!-- blue rite-light catching the hem -->
      <rect x="20" y="40" width="3" height="1" fill="#4a6ad0" opacity="0.4" />

      <!-- ── Hem shadow + drifting feet ── -->
      <rect x="6" y="41" width="18" height="2" fill="#150d08" />
      <rect x="7" y="41" width="16" height="1" fill="#16161c" />
      <rect x="9" y="43" width="4" height="2" fill="#150d08" />
      <rect x="10" y="43" width="2" height="1" fill="#1d1d24" />
      <rect x="17" y="43" width="4" height="2" fill="#150d08" />
      <rect x="18" y="43" width="2" height="1" fill="#16161c" />
    </svg>
