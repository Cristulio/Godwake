<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 22 34"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Cowled Conjurer"
    >
      <!-- Cold conjuring backlight + ground shadow -->
      <ellipse cx="11" cy="17" rx="11" ry="16" fill="#4a6ad0" opacity="0.08" />
      <ellipse cx="11" cy="32" rx="8" ry="1.4" fill="#000" opacity="0.42" />

      <!-- Summoning circle — cold fire bloom -->
      <ellipse cx="19" cy="16" rx="4" ry="4.5" fill="#4a6ad0" opacity="0.16" />
      <rect x="17" y="13" width="4" height="1" fill="#6a8af0" />
      <rect x="17" y="18" width="4" height="1" fill="#4a6ad0" />
      <rect x="16" y="14" width="1" height="4" fill="#4a6ad0" />
      <rect x="21" y="14" width="1" height="4" fill="#6a8af0" />
      <rect x="18" y="15" width="2" height="2" fill="#9ab4ff" opacity="0.7" />
      <rect x="18" y="15" width="1" height="1" fill="#dce6ff" />

      <!-- Pointed cowl — slate ramp, key upper-left -->
      <polygon points="11,1 5,9 17,9" fill="#3a3a44" />
      <polygon points="11,1 6,8 11,9" fill="#4a4a56" />
      <polygon points="11,1 8,7 11,9" fill="#545462" />
      <polygon points="11,1 16,8 11,9" fill="#2a2a32" />
      <polygon points="11,1 12,3 11,4" fill="#64647a" />

      <!-- Shadowed face hollow + silver mask ramp -->
      <rect x="7" y="6" width="8" height="5" fill="#0e0e12" />
      <rect x="8" y="7" width="6" height="3" fill="#8a8a9a" />
      <rect x="8" y="7" width="6" height="1" fill="#b4b4c4" />
      <rect x="8" y="7" width="2" height="3" fill="#a4a4b4" />
      <rect x="13" y="7" width="1" height="3" fill="#6a6a7a" />
      <rect x="9" y="8" width="1" height="1" fill="#0e0e12" />
      <rect x="12" y="8" width="1" height="1" fill="#0e0e12" />
      <rect x="9" y="7" width="1" height="1" fill="#d0d0e0" />

      <!-- Robe body — slate ramp -->
      <rect x="5" y="10" width="12" height="14" fill="#34343e" />
      <rect x="5" y="10" width="12" height="1" fill="#4a4a56" />
      <rect x="5" y="10" width="2" height="13" fill="#3e3e48" />
      <rect x="5" y="10" width="1" height="13" fill="#4a4a56" />
      <rect x="15" y="10" width="2" height="13" fill="#26262e" />
      <rect x="10" y="10" width="2" height="14" fill="#26262e" />
      <!-- Dither -->
      <rect x="8" y="15" width="1" height="1" fill="#4a4a56" />
      <rect x="13" y="19" width="1" height="1" fill="#26262e" />

      <!-- Silver collar -->
      <rect x="7" y="10" width="8" height="1" fill="#9a9aaa" />
      <rect x="7" y="10" width="3" height="1" fill="#c0c0d0" />

      <!-- Gesturing arm toward the circle -->
      <rect x="15" y="12" width="3" height="2" fill="#34343e" />
      <rect x="15" y="12" width="3" height="1" fill="#4a4a56" />
      <rect x="17" y="12" width="2" height="2" fill="#c8c4b8" />
      <rect x="17" y="12" width="2" height="1" fill="#e0dcd0" />
      <rect x="17" y="12" width="1" height="1" fill="#9ab4ff" opacity="0.5" />

      <!-- Robe hem flares -->
      <polygon points="5,24 3,32 9,32" fill="#34343e" />
      <polygon points="5,24 3,32 5,32" fill="#3e3e48" />
      <polygon points="17,24 19,32 11,32" fill="#2a2a32" />
      <rect x="9" y="24" width="4" height="8" fill="#26262e" />
      <rect x="3" y="31" width="16" height="1" fill="#16161c" />
      <rect x="4" y="30" width="2" height="1" fill="#4a4a56" />
    </svg>
