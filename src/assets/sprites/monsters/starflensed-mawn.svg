<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 38 38"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Starflensed Mawn"
    >
      <!-- Wrong-light backlight + base shadow -->
      <ellipse cx="19" cy="19" rx="19" ry="17" fill="#5a80c0" opacity="0.1" />
      <ellipse cx="19" cy="35.6" rx="16" ry="2.2" fill="#0a0a18" opacity="0.5" />

      <!-- ── The meat — a flensed bulk of cold violet, stepped ring ── -->
      <rect x="10" y="2" width="18" height="3" fill="#150d08" />
      <rect x="6" y="4" width="26" height="4" fill="#150d08" />
      <rect x="3" y="7" width="32" height="6" fill="#150d08" />
      <rect x="2" y="12" width="34" height="14" fill="#150d08" />
      <rect x="3" y="26" width="32" height="5" fill="#150d08" />
      <rect x="6" y="30" width="26" height="3" fill="#150d08" />
      <rect x="10" y="33" width="18" height="2" fill="#150d08" />
      <!-- fill -->
      <rect x="11" y="3" width="16" height="2" fill="#3a3050" />
      <rect x="7" y="5" width="24" height="3" fill="#3a3050" />
      <rect x="4" y="8" width="30" height="5" fill="#4a4068" />
      <rect x="3" y="13" width="32" height="12" fill="#4a4068" />
      <rect x="4" y="25" width="30" height="5" fill="#3a3050" />
      <rect x="7" y="30" width="24" height="2" fill="#2a2042" />
      <rect x="11" y="32" width="16" height="2" fill="#241c38" />
      <!-- lit upper-left flank -->
      <rect x="11" y="3" width="8" height="2" fill="#4a4068" />
      <rect x="7" y="5" width="9" height="3" fill="#5a5080" />
      <rect x="7" y="5" width="5" height="2" fill="#6a60a0" />
      <rect x="4" y="8" width="6" height="4" fill="#5a5080" />
      <rect x="4" y="8" width="3" height="2" fill="#6a60a0" />
      <rect x="8" y="6" width="3" height="1" fill="#7e74b4" />
      <!-- cool shadow lower-right -->
      <rect x="28" y="13" width="7" height="12" fill="#3a3050" />
      <rect x="31" y="16" width="4" height="10" fill="#2a2042" />
      <rect x="33" y="19" width="2" height="6" fill="#221a36" />
      <rect x="34" y="16" width="1" height="4" fill="#26303a" />
      <!-- flense-scars across the meat — where the stars were peeled off -->
      <rect x="6" y="14" width="4" height="1" fill="#241c38" />
      <rect x="5" y="19" width="3" height="1" fill="#241c38" />
      <rect x="8" y="23" width="3" height="1" fill="#221a36" />
      <rect x="27" y="7" width="3" height="1" fill="#241c38" />
      <rect x="30" y="11" width="3" height="1" fill="#221a36" />
      <rect x="7" y="15" width="2" height="1" fill="#7e74b4" opacity="0.5" />
      <rect x="28" y="8" width="2" height="1" fill="#5a5080" opacity="0.6" />
      <!-- meat-fold dither -->
      <rect x="5" y="11" width="1" height="1" fill="#6a60a0" />
      <rect x="32" y="14" width="1" height="1" fill="#2a2042" />
      <rect x="9" y="27" width="1" height="1" fill="#2a2042" />
      <rect x="29" y="27" width="1" height="1" fill="#221a36" />

      <!-- ── The maw — the hole where a star was, ringed in light ── -->
      <rect x="12" y="9" width="14" height="18" fill="#2a3c70" />
      <rect x="11" y="11" width="16" height="14" fill="#2a3c70" />
      <rect x="13" y="10" width="12" height="16" fill="#4a78c8" />
      <rect x="12" y="12" width="14" height="12" fill="#4a78c8" />
      <rect x="14" y="11" width="10" height="14" fill="#80c0ff" />
      <rect x="13" y="13" width="12" height="10" fill="#80c0ff" />
      <rect x="15" y="12" width="8" height="12" fill="#b0e0ff" />
      <rect x="14" y="14" width="10" height="8" fill="#b0e0ff" />
      <rect x="16" y="14" width="6" height="8" fill="#e0f4ff" />
      <rect x="15" y="15" width="8" height="6" fill="#e0f4ff" />
      <rect x="17" y="16" width="4" height="4" fill="#ffffff" />
      <!-- the dark mote at the very center — the star's corpse -->
      <rect x="18" y="17" width="2" height="2" fill="#0a0a18" />

      <!-- ── Ring of flensing teeth around the maw ── -->
      <rect x="18" y="8" width="2" height="4" fill="#f4f8ff" />
      <rect x="18" y="8" width="1" height="4" fill="#ffffff" />
      <rect x="24" y="9" width="2" height="3" fill="#e0e8f0" />
      <rect x="27" y="14" width="3" height="2" fill="#d0d8e4" />
      <rect x="26" y="20" width="3" height="2" fill="#c4ccd8" />
      <rect x="23" y="24" width="2" height="3" fill="#cdd5e1" />
      <rect x="18" y="25" width="2" height="4" fill="#e0e8f0" />
      <rect x="18" y="26" width="1" height="3" fill="#f4f8ff" />
      <rect x="13" y="24" width="2" height="3" fill="#dde5f1" />
      <rect x="9" y="20" width="3" height="2" fill="#e8f0f8" />
      <rect x="8" y="14" width="3" height="2" fill="#eef4fc" />
      <rect x="12" y="9" width="2" height="3" fill="#f4f8ff" />
      <!-- teeth shadows seating them in the meat -->
      <rect x="18" y="7" width="2" height="1" fill="#150d08" />
      <rect x="25" y="9" width="1" height="1" fill="#150d08" />
      <rect x="29" y="14" width="1" height="2" fill="#150d08" />
      <rect x="18" y="29" width="2" height="1" fill="#150d08" />
      <rect x="8" y="14" width="1" height="2" fill="#150d08" />
      <rect x="12" y="25" width="1" height="2" fill="#150d08" />

      <!-- ── Spilled starlight — rays bleeding from the wound ── -->
      <rect x="18" y="0" width="2" height="7" fill="#b0e0ff" opacity="0.45" />
      <rect x="18" y="0" width="1" height="7" fill="#e0f4ff" opacity="0.5" />
      <rect x="18" y="0" width="1" height="2" fill="#ffffff" opacity="0.6" />
      <rect x="0" y="17" width="8" height="2" fill="#b0e0ff" opacity="0.35" />
      <rect x="0" y="17" width="4" height="1" fill="#e0f4ff" opacity="0.4" />
      <rect x="30" y="17" width="8" height="2" fill="#b0e0ff" opacity="0.35" />
      <rect x="34" y="18" width="4" height="1" fill="#e0f4ff" opacity="0.4" />
      <rect x="18" y="30" width="2" height="6" fill="#80c0ff" opacity="0.3" />
      <!-- diagonal glints -->
      <rect x="8" y="8" width="1" height="1" fill="#e0f4ff" opacity="0.55" />
      <rect x="29" y="9" width="1" height="1" fill="#b0e0ff" opacity="0.5" />
      <rect x="7" y="26" width="1" height="1" fill="#b0e0ff" opacity="0.45" />
      <rect x="30" y="26" width="1" height="1" fill="#80c0ff" opacity="0.4" />

      <!-- ── Atrophied leg-nubs it drags itself on ── -->
      <rect x="8" y="33" width="4" height="3" fill="#150d08" />
      <rect x="9" y="34" width="2" height="1" fill="#2a2042" />
      <rect x="15" y="34" width="4" height="3" fill="#150d08" />
      <rect x="16" y="35" width="2" height="1" fill="#241c38" />
      <rect x="23" y="34" width="4" height="3" fill="#150d08" />
      <rect x="24" y="35" width="2" height="1" fill="#2a2042" />
      <rect x="29" y="33" width="4" height="3" fill="#150d08" />
      <rect x="30" y="34" width="2" height="1" fill="#221a36" />
    </svg>
