<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 40 62"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Gallows Wight"
    >
      <!-- Cold grave backlight + ground shadow -->
      <ellipse cx="20" cy="30" rx="19" ry="27" fill="#6ad0a0" opacity="0.12" />
      <ellipse cx="20" cy="59.6" rx="14" ry="2.2" fill="#000" opacity="0.45" />

      <!-- ══ The broken gibbet rope — knotted stub overhead ══ -->
      <rect x="26" y="0" width="3" height="4" fill="#150d08" />
      <rect x="27" y="0" width="1" height="3" fill="#5a4228" />

      <!-- ══ Head — lolled to one side ══ -->
      <rect x="10" y="2" width="17" height="15" fill="#150d08" />
      <rect x="11" y="3" width="15" height="13" fill="#6a7a72" />
      <rect x="11" y="3" width="5" height="13" fill="#84948a" />
      <rect x="11" y="3" width="2" height="9" fill="#9caca0" />
      <rect x="23" y="3" width="3" height="13" fill="#56665e" />
      <rect x="25" y="3" width="1" height="13" fill="#46544c" />
      <!-- lank hair patches -->
      <rect x="11" y="3" width="15" height="2" fill="#2a3430" />
      <rect x="11" y="5" width="3" height="3" fill="#2a3430" />
      <rect x="23" y="5" width="3" height="4" fill="#222a26" />
      <rect x="13" y="4" width="2" height="2" fill="#37433d" />
      <!-- dead-light eyes, uneven -->
      <rect x="13" y="8" width="4" height="3" fill="#0c1410" />
      <rect x="20" y="9" width="4" height="3" fill="#0c1410" />
      <rect x="14" y="9" width="2" height="1" fill="#7ad0c8" />
      <rect x="21" y="10" width="2" height="1" fill="#5aa89e" />
      <rect x="14" y="9" width="1" height="1" fill="#d4fff4" />
      <rect x="21" y="10" width="1" height="1" fill="#a8e8dc" />
      <!-- sunken nose + slack jaw -->
      <rect x="18" y="11" width="2" height="2" fill="#46544c" />
      <rect x="15" y="14" width="7" height="2" fill="#0c1410" />
      <rect x="16" y="14" width="1" height="1" fill="#9caca0" />
      <rect x="19" y="14" width="1" height="1" fill="#84948a" />

      <!-- ══ The noose — frayed rope collar, end hanging ══ -->
      <rect x="10" y="16" width="18" height="4" fill="#150d08" />
      <rect x="11" y="17" width="16" height="2" fill="#5a4228" />
      <rect x="11" y="17" width="6" height="1" fill="#6e5232" />
      <rect x="22" y="17" width="5" height="2" fill="#4a3620" />
      <!-- rope twist marks -->
      <rect x="13" y="17" width="1" height="2" fill="#3a2a16" />
      <rect x="17" y="17" width="1" height="2" fill="#3a2a16" />
      <rect x="21" y="17" width="1" height="2" fill="#3a2a16" />
      <!-- the knot + hanging end -->
      <rect x="24" y="19" width="5" height="4" fill="#150d08" />
      <rect x="25" y="20" width="3" height="2" fill="#5a4228" />
      <rect x="25" y="23" width="3" height="9" fill="#150d08" />
      <rect x="26" y="24" width="1" height="8" fill="#5a4228" />
      <rect x="27" y="24" width="1" height="6" fill="#3a2a16" />
      <!-- frayed end -->
      <rect x="25" y="32" width="1" height="3" fill="#4a3620" />
      <rect x="27" y="32" width="1" height="2" fill="#4a3620" />
      <rect x="26" y="33" width="1" height="3" fill="#3a2a16" />

      <!-- ══ Burial coat — rotted, hanging open ══ -->
      <rect x="7" y="20" width="24" height="24" fill="#150d08" />
      <rect x="8" y="21" width="22" height="22" fill="#222e2a" />
      <rect x="8" y="21" width="7" height="22" fill="#2c3a34" />
      <rect x="8" y="21" width="3" height="16" fill="#37433d" />
      <rect x="26" y="21" width="4" height="22" fill="#1a2420" />
      <rect x="28" y="21" width="2" height="22" fill="#141c18" />
      <!-- coat opening — sunken ribbed chest beneath -->
      <rect x="15" y="21" width="8" height="14" fill="#0c1410" />
      <rect x="16" y="22" width="6" height="12" fill="#46544c" />
      <rect x="16" y="22" width="2" height="12" fill="#56665e" />
      <!-- ribs showing -->
      <rect x="16" y="24" width="6" height="1" fill="#0c1410" />
      <rect x="16" y="27" width="6" height="1" fill="#0c1410" />
      <rect x="16" y="30" width="6" height="1" fill="#0c1410" />
      <rect x="16" y="23" width="3" height="1" fill="#6a7a72" />
      <rect x="16" y="26" width="2" height="1" fill="#6a7a72" />
      <!-- grave-mould patches -->
      <rect x="10" y="25" width="2" height="2" fill="#37503a" />
      <rect x="11" y="33" width="2" height="1" fill="#2c4030" />
      <rect x="27" y="28" width="2" height="2" fill="#1e2c20" />
      <!-- torn hem -->
      <rect x="9" y="40" width="3" height="3" fill="#0c1410" />
      <rect x="16" y="41" width="3" height="2" fill="#0c1410" />
      <rect x="24" y="40" width="3" height="3" fill="#0c1410" />

      <!-- ══ Left arm — manacled, chain swinging ══ -->
      <rect x="3" y="21" width="7" height="9" fill="#150d08" />
      <rect x="4" y="22" width="5" height="7" fill="#2c3a34" />
      <rect x="4" y="22" width="2" height="7" fill="#37433d" />
      <rect x="2" y="28" width="7" height="9" fill="#150d08" />
      <rect x="3" y="29" width="5" height="7" fill="#222e2a" />
      <rect x="3" y="29" width="2" height="7" fill="#2c3a34" />
      <!-- bone claw hand -->
      <rect x="2" y="35" width="7" height="6" fill="#150d08" />
      <rect x="3" y="36" width="5" height="4" fill="#84948a" />
      <rect x="3" y="36" width="2" height="4" fill="#9caca0" />
      <rect x="2" y="39" width="1" height="3" fill="#b8c4ba" />
      <rect x="4" y="40" width="1" height="2" fill="#9caca0" />
      <rect x="6" y="40" width="1" height="2" fill="#84948a" />
      <!-- iron manacle + chain links -->
      <rect x="2" y="33" width="7" height="3" fill="#150d08" />
      <rect x="3" y="34" width="5" height="1" fill="#56525e" />
      <rect x="3" y="34" width="2" height="1" fill="#6e6a78" />
      <rect x="1" y="36" width="2" height="2" fill="#3a3644" />
      <rect x="0" y="38" width="2" height="2" fill="#56525e" />
      <rect x="1" y="40" width="2" height="2" fill="#3a3644" />

      <!-- ══ Right arm — reaching, half-raised ══ -->
      <rect x="28" y="21" width="7" height="8" fill="#150d08" />
      <rect x="29" y="22" width="5" height="6" fill="#1a2420" />
      <rect x="29" y="22" width="2" height="6" fill="#222e2a" />
      <rect x="30" y="27" width="7" height="8" fill="#150d08" />
      <rect x="31" y="28" width="5" height="6" fill="#141c18" />
      <rect x="31" y="28" width="2" height="6" fill="#1a2420" />
      <!-- grasping bone claw -->
      <rect x="31" y="33" width="7" height="7" fill="#150d08" />
      <rect x="32" y="34" width="5" height="4" fill="#6a7a72" />
      <rect x="32" y="34" width="2" height="4" fill="#84948a" />
      <rect x="32" y="37" width="1" height="3" fill="#9caca0" />
      <rect x="34" y="38" width="1" height="2" fill="#84948a" />
      <rect x="36" y="37" width="1" height="3" fill="#6a7a72" />

      <!-- ══ Ragged legs ══ -->
      <rect x="9" y="43" width="9" height="11" fill="#150d08" />
      <rect x="10" y="44" width="7" height="10" fill="#1a2420" />
      <rect x="10" y="44" width="3" height="10" fill="#222e2a" />
      <rect x="15" y="44" width="2" height="10" fill="#141c18" />
      <rect x="20" y="43" width="9" height="11" fill="#150d08" />
      <rect x="21" y="44" width="7" height="10" fill="#161e1a" />
      <rect x="21" y="44" width="2" height="10" fill="#1a2420" />
      <!-- torn trouser ends -->
      <rect x="11" y="50" width="5" height="1" fill="#0c1410" />
      <rect x="22" y="51" width="5" height="1" fill="#0c1410" />

      <!-- ══ Bare bone feet ══ -->
      <rect x="7" y="54" width="11" height="5" fill="#150d08" />
      <rect x="8" y="55" width="9" height="3" fill="#84948a" />
      <rect x="8" y="55" width="3" height="3" fill="#9caca0" />
      <rect x="8" y="57" width="9" height="1" fill="#56665e" />
      <rect x="20" y="54" width="11" height="5" fill="#150d08" />
      <rect x="21" y="55" width="9" height="3" fill="#6a7a72" />
      <rect x="21" y="57" width="9" height="1" fill="#46544c" />

      <!-- grave motes -->
      <rect x="33" y="16" width="1" height="1" fill="#7ad0c8" opacity="0.5" />
      <rect x="5" y="14" width="1" height="1" fill="#7ad0c8" opacity="0.4" />
      <rect x="35" y="46" width="1" height="1" fill="#5aa89e" opacity="0.4" />
    </svg>
