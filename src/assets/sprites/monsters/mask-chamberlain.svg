<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 44"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="The Mask-Chamberlain"
    >
      <!-- Courtly violet backlight + ground shadow -->
      <ellipse cx="16" cy="22" rx="15" ry="20" fill="#6a3a9a" opacity="0.1" />
      <ellipse cx="16" cy="22" rx="9" ry="14" fill="#c0a040" opacity="0.05" />
      <ellipse cx="16" cy="34" rx="15" ry="9" fill="#160f20" opacity="0.38" />

      <!-- Trailing robe wings -->
      <polygon points="6,20 8,42 6,42" fill="#2a1f3c" opacity="0.6" />
      <polygon points="26,20 24,42 26,42" fill="#2a1f3c" opacity="0.6" />

      <!-- Golden mask — ivory ramp, key upper-left, specular -->
      <rect x="11" y="4" width="10" height="12" fill="#ece2cf" />
      <rect x="11" y="4" width="10" height="1" fill="#f6efdd" />
      <rect x="11" y="4" width="2" height="12" fill="#f2e8d6" />
      <rect x="11" y="5" width="1" height="9" fill="#fbf4e6" />
      <rect x="19" y="4" width="2" height="12" fill="#c8baa2" />
      <rect x="11" y="15" width="10" height="1" fill="#c4b69e" />
      <polygon points="11,4 16,1 21,4" fill="#241830" />
      <rect x="10" y="3" width="12" height="1" fill="#c0a040" />
      <rect x="10" y="3" width="12" height="1" fill="#e4c860" opacity="0.5" />
      <rect x="14" y="0" width="4" height="2" fill="#f4d042" />
      <rect x="14" y="0" width="1" height="1" fill="#fff0b0" />
      <!-- eye-slits + spark -->
      <rect x="12" y="8" width="2" height="3" fill="#16101e" />
      <rect x="18" y="8" width="2" height="3" fill="#16101e" />
      <rect x="12" y="8" width="1" height="1" fill="#c0a040" />
      <rect x="18" y="8" width="1" height="1" fill="#c0a040" />
      <rect x="12" y="8" width="1" height="1" fill="#f4d870" opacity="0.6" />
      <rect x="15" y="12" width="2" height="2" fill="#6e2a2a" />

      <!-- Robe torso — violet ramp + gold orphreys + dither -->
      <rect x="8" y="16" width="16" height="20" fill="#2c2040" />
      <rect x="8" y="16" width="16" height="2" fill="#3c2e54" />
      <rect x="8" y="16" width="16" height="1" fill="#4a3a64" />
      <rect x="8" y="16" width="2" height="20" fill="#352848" />
      <rect x="8" y="16" width="1" height="14" fill="#52406f" opacity="0.6" />
      <rect x="22" y="16" width="2" height="20" fill="#1f1530" />
      <rect x="14" y="18" width="4" height="18" fill="#241830" />
      <rect x="11" y="19" width="10" height="1" fill="#c0a040" opacity="0.7" />
      <rect x="10" y="24" width="12" height="1" fill="#c0a040" opacity="0.55" />
      <rect x="10" y="30" width="12" height="1" fill="#9a7e2e" opacity="0.5" />
      <rect x="11" y="22" width="1" height="1" fill="#3c2e54" />
      <rect x="20" y="28" width="1" height="1" fill="#1f1530" />

      <!-- Arms + pale hand -->
      <rect x="3" y="18" width="5" height="3" fill="#2c2040" />
      <rect x="3" y="18" width="5" height="1" fill="#3c2e54" />
      <rect x="2" y="20" width="4" height="10" fill="#33254a" />
      <rect x="2" y="20" width="1" height="10" fill="#42325e" />
      <rect x="2" y="29" width="5" height="3" fill="#ece2cf" opacity="0.9" />
      <rect x="2" y="29" width="5" height="1" fill="#f6efdd" opacity="0.7" />
      <rect x="24" y="18" width="5" height="3" fill="#2c2040" />
      <rect x="26" y="19" width="3" height="11" fill="#33254a" />
      <rect x="28" y="19" width="1" height="11" fill="#1f1530" />

      <!-- Sceptre — gold finial + specular -->
      <rect x="28" y="2" width="2" height="36" fill="#1c1208" />
      <rect x="28" y="2" width="1" height="20" fill="#3a2c12" />
      <rect x="27" y="0" width="4" height="4" fill="#c0a040" />
      <rect x="27" y="0" width="4" height="2" fill="#f4d042" />
      <rect x="28" y="1" width="1" height="1" fill="#fff0b0" />

      <!-- Robe hem legs -->
      <rect x="10" y="36" width="5" height="6" fill="#241a32" />
      <rect x="17" y="36" width="5" height="6" fill="#241a32" />
      <rect x="10" y="36" width="1" height="6" fill="#352848" />
      <rect x="17" y="36" width="1" height="6" fill="#352848" />
      <rect x="9" y="41" width="7" height="2" fill="#120c18" />
      <rect x="17" y="41" width="7" height="2" fill="#120c18" />
      <rect x="6" y="27" width="1" height="1" fill="#f4d042" opacity="0.5" />
      <rect x="23" y="32" width="1" height="1" fill="#a0c0d0" opacity="0.5" />
    </svg>
