<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 48 66"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="The Mask-Chamberlain"
    >
      <!-- Courtly violet backlight + ground shadow -->
      <ellipse cx="24" cy="32" rx="23" ry="30" fill="#6a3a9a" opacity="0.1" />
      <ellipse cx="24" cy="32" rx="14" ry="21" fill="#c0a040" opacity="0.05" />
      <ellipse cx="24" cy="63.5" rx="16" ry="2.2" fill="#160f20" opacity="0.55" />

      <!-- ══ The key-staff of the court ══ -->
      <rect x="37" y="6" width="4" height="50" fill="#150d08" />
      <rect x="38" y="7" width="2" height="48" fill="#2c1d44" />
      <rect x="38" y="7" width="1" height="48" fill="#3a2658" />
      <!-- the great key head -->
      <rect x="35" y="0" width="8" height="3" fill="#150d08" />
      <rect x="36" y="1" width="6" height="1" fill="#c0a040" />
      <rect x="36" y="1" width="2" height="1" fill="#f4d042" />
      <rect x="35" y="3" width="3" height="3" fill="#150d08" />
      <rect x="40" y="3" width="3" height="3" fill="#150d08" />
      <rect x="36" y="4" width="1" height="1" fill="#c0a040" />
      <rect x="41" y="4" width="1" height="1" fill="#9a7e2e" />
      <!-- key wards lower on the shaft -->
      <rect x="41" y="10" width="3" height="2" fill="#150d08" />
      <rect x="42" y="10" width="1" height="1" fill="#c0a040" />
      <rect x="41" y="14" width="2" height="2" fill="#150d08" />
      <rect x="41" y="14" width="1" height="1" fill="#9a7e2e" />

      <!-- ══ Trailing robe wings ══ -->
      <rect x="8" y="24" width="6" height="36" fill="#160f20" />
      <rect x="9" y="26" width="4" height="32" fill="#1c1228" />
      <rect x="34" y="24" width="5" height="36" fill="#120b1a" />

      <!-- ══ Tall powdered wig-hood ══ -->
      <rect x="15" y="0" width="18" height="6" fill="#150d08" />
      <rect x="16" y="1" width="16" height="5" fill="#3e3650" />
      <rect x="16" y="1" width="6" height="5" fill="#4a4060" />
      <rect x="16" y="1" width="3" height="3" fill="#564c70" />
      <rect x="28" y="1" width="4" height="5" fill="#322a42" />
      <!-- side rolls -->
      <rect x="13" y="4" width="4" height="6" fill="#150d08" />
      <rect x="14" y="5" width="2" height="4" fill="#4a4060" />
      <rect x="31" y="4" width="4" height="6" fill="#150d08" />
      <rect x="32" y="5" width="2" height="4" fill="#322a42" />

      <!-- ══ The worn mask — serene gold-rimmed porcelain ══ -->
      <rect x="16" y="6" width="16" height="14" fill="#150d08" />
      <rect x="17" y="7" width="14" height="12" fill="#dccfb8" />
      <rect x="17" y="7" width="5" height="12" fill="#ece2cf" />
      <rect x="17" y="7" width="2" height="8" fill="#f4ecd8" />
      <rect x="28" y="7" width="3" height="12" fill="#c2b59c" />
      <rect x="30" y="7" width="1" height="12" fill="#aa9d84" />
      <!-- gold rim -->
      <rect x="17" y="7" width="14" height="1" fill="#c0a040" />
      <rect x="17" y="7" width="5" height="1" fill="#f4d042" />
      <!-- serene slit eyes -->
      <rect x="19" y="11" width="4" height="2" fill="#060308" />
      <rect x="25" y="11" width="4" height="2" fill="#060308" />
      <rect x="19" y="11" width="1" height="1" fill="#1a1424" />
      <!-- painted tear under one eye -->
      <rect x="20" y="13" width="1" height="2" fill="#6a3a9a" />
      <!-- faint smile line -->
      <rect x="21" y="16" width="6" height="1" fill="#aa9d84" />
      <rect x="21" y="16" width="2" height="1" fill="#c2b59c" />

      <!-- ══ High collar ══ -->
      <rect x="13" y="20" width="22" height="4" fill="#150d08" />
      <rect x="14" y="21" width="20" height="3" fill="#352350" />
      <rect x="14" y="21" width="7" height="3" fill="#46306a" />
      <rect x="14" y="21" width="20" height="1" fill="#5a4288" />
      <rect x="17" y="21" width="1" height="2" fill="#c0a040" />
      <rect x="24" y="21" width="1" height="2" fill="#f4d042" />
      <rect x="31" y="21" width="1" height="2" fill="#9a7e2e" />

      <!-- ══ Long courtly coat ══ -->
      <rect x="12" y="24" width="24" height="26" fill="#150d08" />
      <rect x="13" y="25" width="22" height="25" fill="#241634" />
      <rect x="13" y="25" width="8" height="25" fill="#2c1d44" />
      <rect x="13" y="25" width="4" height="19" fill="#3a2658" />
      <rect x="30" y="25" width="5" height="25" fill="#1a1028" />
      <rect x="33" y="25" width="2" height="25" fill="#150c22" />
      <!-- center button line -->
      <rect x="23" y="25" width="2" height="25" fill="#160e22" />
      <rect x="23" y="27" width="1" height="1" fill="#c0a040" />
      <rect x="23" y="31" width="1" height="1" fill="#9a7e2e" />
      <rect x="23" y="35" width="1" height="1" fill="#c0a040" />
      <rect x="23" y="39" width="1" height="1" fill="#9a7e2e" />
      <rect x="23" y="43" width="1" height="1" fill="#8a6e28" />
      <!-- brocade dots -->
      <rect x="16" y="28" width="1" height="1" fill="#5a4288" />
      <rect x="19" y="33" width="1" height="1" fill="#46306a" />
      <rect x="16" y="38" width="1" height="1" fill="#5a4288" />
      <rect x="31" y="30" width="1" height="1" fill="#2a1d3e" />
      <rect x="31" y="40" width="1" height="1" fill="#241634" />

      <!-- ══ The mask bandolier — spare faces for the court ══ -->
      <rect x="13" y="26" width="5" height="3" fill="#2e2014" />
      <rect x="16" y="29" width="5" height="3" fill="#2e2014" />
      <rect x="19" y="32" width="5" height="3" fill="#271b11" />
      <rect x="22" y="35" width="5" height="3" fill="#271b11" />
      <rect x="25" y="38" width="5" height="3" fill="#221709" />
      <rect x="13" y="26" width="2" height="1" fill="#3c2c1c" />
      <!-- hanging mask 1 — laughing -->
      <rect x="14" y="30" width="6" height="7" fill="#150d08" />
      <rect x="15" y="31" width="4" height="5" fill="#dccfb8" />
      <rect x="15" y="31" width="2" height="5" fill="#ece2cf" />
      <rect x="16" y="32" width="1" height="1" fill="#060308" />
      <rect x="18" y="32" width="1" height="1" fill="#060308" />
      <rect x="16" y="34" width="2" height="1" fill="#8a7d64" />
      <rect x="15" y="33" width="1" height="1" fill="#c2b59c" />
      <!-- hanging mask 2 — weeping -->
      <rect x="20" y="37" width="6" height="7" fill="#150d08" />
      <rect x="21" y="38" width="4" height="5" fill="#c2b59c" />
      <rect x="21" y="38" width="2" height="5" fill="#dccfb8" />
      <rect x="22" y="39" width="1" height="1" fill="#060308" />
      <rect x="24" y="39" width="1" height="1" fill="#060308" />
      <rect x="22" y="41" width="2" height="1" fill="#6a5d48" />
      <rect x="22" y="40" width="1" height="1" fill="#6a3a9a" />
      <!-- hanging mask 3 — snarling, chipped -->
      <rect x="26" y="41" width="6" height="6" fill="#150d08" />
      <rect x="27" y="42" width="4" height="4" fill="#aa9d84" />
      <rect x="27" y="42" width="2" height="4" fill="#c2b59c" />
      <rect x="28" y="43" width="1" height="1" fill="#060308" />
      <rect x="30" y="43" width="1" height="1" fill="#060308" />
      <rect x="28" y="45" width="2" height="1" fill="#54483a" />
      <rect x="30" y="42" width="1" height="1" fill="#150d08" />

      <!-- ══ Left arm — white-gloved, presenting ══ -->
      <rect x="9" y="25" width="6" height="8" fill="#150d08" />
      <rect x="10" y="26" width="4" height="6" fill="#2c1d44" />
      <rect x="10" y="26" width="2" height="6" fill="#3a2658" />
      <rect x="7" y="31" width="7" height="8" fill="#150d08" />
      <rect x="8" y="32" width="5" height="6" fill="#241634" />
      <rect x="8" y="32" width="2" height="6" fill="#2c1d44" />
      <!-- gloved open hand, palm up -->
      <rect x="6" y="37" width="8" height="5" fill="#150d08" />
      <rect x="7" y="38" width="6" height="3" fill="#d8d2bc" />
      <rect x="7" y="38" width="3" height="3" fill="#ece6d0" />
      <rect x="7" y="38" width="6" height="1" fill="#f8f4e4" />

      <!-- ══ Right arm — to the key-staff ══ -->
      <rect x="33" y="25" width="6" height="8" fill="#150d08" />
      <rect x="34" y="26" width="4" height="6" fill="#1a1028" />
      <rect x="34" y="26" width="2" height="6" fill="#241634" />
      <!-- gloved hand on the staff -->
      <rect x="34" y="32" width="7" height="6" fill="#150d08" />
      <rect x="35" y="33" width="5" height="4" fill="#d8d2bc" />
      <rect x="35" y="33" width="2" height="4" fill="#ece6d0" />
      <rect x="37" y="35" width="1" height="1" fill="#b8b09a" />

      <!-- ══ Coat skirts + slippered feet ══ -->
      <rect x="12" y="50" width="24" height="3" fill="#150c22" />
      <rect x="11" y="53" width="26" height="8" fill="#150d08" />
      <rect x="12" y="54" width="24" height="6" fill="#241634" />
      <rect x="12" y="54" width="7" height="6" fill="#2c1d44" />
      <rect x="30" y="54" width="6" height="6" fill="#1a1028" />
      <rect x="19" y="54" width="1" height="6" fill="#1a1028" />
      <rect x="28" y="54" width="1" height="6" fill="#150c22" />
      <!-- gold hem -->
      <rect x="12" y="58" width="24" height="1" fill="#9a7e2e" opacity="0.8" />
      <rect x="12" y="58" width="8" height="1" fill="#c0a040" opacity="0.85" />
      <rect x="12" y="59" width="24" height="1" fill="#0e0816" />
      <!-- slipper points -->
      <rect x="15" y="60" width="6" height="3" fill="#150d08" />
      <rect x="16" y="61" width="4" height="1" fill="#2c1d44" />
      <rect x="26" y="60" width="6" height="3" fill="#150d08" />
      <rect x="27" y="61" width="4" height="1" fill="#241634" />

      <!-- court motes -->
      <rect x="5" y="16" width="1" height="1" fill="#f4d042" opacity="0.5" />
      <rect x="43" y="28" width="1" height="1" fill="#a48ee0" opacity="0.5" />
      <rect x="4" y="48" width="1" height="1" fill="#c0a040" opacity="0.4" />
      <rect x="44" y="50" width="1" height="1" fill="#a48ee0" opacity="0.4" />
    </svg>
