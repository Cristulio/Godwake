<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 30"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Stirge"
    >
      <!-- Membranous backlight + faint hover shadow -->
      <ellipse cx="15" cy="12" rx="15" ry="12" fill="#7a5028" opacity="0.08" />
      <ellipse cx="15" cy="28" rx="7" ry="1.2" fill="#000" opacity="0.28" />

      <!-- ── Left wing — stepped membrane, lit leading edge ── -->
      <rect x="0" y="8" width="2" height="4" fill="#150d08" />
      <rect x="1" y="5" width="3" height="8" fill="#150d08" />
      <rect x="3" y="3" width="3" height="11" fill="#150d08" />
      <rect x="6" y="4" width="3" height="12" fill="#150d08" />
      <rect x="1" y="6" width="2" height="6" fill="#7a5028" />
      <rect x="3" y="4" width="2" height="9" fill="#9a6838" />
      <rect x="5" y="5" width="2" height="10" fill="#7a5028" />
      <rect x="7" y="6" width="2" height="9" fill="#5a3818" />
      <!-- hot lit leading edge -->
      <rect x="3" y="4" width="2" height="1" fill="#e0a060" />
      <rect x="1" y="6" width="2" height="1" fill="#b87a40" />
      <rect x="5" y="5" width="2" height="1" fill="#9a6838" />
      <rect x="7" y="6" width="2" height="1" fill="#7a5028" />
      <!-- wing finger bones -->
      <rect x="4" y="4" width="1" height="10" fill="#2a1810" />
      <rect x="7" y="5" width="1" height="10" fill="#2a1810" />
      <!-- membrane tears -->
      <rect x="2" y="10" width="1" height="1" fill="#150d08" />
      <rect x="6" y="12" width="1" height="2" fill="#150d08" />

      <!-- ── Right wing — shadow side, teal bounce ── -->
      <rect x="28" y="8" width="2" height="4" fill="#150d08" />
      <rect x="26" y="5" width="3" height="8" fill="#150d08" />
      <rect x="24" y="3" width="3" height="11" fill="#150d08" />
      <rect x="21" y="4" width="3" height="12" fill="#150d08" />
      <rect x="27" y="6" width="2" height="6" fill="#3a2418" />
      <rect x="25" y="4" width="2" height="9" fill="#4a2c14" />
      <rect x="23" y="5" width="2" height="10" fill="#3a2418" />
      <rect x="21" y="6" width="2" height="9" fill="#2a1810" />
      <rect x="25" y="4" width="2" height="1" fill="#7a5028" />
      <rect x="27" y="11" width="1" height="2" fill="#2e4a4e" />
      <rect x="25" y="4" width="1" height="10" fill="#1f1208" />
      <rect x="22" y="5" width="1" height="10" fill="#1f1208" />
      <rect x="27" y="9" width="1" height="1" fill="#150d08" />

      <!-- ── Bloated body — blood-fat chitin, key upper-left ── -->
      <rect x="9" y="6" width="12" height="11" fill="#150d08" />
      <rect x="10" y="7" width="10" height="9" fill="#5a3818" />
      <rect x="10" y="7" width="10" height="1" fill="#7a5028" />
      <rect x="10" y="7" width="3" height="7" fill="#7a5028" />
      <rect x="10" y="7" width="2" height="4" fill="#9a6838" />
      <rect x="10" y="7" width="1" height="2" fill="#c08a50" />
      <rect x="17" y="8" width="3" height="8" fill="#3a2418" />
      <rect x="19" y="9" width="1" height="7" fill="#2a1810" />
      <!-- engorged blood-sheen on the belly -->
      <rect x="12" y="12" width="6" height="4" fill="#6a1f18" />
      <rect x="12" y="12" width="6" height="1" fill="#8c2a20" />
      <rect x="12" y="12" width="2" height="2" fill="#a93340" />
      <rect x="17" y="14" width="1" height="2" fill="#4a120c" />
      <!-- chitin dither -->
      <rect x="14" y="8" width="1" height="1" fill="#3a2418" />
      <rect x="11" y="10" width="1" height="1" fill="#9a6838" />
      <rect x="16" y="10" width="1" height="1" fill="#2a1810" />

      <!-- ── Clustered eyes — four, red glow + spark ── -->
      <rect x="11" y="8" width="3" height="3" fill="#1a0e08" />
      <rect x="15" y="8" width="3" height="3" fill="#1a0e08" />
      <rect x="12" y="9" width="2" height="2" fill="#b5302c" />
      <rect x="15" y="9" width="2" height="2" fill="#8c2018" />
      <rect x="12" y="9" width="1" height="1" fill="#ff8a5a" />
      <rect x="15" y="9" width="1" height="1" fill="#e05438" />
      <rect x="10" y="6" width="1" height="2" fill="#150d08" />
      <rect x="13" y="5" width="1" height="2" fill="#150d08" />
      <rect x="16" y="5" width="1" height="2" fill="#150d08" />
      <rect x="19" y="6" width="1" height="2" fill="#150d08" />

      <!-- ── Proboscis — needle bone, driven downward ── -->
      <rect x="13" y="16" width="4" height="3" fill="#150d08" />
      <rect x="14" y="17" width="2" height="2" fill="#3a2418" />
      <rect x="13" y="19" width="3" height="9" fill="#150d08" />
      <rect x="14" y="19" width="1" height="9" fill="#a89878" />
      <rect x="14" y="19" width="1" height="4" fill="#d4c8a8" />
      <rect x="14" y="19" width="1" height="2" fill="#f0e6cc" />
      <!-- blood bead at the tip -->
      <rect x="14" y="27" width="1" height="1" fill="#a93340" />

      <!-- ── Hooked legs — folded under ── -->
      <rect x="9" y="15" width="2" height="3" fill="#150d08" />
      <rect x="9" y="15" width="1" height="2" fill="#5a3818" />
      <rect x="8" y="17" width="2" height="2" fill="#150d08" />
      <rect x="8" y="17" width="1" height="1" fill="#7a5028" />
      <rect x="19" y="15" width="2" height="3" fill="#150d08" />
      <rect x="20" y="15" width="1" height="2" fill="#3a2418" />
      <rect x="20" y="17" width="2" height="2" fill="#150d08" />
      <rect x="21" y="17" width="1" height="1" fill="#3a2418" />
      <rect x="11" y="17" width="1" height="2" fill="#150d08" />
      <rect x="18" y="17" width="1" height="2" fill="#150d08" />
    </svg>
