<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 36 33"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Reknitting Horror"
    >
      <!-- Wrong-flesh backlight + ground shadow -->
      <ellipse cx="18" cy="18" rx="17" ry="13" fill="#a85a6a" opacity="0.08" />
      <ellipse cx="18" cy="31.4" rx="13" ry="1.8" fill="#000" opacity="0.4" />

      <!-- ── The mass — a sphere of flesh that will not stay dead ── -->
      <rect x="8" y="3" width="20" height="4" fill="#150d08" />
      <rect x="5" y="6" width="26" height="5" fill="#150d08" />
      <rect x="3" y="10" width="30" height="12" fill="#150d08" />
      <rect x="5" y="22" width="26" height="4" fill="#150d08" />
      <rect x="8" y="26" width="20" height="4" fill="#150d08" />
      <!-- base flesh fill -->
      <rect x="9" y="4" width="18" height="3" fill="#766a72" />
      <rect x="6" y="7" width="24" height="4" fill="#766a72" />
      <rect x="4" y="11" width="28" height="10" fill="#6a6068" />
      <rect x="6" y="21" width="24" height="4" fill="#5a5358" />
      <rect x="9" y="25" width="18" height="4" fill="#4a4448" />
      <!-- lit upper-left -->
      <rect x="9" y="4" width="9" height="3" fill="#86787e" />
      <rect x="9" y="4" width="5" height="2" fill="#968890" />
      <rect x="9" y="4" width="2" height="1" fill="#a89aa2" />
      <rect x="6" y="7" width="7" height="4" fill="#86787e" />
      <rect x="6" y="7" width="3" height="2" fill="#968890" />
      <rect x="4" y="11" width="4" height="6" fill="#766a72" />
      <rect x="4" y="11" width="2" height="3" fill="#86787e" />
      <!-- cool shadow lower-right -->
      <rect x="26" y="11" width="6" height="10" fill="#5a5358" />
      <rect x="29" y="13" width="3" height="8" fill="#4a4448" />
      <rect x="31" y="15" width="1" height="5" fill="#3a3038" />
      <rect x="30" y="18" width="2" height="3" fill="#33404a" />
      <rect x="24" y="25" width="6" height="3" fill="#3a3038" />

      <!-- ── The reknitting — raw pink seams stitching themselves shut ── -->
      <!-- great diagonal scar, half-healed -->
      <rect x="11" y="8" width="5" height="2" fill="#4a2434" />
      <rect x="15" y="10" width="5" height="2" fill="#4a2434" />
      <rect x="19" y="12" width="5" height="2" fill="#4a2434" />
      <rect x="12" y="8" width="3" height="1" fill="#a85a6a" />
      <rect x="16" y="10" width="3" height="1" fill="#c4707a" />
      <rect x="20" y="12" width="3" height="1" fill="#a85a6a" />
      <!-- cross-stitches of sinew -->
      <rect x="13" y="7" width="1" height="3" fill="#d88a92" />
      <rect x="17" y="9" width="1" height="3" fill="#d88a92" />
      <rect x="21" y="11" width="1" height="3" fill="#c4707a" />
      <!-- second seam, still open — wet inside -->
      <rect x="8" y="16" width="8" height="3" fill="#150d08" />
      <rect x="9" y="17" width="6" height="2" fill="#4a2434" />
      <rect x="10" y="17" width="4" height="1" fill="#7a3848" />
      <rect x="11" y="17" width="2" height="1" fill="#a85a6a" />
      <!-- knitting strands pulling it closed -->
      <rect x="10" y="15" width="1" height="2" fill="#d88a92" />
      <rect x="13" y="15" width="1" height="2" fill="#c4707a" />
      <!-- old puckered scars, long sealed -->
      <rect x="22" y="17" width="5" height="1" fill="#544850" />
      <rect x="23" y="16" width="1" height="3" fill="#544850" />
      <rect x="9" y="22" width="4" height="1" fill="#443a40" />
      <rect x="19" y="23" width="5" height="1" fill="#443a40" />
      <rect x="20" y="22" width="1" height="3" fill="#3a3038" />

      <!-- ── Wrong anatomy surfacing — a knuckle, a tooth-row, an ear ── -->
      <!-- knuckles pressing from inside -->
      <rect x="6" y="13" width="2" height="1" fill="#968890" />
      <rect x="9" y="13" width="2" height="1" fill="#86787e" />
      <rect x="7" y="12" width="1" height="1" fill="#a89aa2" />
      <!-- a seam of teeth where no mouth belongs -->
      <rect x="14" y="21" width="8" height="2" fill="#1a0e14" />
      <rect x="15" y="21" width="1" height="2" fill="#e8dcc4" />
      <rect x="17" y="21" width="1" height="2" fill="#d4c8a8" />
      <rect x="19" y="21" width="1" height="2" fill="#c2b794" />
      <rect x="21" y="21" width="1" height="1" fill="#a89878" />
      <!-- a milk-blind eye opening at the crown -->
      <rect x="19" y="6" width="4" height="3" fill="#1a0e14" />
      <rect x="20" y="7" width="2" height="1" fill="#cfc8be" />
      <rect x="20" y="7" width="1" height="1" fill="#ece6da" />
      <!-- vein webs -->
      <rect x="25" y="9" width="2" height="1" fill="#5a3a48" />
      <rect x="27" y="10" width="1" height="2" fill="#5a3a48" />
      <rect x="6" y="19" width="1" height="2" fill="#4a3340" />

      <!-- ── Dragging pseudopods — it walks on its own scar tissue ── -->
      <rect x="7" y="28" width="5" height="3" fill="#150d08" />
      <rect x="8" y="29" width="3" height="1" fill="#5a5358" />
      <rect x="8" y="30" width="2" height="1" fill="#443a40" />
      <rect x="14" y="29" width="4" height="3" fill="#150d08" />
      <rect x="15" y="30" width="2" height="1" fill="#4a4448" />
      <rect x="21" y="28" width="5" height="3" fill="#150d08" />
      <rect x="22" y="29" width="3" height="1" fill="#443a40" />
      <rect x="27" y="27" width="4" height="3" fill="#150d08" />
      <rect x="28" y="28" width="2" height="1" fill="#3a3038" />
      <!-- wet trail glint -->
      <rect x="12" y="31" width="3" height="1" fill="#86787e" opacity="0.35" />
      <rect x="24" y="30" width="3" height="1" fill="#766a72" opacity="0.3" />

      <!-- ── Sloughed motes — flecks it is already regrowing ── -->
      <rect x="3" y="8" width="1" height="1" fill="#a85a6a" opacity="0.5" />
      <rect x="33" y="12" width="1" height="1" fill="#a85a6a" opacity="0.45" />
      <rect x="2" y="20" width="1" height="1" fill="#c4707a" opacity="0.4" />
      <rect x="33" y="23" width="1" height="1" fill="#7a3848" opacity="0.45" />
    </svg>
