<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 38 30"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Plaguebound Cur"
    >
      <!-- Sickly miasma backlight + ground shadow -->
      <ellipse cx="20" cy="17" rx="18" ry="12" fill="#6a8a2a" opacity="0.08" />
      <ellipse cx="20" cy="28.6" rx="15" ry="1.7" fill="#000" opacity="0.4" />

      <!-- ── Poison breath drifting off the muzzle ── -->
      <rect x="0" y="9" width="4" height="4" fill="#6a8a3a" opacity="0.55" />
      <rect x="2" y="7" width="4" height="4" fill="#8aaa4a" opacity="0.45" />
      <rect x="1" y="12" width="3" height="2" fill="#a8c478" opacity="0.45" />
      <rect x="3" y="8" width="1" height="1" fill="#c4dc92" opacity="0.65" />
      <rect x="0" y="6" width="2" height="2" fill="#8aaa4a" opacity="0.3" />

      <!-- ── Haunches + body — mangy fur ramp, ribs showing ── -->
      <rect x="16" y="10" width="17" height="11" fill="#150d08" />
      <rect x="17" y="11" width="15" height="9" fill="#3a3028" />
      <rect x="17" y="11" width="15" height="1" fill="#56483a" />
      <rect x="17" y="11" width="4" height="9" fill="#42382c" />
      <rect x="17" y="11" width="2" height="5" fill="#56483a" />
      <rect x="27" y="12" width="5" height="8" fill="#2a221a" />
      <rect x="30" y="13" width="2" height="7" fill="#221a14" />
      <rect x="31" y="15" width="1" height="3" fill="#2e4a4e" />
      <!-- starved rib shadows -->
      <rect x="22" y="13" width="1" height="5" fill="#221a14" />
      <rect x="24" y="13" width="1" height="5" fill="#221a14" />
      <rect x="26" y="13" width="1" height="5" fill="#1a1410" />
      <rect x="22" y="13" width="1" height="1" fill="#5a4e3a" />
      <rect x="24" y="13" width="1" height="1" fill="#5a4e3a" />
      <!-- plague boils — sick green pustules -->
      <rect x="28" y="12" width="2" height="2" fill="#6a8a3a" />
      <rect x="28" y="12" width="1" height="1" fill="#a8c478" />
      <rect x="20" y="17" width="2" height="2" fill="#54702c" />
      <rect x="20" y="17" width="1" height="1" fill="#8aaa4a" />
      <rect x="25" y="11" width="1" height="1" fill="#6a8a3a" />

      <!-- ── Raised hackle ridge — matted spikes ── -->
      <rect x="17" y="9" width="3" height="2" fill="#150d08" />
      <rect x="21" y="8" width="3" height="3" fill="#150d08" />
      <rect x="25" y="9" width="3" height="2" fill="#150d08" />
      <rect x="29" y="10" width="2" height="1" fill="#150d08" />
      <rect x="18" y="10" width="1" height="1" fill="#56483a" />
      <rect x="22" y="9" width="1" height="1" fill="#56483a" />
      <rect x="26" y="10" width="1" height="1" fill="#42382c" />

      <!-- ── Neck + lowered hunting head ── -->
      <rect x="7" y="12" width="11" height="8" fill="#150d08" />
      <rect x="8" y="13" width="9" height="6" fill="#3a3028" />
      <rect x="8" y="13" width="9" height="1" fill="#4a4030" />
      <rect x="8" y="13" width="3" height="5" fill="#42382c" />
      <rect x="15" y="14" width="2" height="5" fill="#2a221a" />
      <!-- muzzle, dropped low -->
      <rect x="2" y="14" width="7" height="6" fill="#150d08" />
      <rect x="3" y="15" width="5" height="4" fill="#2a221a" />
      <rect x="3" y="15" width="5" height="1" fill="#3a3028" />
      <rect x="3" y="15" width="2" height="3" fill="#352b21" />
      <rect x="7" y="16" width="1" height="3" fill="#1a1410" />
      <!-- scarred snout-bridge -->
      <rect x="5" y="14" width="3" height="1" fill="#56483a" />
      <rect x="6" y="15" width="1" height="1" fill="#7a2010" />

      <!-- ── Sick glowing eyes — one bright, one clouded ── -->
      <rect x="8" y="14" width="3" height="2" fill="#1a1208" />
      <rect x="9" y="14" width="2" height="2" fill="#c4d442" />
      <rect x="9" y="14" width="1" height="1" fill="#f4f062" />
      <rect x="12" y="14" width="2" height="2" fill="#1a1208" />
      <rect x="12" y="15" width="1" height="1" fill="#6a7a28" />

      <!-- ── Snarling jaw — bared fangs, drool ── -->
      <rect x="2" y="19" width="8" height="3" fill="#150d08" />
      <rect x="3" y="20" width="6" height="1" fill="#2a221a" />
      <rect x="3" y="19" width="1" height="2" fill="#f0e6cc" />
      <rect x="5" y="19" width="1" height="2" fill="#e8dcc4" />
      <rect x="7" y="19" width="1" height="2" fill="#d4c8a8" />
      <rect x="4" y="21" width="1" height="1" fill="#e8dcc4" />
      <rect x="6" y="21" width="1" height="1" fill="#d4c8a8" />
      <!-- gum line + plague drool -->
      <rect x="3" y="19" width="6" height="1" fill="#6a1f18" opacity="0.7" />
      <rect x="8" y="22" width="1" height="2" fill="#8aaa4a" opacity="0.7" />
      <rect x="8" y="24" width="1" height="1" fill="#a8c478" opacity="0.5" />

      <!-- ── Legs — fore pair braced, hind pair coiled ── -->
      <rect x="9" y="20" width="4" height="9" fill="#150d08" />
      <rect x="10" y="21" width="2" height="7" fill="#352b21" />
      <rect x="10" y="21" width="1" height="7" fill="#42382c" />
      <rect x="14" y="20" width="4" height="9" fill="#150d08" />
      <rect x="15" y="21" width="2" height="7" fill="#251d16" />
      <rect x="21" y="20" width="4" height="9" fill="#150d08" />
      <rect x="22" y="21" width="2" height="7" fill="#352b21" />
      <rect x="22" y="21" width="1" height="7" fill="#42382c" />
      <rect x="28" y="20" width="4" height="9" fill="#150d08" />
      <rect x="29" y="21" width="2" height="7" fill="#251d16" />
      <!-- paws + claws -->
      <rect x="9" y="27" width="4" height="2" fill="#150d08" />
      <rect x="10" y="27" width="2" height="1" fill="#56483a" />
      <rect x="9" y="28" width="1" height="1" fill="#c2b794" />
      <rect x="14" y="27" width="4" height="2" fill="#150d08" />
      <rect x="14" y="28" width="1" height="1" fill="#a89878" />
      <rect x="21" y="27" width="4" height="2" fill="#150d08" />
      <rect x="22" y="27" width="2" height="1" fill="#56483a" />
      <rect x="21" y="28" width="1" height="1" fill="#c2b794" />
      <rect x="28" y="27" width="4" height="2" fill="#150d08" />
      <rect x="28" y="28" width="1" height="1" fill="#a89878" />

      <!-- ── Whip tail, low and rigid ── -->
      <rect x="32" y="10" width="4" height="2" fill="#150d08" />
      <rect x="33" y="11" width="2" height="1" fill="#2a221a" />
      <rect x="35" y="8" width="2" height="3" fill="#150d08" />
      <rect x="36" y="9" width="1" height="1" fill="#352b21" />
      <rect x="36" y="6" width="2" height="3" fill="#150d08" />
      <rect x="37" y="7" width="1" height="1" fill="#42382c" />
    </svg>
