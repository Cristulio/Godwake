<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 28 22"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Plaguebound Cur"
    >
      <!-- breath cloud -->
      <rect x="0" y="6" width="3" height="3" fill="#6a8a3a" opacity="0.6" />
      <rect x="2" y="5" width="3" height="3" fill="#8aaa4a" opacity="0.5" />
      <rect x="1" y="8" width="2" height="2" fill="#a8c478" opacity="0.5" />

      <!-- haunches / body -->
      <rect x="13" y="9" width="11" height="7" fill="#3a3028" />
      <rect x="13" y="9" width="11" height="1" fill="#4a4030" />
      <rect x="20" y="9" width="4" height="6" fill="#2a221a" />

      <!-- ridge of matted fur -->
      <rect x="14" y="8" width="2" height="1" fill="#1a1410" />
      <rect x="17" y="8" width="2" height="1" fill="#1a1410" />
      <rect x="20" y="8" width="2" height="1" fill="#1a1410" />

      <!-- neck + head, lowered to lunge -->
      <rect x="6" y="11" width="8" height="5" fill="#3a3028" />
      <rect x="3" y="12" width="5" height="4" fill="#2a221a" />
      <rect x="3" y="12" width="2" height="4" fill="#1a1410" />

      <!-- eye, sick glow -->
      <rect x="6" y="12" width="2" height="1" fill="#c4d442" />
      <rect x="6" y="12" width="1" height="1" fill="#f4f062" />

      <!-- snarling jaw + fangs -->
      <rect x="2" y="15" width="6" height="2" fill="#1a1410" />
      <polygon points="3,15 3,17 4,15" fill="#d4c8a8" />
      <polygon points="5,15 5,17 6,15" fill="#d4c8a8" />
      <polygon points="7,15 7,17 8,15" fill="#d4c8a8" />

      <!-- legs -->
      <rect x="7" y="16" width="2" height="5" fill="#2a221a" />
      <rect x="11" y="16" width="2" height="5" fill="#2a221a" />
      <rect x="16" y="16" width="2" height="5" fill="#2a221a" />
      <rect x="21" y="16" width="2" height="5" fill="#2a221a" />
      <rect x="7" y="20" width="2" height="1" fill="#1a1410" />
      <rect x="11" y="20" width="2" height="1" fill="#1a1410" />
      <rect x="16" y="20" width="2" height="1" fill="#1a1410" />
      <rect x="21" y="20" width="2" height="1" fill="#1a1410" />

      <!-- tail -->
      <rect x="24" y="9" width="3" height="1" fill="#2a221a" />
      <rect x="26" y="7" width="1" height="3" fill="#2a221a" />
    </svg>
