<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 28 22"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Plaguebound Cur"
    >
      <!-- Sickly miasma backlight + ground shadow -->
      <ellipse cx="15" cy="13" rx="13" ry="9" fill="#6a8a2a" opacity="0.07" />
      <ellipse cx="15" cy="21" rx="11" ry="1.2" fill="#000" opacity="0.38" />

      <!-- Poison breath cloud -->
      <rect x="0" y="6" width="3" height="3" fill="#6a8a3a" opacity="0.6" />
      <rect x="2" y="5" width="3" height="3" fill="#8aaa4a" opacity="0.5" />
      <rect x="1" y="8" width="2" height="2" fill="#a8c478" opacity="0.5" />
      <rect x="2" y="6" width="1" height="1" fill="#c4dc92" opacity="0.6" />

      <!-- Haunches / body — mangy fur ramp -->
      <rect x="13" y="9" width="11" height="7" fill="#3a3028" />
      <rect x="13" y="9" width="11" height="1" fill="#4a4030" />
      <rect x="13" y="9" width="3" height="7" fill="#42382c" />
      <rect x="20" y="9" width="4" height="6" fill="#2a221a" />
      <rect x="22" y="10" width="2" height="5" fill="#221a14" />
      <rect x="15" y="12" width="1" height="1" fill="#5a4e3a" />
      <rect x="18" y="13" width="1" height="1" fill="#221a14" />
      <!-- Raised ridge of matted fur -->
      <rect x="14" y="8" width="2" height="1" fill="#1a1410" />
      <rect x="17" y="8" width="2" height="1" fill="#1a1410" />
      <rect x="20" y="8" width="2" height="1" fill="#1a1410" />

      <!-- Neck + lowered head -->
      <rect x="6" y="11" width="8" height="5" fill="#3a3028" />
      <rect x="6" y="11" width="8" height="1" fill="#4a4030" />
      <rect x="6" y="11" width="2" height="5" fill="#42382c" />
      <rect x="3" y="12" width="5" height="4" fill="#2a221a" />
      <rect x="3" y="12" width="2" height="4" fill="#1a1410" />
      <rect x="3" y="12" width="1" height="4" fill="#140f0b" />
      <!-- Sick glowing eye + spark -->
      <rect x="6" y="12" width="2" height="1" fill="#c4d442" />
      <rect x="6" y="12" width="1" height="1" fill="#f4f062" />

      <!-- Snarling jaw + fangs -->
      <rect x="2" y="15" width="6" height="2" fill="#1a1410" />
      <rect x="2" y="15" width="6" height="1" fill="#2a221a" />
      <polygon points="3,15 3,17 4,15" fill="#d4c8a8" />
      <polygon points="5,15 5,17 6,15" fill="#d4c8a8" />
      <polygon points="7,15 7,17 8,15" fill="#c2b698" />
      <rect x="3" y="15" width="1" height="1" fill="#e8dcc4" />

      <!-- Legs -->
      <rect x="7" y="16" width="2" height="5" fill="#2a221a" />
      <rect x="7" y="16" width="1" height="5" fill="#352b21" />
      <rect x="11" y="16" width="2" height="5" fill="#251d16" />
      <rect x="16" y="16" width="2" height="5" fill="#2a221a" />
      <rect x="16" y="16" width="1" height="5" fill="#352b21" />
      <rect x="21" y="16" width="2" height="5" fill="#251d16" />
      <rect x="7" y="20" width="2" height="1" fill="#1a1410" />
      <rect x="11" y="20" width="2" height="1" fill="#1a1410" />
      <rect x="16" y="20" width="2" height="1" fill="#1a1410" />
      <rect x="21" y="20" width="2" height="1" fill="#1a1410" />

      <!-- Tail -->
      <rect x="24" y="9" width="3" height="1" fill="#2a221a" />
      <rect x="26" y="7" width="1" height="3" fill="#251d16" />
    </svg>
