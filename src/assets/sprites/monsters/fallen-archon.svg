<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 28 40"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Fallen Archon"
    >
      <!-- Tarnished-glory backlight + ground shadow -->
      <ellipse cx="14" cy="20" rx="14" ry="19" fill="#9a8850" opacity="0.07" />
      <ellipse cx="14" cy="38" rx="10" ry="1.8" fill="#000" opacity="0.42" />

      <!-- Burnt wings of soot-light — ramp -->
      <polygon points="8,11 1,4 2,18 8,18" fill="#4a4238" />
      <polygon points="20,11 27,4 26,18 20,18" fill="#4a4238" />
      <polygon points="8,12 3,8 4,16 8,16" fill="#5a5248" opacity="0.7" />
      <polygon points="20,12 24,8 23,16 20,16" fill="#5a5248" opacity="0.7" />
      <polygon points="8,12 4,9 5,14 8,14" fill="#6a6258" opacity="0.5" />
      <rect x="2" y="6" width="1" height="1" fill="#7a7268" opacity="0.6" />
      <rect x="25" y="6" width="1" height="1" fill="#6a6258" opacity="0.5" />

      <!-- Great pauldrons — gold ramp + specular -->
      <rect x="4" y="11" width="6" height="5" fill="#9a8850" />
      <rect x="18" y="11" width="6" height="5" fill="#9a8850" />
      <rect x="4" y="11" width="6" height="1" fill="#c8b878" />
      <rect x="18" y="11" width="6" height="1" fill="#c8b878" />
      <rect x="4" y="11" width="2" height="5" fill="#b8a868" />
      <rect x="22" y="11" width="2" height="5" fill="#7a6c40" />
      <rect x="5" y="12" width="1" height="1" fill="#f0e0a0" />

      <!-- Helm — gold ramp, two slits of cold fire -->
      <rect x="10" y="2" width="8" height="9" fill="#a89860" />
      <rect x="10" y="2" width="8" height="1" fill="#c8b878" />
      <rect x="10" y="2" width="3" height="9" fill="#b8a868" />
      <rect x="10" y="2" width="1" height="6" fill="#d0c088" />
      <rect x="16" y="2" width="2" height="9" fill="#7a6c40" />
      <polygon points="14,0 11,3 17,3" fill="#c8b878" />
      <rect x="11" y="6" width="2" height="2" fill="#0a0c10" />
      <rect x="15" y="6" width="2" height="2" fill="#0a0c10" />
      <rect x="11" y="6" width="2" height="1" fill="#cfe8ff" />
      <rect x="15" y="6" width="2" height="1" fill="#cfe8ff" />
      <rect x="11" y="6" width="1" height="1" fill="#ffffff" opacity="0.8" />
      <rect x="13" y="9" width="2" height="2" fill="#7a6c40" />

      <!-- Cuirass + soot tabard — ramp + dither -->
      <rect x="8" y="16" width="12" height="12" fill="#9a8850" />
      <rect x="8" y="16" width="2" height="12" fill="#7a6c40" />
      <rect x="18" y="16" width="2" height="12" fill="#7a6c40" />
      <rect x="8" y="16" width="1" height="12" fill="#b8a868" />
      <rect x="8" y="16" width="12" height="1" fill="#c8b878" />
      <rect x="11" y="16" width="6" height="14" fill="#3a342c" />
      <rect x="13" y="18" width="2" height="10" fill="#4a443a" />
      <rect x="10" y="20" width="1" height="1" fill="#b8a868" />
      <rect x="18" y="24" width="1" height="1" fill="#7a6c40" />

      <!-- Right arm + greatsword of fixed cold light -->
      <rect x="20" y="16" width="3" height="8" fill="#8a7a48" />
      <rect x="20" y="16" width="1" height="8" fill="#a89860" />
      <rect x="22" y="11" width="2" height="8" fill="#b8a868" />
      <rect x="19" y="10" width="8" height="1" fill="#8aa0c0" />
      <rect x="22" y="-2" width="2" height="13" fill="#cfe8ff" opacity="0.9" />
      <rect x="22" y="-2" width="1" height="13" fill="#ffffff" />
      <rect x="22" y="-2" width="2" height="2" fill="#eaf4ff" />

      <!-- Left gauntlet -->
      <rect x="5" y="16" width="3" height="9" fill="#8a7a48" />
      <rect x="5" y="16" width="1" height="9" fill="#a89860" />
      <rect x="4" y="23" width="4" height="3" fill="#b8a868" />
      <rect x="4" y="23" width="4" height="1" fill="#c8b878" />

      <!-- Fauld + greaves + boots -->
      <rect x="8" y="28" width="12" height="3" fill="#7a6c40" />
      <rect x="8" y="28" width="12" height="1" fill="#9a8850" />
      <rect x="8" y="31" width="5" height="6" fill="#8a7a48" />
      <rect x="15" y="31" width="5" height="6" fill="#8a7a48" />
      <rect x="8" y="31" width="1" height="6" fill="#a89860" />
      <rect x="15" y="31" width="1" height="6" fill="#a89860" />
      <rect x="8" y="37" width="5" height="3" fill="#1a1410" />
      <rect x="15" y="37" width="5" height="3" fill="#1a1410" />
    </svg>
