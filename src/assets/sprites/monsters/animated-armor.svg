<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 54"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Animated Armor"
    >
      <!-- Binding-magic backlight + ground shadow -->
      <ellipse cx="15" cy="26" rx="14" ry="24" fill="#3a8c5a" opacity="0.07" />
      <ellipse cx="14" cy="20" rx="10" ry="14" fill="#ffb040" opacity="0.04" />
      <ellipse cx="15" cy="52.6" rx="11" ry="1.9" fill="#000" opacity="0.42" />

      <!-- ── Floating greatsword — drifts beside the harness, no hand on it ── -->
      <rect x="23" y="2" width="2" height="3" fill="#150d08" />
      <rect x="22" y="4" width="4" height="3" fill="#150d08" />
      <rect x="23" y="3" width="1" height="1" fill="#9a7232" />
      <rect x="23" y="5" width="2" height="1" fill="#c89a48" />
      <rect x="23" y="5" width="1" height="1" fill="#ecc46a" />
      <rect x="21" y="7" width="6" height="2" fill="#150d08" />
      <rect x="22" y="8" width="4" height="1" fill="#39424f" />
      <rect x="22" y="8" width="1" height="1" fill="#6d7689" />
      <rect x="22" y="9" width="4" height="22" fill="#150d08" />
      <rect x="23" y="10" width="1" height="20" fill="#939cb0" />
      <rect x="24" y="10" width="1" height="20" fill="#4e586a" />
      <rect x="23" y="10" width="1" height="6" fill="#e8eef8" />
      <rect x="23" y="11" width="1" height="2" fill="#ffffff" />
      <!-- fuller groove -->
      <rect x="24" y="12" width="1" height="14" fill="#39424f" />
      <!-- nicks -->
      <rect x="23" y="19" width="1" height="1" fill="#232c3a" />
      <rect x="24" y="24" width="1" height="1" fill="#150d08" />
      <!-- green binding-shimmer along the blade -->
      <rect x="22" y="13" width="1" height="3" fill="#3a8c5a" opacity="0.5" />
      <rect x="25" y="20" width="1" height="3" fill="#3a8c5a" opacity="0.4" />

      <!-- ── Helm — great barbute, empty, soul-fire in the slit ── -->
      <!-- crest fin -->
      <rect x="13" y="0" width="4" height="3" fill="#150d08" />
      <rect x="14" y="1" width="2" height="1" fill="#7e1f2c" />
      <rect x="14" y="1" width="1" height="1" fill="#a93340" />
      <!-- dome -->
      <rect x="7" y="2" width="16" height="12" fill="#150d08" />
      <rect x="8" y="3" width="14" height="10" fill="#5e6678" />
      <rect x="8" y="3" width="14" height="1" fill="#79829a" />
      <rect x="8" y="3" width="5" height="1" fill="#a4adc4" />
      <rect x="8" y="4" width="3" height="8" fill="#79829a" />
      <rect x="8" y="4" width="1" height="6" fill="#a4adc4" />
      <rect x="8" y="4" width="1" height="3" fill="#d2d8e8" />
      <rect x="19" y="4" width="3" height="9" fill="#454d5e" />
      <rect x="21" y="5" width="1" height="8" fill="#2c3442" />
      <rect x="21" y="8" width="1" height="3" fill="#2e4a4e" />
