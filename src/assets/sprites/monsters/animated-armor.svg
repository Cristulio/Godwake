      <rect x="12" y="22" width="6" height="5" fill="#0c2818" />
      <rect x="13" y="23" width="4" height="3" fill="#1a4028" />
      <rect x="13" y="23" width="3" height="2" fill="#3a8c5a" />
      <rect x="14" y="23" width="2" height="2" fill="#78c060" />
      <rect x="14" y="23" width="1" height="1" fill="#d4f078" />
      <rect x="14" y="24" width="1" height="1" fill="#f4ffc0" />
      <!-- crack lines radiating -->
      <rect x="11" y="24" width="1" height="1" fill="#2c3442" />
      <rect x="18" y="23" width="1" height="2" fill="#2c3442" />
      <rect x="16" y="27" width="1" height="1" fill="#2c3442" />
      <!-- rivets + plate dither -->
