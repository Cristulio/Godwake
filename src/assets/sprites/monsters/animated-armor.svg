      <rect x="2" y="23" width="6" height="9" fill="#150d08" />
      <rect x="3" y="24" width="4" height="7" fill="#5e6678" />
      <rect x="3" y="24" width="1" height="7" fill="#a4adc4" />
      <rect x="6" y="24" width="1" height="7" fill="#454d5e" />
      <rect x="3" y="27" width="4" height="1" fill="#2c3442" />
      <rect x="22" y="23" width="6" height="9" fill="#150d08" />
      <rect x="23" y="24" width="4" height="7" fill="#454d5e" />
      <rect x="23" y="24" width="1" height="7" fill="#5e6678" />
      <rect x="26" y="24" width="1" height="7" fill="#2c3442" />
      <rect x="23" y="27" width="4" height="1" fill="#161b24" />

