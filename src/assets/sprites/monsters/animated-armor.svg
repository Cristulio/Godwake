      <rect x="8" y="18" width="14" height="1" fill="#79829a" />
      <rect x="8" y="18" width="4" height="13" fill="#79829a" />
      <rect x="8" y="18" width="1" height="13" fill="#a4adc4" />
      <rect x="8" y="18" width="1" height="4" fill="#d2d8e8" />
      <rect x="19" y="18" width="3" height="13" fill="#454d5e" />
      <rect x="21" y="19" width="1" height="12" fill="#2c3442" />
