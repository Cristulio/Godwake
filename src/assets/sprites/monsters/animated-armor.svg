      <rect x="9" y="7" width="12" height="3" fill="#0a0606" />
      <rect x="9" y="7" width="12" height="1" fill="#10141c" />
      <rect x="10" y="8" width="3" height="1" fill="#3a8c5a" />
      <rect x="16" y="8" width="3" height="1" fill="#3a8c5a" />
      <rect x="10" y="8" width="2" height="1" fill="#a8d042" />
      <rect x="16" y="8" width="1" height="1" fill="#78b048" />
      <rect x="10" y="8" width="1" height="1" fill="#e8ffa0" />
      <!-- breath holes on the chin guard -->
      <rect x="11" y="11" width="1" height="1" fill="#10141c" />
      <rect x="13" y="11" width="1" height="1" fill="#10141c" />
      <rect x="15" y="11" width="1" height="1" fill="#10141c" />
      <rect x="9" y="12" width="12" height="1" fill="#2c3442" />

      <!-- ── Gorget — nothing inside it ── -->
      <rect x="10" y="14" width="10" height="3" fill="#150d08" />
      <rect x="11" y="15" width="8" height="1" fill="#2c3442" />
      <rect x="11" y="16" width="8" height="1" fill="#454d5e" />
      <rect x="11" y="15" width="2" height="1" fill="#5e6678" />
