      <rect x="1" y="16" width="10" height="7" fill="#150d08" />
      <rect x="2" y="17" width="8" height="5" fill="#5e6678" />
      <rect x="2" y="17" width="8" height="1" fill="#a4adc4" />
      <rect x="2" y="17" width="3" height="1" fill="#d2d8e8" />
      <rect x="2" y="17" width="1" height="1" fill="#f2f4f8" />
      <rect x="2" y="20" width="8" height="2" fill="#454d5e" />
      <rect x="2" y="21" width="8" height="1" fill="#2c3442" />
      <!-- spike -->
      <rect x="0" y="14" width="3" height="3" fill="#150d08" />
      <rect x="1" y="15" width="1" height="1" fill="#79829a" />
      <rect x="19" y="16" width="10" height="7" fill="#150d08" />
      <rect x="20" y="17" width="8" height="5" fill="#454d5e" />
      <rect x="20" y="17" width="8" height="1" fill="#79829a" />
      <rect x="20" y="17" width="2" height="1" fill="#a4adc4" />
      <rect x="26" y="18" width="2" height="4" fill="#2c3442" />
      <rect x="27" y="19" width="1" height="3" fill="#2e4a4e" />
      <rect x="27" y="14" width="3" height="3" fill="#150d08" />
      <rect x="28" y="15" width="1" height="1" fill="#454d5e" />

