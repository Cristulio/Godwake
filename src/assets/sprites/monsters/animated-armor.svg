      <rect x="2" y="33" width="5" height="3" fill="#454d5e" />
      <rect x="2" y="33" width="5" height="1" fill="#79829a" />
      <rect x="2" y="33" width="2" height="1" fill="#a4adc4" />
      <rect x="2" y="36" width="1" height="2" fill="#150d08" />
      <rect x="4" y="36" width="1" height="2" fill="#150d08" />
      <rect x="6" y="36" width="1" height="2" fill="#150d08" />
      <rect x="22" y="32" width="7" height="5" fill="#150d08" />
      <rect x="23" y="33" width="5" height="3" fill="#2c3442" />
      <rect x="23" y="33" width="5" height="1" fill="#5e6678" />
      <rect x="23" y="36" width="1" height="2" fill="#150d08" />
      <rect x="25" y="36" width="1" height="2" fill="#150d08" />
      <rect x="27" y="36" width="1" height="2" fill="#150d08" />

      <!-- ── Faulds — skirt of lames, green glow in the gaps ── -->
      <rect x="7" y="33" width="16" height="6" fill="#150d08" />
      <rect x="8" y="34" width="14" height="4" fill="#454d5e" />
      <rect x="8" y="34" width="14" height="1" fill="#79829a" />
      <rect x="8" y="36" width="14" height="1" fill="#2c3442" />
      <rect x="8" y="34" width="3" height="4" fill="#5e6678" />
      <rect x="8" y="34" width="1" height="3" fill="#79829a" />
      <rect x="11" y="35" width="1" height="3" fill="#10141c" />
      <rect x="15" y="35" width="1" height="3" fill="#10141c" />
      <rect x="19" y="35" width="1" height="3" fill="#10141c" />
      <rect x="15" y="36" width="1" height="1" fill="#3a8c5a" opacity="0.6" />

      <!-- ── Cuisses + greaves — standing empty, slightly apart ── -->
      <rect x="7" y="39" width="7" height="9" fill="#150d08" />
      <rect x="8" y="40" width="5" height="7" fill="#5e6678" />
      <rect x="8" y="40" width="1" height="7" fill="#a4adc4" />
      <rect x="11" y="40" width="2" height="7" fill="#454d5e" />
      <rect x="8" y="43" width="5" height="1" fill="#2c3442" />
      <rect x="8" y="44" width="5" height="1" fill="#79829a" opacity="0.5" />
      <rect x="16" y="39" width="7" height="9" fill="#150d08" />
      <rect x="17" y="40" width="5" height="7" fill="#454d5e" />
      <rect x="17" y="40" width="1" height="7" fill="#5e6678" />
      <rect x="20" y="40" width="2" height="7" fill="#2c3442" />
      <rect x="17" y="43" width="5" height="1" fill="#161b24" />
      <!-- knee poleyn glints -->
      <rect x="9" y="42" width="2" height="1" fill="#d2d8e8" />
      <rect x="18" y="42" width="1" height="1" fill="#79829a" />

      <!-- ── Sabatons — pointed steel feet ── -->
      <rect x="5" y="48" width="9" height="4" fill="#150d08" />
      <rect x="6" y="49" width="7" height="2" fill="#454d5e" />
      <rect x="6" y="49" width="7" height="1" fill="#79829a" />
      <rect x="6" y="49" width="2" height="1" fill="#a4adc4" />
      <rect x="5" y="51" width="2" height="1" fill="#2c3442" />
      <rect x="16" y="48" width="9" height="4" fill="#150d08" />
      <rect x="17" y="49" width="7" height="2" fill="#2c3442" />
      <rect x="17" y="49" width="7" height="1" fill="#5e6678" />
      <rect x="23" y="51" width="2" height="1" fill="#161b24" />
    </svg>
