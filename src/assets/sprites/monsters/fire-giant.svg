<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 48 52"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Fire Giant"
    >
      <!-- Forge-heat backlight + mountain ground shadow -->
      <ellipse cx="24" cy="28" rx="23" ry="22" fill="#d4641a" opacity="0.06" />
      <ellipse cx="24" cy="50.3" rx="18" ry="2" fill="#000" opacity="0.48" />

      <!-- Head — red-iron face under a soot-black war-helm -->
      <rect x="17" y="2" width="14" height="12" fill="#150d08" />
      <rect x="18" y="3" width="12" height="10" fill="#963030" />
      <rect x="18" y="3" width="12" height="1" fill="#b24840" />
      <rect x="18" y="3" width="2" height="9" fill="#a23a38" />
      <rect x="27" y="4" width="3" height="9" fill="#7a2428" />
      <rect x="29" y="4" width="1" height="9" fill="#641c20" />
      <!-- the war-helm, horned with broken iron -->
      <rect x="16" y="1" width="16" height="4" fill="#150d08" />
      <rect x="17" y="2" width="14" height="2" fill="#2a2028" />
      <rect x="17" y="2" width="14" height="1" fill="#4a4048" />
      <rect x="17" y="2" width="5" height="1" fill="#5a5058" />
      <rect x="13" y="0" width="4" height="3" fill="#150d08" />
      <rect x="14" y="1" width="2" height="1" fill="#3a3038" />
      <rect x="31" y="0" width="4" height="3" fill="#150d08" />
      <rect x="32" y="1" width="2" height="1" fill="#2a2028" />
      <!-- furnace eyes under the brow -->
      <rect x="19" y="6" width="3" height="2" fill="#1a0c06" />
      <rect x="25" y="6" width="3" height="2" fill="#1a0c06" />
      <rect x="20" y="6" width="2" height="1" fill="#f4942a" />
      <rect x="26" y="6" width="2" height="1" fill="#f4942a" />
      <rect x="20" y="6" width="1" height="1" fill="#ffd070" />
      <rect x="26" y="6" width="1" height="1" fill="#ffd070" />
      <!-- the heavy jaw, beard of soot-braids -->
      <rect x="19" y="9" width="9" height="2" fill="#7a2428" />
      <rect x="18" y="11" width="11" height="3" fill="#150d08" />
      <rect x="19" y="11" width="9" height="2" fill="#241c22" />
      <rect x="19" y="11" width="4" height="1" fill="#332a31" />
      <rect x="20" y="13" width="2" height="2" fill="#241c22" />
      <rect x="24" y="13" width="2" height="3" fill="#1c161c" />
      <!-- gold beard-rings -->
      <rect x="21" y="13" width="1" height="1" fill="#c89a48" />
      <rect x="25" y="14" width="1" height="1" fill="#ecc46a" />

      <!-- Pauldrons — scorched plate slabs -->
      <rect x="5" y="12" width="16" height="10" fill="#150d08" />
      <rect x="6" y="13" width="14" height="8" fill="#3a3038" />
      <rect x="6" y="13" width="14" height="1" fill="#5a5058" />
      <rect x="6" y="13" width="5" height="1" fill="#6e6470" />
      <rect x="6" y="13" width="2" height="7" fill="#4a4048" />
      <rect x="17" y="14" width="3" height="7" fill="#2a2028" />
      <!-- plate rivets -->
      <rect x="8" y="15" width="1" height="1" fill="#7a7078" />
      <rect x="12" y="15" width="1" height="1" fill="#7a7078" />
      <rect x="16" y="15" width="1" height="1" fill="#6e6470" />
      <!-- heat-stress glow at the plate edge -->
      <rect x="6" y="19" width="9" height="1" fill="#6a1c0a" />
      <rect x="8" y="19" width="3" height="1" fill="#a83a14" />
      <rect x="27" y="12" width="16" height="10" fill="#150d08" />
      <rect x="28" y="13" width="14" height="8" fill="#2e262c" />
      <rect x="28" y="13" width="14" height="1" fill="#3e3844" />
      <rect x="37" y="14" width="5" height="7" fill="#241c22" />
      <rect x="41" y="14" width="1" height="7" fill="#1f181d" />
      <rect x="30" y="15" width="1" height="1" fill="#5a5058" />
      <rect x="35" y="15" width="1" height="1" fill="#4a4048" />
      <rect x="29" y="19" width="10" height="1" fill="#6a1c0a" opacity="0.8" />

      <!-- Torso — breastplate over red-iron bulk -->
      <rect x="12" y="14" width="24" height="22" fill="#150d08" />
      <rect x="13" y="15" width="22" height="20" fill="#3a3038" />
      <rect x="13" y="15" width="22" height="1" fill="#4a4048" />
      <rect x="13" y="15" width="8" height="1" fill="#5a5058" />
      <rect x="13" y="15" width="3" height="20" fill="#42383f" />
      <rect x="13" y="15" width="1" height="13" fill="#544a52" />
      <rect x="32" y="15" width="3" height="20" fill="#2a2028" />
      <rect x="34" y="15" width="1" height="20" fill="#241c26" />
      <!-- the great furnace-sigil etched across the chest -->
      <rect x="20" y="18" width="8" height="8" fill="#2a2028" />
      <rect x="21" y="19" width="6" height="6" fill="#6a1c0a" />
      <rect x="22" y="20" width="4" height="3" fill="#a83a14" />
      <rect x="23" y="20" width="2" height="2" fill="#e87820" />
      <rect x="23" y="20" width="1" height="1" fill="#ffd070" />
      <!-- plate join lines -->
      <rect x="14" y="27" width="20" height="1" fill="#2a2028" />
      <rect x="14" y="31" width="20" height="1" fill="#2a2028" />
      <!-- red-iron arms showing at the plate gaps -->
      <rect x="14" y="22" width="4" height="4" fill="#7a2428" />
      <rect x="14" y="22" width="4" height="1" fill="#963030" />
      <rect x="14" y="22" width="1" height="3" fill="#963030" />
      <rect x="30" y="23" width="4" height="3" fill="#641c20" />
      <rect x="30" y="23" width="4" height="1" fill="#7a2428" />

      <!-- Sword arm — the heat-drinking greatsword, point down -->
      <rect x="36" y="15" width="8" height="14" fill="#150d08" />
      <rect x="37" y="16" width="6" height="12" fill="#7a2428" />
      <rect x="37" y="16" width="6" height="1" fill="#963030" />
      <rect x="41" y="17" width="2" height="11" fill="#641c20" />
      <!-- iron bracer -->
      <rect x="36" y="24" width="8" height="3" fill="#150d08" />
      <rect x="37" y="25" width="6" height="1" fill="#3a3038" />
      <rect x="37" y="25" width="2" height="1" fill="#4a4048" />
      <!-- the fist on the great hilt -->
      <rect x="37" y="28" width="8" height="5" fill="#150d08" />
      <rect x="38" y="29" width="6" height="3" fill="#963030" />
      <rect x="38" y="29" width="6" height="1" fill="#b24840" />
      <rect x="42" y="30" width="2" height="2" fill="#7a2428" />
      <!-- crossguard -->
      <rect x="36" y="33" width="10" height="2" fill="#150d08" />
      <rect x="37" y="33" width="8" height="1" fill="#3a3038" />
      <rect x="37" y="33" width="3" height="1" fill="#5a5058" />
      <!-- the blade — black iron drinking the light, heat at the fuller -->
      <rect x="39" y="35" width="4" height="15" fill="#150d08" />
      <rect x="40" y="35" width="2" height="14" fill="#2e262c" />
      <rect x="40" y="35" width="1" height="14" fill="#3e3844" />
      <!-- the fuller, holding heat -->
      <rect x="41" y="36" width="1" height="11" fill="#6a1c0a" />
      <rect x="41" y="38" width="1" height="4" fill="#a83a14" />
      <rect x="41" y="39" width="1" height="2" fill="#e87820" />
      <!-- point biting the ground -->
      <rect x="40" y="49" width="2" height="2" fill="#150d08" />
      <rect x="40" y="49" width="1" height="1" fill="#2e262c" />

      <!-- Off arm — the boulder hand, flame licking it -->
      <rect x="4" y="15" width="8" height="13" fill="#150d08" />
      <rect x="5" y="16" width="6" height="11" fill="#963030" />
      <rect x="5" y="16" width="6" height="1" fill="#b24840" />
      <rect x="5" y="16" width="2" height="10" fill="#a23a38" />
      <rect x="5" y="16" width="1" height="6" fill="#b24840" />
      <rect x="9" y="17" width="2" height="10" fill="#7a2428" />
      <!-- iron bracer -->
      <rect x="4" y="23" width="8" height="3" fill="#150d08" />
      <rect x="5" y="24" width="6" height="1" fill="#3a3038" />
      <rect x="5" y="24" width="3" height="1" fill="#5a5058" />
      <!-- the hand palming a flame-wreathed rock -->
      <rect x="2" y="27" width="10" height="9" fill="#150d08" />
      <rect x="3" y="28" width="8" height="7" fill="#4a4048" />
      <rect x="3" y="28" width="8" height="1" fill="#5e5460" />
      <rect x="3" y="28" width="2" height="6" fill="#544a52" />
      <rect x="9" y="29" width="2" height="6" fill="#3a3038" />
      <!-- rock cracks, fire inside -->
      <rect x="5" y="30" width="3" height="1" fill="#a83a14" />
      <rect x="6" y="30" width="1" height="1" fill="#f4942a" />
      <rect x="7" y="32" width="2" height="1" fill="#6a1c0a" />
      <rect x="4" y="33" width="2" height="1" fill="#a83a14" opacity="0.8" />
      <!-- flame wisps off the rock -->
      <rect x="3" y="26" width="2" height="2" fill="#d4641a" />
      <rect x="3" y="26" width="1" height="1" fill="#ffd070" />
      <rect x="8" y="26" width="2" height="1" fill="#e87820" />
      <rect x="11" y="27" width="1" height="1" fill="#f4942a" opacity="0.7" />
      <!-- giant fingers over the rock -->
      <rect x="3" y="31" width="9" height="2" fill="#150d08" />
      <rect x="4" y="31" width="7" height="1" fill="#963030" />
      <rect x="4" y="31" width="3" height="1" fill="#a23a38" />

      <!-- War-skirt of riveted iron strips -->
      <rect x="13" y="35" width="22" height="6" fill="#150d08" />
      <rect x="14" y="36" width="20" height="4" fill="#2e262c" />
      <rect x="14" y="36" width="20" height="1" fill="#3e3844" />
      <rect x="14" y="36" width="6" height="3" fill="#332a31" />
      <rect x="29" y="37" width="5" height="3" fill="#241c22" />
      <rect x="18" y="36" width="1" height="5" fill="#150d08" />
      <rect x="23" y="36" width="1" height="5" fill="#150d08" />
      <rect x="28" y="36" width="1" height="5" fill="#150d08" />
      <!-- strip rivets -->
      <rect x="16" y="38" width="1" height="1" fill="#5a5058" />
      <rect x="21" y="38" width="1" height="1" fill="#5a5058" />
      <rect x="26" y="38" width="1" height="1" fill="#4a4048" />
      <rect x="31" y="38" width="1" height="1" fill="#4a4048" />

      <!-- Legs — tree-trunk greaves -->
      <rect x="14" y="40" width="9" height="8" fill="#150d08" />
      <rect x="15" y="41" width="7" height="6" fill="#3a3038" />
      <rect x="15" y="41" width="2" height="6" fill="#4a4048" />
      <rect x="20" y="41" width="2" height="6" fill="#2a2028" />
      <rect x="25" y="40" width="9" height="8" fill="#150d08" />
      <rect x="26" y="41" width="7" height="6" fill="#2e262c" />
      <rect x="26" y="41" width="1" height="6" fill="#3a3038" />
      <rect x="31" y="41" width="2" height="6" fill="#241c22" />
      <!-- heat-vent at the lead greave -->
      <rect x="17" y="42" width="1" height="3" fill="#6a1c0a" />
      <rect x="17" y="43" width="1" height="1" fill="#d4641a" />
      <!-- iron-shod feet -->
      <rect x="12" y="47" width="11" height="4" fill="#150d08" />
      <rect x="13" y="48" width="9" height="2" fill="#2a2028" />
      <rect x="13" y="48" width="4" height="1" fill="#3a3038" />
      <rect x="24" y="47" width="11" height="4" fill="#150d08" />
      <rect x="25" y="48" width="9" height="2" fill="#241c22" />
      <rect x="25" y="48" width="3" height="1" fill="#2a2028" />

      <!-- Forge-sparks in its wake -->
      <rect x="9" y="9" width="1" height="1" fill="#f4942a" opacity="0.55" />
      <rect x="38" y="9" width="1" height="1" fill="#d4641a" opacity="0.5" />
      <rect x="45" y="22" width="1" height="1" fill="#f4942a" opacity="0.45" />
      <rect x="2" y="40" width="1" height="1" fill="#d4641a" opacity="0.45" />
      <rect x="45" y="42" width="1" height="1" fill="#a83a14" opacity="0.5" />
    </svg>
