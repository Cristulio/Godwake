      <rect x="10" y="20" width="6" height="38" fill="#160c07" />
      <rect x="11" y="22" width="4" height="34" fill="#1e1009" />
      <rect x="32" y="20" width="7" height="38" fill="#120a06" />
      <rect x="33" y="22" width="5" height="34" fill="#1a0e08" />
      <rect x="12" y="54" width="3" height="3" fill="#0c0604" />
      <rect x="34" y="52" width="3" height="4" fill="#0c0604" />

