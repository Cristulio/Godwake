<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 34 46"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Dravok, the Ashen Marshal"
    >
      <!-- Ember backlight + ground shadow -->
      <ellipse cx="17" cy="24" rx="15" ry="20" fill="#5a2a0e" opacity="0.32" />
      <ellipse cx="17" cy="24" rx="11" ry="16" fill="#e87820" opacity="0.08" />
      <ellipse cx="17" cy="44" rx="12" ry="2" fill="#000" opacity="0.42" />
      <rect x="2" y="6" width="1" height="2" fill="#e87820" opacity="0.5" />
      <rect x="30" y="10" width="1" height="2" fill="#f4942a" opacity="0.5" />
      <rect x="5" y="2" width="1" height="2" fill="#d4641a" opacity="0.45" />

      <!-- Cloak wings — charred ramp -->
      <polygon points="9,40 8,16 13,12 13,40" fill="#1e1009" />
      <polygon points="9,40 8,16 13,12 11,40" fill="#2a1610" />
      <polygon points="25,40 26,16 21,12 21,40" fill="#160c07" />
      <polygon points="9,16 13,12 13,15 9,19" fill="#3a2418" opacity="0.6" />

      <!-- Helm — iron ramp -->
      <rect x="11" y="3" width="12" height="9" fill="#33291f" />
      <rect x="11" y="3" width="12" height="1" fill="#5a4636" />
      <rect x="11" y="3" width="2" height="9" fill="#4a4038" />
      <rect x="11" y="3" width="1" height="8" fill="#5a5048" />
      <rect x="21" y="4" width="2" height="8" fill="#241c14" />
      <!-- Horns -->
      <rect x="12" y="0" width="2" height="3" fill="#a83a14" />
      <rect x="12" y="0" width="1" height="3" fill="#d4641a" />
      <rect x="16" y="-1" width="2" height="4" fill="#d4641a" />
      <rect x="16" y="-1" width="1" height="2" fill="#ffd070" />
      <rect x="20" y="0" width="2" height="3" fill="#8a2e10" />
      <!-- Visor + fire eyes -->
      <rect x="12" y="8" width="10" height="2" fill="#0e0a08" />
      <rect x="13" y="8" width="2" height="2" fill="#ff8a1a" />
      <rect x="19" y="8" width="2" height="2" fill="#ff8a1a" />
      <rect x="13" y="8" width="1" height="1" fill="#ffe090" />
      <rect x="19" y="8" width="1" height="1" fill="#ffe090" />
      <rect x="16" y="10" width="2" height="2" fill="#a83a14" />

      <!-- Cuirass — ash ramp + ember cracks -->
      <rect x="9" y="12" width="16" height="18" fill="#2e241b" />
      <rect x="9" y="12" width="16" height="2" fill="#4a3a2a" />
      <rect x="9" y="12" width="16" height="1" fill="#5a4636" />
      <rect x="9" y="12" width="2" height="17" fill="#3a302a" />
      <rect x="9" y="12" width="1" height="16" fill="#4a4038" />
      <rect x="23" y="13" width="2" height="16" fill="#1e1812" />
      <rect x="15" y="14" width="4" height="16" fill="#241c14" />
      <!-- Pauldron stud + ember seams -->
      <rect x="11" y="15" width="2" height="3" fill="#c0a040" />
      <rect x="11" y="15" width="2" height="1" fill="#f4d042" />
      <rect x="11" y="19" width="3" height="1" fill="#a83a14" opacity="0.7" />
      <rect x="10" y="22" width="14" height="1" fill="#d4641a" opacity="0.55" />
      <rect x="12" y="26" width="10" height="1" fill="#e87820" opacity="0.45" />
      <rect x="13" y="18" width="1" height="1" fill="#ff8a1a" opacity="0.7" />
      <rect x="20" y="24" width="1" height="1" fill="#5a4636" />

      <!-- Left arm -->
      <rect x="3" y="14" width="6" height="5" fill="#33291f" />
      <rect x="3" y="14" width="6" height="1" fill="#5a4636" />
      <rect x="3" y="14" width="1" height="5" fill="#4a4038" />
      <rect x="2" y="19" width="4" height="9" fill="#2e241b" />
      <rect x="2" y="19" width="1" height="9" fill="#3a302a" />
      <rect x="2" y="26" width="5" height="3" fill="#1e1812" />
      <rect x="3" y="22" width="1" height="5" fill="#d4641a" opacity="0.5" />

      <!-- Right arm + burning brand -->
      <rect x="25" y="14" width="6" height="5" fill="#241c14" />
      <rect x="25" y="14" width="6" height="1" fill="#4a3a2a" />
      <rect x="27" y="6" width="3" height="13" fill="#3a302a" />
      <rect x="27" y="6" width="1" height="13" fill="#4a4038" />
      <!-- Blade-fire ramp -->
      <rect x="27" y="6" width="3" height="9" fill="#d4641a" />
      <rect x="27" y="6" width="2" height="6" fill="#f4942a" />
      <rect x="27" y="6" width="1" height="4" fill="#ffe090" />
      <polygon points="27,4 28,1 30,5" fill="#ffd070" />
      <polygon points="27,4 28,2 29,5" fill="#fff4c0" opacity="0.7" />
      <rect x="26" y="18" width="5" height="2" fill="#2e241b" />

      <!-- Legs — charred ramp + ember -->
      <rect x="9" y="30" width="16" height="2" fill="#3a2e22" />
      <rect x="9" y="30" width="16" height="1" fill="#4a3a2a" />
      <rect x="10" y="30" width="6" height="13" fill="#2a2118" />
      <rect x="18" y="30" width="6" height="13" fill="#241c14" />
      <rect x="10" y="30" width="1" height="13" fill="#3a302a" />
      <rect x="12" y="33" width="1" height="6" fill="#d4641a" opacity="0.5" />
      <rect x="20" y="33" width="1" height="6" fill="#d4641a" opacity="0.5" />
      <rect x="10" y="41" width="7" height="3" fill="#0e0a08" />
      <rect x="18" y="41" width="7" height="3" fill="#0a0705" />

      <!-- Rising embers -->
      <rect x="6" y="34" width="1" height="1" fill="#f4942a" opacity="0.6" />
      <rect x="28" y="24" width="1" height="1" fill="#e87820" opacity="0.6" />
      <rect x="17" y="44" width="1" height="1" fill="#ffd070" opacity="0.5" />
    </svg>
