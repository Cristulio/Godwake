      <rect x="15" y="5" width="18" height="14" fill="#150d08" />
      <rect x="16" y="6" width="16" height="12" fill="#33291f" />
      <rect x="16" y="6" width="6" height="12" fill="#42362a" />
      <rect x="16" y="6" width="2" height="10" fill="#564840" />
      <rect x="29" y="6" width="3" height="12" fill="#241c14" />
