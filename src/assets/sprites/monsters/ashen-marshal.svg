      <rect x="3" y="37" width="6" height="5" fill="#3a302a" />
      <rect x="3" y="37" width="6" height="2" fill="#4a4038" />
      <rect x="3" y="37" width="2" height="1" fill="#5e5448" />
      <rect x="4" y="39" width="1" height="1" fill="#241c14" />
