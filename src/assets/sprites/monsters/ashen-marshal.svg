      <rect x="13" y="45" width="22" height="2" fill="#241c14" />
      <rect x="13" y="45" width="8" height="1" fill="#3a302a" />
      <!-- left leg -->
      <rect x="12" y="48" width="10" height="12" fill="#150d08" />
      <rect x="13" y="49" width="8" height="11" fill="#2a2118" />
      <rect x="13" y="49" width="3" height="11" fill="#3a302a" />
      <rect x="13" y="49" width="1" height="8" fill="#4a4038" />
      <rect x="19" y="49" width="2" height="11" fill="#1e1812" />
      <!-- knee plate + ember seam -->
      <rect x="14" y="51" width="5" height="2" fill="#42362a" />
      <rect x="14" y="51" width="2" height="1" fill="#564840" />
      <rect x="15" y="54" width="1" height="4" fill="#d4641a" opacity="0.6" />
      <!-- right leg -->
      <rect x="26" y="48" width="10" height="12" fill="#150d08" />
      <rect x="27" y="49" width="8" height="11" fill="#241c14" />
      <rect x="27" y="49" width="2" height="11" fill="#2e241b" />
      <rect x="33" y="49" width="2" height="11" fill="#1a140e" />
      <rect x="28" y="51" width="5" height="2" fill="#33291f" />
      <rect x="31" y="54" width="1" height="4" fill="#a83a14" opacity="0.6" />

      <!-- ══ Iron boots ══ -->
      <rect x="10" y="59" width="13" height="6" fill="#150d08" />
      <rect x="11" y="60" width="11" height="4" fill="#241c14" />
      <rect x="11" y="60" width="11" height="1" fill="#3a302a" />
      <rect x="11" y="60" width="4" height="1" fill="#4a4038" />
      <rect x="11" y="63" width="11" height="1" fill="#0e0a08" />
      <rect x="25" y="59" width="13" height="6" fill="#150d08" />
      <rect x="26" y="60" width="11" height="4" fill="#1e1812" />
      <rect x="26" y="60" width="11" height="1" fill="#2e241b" />
      <rect x="26" y="63" width="11" height="1" fill="#0a0705" />

      <!-- ══ Rising embers ══ -->
      <rect x="8" y="14" width="1" height="1" fill="#e87820" opacity="0.6" />
      <rect x="38" y="12" width="1" height="2" fill="#f4942a" opacity="0.55" />
      <rect x="44" y="40" width="1" height="1" fill="#d4641a" opacity="0.6" />
      <rect x="6" y="50" width="1" height="1" fill="#f4942a" opacity="0.5" />
      <rect x="36" y="46" width="1" height="1" fill="#ffd070" opacity="0.5" />
      <rect x="24" y="21" width="1" height="1" fill="#ff8a1a" opacity="0.6" />
    </svg>
