      <rect x="24" y="32" width="4" height="1" fill="#d4641a" />
      <rect x="26" y="31" width="1" height="1" fill="#ffd070" />
      <rect x="17" y="37" width="5" height="1" fill="#a83a14" opacity="0.85" />
