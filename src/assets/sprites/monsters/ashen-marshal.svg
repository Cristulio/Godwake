      <rect x="5" y="33" width="2" height="3" fill="#2a1610" />
      <rect x="8" y="33" width="2" height="2" fill="#1e1009" />
      <rect x="5" y="36" width="1" height="2" fill="#a83a14" />
      <rect x="6" y="35" width="1" height="1" fill="#d4641a" />
      <rect x="8" y="35" width="1" height="2" fill="#e87820" />
      <rect x="9" y="34" width="1" height="1" fill="#ffd070" />
      <rect x="7" y="38" width="1" height="1" fill="#f4942a" opacity="0.8" />

