      <rect x="13" y="25" width="22" height="18" fill="#2e241b" />
      <rect x="13" y="25" width="8" height="18" fill="#3a302a" />
      <rect x="13" y="25" width="3" height="15" fill="#4a4038" />
      <rect x="13" y="25" width="1" height="10" fill="#5a5048" />
      <rect x="31" y="25" width="4" height="18" fill="#241c14" />
