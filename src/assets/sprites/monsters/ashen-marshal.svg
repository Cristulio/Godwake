      <rect x="41" y="14" width="3" height="6" fill="#d4641a" />
      <rect x="41" y="9" width="3" height="5" fill="#e87820" />
      <rect x="42" y="9" width="1" height="11" fill="#f4942a" />
      <rect x="42" y="6" width="1" height="3" fill="#ffd070" />
