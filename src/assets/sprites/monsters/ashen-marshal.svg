      <rect x="3" y="8" width="3" height="40" fill="#150d08" />
      <rect x="4" y="9" width="1" height="38" fill="#3c322a" />
      <rect x="2" y="8" width="9" height="3" fill="#150d08" />
      <rect x="3" y="9" width="7" height="1" fill="#3a302a" />
      <rect x="3" y="9" width="3" height="1" fill="#5a5048" />
