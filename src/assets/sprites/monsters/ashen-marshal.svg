      <rect x="9" y="18" width="11" height="8" fill="#150d08" />
      <rect x="10" y="19" width="9" height="6" fill="#3a302a" />
      <rect x="10" y="19" width="9" height="2" fill="#564840" />
      <rect x="10" y="19" width="3" height="1" fill="#6e6054" />
      <rect x="10" y="23" width="9" height="2" fill="#2a2118" />
      <rect x="28" y="18" width="11" height="8" fill="#150d08" />
      <rect x="29" y="19" width="9" height="6" fill="#2a2118" />
      <rect x="29" y="19" width="9" height="1" fill="#42362a" />
