      <rect x="16" y="2" width="1" height="1" fill="#d4641a" />
      <rect x="22" y="0" width="4" height="6" fill="#150d08" />
      <rect x="23" y="0" width="2" height="5" fill="#d4641a" />
      <rect x="23" y="0" width="1" height="3" fill="#ffd070" />
      <rect x="30" y="1" width="3" height="5" fill="#150d08" />
      <rect x="31" y="2" width="1" height="3" fill="#8a2e10" />
