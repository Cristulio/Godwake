<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 28 42"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Warden of the Pools"
    >
      <!-- Arcane backlight + ground shadow -->
      <ellipse cx="14" cy="22" rx="12" ry="18" fill="#46306a" opacity="0.12" />
      <ellipse cx="14" cy="40" rx="9" ry="1.6" fill="#000" opacity="0.42" />

      <!-- Robe body — violet ramp, key upper-left + gilt sash -->
      <polygon points="6,14 22,14 25,40 3,40" fill="#241222" />
      <polygon points="6,14 22,14 23,30 5,30" fill="#361a2e" />
      <polygon points="6,14 14,40 14,14" fill="#1e0e1a" opacity="0.4" />
      <polygon points="6,14 9,14 7,40 3,40" fill="#46306a" opacity="0.35" />
      <rect x="13" y="16" width="2" height="24" fill="#5a1208" opacity="0.5" />
      <rect x="6" y="22" width="16" height="1" fill="#c0a040" opacity="0.6" />
      <rect x="6" y="23" width="16" height="1" fill="#9a7e2e" opacity="0.45" />
      <rect x="10" y="22" width="1" height="1" fill="#f4d042" />
      <!-- Dither -->
      <rect x="9" y="28" width="1" height="1" fill="#46306a" />
      <rect x="18" y="32" width="1" height="1" fill="#1e0e1a" />

      <!-- Hood / head — dark hollow + gold eyes -->
      <polygon points="8,4 20,4 21,15 7,15" fill="#1e0e1a" />
      <polygon points="8,4 12,4 9,15 7,15" fill="#2a1424" />
      <ellipse cx="14" cy="9" rx="4" ry="5" fill="#0a0408" />
      <rect x="11" y="8" width="2" height="2" fill="#c0a040" />
      <rect x="15" y="8" width="2" height="2" fill="#c0a040" />
      <rect x="11" y="8" width="1" height="1" fill="#f4d042" />
      <rect x="15" y="8" width="1" height="1" fill="#f4d042" />
      <!-- Crown + gem -->
      <polygon points="8,4 14,0 20,4" fill="#46306a" />
      <polygon points="8,4 14,0 14,4" fill="#5a3a6e" />
      <rect x="13" y="-1" width="2" height="3" fill="#c0a040" />
      <polygon points="12,-1 14,-3 16,-1" fill="#f4d042" />
      <rect x="13" y="-1" width="1" height="1" fill="#fff0c0" />

      <!-- Right arm + crowned staff -->
      <rect x="22" y="18" width="2" height="2" fill="#361a2e" />
      <rect x="24" y="3" width="2" height="30" fill="#3a2418" />
      <rect x="24" y="3" width="1" height="30" fill="#5a4030" />
      <!-- Staff orb — red ramp + spark -->
      <rect x="23" y="2" width="4" height="4" fill="#5a1208" />
      <rect x="23" y="2" width="4" height="1" fill="#8c2010" />
      <rect x="24" y="3" width="2" height="2" fill="#b53c4a" />
      <rect x="24" y="3" width="1" height="1" fill="#e8705a" />
      <rect x="22" y="0" width="1" height="1" fill="#f4d042" opacity="0.6" />

      <!-- Left arm -->
      <rect x="4" y="18" width="2" height="2" fill="#361a2e" />
      <rect x="2" y="20" width="2" height="9" fill="#241222" />
      <rect x="2" y="20" width="1" height="9" fill="#361a2e" />

      <!-- Hem feet -->
      <rect x="6" y="38" width="6" height="3" fill="#160a14" />
      <rect x="16" y="38" width="6" height="3" fill="#100610" />
      <rect x="6" y="38" width="6" height="1" fill="#241222" />
    </svg>
