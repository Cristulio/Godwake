<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 34 46"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Warden of the Pools"
    >
      <!-- Pool-light backlight + ground shadow -->
      <ellipse cx="16" cy="25" rx="15" ry="18" fill="#a82a20" opacity="0.06" />
      <ellipse cx="16" cy="44.4" rx="11" ry="1.7" fill="#000" opacity="0.42" />

      <!-- The warden's mitre — bone-white, blood-run from the office -->
      <rect x="10" y="0" width="11" height="5" fill="#150d08" />
      <rect x="11" y="1" width="9" height="3" fill="#cdc0b0" />
      <rect x="11" y="1" width="9" height="1" fill="#e2d8c8" />
      <rect x="11" y="1" width="4" height="1" fill="#f0e8da" />
      <rect x="18" y="2" width="2" height="2" fill="#a89884" />
      <!-- the run from the last sluicing -->
      <rect x="13" y="1" width="1" height="3" fill="#7a1a10" />
      <rect x="16" y="2" width="1" height="2" fill="#a82a20" />
      <!-- gold band of the office -->
      <rect x="11" y="4" width="9" height="1" fill="#9a7232" />
      <rect x="11" y="4" width="3" height="1" fill="#c89a48" />

      <!-- Head — a face kept carefully clean, which is worse -->
      <rect x="10" y="5" width="11" height="9" fill="#150d08" />
      <rect x="11" y="6" width="9" height="7" fill="#cdc0b0" />
      <rect x="11" y="6" width="9" height="1" fill="#e2d8c8" />
      <rect x="11" y="6" width="1" height="5" fill="#dcd2c2" />
      <rect x="18" y="7" width="2" height="6" fill="#a89884" />
      <rect x="19" y="8" width="1" height="5" fill="#8a7c68" />
      <!-- eyes — administrative, unmoved -->
      <rect x="12" y="8" width="2" height="2" fill="#1a0e12" />
      <rect x="16" y="8" width="2" height="2" fill="#1a0e12" />
      <rect x="12" y="8" width="1" height="1" fill="#d84838" />
      <rect x="16" y="8" width="1" height="1" fill="#d84838" />
      <!-- the thin mouth of upkeep -->
      <rect x="13" y="11" width="4" height="1" fill="#8a7c68" />

      <!-- Vestments — bone robes, blood-soaked from the hem up -->
      <rect x="8" y="14" width="16" height="16" fill="#150d08" />
      <rect x="9" y="15" width="14" height="14" fill="#b4a692" />
      <rect x="9" y="15" width="14" height="1" fill="#cdc0b0" />
      <rect x="9" y="15" width="5" height="1" fill="#dcd2c2" />
      <rect x="9" y="15" width="2" height="14" fill="#bcae9a" />
      <rect x="9" y="15" width="1" height="9" fill="#cdc0b0" />
      <rect x="19" y="15" width="3" height="14" fill="#94866e" />
      <rect x="21" y="15" width="1" height="14" fill="#7a6e5a" />
      <!-- the gold pool-sigil on the breast -->
      <rect x="13" y="17" width="5" height="4" fill="#150d08" />
      <rect x="14" y="18" width="3" height="2" fill="#9a7232" />
      <rect x="14" y="18" width="2" height="1" fill="#c89a48" />
      <rect x="15" y="18" width="1" height="1" fill="#ecc46a" />
      <!-- the soak climbing from the hem -->
      <rect x="9" y="25" width="14" height="4" fill="#7a1a10" />
      <rect x="9" y="25" width="14" height="1" fill="#8c2014" />
      <rect x="9" y="25" width="4" height="1" fill="#a82a20" />
      <rect x="19" y="25" width="3" height="4" fill="#5e120c" />
      <!-- the soak's irregular tide-line -->
      <rect x="10" y="24" width="2" height="1" fill="#7a1a10" />
      <rect x="14" y="23" width="3" height="2" fill="#7a1a10" />
      <rect x="19" y="24" width="2" height="1" fill="#5e120c" />
      <!-- spatter above the line -->
      <rect x="11" y="20" width="1" height="1" fill="#a82a20" opacity="0.8" />
      <rect x="17" y="22" width="1" height="1" fill="#7a1a10" opacity="0.8" />

      <!-- Gavel arm — the heavy maul of office, raised -->
      <rect x="22" y="15" width="6" height="4" fill="#150d08" />
      <rect x="23" y="16" width="4" height="2" fill="#b4a692" />
      <rect x="23" y="16" width="4" height="1" fill="#cdc0b0" />
      <rect x="26" y="12" width="4" height="5" fill="#150d08" />
      <rect x="27" y="13" width="2" height="3" fill="#a89884" />
      <rect x="27" y="13" width="1" height="1" fill="#cdc0b0" />
      <!-- the haft -->
      <rect x="27" y="4" width="3" height="10" fill="#150d08" />
      <rect x="28" y="5" width="1" height="8" fill="#6a3a1a" />
      <rect x="28" y="5" width="1" height="4" fill="#8c5226" />
      <!-- the gavel head — blood-bronzed, dented from use -->
      <rect x="24" y="0" width="9" height="6" fill="#150d08" />
      <rect x="25" y="1" width="7" height="4" fill="#8a5a28" />
      <rect x="25" y="1" width="7" height="1" fill="#a87434" />
      <rect x="25" y="1" width="3" height="1" fill="#c89a48" />
      <rect x="30" y="2" width="2" height="3" fill="#6e4620" />
      <!-- the working face, stained -->
      <rect x="32" y="1" width="2" height="5" fill="#150d08" />
      <rect x="32" y="2" width="1" height="3" fill="#7a1a10" />
      <rect x="24" y="1" width="1" height="4" fill="#5e120c" />

      <!-- Sluice arm — the bowl of fresh essence, mid-pour -->
      <rect x="3" y="16" width="6" height="4" fill="#150d08" />
      <rect x="4" y="17" width="4" height="2" fill="#b4a692" />
      <rect x="4" y="17" width="4" height="1" fill="#cdc0b0" />
      <rect x="1" y="19" width="5" height="4" fill="#150d08" />
      <rect x="2" y="20" width="3" height="2" fill="#a89884" />
      <!-- the bowl -->
      <rect x="0" y="23" width="8" height="5" fill="#150d08" />
      <rect x="1" y="24" width="6" height="3" fill="#8a5a28" />
      <rect x="1" y="24" width="6" height="1" fill="#a87434" />
      <rect x="1" y="24" width="2" height="1" fill="#c89a48" />
      <rect x="5" y="25" width="2" height="2" fill="#6e4620" />
      <!-- essence brimming + the pour -->
      <rect x="2" y="24" width="4" height="1" fill="#a82a20" />
      <rect x="3" y="24" width="2" height="1" fill="#d84838" />
      <rect x="1" y="28" width="2" height="2" fill="#7a1a10" />
      <rect x="1" y="30" width="1" height="2" fill="#a82a20" opacity="0.8" />
      <rect x="2" y="32" width="1" height="2" fill="#7a1a10" opacity="0.6" />

      <!-- Skirts to the floor, heaviest where they drink the pools -->
      <rect x="8" y="29" width="16" height="13" fill="#150d08" />
      <rect x="9" y="30" width="14" height="11" fill="#6e160e" />
      <rect x="9" y="30" width="14" height="1" fill="#7a1a10" />
      <rect x="9" y="30" width="3" height="11" fill="#76180f" />
      <rect x="19" y="30" width="3" height="11" fill="#52100a" />
      <rect x="21" y="30" width="1" height="11" fill="#440d08" />
      <!-- fold lines -->
      <rect x="13" y="31" width="1" height="9" fill="#52100a" />
      <rect x="17" y="31" width="1" height="9" fill="#52100a" />
      <!-- gold hem thread surviving the soak -->
      <rect x="9" y="39" width="14" height="1" fill="#9a7232" opacity="0.85" />
      <rect x="10" y="39" width="3" height="1" fill="#c89a48" />
      <!-- the wet hem meeting its own pool -->
      <rect x="9" y="41" width="14" height="1" fill="#2e0c12" />
      <rect x="7" y="42" width="18" height="2" fill="#150d08" />
      <rect x="8" y="43" width="16" height="1" fill="#2e0c12" />
      <rect x="8" y="42" width="5" height="1" fill="#481018" />

      <!-- The pools' light catching motes -->
      <rect x="26" y="24" width="1" height="1" fill="#d84838" opacity="0.5" />
      <rect x="5" y="11" width="1" height="1" fill="#a82a20" opacity="0.45" />
      <rect x="28" y="33" width="1" height="1" fill="#a82a20" opacity="0.5" />
    </svg>
