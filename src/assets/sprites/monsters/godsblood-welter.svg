<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 28 24"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Godsblood Welter"
    >
      <!-- base shadow -->
      <ellipse cx="14" cy="22" rx="13" ry="2" fill="#3a2a18" />

      <!-- welling luminous mass -->
      <ellipse cx="14" cy="16" rx="12" ry="7" fill="#b88838" />
      <ellipse cx="14" cy="14" rx="10" ry="6" fill="#d4a850" />
      <ellipse cx="12" cy="13" rx="6" ry="4" fill="#f0c870" />
      <ellipse cx="11" cy="12" rx="3" ry="2" fill="#fff0c0" opacity="0.8" />

      <!-- inner glow / divinity -->
      <circle cx="13" cy="14" r="2" fill="#fff8e0" opacity="0.7" />

      <!-- dripping edges -->
      <rect x="5" y="19" width="2" height="3" fill="#b88838" />
      <rect x="10" y="20" width="2" height="3" fill="#d4a850" />
      <rect x="18" y="20" width="2" height="3" fill="#d4a850" />
      <rect x="22" y="19" width="2" height="2" fill="#b88838" />

      <!-- rising dissolving pseudopod -->
      <rect x="20" y="4" width="3" height="10" fill="#d4a850" />
      <rect x="20" y="3" width="4" height="3" fill="#f0c870" />
      <rect x="21" y="1" width="2" height="2" fill="#fff0c0" opacity="0.85" />
      <!-- a second forming limb -->
      <rect x="5" y="9" width="2" height="6" fill="#c89840" />
      <rect x="4" y="8" width="3" height="2" fill="#e0b860" />

      <!-- scattered bright motes -->
      <rect x="8" y="15" width="1" height="1" fill="#fff8e0" />
      <rect x="17" y="13" width="1" height="1" fill="#fff8e0" />
      <rect x="15" y="17" width="1" height="1" fill="#fff8e0" />
    </svg>
