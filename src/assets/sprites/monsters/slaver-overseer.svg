<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 38 62"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Slaver Overseer"
    >
      <!-- Torchlit backlight + ground shadow -->
      <ellipse cx="19" cy="30" rx="18" ry="26" fill="#b03a2a" opacity="0.15" />
      <ellipse cx="19" cy="59.6" rx="13" ry="2.2" fill="#000" opacity="0.45" />

      <!-- ══ The branding iron — raised, sigil glowing ══ -->
      <!-- iron rod -->
      <rect x="28" y="10" width="3" height="22" fill="#150d08" />
      <rect x="29" y="11" width="1" height="20" fill="#3a3644" />
      <!-- glowing brand head — the slaver's mark -->
      <rect x="25" y="2" width="9" height="9" fill="#150d08" />
      <rect x="26" y="3" width="7" height="7" fill="#5a1408" />
      <rect x="27" y="4" width="5" height="5" fill="#a83414" />
      <!-- the sigil burning -->
      <rect x="28" y="5" width="3" height="1" fill="#ffb347" />
      <rect x="28" y="7" width="3" height="1" fill="#ffb347" />
      <rect x="28" y="5" width="1" height="3" fill="#ffe8a0" />
      <ellipse cx="29" cy="6" rx="6" ry="6" fill="#e8731e" opacity="0.18" />
      <!-- heat shimmer -->
      <rect x="26" y="0" width="1" height="2" fill="#e8731e" opacity="0.6" />
      <rect x="32" y="0" width="1" height="2" fill="#a83414" opacity="0.5" />

      <!-- ══ Plumed helm ══ -->
      <rect x="17" y="0" width="4" height="3" fill="#150d08" />
      <rect x="18" y="0" width="2" height="2" fill="#8c1818" />
      <rect x="18" y="0" width="1" height="1" fill="#b52424" />
      <rect x="12" y="2" width="14" height="6" fill="#150d08" />
      <rect x="13" y="3" width="12" height="5" fill="#3a3644" />
      <rect x="13" y="3" width="5" height="5" fill="#4a4654" />
      <rect x="13" y="3" width="2" height="3" fill="#5e5a68" />
      <rect x="22" y="3" width="3" height="5" fill="#2e2a38" />
      <rect x="13" y="3" width="12" height="1" fill="#6e6a78" />
      <!-- cheek guards -->
      <rect x="12" y="7" width="3" height="5" fill="#2e2a38" />
      <rect x="23" y="7" width="3" height="5" fill="#262230" />

      <!-- ══ Hard face ══ -->
      <rect x="13" y="7" width="12" height="9" fill="#150d08" />
      <rect x="14" y="8" width="10" height="7" fill="#b08560" />
      <rect x="14" y="8" width="4" height="7" fill="#c49a72" />
      <rect x="14" y="8" width="2" height="5" fill="#d4ae84" />
      <rect x="21" y="8" width="3" height="7" fill="#94684a" />
      <!-- cruel eyes -->
      <rect x="15" y="10" width="3" height="2" fill="#1a1006" />
      <rect x="20" y="10" width="3" height="2" fill="#1a1006" />
      <rect x="16" y="10" width="1" height="1" fill="#e8dcc4" />
      <rect x="21" y="10" width="1" height="1" fill="#cdbfa2" />
      <!-- broken nose + sneer -->
      <rect x="18" y="11" width="2" height="2" fill="#94684a" />
      <rect x="15" y="14" width="7" height="1" fill="#5e3a24" />
      <rect x="20" y="13" width="2" height="1" fill="#5e3a24" />

      <!-- ══ Scale cuirass ══ -->
      <rect x="9" y="16" width="20" height="18" fill="#150d08" />
      <rect x="10" y="17" width="18" height="16" fill="#4a3824" />
      <rect x="10" y="17" width="6" height="16" fill="#5a452c" />
      <rect x="10" y="17" width="3" height="11" fill="#6a5436" />
      <rect x="24" y="17" width="4" height="16" fill="#3c2c1c" />
      <rect x="26" y="17" width="2" height="16" fill="#2e2014" />
      <!-- scale rows -->
      <rect x="10" y="20" width="18" height="1" fill="#2e2014" />
      <rect x="10" y="24" width="18" height="1" fill="#2a1c10" />
      <rect x="10" y="28" width="18" height="1" fill="#2a1c10" />
      <!-- scale glints -->
      <rect x="12" y="18" width="1" height="1" fill="#8a6a42" />
      <rect x="18" y="22" width="1" height="1" fill="#6a5436" />
      <rect x="13" y="26" width="1" height="1" fill="#6a5436" />
      <rect x="20" y="30" width="1" height="1" fill="#5a452c" />
      <!-- iron shoulder plates -->
      <rect x="8" y="15" width="8" height="5" fill="#150d08" />
      <rect x="9" y="16" width="6" height="3" fill="#4a4654" />
      <rect x="9" y="16" width="6" height="1" fill="#6e6a78" />
      <rect x="22" y="15" width="8" height="5" fill="#150d08" />
      <rect x="23" y="16" width="6" height="3" fill="#3a3644" />
      <rect x="23" y="16" width="6" height="1" fill="#56525e" />

      <!-- ══ Right arm raised with the brand ══ -->
      <rect x="24" y="18" width="7" height="6" fill="#150d08" />
      <rect x="25" y="19" width="5" height="4" fill="#3c2c1c" />
      <rect x="25" y="19" width="2" height="4" fill="#4a3824" />
      <!-- studded bracer + fist on the rod -->
      <rect x="26" y="23" width="8" height="7" fill="#150d08" />
      <rect x="27" y="24" width="6" height="5" fill="#b08560" />
      <rect x="27" y="24" width="2" height="5" fill="#c49a72" />
      <rect x="27" y="28" width="6" height="1" fill="#94684a" />
      <rect x="29" y="26" width="1" height="1" fill="#7a5438" />
      <rect x="31" y="26" width="1" height="1" fill="#7a5438" />

      <!-- ══ Left arm — coiled whip in hand ══ -->
      <rect x="6" y="18" width="6" height="7" fill="#150d08" />
      <rect x="7" y="19" width="4" height="5" fill="#5a452c" />
      <rect x="7" y="19" width="2" height="5" fill="#6a5436" />
      <rect x="4" y="24" width="7" height="8" fill="#150d08" />
      <rect x="5" y="25" width="5" height="6" fill="#4a3824" />
      <rect x="5" y="25" width="2" height="6" fill="#5a452c" />
      <!-- iron bracer -->
      <rect x="4" y="29" width="7" height="3" fill="#150d08" />
      <rect x="5" y="30" width="5" height="1" fill="#56525e" />
      <!-- hand with the coiled whip -->
      <rect x="4" y="32" width="7" height="5" fill="#150d08" />
      <rect x="5" y="33" width="5" height="3" fill="#b08560" />
      <rect x="5" y="33" width="2" height="3" fill="#c49a72" />
      <!-- whip coils hanging -->
      <rect x="3" y="37" width="8" height="6" fill="#150d08" />
      <rect x="4" y="38" width="6" height="1" fill="#5a3418" />
      <rect x="4" y="40" width="6" height="1" fill="#4a2810" />
      <rect x="4" y="42" width="6" height="1" fill="#3a2010" />
      <rect x="4" y="39" width="1" height="1" fill="#6e4220" />
      <rect x="9" y="41" width="1" height="1" fill="#6e4220" />
      <!-- whip tip dangling -->
      <rect x="9" y="43" width="1" height="3" fill="#3a2010" />

      <!-- ══ Belt + keyring ══ -->
      <rect x="9" y="33" width="20" height="4" fill="#150d08" />
      <rect x="10" y="34" width="18" height="2" fill="#2e2014" />
      <rect x="10" y="34" width="6" height="1" fill="#3c2c1c" />
      <rect x="17" y="33" width="4" height="4" fill="#150d08" />
      <rect x="18" y="34" width="2" height="2" fill="#6e6a78" />
      <rect x="18" y="34" width="1" height="1" fill="#9a96a4" />
      <!-- keyring with keys -->
      <rect x="23" y="37" width="4" height="4" fill="#150d08" />
      <rect x="24" y="38" width="2" height="2" fill="none" stroke="#6e6a78" stroke-width="1" />
      <rect x="24" y="41" width="1" height="3" fill="#c89a48" />
      <rect x="23" y="43" width="2" height="1" fill="#ecc46a" />
      <rect x="26" y="41" width="1" height="2" fill="#9a9ab0" />

      <!-- ══ Legs ══ -->
      <rect x="10" y="37" width="9" height="12" fill="#150d08" />
      <rect x="11" y="38" width="7" height="11" fill="#3c2c1c" />
      <rect x="11" y="38" width="3" height="11" fill="#4a3824" />
      <rect x="16" y="38" width="2" height="11" fill="#2e2014" />
      <rect x="19" y="37" width="9" height="12" fill="#150d08" />
      <rect x="20" y="38" width="7" height="11" fill="#332518" />
      <rect x="20" y="38" width="2" height="11" fill="#3c2c1c" />
      <rect x="25" y="38" width="2" height="11" fill="#241808" />
      <!-- knee studs -->
      <rect x="12" y="41" width="2" height="1" fill="#6e6a78" />
      <rect x="21" y="41" width="2" height="1" fill="#56525e" />

      <!-- ══ Iron-toed boots ══ -->
      <rect x="8" y="48" width="11" height="6" fill="#150d08" />
      <rect x="9" y="49" width="9" height="4" fill="#2e2a38" />
      <rect x="9" y="49" width="9" height="1" fill="#4a4654" />
      <rect x="9" y="51" width="3" height="2" fill="#56525e" />
      <rect x="9" y="52" width="9" height="1" fill="#16121e" />
      <rect x="19" y="48" width="11" height="6" fill="#150d08" />
      <rect x="20" y="49" width="9" height="4" fill="#262230" />
      <rect x="20" y="49" width="9" height="1" fill="#3a3644" />
      <rect x="20" y="52" width="9" height="1" fill="#120e18" />

      <!-- torch motes -->
      <rect x="2" y="14" width="1" height="1" fill="#ffb347" opacity="0.5" />
      <rect x="35" y="34" width="1" height="1" fill="#e8731e" opacity="0.5" />
    </svg>
