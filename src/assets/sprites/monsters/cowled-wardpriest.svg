<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 46"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Cowled Wardpriest"
    >
      <!-- Cool ward backlight + ground shadow -->
      <ellipse cx="15" cy="22" rx="14" ry="20" fill="#7a8aaa" opacity="0.07" />
      <ellipse cx="15" cy="44.6" rx="10" ry="1.7" fill="#000" opacity="0.4" />

      <!-- ── Ward-pane — translucent shield of pale light, raised left ── -->
      <rect x="0" y="9" width="9" height="12" fill="#9a9aaa" opacity="0.18" />
      <rect x="1" y="10" width="7" height="10" fill="#c8c8d8" opacity="0.22" />
      <rect x="2" y="11" width="5" height="8" fill="#e8e8f4" opacity="0.25" />
      <!-- ward rune etched in the pane -->
      <rect x="3" y="12" width="3" height="1" fill="#e8e8f4" opacity="0.8" />
      <rect x="4" y="12" width="1" height="5" fill="#e8e8f4" opacity="0.7" />
      <rect x="3" y="16" width="3" height="1" fill="#c8c8d8" opacity="0.7" />
      <rect x="4" y="13" width="1" height="1" fill="#ffffff" />
      <!-- pane edge glints -->
      <rect x="0" y="9" width="1" height="3" fill="#e8e8f4" opacity="0.5" />
      <rect x="8" y="18" width="1" height="3" fill="#c8c8d8" opacity="0.4" />

      <!-- ── Pointed cowl — grey wedge, deeper than the others ── -->
      <rect x="13" y="0" width="4" height="3" fill="#150d08" />
      <rect x="14" y="1" width="2" height="2" fill="#5e5e6a" />
      <rect x="14" y="1" width="1" height="1" fill="#6e6e7c" />
      <rect x="11" y="2" width="8" height="3" fill="#150d08" />
      <rect x="12" y="3" width="6" height="2" fill="#53535e" />
      <rect x="12" y="3" width="3" height="1" fill="#666672" />
      <rect x="16" y="4" width="2" height="1" fill="#43434e" />
      <rect x="9" y="5" width="12" height="4" fill="#150d08" />
      <rect x="10" y="6" width="10" height="3" fill="#43434e" />
      <rect x="10" y="6" width="3" height="3" fill="#53535e" />
      <rect x="10" y="6" width="1" height="2" fill="#666672" />
      <rect x="17" y="6" width="3" height="3" fill="#33333c" />

      <!-- ── Hood mouth — black void, only cold eyes ── -->
      <rect x="9" y="9" width="12" height="7" fill="#150d08" />
      <rect x="10" y="10" width="10" height="5" fill="#15151a" />
      <rect x="10" y="10" width="10" height="2" fill="#0c0c10" />
      <!-- cold warding eyes -->
      <rect x="12" y="12" width="2" height="1" fill="#8aaad0" />
      <rect x="16" y="12" width="2" height="1" fill="#6e90b8" />
      <rect x="12" y="12" width="1" height="1" fill="#d0e0f4" />
      <rect x="16" y="12" width="1" height="1" fill="#aac8e8" />
      <!-- breath of frost under the hood -->
      <rect x="13" y="14" width="4" height="1" fill="#8aaad0" opacity="0.25" />

      <!-- ── Mantle + pectoral chain ── -->
      <rect x="6" y="16" width="18" height="4" fill="#150d08" />
      <rect x="7" y="17" width="16" height="2" fill="#43434e" />
      <rect x="7" y="17" width="16" height="1" fill="#5e5e6a" />
      <rect x="7" y="17" width="4" height="1" fill="#7a7a88" />
      <rect x="20" y="17" width="3" height="2" fill="#33333c" />
      <!-- silver pectoral chain + warding amulet -->
      <rect x="11" y="19" width="1" height="1" fill="#9a9aaa" />
      <rect x="13" y="20" width="1" height="1" fill="#9a9aaa" />
      <rect x="16" y="20" width="1" height="1" fill="#8a8a9a" />
      <rect x="18" y="19" width="1" height="1" fill="#7a7a88" />
      <rect x="14" y="21" width="2" height="2" fill="#c8c8d8" />
      <rect x="14" y="21" width="1" height="1" fill="#f0f0f8" />

      <!-- ── Robe body — grey ramp ── -->
      <rect x="6" y="20" width="18" height="13" fill="#150d08" />
      <rect x="7" y="21" width="16" height="11" fill="#43434e" />
      <rect x="7" y="21" width="3" height="10" fill="#4e4e58" />
      <rect x="7" y="21" width="1" height="10" fill="#5e5e6a" />
      <rect x="20" y="21" width="3" height="10" fill="#33333c" />
      <rect x="22" y="22" width="1" height="9" fill="#28282f" />
      <!-- center fold -->
      <rect x="14" y="23" width="2" height="9" fill="#2d2d35" />
      <rect x="15" y="23" width="1" height="9" fill="#23232a" />
      <!-- robe dither -->
      <rect x="10" y="24" width="1" height="1" fill="#53535e" />
      <rect x="18" y="27" width="1" height="1" fill="#33333c" />

      <!-- ── Warding arm — raised toward the pane, bone-pale hand ── -->
      <rect x="5" y="17" width="6" height="4" fill="#150d08" />
      <rect x="6" y="18" width="4" height="2" fill="#43434e" />
      <rect x="6" y="18" width="4" height="1" fill="#53535e" />
      <rect x="3" y="14" width="5" height="5" fill="#150d08" />
      <rect x="4" y="15" width="3" height="3" fill="#43434e" />
      <rect x="4" y="15" width="1" height="3" fill="#53535e" />
      <!-- pale hand pressed flat against the ward -->
      <rect x="3" y="11" width="4" height="5" fill="#150d08" />
      <rect x="4" y="12" width="2" height="3" fill="#c8c4b8" />
      <rect x="4" y="12" width="1" height="3" fill="#e0dccc" />
      <rect x="4" y="11" width="1" height="1" fill="#e0dccc" />
      <rect x="6" y="12" width="1" height="2" fill="#a8a496" />

      <!-- ── Off arm at the side ── -->
      <rect x="21" y="20" width="5" height="9" fill="#150d08" />
      <rect x="22" y="21" width="3" height="7" fill="#383842" />
      <rect x="22" y="21" width="1" height="7" fill="#43434e" />
      <rect x="22" y="28" width="4" height="2" fill="#150d08" />
      <rect x="23" y="28" width="2" height="1" fill="#53535e" />

      <!-- ── Rope cincture with votive knots ── -->
      <rect x="7" y="32" width="16" height="2" fill="#150d08" />
      <rect x="8" y="32" width="14" height="1" fill="#666672" />
      <rect x="12" y="32" width="1" height="4" fill="#53535e" />
      <rect x="12" y="35" width="1" height="2" fill="#43434e" />

      <!-- ── Skirt — heavy vertical folds to the floor ── -->
      <rect x="5" y="34" width="20" height="9" fill="#150d08" />
      <rect x="6" y="35" width="18" height="7" fill="#43434e" />
      <rect x="6" y="35" width="18" height="1" fill="#53535e" />
      <rect x="6" y="35" width="3" height="7" fill="#4e4e58" />
      <rect x="6" y="35" width="1" height="6" fill="#5e5e6a" />
      <rect x="21" y="35" width="3" height="7" fill="#33333c" />
      <rect x="23" y="36" width="1" height="6" fill="#28282f" />
      <rect x="10" y="36" width="1" height="6" fill="#2d2d35" />
      <rect x="14" y="36" width="2" height="6" fill="#2d2d35" />
      <rect x="15" y="36" width="1" height="6" fill="#23232a" />
      <rect x="19" y="36" width="1" height="6" fill="#2d2d35" />
      <!-- ward-light brushing the lit hem -->
      <rect x="6" y="40" width="3" height="1" fill="#8aaad0" opacity="0.3" />

      <!-- ── Hem shadow + feet ── -->
      <rect x="6" y="42" width="18" height="2" fill="#150d08" />
      <rect x="7" y="42" width="16" height="1" fill="#23232a" />
      <rect x="9" y="43" width="4" height="2" fill="#150d08" />
      <rect x="10" y="43" width="2" height="1" fill="#2d2d35" />
      <rect x="17" y="43" width="4" height="2" fill="#150d08" />
      <rect x="18" y="43" width="2" height="1" fill="#23232a" />
    </svg>
