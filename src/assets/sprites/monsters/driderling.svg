<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 27"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Driderling"
    >
      <!-- Hatchling backlight + small ground shadow -->
      <ellipse cx="15" cy="14" rx="14" ry="11" fill="#6a4a90" opacity="0.08" />
      <ellipse cx="15" cy="25.6" rx="11" ry="1.4" fill="#000" opacity="0.38" />

      <!-- ── Rear legs behind the body ── -->
      <rect x="2" y="12" width="4" height="3" fill="#150d08" />
      <rect x="3" y="13" width="2" height="1" fill="#2a1024" />
      <rect x="0" y="14" width="3" height="6" fill="#150d08" />
      <rect x="1" y="15" width="1" height="4" fill="#1c0a18" />
      <rect x="24" y="12" width="4" height="3" fill="#150d08" />
      <rect x="25" y="13" width="2" height="1" fill="#1c0a18" />
      <rect x="27" y="14" width="3" height="6" fill="#150d08" />
      <rect x="28" y="15" width="1" height="4" fill="#120810" />

      <!-- ── Abdomen — glossy hatchling chitin, red pin-mark ── -->
      <rect x="8" y="8" width="16" height="3" fill="#150d08" />
      <rect x="6" y="10" width="20" height="8" fill="#150d08" />
      <rect x="8" y="18" width="16" height="3" fill="#150d08" />
      <rect x="9" y="9" width="14" height="2" fill="#2a1024" />
      <rect x="7" y="11" width="18" height="6" fill="#241020" />
      <rect x="9" y="17" width="14" height="3" fill="#1c0a18" />
      <!-- lit crown -->
      <rect x="9" y="9" width="6" height="1" fill="#4c2842" />
      <rect x="7" y="11" width="4" height="2" fill="#3a1c34" />
      <rect x="7" y="11" width="2" height="1" fill="#4c2842" />
      <!-- shadow flank -->
      <rect x="21" y="12" width="4" height="5" fill="#180a14" />
      <rect x="23" y="13" width="2" height="5" fill="#120810" />
      <rect x="24" y="15" width="1" height="2" fill="#1c2e34" />
      <!-- red pin-mark, not yet an hourglass -->
      <rect x="14" y="12" width="4" height="2" fill="#7a1828" />
      <rect x="15" y="13" width="2" height="2" fill="#b53c4a" />
      <rect x="15" y="13" width="1" height="1" fill="#d85a5a" />
      <!-- gloss glints -->
      <rect x="10" y="10" width="2" height="1" fill="#5e3852" />
      <rect x="8" y="13" width="1" height="1" fill="#4c2842" />

      <!-- ── Mid + fore legs — needle-thin, scrabbling ── -->
      <rect x="5" y="13" width="4" height="3" fill="#150d08" />
      <rect x="6" y="14" width="2" height="1" fill="#321628" />
      <rect x="3" y="15" width="3" height="8" fill="#150d08" />
      <rect x="4" y="16" width="1" height="6" fill="#2a1024" />
      <rect x="8" y="16" width="3" height="4" fill="#150d08" />
      <rect x="9" y="17" width="1" height="2" fill="#321628" />
      <rect x="6" y="19" width="3" height="6" fill="#150d08" />
      <rect x="7" y="20" width="1" height="4" fill="#3a1c34" />
      <rect x="23" y="13" width="4" height="3" fill="#150d08" />
      <rect x="24" y="14" width="2" height="1" fill="#1c0a18" />
      <rect x="24" y="15" width="3" height="8" fill="#150d08" />
      <rect x="25" y="16" width="1" height="6" fill="#1c0a18" />
      <rect x="21" y="16" width="3" height="4" fill="#150d08" />
      <rect x="22" y="17" width="1" height="2" fill="#120810" />
      <rect x="22" y="19" width="3" height="6" fill="#150d08" />
      <rect x="23" y="20" width="1" height="4" fill="#1c0a18" />
      <!-- claw tips -->
      <rect x="3" y="22" width="2" height="2" fill="#150d08" />
      <rect x="6" y="24" width="2" height="2" fill="#150d08" />
      <rect x="25" y="22" width="2" height="2" fill="#150d08" />
      <rect x="23" y="24" width="2" height="2" fill="#150d08" />

      <!-- ── Half-formed drow face on the cephalothorax ── -->
      <rect x="10" y="2" width="12" height="8" fill="#150d08" />
      <rect x="11" y="3" width="10" height="6" fill="#2e1e44" />
      <rect x="11" y="3" width="10" height="1" fill="#3e2c58" />
      <rect x="11" y="3" width="3" height="5" fill="#3a2858" />
      <rect x="11" y="3" width="1" height="3" fill="#4c3a6e" />
      <rect x="19" y="4" width="2" height="5" fill="#22143a" />
      <!-- wisp of white natal hair -->
      <rect x="10" y="1" width="8" height="2" fill="#150d08" />
      <rect x="11" y="2" width="6" height="1" fill="#d8cfb8" />
      <rect x="11" y="2" width="3" height="1" fill="#ece3cc" />
      <rect x="9" y="2" width="2" height="2" fill="#150d08" />
      <rect x="10" y="3" width="1" height="1" fill="#b8ae94" />

      <!-- ── Eyes — gold hatchling cluster, four ── -->
      <rect x="12" y="5" width="3" height="2" fill="#1a0e14" />
      <rect x="17" y="5" width="3" height="2" fill="#1a0e14" />
      <rect x="12" y="5" width="2" height="1" fill="#f4d042" />
      <rect x="17" y="5" width="2" height="1" fill="#c4a430" />
      <rect x="12" y="5" width="1" height="1" fill="#fff4a0" />
      <rect x="17" y="5" width="1" height="1" fill="#e8cc70" />
      <rect x="13" y="4" width="1" height="1" fill="#c4a430" />
      <rect x="18" y="4" width="1" height="1" fill="#9a7a20" />

      <!-- ── Needle-fang chelicerae ── -->
      <rect x="13" y="8" width="6" height="2" fill="#1a0e14" />
      <rect x="13" y="8" width="1" height="2" fill="#e8e0c4" />
      <rect x="15" y="8" width="1" height="2" fill="#d4c8a8" />
      <rect x="17" y="8" width="1" height="2" fill="#c2b794" />
      <!-- venom bead -->
      <rect x="15" y="10" width="1" height="1" fill="#a8c478" opacity="0.7" />

      <!-- ── Silk thread it still trails ── -->
      <rect x="15" y="21" width="1" height="3" fill="#d8cfb8" opacity="0.35" />
      <rect x="15" y="25" width="1" height="1" fill="#d8cfb8" opacity="0.2" />
    </svg>
