<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 56 72"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Devourer of Selfishness"
    >
      <!-- Devouring-void aura + ground shadow -->
      <ellipse cx="28" cy="38" rx="27" ry="33" fill="#0e0816" opacity="0.5" />
      <ellipse cx="28" cy="38" rx="22" ry="28" fill="#160e22" opacity="0.6" />
      <ellipse cx="28" cy="38" rx="14" ry="17" fill="#3a1a2a" opacity="0.18" />
      <ellipse cx="28" cy="69.4" rx="23" ry="2.4" fill="#06040a" opacity="0.55" />

      <!-- ══ Small cunning head atop the mass ══ -->
      <rect x="20" y="2" width="16" height="11" fill="#150d08" />
      <rect x="21" y="3" width="14" height="9" fill="#4a2034" />
      <rect x="21" y="3" width="5" height="9" fill="#5a2840" />
      <rect x="21" y="3" width="2" height="6" fill="#6a304c" />
      <rect x="31" y="3" width="4" height="9" fill="#3a1828" />
      <!-- curled horns -->
      <rect x="17" y="0" width="4" height="4" fill="#150d08" />
      <rect x="18" y="1" width="2" height="2" fill="#b0a486" />
      <rect x="35" y="0" width="4" height="4" fill="#150d08" />
      <rect x="36" y="1" width="2" height="2" fill="#988c70" />
      <!-- greedy little eyes -->
      <rect x="23" y="6" width="3" height="2" fill="#1a0a06" />
      <rect x="30" y="6" width="3" height="2" fill="#1a0a06" />
      <rect x="24" y="6" width="2" height="1" fill="#f4d042" />
      <rect x="31" y="6" width="1" height="1" fill="#e8b830" />
      <rect x="24" y="6" width="1" height="1" fill="#fff8d0" />
      <!-- thin smiling mouth (the small one) -->
      <rect x="24" y="10" width="8" height="1" fill="#1a0a06" />
      <rect x="24" y="9" width="2" height="1" fill="#3a1828" />

      <!-- ══ The gorged body ══ -->
      <rect x="8" y="12" width="40" height="10" fill="#150d08" />
      <rect x="4" y="20" width="48" height="30" fill="#150d08" />
      <rect x="8" y="48" width="40" height="12" fill="#150d08" />
      <rect x="9" y="13" width="38" height="9" fill="#4a2034" />
      <rect x="5" y="21" width="46" height="28" fill="#542438" />
      <rect x="9" y="49" width="38" height="10" fill="#451d30" />
      <!-- lit upper-left flank -->
      <rect x="7" y="16" width="16" height="20" fill="#642a44" />
      <rect x="7" y="16" width="8" height="14" fill="#743450" />
      <rect x="8" y="16" width="4" height="8" fill="#84405c" />
      <!-- shadow right flank -->
      <rect x="42" y="18" width="9" height="30" fill="#3a1828" />
      <rect x="47" y="22" width="4" height="24" fill="#2e1220" />
      <!-- stretch-mark seams over the gut -->
      <rect x="12" y="24" width="6" height="1" fill="#3a1828" />
      <rect x="38" y="26" width="6" height="1" fill="#2e1220" />
      <rect x="10" y="44" width="8" height="1" fill="#3a1828" />
      <rect x="38" y="46" width="7" height="1" fill="#2e1220" />

      <!-- ══ THE BELLY-MAW — the true mouth ══ -->
      <rect x="12" y="26" width="32" height="20" fill="#150d08" />
      <rect x="13" y="27" width="30" height="18" fill="#1a0508" />
      <rect x="14" y="29" width="28" height="14" fill="#2e0a10" />
      <rect x="16" y="31" width="24" height="10" fill="#4a1018" />
      <!-- inner gullet glow -->
      <rect x="22" y="33" width="12" height="6" fill="#6e1a20" />
      <rect x="25" y="34" width="6" height="4" fill="#8e2428" />
      <rect x="27" y="35" width="2" height="2" fill="#b53c4a" />
      <!-- upper fangs -->
      <rect x="14" y="27" width="3" height="4" fill="#e8e0cc" />
      <rect x="14" y="27" width="2" height="3" fill="#f6f0dc" />
      <rect x="19" y="27" width="3" height="5" fill="#e8e0cc" />
      <rect x="19" y="27" width="1" height="4" fill="#f6f0dc" />
      <rect x="25" y="27" width="3" height="4" fill="#d8d0b8" />
      <rect x="31" y="27" width="3" height="5" fill="#d8d0b8" />
      <rect x="37" y="27" width="3" height="4" fill="#c8c0a8" />
      <!-- lower fangs -->
      <rect x="16" y="41" width="3" height="4" fill="#d8d0b8" />
      <rect x="22" y="40" width="3" height="5" fill="#e8e0cc" />
      <rect x="29" y="41" width="3" height="4" fill="#d8d0b8" />
      <rect x="35" y="40" width="3" height="5" fill="#c8c0a8" />
      <!-- drool strands -->
      <rect x="20" y="45" width="1" height="3" fill="#8e6a74" opacity="0.7" />
      <rect x="33" y="45" width="1" height="2" fill="#8e6a74" opacity="0.6" />

      <!-- ══ Devoured treasures stuck in the hide ══ -->
      <rect x="9" y="19" width="3" height="3" fill="#150d08" />
      <rect x="10" y="20" width="1" height="1" fill="#f4d042" />
      <rect x="42" y="14" width="3" height="3" fill="#150d08" />
      <rect x="43" y="15" width="1" height="1" fill="#c0a040" />
      <rect x="6" y="38" width="3" height="3" fill="#150d08" />
      <rect x="7" y="39" width="1" height="1" fill="#e8b830" />
      <!-- a swallowed crown bulging out -->
      <rect x="44" y="34" width="6" height="4" fill="#150d08" />
      <rect x="45" y="35" width="4" height="2" fill="#c0a040" />
      <rect x="45" y="35" width="1" height="1" fill="#f4d042" />
      <rect x="47" y="34" width="1" height="1" fill="#f4d042" />
