      <rect x="2" y="22" width="6" height="10" fill="#150d08" />
      <rect x="3" y="23" width="4" height="8" fill="#542438" />
      <rect x="3" y="23" width="2" height="8" fill="#642a44" />
      <rect x="0" y="30" width="7" height="9" fill="#150d08" />
      <rect x="1" y="31" width="5" height="7" fill="#4a2034" />
      <rect x="1" y="31" width="2" height="7" fill="#542438" />
      <!-- clawed grabber -->
      <rect x="0" y="38" width="8" height="7" fill="#150d08" />
      <rect x="1" y="39" width="6" height="5" fill="#642a44" />
      <rect x="1" y="39" width="3" height="5" fill="#743450" />
      <rect x="0" y="43" width="2" height="3" fill="#e8e0cc" />
      <rect x="3" y="44" width="2" height="2" fill="#d8d0b8" />
      <rect x="6" y="43" width="2" height="3" fill="#c8c0a8" />
      <!-- right arm -->
      <rect x="48" y="22" width="6" height="10" fill="#150d08" />
      <rect x="49" y="23" width="4" height="8" fill="#3a1828" />
      <rect x="49" y="23" width="2" height="8" fill="#451d30" />
      <rect x="49" y="30" width="7" height="9" fill="#150d08" />
      <rect x="50" y="31" width="5" height="7" fill="#2e1220" />
      <rect x="50" y="31" width="2" height="7" fill="#3a1828" />
      <rect x="48" y="38" width="8" height="7" fill="#150d08" />
      <rect x="49" y="39" width="6" height="5" fill="#451d30" />
      <rect x="49" y="39" width="2" height="5" fill="#542438" />
      <rect x="48" y="43" width="2" height="3" fill="#c8c0a8" />
      <rect x="51" y="44" width="2" height="2" fill="#b0a88c" />
      <rect x="54" y="43" width="2" height="3" fill="#a0987c" />

      <!-- ══ Stubby crushing legs ══ -->
      <rect x="12" y="58" width="13" height="8" fill="#150d08" />
      <rect x="13" y="59" width="11" height="7" fill="#451d30" />
      <rect x="13" y="59" width="4" height="7" fill="#542438" />
      <rect x="21" y="59" width="3" height="7" fill="#3a1828" />
      <rect x="31" y="58" width="13" height="8" fill="#150d08" />
      <rect x="32" y="59" width="11" height="7" fill="#3a1828" />
      <rect x="32" y="59" width="3" height="7" fill="#451d30" />
      <rect x="40" y="59" width="3" height="7" fill="#2e1220" />
      <!-- taloned feet -->
      <rect x="10" y="64" width="16" height="5" fill="#150d08" />
      <rect x="11" y="65" width="14" height="3" fill="#3a1828" />
      <rect x="10" y="66" width="2" height="3" fill="#d8d0b8" />
      <rect x="15" y="66" width="2" height="3" fill="#c8c0a8" />
      <rect x="20" y="66" width="2" height="3" fill="#c8c0a8" />
      <rect x="30" y="64" width="16" height="5" fill="#150d08" />
      <rect x="31" y="65" width="14" height="3" fill="#2e1220" />
      <rect x="31" y="66" width="2" height="3" fill="#b0a88c" />
      <rect x="36" y="66" width="2" height="3" fill="#a0987c" />
      <rect x="41" y="66" width="2" height="3" fill="#a0987c" />

      <!-- gold motes spiraling INTO the maw -->
      <rect x="8" y="14" width="1" height="1" fill="#f4d042" opacity="0.7" />
      <rect x="14" y="20" width="1" height="1" fill="#e8b830" opacity="0.6" />
      <rect x="46" y="20" width="1" height="1" fill="#c0a040" opacity="0.6" />
      <rect x="42" y="50" width="1" height="1" fill="#e8b830" opacity="0.5" />
      <rect x="50" y="10" width="1" height="1" fill="#f4d042" opacity="0.5" />
    </svg>
