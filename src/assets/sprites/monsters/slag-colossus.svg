<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 34 36"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Slag-Colossus"
    >
      <!-- Molten backlight + ground shadow -->
      <ellipse cx="17" cy="19" rx="16" ry="16" fill="#5a2208" opacity="0.3" />
      <ellipse cx="17" cy="19" rx="11" ry="13" fill="#e87820" opacity="0.07" />
      <ellipse cx="17" cy="35" rx="13" ry="1.8" fill="#000" opacity="0.42" />

      <!-- Head — slag ramp, key upper-left -->
      <rect x="11" y="2" width="12" height="8" fill="#2e241e" />
      <rect x="11" y="2" width="12" height="1" fill="#4a3a2e" />
      <rect x="11" y="2" width="2" height="8" fill="#3a2e26" />
      <rect x="11" y="2" width="1" height="6" fill="#4a3a2e" />
      <rect x="21" y="3" width="2" height="7" fill="#1f1812" />
      <!-- Fire eyes + spark -->
      <rect x="14" y="4" width="2" height="2" fill="#f4942a" />
      <rect x="19" y="4" width="2" height="2" fill="#f4942a" />
      <rect x="14" y="4" width="1" height="1" fill="#ffd070" />
      <rect x="19" y="4" width="1" height="1" fill="#ffd070" />
      <rect x="14" y="5" width="2" height="1" fill="#d4641a" />
      <rect x="19" y="5" width="2" height="1" fill="#d4641a" />
      <rect x="16" y="7" width="3" height="1" fill="#a83a14" />

      <!-- Body — charcoal ramp + ember seams -->
      <rect x="6" y="10" width="22" height="18" fill="#2e241b" />
      <rect x="6" y="10" width="22" height="2" fill="#4a3a2e" />
      <rect x="6" y="10" width="22" height="1" fill="#5a4636" />
      <rect x="6" y="10" width="2" height="17" fill="#3a2e22" />
      <rect x="6" y="10" width="1" height="16" fill="#4a3a2e" />
      <rect x="26" y="11" width="2" height="16" fill="#1f1812" />
      <!-- Slag chunk recesses -->
      <rect x="10" y="14" width="3" height="4" fill="#1f1812" />
      <rect x="10" y="14" width="2" height="1" fill="#6a3a1a" opacity="0.7" />
      <rect x="16" y="13" width="3" height="4" fill="#1f1812" />
      <polygon points="16,13 17,11 19,13" fill="#3a2e22" />
      <rect x="22" y="15" width="3" height="4" fill="#1a1410" />
      <rect x="13" y="20" width="3" height="4" fill="#1f1812" />
      <rect x="19" y="20" width="3" height="4" fill="#1a1410" />
      <!-- Ember edges -->
      <rect x="7" y="13" width="1" height="13" fill="#e87820" opacity="0.55" />
      <rect x="26" y="13" width="1" height="13" fill="#d4641a" opacity="0.5" />
      <rect x="15" y="11" width="4" height="1" fill="#f4942a" opacity="0.6" />
      <rect x="9" y="24" width="16" height="1" fill="#a83a14" opacity="0.55" />
      <rect x="14" y="18" width="1" height="1" fill="#ffb050" opacity="0.6" />

      <!-- Left arm -->
      <rect x="0" y="12" width="6" height="6" fill="#2e241b" />
      <rect x="0" y="12" width="6" height="1" fill="#4a3a2e" />
      <rect x="0" y="12" width="1" height="6" fill="#3a2e22" />
      <rect x="0" y="18" width="5" height="6" fill="#241c14" />
      <rect x="1" y="13" width="2" height="2" fill="#e87820" opacity="0.6" />
      <!-- Right arm -->
      <rect x="28" y="12" width="6" height="7" fill="#241c14" />
      <rect x="28" y="12" width="6" height="1" fill="#3a2e22" />
      <rect x="33" y="12" width="1" height="7" fill="#1a1410" />
      <rect x="29" y="19" width="5" height="7" fill="#1f1812" />
      <rect x="30" y="13" width="2" height="2" fill="#f4942a" opacity="0.6" />

      <!-- Legs -->
      <rect x="9" y="28" width="7" height="8" fill="#2a2118" />
      <rect x="18" y="28" width="7" height="8" fill="#241c14" />
      <rect x="9" y="28" width="1" height="8" fill="#3a2e22" />
      <rect x="11" y="30" width="1" height="4" fill="#d4641a" opacity="0.5" />
      <rect x="21" y="30" width="1" height="4" fill="#d4641a" opacity="0.5" />
      <rect x="9" y="34" width="8" height="2" fill="#140e0a" />
      <rect x="18" y="34" width="8" height="2" fill="#0e0906" />
    </svg>
