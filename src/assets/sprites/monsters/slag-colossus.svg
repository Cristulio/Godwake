<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 56 58"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Slag-Colossus"
    >
      <!-- Molten backlight + ground shadow -->
      <ellipse cx="28" cy="30" rx="26" ry="26" fill="#5a2208" opacity="0.3" />
      <ellipse cx="28" cy="30" rx="17" ry="20" fill="#e87820" opacity="0.07" />
      <ellipse cx="28" cy="55.5" rx="21" ry="2.4" fill="#000" opacity="0.48" />

      <!-- ══ Small slag head sunk between the shoulders ══ -->
      <rect x="22" y="4" width="13" height="10" fill="#150d08" />
      <rect x="23" y="5" width="11" height="8" fill="#2a201a" />
      <rect x="23" y="5" width="4" height="8" fill="#352a20" />
      <rect x="23" y="5" width="2" height="5" fill="#403228" />
      <rect x="31" y="5" width="3" height="8" fill="#221a14" />
      <!-- furnace eyes -->
      <rect x="24" y="7" width="4" height="3" fill="#3a1404" />
      <rect x="29" y="7" width="4" height="3" fill="#3a1404" />
      <rect x="25" y="8" width="2" height="1" fill="#ff8a1a" />
      <rect x="30" y="8" width="2" height="1" fill="#e06a14" />
      <rect x="25" y="8" width="1" height="1" fill="#ffe090" />
      <rect x="30" y="8" width="1" height="1" fill="#ffd070" />
      <!-- crack across the skull -->
      <rect x="26" y="5" width="1" height="2" fill="#a83a14" />
      <rect x="27" y="6" width="1" height="1" fill="#e87820" />

      <!-- ══ Mountainous shoulders ══ -->
      <rect x="4" y="10" width="22" height="12" fill="#150d08" />
      <rect x="5" y="11" width="20" height="10" fill="#2a201a" />
      <rect x="5" y="11" width="8" height="10" fill="#352a20" />
      <rect x="5" y="11" width="4" height="6" fill="#403228" />
      <rect x="20" y="11" width="5" height="10" fill="#221a14" />
      <!-- slag shards jutting -->
      <rect x="6" y="8" width="4" height="4" fill="#150d08" />
      <rect x="7" y="9" width="2" height="2" fill="#352a20" />
      <rect x="12" y="7" width="3" height="4" fill="#150d08" />
      <rect x="13" y="8" width="1" height="2" fill="#403228" />
      <rect x="31" y="10" width="22" height="12" fill="#150d08" />
      <rect x="32" y="11" width="20" height="10" fill="#221a14" />
      <rect x="32" y="11" width="6" height="10" fill="#2a201a" />
      <rect x="46" y="11" width="6" height="10" fill="#1a140e" />
      <rect x="42" y="7" width="4" height="5" fill="#150d08" />
      <rect x="43" y="8" width="2" height="3" fill="#2a201a" />
      <rect x="48" y="9" width="3" height="4" fill="#150d08" />
      <rect x="49" y="10" width="1" height="2" fill="#221a14" />
      <!-- molten seams in the shoulders -->
      <rect x="8" y="14" width="6" height="1" fill="#a83a14" opacity="0.8" />
      <rect x="10" y="15" width="2" height="1" fill="#e87820" />
      <rect x="36" y="15" width="6" height="1" fill="#8a2e10" opacity="0.8" />
      <rect x="38" y="16" width="2" height="1" fill="#d4641a" />

      <!-- ══ Furnace torso ══ -->
      <rect x="12" y="20" width="32" height="22" fill="#150d08" />
      <rect x="13" y="21" width="30" height="20" fill="#2a201a" />
      <rect x="13" y="21" width="10" height="20" fill="#352a20" />
      <rect x="13" y="21" width="5" height="14" fill="#403228" />
      <rect x="37" y="21" width="6" height="20" fill="#221a14" />
      <rect x="41" y="21" width="2" height="20" fill="#1a140e" />
      <!-- the furnace mouth — grated chest vent -->
      <rect x="20" y="24" width="16" height="12" fill="#150d08" />
      <rect x="21" y="25" width="14" height="10" fill="#3a1404" />
      <rect x="22" y="26" width="12" height="8" fill="#a83414" />
      <rect x="23" y="27" width="10" height="6" fill="#e8731e" />
      <rect x="24" y="28" width="8" height="4" fill="#ffb04a" />
      <rect x="25" y="29" width="5" height="2" fill="#ffe090" />
      <rect x="26" y="29" width="2" height="1" fill="#fff8d0" />
      <!-- grate bars over the glow -->
      <rect x="23" y="25" width="2" height="10" fill="#150d08" />
      <rect x="27" y="25" width="2" height="10" fill="#150d08" />
      <rect x="31" y="25" width="2" height="10" fill="#150d08" />
      <!-- heat shimmer above the vent -->
      <rect x="25" y="22" width="1" height="2" fill="#e87820" opacity="0.7" />
      <rect x="30" y="21" width="1" height="3" fill="#d4641a" opacity="0.6" />
      <!-- molten cracks crawling the plates -->
      <rect x="14" y="23" width="5" height="1" fill="#a83a14" opacity="0.75" />
      <rect x="15" y="30" width="4" height="1" fill="#e87820" opacity="0.6" />
      <rect x="37" y="26" width="5" height="1" fill="#8a2e10" opacity="0.7" />
      <rect x="38" y="34" width="4" height="1" fill="#d4641a" opacity="0.6" />
      <rect x="16" y="38" width="6" height="1" fill="#a83a14" opacity="0.6" />
      <rect x="34" y="39" width="5" height="1" fill="#8a2e10" opacity="0.6" />

      <!-- ══ The greater arm — left, massive ══ -->
      <rect x="0" y="20" width="11" height="16" fill="#150d08" />
      <rect x="1" y="21" width="9" height="14" fill="#2a201a" />
      <rect x="1" y="21" width="4" height="14" fill="#352a20" />
      <rect x="1" y="21" width="2" height="9" fill="#403228" />
      <rect x="8" y="21" width="2" height="14" fill="#221a14" />
      <!-- molten elbow seam -->
      <rect x="2" y="28" width="7" height="1" fill="#a83a14" opacity="0.8" />
      <rect x="4" y="28" width="2" height="1" fill="#ffb04a" />
      <!-- colossal slag fist -->
      <rect x="0" y="36" width="13" height="13" fill="#150d08" />
      <rect x="1" y="37" width="11" height="11" fill="#352a20" />
      <rect x="1" y="37" width="5" height="11" fill="#403228" />
      <rect x="1" y="37" width="2" height="7" fill="#4c3c30" />
      <rect x="9" y="37" width="3" height="11" fill="#2a201a" />
      <!-- knuckle shards -->
      <rect x="2" y="36" width="3" height="2" fill="#150d08" />
      <rect x="6" y="35" width="3" height="3" fill="#150d08" />
      <rect x="7" y="36" width="1" height="1" fill="#4c3c30" />
      <!-- magma between the fingers -->
      <rect x="3" y="42" width="2" height="1" fill="#e87820" />
      <rect x="7" y="43" width="2" height="1" fill="#d4641a" />
      <rect x="5" y="45" width="2" height="1" fill="#a83a14" />

      <!-- ══ The lesser arm — right, half-formed ══ -->
      <rect x="44" y="20" width="10" height="13" fill="#150d08" />
      <rect x="45" y="21" width="8" height="11" fill="#221a14" />
      <rect x="45" y="21" width="3" height="11" fill="#2a201a" />
      <rect x="51" y="21" width="2" height="11" fill="#1a140e" />
      <!-- dripping slag stump hand -->
      <rect x="45" y="32" width="10" height="9" fill="#150d08" />
      <rect x="46" y="33" width="8" height="7" fill="#2a201a" />
      <rect x="46" y="33" width="3" height="7" fill="#352a20" />
      <!-- molten drips from the stump -->
      <rect x="47" y="40" width="1" height="3" fill="#e87820" />
      <rect x="50" y="40" width="1" height="2" fill="#d4641a" />
      <rect x="52" y="40" width="1" height="3" fill="#a83a14" />
      <rect x="47" y="44" width="1" height="1" fill="#ffb04a" opacity="0.8" />
      <rect x="52" y="44" width="1" height="1" fill="#e87820" opacity="0.7" />

      <!-- ══ Squat slag legs ══ -->
      <rect x="14" y="42" width="12" height="9" fill="#150d08" />
      <rect x="15" y="43" width="10" height="8" fill="#2a201a" />
      <rect x="15" y="43" width="4" height="8" fill="#352a20" />
      <rect x="22" y="43" width="3" height="8" fill="#221a14" />
      <rect x="30" y="42" width="12" height="9" fill="#150d08" />
      <rect x="31" y="43" width="10" height="8" fill="#221a14" />
      <rect x="31" y="43" width="3" height="8" fill="#2a201a" />
      <rect x="38" y="43" width="3" height="8" fill="#1a140e" />
      <!-- molten shin seams -->
      <rect x="17" y="45" width="1" height="4" fill="#d4641a" opacity="0.6" />
      <rect x="35" y="45" width="1" height="4" fill="#a83a14" opacity="0.6" />

      <!-- ══ Crushing feet ══ -->
      <rect x="11" y="50" width="16" height="6" fill="#150d08" />
      <rect x="12" y="51" width="14" height="4" fill="#221a14" />
      <rect x="12" y="51" width="14" height="1" fill="#352a20" />
      <rect x="12" y="51" width="5" height="1" fill="#403228" />
      <rect x="12" y="54" width="14" height="1" fill="#0e0a06" />
      <rect x="29" y="50" width="16" height="6" fill="#150d08" />
      <rect x="30" y="51" width="14" height="4" fill="#1a140e" />
      <rect x="30" y="51" width="14" height="1" fill="#2a201a" />
      <rect x="30" y="54" width="14" height="1" fill="#0c0805" />
      <!-- magma squeezing under the steps -->
      <rect x="10" y="54" width="2" height="1" fill="#e87820" opacity="0.7" />
      <rect x="44" y="54" width="2" height="1" fill="#d4641a" opacity="0.6" />

      <!-- ══ Rising cinders ══ -->
      <rect x="8" y="16" width="1" height="1" fill="#f4942a" opacity="0.6" />
      <rect x="47" y="14" width="1" height="2" fill="#ffd070" opacity="0.55" />
      <rect x="3" y="32" width="1" height="1" fill="#ffb04a" opacity="0.6" />
      <rect x="51" y="28" width="1" height="1" fill="#e87820" opacity="0.55" />
      <rect x="28" y="18" width="1" height="1" fill="#ff8a1a" opacity="0.6" />
    </svg>
