<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 26 32"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Gravesmoke Revenant"
    >
      <!-- Cold smoke-light backlight -->
      <ellipse cx="13" cy="15" rx="12" ry="15" fill="#6a7a90" opacity="0.08" />
      <ellipse cx="13" cy="30" rx="7" ry="1.4" fill="#0a0c10" opacity="0.3" />

      <!-- Rising grave-smoke -->
      <rect x="9" y="6" width="2" height="2" fill="#4a4a52" opacity="0.4" />
      <rect x="14" y="4" width="2" height="2" fill="#5a5a64" opacity="0.4" />
      <rect x="11" y="2" width="3" height="2" fill="#4a4a52" opacity="0.3" />

      <!-- Smoke skull — layered ramp, lit upper-left -->
      <ellipse cx="12" cy="11" rx="6" ry="6" fill="#3a3a44" opacity="0.85" />
      <ellipse cx="11" cy="10" rx="5" ry="5" fill="#4c4c56" opacity="0.7" />
      <ellipse cx="12" cy="11" rx="4" ry="5" fill="#26262e" opacity="0.9" />
      <ellipse cx="10" cy="9" rx="2" ry="2" fill="#5a5a64" opacity="0.5" />
      <!-- Pale-blue eyes + spark -->
      <rect x="9" y="10" width="2" height="2" fill="#a0c0d0" opacity="0.85" />
      <rect x="13" y="10" width="2" height="2" fill="#a0c0d0" opacity="0.85" />
      <rect x="9" y="10" width="1" height="1" fill="#e0f0f8" />
      <rect x="13" y="10" width="1" height="1" fill="#e0f0f8" />
      <rect x="11" y="13" width="2" height="2" fill="#16161c" opacity="0.7" />

      <!-- Smoke torso — ramp + dither -->
      <rect x="7" y="16" width="10" height="11" fill="#34343e" opacity="0.8" />
      <rect x="7" y="16" width="3" height="11" fill="#44444e" opacity="0.7" />
      <rect x="7" y="16" width="1" height="11" fill="#54545e" opacity="0.6" />
      <rect x="8" y="16" width="8" height="2" fill="#44444e" opacity="0.6" />
      <rect x="10" y="18" width="4" height="9" fill="#22222a" opacity="0.85" />
      <rect x="9" y="20" width="1" height="6" fill="#5a5a64" opacity="0.4" />
      <rect x="14" y="20" width="1" height="6" fill="#2a2a32" opacity="0.5" />
      <rect x="12" y="19" width="1" height="1" fill="#44444e" opacity="0.5" />
      <rect x="15" y="23" width="1" height="1" fill="#22222a" opacity="0.6" />

      <!-- Wisping arms -->
      <rect x="3" y="17" width="4" height="2" fill="#3a3a44" opacity="0.7" />
      <rect x="1" y="18" width="3" height="2" fill="#34343e" opacity="0.55" />
      <rect x="17" y="17" width="4" height="2" fill="#3a3a44" opacity="0.7" />
      <rect x="20" y="15" width="3" height="2" fill="#34343e" opacity="0.5" />
      <rect x="22" y="14" width="2" height="1" fill="#44444e" opacity="0.4" />

      <!-- Dissipating legs -->
      <polygon points="8,27 10,32 12,27" fill="#2a2a32" opacity="0.7" />
      <polygon points="13,27 15,31 17,27" fill="#2a2a32" opacity="0.6" />
      <rect x="6" y="27" width="2" height="3" fill="#34343e" opacity="0.4" />
    </svg>
