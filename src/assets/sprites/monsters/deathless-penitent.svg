<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 40"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Deathless Penitent"
    >
      <!-- bowed head, low (kneeling pose) -->
      <rect x="9" y="13" width="7" height="6" fill="#8a8078" />
      <rect x="9" y="13" width="7" height="1" fill="#6a6058" />
      <rect x="10" y="16" width="2" height="1" fill="#1a1418" />
      <rect x="13" y="16" width="2" height="1" fill="#1a1418" />

      <!-- cold-light seam sealing the brow -->
      <rect x="9" y="15" width="7" height="1" fill="#7ad8c8" opacity="0.7" />

      <!-- hunched, kneeling torso -->
      <polygon points="7,19 17,19 19,31 5,31" fill="#5a544c" />
      <polygon points="8,19 16,19 17,28 7,28" fill="#6a645c" />
      <!-- reknitting wound-seams -->
      <rect x="9" y="22" width="5" height="1" fill="#7ad8c8" opacity="0.75" />
      <rect x="11" y="25" width="4" height="1" fill="#7ad8c8" opacity="0.6" />

      <!-- bared back / shoulder -->
      <rect x="6" y="20" width="3" height="3" fill="#7a746c" />

      <!-- arm raising the flail -->
      <rect x="16" y="19" width="3" height="4" fill="#7a746c" />
      <rect x="18" y="14" width="2" height="6" fill="#7a746c" />
      <!-- flail chain + heads -->
      <line x1="19" y1="14" x2="21" y2="6" stroke="#5a554c" stroke-width="0.8" />
      <rect x="20" y="3" width="3" height="3" fill="#3a3430" />
      <rect x="20" y="3" width="3" height="1" fill="#5a554c" />
      <rect x="19" y="6" width="2" height="2" fill="#3a3430" />

      <!-- kneeling legs folded under -->
      <rect x="5" y="31" width="14" height="4" fill="#4a443c" />
      <polygon points="5,35 9,31 9,35" fill="#5a544c" />
      <polygon points="15,35 19,31 19,35" fill="#5a544c" />
      <!-- worn hollow in the floor -->
      <ellipse cx="12" cy="37" rx="10" ry="2" fill="#2a2620" />
    </svg>
