      <rect x="5" y="7" width="2" height="2" fill="#a85420" />
      <rect x="5" y="7" width="1" height="1" fill="#e08a3a" />
      <rect x="22" y="6" width="4" height="4" fill="#150d08" />
      <rect x="23" y="7" width="2" height="2" fill="#8a3e14" />
      <rect x="24" y="8" width="1" height="1" fill="#6a3010" />

