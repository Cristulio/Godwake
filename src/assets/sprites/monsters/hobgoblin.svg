      <rect x="12" y="0" width="2" height="1" fill="#d05452" />
      <rect x="16" y="1" width="2" height="1" fill="#531320" />
      <!-- bowl -->
      <rect x="8" y="2" width="14" height="6" fill="#150d08" />
      <rect x="9" y="3" width="12" height="4" fill="#232c3a" />
      <rect x="9" y="3" width="12" height="1" fill="#4e586a" />
      <rect x="9" y="3" width="4" height="1" fill="#6d7689" />
      <rect x="9" y="4" width="2" height="3" fill="#39424f" />
      <rect x="9" y="4" width="1" height="2" fill="#6d7689" />
      <rect x="19" y="4" width="2" height="3" fill="#161b24" />
      <!-- brow rim + rivets -->
      <rect x="9" y="6" width="12" height="1" fill="#39424f" />
      <rect x="10" y="6" width="1" height="1" fill="#939cb0" />
      <rect x="15" y="6" width="1" height="1" fill="#6d7689" />
      <rect x="19" y="6" width="1" height="1" fill="#4e586a" />

