      <rect x="14" y="12" width="1" height="1" fill="#4a2008" />
      <rect x="10" y="13" width="10" height="2" fill="#160f0a" />
      <rect x="10" y="13" width="1" height="2" fill="#f0e6cc" />
      <rect x="18" y="13" width="1" height="2" fill="#d4c8a8" />
      <rect x="12" y="14" width="5" height="1" fill="#6a3010" />

