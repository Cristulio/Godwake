      <rect x="2" y="32" width="5" height="1" fill="#a93340" />
      <rect x="3" y="33" width="3" height="1" fill="#7e1f2c" />
      <!-- iron boss + rivets -->
      <rect x="3" y="35" width="3" height="3" fill="#39424f" />
      <rect x="3" y="35" width="2" height="1" fill="#939cb0" />
      <rect x="3" y="35" width="1" height="1" fill="#f2f0e4" />
      <rect x="5" y="37" width="1" height="1" fill="#161b24" />
      <rect x="2" y="28" width="1" height="1" fill="#a8814a" />
      <rect x="6" y="28" width="1" height="1" fill="#8c6232" />
      <rect x="2" y="39" width="1" height="1" fill="#8c6232" />
      <rect x="6" y="39" width="1" height="1" fill="#7a5230" />

