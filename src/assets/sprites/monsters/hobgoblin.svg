      <rect x="3" y="17" width="6" height="4" fill="#39424f" />
      <rect x="3" y="17" width="6" height="1" fill="#6d7689" />
      <rect x="3" y="17" width="2" height="1" fill="#c8cfe0" />
      <rect x="3" y="20" width="6" height="1" fill="#232c3a" />
      <rect x="20" y="16" width="8" height="6" fill="#150d08" />
