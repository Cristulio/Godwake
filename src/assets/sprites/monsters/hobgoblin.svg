      <rect x="7" y="18" width="3" height="11" fill="#39424f" />
      <rect x="7" y="18" width="1" height="11" fill="#6d7689" />
      <rect x="7" y="18" width="1" height="3" fill="#939cb0" />
      <rect x="20" y="18" width="3" height="11" fill="#161b24" />
