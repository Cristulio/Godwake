<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 49"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Hobgoblin Soldier"
    >
      <!-- Warm war-camp backlight + ground shadow -->
      <ellipse cx="15" cy="23" rx="15" ry="21" fill="#c46a2a" opacity="0.07" />
      <ellipse cx="14" cy="18" rx="11" ry="14" fill="#ffb040" opacity="0.05" />
      <ellipse cx="15" cy="47.6" rx="11" ry="1.9" fill="#000" opacity="0.42" />

      <!-- ── Spear — held at strict parade vertical, shadow side ── -->
      <rect x="23" y="0" width="3" height="32" fill="#150d08" />
      <rect x="24" y="4" width="1" height="27" fill="#b5a282" />
      <rect x="24" y="4" width="1" height="12" fill="#d4c8a8" />
      <!-- leaf blade -->
      <rect x="24" y="1" width="1" height="3" fill="#6d7689" />
      <rect x="24" y="1" width="1" height="1" fill="#c8cfe0" />
      <rect x="24" y="2" width="1" height="1" fill="#f2f0e4" />
