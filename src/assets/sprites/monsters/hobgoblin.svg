      <rect x="21" y="22" width="5" height="8" fill="#150d08" />
      <rect x="22" y="23" width="3" height="7" fill="#8a3e14" />
      <rect x="24" y="23" width="1" height="7" fill="#6a3010" />
      <rect x="22" y="29" width="5" height="4" fill="#150d08" />
      <rect x="23" y="30" width="3" height="2" fill="#8a3e14" />
      <rect x="23" y="30" width="1" height="1" fill="#a85420" />

