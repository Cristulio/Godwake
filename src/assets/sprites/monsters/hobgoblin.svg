      <rect x="8" y="8" width="3" height="7" fill="#c46a2a" />
      <rect x="8" y="8" width="1" height="5" fill="#e08a3a" />
      <rect x="8" y="8" width="1" height="2" fill="#ffb35c" />
      <rect x="18" y="8" width="4" height="7" fill="#8a3e14" />
      <rect x="20" y="9" width="2" height="6" fill="#6a3010" />
