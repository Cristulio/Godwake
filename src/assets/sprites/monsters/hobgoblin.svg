      <rect x="1" y="27" width="7" height="14" fill="#5a3a22" />
      <rect x="1" y="27" width="7" height="1" fill="#8a6238" />
      <rect x="1" y="27" width="2" height="13" fill="#6b4a2e" />
      <rect x="1" y="27" width="1" height="8" fill="#8a6238" />
      <rect x="7" y="28" width="1" height="13" fill="#3a2418" />
