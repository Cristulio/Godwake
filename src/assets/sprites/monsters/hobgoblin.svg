      <rect x="8" y="32" width="14" height="3" fill="#232c3a" />
      <rect x="8" y="32" width="14" height="1" fill="#39424f" />
      <rect x="11" y="32" width="1" height="3" fill="#0e1118" />
      <rect x="15" y="32" width="1" height="3" fill="#0e1118" />
      <rect x="19" y="32" width="1" height="3" fill="#0e1118" />
      <rect x="8" y="32" width="2" height="3" fill="#39424f" />
      <rect x="8" y="32" width="1" height="2" fill="#4e586a" />

