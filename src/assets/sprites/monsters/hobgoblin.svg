      <rect x="9" y="37" width="4" height="7" fill="#a85420" />
      <rect x="9" y="37" width="1" height="7" fill="#c46a2a" />
      <rect x="12" y="37" width="1" height="7" fill="#6a3010" />
      <rect x="16" y="36" width="6" height="8" fill="#150d08" />
      <rect x="17" y="37" width="4" height="7" fill="#8a3e14" />
      <rect x="17" y="37" width="1" height="7" fill="#a85420" />
      <rect x="20" y="37" width="1" height="7" fill="#4a2008" />

      <!-- ── Iron greaves + boots ── -->
      <rect x="9" y="40" width="4" height="2" fill="#39424f" />
      <rect x="9" y="40" width="4" height="1" fill="#6d7689" />
      <rect x="17" y="40" width="4" height="2" fill="#232c3a" />
      <rect x="17" y="40" width="4" height="1" fill="#4e586a" />
      <rect x="7" y="43" width="8" height="4" fill="#150d08" />
      <rect x="8" y="44" width="6" height="2" fill="#2a1810" />
      <rect x="8" y="44" width="6" height="1" fill="#4a3322" />
      <rect x="15" y="43" width="8" height="4" fill="#150d08" />
      <rect x="16" y="44" width="6" height="2" fill="#221408" />
      <rect x="16" y="44" width="6" height="1" fill="#3a2418" />
