<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 28 38"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Masque-Wisp"
    >
      <!-- Cold hall backlight + faint shadow (it barely owns one) -->
      <ellipse cx="14" cy="20" rx="13" ry="15" fill="#58525c" opacity="0.08" />
      <ellipse cx="14" cy="36.4" rx="8" ry="1.3" fill="#000" opacity="0.28" />

      <!-- The mask — porcelain, lovely, nobody behind it -->
      <rect x="8" y="2" width="11" height="12" fill="#150d08" />
      <rect x="9" y="3" width="9" height="10" fill="#e8dcc4" />
      <rect x="9" y="3" width="9" height="1" fill="#f8f2e2" />
      <rect x="9" y="3" width="4" height="2" fill="#f8f2e2" />
      <rect x="9" y="3" width="1" height="7" fill="#f0e6d2" />
      <rect x="16" y="4" width="2" height="9" fill="#cdbfa2" />
      <rect x="17" y="5" width="1" height="8" fill="#b4a486" />
      <!-- chin taper -->
      <rect x="10" y="12" width="7" height="1" fill="#cdbfa2" />
      <rect x="11" y="13" width="5" height="1" fill="#b4a486" />
      <!-- empty eye holes, nothing looking out -->
      <rect x="10" y="6" width="3" height="3" fill="#0e0c12" />
      <rect x="14" y="6" width="3" height="3" fill="#0e0c12" />
      <rect x="10" y="6" width="1" height="1" fill="#3a363e" />
      <rect x="14" y="6" width="1" height="1" fill="#3a363e" />
      <!-- painted beauty-mark + gilt brow line -->
      <rect x="10" y="5" width="7" height="1" fill="#c89a48" />
      <rect x="10" y="5" width="3" height="1" fill="#ecc46a" />
      <rect x="15" y="10" width="1" height="1" fill="#7e1f2c" />
      <!-- a closed, painted smile -->
      <rect x="12" y="11" width="4" height="1" fill="#a93340" />

      <!-- Nothing where the neck should be — shade leaking down -->
      <rect x="11" y="14" width="5" height="2" fill="#221e26" />
      <rect x="12" y="14" width="3" height="1" fill="#2e2a32" />

      <!-- Suggestion of a body — trailing rag-silk court dress -->
      <rect x="7" y="16" width="13" height="12" fill="#150d08" />
      <rect x="8" y="17" width="11" height="10" fill="#3a2a5a" />
      <rect x="8" y="17" width="11" height="1" fill="#503d78" />
      <rect x="8" y="17" width="4" height="1" fill="#6a52a0" />
      <rect x="8" y="17" width="2" height="9" fill="#473570" />
      <rect x="8" y="17" width="1" height="6" fill="#503d78" />
      <rect x="16" y="17" width="3" height="10" fill="#2a1d48" />
      <rect x="18" y="17" width="1" height="10" fill="#221640" />
      <!-- the shade inside the collar -->
      <rect x="10" y="17" width="7" height="2" fill="#221e26" />
      <!-- faded gilt sash remembering a sash -->
      <rect x="8" y="21" width="11" height="1" fill="#9a7232" />
      <rect x="8" y="21" width="4" height="1" fill="#c89a48" />
      <!-- moth-eaten panels -->
      <rect x="11" y="23" width="2" height="2" fill="#221e26" />
      <rect x="15" y="24" width="1" height="2" fill="#221e26" />

      <!-- Blade-arm — a slender court blade where a hand should be -->
      <rect x="18" y="18" width="5" height="3" fill="#150d08" />
      <rect x="19" y="19" width="3" height="1" fill="#3a2a5a" />
      <rect x="19" y="19" width="2" height="1" fill="#503d78" />
      <!-- the blade, needle-thin, catching hall-light -->
      <rect x="22" y="8" width="3" height="13" fill="#150d08" />
      <rect x="23" y="9" width="1" height="11" fill="#b8d8e0" />
      <rect x="23" y="9" width="1" height="4" fill="#e8f4f8" />
      <rect x="23" y="19" width="1" height="1" fill="#5a8a98" />
      <!-- gilt quillon where blade meets silk -->
      <rect x="21" y="20" width="4" height="1" fill="#c89a48" />
      <rect x="22" y="20" width="1" height="1" fill="#ecc46a" />

      <!-- Off-arm dissolved to a silk streamer -->
      <rect x="5" y="18" width="3" height="5" fill="#150d08" />
      <rect x="6" y="19" width="1" height="3" fill="#2a1d48" />
      <rect x="4" y="22" width="2" height="3" fill="#221640" opacity="0.85" />
      <rect x="3" y="24" width="2" height="2" fill="#1c1236" opacity="0.6" />

      <!-- Skirt trailing away to nothing -->
      <rect x="8" y="28" width="11" height="4" fill="#150d08" />
      <rect x="9" y="28" width="9" height="3" fill="#2e2148" />
      <rect x="9" y="28" width="3" height="3" fill="#3a2a5a" />
      <rect x="15" y="28" width="3" height="3" fill="#221640" />
      <!-- silk tatters drifting where feet never land -->
      <rect x="9" y="31" width="3" height="3" fill="#261c40" />
      <rect x="10" y="34" width="2" height="2" fill="#221640" opacity="0.8" />
      <rect x="11" y="36" width="1" height="1" fill="#1c1236" opacity="0.5" />
      <rect x="14" y="31" width="3" height="2" fill="#221640" opacity="0.9" />
      <rect x="15" y="33" width="2" height="2" fill="#1c1236" opacity="0.65" />
      <rect x="16" y="35" width="1" height="1" fill="#2a1d48" opacity="0.4" />
      <rect x="13" y="32" width="1" height="2" fill="#150d28" opacity="0.7" />

      <!-- Dust of the revel drifting off it -->
      <rect x="3" y="10" width="1" height="1" fill="#cdbfa2" opacity="0.35" />
      <rect x="21" y="26" width="1" height="1" fill="#9a949e" opacity="0.4" />
      <rect x="6" y="30" width="1" height="1" fill="#7a7480" opacity="0.4" />
    </svg>
