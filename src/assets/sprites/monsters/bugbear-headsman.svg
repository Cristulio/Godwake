      <rect x="6" y="27" width="20" height="14" fill="#6a4422" />
      <rect x="6" y="27" width="7" height="14" fill="#7a5028" />
      <rect x="6" y="27" width="3" height="10" fill="#9a6838" />
      <rect x="22" y="27" width="4" height="14" fill="#4a2c12" />
