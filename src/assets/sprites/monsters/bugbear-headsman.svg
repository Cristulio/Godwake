      <rect x="7" y="48" width="7" height="8" fill="#6a4422" />
      <rect x="7" y="48" width="3" height="8" fill="#7a5028" />
      <rect x="12" y="48" width="2" height="8" fill="#4a2c12" />
      <rect x="17" y="47" width="9" height="9" fill="#150d08" />
      <rect x="18" y="48" width="7" height="8" fill="#5a3818" />
      <rect x="18" y="48" width="2" height="8" fill="#6a4422" />
