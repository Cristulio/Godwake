      <rect x="5" y="56" width="9" height="3" fill="#5a3818" />
      <rect x="5" y="56" width="3" height="3" fill="#6a4422" />
      <rect x="4" y="58" width="2" height="2" fill="#cdbfa2" />
      <rect x="8" y="58" width="2" height="2" fill="#b0a486" />
      <rect x="12" y="58" width="2" height="2" fill="#b0a486" />
      <rect x="17" y="55" width="11" height="5" fill="#150d08" />
      <rect x="18" y="56" width="9" height="3" fill="#4a2c12" />
      <rect x="18" y="58" width="2" height="2" fill="#b0a486" />
      <rect x="22" y="58" width="2" height="2" fill="#988c70" />
      <rect x="26" y="58" width="2" height="2" fill="#988c70" />
