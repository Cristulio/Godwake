      <rect x="7" y="3" width="18" height="4" fill="#2e2014" />
      <rect x="5" y="7" width="21" height="10" fill="#3c2c1c" />
      <rect x="5" y="7" width="7" height="10" fill="#4a3824" />
      <rect x="5" y="7" width="3" height="7" fill="#5a452c" />
      <rect x="22" y="7" width="4" height="10" fill="#2e2014" />
