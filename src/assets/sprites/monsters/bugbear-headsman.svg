      <ellipse cx="19" cy="59.6" rx="15" ry="2.2" fill="#000" opacity="0.45" />

      <!-- ══ Headsman's axe — beside the body ══ -->
      <!-- haft -->
      <rect x="31" y="6" width="5" height="46" fill="#150d08" />
      <rect x="32" y="7" width="3" height="44" fill="#4a2810" />
      <rect x="32" y="7" width="1" height="44" fill="#8c5226" />
      <rect x="34" y="7" width="1" height="44" fill="#3a2010" />
      <!-- single great bit, facing left -->
      <rect x="22" y="2" width="11" height="3" fill="#150d08" />
      <rect x="20" y="4" width="13" height="4" fill="#150d08" />
      <rect x="21" y="7" width="12" height="4" fill="#150d08" />
      <rect x="24" y="10" width="9" height="3" fill="#150d08" />
      <rect x="23" y="3" width="9" height="1" fill="#6e6a78" />
      <rect x="21" y="5" width="11" height="2" fill="#56525e" />
      <rect x="22" y="7" width="10" height="3" fill="#46424e" />
