<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 36"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Tidebound Codex"
    >
      <!-- Drowned-teal backlight + ground shadow -->
      <ellipse cx="16" cy="18" rx="15" ry="16" fill="#2a6a64" opacity="0.08" />
      <ellipse cx="16" cy="34" rx="11" ry="1.8" fill="#000" opacity="0.4" />

      <!-- Upper cover lip — teal ramp -->
      <rect x="6" y="4" width="20" height="6" fill="#23413e" />
      <rect x="6" y="4" width="20" height="1" fill="#356060" />
      <rect x="6" y="4" width="20" height="1" fill="#2e524e" />
      <rect x="6" y="9" width="20" height="1" fill="#16302e" />
      <rect x="7" y="6" width="18" height="1" fill="#a8c0b8" opacity="0.3" />
      <rect x="8" y="3" width="6" height="2" fill="#2a4a48" />
      <rect x="18" y="2" width="7" height="3" fill="#2a4a48" />
      <rect x="18" y="2" width="7" height="1" fill="#3a5a56" />

      <!-- Tome body — cover ramp + clasps + page-edge bands -->
      <rect x="5" y="10" width="22" height="16" fill="#1e3a38" />
      <rect x="5" y="10" width="22" height="1" fill="#142826" />
      <rect x="5" y="10" width="2" height="16" fill="#234440" />
      <rect x="5" y="10" width="1" height="16" fill="#2a504c" />
      <rect x="25" y="11" width="2" height="15" fill="#162e2c" />
      <rect x="26" y="11" width="1" height="15" fill="#112422" />
      <rect x="6" y="11" width="3" height="14" fill="#172f2d" />
      <rect x="23" y="11" width="3" height="14" fill="#142826" />
      <rect x="5" y="13" width="22" height="1" fill="#356060" opacity="0.4" />
      <rect x="5" y="17" width="22" height="1" fill="#356060" opacity="0.4" />
      <rect x="5" y="21" width="22" height="1" fill="#356060" opacity="0.4" />

      <!-- Central reading eye — gold ramp + iris + spark -->
      <rect x="12" y="14" width="8" height="8" fill="#6a5020" />
      <rect x="12" y="14" width="8" height="1" fill="#8a6a2a" />
      <rect x="12" y="14" width="2" height="8" fill="#7a5c24" />
      <rect x="18" y="14" width="2" height="8" fill="#54401a" />
      <circle cx="16" cy="18" r="3" fill="#b08840" />
      <circle cx="16" cy="18" r="3" fill="#c89a48" opacity="0.5" />
      <rect x="15" y="15" width="2" height="3" fill="#3a2c10" />
      <rect x="15" y="18" width="3" height="2" fill="#3a2c10" />
      <rect x="16" y="18" width="1" height="1" fill="#f4d042" />
      <rect x="14" y="16" width="1" height="1" fill="#ffe890" opacity="0.7" />

      <!-- Fluttering pages, left -->
      <rect x="0" y="13" width="5" height="3" fill="#23413e" />
      <rect x="0" y="13" width="5" height="1" fill="#2e524e" />
      <polygon points="0,16 4,15 3,20 -1,18" fill="#cfc7ad" />
      <polygon points="0,16 4,15 3,18 -1,17" fill="#e0d8be" opacity="0.6" />
      <polygon points="2,18 5,18 4,22 1,21" fill="#bcb49a" />

      <!-- Quill / candle, right -->
      <rect x="27" y="14" width="5" height="3" fill="#23413e" />
      <rect x="27" y="14" width="5" height="1" fill="#2e524e" />
      <rect x="29" y="6" width="3" height="10" fill="#6a5020" />
      <rect x="29" y="6" width="1" height="10" fill="#8a6a2a" />
      <rect x="28" y="3" width="5" height="4" fill="#5a4418" />
      <rect x="28" y="3" width="5" height="1" fill="#8a6a2a" />
      <rect x="28" y="4" width="4" height="3" fill="#cfc7ad" />
      <rect x="28" y="4" width="4" height="1" fill="#e8e0c4" />
      <rect x="29" y="5" width="3" height="1" fill="#9a9278" />
      <rect x="29" y="3" width="1" height="1" fill="#fff4d0" />

      <!-- Cover legs -->
      <rect x="8" y="26" width="7" height="9" fill="#162e2c" />
      <rect x="8" y="26" width="1" height="9" fill="#1e3a38" />
      <rect x="17" y="26" width="7" height="9" fill="#132624" />
      <rect x="23" y="26" width="1" height="9" fill="#0f201e" />
      <rect x="8" y="33" width="7" height="2" fill="#0a1a18" />
      <rect x="17" y="33" width="7" height="2" fill="#0a1a18" />
    </svg>
