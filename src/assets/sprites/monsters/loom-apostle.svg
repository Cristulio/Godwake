<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 34"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Loom-Apostle"
    >
      <!-- Arcane backlight + ground shadow -->
      <ellipse cx="12" cy="18" rx="12" ry="16" fill="#5a4a8a" opacity="0.08" />
      <ellipse cx="12" cy="32" rx="8" ry="1.4" fill="#000" opacity="0.4" />

      <!-- Pointed hood — violet ramp, key light upper-left -->
      <polygon points="12,1 18,9 6,9" fill="#4a3a5a" />
      <polygon points="12,3 16,9 8,9" fill="#2a2038" />
      <polygon points="12,1 9,9 6,9" fill="#5a4a6c" opacity="0.6" />
      <polygon points="12,1 15,9 17,9" fill="#1a1428" opacity="0.6" />
      <!-- Shadowed face + cold eye glints -->
      <rect x="10" y="6" width="4" height="3" fill="#1a1428" />
      <rect x="10" y="6" width="1" height="2" fill="#e8e0f4" opacity="0.55" />
      <rect x="13" y="6" width="1" height="2" fill="#e8e0f4" opacity="0.55" />

      <!-- Robe — violet ramp, lit left + cool right rim -->
      <rect x="5" y="9" width="14" height="17" fill="#4a3a5a" />
      <rect x="5" y="9" width="14" height="1" fill="#5a4a6c" />
      <rect x="5" y="9" width="2" height="17" fill="#5a4a6c" />
      <rect x="5" y="9" width="1" height="17" fill="#6a5a7c" />
      <rect x="17" y="9" width="2" height="17" fill="#2a2038" />
      <rect x="11" y="10" width="2" height="16" fill="#5a4a6c" />
      <rect x="8" y="11" width="1" height="14" fill="#3a2e48" />
      <rect x="15" y="11" width="1" height="14" fill="#3a2e48" />
      <!-- Robe dither -->
      <rect x="9" y="16" width="1" height="1" fill="#3a2e48" />
      <rect x="14" y="20" width="1" height="1" fill="#5a4a6c" />

      <!-- Left arm + pink-glowing hand -->
      <rect x="3" y="13" width="3" height="9" fill="#4a3a5a" />
      <rect x="3" y="13" width="1" height="9" fill="#5a4a6c" />
      <rect x="2" y="20" width="3" height="2" fill="#b06a8a" />
      <rect x="1" y="21" width="2" height="2" fill="#c47a9a" />
      <rect x="1" y="21" width="1" height="1" fill="#e8a8c0" opacity="0.7" />

      <!-- Right arm + suspended spindle -->
      <rect x="18" y="12" width="2" height="2" fill="#4a3a5a" />
      <rect x="19" y="10" width="2" height="2" fill="#8a6a2a" />
      <line x1="20" y1="11" x2="20" y2="20" stroke="#8a6a2a" stroke-width="0.6" />
      <!-- Spindle bob — gold ramp + radiant glow + specular -->
      <ellipse cx="20" cy="21" rx="3.2" ry="2.2" fill="#6a5020" opacity="0.5" />
      <ellipse cx="20" cy="21" rx="2.4" ry="1.8" fill="#b08840" />
      <ellipse cx="20" cy="20.5" rx="1.4" ry="1" fill="#f4d042" />
      <rect x="19" y="20" width="2" height="1" fill="#f4f0c0" />
      <rect x="20" y="20" width="1" height="1" fill="#ffffff" />
      <!-- Thread-light motes -->
      <rect x="18" y="22" width="1" height="1" fill="#f4d042" opacity="0.7" />
      <rect x="21" y="22" width="1" height="1" fill="#f4d042" opacity="0.7" />
      <rect x="20" y="24" width="1" height="1" fill="#f4d042" opacity="0.55" />

      <!-- Hem -->
      <rect x="5" y="26" width="14" height="2" fill="#2a2038" />
      <rect x="5" y="26" width="14" height="1" fill="#3a2e48" />
      <polygon points="5,28 7,32 9,28" fill="#4a3a5a" />
      <polygon points="9,28 11,32 13,28" fill="#4a3a5a" />
      <polygon points="13,28 15,32 17,28" fill="#4a3a5a" />
      <rect x="8" y="32" width="3" height="2" fill="#1a1428" />
      <rect x="13" y="32" width="3" height="2" fill="#1a1428" />
    </svg>
