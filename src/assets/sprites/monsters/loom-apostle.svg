<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 45"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Loom-Apostle"
    >
      <!-- Loom-light backlight + ground shadow -->
      <ellipse cx="16" cy="21" rx="15" ry="20" fill="#8a6ad0" opacity="0.07" />
      <ellipse cx="16" cy="43.6" rx="10" ry="1.7" fill="#000" opacity="0.4" />

      <!-- ── The hand-loom — a frame carried like a holy relic, drawn behind ── -->
      <rect x="20" y="2" width="11" height="3" fill="#150d08" />
      <rect x="21" y="3" width="9" height="1" fill="#5a3a22" />
      <rect x="21" y="3" width="4" height="1" fill="#7a5230" />
      <rect x="20" y="2" width="3" height="22" fill="#150d08" />
      <rect x="21" y="3" width="1" height="20" fill="#5a3a22" />
      <rect x="28" y="2" width="3" height="22" fill="#150d08" />
      <rect x="29" y="3" width="1" height="20" fill="#4a3018" />
      <rect x="20" y="22" width="11" height="3" fill="#150d08" />
      <rect x="21" y="23" width="9" height="1" fill="#4a3018" />
      <!-- the warp — gold threads strung in the frame -->
      <rect x="23" y="4" width="1" height="19" fill="#c4a430" />
      <rect x="25" y="4" width="1" height="19" fill="#f4d042" />
      <rect x="27" y="4" width="1" height="19" fill="#9a7e2e" />
      <rect x="25" y="4" width="1" height="5" fill="#fff4b0" />
      <!-- the weft — one row half-woven -->
      <rect x="22" y="12" width="7" height="1" fill="#e8d4ff" opacity="0.8" />
      <rect x="22" y="13" width="4" height="1" fill="#a48ee0" opacity="0.7" />

      <!-- ── Cowl — violet wool, woven border ── -->
      <rect x="8" y="1" width="13" height="4" fill="#150d08" />
      <rect x="9" y="2" width="11" height="3" fill="#4a3a5a" />
      <rect x="9" y="2" width="5" height="1" fill="#5a4a6c" />
      <rect x="6" y="5" width="17" height="8" fill="#150d08" />
      <rect x="7" y="6" width="15" height="6" fill="#4a3a5a" />
      <rect x="7" y="6" width="15" height="1" fill="#5a4a6c" />
      <rect x="7" y="6" width="3" height="6" fill="#544466" />
      <rect x="7" y="6" width="1" height="4" fill="#645478" />
      <rect x="19" y="7" width="3" height="5" fill="#3a2e48" />
      <rect x="21" y="8" width="1" height="4" fill="#2e2438" />
      <!-- woven gold border on the cowl -->
      <rect x="7" y="11" width="15" height="1" fill="#9a7e2e" />
      <rect x="7" y="11" width="5" height="1" fill="#c4a430" />

      <!-- ── Face hollow — thread-wrapped, eyes stitched OPEN ── -->
      <rect x="9" y="7" width="11" height="5" fill="#1a1428" />
      <rect x="10" y="8" width="9" height="4" fill="#241c34" />
      <!-- bandage threads across the face -->
      <rect x="10" y="9" width="9" height="1" fill="#5a4a6c" opacity="0.7" />
      <rect x="10" y="11" width="9" height="1" fill="#4a3a5a" opacity="0.6" />
      <!-- the stitched-open eyes — gold thread holds the lids -->
      <rect x="11" y="9" width="3" height="2" fill="#0e0a16" />
      <rect x="16" y="9" width="3" height="2" fill="#0e0a16" />
      <rect x="11" y="9" width="2" height="1" fill="#f4d042" />
      <rect x="16" y="9" width="2" height="1" fill="#c4a430" />
      <rect x="11" y="9" width="1" height="1" fill="#fff4b0" />
      <rect x="16" y="9" width="1" height="1" fill="#ffe88a" />
      <!-- stitch ticks above and below each eye -->
      <rect x="12" y="8" width="1" height="1" fill="#c4a430" />
      <rect x="17" y="8" width="1" height="1" fill="#9a7e2e" />
      <rect x="12" y="11" width="1" height="1" fill="#c4a430" />
      <rect x="17" y="11" width="1" height="1" fill="#9a7e2e" />

      <!-- ── Mantle — heavy woven stole, pattern still on the loom ── -->
      <rect x="4" y="13" width="24" height="4" fill="#150d08" />
      <rect x="5" y="14" width="22" height="2" fill="#4a3a5a" />
      <rect x="5" y="14" width="22" height="1" fill="#5a4a6c" />
      <rect x="5" y="14" width="5" height="1" fill="#645478" />
      <rect x="23" y="14" width="4" height="2" fill="#3a2e48" />

      <!-- ── Robe — violet wool, half its pattern MISSING (unwoven) ── -->
      <rect x="6" y="17" width="20" height="17" fill="#150d08" />
      <rect x="7" y="18" width="18" height="15" fill="#3e3050" />
      <rect x="7" y="18" width="18" height="1" fill="#544466" />
      <rect x="7" y="18" width="3" height="14" fill="#4a3a5a" />
      <rect x="7" y="18" width="1" height="10" fill="#5a4a6c" />
      <rect x="22" y="18" width="3" height="14" fill="#2e2438" />
      <rect x="24" y="19" width="1" height="13" fill="#241c2c" />
      <!-- the woven half — patterned with gold thread glyphs -->
      <rect x="8" y="20" width="3" height="1" fill="#c4a430" />
      <rect x="9" y="22" width="2" height="1" fill="#9a7e2e" />
      <rect x="8" y="25" width="3" height="1" fill="#c4a430" opacity="0.8" />
      <rect x="9" y="28" width="2" height="1" fill="#9a7e2e" opacity="0.7" />
      <rect x="12" y="21" width="1" height="1" fill="#f4d042" />
      <rect x="12" y="26" width="1" height="1" fill="#c4a430" />
      <!-- the unwoven half — warp threads exposed, no cloth between -->
      <rect x="15" y="19" width="9" height="13" fill="#1a1428" />
      <rect x="16" y="19" width="1" height="13" fill="#544466" />
      <rect x="18" y="19" width="1" height="13" fill="#4a3a5a" />
      <rect x="20" y="19" width="1" height="13" fill="#544466" />
      <rect x="22" y="19" width="1" height="13" fill="#3a2e48" />
      <rect x="16" y="19" width="1" height="4" fill="#645478" />
      <!-- the shuttle still in the cloth, mid-pass -->
      <rect x="14" y="23" width="6" height="3" fill="#150d08" />
      <rect x="15" y="24" width="4" height="1" fill="#8a6238" />
      <rect x="15" y="24" width="2" height="1" fill="#a8814a" />
      <!-- thread from the shuttle to the loom it carries -->
      <rect x="20" y="24" width="2" height="1" fill="#f4d042" opacity="0.7" />
      <rect x="22" y="23" width="2" height="1" fill="#c4a430" opacity="0.6" />

      <!-- ── Left arm — presenting the woven half ── -->
      <rect x="2" y="17" width="6" height="10" fill="#150d08" />
      <rect x="3" y="18" width="4" height="8" fill="#3e3050" />
      <rect x="3" y="18" width="1" height="8" fill="#4a3a5a" />
      <rect x="6" y="18" width="1" height="8" fill="#2e2438" />
      <rect x="2" y="26" width="5" height="3" fill="#150d08" />
      <rect x="3" y="27" width="3" height="1" fill="#645478" />
      <!-- a spool held out -->
      <rect x="2" y="29" width="4" height="4" fill="#150d08" />
      <rect x="3" y="30" width="2" height="2" fill="#c4a430" />
      <rect x="3" y="30" width="1" height="1" fill="#f4d042" />

      <!-- ── Right arm — under the loom frame ── -->
      <rect x="22" y="17" width="5" height="8" fill="#150d08" />
      <rect x="23" y="18" width="3" height="6" fill="#2e2438" />
      <rect x="23" y="18" width="1" height="6" fill="#3a2e48" />

      <!-- ── Cord belt with hanging needles ── -->
      <rect x="7" y="34" width="18" height="2" fill="#150d08" />
      <rect x="8" y="34" width="16" height="1" fill="#645478" />
      <rect x="11" y="36" width="1" height="3" fill="#8a91a4" />
      <rect x="14" y="36" width="1" height="2" fill="#6a7080" />
      <rect x="17" y="36" width="1" height="3" fill="#8a91a4" />

      <!-- ── Skirt — hem unravelling into loose warp ── -->
      <rect x="7" y="36" width="18" height="6" fill="#150d08" />
      <rect x="8" y="37" width="16" height="4" fill="#3a2e48" />
      <rect x="8" y="37" width="16" height="1" fill="#4a3a5a" />
      <rect x="8" y="37" width="3" height="4" fill="#42344e" />
      <rect x="21" y="37" width="3" height="4" fill="#2e2438" />
      <rect x="12" y="38" width="1" height="3" fill="#291f30" />
      <rect x="16" y="38" width="1" height="3" fill="#241c2c" />
      <rect x="19" y="38" width="1" height="3" fill="#291f30" />
      <!-- hanging warp threads below the hem -->
      <rect x="9" y="41" width="1" height="3" fill="#544466" />
      <rect x="12" y="41" width="1" height="2" fill="#4a3a5a" />
      <rect x="15" y="41" width="1" height="3" fill="#544466" />
      <rect x="18" y="41" width="1" height="2" fill="#3a2e48" />
      <rect x="21" y="41" width="1" height="3" fill="#4a3a5a" />
      <!-- one gold thread among them -->
      <rect x="13" y="41" width="1" height="3" fill="#c4a430" />
      <rect x="13" y="41" width="1" height="1" fill="#f4d042" />

      <!-- ── Loom motes — lint of fate ── -->
      <rect x="3" y="10" width="1" height="1" fill="#a48ee0" opacity="0.45" />
      <rect x="29" y="27" width="1" height="1" fill="#c4a430" opacity="0.5" />
      <rect x="4" y="35" width="1" height="1" fill="#8a6ad0" opacity="0.35" />
      <rect x="27" y="34" width="1" height="1" fill="#f4d042" opacity="0.4" />
    </svg>
