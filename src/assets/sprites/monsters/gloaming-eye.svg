<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 18 18"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
    aria-label="Gloaming Eye"
    >
      <!-- floating cyclopean eye -->
      <ellipse cx="9" cy="8" rx="7" ry="6" fill="#2a2438" />
      <ellipse cx="9" cy="8" rx="6" ry="5" fill="#3a3450" />
      <ellipse cx="9" cy="8" rx="4.5" ry="3.8" fill="#cdd3e6" />

      <!-- narrowed slit pupil -->
      <ellipse cx="9" cy="8" rx="1.3" ry="3" fill="#15101e" />
      <rect x="9" y="6" width="1" height="1" fill="#e8d27a" />
      <rect x="8" y="5" width="1" height="1" fill="#ffffff" opacity="0.6" />

      <!-- grey lash-tendrils -->
      <rect x="2" y="13" width="1" height="3" fill="#3a3450" />
      <rect x="1" y="15" width="1" height="1" fill="#3a3450" opacity="0.7" />
      <rect x="8" y="14" width="1" height="3" fill="#3a3450" />
      <rect x="15" y="13" width="1" height="3" fill="#3a3450" />
      <rect x="16" y="15" width="1" height="1" fill="#3a3450" opacity="0.7" />

      <!-- base shadow -->
      <ellipse cx="9" cy="17" rx="6" ry="1" fill="#1a1626" />
    </svg>
