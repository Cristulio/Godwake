<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 40 52"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Mirror of Pride"
    >
      <!-- Cold vanity backlight + ground shadow -->
      <ellipse cx="20" cy="28" rx="18" ry="20" fill="#8a5ad0" opacity="0.05" />
      <ellipse cx="20" cy="50.3" rx="13" ry="1.8" fill="#000" opacity="0.44" />

      <!-- Crest — the gilt crown of the frame, insufferably proud -->
      <rect x="14" y="0" width="12" height="4" fill="#150d08" />
      <rect x="15" y="1" width="10" height="2" fill="#9a7232" />
      <rect x="15" y="1" width="10" height="1" fill="#c89a48" />
      <rect x="17" y="1" width="2" height="1" fill="#ecc46a" />
      <rect x="19" y="0" width="2" height="2" fill="#150d08" />
      <rect x="19" y="0" width="2" height="1" fill="#ecc46a" />
      <rect x="11" y="1" width="4" height="3" fill="#150d08" />
      <rect x="12" y="2" width="2" height="1" fill="#c89a48" />
      <rect x="25" y="1" width="4" height="3" fill="#150d08" />
      <rect x="26" y="2" width="2" height="1" fill="#9a7232" />
      <!-- crest jewel -->
      <rect x="19" y="2" width="2" height="2" fill="#7e1f2c" />
      <rect x="19" y="2" width="1" height="1" fill="#c84a64" />

      <!-- The frame — a full-length glass, stood up and breathing -->
      <rect x="8" y="4" width="24" height="40" fill="#150d08" />
      <rect x="9" y="5" width="22" height="38" fill="#9a7232" />
      <rect x="9" y="5" width="22" height="1" fill="#c89a48" />
      <rect x="9" y="5" width="8" height="1" fill="#ecc46a" />
      <rect x="9" y="5" width="2" height="37" fill="#b08438" />
      <rect x="9" y="5" width="1" height="20" fill="#c89a48" />
      <rect x="28" y="5" width="3" height="38" fill="#7a5a26" />
      <rect x="30" y="5" width="1" height="38" fill="#5e451c" />
      <!-- frame scrollwork knots -->
      <rect x="9" y="14" width="2" height="2" fill="#ecc46a" />
      <rect x="29" y="14" width="2" height="2" fill="#9a7232" />
      <rect x="9" y="30" width="2" height="2" fill="#c89a48" />
      <rect x="29" y="30" width="2" height="2" fill="#7a5a26" />

      <!-- The glass — black, and always flattering -->
      <rect x="12" y="7" width="16" height="34" fill="#150d08" />
      <rect x="13" y="8" width="14" height="32" fill="#16121c" />
      <rect x="13" y="8" width="14" height="1" fill="#241c2e" />
      <rect x="13" y="8" width="2" height="32" fill="#1c1624" />
      <rect x="25" y="8" width="2" height="32" fill="#120e18" />
      <!-- the sheen running diagonally — glass admitting it is glass -->
      <rect x="15" y="9" width="1" height="4" fill="#3a2e48" />
      <rect x="16" y="12" width="1" height="4" fill="#2e2438" />
      <rect x="17" y="15" width="1" height="4" fill="#3a2e48" opacity="0.8" />
      <rect x="18" y="18" width="1" height="4" fill="#2e2438" opacity="0.7" />
      <rect x="14" y="8" width="1" height="3" fill="#4a3c5e" />

      <!-- The reflection — you, at your very best, which is the lie -->
      <rect x="17" y="11" width="6" height="5" fill="#241c2e" />
      <rect x="18" y="12" width="4" height="3" fill="#d4ad78" opacity="0.6" />
      <rect x="18" y="12" width="4" height="1" fill="#ecd0a0" opacity="0.6" />
      <!-- its golden crown you never wore -->
      <rect x="18" y="10" width="4" height="2" fill="#c89a48" opacity="0.7" />
      <rect x="19" y="10" width="1" height="1" fill="#ecc46a" opacity="0.8" />
      <!-- its eyes — serene, admiring you back -->
      <rect x="18" y="13" width="1" height="1" fill="#c4b0f0" opacity="0.8" />
      <rect x="21" y="13" width="1" height="1" fill="#c4b0f0" opacity="0.8" />
      <!-- the figure below, taller and straighter than you stand -->
      <rect x="17" y="16" width="6" height="12" fill="#2e2438" opacity="0.85" />
      <rect x="18" y="17" width="4" height="10" fill="#503d78" opacity="0.6" />
      <rect x="18" y="17" width="2" height="10" fill="#6a52a0" opacity="0.5" />
      <rect x="19" y="19" width="2" height="1" fill="#ecc46a" opacity="0.55" />
      <rect x="19" y="23" width="2" height="1" fill="#c89a48" opacity="0.45" />
      <!-- the crack you put in it, climbing -->
      <rect x="22" y="30" width="1" height="4" fill="#8a5ad0" />
      <rect x="21" y="27" width="1" height="3" fill="#a87ae0" />
      <rect x="22" y="33" width="1" height="1" fill="#c4b0f0" />
      <rect x="23" y="25" width="1" height="3" fill="#5a3a8a" opacity="0.8" />
      <rect x="20" y="33" width="2" height="1" fill="#5a3a8a" opacity="0.7" />

      <!-- Shard-arms — the mirror arming its own reflection -->
      <rect x="2" y="16" width="8" height="4" fill="#150d08" />
      <rect x="3" y="17" width="6" height="2" fill="#241c2e" />
      <rect x="3" y="17" width="6" height="1" fill="#3a2e48" />
      <!-- shard-blade held out -->
      <rect x="0" y="10" width="4" height="8" fill="#150d08" />
      <rect x="1" y="11" width="2" height="6" fill="#4a3c5e" />
      <rect x="1" y="11" width="1" height="6" fill="#6a5a86" />
      <rect x="1" y="11" width="1" height="2" fill="#a896c8" />
      <rect x="1" y="9" width="2" height="2" fill="#150d08" />
      <rect x="1" y="9" width="1" height="1" fill="#c4b0f0" />
      <rect x="30" y="18" width="8" height="4" fill="#150d08" />
      <rect x="31" y="19" width="6" height="2" fill="#1c1624" />
      <rect x="31" y="19" width="6" height="1" fill="#2e2438" />
      <!-- second shard, raised -->
      <rect x="36" y="11" width="4" height="9" fill="#150d08" />
      <rect x="37" y="12" width="2" height="7" fill="#3a2e48" />
      <rect x="38" y="12" width="1" height="7" fill="#241c2e" />
      <rect x="37" y="12" width="1" height="3" fill="#8a78ac" />
      <rect x="37" y="10" width="2" height="2" fill="#150d08" />
      <rect x="37" y="10" width="1" height="1" fill="#e8e0f8" />

      <!-- Clawed feet of the frame -->
      <rect x="8" y="43" width="8" height="4" fill="#150d08" />
      <rect x="9" y="44" width="6" height="2" fill="#9a7232" />
      <rect x="9" y="44" width="3" height="1" fill="#c89a48" />
      <rect x="24" y="43" width="8" height="4" fill="#150d08" />
      <rect x="25" y="44" width="6" height="2" fill="#7a5a26" />
      <rect x="25" y="44" width="2" height="1" fill="#9a7232" />
      <!-- gilt talons gripping the trial floor -->
      <rect x="6" y="46" width="4" height="3" fill="#150d08" />
      <rect x="7" y="47" width="2" height="1" fill="#c89a48" />
      <rect x="12" y="47" width="3" height="2" fill="#150d08" />
      <rect x="13" y="47" width="1" height="1" fill="#ecc46a" />
      <rect x="25" y="47" width="3" height="2" fill="#150d08" />
      <rect x="26" y="47" width="1" height="1" fill="#9a7232" />
      <rect x="30" y="46" width="4" height="3" fill="#150d08" />
      <rect x="31" y="47" width="2" height="1" fill="#c89a48" />

      <!-- Vanity-light catching the dust -->
      <rect x="5" y="8" width="1" height="1" fill="#c4b0f0" opacity="0.45" />
      <rect x="34" y="26" width="1" height="1" fill="#a87ae0" opacity="0.4" />
      <rect x="4" y="34" width="1" height="1" fill="#8a5ad0" opacity="0.35" />
      <rect x="35" y="6" width="1" height="1" fill="#ecc46a" opacity="0.4" />
    </svg>
