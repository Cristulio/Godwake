<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 40"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Ashen Chorister"
    >
      <!-- soot halo -->
      <circle cx="12" cy="2" r="6" fill="none" stroke="#4a4348" stroke-width="1.2" />
      <circle cx="12" cy="2" r="6" fill="none" stroke="#6a6058" stroke-width="0.4" />

      <!-- ash head, mouth open in song -->
      <rect x="8" y="3" width="8" height="8" fill="#b8b0a8" />
      <rect x="8" y="3" width="8" height="1" fill="#8a8278" />
      <rect x="9" y="5" width="2" height="1" fill="#2a2428" />
      <rect x="13" y="5" width="2" height="1" fill="#2a2428" />
      <rect x="10" y="8" width="4" height="3" fill="#2a2428" />
      <rect x="11" y="9" width="2" height="2" fill="#8a3848" opacity="0.6" />

      <!-- ashen robe -->
      <polygon points="6,12 18,12 21,38 3,38" fill="#6a6058" />
      <polygon points="6,12 18,12 19,24 5,24" fill="#7a7068" />
      <rect x="11" y="12" width="2" height="24" fill="#8a8078" />

      <!-- soot-gold stole -->
      <rect x="9" y="12" width="2" height="20" fill="#7a6838" opacity="0.7" />
      <rect x="13" y="12" width="2" height="20" fill="#7a6838" opacity="0.7" />

      <!-- raised hand casting hymn-fire -->
      <rect x="18" y="13" width="3" height="3" fill="#b8b0a8" />
      <rect x="20" y="10" width="3" height="3" fill="#b8b0a8" />
      <circle cx="22" cy="8" r="2.5" fill="#f4e8c0" opacity="0.85" />
      <circle cx="22" cy="8" r="1.2" fill="#fff8e0" />
      <rect x="3" y="14" width="3" height="9" fill="#6a6058" />

      <!-- hem -->
      <polygon points="3,38 6,34 9,38" fill="#4a4348" />
      <polygon points="9,38 12,34 15,38" fill="#4a4348" />
      <polygon points="15,38 18,34 21,38" fill="#4a4348" />
    </svg>
