<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 34"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Ink-Drowned Scholar"
    >
      <!-- Sickly ink backlight + ground shadow -->
      <ellipse cx="12" cy="17" rx="11" ry="15" fill="#3a6a2a" opacity="0.07" />
      <ellipse cx="12" cy="33" rx="8" ry="1.4" fill="#000" opacity="0.4" />

      <!-- Hood / head hollow — near-black ramp -->
      <rect x="8" y="2" width="9" height="9" fill="#0e0e18" />
      <rect x="9" y="1" width="7" height="2" fill="#1e1e2e" />
      <rect x="9" y="1" width="7" height="1" fill="#2a2a3a" />
      <rect x="8" y="2" width="2" height="8" fill="#16161f" />
      <rect x="8" y="2" width="1" height="6" fill="#20202c" />
      <rect x="15" y="2" width="2" height="8" fill="#0a0a12" />

      <!-- Glowing eyes — toxic green + spark -->
      <rect x="10" y="5" width="2" height="2" fill="#7aba5a" />
      <rect x="13" y="5" width="2" height="2" fill="#7aba5a" />
      <rect x="10" y="5" width="1" height="1" fill="#c4f0a0" />
      <rect x="13" y="5" width="1" height="1" fill="#c4f0a0" />
      <rect x="10" y="6" width="2" height="1" fill="#4a7a32" />
      <rect x="13" y="6" width="2" height="1" fill="#4a7a32" />
      <rect x="11" y="8" width="3" height="1" fill="#3a5a2a" opacity="0.8" />

      <!-- Robe body — ink-black ramp, faint lit fold -->
      <rect x="6" y="11" width="12" height="16" fill="#10101a" />
      <rect x="6" y="11" width="12" height="1" fill="#22222e" />
      <rect x="6" y="11" width="2" height="15" fill="#16161f" />
      <rect x="6" y="11" width="1" height="14" fill="#20202c" />
      <rect x="11" y="11" width="2" height="16" fill="#1a1a28" />
      <rect x="16" y="11" width="2" height="15" fill="#0a0a12" />
      <!-- Wet ink stains + dither -->
      <rect x="9" y="12" width="2" height="3" fill="#1e3a1a" opacity="0.7" />
      <rect x="13" y="16" width="2" height="3" fill="#1e3a1a" opacity="0.55" />
      <rect x="8" y="20" width="2" height="2" fill="#1e3a1a" opacity="0.45" />
      <rect x="10" y="17" width="1" height="1" fill="#2a2a38" />
      <rect x="14" y="22" width="1" height="1" fill="#0a0a12" />

      <!-- Dripping ink sleeves -->
      <rect x="3" y="13" width="3" height="4" fill="#12121e" />
      <rect x="3" y="13" width="1" height="4" fill="#1e1e2c" />
      <rect x="1" y="15" width="3" height="2" fill="#0a0a12" />
      <rect x="18" y="12" width="4" height="2" fill="#12121e" />
      <rect x="18" y="12" width="4" height="1" fill="#1e1e2c" />
      <rect x="20" y="13" width="3" height="3" fill="#0a0a12" />
      <rect x="22" y="15" width="2" height="3" fill="#161624" />
      <rect x="21" y="17" width="2" height="2" fill="#1e3a1a" opacity="0.6" />

      <!-- Tattered hem -->
      <rect x="6" y="27" width="12" height="3" fill="#0a0a12" />
      <rect x="6" y="27" width="12" height="1" fill="#16161f" />
      <polygon points="6,30 9,34 12,30" fill="#12121e" />
      <polygon points="12,30 15,34 18,30" fill="#0e0e18" />
      <rect x="4" y="32" width="16" height="2" fill="#0a1822" opacity="0.6" />
      <rect x="7" y="31" width="2" height="1" fill="#1e3a1a" opacity="0.4" />
    </svg>
