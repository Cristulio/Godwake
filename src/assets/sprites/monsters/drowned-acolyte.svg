<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 43"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Drowned Acolyte"
    >
      <!-- Drowned-light backlight + ground shadow -->
      <ellipse cx="16" cy="20" rx="15" ry="19" fill="#356060" opacity="0.09" />
      <ellipse cx="16" cy="41.6" rx="10" ry="1.6" fill="#000" opacity="0.38" />

      <!-- ── Waterlogged hood — heavy, dripping ── -->
      <rect x="10" y="0" width="12" height="3" fill="#150d08" />
      <rect x="11" y="1" width="10" height="2" fill="#2a4a4a" />
      <rect x="11" y="1" width="4" height="1" fill="#356060" />
      <rect x="8" y="3" width="16" height="7" fill="#150d08" />
      <rect x="9" y="4" width="14" height="6" fill="#2a4a4a" />
      <rect x="9" y="4" width="14" height="1" fill="#356060" />
      <rect x="9" y="4" width="3" height="6" fill="#2f5454" />
      <rect x="9" y="4" width="1" height="4" fill="#3c6c6c" />
      <rect x="20" y="5" width="3" height="5" fill="#1e3838" />
      <rect x="22" y="6" width="1" height="4" fill="#16302e" />
      <!-- water weight sagging the brim -->
      <rect x="9" y="9" width="14" height="1" fill="#16302e" />
      <!-- drips from the hood edge -->
      <rect x="10" y="10" width="1" height="2" fill="#5a9a9a" opacity="0.6" />
      <rect x="21" y="11" width="1" height="1" fill="#5a9a9a" opacity="0.5" />

      <!-- ── Drowned face — bloated pale, lips gone blue ── -->
      <rect x="10" y="10" width="12" height="7" fill="#150d08" />
      <rect x="11" y="11" width="10" height="5" fill="#9aa6a0" />
      <rect x="11" y="11" width="10" height="1" fill="#aab6b0" />
      <rect x="11" y="11" width="3" height="5" fill="#a2aea8" />
      <rect x="11" y="11" width="1" height="3" fill="#b8c4be" />
      <rect x="18" y="12" width="3" height="4" fill="#7a8a86" />
      <rect x="20" y="13" width="1" height="3" fill="#647672" />
      <!-- waterline stain across the brow -->
      <rect x="11" y="11" width="10" height="1" fill="#647672" opacity="0.6" />
      <!-- drowned eyes — pale, lids half-down -->
      <rect x="12" y="12" width="3" height="2" fill="#22302e" />
      <rect x="17" y="12" width="3" height="2" fill="#22302e" />
      <rect x="12" y="12" width="3" height="1" fill="#3c5450" />
      <rect x="17" y="12" width="3" height="1" fill="#324844" />
      <rect x="12" y="13" width="2" height="1" fill="#c8d8d4" />
      <rect x="17" y="13" width="2" height="1" fill="#a8bcb8" />
      <rect x="12" y="13" width="1" height="1" fill="#e8f4f0" />
      <!-- blue lips, slightly open — water moves in the mouth -->
      <rect x="13" y="15" width="6" height="1" fill="#3c5468" />
      <rect x="14" y="15" width="2" height="1" fill="#54708a" />

      <!-- ── Shoulders — sodden vestment, clinging ── -->
      <rect x="5" y="17" width="22" height="4" fill="#150d08" />
      <rect x="6" y="18" width="20" height="2" fill="#2a4a4a" />
      <rect x="6" y="18" width="20" height="1" fill="#356060" />
      <rect x="6" y="18" width="5" height="1" fill="#3c6c6c" />
      <rect x="22" y="18" width="4" height="2" fill="#1e3838" />

      <!-- ── Robe — heavy wet cloth, salt-tide rings ── -->
      <rect x="6" y="21" width="20" height="14" fill="#150d08" />
      <rect x="7" y="22" width="18" height="12" fill="#234242" />
      <rect x="7" y="22" width="18" height="1" fill="#2f5454" />
      <rect x="7" y="22" width="3" height="11" fill="#2a4a4a" />
      <rect x="7" y="22" width="1" height="8" fill="#356060" />
      <rect x="22" y="22" width="3" height="11" fill="#1a3232" />
      <rect x="24" y="23" width="1" height="10" fill="#142828" />
      <!-- salt-tide rings rising up the cloth -->
      <rect x="8" y="31" width="16" height="1" fill="#7a8a86" opacity="0.5" />
      <rect x="8" y="28" width="16" height="1" fill="#647672" opacity="0.4" />
      <rect x="8" y="25" width="16" height="1" fill="#506260" opacity="0.35" />
      <!-- drowned-order knot sigil on the breast -->
      <rect x="14" y="23" width="4" height="4" fill="#150d08" />
      <rect x="15" y="24" width="2" height="2" fill="#356060" />
      <rect x="15" y="24" width="1" height="1" fill="#5a9a9a" />
      <!-- center fold -->
      <rect x="16" y="27" width="1" height="7" fill="#16302e" />
      <!-- wet cloth dither -->
      <rect x="10" y="26" width="1" height="1" fill="#2f5454" />
      <rect x="20" y="29" width="1" height="1" fill="#142828" />

      <!-- ── Left arm — offering a waterlogged psalter ── -->
      <rect x="2" y="21" width="6" height="9" fill="#150d08" />
      <rect x="3" y="22" width="4" height="7" fill="#234242" />
      <rect x="3" y="22" width="1" height="7" fill="#2a4a4a" />
      <rect x="6" y="22" width="1" height="7" fill="#1a3232" />
      <rect x="2" y="29" width="5" height="2" fill="#150d08" />
      <rect x="3" y="29" width="3" height="1" fill="#8a9a96" />
      <!-- the swollen psalter -->
      <rect x="1" y="31" width="7" height="6" fill="#150d08" />
      <rect x="2" y="32" width="5" height="4" fill="#5a5244" />
      <rect x="2" y="32" width="5" height="1" fill="#6e6452" />
      <rect x="2" y="32" width="1" height="4" fill="#665c4c" />
      <!-- warped swollen pages -->
      <rect x="3" y="33" width="3" height="2" fill="#9a927c" />
      <rect x="3" y="33" width="2" height="1" fill="#b0a890" />
      <rect x="5" y="34" width="1" height="1" fill="#7e7662" />
      <!-- water seeping from the spine -->
      <rect x="2" y="37" width="1" height="1" fill="#5a9a9a" opacity="0.6" />
      <rect x="5" y="37" width="1" height="2" fill="#5a9a9a" opacity="0.45" />

      <!-- ── Right arm — hanging, fingertips pruned white ── -->
      <rect x="24" y="21" width="6" height="10" fill="#150d08" />
      <rect x="25" y="22" width="4" height="8" fill="#1a3232" />
      <rect x="25" y="22" width="1" height="8" fill="#234242" />
      <rect x="28" y="22" width="1" height="8" fill="#142828" />
      <rect x="25" y="30" width="4" height="3" fill="#150d08" />
      <rect x="26" y="31" width="2" height="1" fill="#8a9a96" />
      <rect x="25" y="32" width="1" height="2" fill="#150d08" />
      <rect x="27" y="32" width="1" height="2" fill="#150d08" />
      <rect x="25" y="32" width="1" height="1" fill="#c8d8d4" />
      <rect x="27" y="32" width="1" height="1" fill="#a8bcb8" />

      <!-- ── Knotted cord — hung with barnacle votives ── -->
      <rect x="7" y="35" width="18" height="2" fill="#150d08" />
      <rect x="8" y="35" width="16" height="1" fill="#3c5450" />
      <rect x="11" y="36" width="2" height="2" fill="#150d08" />
      <rect x="11" y="36" width="1" height="1" fill="#7a8a86" />
      <rect x="19" y="36" width="2" height="2" fill="#150d08" />
      <rect x="19" y="36" width="1" height="1" fill="#647672" />

      <!-- ── Skirt — hem pooling like it is still underwater ── -->
      <rect x="6" y="37" width="20" height="5" fill="#150d08" />
      <rect x="7" y="38" width="18" height="3" fill="#1e3a3a" />
      <rect x="7" y="38" width="18" height="1" fill="#2a4a4a" />
      <rect x="7" y="38" width="3" height="3" fill="#234242" />
      <rect x="22" y="38" width="3" height="3" fill="#142828" />
      <rect x="11" y="38" width="1" height="3" fill="#142828" />
      <rect x="16" y="38" width="1" height="3" fill="#10211f" />
      <rect x="20" y="38" width="1" height="3" fill="#142828" />
      <!-- the puddle it never stops standing in -->
      <ellipse cx="16" cy="41.8" rx="9" ry="1.2" fill="#356060" opacity="0.5" />
      <ellipse cx="16" cy="42" rx="6" ry="0.8" fill="#5a9a9a" opacity="0.4" />

      <!-- ── Bubbles rising — it is always still drowning ── -->
      <rect x="15" y="8" width="1" height="1" fill="#8ad0e0" opacity="0.6" />
      <rect x="18" y="6" width="1" height="1" fill="#5a9a9a" opacity="0.5" />
      <rect x="13" y="4" width="1" height="1" fill="#8ad0e0" opacity="0.4" />
      <rect x="25" y="15" width="1" height="1" fill="#5a9a9a" opacity="0.4" />
      <rect x="4" y="13" width="1" height="1" fill="#8ad0e0" opacity="0.35" />
    </svg>
