<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 28 34"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Glasswright-Duelist"
    >
      <!-- Cool refracted backlight + ground shadow -->
      <ellipse cx="14" cy="17" rx="13" ry="16" fill="#5a8aa8" opacity="0.08" />
      <ellipse cx="14" cy="31" rx="10" ry="1.8" fill="#0a1018" opacity="0.4" />

      <!-- Faceted glass head — translucent ramp + refraction lines -->
      <rect x="10" y="2" width="8" height="10" fill="#aec4d2" />
      <rect x="10" y="2" width="8" height="1" fill="#eef6fa" />
      <rect x="10" y="2" width="3" height="10" fill="#c8d8e2" />
      <rect x="10" y="2" width="1" height="8" fill="#eef6fa" />
      <rect x="16" y="3" width="2" height="9" fill="#86a0b2" />
      <rect x="17" y="3" width="1" height="9" fill="#6e8a9c" />
      <rect x="10" y="11" width="8" height="1" fill="#7a94a6" />
      <polygon points="14,2 18,7 14,12 10,7" fill="#dfeef6" opacity="0.4" />
      <line x1="11" y1="3" x2="16" y2="11" stroke="#f0f6f9" stroke-width="0.5" opacity="0.7" />
      <line x1="17" y1="3" x2="13" y2="11" stroke="#7a94a6" stroke-width="0.4" opacity="0.6" />
      <!-- Dark eye slits + glint -->
      <rect x="11" y="6" width="2" height="2" fill="#16222a" />
      <rect x="15" y="6" width="2" height="2" fill="#16222a" />
      <rect x="11" y="6" width="1" height="1" fill="#f0f6f9" />
      <rect x="15" y="6" width="1" height="1" fill="#cfe4ee" />

      <!-- Torso — slate-steel ramp + glass inlay -->
      <rect x="9" y="12" width="10" height="13" fill="#33303e" />
      <rect x="9" y="12" width="10" height="1" fill="#4a4658" />
      <rect x="9" y="12" width="2" height="13" fill="#3c3848" />
      <rect x="9" y="12" width="1" height="13" fill="#48445a" />
      <rect x="17" y="13" width="2" height="12" fill="#26242f" />
      <rect x="18" y="13" width="1" height="12" fill="#1e1c26" />
      <rect x="13" y="13" width="2" height="12" fill="#2a2734" />
      <rect x="10" y="14" width="8" height="1" fill="#7fa0b4" opacity="0.6" />
      <rect x="10" y="16" width="1" height="8" fill="#5a8298" opacity="0.5" />
      <rect x="16" y="16" width="1" height="8" fill="#46627a" opacity="0.5" />
      <rect x="11" y="19" width="1" height="1" fill="#48445a" />
      <rect x="15" y="21" width="1" height="1" fill="#1e1c26" />

      <!-- Left arm -->
      <rect x="5" y="13" width="4" height="2" fill="#33303e" />
      <rect x="5" y="13" width="4" height="1" fill="#43404f" />
      <rect x="3" y="14" width="3" height="2" fill="#3c3848" />
      <rect x="2" y="15" width="2" height="3" fill="#33303e" />
      <line x1="2" y1="18" x2="4" y2="25" stroke="#b0cede" stroke-width="0.8" opacity="0.7" />

      <!-- Right arm + glass rapier (specular blade) -->
      <rect x="19" y="13" width="3" height="2" fill="#2a2734" />
      <rect x="22" y="11" width="2" height="3" fill="#3c3848" />
      <line x1="23" y1="11" x2="27" y2="1" stroke="#9ec0d4" stroke-width="1.2" />
      <line x1="23" y1="11" x2="27" y2="1" stroke="#eef6fa" stroke-width="0.5" />
      <polygon points="26,2 28,0 27,3" fill="#f4fbff" />
      <rect x="25" y="4" width="1" height="1" fill="#ffffff" />

      <!-- Legs -->
      <rect x="10" y="25" width="3" height="6" fill="#2a2734" />
      <rect x="10" y="25" width="1" height="6" fill="#36333f" />
      <rect x="15" y="25" width="3" height="6" fill="#242230" />
      <rect x="17" y="25" width="1" height="6" fill="#1c1a26" />
      <rect x="10" y="30" width="4" height="1" fill="#14111a" />
      <rect x="15" y="30" width="4" height="1" fill="#14111a" />

      <!-- Refraction motes -->
      <rect x="6" y="9" width="1" height="1" fill="#eef6fa" opacity="0.6" />
      <rect x="21" y="22" width="1" height="1" fill="#b0cede" opacity="0.5" />
      <rect x="4" y="23" width="1" height="1" fill="#cfe4ee" opacity="0.4" />
    </svg>
