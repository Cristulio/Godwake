<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 42"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Petrified Ambusher"
    >
      <!-- Gallery gloom + a statue's fixed shadow -->
      <ellipse cx="15" cy="23" rx="14" ry="17" fill="#58525c" opacity="0.07" />
      <ellipse cx="15" cy="40.4" rx="11" ry="1.6" fill="#000" opacity="0.42" />

      <!-- Head — a drow face in grey stone, the pose held mid-turn -->
      <rect x="9" y="2" width="12" height="11" fill="#150d08" />
      <rect x="10" y="3" width="10" height="9" fill="#6e6874" />
      <rect x="10" y="3" width="10" height="1" fill="#868090" />
      <rect x="10" y="3" width="4" height="1" fill="#9a94a6" />
      <rect x="10" y="3" width="2" height="8" fill="#787280" />
      <rect x="18" y="4" width="2" height="8" fill="#56505e" />
      <rect x="19" y="5" width="1" height="7" fill="#46404c" />
      <!-- stone hair swept like the day she was posed -->
      <rect x="9" y="1" width="11" height="3" fill="#150d08" />
      <rect x="10" y="2" width="9" height="1" fill="#9a94a6" />
      <rect x="10" y="2" width="4" height="1" fill="#aaa4b6" />
      <rect x="9" y="3" width="1" height="5" fill="#56505e" />
      <!-- long stone ear -->
      <rect x="7" y="5" width="3" height="2" fill="#150d08" />
      <rect x="8" y="5" width="2" height="1" fill="#6e6874" />
      <!-- the eyes — stone, except where the waking shows through -->
      <rect x="11" y="6" width="2" height="2" fill="#3a363e" />
      <rect x="15" y="6" width="2" height="2" fill="#3a363e" />
      <rect x="11" y="6" width="1" height="1" fill="#c83a3a" />
      <rect x="15" y="6" width="1" height="1" fill="#c83a3a" />
      <!-- the crack starting at the jaw -->
      <rect x="12" y="9" width="1" height="2" fill="#2a262e" />
      <rect x="13" y="10" width="3" height="1" fill="#2a262e" />
      <!-- violet skin showing in the split -->
      <rect x="13" y="10" width="1" height="1" fill="#4a3c5e" />

      <!-- Torso — stone armour, the lichen of long patience -->
      <rect x="8" y="13" width="14" height="14" fill="#150d08" />
      <rect x="9" y="14" width="12" height="12" fill="#605a68" />
      <rect x="9" y="14" width="12" height="1" fill="#787280" />
      <rect x="9" y="14" width="5" height="1" fill="#868090" />
      <rect x="9" y="14" width="2" height="12" fill="#6a6472" />
      <rect x="9" y="14" width="1" height="8" fill="#787280" />
      <rect x="18" y="14" width="3" height="12" fill="#4e4856" />
      <rect x="20" y="14" width="1" height="12" fill="#423c4a" />
      <!-- the carved drow mail, mineral now -->
      <rect x="10" y="16" width="10" height="1" fill="#4e4856" />
      <rect x="10" y="19" width="10" height="1" fill="#4e4856" />
      <rect x="10" y="22" width="10" height="1" fill="#4e4856" />
      <rect x="12" y="16" width="2" height="1" fill="#868090" />
      <rect x="16" y="19" width="2" height="1" fill="#868090" />
      <!-- lichen patches -->
      <rect x="9" y="15" width="2" height="2" fill="#3a5a48" />
      <rect x="10" y="15" width="1" height="1" fill="#4a7058" />
      <rect x="18" y="21" width="2" height="2" fill="#2e4838" />
      <!-- THE WAKING — the great crack down the chest, drow inside -->
      <rect x="14" y="14" width="2" height="12" fill="#2a262e" />
      <rect x="14" y="16" width="1" height="3" fill="#4a3c5e" />
      <rect x="15" y="20" width="1" height="3" fill="#4a3c5e" />
      <rect x="14" y="17" width="1" height="1" fill="#5a4a72" />
      <!-- stone flakes mid-slough -->
      <rect x="13" y="18" width="1" height="1" fill="#868090" />
      <rect x="16" y="21" width="1" height="1" fill="#787280" />

      <!-- The waking stone fist — raised, finishing the frozen lunge -->
      <rect x="20" y="12" width="6" height="5" fill="#150d08" />
      <rect x="21" y="13" width="4" height="3" fill="#605a68" />
      <rect x="21" y="13" width="4" height="1" fill="#787280" />
      <rect x="24" y="14" width="1" height="2" fill="#4e4856" />
      <!-- the fist itself, knuckles cracking free -->
      <rect x="23" y="6" width="7" height="7" fill="#150d08" />
      <rect x="24" y="7" width="5" height="5" fill="#6e6874" />
      <rect x="24" y="7" width="5" height="1" fill="#868090" />
      <rect x="24" y="7" width="2" height="4" fill="#787280" />
      <rect x="27" y="8" width="2" height="4" fill="#56505e" />
      <!-- knuckle cracks, violet beneath -->
      <rect x="25" y="9" width="3" height="1" fill="#2a262e" />
      <rect x="26" y="9" width="1" height="1" fill="#4a3c5e" />
      <rect x="24" y="11" width="2" height="1" fill="#2a262e" />
      <!-- dust falling off the waking arm -->
      <rect x="29" y="12" width="1" height="1" fill="#9a94a6" opacity="0.6" />
      <rect x="27" y="14" width="1" height="1" fill="#868090" opacity="0.5" />
      <rect x="28" y="17" width="1" height="1" fill="#6e6874" opacity="0.5" />

      <!-- Off arm — still statue, hand open in the old gesture -->
      <rect x="4" y="14" width="5" height="9" fill="#150d08" />
      <rect x="5" y="15" width="3" height="7" fill="#56505e" />
      <rect x="5" y="15" width="1" height="7" fill="#6a6472" />
      <rect x="3" y="22" width="5" height="4" fill="#150d08" />
      <rect x="4" y="23" width="3" height="2" fill="#4e4856" />
      <rect x="4" y="23" width="1" height="1" fill="#605a68" />
      <!-- stone fingers, one freshly snapped -->
      <rect x="2" y="25" width="2" height="1" fill="#150d08" />
      <rect x="2" y="25" width="1" height="1" fill="#6e6874" />
      <rect x="5" y="26" width="1" height="1" fill="#868090" />

      <!-- Legs — mid-stride, as posed, the stride now finishing -->
      <rect x="8" y="27" width="14" height="3" fill="#150d08" />
      <rect x="9" y="28" width="12" height="1" fill="#56505e" />
      <rect x="9" y="28" width="5" height="1" fill="#605a68" />
      <!-- lead leg planted forward -->
      <rect x="14" y="29" width="7" height="4" fill="#150d08" />
      <rect x="15" y="30" width="5" height="2" fill="#605a68" />
      <rect x="15" y="30" width="5" height="1" fill="#6e6874" />
      <rect x="17" y="32" width="4" height="6" fill="#150d08" />
      <rect x="18" y="33" width="2" height="4" fill="#56505e" />
      <rect x="18" y="33" width="1" height="4" fill="#605a68" />
      <!-- trailing leg still mid-step, heel up -->
      <rect x="9" y="29" width="5" height="9" fill="#150d08" />
      <rect x="10" y="30" width="3" height="7" fill="#4e4856" />
      <rect x="10" y="30" width="1" height="7" fill="#56505e" />
      <!-- crack climbing the lead shin -->
      <rect x="19" y="34" width="1" height="3" fill="#2a262e" />
      <rect x="19" y="35" width="1" height="1" fill="#4a3c5e" />
      <!-- stone feet on the plinth-line -->
      <rect x="16" y="37" width="6" height="3" fill="#150d08" />
      <rect x="17" y="38" width="4" height="1" fill="#4e4856" />
      <rect x="17" y="38" width="2" height="1" fill="#605a68" />
      <rect x="8" y="37" width="6" height="3" fill="#150d08" />
      <rect x="9" y="38" width="4" height="1" fill="#423c4a" />
      <!-- the shed flakes around the feet -->
      <rect x="6" y="39" width="2" height="1" fill="#150d08" />
      <rect x="6" y="39" width="1" height="1" fill="#6e6874" />
      <rect x="23" y="39" width="2" height="1" fill="#150d08" />
      <rect x="23" y="39" width="1" height="1" fill="#787280" />

      <!-- Stone dust drifting in the gallery light -->
      <rect x="4" y="9" width="1" height="1" fill="#9a94a6" opacity="0.45" />
      <rect x="25" y="22" width="1" height="1" fill="#868090" opacity="0.45" />
      <rect x="6" y="32" width="1" height="1" fill="#6e6874" opacity="0.4" />
    </svg>
