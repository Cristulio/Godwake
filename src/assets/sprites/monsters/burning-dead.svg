<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 42"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Burning Dead"
    >
      <!-- Its own fire for a backlight + ground shadow -->
      <ellipse cx="16" cy="22" rx="15" ry="17" fill="#e87820" opacity="0.1" />
      <ellipse cx="16" cy="40.4" rx="10" ry="1.6" fill="#000" opacity="0.4" />

      <!-- The fire it wears — flames off the crown and shoulders -->
      <rect x="11" y="0" width="2" height="3" fill="#a83a14" />
      <rect x="11" y="1" width="1" height="2" fill="#e87820" />
      <rect x="14" y="0" width="2" height="2" fill="#e87820" />
      <rect x="14" y="0" width="1" height="1" fill="#ffd070" />
      <rect x="17" y="0" width="2" height="3" fill="#f4942a" />
      <rect x="17" y="0" width="1" height="1" fill="#fff4d0" />
      <rect x="20" y="1" width="2" height="2" fill="#d4641a" />
      <rect x="12" y="2" width="9" height="2" fill="#a83a14" />
      <rect x="13" y="2" width="5" height="1" fill="#e87820" />
      <rect x="6" y="9" width="2" height="2" fill="#d4641a" />
      <rect x="6" y="9" width="1" height="1" fill="#f4942a" />
      <rect x="24" y="10" width="2" height="2" fill="#a83a14" />
      <rect x="24" y="10" width="1" height="1" fill="#e87820" />

      <!-- Head — char-black skull, the scream that stopped sounding -->
      <rect x="10" y="3" width="12" height="11" fill="#150d08" />
      <rect x="11" y="4" width="10" height="9" fill="#241814" />
      <rect x="11" y="4" width="10" height="1" fill="#38241c" />
      <rect x="11" y="4" width="4" height="1" fill="#483022" />
      <rect x="11" y="4" width="1" height="6" fill="#2e1e18" />
      <rect x="19" y="5" width="2" height="8" fill="#1a100c" />
      <!-- char-crack across the crown, fire inside -->
      <rect x="13" y="4" width="1" height="2" fill="#a83a14" />
      <rect x="16" y="4" width="1" height="3" fill="#d4641a" />
      <rect x="16" y="4" width="1" height="1" fill="#ffd070" />
      <!-- the eyes — gone, lit from behind -->
      <rect x="12" y="7" width="3" height="2" fill="#0e0805" />
      <rect x="17" y="7" width="3" height="2" fill="#0e0805" />
      <rect x="13" y="7" width="2" height="1" fill="#f4942a" />
      <rect x="18" y="7" width="2" height="1" fill="#f4942a" />
      <rect x="13" y="7" width="1" height="1" fill="#ffd070" />
      <rect x="18" y="7" width="1" height="1" fill="#ffd070" />
      <!-- the scream — jaw dropped open on the furnace -->
      <rect x="13" y="10" width="6" height="4" fill="#150d08" />
      <rect x="14" y="11" width="4" height="3" fill="#6a1c0a" />
      <rect x="14" y="11" width="4" height="1" fill="#d4641a" />
      <rect x="15" y="11" width="2" height="1" fill="#ffd070" />
      <rect x="15" y="12" width="2" height="1" fill="#a83a14" />
      <!-- teeth in the char -->
      <rect x="14" y="10" width="1" height="1" fill="#9a949e" />
      <rect x="17" y="10" width="1" height="1" fill="#9a949e" />

      <!-- Torso — burnt to the ribs, still walking -->
      <rect x="8" y="14" width="16" height="15" fill="#150d08" />
      <rect x="9" y="15" width="14" height="13" fill="#241814" />
      <rect x="9" y="15" width="14" height="1" fill="#38241c" />
      <rect x="9" y="15" width="5" height="1" fill="#483022" />
      <rect x="9" y="15" width="2" height="13" fill="#2e1e18" />
      <rect x="20" y="15" width="3" height="13" fill="#1a100c" />
      <rect x="22" y="15" width="1" height="13" fill="#140c08" />
      <!-- the rib-cage open on the fire that will not go out -->
      <rect x="12" y="17" width="8" height="8" fill="#150d08" />
      <rect x="13" y="18" width="6" height="6" fill="#6a1c0a" />
      <rect x="13" y="18" width="6" height="2" fill="#a83a14" />
      <rect x="14" y="18" width="3" height="1" fill="#e87820" />
      <rect x="15" y="18" width="1" height="1" fill="#ffd070" />
      <rect x="14" y="21" width="2" height="2" fill="#d4641a" />
      <rect x="17" y="20" width="1" height="2" fill="#e87820" />
      <!-- charred ribs over the glow -->
      <rect x="12" y="18" width="8" height="1" fill="#241814" />
      <rect x="12" y="20" width="8" height="1" fill="#1a100c" />
      <rect x="12" y="22" width="8" height="1" fill="#241814" />
      <rect x="13" y="19" width="1" height="5" fill="#1a100c" />
      <rect x="18" y="19" width="1" height="5" fill="#1a100c" />
      <!-- rags still burning at the shoulder -->
      <rect x="8" y="14" width="4" height="3" fill="#38241c" />
      <rect x="8" y="14" width="2" height="2" fill="#531320" />
      <rect x="21" y="15" width="3" height="2" fill="#2e1216" />

      <!-- The searing grasp — both arms out, walking toward you -->
      <rect x="21" y="16" width="7" height="4" fill="#150d08" />
      <rect x="22" y="17" width="5" height="2" fill="#241814" />
      <rect x="22" y="17" width="5" height="1" fill="#38241c" />
      <!-- char-crack up the forearm -->
      <rect x="24" y="17" width="1" height="2" fill="#a83a14" />
      <!-- the grasping hand, fingertips alight -->
      <rect x="26" y="14" width="4" height="4" fill="#150d08" />
      <rect x="27" y="15" width="2" height="2" fill="#241814" />
      <rect x="29" y="13" width="2" height="2" fill="#150d08" />
      <rect x="29" y="13" width="1" height="1" fill="#f4942a" />
      <rect x="30" y="15" width="2" height="1" fill="#150d08" />
      <rect x="30" y="15" width="1" height="1" fill="#e87820" />
      <rect x="29" y="17" width="2" height="1" fill="#150d08" />
      <rect x="29" y="17" width="1" height="1" fill="#d4641a" />

      <rect x="4" y="17" width="5" height="4" fill="#150d08" />
      <rect x="5" y="18" width="3" height="2" fill="#1a100c" />
      <rect x="5" y="18" width="3" height="1" fill="#241814" />
      <rect x="2" y="19" width="4" height="4" fill="#150d08" />
      <rect x="3" y="20" width="2" height="2" fill="#241814" />
      <rect x="1" y="22" width="2" height="1" fill="#150d08" />
      <rect x="1" y="22" width="1" height="1" fill="#f4942a" />
      <rect x="4" y="23" width="1" height="1" fill="#d4641a" />

      <!-- Hips + the walk that never hurries -->
      <rect x="9" y="29" width="14" height="3" fill="#150d08" />
      <rect x="10" y="30" width="12" height="1" fill="#241814" />
      <rect x="10" y="30" width="4" height="1" fill="#2e1e18" />
      <!-- burning rag-skirt remnant -->
      <rect x="10" y="31" width="5" height="3" fill="#2e1216" />
      <rect x="10" y="31" width="2" height="2" fill="#481018" />
      <rect x="13" y="33" width="1" height="1" fill="#a83a14" />
      <rect x="17" y="31" width="4" height="2" fill="#1c0a0e" />
      <rect x="19" y="32" width="1" height="1" fill="#d4641a" />

      <!-- Legs — char-stick shins, one step at a time -->
      <rect x="10" y="32" width="5" height="7" fill="#150d08" />
      <rect x="11" y="33" width="3" height="5" fill="#241814" />
      <rect x="11" y="33" width="1" height="5" fill="#2e1e18" />
      <!-- char-crack glowing at the knee -->
      <rect x="12" y="34" width="1" height="2" fill="#a83a14" />
      <rect x="12" y="34" width="1" height="1" fill="#e87820" />
      <rect x="17" y="32" width="5" height="7" fill="#150d08" />
      <rect x="18" y="33" width="3" height="5" fill="#1a100c" />
      <rect x="20" y="33" width="1" height="5" fill="#140c08" />
      <rect x="19" y="36" width="1" height="1" fill="#a83a14" />
      <!-- bare burnt feet -->
      <rect x="8" y="39" width="7" height="3" fill="#150d08" />
      <rect x="9" y="40" width="5" height="1" fill="#241814" />
      <rect x="16" y="39" width="7" height="3" fill="#150d08" />
      <rect x="17" y="40" width="5" height="1" fill="#1a100c" />
      <!-- embers where it has stepped -->
      <rect x="6" y="41" width="1" height="1" fill="#d4641a" opacity="0.6" />
      <rect x="24" y="41" width="1" height="1" fill="#a83a14" opacity="0.6" />

      <!-- Sparks rising off it, always -->
      <rect x="9" y="6" width="1" height="1" fill="#f4942a" opacity="0.6" />
      <rect x="23" y="5" width="1" height="1" fill="#ffd070" opacity="0.5" />
      <rect x="5" y="13" width="1" height="1" fill="#d4641a" opacity="0.5" />
      <rect x="27" y="24" width="1" height="1" fill="#f4942a" opacity="0.45" />
      <rect x="25" y="30" width="1" height="1" fill="#d4641a" opacity="0.4" />
    </svg>
