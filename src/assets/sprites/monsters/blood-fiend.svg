<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 44"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Blood-Fiend"
    >
      <!-- Hellfire backlight — layered bloom + ground shadow -->
      <ellipse cx="16" cy="22" rx="15" ry="20" fill="#5a1010" opacity="0.18" />
      <ellipse cx="16" cy="22" rx="9" ry="14" fill="#c0301a" opacity="0.1" />
      <ellipse cx="16" cy="42" rx="11" ry="1.8" fill="#000" opacity="0.45" />

      <!-- Wings — membrane ramp, cool rim on outer edge -->
      <polygon points="11,13 4,10 2,16 9,18" fill="#5a1208" />
      <polygon points="11,13 5,11 4,15 9,16" fill="#7a201a" opacity="0.8" />
      <polygon points="9,16 3,22 6,24 11,20" fill="#5a1208" />
      <polygon points="9,16 4,21 6,23 10,20" fill="#7a201a" opacity="0.7" />
      <polygon points="2,15 0,13 3,16" fill="#3a0a08" />
      <polygon points="5,23 4,26 7,24" fill="#3a0a08" />
      <line x1="4" y1="11" x2="9" y2="17" stroke="#2a0606" stroke-width="0.5" />
      <line x1="4" y1="21" x2="10" y2="19" stroke="#2a0606" stroke-width="0.4" />
      <polygon points="21,13 28,10 30,16 23,18" fill="#5a1208" />
      <polygon points="21,13 27,11 28,15 23,16" fill="#7a201a" opacity="0.8" />
      <polygon points="23,16 29,22 26,24 21,20" fill="#5a1208" />
      <polygon points="23,16 28,21 26,23 22,20" fill="#7a201a" opacity="0.7" />
      <polygon points="30,15 32,13 29,16" fill="#3a0a08" />
      <polygon points="27,23 28,26 25,24" fill="#3a0a08" />
      <line x1="28" y1="11" x2="23" y2="17" stroke="#2a0606" stroke-width="0.5" />
      <line x1="28" y1="21" x2="22" y2="19" stroke="#2a0606" stroke-width="0.4" />

      <!-- Torso — blood ramp, key upper-left, cool counter-rim right -->
      <polygon points="11,6 21,6 23,16 20,30 12,30 9,16" fill="#6a140e" />
      <polygon points="11,6 16,6 14,16 14,30 12,30 9,16" fill="#8c2010" />
      <polygon points="11,6 13,6 11,16 12,28 11,16" fill="#b53c4a" opacity="0.7" />
      <polygon points="21,6 23,16 20,30 18,28 20,16" fill="#4a0e0a" />
      <polygon points="14,12 18,12 17,24 15,24" fill="#3a0a08" opacity="0.6" />
      <!-- chest dither -->
      <rect x="15" y="18" width="1" height="1" fill="#b53c4a" opacity="0.6" />
      <rect x="17" y="22" width="1" height="1" fill="#3a0a08" opacity="0.7" />
      <rect x="13" y="26" width="1" height="1" fill="#8c2010" opacity="0.6" />

      <!-- Horned head — ramp + bone horns -->
      <rect x="13" y="2" width="6" height="6" fill="#7a1810" />
      <rect x="13" y="2" width="6" height="1" fill="#9a2818" />
      <rect x="13" y="2" width="2" height="6" fill="#8c2010" />
      <rect x="18" y="2" width="1" height="6" fill="#4a0e0a" />
      <polygon points="13,2 14,-2 16,2" fill="#5a1208" />
      <polygon points="13,2 14,-1 15,2" fill="#7a201a" />
      <polygon points="19,2 18,-2 16,2" fill="#5a1208" />
      <!-- molten eyes -->
      <rect x="13" y="4" width="2" height="1" fill="#f4d042" />
      <rect x="17" y="4" width="2" height="1" fill="#f4d042" />
      <rect x="13" y="4" width="1" height="1" fill="#fff0b0" />
      <rect x="17" y="4" width="1" height="1" fill="#fff0b0" />
      <rect x="14" y="6" width="4" height="1" fill="#3a0a08" />

      <!-- Legs — ramp -->
      <rect x="12" y="30" width="3" height="10" fill="#5a1208" />
      <rect x="12" y="30" width="1" height="10" fill="#7a201a" />
      <rect x="17" y="30" width="3" height="10" fill="#5a1208" />
      <rect x="19" y="30" width="1" height="10" fill="#3a0a08" />
      <!-- cloven feet -->
      <polygon points="10,40 16,40 15,43 11,43" fill="#3a0a08" />
      <polygon points="16,40 22,40 21,43 17,43" fill="#3a0a08" />
      <rect x="11" y="40" width="1" height="1" fill="#7a201a" />
      <rect x="17" y="40" width="1" height="1" fill="#7a201a" />
    </svg>
