<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 40 50"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Blood-Fiend"
    >
      <!-- Murder-glow backlight + wet ground shadow -->
      <ellipse cx="20" cy="27" rx="19" ry="21" fill="#a82a20" opacity="0.07" />
      <ellipse cx="20" cy="48.3" rx="14" ry="1.9" fill="#000" opacity="0.44" />

      <!-- Head — a clot that learned a skull's shape, mostly maw -->
      <rect x="13" y="2" width="13" height="11" fill="#150d08" />
      <rect x="14" y="3" width="11" height="9" fill="#7a1a10" />
      <rect x="14" y="3" width="11" height="1" fill="#a82a20" />
      <rect x="14" y="3" width="4" height="1" fill="#d84838" />
      <rect x="14" y="3" width="2" height="8" fill="#8c2014" />
      <rect x="22" y="4" width="3" height="8" fill="#5e120c" />
      <rect x="24" y="4" width="1" height="8" fill="#481018" />
      <!-- the wet crown, still running -->
      <rect x="15" y="2" width="4" height="1" fill="#d84838" />
      <rect x="16" y="1" width="2" height="1" fill="#150d08" />
      <rect x="21" y="1" width="2" height="2" fill="#150d08" />
      <rect x="21" y="2" width="1" height="1" fill="#a82a20" />
      <!-- eyes — lightless dents it sees you with anyway -->
      <rect x="15" y="6" width="3" height="2" fill="#2e0c12" />
      <rect x="20" y="6" width="3" height="2" fill="#2e0c12" />
      <rect x="16" y="6" width="1" height="1" fill="#ff8a78" />
      <rect x="21" y="6" width="1" height="1" fill="#ff8a78" />
      <!-- the feeding maw, hanging open -->
      <rect x="15" y="9" width="9" height="4" fill="#150d08" />
      <rect x="16" y="10" width="7" height="3" fill="#2e0c12" />
      <rect x="17" y="10" width="5" height="2" fill="#1c060a" />
      <!-- grown teeth -->
      <rect x="16" y="9" width="1" height="2" fill="#e8d8c8" />
      <rect x="19" y="9" width="1" height="1" fill="#e8d8c8" />
      <rect x="22" y="9" width="1" height="2" fill="#c8b8a8" />
      <rect x="18" y="12" width="1" height="1" fill="#c8b8a8" />
      <rect x="21" y="12" width="1" height="1" fill="#e8d8c8" />

      <!-- Torso — tall, wet, the walk it keeps between kills -->
      <rect x="11" y="13" width="18" height="20" fill="#150d08" />
      <rect x="12" y="14" width="16" height="18" fill="#6e160e" />
      <rect x="12" y="14" width="16" height="1" fill="#8c2014" />
      <rect x="12" y="14" width="6" height="1" fill="#a82a20" />
      <rect x="12" y="14" width="3" height="18" fill="#7a1a10" />
      <rect x="12" y="14" width="1" height="12" fill="#8c2014" />
      <rect x="25" y="14" width="3" height="18" fill="#52100a" />
      <rect x="27" y="14" width="1" height="18" fill="#440d08" />
      <!-- the run-lines — it never stops dripping down itself -->
      <rect x="16" y="15" width="1" height="16" fill="#52100a" />
      <rect x="21" y="14" width="1" height="17" fill="#52100a" />
      <rect x="19" y="16" width="1" height="14" fill="#5e120c" />
      <!-- wet sheen at the lit shoulder -->
      <rect x="13" y="15" width="2" height="2" fill="#d84838" />
      <rect x="13" y="15" width="1" height="1" fill="#ff8a78" />
      <!-- the fed glow — warmth it has taken, pooled at the core -->
      <rect x="17" y="20" width="5" height="7" fill="#150d08" />
      <rect x="18" y="21" width="3" height="5" fill="#a82a20" />
      <rect x="18" y="21" width="3" height="2" fill="#d84838" />
      <rect x="19" y="21" width="1" height="1" fill="#ff8a78" />
      <rect x="19" y="24" width="1" height="2" fill="#7a1a10" />

      <!-- FOUR ARMS — upper pair reaching, lower pair flexed -->
      <!-- upper right, reaching for you -->
      <rect x="28" y="14" width="7" height="4" fill="#150d08" />
      <rect x="29" y="15" width="5" height="2" fill="#6e160e" />
      <rect x="29" y="15" width="5" height="1" fill="#8c2014" />
      <rect x="33" y="13" width="5" height="4" fill="#150d08" />
      <rect x="34" y="14" width="3" height="2" fill="#5e120c" />
      <!-- claw fingers running wet -->
      <rect x="37" y="12" width="2" height="1" fill="#150d08" />
      <rect x="37" y="12" width="1" height="1" fill="#d84838" />
      <rect x="37" y="14" width="3" height="1" fill="#150d08" />
      <rect x="38" y="14" width="2" height="1" fill="#a82a20" />
      <rect x="37" y="16" width="2" height="1" fill="#150d08" />
      <rect x="37" y="16" width="1" height="1" fill="#8c2014" />
      <!-- upper left, reaching -->
      <rect x="5" y="15" width="7" height="4" fill="#150d08" />
      <rect x="6" y="16" width="5" height="2" fill="#7a1a10" />
      <rect x="6" y="16" width="5" height="1" fill="#a82a20" />
      <rect x="2" y="14" width="5" height="4" fill="#150d08" />
      <rect x="3" y="15" width="3" height="2" fill="#6e160e" />
      <rect x="0" y="13" width="3" height="1" fill="#150d08" />
      <rect x="1" y="13" width="1" height="1" fill="#d84838" />
      <rect x="0" y="15" width="3" height="1" fill="#150d08" />
      <rect x="0" y="15" width="2" height="1" fill="#a82a20" />
      <rect x="1" y="17" width="2" height="1" fill="#150d08" />
      <rect x="1" y="17" width="1" height="1" fill="#8c2014" />
      <!-- lower right, flexed at the ribs -->
      <rect x="27" y="22" width="6" height="4" fill="#150d08" />
      <rect x="28" y="23" width="4" height="2" fill="#5e120c" />
      <rect x="28" y="23" width="4" height="1" fill="#6e160e" />
      <rect x="31" y="25" width="4" height="4" fill="#150d08" />
      <rect x="32" y="26" width="2" height="2" fill="#52100a" />
      <rect x="34" y="27" width="2" height="1" fill="#150d08" />
      <rect x="35" y="27" width="1" height="1" fill="#a82a20" />
      <!-- lower left, flexed -->
      <rect x="7" y="23" width="6" height="4" fill="#150d08" />
      <rect x="8" y="24" width="4" height="2" fill="#6e160e" />
      <rect x="8" y="24" width="4" height="1" fill="#7a1a10" />
      <rect x="5" y="26" width="4" height="4" fill="#150d08" />
      <rect x="6" y="27" width="2" height="2" fill="#5e120c" />
      <rect x="4" y="28" width="2" height="1" fill="#150d08" />
      <rect x="4" y="28" width="1" height="1" fill="#d84838" />

      <!-- Hips — the clot thinning toward the floor -->
      <rect x="12" y="33" width="16" height="4" fill="#150d08" />
      <rect x="13" y="34" width="14" height="2" fill="#5e120c" />
      <rect x="13" y="34" width="5" height="1" fill="#6e160e" />
      <rect x="23" y="34" width="4" height="2" fill="#4a0e09" />
      <!-- strands where legs decided to be -->
      <rect x="12" y="36" width="6" height="9" fill="#150d08" />
      <rect x="13" y="37" width="4" height="7" fill="#52100a" />
      <rect x="13" y="37" width="1" height="7" fill="#5e120c" />
      <rect x="16" y="37" width="1" height="7" fill="#440d08" />
      <rect x="22" y="36" width="6" height="9" fill="#150d08" />
      <rect x="23" y="37" width="4" height="7" fill="#4a0e09" />
      <rect x="23" y="37" width="1" height="7" fill="#52100a" />
      <rect x="26" y="37" width="1" height="7" fill="#3c0b07" />
      <!-- it stands in its own spreading pool -->
      <rect x="10" y="44" width="9" height="3" fill="#150d08" />
      <rect x="11" y="45" width="7" height="1" fill="#440d08" />
      <rect x="21" y="44" width="9" height="3" fill="#150d08" />
      <rect x="22" y="45" width="7" height="1" fill="#3c0b07" />
      <rect x="8" y="46" width="24" height="2" fill="#150d08" />
      <rect x="9" y="47" width="22" height="1" fill="#2e0c12" />
      <rect x="9" y="46" width="6" height="1" fill="#481018" />
      <rect x="25" y="46" width="5" height="1" fill="#2e0c12" />

      <!-- Drips mid-fall -->
      <rect x="33" y="19" width="1" height="2" fill="#7a1a10" opacity="0.7" />
      <rect x="6" y="20" width="1" height="2" fill="#a82a20" opacity="0.6" />
      <rect x="30" y="31" width="1" height="2" fill="#5e120c" opacity="0.7" />
      <rect x="19" y="32" width="1" height="2" fill="#7a1a10" opacity="0.6" />
    </svg>
