<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 26 38"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Kobold"
    >
      <!-- Warm scaly backlight + ground-contact shadow -->
      <ellipse cx="13" cy="18" rx="13" ry="17" fill="#a8542a" opacity="0.08" />
      <ellipse cx="12" cy="14" rx="9" ry="11" fill="#ffb040" opacity="0.05" />
      <ellipse cx="13" cy="36.6" rx="9" ry="1.6" fill="#000" opacity="0.4" />

      <!-- ── Horns — keratin ramp, swept back ── -->
      <rect x="6" y="0" width="3" height="4" fill="#150d08" />
      <rect x="7" y="1" width="1" height="2" fill="#8c6232" />
      <rect x="7" y="1" width="1" height="1" fill="#c2a05a" />
      <rect x="15" y="0" width="3" height="4" fill="#150d08" />
      <rect x="16" y="1" width="1" height="2" fill="#5a3010" />
      <rect x="16" y="1" width="1" height="1" fill="#7a4a22" />

      <!-- ── Head — rusty scale ramp, key upper-left ── -->
      <rect x="5" y="2" width="13" height="9" fill="#150d08" />
      <rect x="6" y="3" width="11" height="7" fill="#8a4a1c" />
      <rect x="6" y="3" width="11" height="1" fill="#a05428" />
      <rect x="6" y="3" width="3" height="6" fill="#a05428" />
      <rect x="6" y="3" width="1" height="4" fill="#c06a34" />
      <rect x="6" y="3" width="1" height="2" fill="#e08a48" />
      <rect x="14" y="4" width="3" height="6" fill="#5a3010" />
      <rect x="16" y="5" width="1" height="5" fill="#3a1a08" />
      <rect x="16" y="7" width="1" height="2" fill="#2e4a4e" />
      <!-- scale dither rows -->
      <rect x="8" y="5" width="1" height="1" fill="#a05428" />
      <rect x="11" y="4" width="1" height="1" fill="#5a3010" />
      <rect x="9" y="8" width="1" height="1" fill="#5a3010" />
      <rect x="12" y="7" width="1" height="1" fill="#a05428" />

      <!-- ── Long snout, jutting right with nostril flare ── -->
      <rect x="16" y="4" width="8" height="6" fill="#150d08" />
      <rect x="17" y="5" width="6" height="4" fill="#8a4a1c" />
      <rect x="17" y="5" width="6" height="1" fill="#a05428" />
      <rect x="17" y="5" width="2" height="1" fill="#c06a34" />
      <rect x="21" y="6" width="2" height="3" fill="#5a3010" />
      <rect x="22" y="6" width="1" height="1" fill="#3a1a08" />
      <!-- nostril -->
      <rect x="21" y="5" width="1" height="1" fill="#2a1006" />
      <!-- needle teeth under the snout -->
      <rect x="17" y="9" width="6" height="2" fill="#160f0a" />
      <rect x="17" y="9" width="1" height="1" fill="#f0e6cc" />
      <rect x="19" y="9" width="1" height="2" fill="#e8dcc4" />
      <rect x="21" y="9" width="1" height="1" fill="#d4c8a8" />

      <!-- ── Narrowed sulfur eyes — mean slits under a lowered brow ── -->
      <rect x="7" y="5" width="3" height="1" fill="#3a1a08" />
      <rect x="11" y="5" width="3" height="1" fill="#2a1006" />
      <rect x="7" y="6" width="3" height="2" fill="#22140a" />
      <rect x="11" y="6" width="3" height="2" fill="#22140a" />
      <rect x="7" y="6" width="2" height="1" fill="#f4d042" />
      <rect x="11" y="6" width="2" height="1" fill="#e8c238" />
      <rect x="8" y="7" width="1" height="1" fill="#b08818" />
      <rect x="12" y="7" width="1" height="1" fill="#9a7414" />
      <rect x="7" y="6" width="1" height="1" fill="#fff4a0" />
      <rect x="11" y="6" width="1" height="1" fill="#fff4a0" />

      <!-- ── Head frill — torn crest behind the skull ── -->
      <rect x="3" y="4" width="3" height="5" fill="#150d08" />
      <rect x="4" y="5" width="2" height="3" fill="#6a3814" />
      <rect x="4" y="5" width="1" height="2" fill="#8a4a1c" />
      <rect x="3" y="6" width="1" height="1" fill="#5a3010" />

      <!-- ── Skittering torso — low crouch, scale ramp ── -->
      <rect x="6" y="11" width="14" height="10" fill="#150d08" />
      <rect x="7" y="12" width="12" height="8" fill="#8a4a1c" />
      <rect x="7" y="12" width="12" height="1" fill="#a05428" />
      <rect x="7" y="12" width="3" height="7" fill="#a05428" />
      <rect x="7" y="12" width="1" height="5" fill="#c06a34" />
      <rect x="16" y="13" width="3" height="7" fill="#5a3010" />
      <rect x="18" y="14" width="1" height="6" fill="#3a1a08" />
      <!-- pale belly plates -->
      <rect x="10" y="15" width="6" height="5" fill="#c2945c" />
      <rect x="10" y="15" width="6" height="1" fill="#e0b070" />
      <rect x="10" y="17" width="6" height="1" fill="#a87a44" />
      <rect x="10" y="19" width="6" height="1" fill="#8a6234" />
      <!-- scale dither -->
      <rect x="9" y="13" width="1" height="1" fill="#5a3010" />
      <rect x="14" y="12" width="1" height="1" fill="#a05428" />
      <rect x="8" y="18" width="1" height="1" fill="#5a3010" />

      <!-- ── Rag tabard — scavenged cloth scrap ── -->
      <rect x="7" y="13" width="2" height="6" fill="#3a2e22" />
      <rect x="7" y="13" width="1" height="6" fill="#5a4030" />
      <rect x="7" y="19" width="2" height="1" fill="#2a1810" />

      <!-- ── Left arm — lit, clutching the bone spear ── -->
      <rect x="3" y="12" width="4" height="8" fill="#150d08" />
      <rect x="4" y="13" width="2" height="6" fill="#8a4a1c" />
      <rect x="4" y="13" width="1" height="6" fill="#a05428" />
      <rect x="2" y="18" width="4" height="3" fill="#150d08" />
      <rect x="3" y="19" width="2" height="1" fill="#a05428" />

      <!-- ── Bone spear — thrust forward at an angle ── -->
      <rect x="1" y="6" width="3" height="17" fill="#150d08" />
      <rect x="2" y="7" width="1" height="15" fill="#c2b794" />
      <rect x="2" y="7" width="1" height="6" fill="#e8dcc4" />
      <rect x="2" y="8" width="1" height="1" fill="#ffffff" />
      <!-- knapped flint head -->
      <rect x="1" y="4" width="3" height="3" fill="#150d08" />
      <rect x="2" y="5" width="1" height="2" fill="#5a6478" />
      <rect x="2" y="5" width="1" height="1" fill="#8a91a4" />
      <!-- sinew lashing -->
      <rect x="2" y="13" width="1" height="1" fill="#6b4a22" />

      <!-- ── Right arm — shadow side, claw spread ── -->
      <rect x="19" y="12" width="4" height="7" fill="#150d08" />
      <rect x="20" y="13" width="2" height="5" fill="#5a3010" />
      <rect x="21" y="13" width="1" height="5" fill="#3a1a08" />
      <rect x="20" y="18" width="3" height="2" fill="#150d08" />
      <rect x="21" y="18" width="1" height="1" fill="#5a3010" />
      <rect x="20" y="19" width="1" height="1" fill="#d4c8a8" />
      <rect x="22" y="19" width="1" height="1" fill="#c2b794" />

      <!-- ── Whip tail, curled around the legs ── -->
      <rect x="19" y="20" width="6" height="3" fill="#150d08" />
      <rect x="20" y="21" width="4" height="1" fill="#8a4a1c" />
      <rect x="23" y="20" width="1" height="1" fill="#a05428" />
      <rect x="24" y="18" width="2" height="3" fill="#150d08" />
      <rect x="25" y="19" width="1" height="1" fill="#a05428" />

      <!-- ── Loincloth ── -->
      <rect x="8" y="20" width="10" height="4" fill="#150d08" />
      <rect x="9" y="21" width="8" height="2" fill="#3a2e22" />
      <rect x="9" y="21" width="8" height="1" fill="#5a4030" />
      <rect x="12" y="21" width="2" height="2" fill="#2a1810" />

      <!-- ── Digitigrade legs — crouched spring ── -->
      <rect x="7" y="23" width="5" height="8" fill="#150d08" />
      <rect x="8" y="24" width="3" height="6" fill="#8a4a1c" />
      <rect x="8" y="24" width="1" height="6" fill="#a05428" />
      <rect x="10" y="24" width="1" height="6" fill="#5a3010" />
      <rect x="14" y="23" width="5" height="8" fill="#150d08" />
      <rect x="15" y="24" width="3" height="6" fill="#5a3010" />
      <rect x="15" y="24" width="1" height="6" fill="#8a4a1c" />
      <rect x="17" y="24" width="1" height="6" fill="#3a1a08" />
      <!-- hock joints kick back -->
      <rect x="8" y="31" width="4" height="3" fill="#150d08" />
      <rect x="9" y="32" width="2" height="1" fill="#8a4a1c" />
      <rect x="15" y="31" width="4" height="3" fill="#150d08" />
      <rect x="16" y="32" width="2" height="1" fill="#5a3010" />

      <!-- ── Clawed feet — bone-white talons ── -->
      <rect x="6" y="34" width="7" height="3" fill="#150d08" />
      <rect x="7" y="35" width="5" height="1" fill="#8a4a1c" />
      <rect x="7" y="34" width="5" height="1" fill="#a05428" />
      <rect x="7" y="36" width="1" height="1" fill="#f0e6cc" />
      <rect x="9" y="36" width="1" height="1" fill="#e8dcc4" />
      <rect x="11" y="36" width="1" height="1" fill="#d4c8a8" />
      <rect x="14" y="34" width="7" height="3" fill="#150d08" />
      <rect x="15" y="35" width="5" height="1" fill="#5a3010" />
      <rect x="15" y="34" width="5" height="1" fill="#8a4a1c" />
      <rect x="15" y="36" width="1" height="1" fill="#d4c8a8" />
      <rect x="17" y="36" width="1" height="1" fill="#d4c8a8" />
      <rect x="19" y="36" width="1" height="1" fill="#c2b794" />
    </svg>
