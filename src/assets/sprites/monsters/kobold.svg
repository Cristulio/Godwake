<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 18 26"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Kobold"
    >
      <!-- Warm scaly backlight + ground-contact shadow -->
      <ellipse cx="9" cy="13" rx="9" ry="12" fill="#a8542a" opacity="0.08" />
      <ellipse cx="9" cy="25" rx="6" ry="1.2" fill="#000" opacity="0.4" />

      <!-- Horns — keratin ramp -->
      <rect x="6" y="0" width="1" height="2" fill="#5a3010" />
      <rect x="6" y="0" width="1" height="1" fill="#8c6232" />
      <rect x="11" y="0" width="1" height="2" fill="#5a3010" />
      <rect x="11" y="0" width="1" height="1" fill="#7a4a22" />

      <!-- Snout / head — rusty scale ramp, key upper-left -->
      <rect x="5" y="2" width="8" height="6" fill="#8a4a1c" />
      <rect x="5" y="2" width="8" height="1" fill="#a05428" />
      <rect x="5" y="2" width="2" height="6" fill="#a05428" />
      <rect x="5" y="2" width="1" height="4" fill="#c06a34" />
      <rect x="11" y="3" width="2" height="5" fill="#5a3010" />
      <rect x="12" y="3" width="1" height="5" fill="#3a1a08" />
      <!-- snout tip -->
      <rect x="13" y="3" width="3" height="3" fill="#8a4a1c" />
      <rect x="13" y="3" width="3" height="1" fill="#a05428" />
      <rect x="14" y="4" width="1" height="1" fill="#3a1a08" />
      <rect x="15" y="5" width="1" height="1" fill="#5a3010" />

      <!-- Eyes — yellow with dark core + spark -->
      <rect x="6" y="4" width="2" height="2" fill="#f4d042" />
      <rect x="9" y="4" width="2" height="2" fill="#f4d042" />
      <rect x="7" y="5" width="1" height="1" fill="#0a0808" />
      <rect x="10" y="5" width="1" height="1" fill="#0a0808" />
      <rect x="6" y="4" width="1" height="1" fill="#fff4a0" />
      <rect x="9" y="4" width="1" height="1" fill="#fff4a0" />

      <!-- Snarling mouth — bright fangs -->
      <rect x="6" y="7" width="6" height="1" fill="#0a0808" />
      <rect x="7" y="7" width="1" height="1" fill="#d4c8a8" />
      <rect x="10" y="7" width="1" height="1" fill="#e8dcc4" />
      <rect x="7" y="8" width="4" height="1" fill="#5a3010" />

      <!-- Torso — scale ramp + belly dither -->
      <rect x="5" y="9" width="8" height="5" fill="#a05428" />
      <rect x="5" y="9" width="8" height="1" fill="#5a3010" />
      <rect x="5" y="9" width="2" height="5" fill="#b85e30" />
      <rect x="5" y="9" width="1" height="5" fill="#3a1a08" />
      <rect x="11" y="9" width="2" height="5" fill="#5a3010" />
      <rect x="7" y="11" width="4" height="2" fill="#3a1a08" />
      <rect x="8" y="12" width="1" height="1" fill="#5a3010" />
      <rect x="10" y="10" width="1" height="1" fill="#b85e30" />

      <!-- Arms -->
      <rect x="3" y="9" width="2" height="6" fill="#8a4a1c" />
      <rect x="3" y="9" width="1" height="6" fill="#3a1a08" />
      <rect x="13" y="9" width="2" height="6" fill="#8a4a1c" />
      <rect x="13" y="9" width="1" height="6" fill="#a05428" />
      <rect x="2" y="14" width="3" height="2" fill="#8a4a1c" />
      <rect x="2" y="14" width="3" height="1" fill="#a05428" />
      <rect x="13" y="14" width="3" height="2" fill="#8a4a1c" />
      <rect x="13" y="14" width="3" height="1" fill="#5a3010" />

      <!-- Bone spear — pale ramp + specular -->
      <rect x="14" y="10" width="1" height="5" fill="#c2b794" />
      <rect x="14" y="10" width="1" height="2" fill="#e8dcc4" />
      <rect x="14" y="11" width="1" height="1" fill="#ffffff" />

      <!-- Loincloth -->
      <rect x="5" y="14" width="8" height="2" fill="#3a2e22" />
      <rect x="5" y="14" width="8" height="1" fill="#5a4030" />

      <!-- Legs -->
      <rect x="6" y="16" width="2" height="5" fill="#8a4a1c" />
      <rect x="6" y="16" width="1" height="5" fill="#a05428" />
      <rect x="10" y="16" width="2" height="5" fill="#8a4a1c" />
      <rect x="11" y="16" width="1" height="5" fill="#5a3010" />

      <!-- Clawed feet — bone-white talons -->
      <rect x="5" y="21" width="4" height="3" fill="#8a4a1c" />
      <rect x="9" y="21" width="4" height="3" fill="#8a4a1c" />
      <rect x="5" y="21" width="4" height="1" fill="#5a3010" />
      <rect x="9" y="21" width="4" height="1" fill="#5a3010" />
      <rect x="5" y="23" width="1" height="2" fill="#d4c8a8" />
      <rect x="7" y="23" width="1" height="2" fill="#d4c8a8" />
      <rect x="10" y="23" width="1" height="2" fill="#d4c8a8" />
      <rect x="12" y="23" width="1" height="2" fill="#d4c8a8" />
    </svg>
