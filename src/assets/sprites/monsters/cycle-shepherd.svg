<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 53"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Cycle-Shepherd"
    >
      <!-- Godwake-teal backlight + ground shadow -->
      <ellipse cx="16" cy="25" rx="15" ry="23" fill="#7ad8c8" opacity="0.08" />
      <ellipse cx="16" cy="51.6" rx="10" ry="1.8" fill="#000" opacity="0.42" />

      <!-- ── Shepherd's crook — tall, crowned with the cycle-ring ── -->
      <rect x="26" y="4" width="3" height="44" fill="#150d08" />
      <rect x="27" y="5" width="1" height="42" fill="#2a2c34" />
      <rect x="27" y="5" width="1" height="14" fill="#3a3c44" />
      <!-- the cycle-ring head — a teal circle, broken once -->
      <ellipse cx="27.5" cy="4" rx="4.6" ry="4.6" fill="#7ad8c8" opacity="0.22" />
      <rect x="24" y="0" width="7" height="2" fill="#150d08" />
      <rect x="23" y="1" width="3" height="6" fill="#150d08" />
      <rect x="29" y="1" width="3" height="6" fill="#150d08" />
      <rect x="24" y="6" width="7" height="2" fill="#150d08" />
      <rect x="25" y="1" width="5" height="1" fill="#7ad8c8" />
      <rect x="25" y="1" width="2" height="1" fill="#d4fff4" />
      <rect x="24" y="2" width="1" height="4" fill="#5ab8a8" />
      <rect x="30" y="2" width="1" height="4" fill="#7ad8c8" />
      <rect x="25" y="6" width="5" height="1" fill="#4a9888" />
      <!-- the break in the ring -->
      <rect x="29" y="5" width="2" height="2" fill="#150d08" />

      <!-- ── Deep cowl — night-dark wool, nothing but teal eyes ── -->
      <rect x="9" y="2" width="13" height="4" fill="#150d08" />
      <rect x="10" y="3" width="11" height="3" fill="#2a2c34" />
      <rect x="10" y="3" width="5" height="1" fill="#3a3c44" />
      <rect x="7" y="6" width="17" height="8" fill="#150d08" />
      <rect x="8" y="7" width="15" height="6" fill="#2a2c34" />
      <rect x="8" y="7" width="15" height="1" fill="#3a3c44" />
      <rect x="8" y="7" width="3" height="6" fill="#32343c" />
      <rect x="8" y="7" width="1" height="4" fill="#42444c" />
      <rect x="20" y="8" width="3" height="5" fill="#1a1c24" />
      <!-- the hood's hollow -->
      <rect x="10" y="9" width="11" height="4" fill="#0a1410" />
      <rect x="11" y="10" width="9" height="3" fill="#06201c" />
      <!-- teal shepherd eyes — patient, paired -->
      <rect x="12" y="10" width="2" height="2" fill="#7ad8c8" />
      <rect x="17" y="10" width="2" height="2" fill="#5ab8a8" />
      <rect x="12" y="10" width="1" height="1" fill="#d4fff4" />
      <rect x="17" y="10" width="1" height="1" fill="#a8ece0" />

      <!-- ── Mantle hung with passage-bells ── -->
      <rect x="5" y="14" width="22" height="5" fill="#150d08" />
      <rect x="6" y="15" width="20" height="3" fill="#2a2c34" />
      <rect x="6" y="15" width="20" height="1" fill="#42444c" />
      <rect x="6" y="15" width="5" height="1" fill="#52545c" />
      <rect x="22" y="15" width="4" height="3" fill="#1a1c24" />
      <!-- three small bells along the mantle edge -->
      <rect x="8" y="18" width="2" height="2" fill="#150d08" />
      <rect x="8" y="18" width="1" height="1" fill="#7a8a88" />
      <rect x="14" y="18" width="2" height="2" fill="#150d08" />
      <rect x="14" y="18" width="1" height="1" fill="#9aaaa8" />
      <rect x="20" y="18" width="2" height="2" fill="#150d08" />
      <rect x="20" y="18" width="1" height="1" fill="#6a7a78" />

      <!-- ── Robe — long night-wool, teal soul-lantern within ── -->
      <rect x="6" y="19" width="20" height="22" fill="#150d08" />
      <rect x="7" y="20" width="18" height="20" fill="#22242c" />
      <rect x="7" y="20" width="18" height="1" fill="#32343c" />
      <rect x="7" y="20" width="3" height="19" fill="#2a2c34" />
      <rect x="7" y="20" width="1" height="15" fill="#3a3c44" />
      <rect x="22" y="20" width="3" height="19" fill="#16181e" />
      <rect x="24" y="21" width="1" height="18" fill="#101216" />
      <!-- the gathered-souls lantern glowing through the cloth -->
      <ellipse cx="15" cy="28" rx="5.4" ry="6" fill="#7ad8c8" opacity="0.18" />
      <rect x="12" y="24" width="6" height="8" fill="#0a2420" />
      <rect x="13" y="25" width="4" height="6" fill="#0e3c34" />
      <rect x="13" y="26" width="4" height="4" fill="#1a6054" />
      <rect x="14" y="27" width="2" height="2" fill="#3aa092" />
      <rect x="14" y="27" width="1" height="1" fill="#a8ece0" />
      <!-- small soul-shapes drifting inside the glow -->
      <rect x="13" y="25" width="1" height="1" fill="#7ad8c8" opacity="0.8" />
      <rect x="16" y="29" width="1" height="1" fill="#7ad8c8" opacity="0.7" />
      <rect x="15" y="24" width="1" height="1" fill="#5ab8a8" opacity="0.6" />
      <!-- wool weave dither -->
      <rect x="9" y="23" width="1" height="1" fill="#32343c" />
      <rect x="20" y="26" width="1" height="1" fill="#16181e" />
      <rect x="10" y="34" width="1" height="1" fill="#2a2c34" />

      <!-- ── Left arm — hand open, beckoning the strays ── -->
      <rect x="2" y="19" width="6" height="11" fill="#150d08" />
      <rect x="3" y="20" width="4" height="9" fill="#22242c" />
      <rect x="3" y="20" width="1" height="9" fill="#32343c" />
      <rect x="6" y="20" width="1" height="9" fill="#1a1c24" />
      <rect x="2" y="29" width="5" height="3" fill="#150d08" />
      <rect x="3" y="30" width="3" height="1" fill="#3a4a48" />
      <!-- pale beckoning fingers, teal-rimmed -->
      <rect x="2" y="32" width="1" height="2" fill="#150d08" />
      <rect x="4" y="32" width="1" height="2" fill="#150d08" />
      <rect x="6" y="32" width="1" height="2" fill="#150d08" />
      <rect x="2" y="32" width="1" height="1" fill="#7ad8c8" />
      <rect x="4" y="32" width="1" height="1" fill="#5ab8a8" />
      <rect x="6" y="32" width="1" height="1" fill="#7ad8c8" />

      <!-- ── Right arm — gripping the crook ── -->
      <rect x="21" y="19" width="6" height="10" fill="#150d08" />
      <rect x="22" y="20" width="4" height="8" fill="#1a1c24" />
      <rect x="22" y="20" width="1" height="8" fill="#22242c" />
      <rect x="23" y="28" width="5" height="3" fill="#150d08" />
      <rect x="24" y="29" width="3" height="1" fill="#2a2c34" />

      <!-- ── Hem — trailing into mist, no feet ── -->
      <rect x="7" y="41" width="18" height="6" fill="#150d08" />
      <rect x="8" y="42" width="16" height="4" fill="#1c1e26" />
      <rect x="8" y="42" width="16" height="1" fill="#2a2c34" />
      <rect x="8" y="42" width="3" height="4" fill="#22242c" />
      <rect x="21" y="42" width="3" height="4" fill="#14161c" />
      <rect x="12" y="43" width="1" height="3" fill="#101216" />
      <rect x="17" y="43" width="1" height="3" fill="#101216" />
      <!-- mist curling at the hem -->
      <rect x="6" y="47" width="20" height="2" fill="#22242c" opacity="0.6" />
      <rect x="8" y="49" width="16" height="1" fill="#2a2c34" opacity="0.4" />
      <rect x="10" y="50" width="12" height="1" fill="#3a4a48" opacity="0.3" />
      <rect x="13" y="51" width="6" height="1" fill="#3a6a60" opacity="0.2" />

      <!-- ── Stray soul-motes following the shepherd ── -->
      <rect x="3" y="12" width="1" height="1" fill="#7ad8c8" opacity="0.55" />
      <rect x="29" y="16" width="1" height="1" fill="#7ad8c8" opacity="0.5" />
      <rect x="2" y="38" width="1" height="1" fill="#5ab8a8" opacity="0.45" />
      <rect x="30" y="34" width="1" height="1" fill="#7ad8c8" opacity="0.4" />
      <rect x="5" y="44" width="1" height="1" fill="#a8ece0" opacity="0.35" />
    </svg>
