      <rect x="11" y="63" width="2" height="3" fill="#e8c0a0" />
      <rect x="15" y="63" width="2" height="3" fill="#d4ac88" />
      <rect x="19" y="63" width="2" height="3" fill="#d4ac88" />
      <rect x="29" y="59" width="12" height="7" fill="#150d08" />
      <rect x="30" y="60" width="10" height="5" fill="#2e0807" />
      <rect x="30" y="60" width="3" height="5" fill="#3a0a08" />
      <rect x="29" y="63" width="2" height="3" fill="#c8a888" />
      <rect x="33" y="63" width="2" height="3" fill="#b09078" />
