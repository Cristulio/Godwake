<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 44"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Ascendant Slayer"
    >
      <!-- Bhaal-blood backlight + ground shadow -->
      <ellipse cx="16" cy="22" rx="15" ry="20" fill="#7a1410" opacity="0.16" />
      <ellipse cx="16" cy="20" rx="10" ry="14" fill="#c0301a" opacity="0.1" />
      <ellipse cx="16" cy="42" rx="11" ry="1.8" fill="#000" opacity="0.45" />

      <!-- Crown of flame above the brow -->
      <polygon points="9,1 16,-3 23,1 16,4" fill="#e8a020" opacity="0.45" />
      <polygon points="11,2 16,-1 21,2 16,4" fill="#ffe8a0" opacity="0.6" />
      <polygon points="13,1 16,-2 19,1" fill="#fff4d0" opacity="0.7" />

      <!-- Horned head — red ramp, key light upper-left -->
      <rect x="11" y="3" width="10" height="9" fill="#6a140e" />
      <rect x="11" y="3" width="10" height="1" fill="#8c2010" />
      <rect x="11" y="3" width="3" height="8" fill="#7e1c10" />
      <rect x="11" y="3" width="1" height="6" fill="#a8301c" />
      <rect x="18" y="4" width="2" height="7" fill="#4a0c08" />
      <rect x="20" y="4" width="1" height="6" fill="#2a0608" />
      <polygon points="11,3 9,-2 13,2" fill="#5a1208" />
      <polygon points="11,3 10,-1 12,2" fill="#7e1c10" />
      <polygon points="21,3 23,-2 19,2" fill="#3a0a08" />

      <!-- Eyes — hot core + spark -->
      <rect x="11" y="5" width="4" height="1" fill="#1a0404" />
      <rect x="17" y="5" width="4" height="1" fill="#1a0404" />
      <rect x="12" y="6" width="2" height="2" fill="#ff7a3a" />
      <rect x="18" y="6" width="2" height="2" fill="#ff7a3a" />
      <rect x="12" y="6" width="1" height="1" fill="#fff4d0" />
      <rect x="18" y="6" width="1" height="1" fill="#fff4d0" />
      <rect x="13" y="7" width="1" height="1" fill="#e8401a" />
      <rect x="19" y="7" width="1" height="1" fill="#e8401a" />

      <!-- Fanged maw -->
      <rect x="11" y="9" width="10" height="2" fill="#1a0404" />
      <rect x="12" y="10" width="1" height="1" fill="#e8e0d4" />
      <rect x="15" y="10" width="1" height="1" fill="#e8e0d4" />
      <rect x="18" y="10" width="1" height="1" fill="#d4c4a8" />
      <rect x="11" y="9" width="10" height="1" fill="#b53c4a" opacity="0.7" />

      <!-- Demon torso — layered red ramp, lit ridge down centre -->
      <polygon points="9,12 23,12 25,24 19,31 13,31 7,24" fill="#4a0c08" />
      <polygon points="10,13 22,13 24,23 18,30 14,30 8,23" fill="#6a140e" />
      <polygon points="11,14 21,14 22,22 16,28 10,22" fill="#8c2010" />
      <polygon points="9,12 8,23 13,30 13,12" fill="#5a1208" opacity="0.5" />
      <rect x="15" y="14" width="2" height="15" fill="#b53c4a" opacity="0.65" />
      <rect x="15" y="14" width="1" height="9" fill="#d85a5a" opacity="0.5" />
      <!-- Rib dither -->
      <rect x="12" y="17" width="1" height="1" fill="#a8301c" />
      <rect x="19" y="18" width="1" height="1" fill="#3a0a08" />
      <rect x="11" y="21" width="1" height="1" fill="#a8301c" />
      <rect x="20" y="22" width="1" height="1" fill="#3a0a08" />

      <!-- Left bladed arm/wing -->
      <polygon points="9,13 2,11 0,18 7,19" fill="#4a0c08" />
      <polygon points="9,13 3,12 1,17 7,18" fill="#6a140e" />
      <polygon points="7,18 1,24 4,26 9,21" fill="#5a1208" />
      <polygon points="7,18 2,23 4,25 9,20" fill="#6a140e" opacity="0.7" />
      <polygon points="0,17 -2,15 1,18" fill="#2a0608" />
      <rect x="1" y="12" width="2" height="1" fill="#8c2010" />

      <!-- Right bladed arm/wing — shadow side -->
      <polygon points="23,13 30,11 32,18 25,19" fill="#3a0a08" />
      <polygon points="24,13 30,12 31,17 25,18" fill="#5a1208" />
      <polygon points="25,18 31,24 28,26 23,21" fill="#3a0a08" />
      <polygon points="32,17 34,15 31,18" fill="#2a0608" />

      <!-- Lower claws -->
      <polygon points="3,24 6,23 4,30" fill="#3a0a08" />
      <polygon points="3,24 5,23 4,28" fill="#5a1208" opacity="0.6" />
      <polygon points="29,24 26,23 28,30" fill="#2a0608" />

      <!-- Legs -->
      <rect x="12" y="31" width="3" height="9" fill="#5a1208" />
      <rect x="12" y="31" width="1" height="9" fill="#7e1c10" />
      <rect x="14" y="31" width="1" height="9" fill="#3a0a08" />
      <rect x="17" y="31" width="3" height="9" fill="#5a1208" />
      <rect x="17" y="31" width="1" height="9" fill="#6a140e" />
      <rect x="19" y="31" width="1" height="9" fill="#2a0608" />
      <!-- Taloned feet -->
      <polygon points="10,40 15,40 14,43 11,43" fill="#2a0608" />
      <polygon points="10,40 15,40 14,41 11,41" fill="#4a0c08" />
      <polygon points="17,40 22,40 21,43 18,43" fill="#2a0608" />

      <!-- Drifting embers -->
      <rect x="14" y="19" width="1" height="1" fill="#ff7a3a" opacity="0.7" />
      <rect x="6" y="9" width="1" height="1" fill="#e8a020" opacity="0.5" />
      <rect x="26" y="20" width="1" height="1" fill="#ff7a3a" opacity="0.5" />
      <rect x="13" y="26" width="1" height="1" fill="#d85a5a" opacity="0.5" />
    </svg>
