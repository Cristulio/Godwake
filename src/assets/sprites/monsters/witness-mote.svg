<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 20 20"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Witness-Mote"
    >
      <!-- Watcher-light bloom + faint hover shadow -->
      <ellipse cx="10" cy="9" rx="10" ry="9" fill="#7a6ec0" opacity="0.12" />
      <ellipse cx="10" cy="18.6" rx="5" ry="0.9" fill="#000" opacity="0.26" />

      <!-- ── Orb — small pale watcher, key upper-left ── -->
      <rect x="5" y="1" width="10" height="2" fill="#150d08" />
      <rect x="3" y="3" width="14" height="3" fill="#150d08" />
      <rect x="2" y="6" width="16" height="6" fill="#150d08" />
      <rect x="3" y="12" width="14" height="3" fill="#150d08" />
      <rect x="5" y="15" width="10" height="2" fill="#150d08" />
      <!-- fill -->
      <rect x="6" y="2" width="8" height="1" fill="#3a3450" />
      <rect x="4" y="3" width="12" height="3" fill="#3a3450" />
      <rect x="3" y="6" width="14" height="6" fill="#332e48" />
      <rect x="4" y="12" width="12" height="2" fill="#2a2440" />
      <rect x="6" y="14" width="8" height="2" fill="#241f33" />
      <!-- lit crown -->
      <rect x="6" y="2" width="4" height="1" fill="#524a74" />
      <rect x="4" y="3" width="4" height="2" fill="#524a74" />
      <rect x="4" y="3" width="2" height="1" fill="#6a6292" />
      <rect x="3" y="6" width="2" height="3" fill="#453e62" />
      <!-- cool shade -->
      <rect x="15" y="6" width="2" height="6" fill="#241f33" />
      <rect x="14" y="12" width="2" height="2" fill="#1d1930" />
      <rect x="16" y="9" width="1" height="3" fill="#1c2e34" />

      <!-- ── The unblinking iris — gold ring, wide black pupil ── -->
      <rect x="6" y="5" width="8" height="9" fill="#5a4c22" />
      <rect x="7" y="4" width="6" height="11" fill="#5a4c22" />
      <rect x="7" y="5" width="6" height="9" fill="#a8862e" />
      <rect x="7" y="5" width="3" height="4" fill="#d4ae42" />
      <rect x="7" y="5" width="2" height="2" fill="#e8d27a" />
      <!-- pupil -->
      <rect x="8" y="7" width="4" height="5" fill="#0a0612" />
      <rect x="9" y="8" width="2" height="3" fill="#000000" />
      <!-- witness glint — it has already seen you -->
      <rect x="8" y="7" width="1" height="1" fill="#ffffff" />
      <rect x="11" y="10" width="1" height="1" fill="#cdd3e6" opacity="0.6" />

      <!-- ── Lid creases — lashless, never shut ── -->
      <rect x="5" y="3" width="10" height="1" fill="#241f33" opacity="0.7" />
      <rect x="5" y="15" width="10" height="1" fill="#1d1930" opacity="0.8" />

      <!-- ── Drifting witness-sparks — what it records ── -->
      <rect x="1" y="5" width="1" height="1" fill="#e6eaf6" opacity="0.6" />
      <rect x="18" y="7" width="1" height="1" fill="#cdd3e6" opacity="0.5" />
      <rect x="2" y="13" width="1" height="1" fill="#7a6ec0" opacity="0.55" />
      <rect x="17" y="14" width="1" height="1" fill="#7a6ec0" opacity="0.45" />
      <rect x="9" y="0" width="1" height="1" fill="#e6eaf6" opacity="0.5" />
      <rect x="13" y="17" width="1" height="1" fill="#9a8ee0" opacity="0.4" />
      <rect x="5" y="17" width="1" height="1" fill="#7a6ec0" opacity="0.35" />
    </svg>
