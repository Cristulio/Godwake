<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 14 14"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Witness-Mote"
    >
      <!-- Watcher backlight -->
      <ellipse cx="7" cy="7" rx="6" ry="5.5" fill="#7a8ad0" opacity="0.12" />

      <!-- Floating eye — sclera ramp, lit upper-left -->
      <ellipse cx="7" cy="7" rx="5" ry="4" fill="#1e1a2c" />
      <ellipse cx="7" cy="7" rx="4" ry="3" fill="#b8bed4" />
      <ellipse cx="6.5" cy="6.5" rx="3.2" ry="2.4" fill="#cdd3e6" />
      <ellipse cx="6" cy="6" rx="1.8" ry="1.2" fill="#e6eaf6" />
      <!-- Shadowed lower curve -->
      <ellipse cx="8" cy="8.5" rx="3" ry="1.4" fill="#9aa0bc" opacity="0.6" />

      <!-- Iris + pupil + spark -->
      <circle cx="7" cy="7" r="1.6" fill="#15101e" />
      <circle cx="7" cy="7" r="0.9" fill="#3a2c1e" />
      <rect x="7" y="7" width="1" height="1" fill="#e8d27a" />
      <rect x="6" y="6" width="1" height="1" fill="#ffffff" opacity="0.85" />

      <!-- Wet rim of lashes -->
      <rect x="2" y="6" width="1" height="1" fill="#3a3450" />
      <rect x="11" y="6" width="1" height="1" fill="#2a2440" />
      <rect x="6" y="3" width="1" height="1" fill="#3a3450" />
      <rect x="7" y="11" width="1" height="1" fill="#2a2440" />

      <!-- Drifting wisp tail -->
      <rect x="6" y="11" width="1" height="2" fill="#3a3450" opacity="0.7" />
      <rect x="5" y="12" width="1" height="1" fill="#3a3450" opacity="0.5" />
    </svg>
