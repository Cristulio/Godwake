<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 26 32"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Karmic Echo"
    >
      <!-- Karmic violet backlight + faint shadow -->
      <ellipse cx="13" cy="16" rx="12" ry="15" fill="#6a4a9c" opacity="0.1" />
      <ellipse cx="13" cy="30" rx="8" ry="1.6" fill="#0e0818" opacity="0.32" />

      <!-- Trailing echo — receding translucent layers -->
      <rect x="3" y="6" width="12" height="22" fill="#3a2a5a" opacity="0.3" />
      <rect x="6" y="4" width="12" height="24" fill="#4a3a6a" opacity="0.4" />
      <rect x="9" y="3" width="12" height="25" fill="#5a4a7a" opacity="0.5" />

      <!-- Head — violet ramp, key upper-left -->
      <rect x="10" y="3" width="8" height="7" fill="#5a4a7a" />
      <rect x="10" y="3" width="8" height="1" fill="#3a2a5a" />
      <rect x="10" y="3" width="3" height="7" fill="#6a5a8c" />
      <rect x="10" y="3" width="1" height="5" fill="#7a6a9c" />
      <rect x="17" y="3" width="1" height="7" fill="#3a2a5a" />
      <!-- Spectral eyes + spark -->
      <rect x="11" y="5" width="2" height="2" fill="#a48ee0" />
      <rect x="15" y="5" width="2" height="2" fill="#a48ee0" />
      <rect x="11" y="5" width="1" height="1" fill="#e8d4ff" />
      <rect x="15" y="5" width="1" height="1" fill="#e8d4ff" />
      <rect x="12" y="8" width="4" height="1" fill="#2a1c40" />

      <!-- Torso — ramp + dither -->
      <rect x="8" y="10" width="12" height="15" fill="#5a4a7a" />
      <rect x="8" y="10" width="3" height="15" fill="#6a5a8c" />
      <rect x="8" y="10" width="1" height="15" fill="#7a6a9c" />
      <rect x="18" y="10" width="2" height="15" fill="#3a2a5a" />
      <rect x="8" y="10" width="12" height="1" fill="#3a2a5a" />
      <rect x="13" y="11" width="2" height="14" fill="#3a2a5a" opacity="0.6" />
      <rect x="9" y="13" width="10" height="1" fill="#c4b0f0" opacity="0.35" />
      <rect x="10" y="17" width="8" height="1" fill="#c4b0f0" opacity="0.3" />
      <rect x="11" y="15" width="1" height="1" fill="#6a5a8c" />
      <rect x="16" y="22" width="1" height="1" fill="#3a2a5a" />

      <!-- Drifting arms -->
      <rect x="5" y="13" width="3" height="8" fill="#4a3a6a" opacity="0.7" />
      <rect x="20" y="13" width="3" height="8" fill="#6a5a8c" />
      <rect x="20" y="13" width="1" height="8" fill="#7a6a9c" />

      <!-- Rising motes -->
      <rect x="9" y="6" width="2" height="2" fill="#a48ee0" opacity="0.35" />
      <rect x="6" y="8" width="2" height="2" fill="#a48ee0" opacity="0.25" />
      <rect x="21" y="11" width="1" height="1" fill="#e8d4ff" opacity="0.4" />

      <!-- Dissolving tatters -->
      <polygon points="8,25 11,30 14,25" fill="#5a4a7a" />
      <polygon points="13,25 16,30 19,25" fill="#5a4a7a" />
      <polygon points="11,25 14,28 17,25" fill="#6a5a8c" opacity="0.6" />
    </svg>
