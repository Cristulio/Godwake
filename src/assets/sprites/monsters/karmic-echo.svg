<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 35 43"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Karmic Echo"
    >
      <!-- Violet echo backlight + faint ground shadow -->
      <ellipse cx="17" cy="20" rx="17" ry="19" fill="#a48ee0" opacity="0.1" />
      <ellipse cx="16" cy="41.6" rx="9" ry="1.4" fill="#000" opacity="0.3" />

      <!-- ── The echoes — two fainter selves, offset behind ── -->
      <!-- second echo, faintest, furthest right -->
      <rect x="20" y="4" width="9" height="8" fill="#3a2a5a" opacity="0.35" />
      <rect x="21" y="12" width="10" height="14" fill="#3a2a5a" opacity="0.3" />
      <rect x="22" y="26" width="8" height="9" fill="#3a2a5a" opacity="0.22" />
      <rect x="22" y="6" width="2" height="1" fill="#a48ee0" opacity="0.3" />
      <!-- first echo, nearer -->
      <rect x="16" y="3" width="10" height="9" fill="#4a3a6c" opacity="0.5" />
      <rect x="17" y="12" width="11" height="15" fill="#4a3a6c" opacity="0.45" />
      <rect x="18" y="27" width="9" height="10" fill="#4a3a6c" opacity="0.35" />
      <rect x="18" y="6" width="2" height="1" fill="#c4b0f0" opacity="0.45" />
      <rect x="24" y="6" width="2" height="1" fill="#a48ee0" opacity="0.4" />

      <!-- ── The present self — sharpest, drawn last ── -->
      <!-- head -->
      <rect x="8" y="2" width="12" height="11" fill="#150d08" />
      <rect x="9" y="3" width="10" height="9" fill="#5a4a7a" />
      <rect x="9" y="3" width="10" height="1" fill="#6a5a8c" />
      <rect x="9" y="3" width="3" height="8" fill="#645484" />
      <rect x="9" y="3" width="1" height="5" fill="#7a6aa0" />
      <rect x="16" y="4" width="3" height="8" fill="#4a3a6c" />
      <rect x="18" y="5" width="1" height="7" fill="#3a2a5a" />
      <!-- face — looking back over its shoulder at its own echoes -->
      <rect x="10" y="6" width="3" height="2" fill="#241838" />
      <rect x="15" y="6" width="3" height="2" fill="#241838" />
      <rect x="10" y="6" width="2" height="1" fill="#e8d4ff" />
      <rect x="15" y="6" width="2" height="1" fill="#c4b0f0" />
      <rect x="10" y="6" width="1" height="1" fill="#ffffff" />
      <rect x="15" y="6" width="1" height="1" fill="#e8d4ff" />
      <!-- mouth open — mid-plea, repeating -->
      <rect x="12" y="9" width="4" height="2" fill="#241838" />
      <rect x="13" y="10" width="2" height="1" fill="#1a1028" />

      <!-- ── Torso — violet after-image flesh, debts written on it ── -->
      <rect x="6" y="13" width="14" height="16" fill="#150d08" />
      <rect x="7" y="14" width="12" height="14" fill="#5a4a7a" />
      <rect x="7" y="14" width="12" height="1" fill="#6a5a8c" />
      <rect x="7" y="14" width="3" height="13" fill="#645484" />
      <rect x="7" y="14" width="1" height="9" fill="#7a6aa0" />
      <rect x="16" y="14" width="3" height="13" fill="#4a3a6c" />
      <rect x="18" y="15" width="1" height="12" fill="#3a2a5a" />
      <!-- karmic script — glowing tally-glyphs of what it owes -->
      <rect x="9" y="16" width="2" height="1" fill="#c4b0f0" />
      <rect x="12" y="16" width="1" height="1" fill="#a48ee0" />
      <rect x="14" y="16" width="2" height="1" fill="#c4b0f0" opacity="0.8" />
      <rect x="9" y="19" width="1" height="1" fill="#a48ee0" />
      <rect x="11" y="19" width="2" height="1" fill="#c4b0f0" opacity="0.7" />
      <rect x="15" y="19" width="1" height="1" fill="#8a72c0" />
      <rect x="10" y="22" width="2" height="1" fill="#a48ee0" opacity="0.8" />
      <rect x="13" y="22" width="1" height="1" fill="#c4b0f0" />
      <rect x="9" y="25" width="1" height="1" fill="#8a72c0" />
      <rect x="12" y="25" width="2" height="1" fill="#a48ee0" opacity="0.6" />
      <!-- the heart-debt — brightest glyph, dead center -->
      <ellipse cx="13" cy="20.5" rx="3.4" ry="3" fill="#c4b0f0" opacity="0.2" />
      <rect x="12" y="20" width="2" height="2" fill="#e8d4ff" />
      <rect x="12" y="20" width="1" height="1" fill="#ffffff" />

      <!-- ── Arms — the present reaches forward, the echoes lag ── -->
      <rect x="2" y="14" width="6" height="4" fill="#150d08" />
      <rect x="3" y="15" width="4" height="2" fill="#5a4a7a" />
      <rect x="3" y="15" width="4" height="1" fill="#6a5a8c" />
      <rect x="1" y="17" width="4" height="6" fill="#150d08" />
      <rect x="2" y="18" width="2" height="4" fill="#645484" />
      <rect x="2" y="18" width="1" height="2" fill="#7a6aa0" />
      <!-- reaching hand -->
      <rect x="1" y="23" width="4" height="3" fill="#150d08" />
      <rect x="2" y="24" width="2" height="1" fill="#7a6aa0" />
      <rect x="1" y="26" width="1" height="2" fill="#150d08" />
      <rect x="3" y="26" width="1" height="2" fill="#150d08" />
      <rect x="1" y="26" width="1" height="1" fill="#c4b0f0" />
      <rect x="3" y="26" width="1" height="1" fill="#a48ee0" />
      <!-- trailing arm dissolving into the first echo -->
      <rect x="19" y="15" width="4" height="4" fill="#4a3a6c" opacity="0.6" />
      <rect x="22" y="17" width="3" height="3" fill="#3a2a5a" opacity="0.45" />
      <rect x="24" y="19" width="3" height="3" fill="#3a2a5a" opacity="0.3" />

      <!-- ── Lower body — skirt of after-images, stepped fade ── -->
      <rect x="7" y="29" width="12" height="5" fill="#150d08" />
      <rect x="8" y="30" width="10" height="3" fill="#524270" />
      <rect x="8" y="30" width="10" height="1" fill="#645484" />
      <rect x="8" y="30" width="3" height="3" fill="#5a4a7a" />
      <rect x="16" y="30" width="2" height="3" fill="#42325c" />
      <rect x="6" y="34" width="14" height="3" fill="#150d08" opacity="0.85" />
      <rect x="7" y="35" width="12" height="1" fill="#4a3a6c" opacity="0.8" />
      <rect x="5" y="37" width="16" height="2" fill="#150d08" opacity="0.55" />
      <rect x="7" y="39" width="12" height="2" fill="#150d08" opacity="0.35" />
      <rect x="9" y="41" width="8" height="1" fill="#150d08" opacity="0.2" />
      <!-- violet seep between the fade-steps -->
      <rect x="10" y="36" width="2" height="1" fill="#a48ee0" opacity="0.4" />
      <rect x="14" y="38" width="2" height="1" fill="#8a72c0" opacity="0.35" />

      <!-- ── Echo motes — the same spark, three times ── -->
      <rect x="4" y="8" width="1" height="1" fill="#e8d4ff" opacity="0.7" />
      <rect x="23" y="9" width="1" height="1" fill="#c4b0f0" opacity="0.5" />
      <rect x="28" y="11" width="1" height="1" fill="#a48ee0" opacity="0.35" />
      <rect x="3" y="31" width="1" height="1" fill="#a48ee0" opacity="0.45" />
      <rect x="25" y="30" width="1" height="1" fill="#8a72c0" opacity="0.3" />
      <rect x="31" y="20" width="1" height="1" fill="#a48ee0" opacity="0.25" />
    </svg>
