<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 48 66"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Void-Warden"
    >
      <!-- Cold void backlight + hover shadow -->
      <ellipse cx="24" cy="32" rx="23" ry="30" fill="#1a3a6a" opacity="0.1" />
      <ellipse cx="24" cy="63.5" rx="14" ry="2" fill="#000" opacity="0.4" />
      <ellipse cx="24" cy="63" rx="8" ry="1.2" fill="#3a6f8c" opacity="0.2" />

      <!-- star pixels in the dark -->
      <rect x="6" y="8" width="1" height="1" fill="#d6f4ff" opacity="0.5" />
      <rect x="42" y="14" width="1" height="1" fill="#7ad0e8" opacity="0.45" />
      <rect x="4" y="38" width="1" height="1" fill="#7ad0e8" opacity="0.4" />
      <rect x="44" y="44" width="1" height="1" fill="#d6f4ff" opacity="0.35" />

      <!-- ══ Crest — pointed warden helm ══ -->
      <rect x="21" y="0" width="6" height="4" fill="#150d08" />
      <rect x="22" y="1" width="4" height="3" fill="#1e2438" />
      <rect x="22" y="1" width="2" height="3" fill="#2a3248" />
      <rect x="22" y="1" width="1" height="2" fill="#3a4258" />
      <rect x="17" y="3" width="14" height="5" fill="#150d08" />
      <rect x="18" y="4" width="12" height="4" fill="#1e2438" />
      <rect x="18" y="4" width="5" height="4" fill="#2a3248" />
      <rect x="18" y="4" width="2" height="3" fill="#3a4258" />
      <rect x="27" y="4" width="3" height="4" fill="#141826" />
      <!-- crest rim light -->
      <rect x="18" y="4" width="12" height="1" fill="#46506a" />
      <rect x="29" y="4" width="1" height="4" fill="#3a6f8c" opacity="0.5" />

      <!-- ══ Face — the void behind the visor ══ -->
      <rect x="15" y="8" width="18" height="14" fill="#150d08" />
      <rect x="16" y="9" width="16" height="12" fill="#0a0c14" />
      <rect x="17" y="10" width="14" height="10" fill="#05070c" />
      <!-- faint inner glow ring -->
      <rect x="19" y="12" width="10" height="6" fill="#0e1c2a" />
      <rect x="20" y="13" width="8" height="4" fill="#16303f" />
      <!-- void eyes -->
      <rect x="19" y="13" width="3" height="3" fill="#7ad0e8" />
      <rect x="26" y="13" width="3" height="3" fill="#5aa8c8" />
      <rect x="19" y="13" width="1" height="1" fill="#d6f4ff" />
      <rect x="26" y="13" width="1" height="1" fill="#a8e0f0" />
      <!-- visor edge -->
      <rect x="16" y="9" width="16" height="1" fill="#1e2438" />
      <rect x="16" y="9" width="6" height="1" fill="#2a3248" />

      <!-- ══ Shoulder plates — folded space ══ -->
      <rect x="9" y="20" width="12" height="7" fill="#150d08" />
      <rect x="10" y="21" width="10" height="5" fill="#1e2438" />
      <rect x="10" y="21" width="10" height="2" fill="#2a3248" />
      <rect x="10" y="21" width="4" height="1" fill="#46506a" />
      <rect x="27" y="20" width="12" height="7" fill="#150d08" />
      <rect x="28" y="21" width="10" height="5" fill="#141826" />
      <rect x="28" y="21" width="10" height="1" fill="#1e2438" />
      <rect x="36" y="21" width="2" height="5" fill="#0a0c14" />
      <!-- cyan seam on the shadow shoulder -->
      <rect x="37" y="21" width="1" height="5" fill="#3a6f8c" opacity="0.55" />

      <!-- ══ Segmented shell body ══ -->
      <rect x="12" y="22" width="24" height="28" fill="#150d08" />
      <rect x="13" y="23" width="22" height="26" fill="#1a2034" />
      <rect x="13" y="23" width="7" height="26" fill="#222a40" />
      <rect x="13" y="23" width="3" height="20" fill="#2e3850" />
      <rect x="31" y="23" width="4" height="26" fill="#10141f" />
      <rect x="34" y="23" width="1" height="26" fill="#0a0c14" />
      <!-- segment seams -->
      <rect x="13" y="29" width="22" height="1" fill="#0a0c14" />
      <rect x="13" y="36" width="22" height="1" fill="#0a0c14" />
      <rect x="13" y="43" width="22" height="1" fill="#080a10" />
      <!-- segment top bevels -->
      <rect x="13" y="30" width="22" height="1" fill="#2e3850" />
      <rect x="13" y="30" width="6" height="1" fill="#3a4664" />
      <rect x="13" y="37" width="22" height="1" fill="#2a3248" />
      <rect x="13" y="37" width="5" height="1" fill="#364260" />
      <rect x="13" y="44" width="22" height="1" fill="#222a40" />
      <!-- cool rim light down the right edge -->
      <rect x="35" y="23" width="1" height="26" fill="#3a6f8c" opacity="0.4" />
      <!-- plate dither -->
      <rect x="16" y="26" width="1" height="1" fill="#2e3850" />
      <rect x="30" y="33" width="1" height="1" fill="#0a0c14" />
      <rect x="15" y="40" width="1" height="1" fill="#2a3248" />
      <rect x="31" y="46" width="1" height="1" fill="#080a10" />

      <!-- ══ The void well — where light goes in ══ -->
      <rect x="18" y="28" width="12" height="14" fill="#150d08" />
      <rect x="19" y="29" width="10" height="12" fill="#05070c" />
      <rect x="20" y="30" width="8" height="10" fill="#0a1622" />
      <rect x="21" y="31" width="6" height="8" fill="#10283a" />
      <rect x="22" y="33" width="4" height="5" fill="#1a4456" />
      <rect x="23" y="34" width="2" height="3" fill="#3a6f8c" />
      <rect x="23" y="34" width="2" height="2" fill="#7ad0e8" />
      <rect x="23" y="34" width="1" height="1" fill="#ffffff" />
      <!-- light folding INTO the well -->
      <rect x="14" y="34" width="4" height="1" fill="#3a6f8c" opacity="0.6" />
      <rect x="16" y="35" width="3" height="1" fill="#7ad0e8" opacity="0.5" />
      <rect x="30" y="33" width="4" height="1" fill="#3a6f8c" opacity="0.55" />
      <rect x="29" y="34" width="3" height="1" fill="#5aa8c8" opacity="0.5" />
      <rect x="23" y="26" width="1" height="3" fill="#3a6f8c" opacity="0.5" />
      <rect x="24" y="41" width="1" height="3" fill="#3a6f8c" opacity="0.45" />

      <!-- ══ Floating blade-shards (left, lit) ══ -->
      <rect x="3" y="22" width="6" height="3" fill="#150d08" />
      <rect x="4" y="23" width="4" height="1" fill="#2e3850" />
      <rect x="4" y="23" width="2" height="1" fill="#46506a" />
      <rect x="2" y="28" width="7" height="4" fill="#150d08" />
      <rect x="3" y="29" width="5" height="2" fill="#222a40" />
      <rect x="3" y="29" width="2" height="1" fill="#3a4664" />
      <rect x="4" y="34" width="6" height="3" fill="#150d08" />
      <rect x="5" y="35" width="4" height="1" fill="#1e2438" />
      <!-- cyan edges -->
      <rect x="3" y="24" width="5" height="1" fill="#3a6f8c" opacity="0.6" />
      <rect x="2" y="31" width="6" height="1" fill="#7ad0e8" opacity="0.5" />
      <rect x="4" y="36" width="5" height="1" fill="#3a6f8c" opacity="0.45" />

      <!-- ══ Floating blade-shards (right, shadow) ══ -->
      <rect x="39" y="22" width="6" height="3" fill="#150d08" />
      <rect x="40" y="23" width="4" height="1" fill="#141826" />
      <rect x="39" y="28" width="7" height="4" fill="#150d08" />
      <rect x="40" y="29" width="5" height="2" fill="#10141f" />
      <rect x="38" y="34" width="6" height="3" fill="#150d08" />
      <rect x="39" y="35" width="4" height="1" fill="#0e1220" />
      <rect x="40" y="24" width="5" height="1" fill="#3a6f8c" opacity="0.5" />
      <rect x="40" y="31" width="6" height="1" fill="#5aa8c8" opacity="0.45" />
      <rect x="39" y="36" width="5" height="1" fill="#3a6f8c" opacity="0.4" />

      <!-- ══ Tapering shell skirt — hovering ══ -->
      <rect x="14" y="50" width="20" height="4" fill="#150d08" />
      <rect x="15" y="51" width="18" height="3" fill="#141826" />
      <rect x="15" y="51" width="6" height="2" fill="#1e2438" />
      <rect x="17" y="54" width="14" height="4" fill="#150d08" />
      <rect x="18" y="55" width="12" height="3" fill="#10141f" />
      <rect x="18" y="55" width="4" height="2" fill="#1a2034" />
      <rect x="20" y="58" width="8" height="3" fill="#150d08" />
      <rect x="21" y="59" width="6" height="2" fill="#0a0c14" />
      <!-- point -->
      <rect x="22" y="61" width="4" height="2" fill="#150d08" />
      <rect x="23" y="61" width="2" height="1" fill="#080a10" />
      <!-- void motes dripping beneath -->
      <rect x="19" y="60" width="1" height="1" fill="#3a6f8c" opacity="0.5" />
      <rect x="28" y="59" width="1" height="1" fill="#7ad0e8" opacity="0.4" />
      <rect x="24" y="63" width="1" height="1" fill="#3a6f8c" opacity="0.35" />
    </svg>
