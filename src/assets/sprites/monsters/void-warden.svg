<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 44"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Void-Warden"
    >
      <!-- Cold void backlight + ground shadow -->
      <ellipse cx="16" cy="24" rx="15" ry="20" fill="#1a3a6a" opacity="0.1" />
      <ellipse cx="16" cy="42" rx="11" ry="1.7" fill="#000" opacity="0.42" />

      <!-- Carapace shell — armor ramp, key light upper-left + cool rim -->
      <polygon points="16,2 7,12 9,32 16,40 23,32 25,12" fill="#141826" />
      <polygon points="16,5 10,13 11,30 16,37 21,30 22,13" fill="#1e2438" />
      <polygon points="16,2 7,12 9,22 11,13" fill="#2a3248" opacity="0.6" />
      <polygon points="16,2 25,12 23,22 21,13" fill="#0a0c14" opacity="0.7" />
      <rect x="9" y="14" width="1" height="14" fill="#3a4258" opacity="0.5" />
      <rect x="22" y="14" width="1" height="14" fill="#3a6f8c" opacity="0.35" />
      <!-- Plate dither -->
      <rect x="12" y="20" width="1" height="1" fill="#2a3248" />
      <rect x="19" y="24" width="1" height="1" fill="#0a0c14" />

      <!-- Face plate + void eyes -->
      <polygon points="11,8 21,8 22,16 16,21 10,16" fill="#0a0c14" />
      <ellipse cx="16" cy="14" rx="4" ry="5" fill="#05070c" />
      <ellipse cx="16" cy="14" rx="2" ry="3" fill="#3a6f8c" opacity="0.6" />
      <rect x="13" y="12" width="2" height="2" fill="#7ad0e8" />
      <rect x="17" y="12" width="2" height="2" fill="#7ad0e8" />
      <rect x="13" y="12" width="1" height="1" fill="#d6f4ff" />
      <rect x="17" y="12" width="1" height="1" fill="#d6f4ff" />

      <!-- Chest core — layered void well + specular -->
      <ellipse cx="16" cy="26" rx="5" ry="6" fill="#05070c" />
      <ellipse cx="16" cy="26" rx="3.5" ry="4.5" fill="#1a3a52" opacity="0.75" />
      <ellipse cx="16" cy="26" rx="2" ry="3" fill="#3a6f8c" opacity="0.7" />
      <ellipse cx="16" cy="26" rx="1" ry="2" fill="#7ad0e8" opacity="0.85" />
      <rect x="15" y="24" width="1" height="1" fill="#d6f4ff" opacity="0.8" />

      <!-- Side blades / arms -->
      <polygon points="9,16 3,22 1,32 5,28 9,22" fill="#141826" />
      <polygon points="9,16 4,21 6,22 9,20" fill="#1e2438" opacity="0.6" />
      <polygon points="1,31 4,29 2,36" fill="#0a0c14" />
      <polygon points="23,16 29,22 31,32 27,28 23,22" fill="#141826" />
      <polygon points="31,31 28,29 30,36" fill="#0a0c14" />
      <rect x="2" y="30" width="1" height="1" fill="#7ad0e8" opacity="0.5" />
      <rect x="29" y="30" width="1" height="1" fill="#7ad0e8" opacity="0.45" />

      <!-- Robe-shell legs -->
      <polygon points="9,32 16,40 23,32 22,42 10,42" fill="#0a0c14" />
      <polygon points="9,32 16,40 13,40 10,36" fill="#141826" opacity="0.6" />
      <polygon points="11,38 14,38 13,43 10,43" fill="#05070c" />
      <polygon points="18,38 21,38 22,43 19,43" fill="#05070c" />

      <!-- Drifting void motes -->
      <rect x="14" y="33" width="1" height="1" fill="#3a6f8c" opacity="0.5" />
      <rect x="18" y="29" width="1" height="1" fill="#7ad0e8" opacity="0.45" />
      <rect x="6" y="20" width="1" height="1" fill="#3a6f8c" opacity="0.4" />
    </svg>
