<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 34 46"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="The Hollow Pretender"
    >
      <!-- Layered void/gold backlight + ground shadow -->
      <ellipse cx="17" cy="22" rx="16" ry="22" fill="#2a1840" opacity="0.28" />
      <ellipse cx="17" cy="20" rx="11" ry="16" fill="#c0a040" opacity="0.08" />
      <ellipse cx="17" cy="43" rx="13" ry="2" fill="#0a0610" opacity="0.5" />

      <!-- Robe wings — dark with a lit inner fold -->
      <polygon points="9,42 8,15 13,11 13,42" fill="#160e22" />
      <polygon points="9,42 8,16 12,12 12,42" fill="#1e1430" opacity="0.9" />
      <polygon points="25,42 26,15 21,11 21,42" fill="#120a1c" />
      <polygon points="9,16 13,12 13,15 9,18" fill="#352350" opacity="0.6" />
      <polygon points="26,16 21,12 21,15 25,18" fill="#241634" opacity="0.6" />

      <!-- Hollow head void behind the mask -->
      <rect x="11" y="3" width="12" height="13" fill="#0e0a16" />
      <ellipse cx="17" cy="9" rx="5" ry="6" fill="#060308" />
      <ellipse cx="17" cy="9" rx="3" ry="4" fill="#1a1228" opacity="0.6" />
      <rect x="11" y="3" width="12" height="2" fill="#2a1d3e" />
      <rect x="11" y="3" width="12" height="1" fill="#46306a" />
      <rect x="11" y="14" width="12" height="2" fill="#1a1228" />

      <!-- Porcelain mask — pale ramp + crown + eye/mouth voids -->
      <polygon points="11,2 17,-2 23,2 23,13 19,16 15,16 11,13" fill="#dccfb8" />
      <polygon points="11,2 17,-2 23,2 23,11 17,15 11,11" fill="#ece2cf" opacity="0.65" />
      <polygon points="11,2 17,-2 20,1 19,13 15,16 11,13" fill="#e8dec9" opacity="0.4" />
      <rect x="13" y="3" width="1" height="11" fill="#f4ecd8" opacity="0.6" />
      <rect x="21" y="3" width="2" height="11" fill="#c2b59c" opacity="0.6" />
      <rect x="13" y="7" width="3" height="3" fill="#060308" />
      <rect x="18" y="7" width="3" height="3" fill="#060308" />
      <rect x="13" y="7" width="1" height="1" fill="#1a1424" />
      <rect x="16" y="11" width="2" height="3" fill="#060308" />
      <!-- Gold crown band -->
      <polygon points="11,2 17,-2 23,2" fill="#c0a040" />
      <polygon points="13,1 17,-2 21,1" fill="#f4d042" />
      <rect x="16" y="-2" width="2" height="2" fill="#fff0b0" />
      <rect x="13" y="0" width="1" height="2" fill="#f4d042" />
      <rect x="20" y="0" width="1" height="2" fill="#c0a040" />

      <!-- Robe torso — violet ramp + jewelled placket + dither -->
      <rect x="9" y="16" width="16" height="20" fill="#241634" />
      <rect x="9" y="16" width="16" height="2" fill="#352350" />
      <rect x="9" y="16" width="16" height="1" fill="#46306a" />
      <rect x="9" y="16" width="3" height="20" fill="#2c1d44" />
      <rect x="9" y="16" width="1" height="20" fill="#3a2658" />
      <rect x="23" y="17" width="2" height="19" fill="#1a1028" />
      <rect x="24" y="17" width="1" height="19" fill="#150c22" />
      <rect x="15" y="18" width="4" height="18" fill="#160e22" />
      <rect x="11" y="19" width="3" height="3" fill="#c0a040" />
      <rect x="11" y="19" width="3" height="1" fill="#f4d042" />
      <rect x="11" y="19" width="1" height="1" fill="#fff0b0" />
      <rect x="10" y="23" width="14" height="1" fill="#c0a040" opacity="0.6" />
      <rect x="11" y="27" width="12" height="1" fill="#a0c0d0" opacity="0.45" />
      <rect x="12" y="31" width="10" height="1" fill="#9a7e2e" opacity="0.5" />
      <rect x="13" y="25" width="1" height="1" fill="#3a2658" />
      <rect x="20" y="29" width="1" height="1" fill="#150c22" />

      <!-- Arms — left pale hand, right staff -->
      <rect x="3" y="18" width="6" height="3" fill="#241634" />
      <rect x="3" y="18" width="6" height="1" fill="#352350" />
      <rect x="2" y="20" width="4" height="10" fill="#2c1d44" />
      <rect x="2" y="20" width="1" height="10" fill="#3a2658" />
      <rect x="2" y="29" width="5" height="3" fill="#dccfb8" />
      <rect x="2" y="29" width="5" height="1" fill="#ece2cf" />
      <rect x="25" y="18" width="6" height="3" fill="#1e1430" />
      <rect x="27" y="6" width="2" height="15" fill="#2c1d44" />
      <rect x="27" y="6" width="1" height="15" fill="#3a2658" />
      <!-- Staff flame -->
      <rect x="27" y="2" width="2" height="6" fill="#c0a040" />
      <rect x="27" y="2" width="2" height="3" fill="#f4d042" />
      <polygon points="26,2 28,-1 30,2" fill="#fff0b0" opacity="0.85" />
      <polygon points="27,1 28,-1 29,2" fill="#fffae0" opacity="0.8" />
      <rect x="27" y="0" width="1" height="2" fill="#ffffff" />

      <!-- Robe hem feet -->
      <rect x="10" y="36" width="6" height="7" fill="#1e1430" />
      <rect x="10" y="36" width="1" height="7" fill="#2c1d44" />
      <rect x="18" y="36" width="6" height="7" fill="#180e26" />
      <rect x="9" y="42" width="8" height="2" fill="#0c0814" />
      <rect x="18" y="42" width="8" height="2" fill="#0a0612" />
      <rect x="12" y="38" width="1" height="4" fill="#46306a" opacity="0.5" />
      <rect x="21" y="38" width="1" height="4" fill="#352350" opacity="0.5" />

      <!-- Drifting motes -->
      <rect x="6" y="33" width="1" height="1" fill="#f4d042" opacity="0.55" />
      <rect x="28" y="26" width="1" height="1" fill="#a0c0d0" opacity="0.5" />
      <rect x="17" y="44" width="1" height="1" fill="#ece2cf" opacity="0.45" />
    </svg>
