<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 44"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Aurelach, the Hollow Dawn"
    >
      <!-- great dawn-halo -->
      <circle cx="15" cy="9" r="11" fill="#f4d878" opacity="0.18" />
      <circle cx="15" cy="9" r="8.5" fill="none" stroke="#f4d878" stroke-width="0.7" opacity="0.6" />
      <circle cx="15" cy="9" r="6.5" fill="none" stroke="#fff0b0" stroke-width="0.5" opacity="0.7" />
      <!-- radiating rays -->
      <rect x="14" y="-2" width="2" height="4" fill="#fff0b0" opacity="0.6" />
      <rect x="6" y="2" width="3" height="1" fill="#f4d878" opacity="0.5" />
      <rect x="21" y="2" width="3" height="1" fill="#f4d878" opacity="0.5" />

      <!-- wings of fixed light -->
      <polygon points="9,16 0,6 1,26 9,24" fill="#e8c860" opacity="0.55" />
      <polygon points="21,16 30,6 29,26 21,24" fill="#e8c860" opacity="0.55" />
      <polygon points="9,16 3,11 4,22 9,21" fill="#fff0b0" opacity="0.45" />
      <polygon points="21,16 27,11 26,22 21,21" fill="#fff0b0" opacity="0.45" />

      <!-- crowned, tired head -->
      <polygon points="15,1 11,5 19,5" fill="#e8c860" />
      <rect x="11" y="3" width="1" height="2" fill="#fff0b0" />
      <rect x="15" y="2" width="1" height="2" fill="#fff0b0" />
      <rect x="18" y="3" width="1" height="2" fill="#fff0b0" />
      <rect x="10" y="5" width="10" height="9" fill="#e0d8c4" />
      <rect x="10" y="5" width="10" height="1" fill="#c8bca0" />
      <!-- eyes: weary coins of dawn-light -->
      <rect x="11" y="8" width="3" height="2" fill="#f4d878" />
      <rect x="16" y="8" width="3" height="2" fill="#f4d878" />
      <rect x="11" y="8" width="3" height="1" fill="#fff8e0" />
      <rect x="16" y="8" width="3" height="1" fill="#fff8e0" />
      <rect x="12" y="12" width="6" height="1" fill="#9a8c70" />

      <!-- radiant robed body -->
      <polygon points="9,14 21,14 25,42 5,42" fill="#d4b850" />
      <polygon points="9,14 21,14 23,32 7,32" fill="#e8cc68" />
      <polygon points="11,14 19,14 20,30 10,30" fill="#f4dc88" />
      <!-- breast-light -->
      <circle cx="15" cy="20" r="3" fill="#fff4c0" opacity="0.85" />
      <circle cx="15" cy="20" r="1.5" fill="#ffffff" />
      <rect x="14" y="23" width="2" height="16" fill="#fff0b0" opacity="0.5" />

      <!-- left hand, open and tired at its side -->
      <rect x="5" y="16" width="3" height="11" fill="#d4b850" />
      <rect x="4" y="25" width="4" height="3" fill="#e0d8c4" />

      <!-- right arm raising the Blade of the First Morning -->
      <rect x="22" y="15" width="3" height="7" fill="#d4b850" />
      <rect x="24" y="9" width="2" height="7" fill="#e0d8c4" />
      <rect x="22" y="8" width="6" height="1" fill="#c8b878" />
      <!-- the dawn-blade: oldest cold light -->
      <rect x="24" y="-4" width="2" height="13" fill="#eaf4ff" opacity="0.92" />
      <rect x="24" y="-4" width="1" height="13" fill="#ffffff" />
      <rect x="23" y="-4" width="4" height="2" fill="#cfe0ff" opacity="0.6" />

      <!-- hem of light -->
      <polygon points="5,42 9,37 13,42" fill="#b89c40" />
      <polygon points="13,42 17,37 21,42" fill="#b89c40" />
      <polygon points="17,42 21,37 25,42" fill="#b89c40" />
      <polygon points="9,42 12,38 15,42" fill="#d4b850" />
      <polygon points="15,42 18,38 21,42" fill="#d4b850" />
    </svg>
