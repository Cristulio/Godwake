      <rect x="17" y="36" width="1" height="1" fill="#2c1a28" />
      <rect x="28" y="40" width="1" height="1" fill="#0c060c" />
      <rect x="19" y="47" width="1" height="1" fill="#2c1a28" />
      <rect x="27" y="52" width="1" height="1" fill="#0c060c" />

      <!-- ══ Blood sash — shoulder to hip ══ -->
      <rect x="14" y="26" width="5" height="3" fill="#5a1208" />
      <rect x="14" y="26" width="5" height="1" fill="#8c2818" />
      <rect x="17" y="29" width="5" height="3" fill="#5a1208" />
      <rect x="17" y="29" width="5" height="1" fill="#8c2818" />
      <rect x="14" y="26" width="2" height="1" fill="#b53c4a" />
      <rect x="20" y="32" width="5" height="3" fill="#5a1208" />
      <rect x="20" y="32" width="5" height="1" fill="#7a1f12" />
      <rect x="23" y="35" width="5" height="3" fill="#4a0e06" />
      <rect x="23" y="35" width="5" height="1" fill="#7a1f12" />
      <rect x="26" y="38" width="5" height="3" fill="#4a0e06" />
      <rect x="26" y="38" width="5" height="1" fill="#6a1a0e" />

