      <rect x="10" y="26" width="6" height="14" fill="#150d08" />
      <rect x="11" y="27" width="4" height="12" fill="#241224" />
      <rect x="11" y="27" width="2" height="12" fill="#321e30" />
      <rect x="9" y="38" width="7" height="10" fill="#150d08" />
      <rect x="10" y="39" width="5" height="8" fill="#1d0f1c" />
      <rect x="10" y="39" width="2" height="8" fill="#241224" />
      <!-- pale gloved hand, four long fingers -->
      <rect x="9" y="46" width="7" height="4" fill="#150d08" />
      <rect x="10" y="47" width="5" height="3" fill="#c4b89c" />
      <rect x="10" y="47" width="2" height="3" fill="#d4c8a8" />
      <rect x="9" y="49" width="8" height="8" fill="#150d08" />
      <rect x="10" y="50" width="1" height="6" fill="#d4c8a8" />
      <rect x="12" y="50" width="1" height="7" fill="#c4b89c" />
      <rect x="14" y="50" width="1" height="6" fill="#b4a88c" />
      <rect x="16" y="50" width="1" height="5" fill="#a4987c" />

      <!-- ══ Right arm — gripping the glaive haft ══ -->
      <rect x="31" y="27" width="8" height="6" fill="#150d08" />
      <rect x="32" y="28" width="6" height="4" fill="#190d18" />
      <rect x="32" y="28" width="2" height="4" fill="#241224" />
      <rect x="34" y="31" width="7" height="6" fill="#150d08" />
      <rect x="35" y="32" width="5" height="4" fill="#1d0f1c" />
      <!-- gripping hand over haft -->
      <rect x="36" y="35" width="7" height="6" fill="#150d08" />
      <rect x="37" y="36" width="5" height="4" fill="#c4b89c" />
      <rect x="37" y="36" width="2" height="4" fill="#d4c8a8" />
      <rect x="38" y="38" width="1" height="1" fill="#988c70" />
      <rect x="40" y="38" width="1" height="1" fill="#988c70" />

      <!-- ══ Robe hem — tattered, floor-length ══ -->
      <rect x="13" y="57" width="22" height="3" fill="#120812" />
      <rect x="12" y="60" width="24" height="14" fill="#150d08" />
      <rect x="13" y="61" width="22" height="12" fill="#1d0f1c" />
      <rect x="13" y="61" width="5" height="12" fill="#241224" />
      <rect x="13" y="61" width="2" height="10" fill="#2c1a28" />
      <rect x="31" y="61" width="4" height="12" fill="#120812" />
      <!-- fold lines -->
      <rect x="20" y="61" width="1" height="12" fill="#120812" />
      <rect x="27" y="61" width="1" height="12" fill="#0c060c" />
      <!-- tattered hem notches -->
      <rect x="15" y="71" width="2" height="2" fill="#0a0508" />
      <rect x="19" y="72" width="2" height="1" fill="#0a0508" />
      <rect x="24" y="71" width="2" height="2" fill="#0a0508" />
      <rect x="29" y="72" width="2" height="1" fill="#0a0508" />
      <rect x="13" y="73" width="22" height="1" fill="#0a0508" />
    </svg>
