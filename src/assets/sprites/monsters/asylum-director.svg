      <rect x="17" y="47" width="3" height="3" fill="none" stroke="#6e6a78" stroke-width="1" />
      <!-- three hanging keys -->
      <rect x="16" y="50" width="1" height="4" fill="#c89a48" />
      <rect x="15" y="53" width="2" height="1" fill="#ecc46a" />
      <rect x="18" y="50" width="1" height="5" fill="#9a9ab0" />
      <rect x="17" y="54" width="2" height="1" fill="#c2c2d4" />
      <rect x="20" y="50" width="1" height="3" fill="#b0a486" />
      <rect x="19" y="52" width="2" height="1" fill="#d4c8a8" />

