      <rect x="13" y="25" width="22" height="7" fill="#1d0f1c" />
      <rect x="13" y="25" width="6" height="7" fill="#241224" />
      <rect x="13" y="25" width="2" height="5" fill="#321e30" />
      <rect x="31" y="25" width="4" height="7" fill="#120812" />
      <!-- torso column -->
      <rect x="13" y="31" width="22" height="26" fill="#150d08" />
      <rect x="14" y="32" width="20" height="25" fill="#1d0f1c" />
      <rect x="14" y="32" width="5" height="25" fill="#241224" />
      <rect x="14" y="32" width="2" height="20" fill="#2c1a28" />
      <rect x="30" y="32" width="4" height="25" fill="#120812" />
      <rect x="33" y="32" width="1" height="25" fill="#0c060c" />
      <!-- center seam -->
