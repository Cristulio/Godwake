      <rect x="20" y="25" width="8" height="5" fill="#150d08" />
      <rect x="21" y="26" width="6" height="3" fill="#c89a48" />
      <rect x="21" y="26" width="6" height="1" fill="#ecc46a" />
      <rect x="21" y="26" width="2" height="1" fill="#fff0b8" />
      <rect x="23" y="27" width="2" height="2" fill="#1d0f1c" />

