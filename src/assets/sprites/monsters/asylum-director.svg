<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 48 80"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="The Asylum Director"
    >
      <!-- Sanguine backlight + violet ambient + ground shadow -->
      <ellipse cx="22" cy="36" rx="19" ry="30" fill="#7a1410" opacity="0.09" />
      <ellipse cx="30" cy="50" rx="14" ry="22" fill="#503d78" opacity="0.06" />
      <ellipse cx="23" cy="77.5" rx="15" ry="2.3" fill="#000" opacity="0.5" />

      <!-- psychic halo motes behind the hood -->
      <rect x="12" y="7" width="1" height="1" fill="#a48ee0" opacity="0.8" />
      <rect x="34" y="10" width="1" height="1" fill="#7a5db8" opacity="0.7" />
      <rect x="9" y="16" width="1" height="1" fill="#7a5db8" opacity="0.55" />
      <rect x="37" y="22" width="1" height="1" fill="#a48ee0" opacity="0.5" />

      <!-- ══ Surgical glaive — crescent blade, ash haft ══ -->
      <!-- blade outline -->
      <rect x="32" y="0" width="14" height="3" fill="#150d08" />
      <rect x="30" y="2" width="8" height="3" fill="#150d08" />
      <rect x="29" y="4" width="6" height="4" fill="#150d08" />
      <rect x="30" y="7" width="4" height="4" fill="#150d08" />
      <rect x="36" y="3" width="8" height="4" fill="#150d08" />
      <!-- crescent steel — bright inner edge -->
      <rect x="33" y="1" width="12" height="1" fill="#9aa2b4" />
      <rect x="33" y="1" width="6" height="1" fill="#c8ccd8" />
      <rect x="31" y="3" width="6" height="1" fill="#e8ecf4" />
      <rect x="37" y="3" width="6" height="1" fill="#7a8294" />
      <rect x="30" y="4" width="4" height="1" fill="#c8ccd8" />
      <rect x="34" y="4" width="6" height="2" fill="#5a6274" />
      <rect x="30" y="5" width="3" height="2" fill="#9aa2b4" />
      <rect x="31" y="7" width="2" height="3" fill="#7a8294" />
      <rect x="31" y="9" width="1" height="1" fill="#e8ecf4" />
      <!-- blood groove fleck -->
      <rect x="36" y="5" width="2" height="1" fill="#8c2818" />
      <!-- haft -->
      <rect x="38" y="7" width="5" height="61" fill="#150d08" />
      <rect x="39" y="7" width="3" height="60" fill="#3c322a" />
      <rect x="39" y="7" width="1" height="60" fill="#52443a" />
      <rect x="41" y="7" width="1" height="60" fill="#26201c" />
      <!-- iron ferrules -->
      <rect x="39" y="12" width="3" height="1" fill="#6e6a78" />
      <rect x="39" y="13" width="3" height="1" fill="#2e2a38" />
      <rect x="39" y="34" width="3" height="1" fill="#6e6a78" />
      <rect x="39" y="35" width="3" height="1" fill="#2e2a38" />
      <!-- butt spike -->
      <rect x="38" y="67" width="5" height="4" fill="#150d08" />
      <rect x="39" y="67" width="3" height="3" fill="#3a3644" />
      <rect x="39" y="67" width="1" height="2" fill="#56525e" />

      <!-- ══ Hood — tall peak bent right ══ -->
      <rect x="20" y="0" width="8" height="3" fill="#150d08" />
      <rect x="18" y="2" width="11" height="4" fill="#150d08" />
      <rect x="16" y="5" width="15" height="5" fill="#150d08" />
      <rect x="14" y="9" width="20" height="16" fill="#150d08" />
      <!-- hood cloth -->
      <rect x="21" y="1" width="5" height="2" fill="#241224" />
      <rect x="19" y="3" width="8" height="3" fill="#2c1a28" />
      <rect x="19" y="3" width="3" height="2" fill="#3a2438" />
      <rect x="17" y="6" width="12" height="4" fill="#241224" />
      <rect x="17" y="6" width="4" height="3" fill="#321e30" />
      <rect x="25" y="6" width="4" height="4" fill="#190d18" />
