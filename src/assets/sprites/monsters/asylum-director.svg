      <rect x="15" y="10" width="18" height="14" fill="#1d0f1c" />
      <rect x="15" y="10" width="3" height="14" fill="#2c1a28" />
      <rect x="15" y="10" width="1" height="10" fill="#3a2438" />
      <rect x="30" y="10" width="3" height="14" fill="#120812" />
      <!-- hood interior shadow ring -->
      <rect x="17" y="11" width="14" height="2" fill="#0a0508" />
      <rect x="17" y="11" width="1" height="12" fill="#0a0508" />
      <rect x="30" y="11" width="1" height="12" fill="#0a0508" />

      <!-- ══ Bone-porcelain mask ══ -->
      <rect x="18" y="12" width="12" height="12" fill="#150d08" />
      <rect x="19" y="13" width="10" height="11" fill="#d4c8a8" />
      <rect x="19" y="13" width="4" height="11" fill="#e8e0c4" />
      <rect x="19" y="13" width="2" height="8" fill="#f4eecf" />
      <rect x="27" y="13" width="2" height="11" fill="#b0a486" />
      <rect x="28" y="13" width="1" height="11" fill="#988c70" />
      <!-- vertical seam -->
      <rect x="24" y="13" width="1" height="11" fill="#b0a486" />
      <!-- trepan hole — violet light inside -->
      <rect x="22" y="14" width="3" height="2" fill="#150d08" />
      <rect x="23" y="14" width="1" height="2" fill="#6a52a0" />
      <rect x="23" y="14" width="1" height="1" fill="#a48ee0" />
      <!-- sunken eye pits + red embers -->
      <rect x="20" y="17" width="3" height="3" fill="#0a0508" />
      <rect x="25" y="17" width="3" height="3" fill="#0a0508" />
      <rect x="21" y="18" width="2" height="1" fill="#8c2818" />
      <rect x="21" y="18" width="1" height="1" fill="#e85a4a" />
      <rect x="26" y="18" width="1" height="1" fill="#b53c4a" />
