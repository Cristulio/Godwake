      <rect x="26" y="21" width="1" height="2" fill="#b0a486" />
      <rect x="28" y="21" width="1" height="2" fill="#b0a486" />
      <!-- no mouth — smooth chin taper -->
      <rect x="21" y="23" width="6" height="1" fill="#c4b89c" />

