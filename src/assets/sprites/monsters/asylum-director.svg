      <rect x="14" y="43" width="20" height="3" fill="#150d08" />
      <rect x="15" y="44" width="18" height="1" fill="#3c2c1c" />
      <rect x="15" y="44" width="6" height="1" fill="#52391f" />
      <rect x="22" y="43" width="3" height="3" fill="#150d08" />
      <rect x="22" y="44" width="2" height="1" fill="#6e6a78" />
      <rect x="22" y="44" width="1" height="1" fill="#9a96a4" />
