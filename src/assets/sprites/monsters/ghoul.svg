<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 46"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Ghoul"
    >
      <!-- Sickly carrion backlight + ground-contact shadow -->
      <ellipse cx="15" cy="24" rx="14" ry="20" fill="#4a7a52" opacity="0.08" />
      <ellipse cx="15" cy="44.6" rx="11" ry="1.7" fill="#000" opacity="0.4" />

      <!-- ── Hunched spine ridge — vertebrae poking the skin ── -->
      <rect x="16" y="9" width="9" height="6" fill="#150d08" />
      <rect x="17" y="10" width="7" height="4" fill="#6a6a58" />
      <rect x="17" y="10" width="7" height="1" fill="#8a8a78" />
      <rect x="22" y="11" width="2" height="3" fill="#52524a" />
      <!-- knuckled vertebrae -->
      <rect x="18" y="9" width="1" height="2" fill="#a4a48e" />
      <rect x="20" y="8" width="1" height="2" fill="#a4a48e" />
      <rect x="22" y="9" width="1" height="2" fill="#8a8a78" />

      <!-- ── Tufts of dead hair ── -->
      <rect x="6" y="6" width="1" height="3" fill="#2a1a10" />
      <rect x="9" y="5" width="2" height="2" fill="#2a1a10" />
      <rect x="13" y="6" width="1" height="2" fill="#2a1a10" />

      <!-- ── Skull-tight head — thrust forward low, pallid ramp ── -->
      <rect x="4" y="7" width="13" height="11" fill="#150d08" />
      <rect x="5" y="8" width="11" height="9" fill="#6a6a58" />
      <rect x="5" y="8" width="11" height="1" fill="#8a8a78" />
      <rect x="5" y="8" width="3" height="8" fill="#8a8a78" />
      <rect x="5" y="8" width="1" height="5" fill="#a4a48e" />
      <rect x="14" y="9" width="2" height="8" fill="#52524a" />
      <rect x="15" y="11" width="1" height="6" fill="#3a3a32" />
      <!-- sunken temple pits -->
      <rect x="6" y="12" width="2" height="2" fill="#52524a" />
      <rect x="12" y="12" width="2" height="2" fill="#44443a" />

      <!-- ── Hollow eyes — gold ember, predatory squint ── -->
      <rect x="6" y="10" width="3" height="2" fill="#0a0a08" />
      <rect x="11" y="10" width="3" height="2" fill="#0a0a08" />
      <rect x="6" y="10" width="3" height="1" fill="#1a1208" />
      <rect x="11" y="10" width="3" height="1" fill="#1a1208" />
      <rect x="7" y="11" width="2" height="1" fill="#c4a430" />
      <rect x="12" y="11" width="2" height="1" fill="#a08824" />
      <rect x="7" y="11" width="1" height="1" fill="#fff0a0" />
      <rect x="12" y="11" width="1" height="1" fill="#e8cc70" />

      <!-- pinched nasal hole -->
      <rect x="9" y="13" width="2" height="1" fill="#1a1410" />

      <!-- ── Gore-wet maw — fangs and a dripping chin ── -->
      <rect x="5" y="14" width="11" height="3" fill="#150d08" />
      <rect x="6" y="14" width="9" height="2" fill="#1a1410" />
      <rect x="6" y="14" width="1" height="2" fill="#e8dcc4" />
      <rect x="8" y="14" width="1" height="3" fill="#f0e6cc" />
      <rect x="10" y="14" width="1" height="2" fill="#e8dcc4" />
      <rect x="12" y="14" width="1" height="3" fill="#d4c8a8" />
      <rect x="14" y="14" width="1" height="2" fill="#b8ac90" />
      <!-- blood slick on the jaw -->
      <rect x="7" y="16" width="6" height="1" fill="#6a1f18" />
      <rect x="9" y="17" width="1" height="2" fill="#8c2a20" />
      <rect x="11" y="17" width="1" height="1" fill="#6a1f18" opacity="0.8" />

      <!-- ── Crouched torso — caved gut under the rib shelf ── -->
      <rect x="7" y="17" width="17" height="13" fill="#150d08" />
      <rect x="8" y="18" width="15" height="11" fill="#6a6a58" />
      <rect x="8" y="18" width="15" height="1" fill="#7a7a66" />
      <rect x="8" y="18" width="4" height="10" fill="#8a8a78" />
      <rect x="8" y="18" width="1" height="7" fill="#a4a48e" />
      <rect x="19" y="19" width="4" height="10" fill="#52524a" />
      <rect x="21" y="20" width="2" height="9" fill="#44443a" />
      <rect x="22" y="22" width="1" height="4" fill="#3e5650" />
      <!-- rib shelf bars -->
      <rect x="9" y="20" width="8" height="1" fill="#8a8a78" />
      <rect x="9" y="22" width="8" height="1" fill="#7a7a66" />
      <rect x="9" y="24" width="7" height="1" fill="#6e6e5c" />
      <rect x="9" y="21" width="1" height="1" fill="#52524a" />
      <rect x="13" y="23" width="1" height="1" fill="#52524a" />
      <!-- caved belly hollow -->
      <rect x="10" y="26" width="9" height="3" fill="#44443a" />
      <rect x="11" y="27" width="7" height="2" fill="#2e2e26" />
      <rect x="12" y="28" width="5" height="1" fill="#22221c" />

      <!-- ── Left arm — reaching to the ground, gore-stained claw ── -->
      <rect x="2" y="18" width="6" height="6" fill="#150d08" />
      <rect x="3" y="19" width="4" height="4" fill="#8a8a78" />
      <rect x="3" y="19" width="2" height="3" fill="#a4a48e" />
      <rect x="3" y="19" width="1" height="2" fill="#bcbc9e" />
      <rect x="1" y="23" width="5" height="11" fill="#150d08" />
      <rect x="2" y="24" width="3" height="9" fill="#6a6a58" />
      <rect x="2" y="24" width="1" height="9" fill="#8a8a78" />
      <rect x="4" y="24" width="1" height="9" fill="#44443a" />
      <!-- elbow knob -->
      <rect x="2" y="28" width="3" height="1" fill="#52524a" />
      <!-- long digging claw, knuckles down -->
      <rect x="0" y="33" width="7" height="4" fill="#150d08" />
      <rect x="1" y="34" width="5" height="2" fill="#8a8a78" />
      <rect x="1" y="34" width="2" height="1" fill="#a4a48e" />
      <rect x="0" y="37" width="1" height="3" fill="#150d08" />
      <rect x="2" y="37" width="1" height="3" fill="#150d08" />
      <rect x="4" y="37" width="1" height="3" fill="#150d08" />
      <rect x="6" y="37" width="1" height="2" fill="#150d08" />
      <rect x="0" y="37" width="1" height="1" fill="#d4c8a8" />
      <rect x="2" y="37" width="1" height="2" fill="#e8dcc4" />
      <rect x="4" y="37" width="1" height="1" fill="#d4c8a8" />
      <!-- old blood under the nails -->
      <rect x="2" y="39" width="1" height="1" fill="#6a1f18" />

      <!-- ── Right arm — braced on the knee ── -->
      <rect x="22" y="20" width="6" height="6" fill="#150d08" />
      <rect x="23" y="21" width="4" height="4" fill="#52524a" />
      <rect x="23" y="21" width="2" height="2" fill="#6a6a58" />
      <rect x="24" y="25" width="5" height="9" fill="#150d08" />
      <rect x="25" y="26" width="3" height="7" fill="#52524a" />
      <rect x="25" y="26" width="1" height="7" fill="#6a6a58" />
      <rect x="27" y="26" width="1" height="7" fill="#3a3a32" />
      <rect x="24" y="33" width="5" height="3" fill="#150d08" />
      <rect x="25" y="34" width="3" height="1" fill="#52524a" />
      <rect x="25" y="35" width="1" height="2" fill="#150d08" />
      <rect x="27" y="35" width="1" height="2" fill="#150d08" />
      <rect x="25" y="35" width="1" height="1" fill="#b8ac90" />
      <rect x="27" y="35" width="1" height="1" fill="#a4a48e" />

      <!-- ── Tattered loincloth ── -->
      <rect x="8" y="29" width="14" height="4" fill="#150d08" />
      <rect x="9" y="30" width="12" height="2" fill="#3a2e22" />
      <rect x="9" y="30" width="12" height="1" fill="#52402e" />
      <rect x="12" y="31" width="1" height="3" fill="#2a1f16" />
      <rect x="16" y="31" width="1" height="2" fill="#2a1f16" />
      <rect x="19" y="31" width="1" height="3" fill="#2a1f16" />

      <!-- ── Coiled digitigrade legs — sprung crouch ── -->
      <rect x="8" y="32" width="6" height="7" fill="#150d08" />
      <rect x="9" y="33" width="4" height="5" fill="#6a6a58" />
      <rect x="9" y="33" width="1" height="5" fill="#8a8a78" />
      <rect x="11" y="33" width="2" height="5" fill="#52524a" />
      <rect x="15" y="33" width="6" height="6" fill="#150d08" />
      <rect x="16" y="34" width="4" height="4" fill="#52524a" />
      <rect x="16" y="34" width="1" height="4" fill="#6a6a58" />
      <!-- shin doubling back -->
      <rect x="9" y="38" width="4" height="5" fill="#150d08" />
      <rect x="10" y="39" width="2" height="4" fill="#6a6a58" />
      <rect x="10" y="39" width="1" height="4" fill="#7a7a66" />
      <rect x="16" y="38" width="4" height="5" fill="#150d08" />
      <rect x="17" y="39" width="2" height="4" fill="#44443a" />

      <!-- ── Splayed clawed feet ── -->
      <rect x="7" y="42" width="8" height="3" fill="#150d08" />
      <rect x="8" y="43" width="6" height="1" fill="#6a6a58" />
      <rect x="8" y="42" width="6" height="1" fill="#8a8a78" />
      <rect x="7" y="44" width="1" height="1" fill="#d4c8a8" />
      <rect x="10" y="44" width="1" height="1" fill="#e8dcc4" />
      <rect x="13" y="44" width="1" height="1" fill="#d4c8a8" />
      <rect x="16" y="42" width="8" height="3" fill="#150d08" />
      <rect x="17" y="43" width="6" height="1" fill="#52524a" />
      <rect x="17" y="42" width="6" height="1" fill="#6a6a58" />
      <rect x="16" y="44" width="1" height="1" fill="#c2b794" />
      <rect x="19" y="44" width="1" height="1" fill="#d4c8a8" />
      <rect x="22" y="44" width="1" height="1" fill="#a89878" />
    </svg>
