<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 56 44"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Spider Broodmother"
    >
      <!-- Brood-glow backlight + ground shadow -->
      <ellipse cx="29" cy="25" rx="26" ry="16" fill="#6a2a4a" opacity="0.09" />
      <ellipse cx="28" cy="41.5" rx="22" ry="2.2" fill="#000" opacity="0.42" />

      <!-- web line anchoring her to the dark above -->
      <rect x="38" y="0" width="1" height="9" fill="#cfc6ac" opacity="0.35" />

      <!-- ══ Far legs (behind the body) ══ -->
      <rect x="8" y="12" width="4" height="3" fill="#1a0a18" />
      <rect x="5" y="9" width="4" height="4" fill="#1a0a18" />
      <rect x="3" y="6" width="3" height="4" fill="#1a0a18" />
      <rect x="44" y="11" width="4" height="3" fill="#1a0a18" />
      <rect x="47" y="8" width="4" height="4" fill="#1a0a18" />
      <rect x="50" y="5" width="3" height="4" fill="#1a0a18" />

      <!-- ══ Abdomen — bulbous, marked ══ -->
      <rect x="30" y="8" width="20" height="4" fill="#150d08" />
      <rect x="26" y="11" width="27" height="18" fill="#150d08" />
      <rect x="30" y="28" width="20" height="6" fill="#150d08" />
      <rect x="31" y="9" width="18" height="3" fill="#3c1c34" />
      <rect x="27" y="12" width="25" height="16" fill="#451f3c" />
      <rect x="31" y="28" width="18" height="5" fill="#33182c" />
      <!-- lit crown of the abdomen -->
      <rect x="29" y="12" width="14" height="7" fill="#582a4a" />
      <rect x="30" y="12" width="9" height="4" fill="#6a3658" />
      <rect x="31" y="12" width="4" height="2" fill="#7e4268" />
      <!-- shadow side -->
      <rect x="46" y="14" width="6" height="14" fill="#33182c" />
      <rect x="49" y="16" width="3" height="10" fill="#281222" />
      <!-- the brood-mark — pale hourglass -->
      <rect x="38" y="15" width="6" height="3" fill="#c8a0b8" />
      <rect x="39" y="18" width="4" height="2" fill="#b08aa0" />
      <rect x="38" y="20" width="6" height="3" fill="#a87a94" />
      <rect x="39" y="16" width="2" height="1" fill="#e0c4d4" />
      <!-- bristle dither -->
      <rect x="33" y="22" width="2" height="1" fill="#582a4a" />
      <rect x="42" y="24" width="2" height="1" fill="#33182c" />
      <rect x="36" y="26" width="2" height="1" fill="#451f3c" />

      <!-- ══ Egg sacs slung beneath the abdomen ══ -->
      <rect x="29" y="31" width="9" height="9" fill="#150d08" />
      <rect x="30" y="32" width="7" height="7" fill="#d8ccb4" />
      <rect x="30" y="32" width="3" height="7" fill="#e8e0cc" />
      <rect x="35" y="32" width="2" height="7" fill="#c0b49a" />
      <!-- spiderlings inside -->
      <rect x="32" y="34" width="2" height="2" fill="#451f3c" />
      <rect x="34" y="36" width="1" height="1" fill="#33182c" />
      <rect x="31" y="37" width="1" height="1" fill="#33182c" />
      <rect x="40" y="33" width="8" height="8" fill="#150d08" />
      <rect x="41" y="34" width="6" height="6" fill="#c0b49a" />
      <rect x="41" y="34" width="2" height="6" fill="#d8ccb4" />
      <rect x="43" y="36" width="2" height="2" fill="#3c1c34" />
      <rect x="45" y="38" width="1" height="1" fill="#281222" />
      <!-- silk wrapping the sacs -->
      <rect x="29" y="34" width="9" height="1" fill="#cfc6ac" opacity="0.5" />
      <rect x="40" y="36" width="8" height="1" fill="#cfc6ac" opacity="0.4" />

      <!-- ══ Cephalothorax + head ══ -->
      <rect x="13" y="14" width="18" height="16" fill="#150d08" />
      <rect x="14" y="15" width="16" height="14" fill="#3c1c34" />
      <rect x="14" y="15" width="6" height="14" fill="#4a2440" />
      <rect x="14" y="15" width="3" height="9" fill="#582a4a" />
      <rect x="27" y="15" width="3" height="14" fill="#2e1628" />
      <!-- chitin plate seam -->
      <rect x="14" y="21" width="16" height="1" fill="#281222" />
      <!-- head front -->
      <rect x="7" y="18" width="10" height="13" fill="#150d08" />
      <rect x="8" y="19" width="8" height="11" fill="#451f3c" />
      <rect x="8" y="19" width="3" height="11" fill="#582a4a" />
      <!-- eye cluster — six hungry reds -->
      <rect x="9" y="20" width="3" height="3" fill="#1a0a18" />
      <rect x="13" y="20" width="3" height="3" fill="#1a0a18" />
      <rect x="10" y="21" width="2" height="2" fill="#e23030" />
      <rect x="14" y="21" width="2" height="2" fill="#b52424" />
      <rect x="10" y="21" width="1" height="1" fill="#ff8a6a" />
      <rect x="14" y="21" width="1" height="1" fill="#e85a4a" />
      <rect x="9" y="24" width="2" height="2" fill="#b52424" />
      <rect x="12" y="24" width="2" height="2" fill="#8e1c1c" />
      <rect x="15" y="24" width="2" height="2" fill="#8e1c1c" />
      <rect x="9" y="24" width="1" height="1" fill="#e23030" />
      <rect x="12" y="24" width="1" height="1" fill="#b52424" />
      <!-- fangs — venom-wet -->
      <rect x="8" y="29" width="3" height="5" fill="#150d08" />
      <rect x="9" y="30" width="1" height="3" fill="#e8e0cc" />
      <rect x="12" y="29" width="3" height="5" fill="#150d08" />
      <rect x="13" y="30" width="1" height="3" fill="#cdc4ac" />
      <rect x="9" y="33" width="1" height="1" fill="#9ac84a" />
      <rect x="13" y="33" width="1" height="1" fill="#7ab040" />

      <!-- ══ Near legs — thick stepped chitin ══ -->
      <!-- front-left pair -->
      <rect x="6" y="24" width="5" height="4" fill="#150d08" />
      <rect x="2" y="27" width="6" height="4" fill="#150d08" />
      <rect x="0" y="30" width="5" height="4" fill="#150d08" />
      <rect x="1" y="34" width="4" height="6" fill="#150d08" />
      <rect x="7" y="25" width="3" height="2" fill="#4a2440" />
      <rect x="3" y="28" width="4" height="2" fill="#3c1c34" />
      <rect x="1" y="31" width="3" height="2" fill="#33182c" />
      <rect x="2" y="35" width="2" height="4" fill="#2e1628" />
      <!-- chitin glint -->
      <rect x="7" y="25" width="2" height="1" fill="#6a3658" />
      <!-- mid-left leg -->
      <rect x="12" y="28" width="5" height="4" fill="#150d08" />
      <rect x="9" y="31" width="6" height="4" fill="#150d08" />
      <rect x="8" y="34" width="4" height="7" fill="#150d08" />
      <rect x="13" y="29" width="3" height="2" fill="#451f3c" />
      <rect x="10" y="32" width="4" height="2" fill="#3c1c34" />
      <rect x="9" y="35" width="2" height="5" fill="#2e1628" />
      <!-- mid-right leg -->
      <rect x="30" y="28" width="6" height="4" fill="#150d08" />
      <rect x="34" y="31" width="6" height="4" fill="#150d08" />
      <rect x="37" y="34" width="4" height="7" fill="#150d08" />
      <rect x="31" y="29" width="4" height="2" fill="#33182c" />
      <rect x="35" y="32" width="4" height="2" fill="#2e1628" />
      <rect x="38" y="35" width="2" height="5" fill="#281222" />
      <!-- far-right pair -->
      <rect x="46" y="26" width="6" height="4" fill="#150d08" />
      <rect x="50" y="29" width="5" height="4" fill="#150d08" />
      <rect x="52" y="32" width="4" height="5" fill="#150d08" />
      <rect x="51" y="36" width="4" height="5" fill="#150d08" />
      <rect x="47" y="27" width="4" height="2" fill="#33182c" />
      <rect x="51" y="30" width="3" height="2" fill="#2e1628" />
      <rect x="53" y="33" width="2" height="3" fill="#281222" />
      <rect x="52" y="37" width="2" height="3" fill="#221020" />

      <!-- leg-tip claws on the ground -->
      <rect x="2" y="39" width="2" height="2" fill="#e8e0cc" opacity="0.9" />
      <rect x="9" y="39" width="2" height="2" fill="#cdc4ac" opacity="0.9" />
      <rect x="38" y="40" width="2" height="1" fill="#cdc4ac" opacity="0.8" />
      <rect x="52" y="40" width="2" height="1" fill="#b0a88c" opacity="0.8" />

      <!-- brood motes -->
      <rect x="22" y="10" width="1" height="1" fill="#c8a0b8" opacity="0.5" />
      <rect x="49" y="20" width="1" height="1" fill="#a87a94" opacity="0.45" />
    </svg>
