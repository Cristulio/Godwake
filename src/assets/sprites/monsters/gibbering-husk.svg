<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 22 32"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Gibbering Husk"
    >
      <!-- Sickly aberrant backlight + ground shadow -->
      <ellipse cx="11" cy="16" rx="10" ry="14" fill="#6a4a7a" opacity="0.08" />
      <ellipse cx="11" cy="31" rx="7" ry="1.3" fill="#000" opacity="0.4" />

      <!-- Lolling head — flesh ramp, key upper-left -->
      <rect x="6" y="3" width="9" height="7" fill="#5a4a5a" />
      <rect x="6" y="3" width="9" height="1" fill="#6a5a6a" />
      <rect x="6" y="3" width="2" height="7" fill="#6a5a6a" />
      <rect x="6" y="3" width="1" height="4" fill="#7a6a7a" />
      <rect x="13" y="4" width="2" height="6" fill="#3a2a3a" />
      <rect x="5" y="5" width="1" height="3" fill="#4a5a6a" opacity="0.5" />

      <!-- Too many eyes, mismatched, with sparks -->
      <rect x="7" y="5" width="1" height="1" fill="#c4d442" />
      <rect x="9" y="4" width="1" height="1" fill="#c4d442" />
      <rect x="11" y="5" width="1" height="1" fill="#c4d442" />
      <rect x="13" y="4" width="1" height="1" fill="#9aca5a" />
      <rect x="9" y="4" width="1" height="1" fill="#e8f0a0" opacity="0.7" />

      <!-- Babbling mouths -->
      <rect x="7" y="7" width="3" height="2" fill="#1a0a14" />
      <rect x="11" y="7" width="3" height="2" fill="#1a0a14" />
      <rect x="8" y="7" width="1" height="1" fill="#a85a6a" />
      <rect x="12" y="7" width="1" height="1" fill="#a85a6a" />

      <!-- Hunched torso — flesh ramp + small mouths + dither -->
      <rect x="4" y="10" width="13" height="11" fill="#5a4a5a" />
      <rect x="4" y="10" width="13" height="1" fill="#6a5a6a" />
      <rect x="4" y="10" width="2" height="11" fill="#6a5a6a" />
      <rect x="4" y="10" width="1" height="6" fill="#7a6a7a" />
      <rect x="15" y="10" width="2" height="11" fill="#3a2a3a" />
      <rect x="6" y="12" width="2" height="1" fill="#1a0a14" />
      <rect x="13" y="13" width="2" height="1" fill="#1a0a14" />
      <rect x="9" y="15" width="2" height="1" fill="#1a0a14" />
      <rect x="6" y="17" width="2" height="1" fill="#1a0a14" />
      <rect x="12" y="17" width="2" height="1" fill="#1a0a14" />
      <rect x="9" y="13" width="1" height="1" fill="#4a3a4a" />
      <rect x="11" y="19" width="1" height="1" fill="#7a6a7a" />

      <!-- Slack arms -->
      <rect x="1" y="11" width="3" height="9" fill="#4a3a4a" />
      <rect x="1" y="11" width="1" height="9" fill="#5a4a5a" />
      <rect x="17" y="11" width="3" height="9" fill="#4a3a4a" />
      <rect x="19" y="11" width="1" height="9" fill="#2a1a2a" />
      <polygon points="1,20 0,22 2,21" fill="#3a2a3a" />
      <polygon points="19,20 20,22 18,21" fill="#3a2a3a" />

      <!-- Splayed legs -->
      <rect x="5" y="21" width="4" height="8" fill="#4a3a4a" />
      <rect x="12" y="21" width="4" height="8" fill="#4a3a4a" />
      <rect x="5" y="21" width="1" height="8" fill="#5a4a5a" />
      <rect x="15" y="21" width="1" height="8" fill="#2a1a2a" />

      <!-- Bare feet -->
      <rect x="4" y="29" width="6" height="3" fill="#3a2a3a" />
      <rect x="12" y="29" width="6" height="3" fill="#3a2a3a" />
      <rect x="4" y="29" width="6" height="1" fill="#4a3a4a" />
      <rect x="12" y="29" width="6" height="1" fill="#4a3a4a" />
    </svg>
