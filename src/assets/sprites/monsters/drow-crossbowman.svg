<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 49"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Drow Crossbowman"
    >
      <!-- Deepdark violet backlight + ground shadow -->
      <ellipse cx="15" cy="23" rx="14" ry="21" fill="#6a4a90" opacity="0.08" />
      <ellipse cx="15" cy="47.6" rx="10" ry="1.8" fill="#000" opacity="0.42" />

      <!-- ── Deep hood — drow skirmisher, white hair spilling out ── -->
      <rect x="10" y="0" width="10" height="3" fill="#150d08" />
      <rect x="11" y="1" width="8" height="2" fill="#2a2030" />
      <rect x="11" y="1" width="4" height="1" fill="#4a3a56" />
      <rect x="8" y="3" width="14" height="6" fill="#150d08" />
      <rect x="9" y="4" width="12" height="5" fill="#2a2030" />
      <rect x="9" y="4" width="12" height="1" fill="#3a2e44" />
      <rect x="9" y="4" width="3" height="5" fill="#332838" />
      <rect x="9" y="4" width="1" height="3" fill="#4a3a56" />
      <rect x="18" y="5" width="3" height="4" fill="#221a28" />
      <!-- white hair edge under the hood -->
      <rect x="10" y="8" width="4" height="1" fill="#d8cfb8" />
      <rect x="10" y="8" width="2" height="1" fill="#ece3cc" />
      <rect x="17" y="8" width="3" height="1" fill="#b8ae94" />

      <!-- ── Face — obsidian-violet in hood shadow ── -->
      <rect x="9" y="9" width="12" height="6" fill="#150d08" />
      <rect x="10" y="10" width="10" height="4" fill="#2e1e44" />
      <rect x="10" y="10" width="10" height="1" fill="#180e2c" />
      <rect x="10" y="11" width="3" height="3" fill="#3a2858" />
      <rect x="10" y="11" width="1" height="2" fill="#4c3a6e" />
      <rect x="18" y="11" width="2" height="3" fill="#22143a" />
      <!-- red marksman eyes, narrowed -->
      <rect x="11" y="11" width="3" height="1" fill="#180e2c" />
      <rect x="16" y="11" width="3" height="1" fill="#180e2c" />
      <rect x="11" y="11" width="2" height="1" fill="#c4303c" />
      <rect x="16" y="11" width="2" height="1" fill="#a02830" />
      <rect x="11" y="11" width="1" height="1" fill="#ff7a6a" />
      <!-- set mouth -->
      <rect x="13" y="13" width="5" height="1" fill="#180e2c" />

      <!-- ── Crossbow — held level, quarrel nocked, drawn LAST below ── -->
      <!-- (stock drawn after the arms so the grip reads in front) -->

      <!-- ── Mantle + webweave jerkin ── -->
      <rect x="6" y="15" width="18" height="4" fill="#150d08" />
      <rect x="7" y="16" width="16" height="2" fill="#2a2030" />
      <rect x="7" y="16" width="16" height="1" fill="#4a3a56" />
      <rect x="7" y="16" width="4" height="1" fill="#5a4a66" />
      <rect x="20" y="16" width="3" height="2" fill="#1c1622" />
      <!-- torso -->
      <rect x="6" y="19" width="18" height="13" fill="#150d08" />
      <rect x="7" y="20" width="16" height="11" fill="#221a28" />
      <rect x="7" y="20" width="16" height="1" fill="#3a2e44" />
      <rect x="7" y="20" width="3" height="10" fill="#2a2030" />
      <rect x="7" y="20" width="1" height="10" fill="#4a3a56" />
      <rect x="20" y="20" width="3" height="10" fill="#16101c" />
      <rect x="22" y="21" width="1" height="9" fill="#100a14" />
      <!-- quarrel bandolier across the chest -->
      <rect x="7" y="22" width="16" height="2" fill="#3a2418" />
      <rect x="7" y="22" width="16" height="1" fill="#5a3a22" />
      <!-- quarrel heads on the strap -->
      <rect x="9" y="22" width="1" height="2" fill="#8a8ab4" />
      <rect x="12" y="22" width="1" height="2" fill="#6a6a94" />
      <rect x="15" y="22" width="1" height="2" fill="#8a8ab4" />
      <rect x="18" y="22" width="1" height="2" fill="#52527a" />
      <!-- web etching -->
      <rect x="10" y="27" width="1" height="1" fill="#4a3a56" />
      <rect x="17" y="28" width="1" height="1" fill="#16101c" />

      <!-- ── Arms — both forward on the crossbow ── -->
      <rect x="3" y="19" width="6" height="5" fill="#150d08" />
      <rect x="4" y="20" width="4" height="3" fill="#2e1e44" />
      <rect x="4" y="20" width="1" height="3" fill="#3a2858" />
      <rect x="2" y="22" width="5" height="5" fill="#150d08" />
      <rect x="3" y="23" width="3" height="3" fill="#3a2858" />
      <rect x="3" y="23" width="1" height="2" fill="#4c3a6e" />
      <rect x="22" y="19" width="6" height="5" fill="#150d08" />
      <rect x="23" y="20" width="4" height="3" fill="#22143a" />
      <rect x="23" y="20" width="1" height="3" fill="#2e1e44" />
      <rect x="24" y="22" width="5" height="5" fill="#150d08" />
      <rect x="25" y="23" width="3" height="3" fill="#22143a" />

      <!-- ── Hand crossbow — adamant frame, drawn string, poison quarrel ── -->
      <!-- stock across the body -->
      <rect x="1" y="25" width="28" height="4" fill="#150d08" />
      <rect x="2" y="26" width="26" height="2" fill="#3a2418" />
      <rect x="2" y="26" width="26" height="1" fill="#5a3a22" />
      <rect x="2" y="26" width="6" height="1" fill="#6e4a2c" />
      <!-- adamant bow limbs curving up at the muzzle end -->
      <rect x="0" y="21" width="3" height="6" fill="#150d08" />
      <rect x="1" y="22" width="1" height="4" fill="#6a6a94" />
      <rect x="1" y="22" width="1" height="1" fill="#c8c8ec" />
      <rect x="0" y="29" width="3" height="5" fill="#150d08" />
      <rect x="1" y="30" width="1" height="3" fill="#52527a" />
      <!-- drawn string -->
      <rect x="2" y="23" width="1" height="3" fill="#d8cfb8" opacity="0.6" />
      <rect x="2" y="29" width="1" height="2" fill="#d8cfb8" opacity="0.6" />
      <!-- the quarrel — poison-green head -->
      <rect x="2" y="27" width="10" height="1" fill="#c2b794" />
      <rect x="1" y="27" width="2" height="1" fill="#6a8a3a" />
      <rect x="1" y="27" width="1" height="1" fill="#a8c478" />
      <!-- trigger tickler + grip wrap -->
      <rect x="14" y="29" width="2" height="2" fill="#150d08" />
      <rect x="14" y="29" width="1" height="1" fill="#5a3a22" />

      <!-- ── Belt + thigh quiver ── -->
      <rect x="7" y="32" width="16" height="2" fill="#150d08" />
      <rect x="8" y="32" width="14" height="1" fill="#3a2e44" />
      <rect x="13" y="32" width="3" height="2" fill="#8a8ab4" />
      <rect x="13" y="32" width="2" height="1" fill="#c8c8ec" />
      <!-- quiver on the right thigh -->
      <rect x="20" y="34" width="6" height="8" fill="#150d08" />
      <rect x="21" y="35" width="4" height="6" fill="#3a2418" />
      <rect x="21" y="35" width="1" height="6" fill="#5a3a22" />
      <rect x="21" y="33" width="1" height="2" fill="#c2b794" />
      <rect x="23" y="33" width="1" height="2" fill="#a89878" />
      <rect x="22" y="32" width="1" height="2" fill="#6a8a3a" />

      <!-- ── Legs — skirmish crouch ── -->
      <rect x="7" y="34" width="6" height="9" fill="#150d08" />
      <rect x="8" y="35" width="4" height="8" fill="#2e1e44" />
      <rect x="8" y="35" width="1" height="8" fill="#3a2858" />
      <rect x="11" y="35" width="1" height="8" fill="#22143a" />
      <rect x="15" y="34" width="6" height="9" fill="#150d08" />
      <rect x="16" y="35" width="4" height="8" fill="#22143a" />
      <rect x="16" y="35" width="1" height="8" fill="#2e1e44" />
      <rect x="19" y="35" width="1" height="8" fill="#180e2c" />
      <!-- silk wraps -->
      <rect x="8" y="38" width="4" height="1" fill="#4a3868" />
      <rect x="16" y="38" width="4" height="1" fill="#3a2c54" />

      <!-- ── Soft boots ── -->
      <rect x="6" y="43" width="8" height="5" fill="#150d08" />
      <rect x="7" y="44" width="6" height="3" fill="#221a28" />
      <rect x="7" y="44" width="6" height="1" fill="#3a2e44" />
      <rect x="14" y="43" width="8" height="5" fill="#150d08" />
      <rect x="15" y="44" width="6" height="3" fill="#1a141e" />
      <rect x="15" y="44" width="6" height="1" fill="#2a2030" />
    </svg>
