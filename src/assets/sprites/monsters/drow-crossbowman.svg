<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 22 36"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Drow Crossbowman"
    >
      <!-- Underdark violet backlight + ground shadow -->
      <ellipse cx="11" cy="17" rx="11" ry="16" fill="#6a4a9c" opacity="0.07" />
      <ellipse cx="11" cy="35" rx="7" ry="1.4" fill="#000" opacity="0.42" />

      <!-- White mane — bone-pale ramp, lit upper-left -->
      <rect x="6" y="0" width="10" height="2" fill="#d8cfb8" />
      <rect x="5" y="2" width="12" height="3" fill="#d8cfb8" />
      <rect x="5" y="2" width="12" height="1" fill="#f4ecd8" />
      <rect x="5" y="2" width="3" height="3" fill="#ece3cc" />
      <rect x="15" y="2" width="2" height="3" fill="#b8af98" />
      <rect x="6" y="0" width="5" height="1" fill="#ece3cc" />

      <!-- Obsidian face — charcoal-violet ramp -->
      <rect x="6" y="5" width="10" height="5" fill="#5a4858" />
      <rect x="6" y="5" width="3" height="5" fill="#6a5868" />
      <rect x="6" y="5" width="1" height="4" fill="#7a6878" />
      <rect x="14" y="5" width="2" height="5" fill="#3a2838" />
      <rect x="5" y="6" width="1" height="4" fill="#2a1828" />
      <rect x="16" y="6" width="1" height="4" fill="#4a4858" />

      <!-- Burning red eyes + gold spark -->
      <rect x="8" y="7" width="2" height="1" fill="#b53c4a" />
      <rect x="12" y="7" width="2" height="1" fill="#b53c4a" />
      <rect x="9" y="7" width="1" height="1" fill="#f4d042" />
      <rect x="13" y="7" width="1" height="1" fill="#f4d042" />

      <!-- Spider-silk collar / shoulders — violet plate ramp -->
      <rect x="4" y="10" width="14" height="3" fill="#3a2858" />
      <rect x="4" y="10" width="14" height="1" fill="#5a4078" />
      <rect x="4" y="10" width="2" height="3" fill="#1a0a28" />
      <rect x="16" y="10" width="2" height="3" fill="#1a0a28" />
      <rect x="5" y="10" width="2" height="1" fill="#6a4a9c" />

      <!-- Torso armour — ramp + chest emblem -->
      <rect x="5" y="13" width="12" height="9" fill="#3a2858" />
      <rect x="5" y="13" width="3" height="9" fill="#4a3468" />
      <rect x="5" y="13" width="1" height="9" fill="#5a4078" />
      <rect x="15" y="13" width="2" height="9" fill="#2a1a40" />
      <rect x="5" y="13" width="12" height="1" fill="#1a0a28" />
      <rect x="9" y="15" width="4" height="6" fill="#5a4068" />
      <rect x="10" y="16" width="2" height="4" fill="#3a2858" />
      <rect x="9" y="15" width="2" height="1" fill="#7a5a9c" />
      <rect x="7" y="18" width="1" height="1" fill="#4a3468" />
      <rect x="13" y="20" width="1" height="1" fill="#2a1a40" />

      <!-- Crossbow — wood ramp, drawn level -->
      <rect x="0" y="14" width="22" height="2" fill="#6b4a2e" />
      <rect x="0" y="14" width="22" height="1" fill="#8c6232" />
      <rect x="0" y="13" width="2" height="4" fill="#3a2418" />
      <rect x="20" y="13" width="2" height="4" fill="#3a2418" />
      <rect x="0" y="13" width="1" height="4" fill="#52341e" />
      <rect x="9" y="13" width="4" height="1" fill="#3a2418" />
      <rect x="10" y="12" width="2" height="1" fill="#a89878" />

      <!-- Loaded bolt + steel head specular -->
      <polygon points="10,12 12,12 11,5" fill="#b5a282" />
      <polygon points="10,12 12,12 11,5" stroke="#3a2418" stroke-width="0.3" fill="none" />
      <rect x="10" y="5" width="2" height="2" fill="#3a2418" />
      <rect x="11" y="5" width="1" height="1" fill="#e8eef8" />

      <!-- Arms steadying the stock -->
      <rect x="3" y="11" width="2" height="6" fill="#5a4858" />
      <rect x="3" y="11" width="1" height="6" fill="#6a5868" />
      <rect x="2" y="16" width="3" height="2" fill="#d8cfb8" />
      <rect x="2" y="16" width="3" height="1" fill="#ece3cc" />
      <rect x="17" y="11" width="2" height="6" fill="#5a4858" />
      <rect x="18" y="11" width="1" height="6" fill="#3a2838" />
      <rect x="17" y="16" width="3" height="2" fill="#c4bba4" />

      <!-- Belt + legs -->
      <rect x="5" y="22" width="12" height="2" fill="#1a0a28" />
      <rect x="5" y="22" width="12" height="1" fill="#2a1a40" />
      <rect x="6" y="24" width="3" height="6" fill="#2a1a48" />
      <rect x="13" y="24" width="3" height="6" fill="#2a1a48" />
      <rect x="6" y="24" width="1" height="6" fill="#3a2858" />
      <rect x="8" y="24" width="1" height="6" fill="#1a0a28" />
      <rect x="15" y="24" width="1" height="6" fill="#1a0a28" />

      <!-- Boots -->
      <rect x="6" y="30" width="3" height="4" fill="#3a2418" />
      <rect x="13" y="30" width="3" height="4" fill="#3a2418" />
      <rect x="6" y="30" width="1" height="4" fill="#52341e" />
      <rect x="5" y="34" width="4" height="2" fill="#1a1410" />
      <rect x="13" y="34" width="4" height="2" fill="#1a1410" />
    </svg>
