<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 26 34"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Spined Abishai"
    >
      <!-- Infernal backlight + ground shadow -->
      <ellipse cx="13" cy="16" rx="13" ry="16" fill="#5a1410" opacity="0.18" />
      <ellipse cx="13" cy="16" rx="8" ry="11" fill="#c0301a" opacity="0.1" />
      <ellipse cx="13" cy="31" rx="9" ry="1.6" fill="#000" opacity="0.45" />

      <!-- Spined wings — membrane ramp + barbs -->
      <polygon points="8,12 0,4 1,16 8,18" fill="#5a1410" opacity="0.9" />
      <polygon points="18,12 26,4 25,16 18,18" fill="#5a1410" opacity="0.9" />
      <polygon points="7,12 2,7 3,15 7,16" fill="#7a201a" opacity="0.75" />
      <polygon points="19,12 24,7 23,15 19,16" fill="#7a201a" opacity="0.75" />
      <line x1="3" y1="6" x2="6" y2="15" stroke="#2a0a08" stroke-width="0.5" />
      <line x1="23" y1="6" x2="20" y2="15" stroke="#2a0a08" stroke-width="0.5" />

      <!-- Horned head — red ramp, key upper-left, molten eyes -->
      <rect x="9" y="3" width="8" height="7" fill="#a83028" />
      <rect x="9" y="3" width="8" height="1" fill="#c44030" />
      <rect x="9" y="3" width="2" height="7" fill="#b8382e" />
      <rect x="9" y="3" width="1" height="4" fill="#cc4a3a" />
      <rect x="15" y="4" width="2" height="6" fill="#7a201a" />
      <polygon points="9,3 8,0 11,2" fill="#7a201a" />
      <polygon points="9,3 9,1 10,2" fill="#a83028" />
      <polygon points="17,3 18,0 15,2" fill="#7a201a" />
      <rect x="10" y="5" width="2" height="2" fill="#f4d042" />
      <rect x="14" y="5" width="2" height="2" fill="#f4d042" />
      <rect x="10" y="5" width="1" height="1" fill="#fff0b0" />
      <rect x="14" y="5" width="1" height="1" fill="#fff0b0" />
      <rect x="11" y="8" width="4" height="1" fill="#3a0e0a" />

      <!-- Torso — red ramp + bone spines + dither -->
      <rect x="8" y="10" width="10" height="13" fill="#8a2420" />
      <rect x="8" y="10" width="10" height="2" fill="#a83028" />
      <rect x="8" y="10" width="2" height="13" fill="#9a2c26" />
      <rect x="8" y="10" width="1" height="8" fill="#b8382e" opacity="0.7" />
      <rect x="16" y="10" width="2" height="13" fill="#5a1410" />
      <rect x="12" y="12" width="2" height="10" fill="#5a1410" />
      <polygon points="8,10 6,8 9,11" fill="#d6cabe" />
      <polygon points="8,10 7,9 9,11" fill="#e8e0d4" opacity="0.7" />
      <polygon points="18,10 20,8 17,11" fill="#d6cabe" />
      <polygon points="9,14 7,12 10,15" fill="#d6cabe" opacity="0.8" />
      <polygon points="17,14 19,12 16,15" fill="#d6cabe" opacity="0.7" />
      <rect x="11" y="16" width="1" height="1" fill="#c44030" opacity="0.6" />
      <rect x="14" y="20" width="1" height="1" fill="#5a1410" />

      <!-- Arms — claws + bone blade -->
      <rect x="5" y="12" width="3" height="9" fill="#8a2420" />
      <rect x="5" y="12" width="1" height="9" fill="#9a2c26" />
      <rect x="4" y="19" width="4" height="3" fill="#a83028" />
      <polygon points="4,22 3,25 6,23" fill="#140808" />
      <rect x="18" y="11" width="3" height="6" fill="#8a2420" />
      <rect x="18" y="11" width="1" height="6" fill="#5a1410" />
      <rect x="20" y="6" width="2" height="7" fill="#d6cabe" />
      <rect x="20" y="6" width="1" height="7" fill="#e8e0d4" />
      <polygon points="20,6 21,2 23,7" fill="#e8e0d4" opacity="0.85" />
      <rect x="20" y="6" width="1" height="1" fill="#ffffff" />

      <!-- Legs + tail -->
      <rect x="9" y="23" width="3" height="7" fill="#7a201a" />
      <rect x="9" y="23" width="1" height="7" fill="#8a2420" />
      <rect x="14" y="23" width="3" height="7" fill="#7a201a" />
      <rect x="16" y="23" width="1" height="7" fill="#5a1410" />
      <polygon points="8,30 12,30 10,33" fill="#140808" />
      <polygon points="14,30 18,30 16,33" fill="#140808" />
      <rect x="13" y="22" width="1" height="8" fill="#5a1410" />
      <polygon points="13,30 14,33 15,30" fill="#7a201a" />
    </svg>
