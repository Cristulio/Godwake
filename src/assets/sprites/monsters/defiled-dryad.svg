<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 26 34"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Defiled Dryad"
    >
      <!-- Corrupted-grove backlight + ground shadow -->
      <ellipse cx="13" cy="17" rx="12" ry="16" fill="#5e8a2e" opacity="0.07" />
      <ellipse cx="13" cy="31" rx="10" ry="2" fill="#0e1408" opacity="0.45" />

      <!-- Withered leaf crown -->
      <polygon points="13,-1 8,3 9,6 17,6 18,3" fill="#1e2a12" opacity="0.8" />
      <polygon points="13,-1 9,3 13,6" fill="#3a4a1e" opacity="0.6" />

      <!-- Head — bark-flesh ramp, key upper-left -->
      <rect x="9" y="3" width="7" height="9" fill="#4a5a2e" />
      <rect x="9" y="3" width="7" height="1" fill="#6e7e48" />
      <rect x="9" y="3" width="2" height="9" fill="#5a6a3a" />
      <rect x="9" y="3" width="1" height="5" fill="#7e8e54" />
      <rect x="14" y="4" width="2" height="8" fill="#3a4424" />
      <rect x="9" y="11" width="7" height="1" fill="#2e3a1c" />
      <rect x="8" y="4" width="1" height="6" fill="#3e4a26" opacity="0.7" />
      <rect x="16" y="4" width="1" height="6" fill="#1e2810" />

      <!-- Glowing eyes + sap-dark mouth -->
      <rect x="10" y="6" width="2" height="2" fill="#101808" />
      <rect x="13" y="6" width="2" height="2" fill="#101808" />
      <rect x="10" y="6" width="1" height="1" fill="#9aca5a" />
      <rect x="13" y="6" width="1" height="1" fill="#9aca5a" />
      <rect x="10" y="6" width="1" height="1" fill="#d0f08a" opacity="0.6" />
      <rect x="11" y="9" width="3" height="1" fill="#2a1818" />

      <!-- Torso — mossy bark ramp + grain dither -->
      <polygon points="9,12 17,12 19,26 7,26" fill="#3a4424" />
      <polygon points="9,12 14,12 13,26 9,26" fill="#4c5a2e" />
      <rect x="11" y="12" width="2" height="14" fill="#5a6a3a" opacity="0.6" />
      <polygon points="16,12 17,12 19,26 16,26" fill="#2a3018" />
      <rect x="9" y="16" width="8" height="1" fill="#1e2810" opacity="0.6" />
      <rect x="9" y="20" width="8" height="1" fill="#1e2810" opacity="0.6" />
      <rect x="10" y="14" width="1" height="1" fill="#6e7e48" />
      <rect x="15" y="23" width="1" height="1" fill="#1e2810" />

      <!-- Branch arms — bark ramp + twigs -->
      <polygon points="9,13 4,9 1,14 5,18" fill="#2e3a1c" />
      <polygon points="9,13 5,10 3,13 6,16" fill="#3e4a26" opacity="0.7" />
      <line x1="5" y1="11" x2="1" y2="8" stroke="#1a1010" stroke-width="0.8" />
      <line x1="3" y1="14" x2="0" y2="16" stroke="#1a1010" stroke-width="0.8" />
      <polygon points="17,13 22,9 25,14 21,18" fill="#2e3a1c" />
      <polygon points="17,13 21,10 23,13 20,16" fill="#243012" opacity="0.7" />
      <line x1="21" y1="11" x2="25" y2="8" stroke="#1a1010" stroke-width="0.8" />
      <line x1="23" y1="14" x2="26" y2="16" stroke="#1a1010" stroke-width="0.8" />

      <!-- Root legs -->
      <polygon points="7,26 9,32 11,26" fill="#1e2810" />
      <polygon points="15,26 17,32 19,26" fill="#1e2810" />
      <rect x="11" y="26" width="4" height="5" fill="#2e3a1c" />
      <rect x="11" y="26" width="1" height="5" fill="#3e4a26" />
      <rect x="4" y="22" width="1" height="2" fill="#2a1818" opacity="0.7" />
      <rect x="21" y="22" width="1" height="2" fill="#2a1818" opacity="0.7" />
      <rect x="6" y="10" width="1" height="1" fill="#9aca5a" opacity="0.4" />
    </svg>
