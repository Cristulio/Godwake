<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 32"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Cycle-Revenant"
    >
      <!-- Spectral backlight + faint ground haze -->
      <ellipse cx="12" cy="16" rx="11" ry="15" fill="#6aa0c4" opacity="0.1" />
      <ellipse cx="12" cy="20" rx="9" ry="11" fill="#2a3a4a" opacity="0.3" />
      <ellipse cx="12" cy="30" rx="7" ry="1.2" fill="#0e1a24" opacity="0.4" />

      <!-- Spectral head — ramp, key light upper-left -->
      <rect x="8" y="3" width="8" height="8" fill="#5a7080" opacity="0.88" />
      <rect x="8" y="3" width="8" height="1" fill="#9ab0c0" />
      <rect x="8" y="3" width="3" height="8" fill="#7a90a0" opacity="0.9" />
      <rect x="8" y="3" width="1" height="6" fill="#9ab0c0" opacity="0.8" />
      <rect x="15" y="4" width="1" height="6" fill="#3a4a58" />
      <!-- Hollow eyes — cold ghostfire + spark -->
      <rect x="9" y="6" width="2" height="3" fill="#0e1a24" />
      <rect x="13" y="6" width="2" height="3" fill="#0e1a24" />
      <rect x="9" y="6" width="1" height="1" fill="#8ce0d0" />
      <rect x="14" y="6" width="1" height="1" fill="#8ce0d0" />
      <rect x="9" y="6" width="1" height="1" fill="#d4fff0" opacity="0.7" />
      <rect x="11" y="9" width="2" height="1" fill="#3a4a58" />

      <!-- Phantom torso — ramp + dither -->
      <rect x="7" y="11" width="10" height="13" fill="#5a7080" opacity="0.82" />
      <rect x="7" y="11" width="10" height="1" fill="#7a90a0" />
      <rect x="7" y="11" width="3" height="13" fill="#6a8090" opacity="0.85" />
      <rect x="7" y="11" width="1" height="11" fill="#9ab0c0" opacity="0.7" />
      <rect x="15" y="12" width="2" height="12" fill="#3a4a58" opacity="0.7" />
      <rect x="11" y="12" width="2" height="12" fill="#4a5e6c" opacity="0.8" />
      <rect x="9" y="15" width="1" height="1" fill="#9ab0c0" opacity="0.5" />
      <rect x="13" y="19" width="1" height="1" fill="#3a4a58" opacity="0.6" />

      <!-- Reaching arms + hands -->
      <rect x="3" y="14" width="4" height="2" fill="#6a8090" opacity="0.82" />
      <rect x="3" y="14" width="4" height="1" fill="#8aa0b0" opacity="0.7" />
      <rect x="17" y="14" width="4" height="2" fill="#5a7080" opacity="0.8" />
      <rect x="1" y="13" width="3" height="2" fill="#7a90a0" opacity="0.72" />
      <rect x="1" y="13" width="3" height="1" fill="#9ab0c0" opacity="0.6" />
      <rect x="20" y="13" width="3" height="2" fill="#6a8090" opacity="0.7" />

      <!-- Dissolving wisp tails -->
      <polygon points="7,24 9,30 11,24" fill="#5a7080" opacity="0.7" />
      <polygon points="7,24 9,30 9,24" fill="#7a90a0" opacity="0.5" />
      <polygon points="11,24 13,29 15,24" fill="#5a7080" opacity="0.55" />
      <polygon points="13,24 15,30 17,24" fill="#4a5e6c" opacity="0.45" />

      <!-- Crown highlight + drifting motes -->
      <rect x="9" y="2" width="6" height="1" fill="#9ab0c0" opacity="0.6" />
      <rect x="5" y="20" width="1" height="1" fill="#8ce0d0" opacity="0.45" />
      <rect x="18" y="18" width="1" height="1" fill="#8ce0d0" opacity="0.4" />
    </svg>
