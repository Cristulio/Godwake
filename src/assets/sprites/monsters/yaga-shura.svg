<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 40 46"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Yaga-Shura"
    >
      <!-- Burning-heart backlight — layered fire bloom + ground shadow -->
      <ellipse cx="20" cy="24" rx="19" ry="22" fill="#2a0c02" opacity="0.5" />
      <ellipse cx="20" cy="24" rx="15" ry="18" fill="#5a1c06" opacity="0.32" />
      <ellipse cx="20" cy="24" rx="9" ry="13" fill="#c0401a" opacity="0.14" />
      <ellipse cx="20" cy="44" rx="14" ry="2" fill="#120804" opacity="0.5" />

      <!-- Head — ember-skin ramp, tusks, blazing eyes -->
      <rect x="13" y="3" width="14" height="10" fill="#b85420" />
      <rect x="13" y="3" width="14" height="2" fill="#d86c2e" />
      <rect x="13" y="3" width="3" height="10" fill="#c8642a" />
      <rect x="13" y="4" width="1" height="6" fill="#dc7634" />
      <rect x="24" y="4" width="3" height="9" fill="#8a3a16" />
      <polygon points="13,3 10,-3 16,1" fill="#e0e6ec" />
      <polygon points="27,3 30,-3 24,1" fill="#e0e6ec" />
      <polygon points="13,3 11,-2 15,1" fill="#b8c0c8" />
      <polygon points="27,3 29,-2 25,1" fill="#b8c0c8" />
      <rect x="14" y="6" width="3" height="3" fill="#fff4d0" />
      <rect x="23" y="6" width="3" height="3" fill="#fff4d0" />
      <rect x="14" y="6" width="2" height="2" fill="#ffffff" />
      <rect x="23" y="6" width="2" height="2" fill="#ffffff" />
      <rect x="17" y="10" width="6" height="2" fill="#4a1c08" />
      <rect x="15" y="11" width="2" height="2" fill="#fff4d0" opacity="0.8" />
      <rect x="23" y="11" width="2" height="2" fill="#fff4d0" opacity="0.8" />

      <!-- Torso — charred armour over a molten core -->
      <rect x="4" y="13" width="30" height="20" fill="#3a2a1c" />
      <rect x="4" y="13" width="30" height="2" fill="#5a3a22" />
      <rect x="4" y="13" width="2" height="20" fill="#46321f" />
      <rect x="32" y="13" width="2" height="20" fill="#2a1d12" />
      <rect x="13" y="12" width="12" height="3" fill="#d4a83a" />
      <rect x="13" y="12" width="12" height="1" fill="#ffe070" />
      <rect x="13" y="12" width="1" height="1" fill="#fff4d0" />
      <rect x="18" y="15" width="2" height="16" fill="#7a1c0a" />
      <rect x="8" y="16" width="22" height="13" fill="#2a1c12" />
      <!-- molten cracks radiating from the heart -->
      <rect x="5" y="15" width="1" height="17" fill="#ffb04a" opacity="0.6" />
      <rect x="33" y="15" width="1" height="17" fill="#f4942a" opacity="0.55" />
      <rect x="11" y="17" width="16" height="1" fill="#a83a14" opacity="0.7" />
      <rect x="9" y="21" width="20" height="1" fill="#f4942a" opacity="0.55" />
      <rect x="12" y="25" width="14" height="1" fill="#ffb04a" opacity="0.5" />
      <rect x="14" y="28" width="10" height="1" fill="#ffd070" opacity="0.45" />
      <!-- the burning heart -->
      <rect x="17" y="20" width="5" height="5" fill="#e8401a" />
      <rect x="18" y="21" width="3" height="3" fill="#ffb040" />
      <rect x="19" y="22" width="1" height="1" fill="#fff4d0" />

      <!-- Arms -->
      <rect x="0" y="14" width="6" height="17" fill="#3a2a1c" />
      <rect x="0" y="14" width="6" height="1" fill="#5a3a22" />
      <rect x="0" y="14" width="1" height="17" fill="#46321f" />
      <rect x="32" y="14" width="8" height="17" fill="#3a2a1c" />
      <rect x="38" y="14" width="2" height="17" fill="#2a1d12" />
      <rect x="0" y="28" width="6" height="4" fill="#d49860" opacity="0.85" />
      <rect x="0" y="28" width="6" height="1" fill="#e4a870" opacity="0.7" />

      <!-- Great flaming blade -->
      <rect x="36" y="-4" width="3" height="18" fill="#3a2a1a" />
      <polygon points="31,15 41,15 41,-2 37,-7 31,-2" fill="#7a5a40" />
      <polygon points="37,15 41,15 41,-2 37,-7" fill="#4a382a" />
      <polygon points="31,15 34,15 32,-2 31,-2" fill="#8a6a4c" opacity="0.6" />
      <rect x="32" y="1" width="8" height="1" fill="#ffd070" opacity="0.85" />
      <rect x="32" y="5" width="8" height="1" fill="#ffb04a" opacity="0.8" />
      <rect x="32" y="9" width="8" height="1" fill="#f4942a" opacity="0.7" />
      <rect x="32" y="13" width="8" height="1" fill="#e87820" opacity="0.6" />

      <!-- Legs -->
      <rect x="8" y="33" width="9" height="12" fill="#2a1c12" />
      <rect x="22" y="33" width="9" height="12" fill="#2a1c12" />
      <rect x="8" y="33" width="1" height="12" fill="#3a2a1c" />
      <rect x="22" y="33" width="1" height="12" fill="#3a2a1c" />
      <rect x="7" y="43" width="11" height="3" fill="#120804" />
      <rect x="22" y="43" width="11" height="3" fill="#120804" />
      <rect x="10" y="35" width="1" height="6" fill="#f4942a" opacity="0.5" />
      <rect x="25" y="35" width="1" height="6" fill="#f4942a" opacity="0.5" />

      <!-- Drifting cinders -->
      <rect x="6" y="6" width="2" height="2" fill="#f4942a" opacity="0.6" />
      <rect x="35" y="22" width="2" height="2" fill="#ffd070" opacity="0.55" />
      <rect x="3" y="20" width="1" height="1" fill="#ffb04a" opacity="0.6" />
    </svg>
