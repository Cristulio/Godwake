<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 35 43"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="The Unindexed"
    >
      <!-- Uncatalogued backlight + ground shadow -->
      <ellipse cx="17" cy="20" rx="17" ry="19" fill="#7aba4a" opacity="0.08" />
      <ellipse cx="17" cy="41.6" rx="11" ry="1.7" fill="#000" opacity="0.38" />

      <!-- ── The shape the catalogue has no word for ── -->
      <!-- it is built like a closed book standing on end, but it breathes -->
      <rect x="8" y="2" width="19" height="34" fill="#150d08" />
      <rect x="9" y="3" width="17" height="32" fill="#352d3e" />
      <rect x="9" y="3" width="17" height="1" fill="#4a4254" />
      <rect x="9" y="3" width="4" height="31" fill="#3d3548" />
      <rect x="9" y="3" width="1" height="22" fill="#4a4254" />
      <rect x="22" y="3" width="4" height="31" fill="#241e2c" />
      <rect x="25" y="4" width="1" height="30" fill="#1a1622" />
      <rect x="25" y="14" width="1" height="6" fill="#1c2e34" />
      <!-- breathing seams — the covers flex -->
      <rect x="10" y="8" width="15" height="1" fill="#241e2c" />
      <rect x="10" y="15" width="15" height="1" fill="#1f1a28" />
      <rect x="10" y="23" width="15" height="1" fill="#241e2c" />
      <rect x="10" y="30" width="15" height="1" fill="#1f1a28" />
      <rect x="10" y="9" width="5" height="1" fill="#4a4254" opacity="0.6" />
      <rect x="10" y="16" width="4" height="1" fill="#4a4254" opacity="0.5" />

      <!-- ── The spine-face — where its title should be, a tear ── -->
      <rect x="13" y="5" width="9" height="12" fill="#150d08" />
      <rect x="14" y="6" width="7" height="10" fill="#241e2c" />
      <rect x="14" y="6" width="7" height="1" fill="#352d3e" />
      <!-- the title plate, scratched blank -->
      <rect x="15" y="7" width="5" height="3" fill="#52442e" />
      <rect x="15" y="7" width="5" height="1" fill="#6a583a" />
      <rect x="16" y="8" width="3" height="1" fill="#3a3024" />
      <rect x="16" y="8" width="1" height="1" fill="#8a7448" />
      <!-- the unblinking catalogue-light eyes below the plate -->
      <rect x="14" y="11" width="3" height="3" fill="#101408" />
      <rect x="18" y="11" width="3" height="3" fill="#101408" />
      <rect x="14" y="11" width="3" height="2" fill="#4a7a2c" />
      <rect x="18" y="11" width="3" height="2" fill="#3a6222" />
      <rect x="14" y="11" width="2" height="1" fill="#7aba4a" />
      <rect x="18" y="11" width="2" height="1" fill="#5e9638" />
      <rect x="14" y="11" width="1" height="1" fill="#d4f4a8" />
      <rect x="18" y="11" width="1" height="1" fill="#a8d878" />
      <!-- a third eye opening between them, half-lidded -->
      <rect x="16" y="14" width="3" height="2" fill="#101408" />
      <rect x="17" y="14" width="1" height="1" fill="#4a7a2c" />

      <!-- ── The mouth-fore-edge — pages part like lips, green light inside ── -->
      <ellipse cx="17.5" cy="20" rx="6.4" ry="3" fill="#7aba4a" opacity="0.18" />
      <rect x="11" y="18" width="13" height="5" fill="#150d08" />
      <rect x="12" y="19" width="11" height="3" fill="#0e1408" />
      <!-- page-edge teeth, top and bottom rows -->
      <rect x="12" y="19" width="11" height="1" fill="#bcb49a" />
      <rect x="12" y="19" width="4" height="1" fill="#dcd4bc" />
      <rect x="12" y="22" width="11" height="1" fill="#a89a72" />
      <rect x="12" y="22" width="3" height="1" fill="#bcb49a" />
      <!-- the gullet-glow between the pages -->
      <rect x="13" y="20" width="9" height="2" fill="#1e3a14" />
      <rect x="14" y="20" width="7" height="2" fill="#3a6222" />
      <rect x="15" y="20" width="4" height="1" fill="#7aba4a" />
      <rect x="15" y="20" width="2" height="1" fill="#a8d878" />
      <!-- a word it is currently digesting -->
      <rect x="18" y="21" width="2" height="1" fill="#0e1408" />

      <!-- ── Misfiled limbs — bookmark-ribbon arms ── -->
      <rect x="4" y="10" width="6" height="3" fill="#150d08" />
      <rect x="5" y="11" width="4" height="1" fill="#7e1f2c" />
      <rect x="5" y="11" width="2" height="1" fill="#a93340" />
      <rect x="2" y="13" width="4" height="3" fill="#150d08" />
      <rect x="3" y="14" width="2" height="1" fill="#7e1f2c" />
      <rect x="1" y="16" width="3" height="4" fill="#150d08" />
      <rect x="2" y="17" width="1" height="2" fill="#531320" />
      <!-- ribbon end frays -->
      <rect x="1" y="20" width="1" height="2" fill="#531320" opacity="0.7" />
      <rect x="3" y="21" width="1" height="1" fill="#7e1f2c" opacity="0.6" />
      <rect x="25" y="9" width="6" height="3" fill="#150d08" />
      <rect x="26" y="10" width="4" height="1" fill="#6a1a26" />
      <rect x="26" y="10" width="1" height="1" fill="#8c2434" />
      <rect x="29" y="12" width="4" height="3" fill="#150d08" />
      <rect x="30" y="13" width="2" height="1" fill="#6a1a26" />
      <rect x="31" y="15" width="3" height="4" fill="#150d08" />
      <rect x="32" y="16" width="1" height="2" fill="#47101b" />
      <rect x="33" y="19" width="1" height="2" fill="#47101b" opacity="0.7" />

      <!-- ── Clasp-claws low on the covers — it can hold itself shut ── -->
      <rect x="6" y="26" width="4" height="5" fill="#150d08" />
      <rect x="7" y="27" width="2" height="3" fill="#6a583a" />
      <rect x="7" y="27" width="1" height="2" fill="#8a7448" />
      <rect x="6" y="31" width="1" height="2" fill="#150d08" />
      <rect x="8" y="31" width="1" height="2" fill="#150d08" />
      <rect x="25" y="26" width="4" height="5" fill="#150d08" />
      <rect x="26" y="27" width="2" height="3" fill="#52442e" />
      <rect x="26" y="27" width="1" height="2" fill="#6a583a" />
      <rect x="25" y="31" width="1" height="2" fill="#150d08" />
      <rect x="27" y="31" width="1" height="2" fill="#150d08" />

      <!-- ── Loose catalogue cards it sheds — every one blank ── -->
      <rect x="3" y="28" width="5" height="6" fill="#150d08" />
      <rect x="4" y="29" width="3" height="4" fill="#bcb49a" />
      <rect x="4" y="29" width="3" height="1" fill="#dcd4bc" />
      <rect x="4" y="31" width="2" height="1" fill="#a89a72" />
      <rect x="28" y="29" width="5" height="5" fill="#150d08" />
      <rect x="29" y="30" width="3" height="3" fill="#a89a72" />
      <rect x="29" y="30" width="3" height="1" fill="#bcb49a" />
      <rect x="30" y="31" width="1" height="1" fill="#8a7c58" />

      <!-- ── Base — it stands on a fan of its own splayed pages ── -->
      <rect x="7" y="36" width="21" height="4" fill="#150d08" />
      <rect x="8" y="37" width="19" height="2" fill="#a89a72" />
      <rect x="8" y="37" width="19" height="1" fill="#bcb49a" />
      <rect x="8" y="37" width="5" height="1" fill="#cfc7ad" />
      <rect x="23" y="37" width="4" height="2" fill="#92855e" />
      <!-- splay shadows -->
      <rect x="11" y="38" width="1" height="1" fill="#7e7250" />
      <rect x="15" y="38" width="1" height="1" fill="#7e7250" />
      <rect x="19" y="38" width="1" height="1" fill="#6a6044" />
      <rect x="5" y="39" width="25" height="2" fill="#150d08" />
      <rect x="6" y="40" width="23" height="1" fill="#92855e" />
      <rect x="6" y="40" width="6" height="1" fill="#a89a72" />

      <!-- ── Green index-motes — entries that escaped ── -->
      <rect x="5" y="5" width="1" height="1" fill="#7aba4a" opacity="0.55" />
      <rect x="30" y="4" width="1" height="1" fill="#5e9638" opacity="0.5" />
      <rect x="2" y="24" width="1" height="1" fill="#7aba4a" opacity="0.45" />
      <rect x="33" y="25" width="1" height="1" fill="#5e9638" opacity="0.4" />
      <rect x="12" y="0" width="1" height="1" fill="#a8d878" opacity="0.45" />
      <rect x="23" y="1" width="1" height="1" fill="#7aba4a" opacity="0.4" />
    </svg>
