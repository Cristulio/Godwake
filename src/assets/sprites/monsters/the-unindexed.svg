<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 26 32"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="The Unindexed"
    >
      <!-- Corrupt-glow backlight + ground shadow -->
      <ellipse cx="13" cy="16" rx="13" ry="15" fill="#7aba4a" opacity="0.07" />
      <ellipse cx="13" cy="30" rx="9" ry="1.4" fill="#000" opacity="0.4" />

      <!-- Head — glitch ramp, key light upper-left -->
      <rect x="9" y="3" width="8" height="7" fill="#2e2838" />
      <rect x="9" y="3" width="8" height="1" fill="#4a4254" />
      <rect x="9" y="3" width="3" height="7" fill="#352d3e" />
      <rect x="9" y="3" width="1" height="5" fill="#5a5268" />
      <rect x="16" y="4" width="1" height="6" fill="#1a1622" />
      <rect x="13" y="2" width="4" height="3" fill="#241e2c" />
      <!-- Glitch eyes — green + spark, displaced -->
      <rect x="10" y="5" width="2" height="2" fill="#8aba5a" />
      <rect x="15" y="6" width="2" height="2" fill="#8aba5a" />
      <rect x="10" y="5" width="1" height="1" fill="#d4f0a0" />
      <rect x="15" y="6" width="1" height="1" fill="#d4f0a0" />
      <rect x="12" y="8" width="3" height="1" fill="#1a3010" opacity="0.8" />

      <!-- Torso — ramp + void holes + corruption dither -->
      <rect x="7" y="10" width="11" height="13" fill="#352d3e" />
      <rect x="7" y="10" width="11" height="1" fill="#4a4254" />
      <rect x="7" y="10" width="3" height="13" fill="#3a3245" />
      <rect x="7" y="10" width="1" height="11" fill="#5a5268" opacity="0.7" />
      <rect x="16" y="11" width="2" height="12" fill="#1a1622" />
      <rect x="10" y="13" width="3" height="3" fill="#0e1808" opacity="0.88" />
      <rect x="13" y="17" width="2" height="2" fill="#1a3010" opacity="0.7" />
      <rect x="8" y="18" width="2" height="2" fill="#0e1808" opacity="0.7" />
      <rect x="6" y="14" width="3" height="2" fill="#7aba4a" opacity="0.5" />
      <rect x="11" y="20" width="1" height="1" fill="#5a5268" opacity="0.5" />
      <rect x="14" y="12" width="1" height="1" fill="#1a1622" />

      <!-- Glitched displaced limbs -->
      <rect x="3" y="12" width="4" height="3" fill="#352d3e" />
      <rect x="3" y="12" width="4" height="1" fill="#4a4254" />
      <rect x="1" y="10" width="3" height="3" fill="#2e2838" />
      <rect x="1" y="10" width="1" height="3" fill="#4a4254" />
      <rect x="18" y="15" width="4" height="3" fill="#352d3e" />
      <rect x="21" y="17" width="3" height="3" fill="#241e2c" />
      <rect x="20" y="11" width="3" height="3" fill="#2e2838" />
      <rect x="23" y="13" width="2" height="2" fill="#1a1622" />
      <rect x="1" y="10" width="1" height="1" fill="#7aba4a" opacity="0.4" />
      <rect x="23" y="17" width="1" height="1" fill="#7aba4a" opacity="0.4" />

      <!-- Legs -->
      <rect x="8" y="23" width="4" height="7" fill="#241e2c" />
      <rect x="14" y="22" width="4" height="8" fill="#241e2c" />
      <rect x="8" y="23" width="1" height="7" fill="#352d3e" />
      <rect x="14" y="22" width="1" height="8" fill="#352d3e" />
      <rect x="11" y="25" width="3" height="2" fill="#1a3010" opacity="0.6" />

      <!-- Feet + corrupt ground bleed -->
      <rect x="7" y="29" width="5" height="2" fill="#0e0c14" />
      <rect x="14" y="29" width="5" height="2" fill="#0e0c14" />
      <rect x="3" y="30" width="20" height="2" fill="#0a1822" opacity="0.6" />
      <rect x="9" y="29" width="1" height="1" fill="#7aba4a" opacity="0.35" />
    </svg>
