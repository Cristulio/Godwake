<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 22 36"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Goblin Warden"
    >
      <!-- Torch backlight + ground shadow -->
      <ellipse cx="11" cy="18" rx="11" ry="16" fill="#5e8a2e" opacity="0.07" />
      <ellipse cx="11" cy="35" rx="7" ry="1.4" fill="#000" opacity="0.4" />

      <!-- Helmet — iron-bound leather ramp -->
      <rect x="6" y="1" width="10" height="3" fill="#5a4030" />
      <rect x="6" y="1" width="10" height="1" fill="#8c6232" />
      <rect x="6" y="1" width="2" height="3" fill="#6b4a2e" />
      <rect x="5" y="2" width="1" height="2" fill="#3a2e22" />
      <rect x="16" y="2" width="1" height="2" fill="#2a1810" />
      <rect x="10" y="0" width="2" height="1" fill="#a8814a" />

      <!-- Ears — green ramp -->
      <rect x="3" y="3" width="3" height="4" fill="#4a7022" />
      <rect x="3" y="3" width="3" height="1" fill="#5e8a2e" />
      <rect x="2" y="4" width="1" height="2" fill="#2d3f12" />
      <rect x="16" y="3" width="3" height="4" fill="#4a7022" />
      <rect x="18" y="3" width="1" height="3" fill="#3a5018" />
      <rect x="19" y="4" width="1" height="2" fill="#2d3f12" />

      <!-- Face — green ramp, key light upper-left -->
      <rect x="6" y="4" width="10" height="5" fill="#4a7022" />
      <rect x="6" y="4" width="2" height="5" fill="#5e8a2e" />
      <rect x="6" y="4" width="1" height="3" fill="#7faa3e" />
      <rect x="14" y="4" width="2" height="5" fill="#3a5018" />
      <rect x="15" y="5" width="1" height="3" fill="#2d3f12" />

      <!-- Glaring eyes — red with amber spark -->
      <rect x="6" y="5" width="3" height="1" fill="#22300f" />
      <rect x="13" y="5" width="3" height="1" fill="#22300f" />
      <rect x="7" y="5" width="2" height="2" fill="#b5302c" />
      <rect x="13" y="5" width="2" height="2" fill="#b5302c" />
      <rect x="7" y="5" width="1" height="1" fill="#ffb347" />
      <rect x="13" y="5" width="1" height="1" fill="#ffb347" />
      <rect x="9" y="7" width="4" height="1" fill="#7a1e10" opacity="0.6" />

      <!-- Fanged mouth -->
      <rect x="7" y="8" width="8" height="2" fill="#160f0a" />
      <rect x="7" y="8" width="1" height="2" fill="#e8dcc4" />
      <rect x="9" y="8" width="1" height="2" fill="#e8dcc4" />
      <rect x="12" y="8" width="1" height="2" fill="#d4c8a8" />
      <rect x="14" y="8" width="1" height="2" fill="#d4c8a8" />

      <!-- Iron pauldrons — steel ramp + specular -->
      <rect x="2" y="10" width="4" height="3" fill="#3a4250" />
      <rect x="2" y="10" width="4" height="1" fill="#8a91a4" />
      <rect x="2" y="10" width="1" height="3" fill="#5a6478" />
      <rect x="3" y="11" width="1" height="1" fill="#e8eef8" />
      <rect x="16" y="10" width="4" height="3" fill="#3a4250" />
      <rect x="16" y="10" width="4" height="1" fill="#5a6478" />
      <rect x="17" y="11" width="1" height="1" fill="#b4bcce" />

      <!-- Studded leather cuirass — brown ramp + rivets -->
      <rect x="5" y="10" width="12" height="11" fill="#5a4030" />
      <rect x="5" y="10" width="12" height="1" fill="#7a5230" />
      <rect x="5" y="10" width="2" height="11" fill="#6b4a2e" />
      <rect x="5" y="10" width="1" height="11" fill="#3a2418" />
      <rect x="15" y="11" width="2" height="10" fill="#3a2418" />
      <rect x="5" y="20" width="12" height="1" fill="#2a1810" />
      <rect x="7" y="12" width="1" height="1" fill="#a8814a" />
      <rect x="9" y="12" width="1" height="1" fill="#a8814a" />
      <rect x="13" y="12" width="1" height="1" fill="#8c6232" />
      <rect x="15" y="12" width="1" height="1" fill="#8c6232" />
      <rect x="8" y="15" width="1" height="1" fill="#a8814a" />
      <rect x="14" y="15" width="1" height="1" fill="#8c6232" />
      <rect x="7" y="18" width="1" height="1" fill="#8c6232" />
      <rect x="13" y="18" width="1" height="1" fill="#8c6232" />
      <!-- Belt buckle -->
      <rect x="10" y="20" width="2" height="2" fill="#d4b062" />
      <rect x="10" y="20" width="1" height="1" fill="#f4d042" />

      <!-- Arms — green ramp -->
      <rect x="2" y="13" width="3" height="8" fill="#4a7022" />
      <rect x="2" y="13" width="1" height="8" fill="#5e8a2e" />
      <rect x="4" y="13" width="1" height="8" fill="#3a5018" />
      <rect x="17" y="13" width="3" height="8" fill="#4a7022" />
      <rect x="19" y="13" width="1" height="8" fill="#3a5018" />

      <!-- Bone totem-haft held to the fore — bone ramp + specular -->
      <rect x="9" y="0" width="4" height="11" fill="#c2b794" />
      <rect x="9" y="0" width="2" height="11" fill="#d4c8a8" />
      <rect x="10" y="0" width="1" height="11" fill="#e8dcc4" />
      <rect x="12" y="0" width="1" height="11" fill="#8c7a52" />
      <rect x="11" y="1" width="1" height="1" fill="#fff4e0" />
      <!-- Lashing + grip -->
      <rect x="8" y="11" width="6" height="1" fill="#5a3a22" />
      <rect x="10" y="12" width="2" height="4" fill="#3a2418" />
      <!-- Carved notches -->
      <rect x="9" y="3" width="1" height="1" fill="#5a4c34" />
      <rect x="12" y="4" width="1" height="1" fill="#5a4c34" />
      <rect x="9" y="6" width="1" height="1" fill="#5a4c34" />
      <rect x="12" y="7" width="1" height="1" fill="#5a4c34" />

      <!-- War-skirt -->
      <rect x="5" y="22" width="12" height="3" fill="#3a2e22" />
      <rect x="5" y="22" width="12" height="1" fill="#5a4030" />
      <rect x="5" y="22" width="2" height="3" fill="#2a1810" />

      <!-- Legs — green ramp -->
      <rect x="6" y="25" width="3" height="8" fill="#4a7022" />
      <rect x="13" y="25" width="3" height="8" fill="#4a7022" />
      <rect x="6" y="25" width="1" height="8" fill="#5e8a2e" />
      <rect x="13" y="25" width="1" height="8" fill="#3a5018" />
      <rect x="8" y="26" width="1" height="7" fill="#2d3f12" />
      <rect x="15" y="26" width="1" height="7" fill="#2d3f12" />

      <!-- Boots -->
      <rect x="5" y="33" width="5" height="3" fill="#2a1810" />
      <rect x="12" y="33" width="5" height="3" fill="#2a1810" />
      <rect x="5" y="33" width="5" height="1" fill="#5a4030" />
      <rect x="12" y="33" width="5" height="1" fill="#5a4030" />
    </svg>
