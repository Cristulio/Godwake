<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 49"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Goblin Warden"
    >
      <!-- Torch backlight + ground shadow -->
      <ellipse cx="15" cy="23" rx="15" ry="21" fill="#5e8a2e" opacity="0.07" />
      <ellipse cx="14" cy="18" rx="11" ry="14" fill="#ffb040" opacity="0.05" />
      <ellipse cx="15" cy="47.6" rx="11" ry="1.9" fill="#000" opacity="0.42" />

      <!-- ── Bone totem-staff with the warden's bell, held to the fore ── -->
      <rect x="11" y="0" width="6" height="16" fill="#150d08" />
      <rect x="12" y="1" width="4" height="14" fill="#c2b794" />
      <rect x="12" y="1" width="2" height="14" fill="#d4c8a8" />
      <rect x="12" y="1" width="1" height="10" fill="#f0e6cc" />
      <rect x="15" y="1" width="1" height="14" fill="#8c7a52" />
      <!-- carved sigil notches -->
      <rect x="13" y="3" width="2" height="1" fill="#5a4c34" />
      <rect x="13" y="6" width="1" height="1" fill="#5a4c34" />
      <rect x="14" y="9" width="1" height="1" fill="#5a4c34" />
      <!-- ── Iron-bound leather helm ── -->
      <rect x="7" y="2" width="14" height="5" fill="#150d08" />
      <rect x="8" y="3" width="12" height="3" fill="#5a4030" />
      <rect x="8" y="3" width="12" height="1" fill="#8c6232" />
      <rect x="8" y="3" width="3" height="3" fill="#6b4a2e" />
      <rect x="8" y="3" width="1" height="2" fill="#a8814a" />
      <rect x="18" y="4" width="2" height="2" fill="#3a2e22" />
      <!-- iron band + crest spike -->
      <rect x="8" y="5" width="12" height="1" fill="#39424f" />
      <rect x="8" y="5" width="4" height="1" fill="#6d7689" />
      <rect x="13" y="1" width="2" height="2" fill="#150d08" />
      <rect x="13" y="1" width="1" height="1" fill="#939cb0" />

      <!-- ── Ears — green ramp ── -->
      <rect x="2" y="5" width="6" height="6" fill="#150d08" />
      <rect x="3" y="6" width="4" height="4" fill="#4a7022" />
      <rect x="3" y="6" width="3" height="1" fill="#7faa3e" />
      <rect x="3" y="7" width="1" height="2" fill="#5e8a2e" />
      <rect x="5" y="8" width="2" height="2" fill="#2d3f12" />
      <rect x="22" y="5" width="6" height="6" fill="#150d08" />
      <rect x="23" y="6" width="4" height="4" fill="#3a5018" />
      <rect x="23" y="6" width="3" height="1" fill="#4a7022" />
      <rect x="25" y="7" width="2" height="3" fill="#2d3f12" />
      <rect x="26" y="8" width="1" height="2" fill="#2e4a4e" />

      <!-- ── Face — green ramp, key upper-left ── -->
      <rect x="7" y="6" width="14" height="9" fill="#150d08" />
      <rect x="8" y="7" width="12" height="7" fill="#4a7022" />
      <rect x="8" y="7" width="3" height="7" fill="#5e8a2e" />
      <rect x="8" y="7" width="1" height="5" fill="#7faa3e" />
      <rect x="17" y="7" width="3" height="7" fill="#3a5018" />
      <rect x="19" y="8" width="1" height="6" fill="#2d3f12" />
      <rect x="19" y="10" width="1" height="2" fill="#2e4a4e" />
      <!-- scarred brow -->
      <rect x="9" y="8" width="5" height="1" fill="#2d3f12" />
      <rect x="15" y="8" width="4" height="1" fill="#22300f" />
      <rect x="11" y="7" width="1" height="2" fill="#7a1e10" />

      <!-- ── Commanding eyes — blood red, amber spark ── -->
      <rect x="9" y="9" width="3" height="2" fill="#22300f" />
      <rect x="15" y="9" width="3" height="2" fill="#22300f" />
      <rect x="9" y="9" width="2" height="2" fill="#b5302c" />
      <rect x="15" y="9" width="2" height="2" fill="#9c2824" />
      <rect x="9" y="9" width="1" height="1" fill="#ffb347" />
      <rect x="15" y="9" width="1" height="1" fill="#ff8a5a" />

      <!-- ── Jutting jaw with tusks ── -->
      <rect x="9" y="12" width="10" height="2" fill="#160f0a" />
      <rect x="9" y="12" width="1" height="2" fill="#f0e6cc" />
      <rect x="12" y="12" width="1" height="2" fill="#e8dcc4" />
      <rect x="16" y="12" width="1" height="2" fill="#d4c8a8" />
      <rect x="18" y="12" width="1" height="1" fill="#a89878" />
      <rect x="10" y="13" width="2" height="1" fill="#3a5018" />

      <!-- ── Bronze bell hung from a crossbar lashed to the staff — the summons.
           Drawn after the head so it hangs in front of the ear. ── -->
      <ellipse cx="7.5" cy="4" rx="4.5" ry="3.6" fill="#f4d042" opacity="0.14" />
      <rect x="4" y="0" width="9" height="2" fill="#150d08" />
      <rect x="5" y="1" width="7" height="1" fill="#8c7a52" />
      <rect x="5" y="1" width="3" height="1" fill="#c2b794" />
      <rect x="3" y="1" width="6" height="6" fill="#150d08" />
      <rect x="4" y="2" width="4" height="4" fill="#9a7232" />
      <rect x="4" y="2" width="2" height="3" fill="#c89a48" />
      <rect x="4" y="2" width="1" height="2" fill="#ecc46a" />
      <rect x="4" y="2" width="1" height="1" fill="#fff0b8" />
      <rect x="7" y="3" width="1" height="3" fill="#6b4a22" />
      <rect x="3" y="6" width="6" height="1" fill="#150d08" />
      <rect x="4" y="6" width="4" height="1" fill="#c89a48" />
      <rect x="4" y="6" width="2" height="1" fill="#ecc46a" />
      <!-- clapper -->
      <rect x="5" y="7" width="2" height="2" fill="#150d08" />
      <rect x="5" y="7" width="1" height="1" fill="#f4d042" />

      <!-- ── Iron pauldrons — steel ramp, hard speculars ── -->
      <rect x="1" y="14" width="8" height="6" fill="#150d08" />
      <rect x="2" y="15" width="6" height="4" fill="#4e586a" />
      <rect x="2" y="15" width="6" height="1" fill="#939cb0" />
      <rect x="2" y="15" width="2" height="1" fill="#c8cfe0" />
      <rect x="2" y="15" width="1" height="1" fill="#f2f0e4" />
      <rect x="2" y="18" width="6" height="1" fill="#39424f" />
      <rect x="6" y="16" width="2" height="2" fill="#39424f" />
      <rect x="21" y="14" width="8" height="6" fill="#150d08" />
      <rect x="22" y="15" width="6" height="4" fill="#39424f" />
      <rect x="22" y="15" width="6" height="1" fill="#6d7689" />
      <rect x="22" y="15" width="1" height="1" fill="#939cb0" />
      <rect x="26" y="16" width="2" height="3" fill="#232c3a" />
      <rect x="27" y="17" width="1" height="2" fill="#2e4a4e" />

      <!-- ── Studded-leather cuirass — brown ramp, rivet rows ── -->
      <rect x="6" y="15" width="16" height="15" fill="#150d08" />
      <rect x="7" y="16" width="14" height="13" fill="#5a4030" />
      <rect x="7" y="16" width="14" height="1" fill="#7a5230" />
      <rect x="7" y="16" width="3" height="12" fill="#6b4a2e" />
      <rect x="7" y="16" width="1" height="12" fill="#8a6238" />
      <rect x="18" y="16" width="3" height="12" fill="#3a2418" />
      <rect x="20" y="17" width="1" height="11" fill="#2a1810" />
      <!-- iron chest-plate strap -->
      <rect x="7" y="19" width="14" height="1" fill="#39424f" />
      <rect x="7" y="19" width="4" height="1" fill="#6d7689" />
      <rect x="7" y="24" width="14" height="1" fill="#39424f" opacity="0.8" />
      <!-- rivets -->
      <rect x="9" y="17" width="1" height="1" fill="#a8814a" />
      <rect x="13" y="17" width="1" height="1" fill="#a8814a" />
      <rect x="17" y="17" width="1" height="1" fill="#8c6232" />
      <rect x="9" y="21" width="1" height="1" fill="#a8814a" />
      <rect x="13" y="21" width="1" height="1" fill="#8c6232" />
      <rect x="17" y="21" width="1" height="1" fill="#7a5230" />
      <rect x="9" y="26" width="1" height="1" fill="#8c6232" />
      <rect x="14" y="26" width="1" height="1" fill="#8c6232" />
      <!-- belt + gold buckle -->
      <rect x="7" y="28" width="14" height="2" fill="#33231a" />
      <rect x="7" y="28" width="14" height="1" fill="#4a3322" />
      <rect x="13" y="28" width="3" height="2" fill="#9a7e2e" />
      <rect x="13" y="28" width="2" height="1" fill="#d4b062" />
      <rect x="13" y="28" width="1" height="1" fill="#f4d042" />

      <!-- ── Left arm — lit, gripping the totem-staff ── -->
      <rect x="2" y="20" width="5" height="8" fill="#150d08" />
      <rect x="3" y="21" width="3" height="6" fill="#4a7022" />
      <rect x="3" y="21" width="1" height="6" fill="#5e8a2e" />
      <rect x="5" y="21" width="1" height="6" fill="#3a5018" />
      <!-- fist on the haft -->
      <rect x="10" y="14" width="5" height="4" fill="#150d08" />
      <rect x="11" y="15" width="3" height="2" fill="#5e8a2e" />
      <rect x="11" y="15" width="1" height="1" fill="#7faa3e" />
      <rect x="13" y="16" width="1" height="1" fill="#3a5018" />

      <!-- ── Right arm — shadow side ── -->
      <rect x="22" y="20" width="5" height="9" fill="#150d08" />
      <rect x="23" y="21" width="3" height="7" fill="#3a5018" />
      <rect x="25" y="21" width="1" height="7" fill="#2d3f12" />
      <rect x="23" y="27" width="4" height="3" fill="#150d08" />
      <rect x="24" y="28" width="2" height="1" fill="#3a5018" />

      <!-- ── War-skirt — layered leather strips ── -->
      <rect x="6" y="30" width="16" height="5" fill="#150d08" />
      <rect x="7" y="31" width="14" height="3" fill="#3a2e22" />
      <rect x="7" y="31" width="14" height="1" fill="#5a4030" />
      <rect x="10" y="31" width="1" height="3" fill="#2a1810" />
      <rect x="14" y="31" width="1" height="3" fill="#2a1810" />
      <rect x="18" y="31" width="1" height="3" fill="#2a1810" />
      <rect x="7" y="31" width="2" height="3" fill="#4a3a2c" />

      <!-- ── Legs — green ramp ── -->
      <rect x="7" y="35" width="6" height="9" fill="#150d08" />
      <rect x="8" y="36" width="4" height="8" fill="#4a7022" />
      <rect x="8" y="36" width="1" height="8" fill="#5e8a2e" />
      <rect x="11" y="36" width="1" height="8" fill="#3a5018" />
      <rect x="15" y="35" width="6" height="9" fill="#150d08" />
      <rect x="16" y="36" width="4" height="8" fill="#3a5018" />
      <rect x="16" y="36" width="1" height="8" fill="#4a7022" />
      <rect x="19" y="36" width="1" height="8" fill="#2d3f12" />

      <!-- ── Iron-shod boots ── -->
      <rect x="5" y="43" width="8" height="4" fill="#150d08" />
      <rect x="6" y="44" width="6" height="2" fill="#2a1810" />
      <rect x="6" y="44" width="6" height="1" fill="#5a4030" />
      <rect x="6" y="45" width="2" height="1" fill="#6d7689" />
      <rect x="15" y="43" width="8" height="4" fill="#150d08" />
      <rect x="16" y="44" width="6" height="2" fill="#2a1810" />
      <rect x="16" y="44" width="6" height="1" fill="#4a3322" />
      <rect x="16" y="45" width="2" height="1" fill="#4e586a" />
    </svg>
