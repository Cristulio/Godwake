<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 22 36"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Cult Fanatic"
    >
      <!-- Warm candle backlight + ground shadow -->
      <ellipse cx="11" cy="18" rx="11" ry="17" fill="#c0801a" opacity="0.07" />
      <ellipse cx="11" cy="35" rx="8" ry="1.6" fill="#000" opacity="0.4" />

      <!-- Peaked hood — bone ramp -->
      <polygon points="7,1 11,-1 15,1 16,5 6,5" fill="#a89878" />
      <polygon points="7,1 11,-1 15,1 16,3 6,3" fill="#c8b89a" />
      <polygon points="9,0 11,-1 13,1 12,2 10,2" fill="#d8c8a8" />
      <polygon points="14,2 16,5 15,5 13,3" fill="#7a6848" opacity="0.7" />

      <!-- Hood brim -->
      <rect x="5" y="4" width="12" height="6" fill="#b5a282" />
      <rect x="5" y="4" width="12" height="1" fill="#c8b89a" />
      <rect x="5" y="4" width="2" height="6" fill="#c4b496" />
      <rect x="4" y="6" width="1" height="4" fill="#7a6848" />
      <rect x="16" y="5" width="1" height="5" fill="#5a4c34" />
      <rect x="17" y="6" width="1" height="4" fill="#7a6848" />

      <!-- Shadowed face cavity -->
      <rect x="7" y="6" width="8" height="5" fill="#1a0e08" />
      <rect x="7" y="6" width="8" height="1" fill="#0e0804" />
      <!-- Zealot eyes -->
      <rect x="8" y="7" width="2" height="2" fill="#2a1008" />
      <rect x="12" y="7" width="2" height="2" fill="#2a1008" />
      <rect x="8" y="8" width="1" height="1" fill="#b5302c" />
      <rect x="13" y="8" width="1" height="1" fill="#b5302c" />
      <rect x="8" y="8" width="1" height="1" fill="#e85a4a" opacity="0.7" />
      <!-- Murmuring mouth -->
      <rect x="9" y="10" width="4" height="1" fill="#0e0804" />
      <rect x="10" y="10" width="1" height="1" fill="#a89878" />

      <!-- Red ritual sash -->
      <rect x="5" y="10" width="12" height="1" fill="#5a1208" />
      <rect x="5" y="10" width="6" height="1" fill="#8c2010" />

      <!-- Robe body — bone ramp + dither + blood stain -->
      <rect x="4" y="11" width="14" height="14" fill="#b5a282" />
      <rect x="4" y="11" width="14" height="1" fill="#c8b89a" />
      <rect x="4" y="11" width="2" height="14" fill="#c4b496" />
      <rect x="4" y="11" width="1" height="14" fill="#d2c2a0" />
      <rect x="16" y="12" width="2" height="13" fill="#8c7c5c" />
      <rect x="17" y="12" width="1" height="13" fill="#7a6848" />
      <rect x="6" y="14" width="2" height="3" fill="#7a6848" opacity="0.55" />
      <rect x="13" y="16" width="3" height="2" fill="#7a6848" opacity="0.55" />
      <rect x="8" y="20" width="4" height="1" fill="#5a1208" opacity="0.7" />
      <rect x="11" y="22" width="2" height="2" fill="#5a1208" opacity="0.7" />
      <rect x="9" y="16" width="1" height="1" fill="#d2c2a0" />
      <rect x="14" y="20" width="1" height="1" fill="#7a6848" />

      <!-- Cinched belt -->
      <rect x="4" y="22" width="14" height="2" fill="#5a4028" />
      <rect x="4" y="22" width="14" height="1" fill="#6e5238" />
      <rect x="9" y="22" width="2" height="3" fill="#5a4028" />
      <rect x="10" y="24" width="1" height="2" fill="#3a2818" />

      <!-- Sleeves -->
      <rect x="2" y="13" width="2" height="6" fill="#b5a282" />
      <rect x="2" y="13" width="2" height="1" fill="#c8b89a" />
      <rect x="2" y="13" width="1" height="6" fill="#c4b496" />
      <rect x="18" y="13" width="2" height="6" fill="#a89878" />
      <rect x="19" y="13" width="1" height="6" fill="#8c7c5c" />
      <rect x="2" y="19" width="2" height="3" fill="#c8b89a" />
      <rect x="18" y="19" width="2" height="3" fill="#a89878" />
      <!-- Left hand -->
      <rect x="1" y="20" width="3" height="2" fill="#c4b08a" />
      <rect x="0" y="21" width="1" height="1" fill="#3a2818" />

      <!-- Staff with bone finial -->
      <rect x="19" y="4" width="2" height="9" fill="#5a4028" />
      <rect x="19" y="4" width="1" height="9" fill="#6e5238" />
      <polygon points="18,4 22,4 20,-1" fill="#c8b89a" />
      <polygon points="19,3 21,3 20,0" fill="#e8dcc4" />
      <rect x="19" y="2" width="2" height="2" fill="#e8dcc4" />
      <rect x="19" y="2" width="1" height="1" fill="#fff4d8" />
      <rect x="18" y="13" width="4" height="1" fill="#3a2818" />

      <!-- Robe skirt — ramped, ragged hem -->
      <rect x="5" y="25" width="12" height="8" fill="#a89878" />
      <rect x="5" y="25" width="12" height="1" fill="#c4b496" />
      <rect x="5" y="25" width="2" height="8" fill="#b8a884" />
      <rect x="15" y="25" width="2" height="8" fill="#8c7c5c" />
      <polygon points="5,33 7,30 9,33" fill="#a89878" />
      <polygon points="9,33 11,30 13,33" fill="#b5a282" />
      <polygon points="13,33 15,30 17,33" fill="#a89878" />
      <rect x="7" y="32" width="1" height="1" fill="#7a6848" />
      <rect x="11" y="32" width="1" height="1" fill="#7a6848" />
      <rect x="15" y="32" width="1" height="1" fill="#7a6848" />

      <!-- Feet -->
      <rect x="6" y="33" width="3" height="2" fill="#7a6848" />
      <rect x="13" y="33" width="3" height="2" fill="#7a6848" />
      <rect x="6" y="35" width="3" height="1" fill="#5a4c34" />
      <rect x="13" y="35" width="3" height="1" fill="#5a4c34" />
    </svg>
