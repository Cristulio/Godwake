<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 49"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Cult Fanatic"
    >
      <!-- Warm candle backlight + ground shadow -->
      <ellipse cx="15" cy="23" rx="14" ry="22" fill="#c0801a" opacity="0.07" />
      <ellipse cx="15" cy="47.6" rx="10" ry="1.9" fill="#000" opacity="0.4" />

      <!-- ── Peaked hood — bone-pale cloth, stepped point ── -->
      <rect x="13" y="0" width="4" height="3" fill="#150d08" />
      <rect x="14" y="1" width="2" height="2" fill="#c8b89a" />
      <rect x="14" y="1" width="1" height="1" fill="#e0d2b2" />
      <rect x="11" y="2" width="8" height="3" fill="#150d08" />
      <rect x="12" y="3" width="6" height="2" fill="#b5a282" />
      <rect x="12" y="3" width="3" height="1" fill="#d8c8a8" />
      <rect x="16" y="4" width="2" height="1" fill="#8c7c5c" />
      <rect x="9" y="5" width="12" height="4" fill="#150d08" />
      <rect x="10" y="6" width="10" height="3" fill="#b5a282" />
      <rect x="10" y="6" width="4" height="1" fill="#c8b89a" />
      <rect x="10" y="6" width="2" height="3" fill="#c4b496" />
      <rect x="17" y="6" width="3" height="3" fill="#8c7c5c" />
      <!-- hood brim framing the dark -->
      <rect x="7" y="8" width="16" height="7" fill="#150d08" />
      <rect x="8" y="9" width="14" height="5" fill="#b5a282" />
      <rect x="8" y="9" width="3" height="5" fill="#c4b496" />
      <rect x="8" y="9" width="1" height="4" fill="#d8c8a8" />
      <rect x="19" y="9" width="3" height="5" fill="#8c7c5c" />
      <rect x="21" y="10" width="1" height="4" fill="#7a6848" />
      <rect x="21" y="11" width="1" height="2" fill="#3e5650" />

      <!-- ── Shadowed face cavity — zealot embers inside ── -->
      <rect x="10" y="10" width="10" height="4" fill="#1a0e08" />
      <rect x="10" y="10" width="10" height="1" fill="#0e0804" />
      <rect x="11" y="11" width="3" height="2" fill="#2a1008" />
      <rect x="16" y="11" width="3" height="2" fill="#2a1008" />
      <rect x="12" y="11" width="2" height="1" fill="#b5302c" />
      <rect x="16" y="11" width="2" height="1" fill="#9c2824" />
      <rect x="12" y="11" width="1" height="1" fill="#ff7a5a" />
      <rect x="16" y="11" width="1" height="1" fill="#e85a4a" />
      <!-- murmuring mouth -->
      <rect x="13" y="13" width="4" height="1" fill="#0e0804" />
      <rect x="14" y="13" width="1" height="1" fill="#8c7c5c" />

      <!-- ── Red ritual stole over the shoulders ── -->
      <rect x="6" y="14" width="18" height="3" fill="#150d08" />
      <rect x="7" y="15" width="16" height="2" fill="#7a2020" />
      <rect x="7" y="15" width="16" height="1" fill="#9a3030" />
      <rect x="7" y="15" width="4" height="1" fill="#b04a48" />
      <rect x="20" y="16" width="3" height="1" fill="#5a1208" />

      <!-- ── Robe body — bone cloth, blood-stained ── -->
      <rect x="6" y="17" width="18" height="16" fill="#150d08" />
      <rect x="7" y="18" width="16" height="14" fill="#b5a282" />
      <rect x="7" y="18" width="16" height="1" fill="#c8b89a" />
      <rect x="7" y="18" width="3" height="13" fill="#c4b496" />
      <rect x="7" y="18" width="1" height="13" fill="#d8c8a8" />
      <rect x="20" y="18" width="3" height="13" fill="#8c7c5c" />
      <rect x="22" y="19" width="1" height="12" fill="#7a6848" />
      <!-- center fold -->
      <rect x="14" y="18" width="2" height="14" fill="#9a8a68" />
      <rect x="15" y="18" width="1" height="14" fill="#8c7c5c" />
      <!-- stole tails hanging -->
      <rect x="9" y="17" width="3" height="9" fill="#7a2020" />
      <rect x="9" y="17" width="1" height="9" fill="#9a3030" />
      <rect x="11" y="18" width="1" height="8" fill="#5a1208" />
      <rect x="18" y="17" width="3" height="9" fill="#6a1818" />
      <rect x="18" y="17" width="1" height="9" fill="#7a2020" />
      <!-- embroidered sigil on the stole -->
      <rect x="9" y="20" width="3" height="1" fill="#d4b062" />
      <rect x="10" y="19" width="1" height="3" fill="#d4b062" />
      <rect x="10" y="20" width="1" height="1" fill="#f4d042" />
      <rect x="18" y="22" width="3" height="1" fill="#9a7e2e" />
      <rect x="19" y="21" width="1" height="3" fill="#9a7e2e" />
      <!-- blood spatter low on the robe -->
      <rect x="12" y="28" width="3" height="1" fill="#5a1208" opacity="0.8" />
      <rect x="13" y="29" width="2" height="2" fill="#5a1208" opacity="0.7" />
      <rect x="16" y="30" width="1" height="1" fill="#5a1208" opacity="0.6" />
      <rect x="11" y="30" width="1" height="1" fill="#5a1208" opacity="0.5" />
      <!-- robe dither -->
      <rect x="11" y="22" width="1" height="1" fill="#d8c8a8" />
      <rect x="19" y="26" width="1" height="1" fill="#7a6848" />

      <!-- ── Left arm — candle raised, wax dripping ── -->
      <rect x="3" y="18" width="5" height="9" fill="#150d08" />
      <rect x="4" y="19" width="3" height="7" fill="#b5a282" />
      <rect x="4" y="19" width="1" height="7" fill="#c4b496" />
      <rect x="6" y="19" width="1" height="7" fill="#8c7c5c" />
      <rect x="3" y="26" width="4" height="2" fill="#150d08" />
      <rect x="4" y="26" width="2" height="1" fill="#c4b08a" />
      <!-- ritual candle -->
      <rect x="3" y="20" width="3" height="6" fill="#150d08" />
      <rect x="4" y="21" width="1" height="5" fill="#e8dcc4" />
      <rect x="4" y="21" width="1" height="2" fill="#f8f2dc" />
      <!-- flame + glow -->
      <ellipse cx="4.5" cy="18.5" rx="3" ry="3.4" fill="#f4a72a" opacity="0.25" />
      <rect x="4" y="18" width="1" height="2" fill="#ffb040" />
      <rect x="4" y="18" width="1" height="1" fill="#ffe9b0" />
      <rect x="4" y="17" width="1" height="1" fill="#fff8e0" />

      <!-- ── Right arm — bone-finial staff ── -->
      <rect x="22" y="18" width="5" height="9" fill="#150d08" />
      <rect x="23" y="19" width="3" height="7" fill="#a89878" />
      <rect x="23" y="19" width="1" height="7" fill="#b5a282" />
      <rect x="25" y="19" width="1" height="7" fill="#7a6848" />
      <rect x="23" y="26" width="4" height="2" fill="#150d08" />
      <rect x="24" y="26" width="2" height="1" fill="#c4b08a" />

      <!-- staff -->
      <rect x="25" y="4" width="3" height="40" fill="#150d08" />
      <rect x="26" y="5" width="1" height="38" fill="#5a4028" />
      <rect x="26" y="5" width="1" height="12" fill="#6e5238" />
      <!-- carved bone finial -->
      <rect x="24" y="0" width="5" height="6" fill="#150d08" />
      <rect x="25" y="1" width="3" height="4" fill="#c8b89a" />
      <rect x="25" y="1" width="2" height="2" fill="#e8dcc4" />
      <rect x="25" y="1" width="1" height="1" fill="#fff4d8" />
      <rect x="27" y="3" width="1" height="2" fill="#8c7c5c" />
      <!-- socket holes in the bone -->
      <rect x="26" y="2" width="1" height="1" fill="#1a0e08" />
      <rect x="25" y="4" width="1" height="1" fill="#1a0e08" />

      <!-- ── Cinched rope belt ── -->
      <rect x="7" y="33" width="16" height="2" fill="#150d08" />
      <rect x="8" y="33" width="14" height="1" fill="#6e5238" />
      <rect x="13" y="33" width="2" height="4" fill="#5a4028" />
      <rect x="13" y="35" width="1" height="3" fill="#3a2818" />

      <!-- ── Robe skirt — long, ragged scalloped hem ── -->
      <rect x="6" y="35" width="18" height="10" fill="#150d08" />
      <rect x="7" y="36" width="16" height="8" fill="#a89878" />
      <rect x="7" y="36" width="16" height="1" fill="#c4b496" />
      <rect x="7" y="36" width="3" height="8" fill="#b8a884" />
      <rect x="7" y="36" width="1" height="6" fill="#c4b496" />
      <rect x="20" y="36" width="3" height="8" fill="#8c7c5c" />
      <rect x="22" y="37" width="1" height="7" fill="#7a6848" />
      <!-- fold shadows -->
      <rect x="11" y="37" width="1" height="7" fill="#8c7c5c" />
      <rect x="17" y="37" width="1" height="7" fill="#7a6848" />
      <!-- ragged hem bites -->
      <rect x="9" y="43" width="2" height="2" fill="#150d08" />
      <rect x="14" y="43" width="2" height="2" fill="#150d08" />
      <rect x="19" y="43" width="2" height="2" fill="#150d08" />
      <rect x="7" y="44" width="16" height="1" fill="#5a4c34" opacity="0.6" />

      <!-- ── Bare feet shuffling under the hem ── -->
      <rect x="8" y="45" width="5" height="3" fill="#150d08" />
      <rect x="9" y="46" width="3" height="1" fill="#a8885c" />
      <rect x="17" y="45" width="5" height="3" fill="#150d08" />
      <rect x="18" y="46" width="3" height="1" fill="#8a6a44" />
    </svg>
