<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 38 44"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Drider"
    >
      <!-- Deepdark backlight + wide ground shadow -->
      <ellipse cx="19" cy="22" rx="18" ry="19" fill="#6a4a90" opacity="0.08" />
      <ellipse cx="19" cy="42.6" rx="16" ry="1.8" fill="#000" opacity="0.42" />

      <!-- ── Rear legs (drawn first, behind the abdomen) ── -->
      <rect x="3" y="20" width="4" height="3" fill="#150d08" />
      <rect x="4" y="21" width="2" height="1" fill="#2a1024" />
      <rect x="1" y="22" width="4" height="3" fill="#150d08" />
      <rect x="2" y="23" width="2" height="1" fill="#1c0a18" />
      <rect x="0" y="24" width="3" height="8" fill="#150d08" />
      <rect x="1" y="25" width="1" height="6" fill="#2a1024" />
      <rect x="31" y="20" width="4" height="3" fill="#150d08" />
      <rect x="32" y="21" width="2" height="1" fill="#1c0a18" />
      <rect x="33" y="22" width="4" height="3" fill="#150d08" />
      <rect x="34" y="23" width="2" height="1" fill="#120810" />
      <rect x="35" y="24" width="3" height="8" fill="#150d08" />
      <rect x="36" y="25" width="1" height="6" fill="#1c0a18" />

      <!-- ── Spider abdomen — black-violet, red goddess-mark ── -->
      <rect x="7" y="18" width="24" height="4" fill="#150d08" />
      <rect x="5" y="21" width="28" height="9" fill="#150d08" />
      <rect x="7" y="30" width="24" height="4" fill="#150d08" />
      <!-- fill -->
      <rect x="8" y="19" width="22" height="3" fill="#2a1024" />
      <rect x="6" y="22" width="26" height="7" fill="#241020" />
      <rect x="8" y="29" width="22" height="4" fill="#1c0a18" />
      <!-- lit crown of the abdomen -->
      <rect x="8" y="19" width="9" height="2" fill="#3a1c34" />
      <rect x="8" y="19" width="5" height="1" fill="#4c2842" />
      <rect x="6" y="22" width="4" height="3" fill="#321628" />
      <!-- cool shadow flank -->
      <rect x="26" y="22" width="6" height="7" fill="#180a14" />
      <rect x="29" y="24" width="3" height="6" fill="#120810" />
      <rect x="30" y="26" width="2" height="3" fill="#1c2e34" />
      <!-- red goddess-mark — hourglass sigil -->
      <rect x="16" y="22" width="7" height="2" fill="#7a1828" />
      <rect x="17" y="24" width="5" height="2" fill="#b53c4a" />
      <rect x="18" y="24" width="3" height="1" fill="#d85a5a" />
      <rect x="16" y="26" width="7" height="2" fill="#7a1828" />
      <!-- spinneret bristles -->
      <rect x="9" y="32" width="1" height="2" fill="#150d08" />
      <rect x="13" y="33" width="1" height="2" fill="#150d08" />
      <rect x="24" y="33" width="1" height="2" fill="#150d08" />
      <rect x="28" y="32" width="1" height="2" fill="#150d08" />
      <!-- chitin dither -->
      <rect x="11" y="21" width="1" height="1" fill="#4c2842" />
      <rect x="24" y="23" width="1" height="1" fill="#120810" />
      <rect x="14" y="28" width="1" height="1" fill="#321628" />

      <!-- ── Mid + fore legs — angular, clawed ── -->
      <!-- left mid -->
      <rect x="6" y="24" width="4" height="3" fill="#150d08" />
      <rect x="7" y="25" width="2" height="1" fill="#321628" />
      <rect x="3" y="26" width="5" height="3" fill="#150d08" />
      <rect x="4" y="27" width="3" height="1" fill="#2a1024" />
      <rect x="2" y="28" width="3" height="10" fill="#150d08" />
      <rect x="3" y="29" width="1" height="8" fill="#2a1024" />
      <rect x="3" y="29" width="1" height="3" fill="#3a1c34" />
      <!-- left fore -->
      <rect x="9" y="26" width="4" height="4" fill="#150d08" />
      <rect x="10" y="27" width="2" height="2" fill="#321628" />
      <rect x="7" y="29" width="4" height="4" fill="#150d08" />
      <rect x="8" y="30" width="2" height="2" fill="#2a1024" />
      <rect x="6" y="32" width="3" height="9" fill="#150d08" />
      <rect x="7" y="33" width="1" height="7" fill="#3a1c34" />
      <!-- right mid -->
      <rect x="28" y="24" width="4" height="3" fill="#150d08" />
      <rect x="29" y="25" width="2" height="1" fill="#1c0a18" />
      <rect x="30" y="26" width="5" height="3" fill="#150d08" />
      <rect x="31" y="27" width="3" height="1" fill="#120810" />
      <rect x="33" y="28" width="3" height="10" fill="#150d08" />
      <rect x="34" y="29" width="1" height="8" fill="#1c0a18" />
      <!-- right fore -->
      <rect x="25" y="26" width="4" height="4" fill="#150d08" />
      <rect x="26" y="27" width="2" height="2" fill="#1c0a18" />
      <rect x="27" y="29" width="4" height="4" fill="#150d08" />
      <rect x="28" y="30" width="2" height="2" fill="#120810" />
      <rect x="29" y="32" width="3" height="9" fill="#150d08" />
      <rect x="30" y="33" width="1" height="7" fill="#1c0a18" />
      <!-- claw tips -->
      <rect x="2" y="38" width="2" height="3" fill="#150d08" />
      <rect x="6" y="41" width="2" height="2" fill="#150d08" />
      <rect x="33" y="38" width="2" height="3" fill="#150d08" />
      <rect x="29" y="41" width="2" height="2" fill="#150d08" />
      <rect x="0" y="32" width="2" height="2" fill="#150d08" />
      <rect x="36" y="32" width="2" height="2" fill="#150d08" />

      <!-- ── Drow torso rising from the abdomen ── -->
      <rect x="13" y="9" width="13" height="11" fill="#150d08" />
      <rect x="14" y="10" width="11" height="9" fill="#2e1e44" />
      <rect x="14" y="10" width="11" height="1" fill="#3e2c58" />
      <rect x="14" y="10" width="3" height="9" fill="#3a2858" />
      <rect x="14" y="10" width="1" height="6" fill="#4c3a6e" />
      <rect x="22" y="11" width="3" height="8" fill="#22143a" />
      <rect x="24" y="12" width="1" height="7" fill="#180e2c" />
      <!-- waist fusing into chitin — grafted ring -->
      <rect x="13" y="18" width="13" height="2" fill="#150d08" />
      <rect x="14" y="18" width="11" height="1" fill="#3a1c34" />
      <rect x="14" y="18" width="4" height="1" fill="#4c2842" />
      <!-- rib-harness of bone trophies -->
      <rect x="14" y="13" width="11" height="2" fill="#3a2418" />
      <rect x="14" y="13" width="11" height="1" fill="#5a3a22" />
      <rect x="16" y="13" width="1" height="2" fill="#c2b794" />
      <rect x="19" y="13" width="1" height="2" fill="#d4c8a8" />
      <rect x="22" y="13" width="1" height="2" fill="#a89878" />

      <!-- ── Arms — wide cleaver guard ── -->
      <rect x="9" y="11" width="6" height="4" fill="#150d08" />
      <rect x="10" y="12" width="4" height="2" fill="#3a2858" />
      <rect x="10" y="12" width="2" height="1" fill="#4c3a6e" />
      <rect x="8" y="14" width="5" height="4" fill="#150d08" />
      <rect x="9" y="15" width="3" height="2" fill="#2e1e44" />
      <rect x="24" y="11" width="6" height="4" fill="#150d08" />
      <rect x="25" y="12" width="4" height="2" fill="#22143a" />
      <rect x="25" y="12" width="1" height="1" fill="#2e1e44" />
      <rect x="26" y="14" width="5" height="4" fill="#150d08" />
      <rect x="27" y="15" width="3" height="2" fill="#1f1330" />

      <!-- ── Glaive across the body — moon-edged ── -->
      <rect x="5" y="8" width="3" height="9" fill="#150d08" />
      <rect x="6" y="9" width="1" height="7" fill="#5a3a22" />
      <rect x="6" y="9" width="1" height="3" fill="#6e4a2c" />
      <!-- blade head -->
      <rect x="4" y="3" width="4" height="6" fill="#150d08" />
      <rect x="5" y="4" width="2" height="4" fill="#8a8ab4" />
      <rect x="5" y="4" width="1" height="3" fill="#c8c8ec" />
      <rect x="5" y="4" width="1" height="1" fill="#f2f2ff" />
      <!-- haft continues below -->
      <rect x="29" y="15" width="3" height="3" fill="#150d08" />
      <rect x="30" y="16" width="1" height="1" fill="#5a3a22" />

      <!-- ── Drow head — white-haired, crowned in chitin ── -->
      <rect x="14" y="1" width="11" height="9" fill="#150d08" />
      <rect x="15" y="2" width="9" height="7" fill="#2e1e44" />
      <rect x="15" y="2" width="9" height="1" fill="#3e2c58" />
      <rect x="15" y="2" width="3" height="6" fill="#3a2858" />
      <rect x="15" y="2" width="1" height="4" fill="#4c3a6e" />
      <rect x="21" y="3" width="3" height="6" fill="#22143a" />
      <!-- white hair sweep -->
      <rect x="13" y="0" width="12" height="3" fill="#150d08" />
      <rect x="14" y="1" width="10" height="2" fill="#d8cfb8" />
      <rect x="14" y="1" width="5" height="1" fill="#ece3cc" />
      <rect x="21" y="2" width="3" height="1" fill="#b8ae94" />
      <rect x="12" y="2" width="2" height="4" fill="#150d08" />
      <rect x="13" y="3" width="1" height="2" fill="#d8cfb8" />
      <!-- chitin horn-crown tips -->
      <rect x="15" y="0" width="2" height="2" fill="#150d08" />
      <rect x="22" y="0" width="2" height="2" fill="#150d08" />
      <rect x="15" y="0" width="1" height="1" fill="#3a1c34" />
      <rect x="23" y="0" width="1" height="1" fill="#2a1024" />
      <!-- red eyes — four of them now, two small above -->
      <rect x="16" y="4" width="3" height="2" fill="#180e2c" />
      <rect x="20" y="4" width="3" height="2" fill="#180e2c" />
      <rect x="16" y="4" width="2" height="1" fill="#c4303c" />
      <rect x="20" y="4" width="2" height="1" fill="#a02830" />
      <rect x="16" y="4" width="1" height="1" fill="#ff7a6a" />
      <rect x="20" y="4" width="1" height="1" fill="#e85a50" />
      <rect x="17" y="3" width="1" height="1" fill="#b53c4a" />
      <rect x="21" y="3" width="1" height="1" fill="#8c2434" />
      <!-- clenched fanged mouth -->
      <rect x="17" y="7" width="5" height="1" fill="#180e2c" />
      <rect x="17" y="7" width="1" height="1" fill="#e8e0c4" />
      <rect x="20" y="7" width="1" height="1" fill="#d4c8a8" />

      <!-- ── Venom drip from a fore-claw ── -->
      <rect x="7" y="40" width="1" height="1" fill="#6a8a3a" opacity="0.8" />
      <rect x="7" y="42" width="1" height="1" fill="#a8c478" opacity="0.5" />
    </svg>
