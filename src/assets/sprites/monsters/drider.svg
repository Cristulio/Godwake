<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 28 32"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Drider"
    >
      <!-- Drow-violet backlight + ground shadow -->
      <ellipse cx="14" cy="18" rx="14" ry="14" fill="#5a2a6a" opacity="0.08" />
      <ellipse cx="14" cy="29" rx="11" ry="1.6" fill="#000" opacity="0.42" />

      <!-- Spider legs — segmented, lit front pair -->
      <line x1="3" y1="13" x2="0" y2="9" stroke="#1a0a18" stroke-width="1" />
      <line x1="3" y1="17" x2="0" y2="14" stroke="#1a0a18" stroke-width="1" />
      <line x1="3" y1="20" x2="0" y2="22" stroke="#1a0a18" stroke-width="1" />
      <line x1="3" y1="23" x2="0" y2="27" stroke="#1a0a18" stroke-width="1" />
      <line x1="25" y1="13" x2="28" y2="9" stroke="#1a0a18" stroke-width="1" />
      <line x1="25" y1="17" x2="28" y2="14" stroke="#1a0a18" stroke-width="1" />
      <line x1="25" y1="20" x2="28" y2="22" stroke="#1a0a18" stroke-width="1" />
      <line x1="25" y1="23" x2="28" y2="27" stroke="#1a0a18" stroke-width="1" />
      <line x1="3" y1="13" x2="1" y2="10" stroke="#3a1428" stroke-width="0.4" />
      <line x1="25" y1="13" x2="27" y2="10" stroke="#2a1024" stroke-width="0.4" />
      <polygon points="0,9 -1,7 1,9" fill="#1a0a18" />
      <polygon points="28,9 29,7 27,9" fill="#1a0a18" />
      <polygon points="0,27 -1,29 1,27" fill="#1a0a18" />
      <polygon points="28,27 29,29 27,27" fill="#1a0a18" />
      <polygon points="0,14 -1,12 1,14" fill="#1a0a18" />
      <polygon points="28,14 29,12 27,14" fill="#1a0a18" />
      <polygon points="0,22 -1,24 1,22" fill="#1a0a18" />
      <polygon points="28,22 29,24 27,22" fill="#1a0a18" />

      <!-- Bulbous abdomen — layered ramp -->
      <ellipse cx="14" cy="20" rx="11" ry="7" fill="#1a0a18" />
      <ellipse cx="14" cy="19" rx="10" ry="6" fill="#2a1024" />
      <ellipse cx="14" cy="17" rx="8" ry="3" fill="#3a1428" opacity="0.7" />
      <ellipse cx="12" cy="16" rx="4" ry="1.5" fill="#5a2040" opacity="0.5" />
      <!-- Crimson sigil markings -->
      <rect x="9" y="17" width="2" height="2" fill="#b53c4a" opacity="0.65" />
      <rect x="17" y="17" width="2" height="2" fill="#b53c4a" opacity="0.65" />
      <rect x="13" y="19" width="2" height="2" fill="#b53c4a" opacity="0.6" />
      <rect x="13" y="19" width="1" height="1" fill="#f47a5a" opacity="0.6" />

      <!-- Cephalothorax joint -->
      <rect x="6" y="10" width="3" height="3" fill="#3a2858" />
      <rect x="19" y="10" width="3" height="3" fill="#2a1a48" />

      <!-- Drow torso — violet ramp, key light upper-left -->
      <rect x="9" y="8" width="10" height="6" fill="#2a1a48" />
      <rect x="9" y="8" width="10" height="1" fill="#1a0a28" />
      <rect x="9" y="8" width="2" height="6" fill="#3a2858" />
      <rect x="9" y="8" width="1" height="4" fill="#4a3868" />
      <rect x="18" y="8" width="1" height="6" fill="#150820" />
      <rect x="11" y="10" width="6" height="3" fill="#5a4858" />
      <rect x="11" y="10" width="6" height="1" fill="#6a5868" />

      <!-- Arms + bone hands -->
      <rect x="6" y="10" width="3" height="3" fill="#5a4858" />
      <rect x="6" y="10" width="3" height="1" fill="#6a5868" />
      <rect x="19" y="10" width="3" height="3" fill="#3a2858" />
      <rect x="4" y="13" width="3" height="2" fill="#c2b794" />
      <rect x="4" y="13" width="3" height="1" fill="#e8e0c4" />
      <rect x="21" y="13" width="3" height="2" fill="#a89878" />
      <rect x="21" y="13" width="3" height="1" fill="#c2b794" />

      <!-- White-haired head — bone ramp -->
      <rect x="11" y="1" width="6" height="2" fill="#c2b794" />
      <rect x="10" y="3" width="8" height="3" fill="#c2b794" />
      <rect x="10" y="3" width="8" height="1" fill="#e8e0c4" />
      <rect x="10" y="3" width="2" height="3" fill="#e8e0c4" />
      <rect x="16" y="3" width="2" height="3" fill="#a89878" />
      <rect x="11" y="6" width="6" height="2" fill="#3a2858" />
      <rect x="11" y="6" width="6" height="1" fill="#2a1a48" />
      <!-- Red eyes + amber spark -->
      <rect x="11" y="6" width="2" height="1" fill="#b53c4a" />
      <rect x="15" y="6" width="2" height="1" fill="#b53c4a" />
      <rect x="11" y="6" width="1" height="1" fill="#f4d042" />
      <rect x="15" y="6" width="1" height="1" fill="#f4d042" />
    </svg>
