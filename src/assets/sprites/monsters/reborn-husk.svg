<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 40"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Reborn Husk"
    >
      <!-- bowed grey head -->
      <rect x="8" y="3" width="8" height="7" fill="#9a958c" />
      <rect x="8" y="3" width="8" height="1" fill="#7a756c" />
      <rect x="8" y="5" width="2" height="2" fill="#1a2024" />
      <rect x="14" y="5" width="2" height="2" fill="#1a2024" />
      <rect x="9" y="5" width="1" height="1" fill="#a4e8e0" />
      <rect x="15" y="5" width="1" height="1" fill="#a4e8e0" />
      <rect x="10" y="8" width="4" height="1" fill="#5a554c" />

      <!-- cold-light stitch at the throat -->
      <rect x="7" y="10" width="10" height="1" fill="#7ad8c8" opacity="0.85" />

      <!-- hunched torso, ash skin -->
      <rect x="6" y="11" width="12" height="13" fill="#7a756c" />
      <rect x="6" y="11" width="12" height="1" fill="#5a554c" />
      <rect x="9" y="13" width="6" height="9" fill="#8a857c" />
      <rect x="10" y="15" width="1" height="6" fill="#7ad8c8" opacity="0.5" />

      <!-- reaching arms -->
      <rect x="3" y="13" width="3" height="3" fill="#7a756c" />
      <rect x="1" y="15" width="3" height="3" fill="#7a756c" />
      <rect x="0" y="17" width="3" height="2" fill="#9a958c" />
      <rect x="18" y="13" width="3" height="3" fill="#7a756c" />
      <rect x="20" y="15" width="3" height="3" fill="#7a756c" />
      <rect x="21" y="17" width="3" height="2" fill="#9a958c" />
      <!-- stitched wrists -->
      <rect x="0" y="16" width="3" height="1" fill="#7ad8c8" opacity="0.7" />
      <rect x="21" y="16" width="3" height="1" fill="#7ad8c8" opacity="0.7" />

      <!-- ragged legs -->
      <rect x="6" y="24" width="12" height="2" fill="#5a554c" />
      <rect x="6" y="26" width="5" height="10" fill="#6a655c" />
      <rect x="13" y="26" width="5" height="10" fill="#6a655c" />
      <rect x="9" y="28" width="1" height="6" fill="#7ad8c8" opacity="0.4" />

      <rect x="6" y="36" width="5" height="3" fill="#1a1410" />
      <rect x="13" y="36" width="5" height="3" fill="#1a1410" />
    </svg>
