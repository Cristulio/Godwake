<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 32"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Bodhi's Spawn"
    >
      <!-- Cold blood backlight + ground shadow -->
      <ellipse cx="12" cy="15" rx="11" ry="14" fill="#5a1018" opacity="0.12" />
      <ellipse cx="12" cy="29" rx="9" ry="2.2" fill="#1a0a10" opacity="0.4" />

      <!-- Gaunt head — pale ramp, key light upper-left -->
      <rect x="8" y="3" width="8" height="9" fill="#b8acac" />
      <rect x="8" y="3" width="8" height="1" fill="#e8e2e2" />
      <rect x="8" y="3" width="3" height="8" fill="#cabfbf" />
      <rect x="8" y="3" width="1" height="6" fill="#e8e2e2" />
      <rect x="14" y="4" width="2" height="7" fill="#8e8284" />
      <rect x="8" y="11" width="8" height="1" fill="#7a6e70" />
      <polygon points="8,3 9,1 11,3" fill="#cabfbf" />
      <polygon points="16,3 15,1 13,3" fill="#8e8284" />
      <!-- Sunken eyes — blood glow + spark -->
      <rect x="9" y="6" width="2" height="2" fill="#3a0810" />
      <rect x="13" y="6" width="2" height="2" fill="#3a0810" />
      <rect x="9" y="6" width="2" height="1" fill="#8a1820" />
      <rect x="13" y="6" width="2" height="1" fill="#8a1820" />
      <rect x="9" y="6" width="1" height="1" fill="#f04040" />
      <rect x="13" y="6" width="1" height="1" fill="#f04040" />
      <rect x="9" y="7" width="1" height="1" fill="#ff8060" opacity="0.7" />
      <!-- Bloodied fanged mouth -->
      <rect x="10" y="9" width="4" height="2" fill="#3a060c" />
      <rect x="10" y="9" width="1" height="2" fill="#e8e2e2" />
      <rect x="13" y="9" width="1" height="2" fill="#d8d0d0" />
      <rect x="11" y="10" width="2" height="1" fill="#5a0c12" />

      <!-- Torso robe — dark blood ramp + dither -->
      <rect x="8" y="12" width="8" height="13" fill="#220e16" />
      <rect x="8" y="12" width="8" height="1" fill="#3c1822" />
      <rect x="8" y="12" width="2" height="12" fill="#2a1018" />
      <rect x="14" y="13" width="2" height="11" fill="#160810" />
      <polygon points="8,12 16,12 18,25 6,25" fill="#1e0c12" opacity="0.6" />
      <rect x="11" y="13" width="2" height="11" fill="#4a1c28" opacity="0.6" />
      <rect x="9" y="15" width="6" height="1" fill="#6a2030" opacity="0.5" />
      <rect x="10" y="19" width="1" height="1" fill="#4a1c28" />
      <rect x="13" y="21" width="1" height="1" fill="#160810" />

      <!-- Reaching claw-arms — pale ramp + clawed tips -->
      <rect x="4" y="13" width="4" height="2" fill="#cabfbf" />
      <rect x="4" y="13" width="4" height="1" fill="#e8e2e2" />
      <polygon points="2,12 4,14 1,16" fill="#cabfbf" />
      <polygon points="2,12 4,14 2,15" fill="#e8e2e2" opacity="0.6" />
      <rect x="1" y="15" width="2" height="1" fill="#8a1820" />
      <rect x="16" y="13" width="4" height="2" fill="#b8acac" />
      <rect x="16" y="13" width="4" height="1" fill="#d8d0d0" />
      <polygon points="22,12 20,14 23,16" fill="#b8acac" />
      <rect x="21" y="15" width="2" height="1" fill="#8a1820" />

      <!-- Ragged hem -->
      <polygon points="6,25 7,31 9,25" fill="#160810" />
      <polygon points="6,25 7,30 8,25" fill="#2a1018" opacity="0.7" />
      <polygon points="11,25 12,32 13,25" fill="#220e16" />
      <polygon points="15,25 17,31 18,25" fill="#160810" />
      <rect x="3" y="20" width="1" height="1" fill="#8a1820" opacity="0.6" />
      <rect x="20" y="22" width="1" height="1" fill="#8a1820" opacity="0.6" />
    </svg>
