<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 40"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Velora's Spawn"
    >
      <!-- Cold under-root backlight + low crouched shadow -->
      <ellipse cx="15" cy="24" rx="14" ry="14" fill="#58525c" opacity="0.08" />
      <ellipse cx="15" cy="38.4" rx="11" ry="1.6" fill="#000" opacity="0.42" />

      <!-- Head — thrust forward of the shoulders, all appetite -->
      <rect x="15" y="4" width="11" height="10" fill="#150d08" />
      <rect x="16" y="5" width="9" height="8" fill="#cdc0b0" />
      <rect x="16" y="5" width="9" height="1" fill="#e2d8c8" />
      <rect x="16" y="5" width="4" height="1" fill="#f0e8da" />
      <rect x="16" y="5" width="1" height="6" fill="#dcd2c2" />
      <rect x="23" y="6" width="2" height="7" fill="#a89884" />
      <rect x="24" y="7" width="1" height="6" fill="#8a7c68" />
      <!-- lank hair fallen over the brow -->
      <rect x="15" y="3" width="9" height="2" fill="#150d08" />
      <rect x="16" y="4" width="7" height="1" fill="#2e2a32" />
      <rect x="16" y="4" width="3" height="1" fill="#3a363e" />
      <rect x="15" y="5" width="1" height="4" fill="#2e2a32" />
      <!-- eyes — feeding-red, sunk deep -->
      <rect x="17" y="7" width="3" height="2" fill="#1a0e12" />
      <rect x="21" y="7" width="3" height="2" fill="#1a0e12" />
      <rect x="18" y="7" width="2" height="1" fill="#c83a3a" />
      <rect x="22" y="7" width="2" height="1" fill="#c83a3a" />
      <rect x="18" y="7" width="1" height="1" fill="#ff7a6a" />
      <rect x="22" y="7" width="1" height="1" fill="#ff7a6a" />
      <!-- the mouth — open on fangs, blood-dark -->
      <rect x="17" y="10" width="7" height="3" fill="#150d08" />
      <rect x="18" y="11" width="5" height="2" fill="#531320" />
      <rect x="18" y="11" width="3" height="1" fill="#7e1f2c" />
      <!-- fangs -->
      <rect x="18" y="11" width="1" height="1" fill="#f0e8da" />
      <rect x="21" y="11" width="1" height="1" fill="#f0e8da" />
      <rect x="19" y="12" width="1" height="1" fill="#e2d8c8" />
      <!-- blood run at the lip -->
      <rect x="22" y="12" width="1" height="2" fill="#7e1f2c" />

      <!-- Hunched spine — the crouch carries the whole figure -->
      <rect x="6" y="6" width="11" height="14" fill="#150d08" />
      <rect x="7" y="7" width="9" height="12" fill="#3a363e" />
      <rect x="7" y="7" width="9" height="1" fill="#4e4854" />
      <rect x="7" y="7" width="4" height="1" fill="#5e5864" />
      <rect x="7" y="7" width="2" height="10" fill="#46404c" />
      <rect x="14" y="8" width="2" height="11" fill="#2e2a32" />
      <!-- spine knuckles showing through the rag-shirt -->
      <rect x="8" y="6" width="2" height="1" fill="#cdc0b0" />
      <rect x="11" y="5" width="2" height="2" fill="#150d08" />
      <rect x="11" y="6" width="2" height="1" fill="#b4a692" />
      <!-- the rags of whoever it last fed on -->
      <rect x="8" y="10" width="7" height="1" fill="#531320" />
      <rect x="8" y="10" width="3" height="1" fill="#67192a" />
      <rect x="9" y="14" width="5" height="1" fill="#2c1a40" />
      <rect x="10" y="16" width="2" height="2" fill="#221e26" />
      <!-- torn hem flapping -->
      <rect x="7" y="18" width="3" height="2" fill="#2e2a32" />
      <rect x="12" y="18" width="2" height="2" fill="#262229" />

      <!-- Feeding arm — reaching long, claws spread -->
      <rect x="16" y="14" width="7" height="4" fill="#150d08" />
      <rect x="17" y="15" width="5" height="2" fill="#cdc0b0" />
      <rect x="17" y="15" width="5" height="1" fill="#dcd2c2" />
      <rect x="21" y="16" width="5" height="4" fill="#150d08" />
      <rect x="22" y="17" width="3" height="2" fill="#b4a692" />
      <rect x="22" y="17" width="2" height="1" fill="#cdc0b0" />
      <!-- claws — too long for the fingers -->
      <rect x="25" y="16" width="3" height="1" fill="#150d08" />
      <rect x="26" y="16" width="2" height="1" fill="#e2d8c8" />
      <rect x="25" y="18" width="4" height="1" fill="#150d08" />
      <rect x="26" y="18" width="3" height="1" fill="#f0e8da" />
      <rect x="25" y="20" width="3" height="1" fill="#150d08" />
      <rect x="26" y="20" width="2" height="1" fill="#e2d8c8" />

      <!-- Off arm braced on the ground — it runs on all fours when it runs -->
      <rect x="4" y="18" width="4" height="10" fill="#150d08" />
      <rect x="5" y="19" width="2" height="8" fill="#b4a692" />
      <rect x="5" y="19" width="1" height="8" fill="#cdc0b0" />
      <rect x="3" y="27" width="5" height="3" fill="#150d08" />
      <rect x="4" y="28" width="3" height="1" fill="#cdc0b0" />
      <!-- ground claws -->
      <rect x="2" y="29" width="2" height="1" fill="#150d08" />
      <rect x="2" y="29" width="1" height="1" fill="#e2d8c8" />
      <rect x="5" y="30" width="1" height="1" fill="#e2d8c8" />
      <rect x="7" y="30" width="1" height="1" fill="#dcd2c2" />

      <!-- Haunches folded under — sprung, not standing -->
      <rect x="7" y="20" width="10" height="9" fill="#150d08" />
      <rect x="8" y="21" width="8" height="7" fill="#332f37" />
      <rect x="8" y="21" width="8" height="1" fill="#423d49" />
      <rect x="8" y="21" width="3" height="1" fill="#4e4854" />
      <rect x="8" y="21" width="1" height="5" fill="#3e3a44" />
      <rect x="14" y="22" width="2" height="6" fill="#28242c" />
      <!-- knee bone through the torn breeches -->
      <rect x="14" y="21" width="3" height="3" fill="#150d08" />
      <rect x="15" y="22" width="1" height="1" fill="#cdc0b0" />
      <!-- shin folded back to the ground -->
      <rect x="10" y="28" width="9" height="4" fill="#150d08" />
      <rect x="11" y="29" width="7" height="2" fill="#2e2a32" />
      <rect x="11" y="29" width="3" height="1" fill="#3a363e" />
      <!-- bare foot, toes splayed -->
      <rect x="16" y="31" width="6" height="3" fill="#150d08" />
      <rect x="17" y="32" width="4" height="1" fill="#b4a692" />
      <rect x="17" y="32" width="2" height="1" fill="#cdc0b0" />
      <rect x="21" y="33" width="1" height="1" fill="#e2d8c8" />
      <!-- trailing leg stretched behind -->
      <rect x="5" y="30" width="8" height="4" fill="#150d08" />
      <rect x="6" y="31" width="6" height="2" fill="#28242c" />
      <rect x="6" y="31" width="2" height="1" fill="#332f37" />
      <rect x="6" y="34" width="4" height="2" fill="#150d08" />
      <rect x="7" y="34" width="2" height="1" fill="#b4a692" />

      <!-- Grave-cold coming off it -->
      <rect x="26" y="10" width="1" height="1" fill="#8fb8c0" opacity="0.35" />
      <rect x="3" y="14" width="1" height="1" fill="#9a949e" opacity="0.4" />
      <rect x="24" y="24" width="1" height="1" fill="#8fb8c0" opacity="0.3" />
    </svg>
