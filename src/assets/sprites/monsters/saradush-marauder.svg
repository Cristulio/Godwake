<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 34 44"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Saradush Marauder"
    >
      <!-- Warm raid-fire backlight + ground shadow -->
      <ellipse cx="17" cy="24" rx="14" ry="20" fill="#a85a20" opacity="0.07" />
      <ellipse cx="17" cy="42" rx="11" ry="2" fill="#000" opacity="0.42" />

      <!-- Head — tan ramp, key upper-left -->
      <rect x="13" y="4" width="9" height="9" fill="#7a5234" />
      <rect x="13" y="4" width="9" height="2" fill="#8f6240" />
      <rect x="13" y="4" width="3" height="9" fill="#9a6c48" />
      <rect x="13" y="4" width="1" height="6" fill="#ad7c54" />
      <rect x="20" y="5" width="2" height="8" fill="#5e3e26" />
      <rect x="14" y="7" width="2" height="2" fill="#0c0804" />
      <rect x="19" y="7" width="2" height="2" fill="#0c0804" />
      <rect x="14" y="7" width="1" height="1" fill="#e88a52" opacity="0.6" />
      <rect x="15" y="10" width="5" height="1" fill="#a83a14" opacity="0.6" />
      <!-- Red headband -->
      <rect x="12" y="3" width="11" height="2" fill="#3a2a1a" />
      <rect x="13" y="3" width="9" height="1" fill="#a83a14" />

      <!-- Leather cuirass — ramp + straps + dither -->
      <rect x="10" y="13" width="15" height="16" fill="#46362a" />
      <rect x="10" y="13" width="15" height="2" fill="#5a4636" />
      <rect x="10" y="13" width="3" height="16" fill="#5a4636" />
      <rect x="10" y="13" width="1" height="16" fill="#6a5440" />
      <rect x="23" y="13" width="2" height="16" fill="#2e241a" />
      <rect x="12" y="15" width="11" height="11" fill="#2e241a" />
      <rect x="13" y="17" width="9" height="1" fill="#6a4a2a" opacity="0.6" />
      <rect x="13" y="21" width="9" height="1" fill="#6a4a2a" opacity="0.5" />
      <rect x="11" y="14" width="1" height="13" fill="#6a5440" opacity="0.6" />
      <rect x="15" y="19" width="1" height="1" fill="#46362a" />
      <rect x="20" y="23" width="1" height="1" fill="#241a12" />

      <!-- Shoulders + bare skin band -->
      <rect x="6" y="14" width="4" height="11" fill="#46362a" />
      <rect x="6" y="14" width="4" height="1" fill="#5a4636" />
      <rect x="25" y="14" width="4" height="11" fill="#46362a" />
      <rect x="25" y="14" width="1" height="11" fill="#2e241a" />
      <rect x="6" y="23" width="4" height="3" fill="#caa070" opacity="0.85" />
      <rect x="6" y="23" width="4" height="1" fill="#dab488" opacity="0.7" />

      <!-- Great axe — haft ramp + steel head + specular -->
      <rect x="2" y="6" width="3" height="22" fill="#5a4030" />
      <rect x="2" y="6" width="1" height="22" fill="#6a4e3a" />
      <polygon points="0,6 7,6 7,1 2,1" fill="#9aa6b0" />
      <polygon points="0,6 7,6 7,9 2,9" fill="#6a7680" />
      <polygon points="0,6 7,6 7,3 1,3" fill="#bcc8d2" opacity="0.6" />
      <rect x="2" y="1" width="5" height="1" fill="#c6d2dc" />
      <rect x="1" y="3" width="2" height="2" fill="#e8f0f8" opacity="0.8" />

      <!-- Legs + boots -->
      <rect x="11" y="29" width="5" height="11" fill="#2e241a" />
      <rect x="19" y="29" width="5" height="11" fill="#2e241a" />
      <rect x="11" y="29" width="1" height="11" fill="#3e2e20" />
      <rect x="19" y="29" width="1" height="11" fill="#3e2e20" />
      <rect x="13" y="31" width="1" height="6" fill="#46362a" opacity="0.5" />
      <rect x="10" y="38" width="7" height="3" fill="#140c08" />
      <rect x="19" y="38" width="7" height="3" fill="#140c08" />
      <rect x="10" y="38" width="7" height="1" fill="#241a12" />
    </svg>
