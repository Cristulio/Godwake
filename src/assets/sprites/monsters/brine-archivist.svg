<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 34"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Brine-Archivist"
    >
      <!-- Cold tidal backlight + ground shadow -->
      <ellipse cx="12" cy="17" rx="11" ry="15" fill="#3a8278" opacity="0.08" />
      <ellipse cx="12" cy="33" rx="8" ry="1.4" fill="#000" opacity="0.4" />

      <!-- Conical hood — teal ramp, key upper-left -->
      <polygon points="12,1 18,9 6,9" fill="#2a4a48" />
      <polygon points="12,1 14,9 6,9" fill="#34605c" />
      <polygon points="12,1 12,9 7,9" fill="#3e706a" />
      <polygon points="12,1 18,9 14,9" fill="#16302e" />
      <polygon points="12,1 13,4 12,5" fill="#4a807a" />

      <!-- Shadowed face + cold eyes -->
      <rect x="10" y="6" width="4" height="3" fill="#0e1e1e" />
      <rect x="10" y="6" width="1" height="2" fill="#8ad0c8" />
      <rect x="13" y="6" width="1" height="2" fill="#8ad0c8" />
      <rect x="10" y="6" width="1" height="1" fill="#d4f4ee" opacity="0.7" />

      <!-- Robe body — teal ramp + lit center fold -->
      <rect x="5" y="9" width="14" height="17" fill="#234240" />
      <rect x="5" y="9" width="14" height="1" fill="#34605c" />
      <rect x="11" y="10" width="2" height="16" fill="#3e706a" />
      <rect x="11" y="10" width="1" height="16" fill="#4a807a" />
      <rect x="5" y="9" width="2" height="16" fill="#2a4a48" />
      <rect x="5" y="9" width="1" height="16" fill="#34605c" />
      <rect x="17" y="10" width="2" height="15" fill="#16302e" />
      <rect x="18" y="10" width="1" height="15" fill="#102422" />
      <!-- Wet sheen + dither -->
      <rect x="7" y="12" width="6" height="1" fill="#a8c0b8" opacity="0.4" />
      <rect x="8" y="18" width="8" height="1" fill="#a8c0b8" opacity="0.32" />
      <rect x="9" y="15" width="1" height="1" fill="#34605c" />
      <rect x="15" y="21" width="1" height="1" fill="#16302e" />

      <!-- Right arm + pale webbed hand -->
      <rect x="18" y="13" width="3" height="9" fill="#234240" />
      <rect x="18" y="13" width="1" height="9" fill="#2a4a48" />
      <rect x="20" y="13" width="1" height="9" fill="#16302e" />
      <rect x="20" y="20" width="3" height="2" fill="#a8b8b0" />
      <rect x="21" y="21" width="2" height="2" fill="#c0ccc4" />
      <rect x="21" y="21" width="1" height="1" fill="#e0e8e0" />

      <!-- Left arm + bronze tally beads -->
      <rect x="3" y="13" width="3" height="2" fill="#234240" />
      <rect x="3" y="13" width="3" height="1" fill="#34605c" />
      <line x1="3" y1="15" x2="4" y2="23" stroke="#6a5020" stroke-width="0.6" />
      <circle cx="3" cy="16" r="1.5" fill="#8a6a2a" />
      <circle cx="3" cy="16" r="0.7" fill="#c8a850" />
      <circle cx="3" cy="19" r="1.5" fill="#8a6a2a" />
      <circle cx="3" cy="19" r="0.7" fill="#b08840" />
      <circle cx="4" cy="22" r="1.5" fill="#b08840" />
      <circle cx="4" cy="22" r="0.7" fill="#e0c060" />

      <!-- Robe hem + webbed feet -->
      <rect x="5" y="26" width="14" height="2" fill="#16302e" />
      <rect x="5" y="26" width="14" height="1" fill="#234240" />
      <polygon points="5,28 7,32 9,28" fill="#2a4a48" />
      <polygon points="5,28 6,32 9,28" fill="#34605c" />
      <polygon points="9,28 11,32 13,28" fill="#234240" />
      <polygon points="13,28 15,32 17,28" fill="#1e3a38" />
      <rect x="8" y="32" width="3" height="2" fill="#0e1e1e" />
      <rect x="13" y="32" width="3" height="2" fill="#0e1e1e" />
    </svg>
