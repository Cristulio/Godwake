<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 22 36"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Drow Warrior"
    >
      <!-- Faerzress backlight + ground shadow -->
      <ellipse cx="11" cy="18" rx="11" ry="17" fill="#7a5ec0" opacity="0.08" />
      <ellipse cx="11" cy="35" rx="8" ry="1.4" fill="#000" opacity="0.42" />

      <!-- White hair — pale ramp, key light upper-left -->
      <rect x="6" y="0" width="10" height="2" fill="#c8c0d0" />
      <rect x="6" y="0" width="10" height="1" fill="#e8e0f0" />
      <rect x="5" y="2" width="12" height="3" fill="#c8c0d0" />
      <rect x="5" y="2" width="12" height="1" fill="#ffffff" />
      <rect x="5" y="2" width="2" height="3" fill="#e8e0f0" />
      <rect x="15" y="2" width="2" height="3" fill="#a89cb8" />

      <!-- Face — dark elf skin ramp -->
      <rect x="6" y="5" width="10" height="5" fill="#5a4858" />
      <rect x="6" y="5" width="3" height="5" fill="#6a5868" />
      <rect x="6" y="5" width="1" height="4" fill="#7e6c7e" />
      <rect x="14" y="5" width="2" height="5" fill="#3a2838" />
      <rect x="5" y="6" width="1" height="4" fill="#2a2030" />
      <rect x="16" y="6" width="1" height="4" fill="#2a2030" />

      <!-- Burning eyes — red iris, gold core -->
      <rect x="8" y="7" width="2" height="1" fill="#b53c4a" />
      <rect x="12" y="7" width="2" height="1" fill="#b53c4a" />
      <rect x="9" y="7" width="1" height="1" fill="#f4d042" />
      <rect x="13" y="7" width="1" height="1" fill="#f4d042" />
      <rect x="8" y="6" width="2" height="1" fill="#2a2030" opacity="0.6" />
      <rect x="12" y="6" width="2" height="1" fill="#2a2030" opacity="0.6" />
      <rect x="10" y="9" width="2" height="1" fill="#3a2838" />

      <!-- Pauldrons — armour ramp -->
      <rect x="4" y="10" width="14" height="3" fill="#2a1a48" />
      <rect x="4" y="10" width="14" height="1" fill="#4a3868" />
      <rect x="4" y="10" width="2" height="3" fill="#1a0a28" />
      <rect x="16" y="10" width="2" height="3" fill="#1a0a28" />
      <rect x="5" y="10" width="2" height="1" fill="#6a5488" />

      <!-- Cuirass — purple ramp + spider emblem -->
      <rect x="5" y="13" width="12" height="8" fill="#2a1a48" />
      <rect x="5" y="13" width="12" height="1" fill="#4a3868" />
      <rect x="5" y="13" width="2" height="7" fill="#3a2858" />
      <rect x="5" y="13" width="1" height="7" fill="#4a3868" />
      <rect x="15" y="13" width="2" height="7" fill="#1a0a28" />
      <rect x="6" y="14" width="9" height="6" fill="#3a2858" />
      <rect x="7" y="15" width="1" height="1" fill="#4a3868" opacity="0.6" />
      <rect x="13" y="17" width="1" height="1" fill="#1a0a28" />
      <!-- Spider sigil -->
      <rect x="10" y="15" width="2" height="5" fill="#a48ee0" />
      <rect x="9" y="16" width="4" height="2" fill="#a48ee0" />
      <rect x="10" y="15" width="1" height="1" fill="#e8d4ff" />

      <!-- Belt + buckle -->
      <rect x="5" y="20" width="12" height="2" fill="#1a0a28" />
      <rect x="10" y="20" width="2" height="2" fill="#d4b062" />
      <rect x="10" y="20" width="1" height="1" fill="#f4d042" />

      <!-- Left arm + dagger -->
      <rect x="3" y="11" width="2" height="6" fill="#5a4858" />
      <rect x="3" y="11" width="1" height="6" fill="#6a5868" />
      <rect x="2" y="16" width="3" height="2" fill="#6a5868" />
      <rect x="2" y="16" width="3" height="1" fill="#7e6c7e" />
      <rect x="0" y="13" width="3" height="2" fill="#5a3a20" />
      <rect x="0" y="13" width="3" height="1" fill="#7a5230" />
      <rect x="-1" y="13" width="1" height="1" fill="#3a2418" />
      <rect x="0" y="5" width="2" height="8" fill="#8a91a4" />
      <rect x="0" y="5" width="1" height="8" fill="#d4dcec" />
      <rect x="0" y="5" width="1" height="2" fill="#ffffff" />
      <rect x="-1" y="3" width="4" height="2" fill="#d4b062" />
      <rect x="-1" y="3" width="4" height="1" fill="#f4d042" />

      <!-- Right arm + longsword -->
      <rect x="17" y="11" width="2" height="6" fill="#5a4858" />
      <rect x="18" y="11" width="1" height="6" fill="#3a2838" />
      <rect x="17" y="16" width="3" height="2" fill="#6a5868" />
      <rect x="17" y="16" width="3" height="1" fill="#7e6c7e" />
      <rect x="20" y="9" width="3" height="14" fill="#8a91a4" />
      <rect x="21" y="9" width="1" height="14" fill="#d4dcec" />
      <rect x="21" y="10" width="1" height="3" fill="#ffffff" />
      <rect x="20" y="9" width="1" height="14" fill="#5a627a" />
      <polygon points="20,9 24,11 23,13 19,11" fill="#6a5488" />
      <rect x="20" y="20" width="3" height="3" fill="#1a0a28" />

      <!-- Legs — armour ramp -->
      <rect x="5" y="22" width="12" height="2" fill="#1a0a28" />
      <rect x="6" y="24" width="3" height="6" fill="#2a1a48" />
      <rect x="13" y="24" width="3" height="6" fill="#2a1a48" />
      <rect x="6" y="24" width="1" height="6" fill="#3a2858" />
      <rect x="13" y="24" width="1" height="6" fill="#3a2858" />
      <rect x="8" y="24" width="1" height="6" fill="#1a0a28" />
      <rect x="15" y="24" width="1" height="6" fill="#1a0a28" />

      <!-- Boots -->
      <rect x="6" y="30" width="3" height="4" fill="#3a2418" />
      <rect x="13" y="30" width="3" height="4" fill="#3a2418" />
      <rect x="6" y="30" width="3" height="1" fill="#5a3a20" />
      <rect x="13" y="30" width="3" height="1" fill="#5a3a20" />
      <rect x="5" y="34" width="4" height="2" fill="#1a1410" />
      <rect x="13" y="34" width="4" height="2" fill="#1a1410" />
    </svg>
