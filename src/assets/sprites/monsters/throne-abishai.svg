<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 40"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Throne Abishai"
    >
      <!-- Infernal backlight + ground shadow -->
      <ellipse cx="16" cy="20" rx="15" ry="18" fill="#5a1010" opacity="0.18" />
      <ellipse cx="16" cy="20" rx="9" ry="13" fill="#c0301a" opacity="0.1" />
      <ellipse cx="16" cy="38" rx="11" ry="1.8" fill="#1a0610" opacity="0.45" />

      <!-- Wings — membrane ramp + barbs -->
      <polygon points="9,12 1,8 3,20 9,24" fill="#3a0a10" opacity="0.92" />
      <polygon points="9,13 3,10 5,19 9,22" fill="#5a1208" opacity="0.85" />
      <polygon points="9,13 4,11 6,18 9,20" fill="#7a201a" opacity="0.6" />
      <polygon points="23,12 31,8 29,20 23,24" fill="#3a0a10" opacity="0.92" />
      <polygon points="23,13 29,10 27,19 23,22" fill="#5a1208" opacity="0.85" />
      <polygon points="23,13 28,11 26,18 23,20" fill="#7a201a" opacity="0.6" />
      <rect x="2" y="9" width="1" height="1" fill="#8c2010" />
      <rect x="29" y="9" width="1" height="1" fill="#8c2010" />

      <!-- Horned head — red ramp, key upper-left, molten eyes -->
      <rect x="12" y="3" width="8" height="9" fill="#7a1810" />
      <rect x="12" y="3" width="8" height="1" fill="#9a2818" />
      <rect x="12" y="3" width="2" height="9" fill="#8c2010" />
      <rect x="12" y="3" width="1" height="5" fill="#a02c1c" />
      <rect x="18" y="3" width="2" height="9" fill="#4a0e0a" />
      <polygon points="12,3 11,-1 14,2" fill="#5a1208" />
      <polygon points="12,3 12,0 13,2" fill="#7a201a" />
      <polygon points="20,3 21,-1 18,2" fill="#5a1208" />
      <rect x="13" y="6" width="2" height="2" fill="#f4d042" />
      <rect x="17" y="6" width="2" height="2" fill="#f4d042" />
      <rect x="13" y="6" width="1" height="1" fill="#fff0b0" />
      <rect x="17" y="6" width="1" height="1" fill="#fff0b0" />
      <rect x="15" y="9" width="2" height="1" fill="#3a0a08" />

      <!-- Torso — red ramp + dither -->
      <rect x="10" y="12" width="12" height="16" fill="#6a140e" />
      <rect x="10" y="12" width="12" height="1" fill="#8c2010" />
      <rect x="10" y="12" width="2" height="16" fill="#7a1810" />
      <rect x="10" y="12" width="1" height="9" fill="#9a2818" opacity="0.7" />
      <rect x="20" y="12" width="2" height="16" fill="#4a0e0a" />
      <rect x="15" y="13" width="2" height="14" fill="#4a0e0a" />
      <rect x="11" y="15" width="10" height="1" fill="#3a0a08" opacity="0.6" />
      <rect x="11" y="20" width="10" height="1" fill="#3a0a08" opacity="0.6" />
      <rect x="13" y="17" width="1" height="1" fill="#9a2818" opacity="0.6" />
      <rect x="18" y="23" width="1" height="1" fill="#4a0e0a" />

      <!-- Right arm + barbed tail -->
      <rect x="22" y="14" width="2" height="2" fill="#6a140e" />
      <rect x="24" y="15" width="2" height="2" fill="#5a1208" />
      <rect x="26" y="13" width="1" height="10" fill="#2a1810" />
      <rect x="25" y="22" width="3" height="1" fill="#3a0a08" />
      <rect x="27" y="24" width="3" height="1" fill="#3a0a08" />
      <rect x="24" y="20" width="2" height="1" fill="#3a0a08" />
      <rect x="29" y="22" width="1" height="1" fill="#8c2010" />
      <rect x="28" y="25" width="1" height="1" fill="#8c2010" />

      <!-- Legs + cloven feet -->
      <rect x="11" y="28" width="4" height="9" fill="#5a1208" />
      <rect x="17" y="28" width="4" height="9" fill="#5a1208" />
      <rect x="11" y="28" width="1" height="9" fill="#7a1810" />
      <rect x="20" y="28" width="1" height="9" fill="#3a0a08" />
      <polygon points="9,37 15,37 14,40 10,40" fill="#3a0a08" />
      <polygon points="17,37 23,37 22,40 18,40" fill="#3a0a08" />
    </svg>
