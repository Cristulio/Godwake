<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 36 44"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Throne Abishai"
    >
      <!-- Empty-throne gloom backlight + ground shadow -->
      <ellipse cx="17" cy="24" rx="16" ry="18" fill="#a82a20" opacity="0.05" />
      <ellipse cx="16" cy="42.4" rx="11" ry="1.7" fill="#000" opacity="0.42" />

      <!-- Wings — black-scaled, held in court order, not rage -->
      <rect x="1" y="2" width="10" height="3" fill="#150d08" />
      <rect x="2" y="3" width="8" height="1" fill="#241016" />
      <rect x="2" y="3" width="4" height="1" fill="#2e161c" />
      <rect x="0" y="4" width="5" height="13" fill="#150d08" />
      <rect x="1" y="5" width="3" height="11" fill="#1c0c10" />
      <rect x="1" y="5" width="1" height="11" fill="#241016" />
      <!-- membrane folds -->
      <rect x="2" y="7" width="1" height="7" fill="#140609" />
      <rect x="3" y="9" width="1" height="5" fill="#1c0c10" />
      <!-- wing spur -->
      <rect x="0" y="16" width="2" height="2" fill="#150d08" />
      <rect x="0" y="16" width="1" height="1" fill="#c8b8a8" />
      <rect x="25" y="1" width="10" height="3" fill="#150d08" />
      <rect x="26" y="2" width="8" height="1" fill="#1c0c10" />
      <rect x="31" y="3" width="5" height="12" fill="#150d08" />
      <rect x="32" y="4" width="3" height="10" fill="#140609" />
      <rect x="32" y="4" width="1" height="10" fill="#1c0c10" />
      <rect x="33" y="6" width="1" height="6" fill="#0e0406" />
      <rect x="34" y="14" width="2" height="2" fill="#150d08" />
      <rect x="34" y="14" width="1" height="1" fill="#b4a692" />

      <!-- Head — black draconic skull in a gold throne-circlet -->
      <rect x="11" y="2" width="13" height="11" fill="#150d08" />
      <rect x="12" y="3" width="11" height="9" fill="#2e161c" />
      <rect x="12" y="3" width="11" height="1" fill="#42202a" />
      <rect x="12" y="3" width="4" height="1" fill="#542a36" />
      <rect x="12" y="3" width="2" height="8" fill="#38181f" />
      <rect x="21" y="4" width="2" height="8" fill="#241016" />
      <rect x="22" y="5" width="1" height="7" fill="#1c0c10" />
      <!-- the gold circlet — the livery of the empty seat -->
      <rect x="12" y="4" width="11" height="1" fill="#9a7232" />
      <rect x="12" y="4" width="4" height="1" fill="#c89a48" />
      <rect x="17" y="3" width="1" height="1" fill="#ecc46a" />
      <!-- swept horns through the circlet -->
      <rect x="9" y="0" width="4" height="3" fill="#150d08" />
      <rect x="10" y="1" width="2" height="1" fill="#d4c8a8" />
      <rect x="10" y="1" width="1" height="1" fill="#f0e8da" />
      <rect x="22" y="0" width="4" height="3" fill="#150d08" />
      <rect x="23" y="1" width="2" height="1" fill="#b4a692" />
      <!-- the gaze you cannot hold — pit-red, patient -->
      <rect x="13" y="7" width="3" height="2" fill="#1a060a" />
      <rect x="19" y="7" width="3" height="2" fill="#1a060a" />
      <rect x="14" y="7" width="2" height="1" fill="#d84838" />
      <rect x="20" y="7" width="2" height="1" fill="#d84838" />
      <rect x="14" y="7" width="1" height="1" fill="#ff8a78" />
      <rect x="20" y="7" width="1" height="1" fill="#ff8a78" />
      <!-- the long muzzle, never once in doubt -->
      <rect x="14" y="10" width="7" height="3" fill="#241016" />
      <rect x="15" y="11" width="5" height="1" fill="#140609" />
      <rect x="15" y="11" width="1" height="1" fill="#d4c8a8" />
      <rect x="19" y="11" width="1" height="1" fill="#d4c8a8" />

      <!-- Torso — black scale in gold court-harness -->
      <rect x="10" y="13" width="15" height="15" fill="#150d08" />
      <rect x="11" y="14" width="13" height="13" fill="#2e161c" />
      <rect x="11" y="14" width="13" height="1" fill="#42202a" />
      <rect x="11" y="14" width="5" height="1" fill="#542a36" />
      <rect x="11" y="14" width="2" height="13" fill="#38181f" />
      <rect x="11" y="14" width="1" height="8" fill="#42202a" />
      <rect x="21" y="14" width="3" height="13" fill="#241016" />
      <rect x="23" y="14" width="1" height="13" fill="#1c0c10" />
      <!-- scale rows -->
      <rect x="12" y="17" width="11" height="1" fill="#1c0c10" />
      <rect x="12" y="20" width="11" height="1" fill="#1c0c10" />
      <rect x="12" y="23" width="11" height="1" fill="#1c0c10" />
      <rect x="13" y="17" width="2" height="1" fill="#542a36" />
      <rect x="18" y="20" width="2" height="1" fill="#542a36" />
      <!-- the gold harness of the office -->
      <rect x="11" y="15" width="2" height="2" fill="#c89a48" />
      <rect x="13" y="17" width="2" height="2" fill="#9a7232" />
      <rect x="15" y="19" width="2" height="2" fill="#c89a48" />
      <rect x="17" y="21" width="2" height="2" fill="#9a7232" />
      <rect x="19" y="23" width="2" height="2" fill="#c89a48" />
      <rect x="11" y="15" width="1" height="1" fill="#ecc46a" />
      <rect x="15" y="19" width="1" height="1" fill="#ecc46a" />
      <!-- the throne-seal hung at the chest -->
      <rect x="16" y="15" width="4" height="3" fill="#150d08" />
      <rect x="17" y="16" width="2" height="1" fill="#ecc46a" />
      <rect x="17" y="16" width="1" height="1" fill="#fff0b8" />

      <!-- Scourge arm — the barbed lash uncoiled at reach -->
      <rect x="24" y="15" width="6" height="4" fill="#150d08" />
      <rect x="25" y="16" width="4" height="2" fill="#2e161c" />
      <rect x="25" y="16" width="4" height="1" fill="#42202a" />
      <rect x="27" y="18" width="4" height="4" fill="#150d08" />
      <rect x="28" y="19" width="2" height="2" fill="#241016" />
      <rect x="28" y="19" width="1" height="1" fill="#38181f" />
      <!-- the scourge handle -->
      <rect x="29" y="21" width="2" height="3" fill="#150d08" />
      <rect x="30" y="22" width="1" height="2" fill="#6a3a1a" />
      <!-- the lash falling in a barbed curve -->
      <rect x="30" y="24" width="3" height="2" fill="#150d08" />
      <rect x="31" y="25" width="2" height="1" fill="#3a2c20" />
      <rect x="32" y="26" width="3" height="2" fill="#150d08" />
      <rect x="33" y="27" width="2" height="1" fill="#4a3a2a" />
      <rect x="33" y="28" width="3" height="3" fill="#150d08" />
      <rect x="34" y="29" width="1" height="2" fill="#3a2c20" />
      <rect x="32" y="31" width="3" height="2" fill="#150d08" />
      <rect x="33" y="32" width="1" height="1" fill="#4a3a2a" />
      <!-- the barbs -->
      <rect x="31" y="23" width="1" height="1" fill="#d4c8a8" />
      <rect x="34" y="26" width="1" height="1" fill="#d4c8a8" />
      <rect x="35" y="30" width="1" height="1" fill="#f0e8da" />
      <rect x="32" y="33" width="1" height="1" fill="#d4c8a8" />
      <!-- old red on the barbs -->
      <rect x="34" y="31" width="1" height="1" fill="#7a1a10" />

      <!-- Off arm — claw folded behind, court etiquette -->
      <rect x="6" y="16" width="5" height="4" fill="#150d08" />
      <rect x="7" y="17" width="3" height="2" fill="#241016" />
      <rect x="7" y="17" width="3" height="1" fill="#2e161c" />
      <rect x="5" y="19" width="4" height="6" fill="#150d08" />
      <rect x="6" y="20" width="2" height="4" fill="#1c0c10" />
      <rect x="6" y="20" width="1" height="4" fill="#241016" />

      <!-- Barbed tail wrapped round the stance -->
      <rect x="22" y="27" width="8" height="3" fill="#150d08" />
      <rect x="23" y="28" width="6" height="1" fill="#241016" />
      <rect x="28" y="25" width="3" height="3" fill="#150d08" />
      <rect x="29" y="26" width="1" height="1" fill="#2e161c" />
      <!-- the sting through the gold ring it earned -->
      <rect x="29" y="22" width="3" height="3" fill="#150d08" />
      <rect x="30" y="23" width="1" height="1" fill="#c89a48" />

      <!-- Digitigrade legs in court-greaves -->
      <rect x="10" y="28" width="7" height="4" fill="#150d08" />
      <rect x="11" y="28" width="5" height="3" fill="#241016" />
      <rect x="11" y="28" width="2" height="2" fill="#2e161c" />
      <rect x="10" y="31" width="6" height="6" fill="#150d08" />
      <rect x="11" y="32" width="4" height="4" fill="#2e161c" />
      <rect x="11" y="32" width="1" height="4" fill="#38181f" />
      <rect x="16" y="31" width="6" height="6" fill="#150d08" />
      <rect x="17" y="32" width="4" height="4" fill="#241016" />
      <rect x="20" y="32" width="1" height="4" fill="#1c0c10" />
      <!-- gold greave-bands -->
      <rect x="11" y="34" width="4" height="1" fill="#9a7232" />
      <rect x="11" y="34" width="2" height="1" fill="#c89a48" />
      <rect x="17" y="34" width="4" height="1" fill="#7a5a26" />
      <!-- backward hocks + talons -->
      <rect x="9" y="37" width="6" height="4" fill="#150d08" />
      <rect x="10" y="38" width="4" height="2" fill="#241016" />
      <rect x="15" y="37" width="6" height="4" fill="#150d08" />
      <rect x="16" y="38" width="4" height="2" fill="#1c0c10" />
      <rect x="7" y="40" width="8" height="2" fill="#150d08" />
      <rect x="8" y="41" width="6" height="1" fill="#1c0c10" />
      <rect x="6" y="41" width="2" height="1" fill="#150d08" />
      <rect x="6" y="41" width="1" height="1" fill="#d4c8a8" />
      <rect x="14" y="41" width="8" height="2" fill="#150d08" />
      <rect x="15" y="42" width="6" height="1" fill="#140609" />
      <rect x="21" y="41" width="2" height="1" fill="#150d08" />
      <rect x="22" y="41" width="1" height="1" fill="#b4a692" />

      <!-- The pit-dread rolling off it -->
      <rect x="4" y="22" width="1" height="1" fill="#d84838" opacity="0.45" />
      <rect x="31" y="10" width="1" height="1" fill="#a82a20" opacity="0.5" />
      <rect x="26" y="34" width="1" height="1" fill="#7a1a10" opacity="0.5" />
    </svg>
