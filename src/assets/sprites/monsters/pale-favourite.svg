<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 26 34"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Pale Favourite"
    >
      <!-- Crimson backlight + ground shadow -->
      <ellipse cx="13" cy="17" rx="12" ry="16" fill="#7a1428" opacity="0.08" />
      <ellipse cx="13" cy="32" rx="10" ry="2" fill="#1e1622" opacity="0.35" />

      <!-- Pale head — porcelain ramp, lit upper-left -->
      <ellipse cx="13" cy="8" rx="5" ry="6" fill="#f0ead8" />
      <ellipse cx="11" cy="6" rx="3" ry="4" fill="#f6f1e4" opacity="0.6" />
      <ellipse cx="15" cy="10" rx="3" ry="4" fill="#d8cdb6" opacity="0.5" />
      <rect x="11" y="7" width="1" height="2" fill="#cabfaa" opacity="0.7" />
      <rect x="14" y="7" width="1" height="2" fill="#cabfaa" opacity="0.7" />
      <rect x="12" y="10" width="2" height="1" fill="#8a2438" opacity="0.7" />
      <rect x="9" y="5" width="8" height="1" fill="#d8cdb6" opacity="0.5" />
      <!-- Cold favoured eyes -->
      <rect x="11" y="7" width="1" height="1" fill="#5a1020" />
      <rect x="14" y="7" width="1" height="1" fill="#5a1020" />

      <!-- Wine gown — crimson ramp + bodice + gold belt -->
      <polygon points="9,13 17,13 20,32 6,32" fill="#5a2638" />
      <polygon points="9,13 17,13 18,21 8,21" fill="#6e3046" />
      <polygon points="9,13 12,13 12,30 8,28" fill="#7a3850" />
      <rect x="12" y="13" width="2" height="19" fill="#4a1e30" opacity="0.7" />
      <rect x="9" y="16" width="1" height="14" fill="#8a4258" opacity="0.5" />
      <rect x="16" y="16" width="1" height="14" fill="#4a1e30" opacity="0.5" />
      <rect x="10" y="13" width="6" height="2" fill="#e8dfcc" opacity="0.85" />
      <rect x="10" y="13" width="3" height="1" fill="#f6f1e4" opacity="0.7" />
      <rect x="7" y="24" width="12" height="1" fill="#c0a040" opacity="0.7" />
      <rect x="7" y="24" width="4" height="1" fill="#f4d878" opacity="0.6" />
      <!-- gown dither -->
      <rect x="11" y="18" width="1" height="1" fill="#6e3046" />
      <rect x="15" y="26" width="1" height="1" fill="#4a1e30" />

      <!-- Arms + pale hands -->
      <rect x="5" y="14" width="4" height="2" fill="#5a2638" />
      <rect x="3" y="15" width="3" height="7" fill="#6e3046" />
      <rect x="3" y="15" width="1" height="7" fill="#7a3850" />
      <rect x="2" y="21" width="3" height="2" fill="#f0ead8" />
      <rect x="2" y="21" width="3" height="1" fill="#f6f1e4" />
      <rect x="17" y="14" width="4" height="2" fill="#5a2638" />
      <rect x="20" y="15" width="3" height="7" fill="#6e3046" />
      <rect x="22" y="15" width="1" height="7" fill="#4a1e30" />
      <rect x="21" y="21" width="3" height="2" fill="#e0d6c2" />
      <polygon points="21,20 23,17 24,21" fill="#e0d6c2" opacity="0.6" />

      <!-- Hem feet + glints -->
      <rect x="9" y="32" width="3" height="1" fill="#160e16" />
      <rect x="14" y="32" width="3" height="1" fill="#160e16" />
      <rect x="6" y="11" width="1" height="1" fill="#f6f1e4" opacity="0.6" />
      <rect x="19" y="26" width="1" height="1" fill="#f4d878" opacity="0.5" />
      <rect x="13" y="2" width="1" height="2" fill="#f6f1e4" opacity="0.7" />
    </svg>
