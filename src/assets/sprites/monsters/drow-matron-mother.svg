<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 40"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Drow Matron Mother"
    >
      <!-- Drow-violet backlight + ground shadow -->
      <ellipse cx="12" cy="20" rx="12" ry="18" fill="#6a3a9a" opacity="0.08" />
      <ellipse cx="12" cy="38" rx="8" ry="1.4" fill="#000" opacity="0.4" />

      <!-- Spider-crown — gold ramp + gem -->
      <polygon points="9,0 15,0 16,3 8,3" fill="#d4b062" />
      <polygon points="10,0 14,0 14,2 10,2" fill="#f4d042" />
      <rect x="8" y="2" width="8" height="1" fill="#9a7e2e" />
      <rect x="11" y="-1" width="2" height="2" fill="#a48ee0" />
      <rect x="11" y="-1" width="1" height="1" fill="#e8d4ff" />

      <!-- White drow hair + dark face ramp -->
      <rect x="7" y="3" width="10" height="2" fill="#e8e0c4" />
      <rect x="7" y="3" width="10" height="1" fill="#f4eed8" />
      <rect x="6" y="5" width="12" height="6" fill="#5a4858" />
      <rect x="6" y="5" width="2" height="6" fill="#6e5c6c" />
      <rect x="6" y="5" width="1" height="4" fill="#7e6c7c" />
      <rect x="16" y="5" width="2" height="6" fill="#3a2838" />
      <rect x="5" y="6" width="1" height="5" fill="#e8e0c4" />
      <rect x="18" y="6" width="1" height="5" fill="#cfc6ac" />

      <!-- Red eyes + amber spark -->
      <rect x="8" y="7" width="2" height="2" fill="#b53c4a" />
      <rect x="14" y="7" width="2" height="2" fill="#b53c4a" />
      <rect x="9" y="7" width="1" height="1" fill="#f4d042" />
      <rect x="15" y="7" width="1" height="1" fill="#f4d042" />
      <rect x="9" y="10" width="6" height="1" fill="#5a1208" />

      <!-- Robe shoulders + torso — purple ramp -->
      <rect x="4" y="11" width="16" height="3" fill="#2a0a48" />
      <rect x="4" y="11" width="16" height="1" fill="#3a1858" />
      <rect x="4" y="11" width="2" height="3" fill="#1a0428" />
      <rect x="18" y="11" width="2" height="3" fill="#1a0428" />
      <rect x="5" y="14" width="14" height="14" fill="#2a0a48" />
      <rect x="5" y="14" width="14" height="1" fill="#3a1858" />
      <rect x="5" y="14" width="2" height="14" fill="#341254" />
      <rect x="5" y="14" width="1" height="14" fill="#4a2a6a" opacity="0.6" />
      <rect x="17" y="14" width="2" height="14" fill="#1a0428" />
      <rect x="8" y="18" width="1" height="1" fill="#3a1858" />
      <rect x="16" y="24" width="1" height="1" fill="#1a0428" />

      <!-- Holy symbol — bloodstone set in amethyst -->
      <rect x="9" y="17" width="6" height="9" fill="#5a1208" />
      <rect x="9" y="17" width="6" height="1" fill="#7a201a" />
      <rect x="11" y="18" width="2" height="7" fill="#8c2010" />
      <rect x="10" y="20" width="4" height="3" fill="#a48ee0" />
      <rect x="11" y="21" width="2" height="1" fill="#e8d4ff" />
      <rect x="11" y="20" width="1" height="1" fill="#fff0ff" opacity="0.7" />

      <!-- Right arm + hand -->
      <rect x="19" y="12" width="2" height="6" fill="#5a4858" />
      <rect x="20" y="12" width="1" height="6" fill="#3a2838" />
      <rect x="19" y="17" width="3" height="2" fill="#e8e0c4" />

      <!-- Left arm + serpent scourge -->
      <rect x="3" y="12" width="2" height="6" fill="#5a4858" />
      <rect x="3" y="12" width="1" height="6" fill="#6e5c6c" />
      <rect x="2" y="17" width="3" height="2" fill="#e8e0c4" />
      <rect x="0" y="0" width="2" height="20" fill="#3a2418" />
      <rect x="0" y="0" width="1" height="20" fill="#5a4030" />
      <ellipse cx="1" cy="0" rx="3" ry="2" fill="#4a7022" />
      <rect x="0" y="-2" width="2" height="2" fill="#3a5018" />
      <rect x="-1" y="0" width="1" height="1" fill="#f4d042" />
      <rect x="2" y="0" width="1" height="1" fill="#f4d042" />
      <line x1="0" y1="3" x2="3" y2="5" stroke="#3a5018" stroke-width="0.4" />
      <line x1="0" y1="7" x2="3" y2="9" stroke="#3a5018" stroke-width="0.4" />
      <line x1="0" y1="11" x2="3" y2="13" stroke="#3a5018" stroke-width="0.4" />

      <!-- Robe skirt — layered hem -->
      <rect x="5" y="28" width="14" height="2" fill="#1a0428" />
      <polygon points="5,30 7,28 9,30" fill="#2a0a48" />
      <polygon points="9,30 11,28 13,30" fill="#2a0a48" />
      <polygon points="13,30 15,28 17,30" fill="#2a0a48" />
      <rect x="5" y="30" width="14" height="6" fill="#2a0a48" />
      <rect x="5" y="30" width="14" height="1" fill="#3a1858" />
      <polygon points="5,36 7,33 9,36" fill="#1a0428" />
      <polygon points="9,36 11,33 13,36" fill="#1a0428" />
      <polygon points="13,36 15,33 17,36" fill="#1a0428" />

      <!-- Feet -->
      <rect x="8" y="36" width="3" height="3" fill="#1a1410" />
      <rect x="13" y="36" width="3" height="3" fill="#1a1410" />
      <rect x="8" y="36" width="3" height="1" fill="#3a2a3a" />
      <rect x="13" y="36" width="3" height="1" fill="#3a2a3a" />
    </svg>
