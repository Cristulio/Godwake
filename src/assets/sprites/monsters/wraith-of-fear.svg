<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 44"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Wraith of Fear"
    >
      <!-- Dread aura + almost no shadow — it is not quite here -->
      <ellipse cx="16" cy="22" rx="15" ry="19" fill="#16131a" opacity="0.5" />
      <ellipse cx="16" cy="42.4" rx="9" ry="1.4" fill="#000" opacity="0.3" />

      <!-- The hood — tall, and empty when you make yourself look -->
      <rect x="8" y="0" width="16" height="14" fill="#150d08" />
      <rect x="9" y="1" width="14" height="12" fill="#221e26" />
      <rect x="9" y="1" width="14" height="1" fill="#332f37" />
      <rect x="9" y="1" width="5" height="1" fill="#3e3a44" />
      <rect x="9" y="1" width="2" height="11" fill="#2a2630" />
      <rect x="9" y="1" width="1" height="6" fill="#332f37" />
      <rect x="20" y="2" width="3" height="11" fill="#1a171f" />
      <rect x="22" y="2" width="1" height="11" fill="#16131a" />
      <!-- the hood's peak drawn high -->
      <rect x="13" y="0" width="6" height="1" fill="#2a2630" />
      <!-- the absence inside -->
      <rect x="11" y="4" width="10" height="8" fill="#0e0c12" />
      <rect x="12" y="5" width="8" height="7" fill="#08070c" />
      <!-- what you see when you look: two cold far-down points -->
      <rect x="13" y="7" width="2" height="1" fill="#8fb8c0" />
      <rect x="17" y="7" width="2" height="1" fill="#8fb8c0" />
      <rect x="13" y="7" width="1" height="1" fill="#d8ecf2" />
      <rect x="17" y="7" width="1" height="1" fill="#d8ecf2" />
      <!-- the suggestion of the face it wears for you, surfacing -->
      <rect x="14" y="9" width="4" height="1" fill="#221e26" opacity="0.9" />
      <rect x="15" y="10" width="2" height="1" fill="#2e2a32" opacity="0.8" />

      <!-- Shoulders — the robe hangs off nothing -->
      <rect x="6" y="13" width="20" height="5" fill="#150d08" />
      <rect x="7" y="14" width="18" height="3" fill="#221e26" />
      <rect x="7" y="14" width="18" height="1" fill="#2e2a32" />
      <rect x="7" y="14" width="6" height="1" fill="#3a363e" />
      <rect x="21" y="14" width="4" height="3" fill="#16131a" />

      <!-- Robe — a column of dread falling to rags -->
      <rect x="7" y="17" width="18" height="17" fill="#150d08" />
      <rect x="8" y="18" width="16" height="15" fill="#1d1a22" />
      <rect x="8" y="18" width="16" height="1" fill="#262229" />
      <rect x="8" y="18" width="3" height="15" fill="#221e26" />
      <rect x="8" y="18" width="1" height="9" fill="#2a2630" />
      <rect x="20" y="18" width="4" height="15" fill="#16131a" />
      <rect x="23" y="18" width="1" height="15" fill="#121017" />
      <!-- the cold running down its folds -->
      <rect x="12" y="18" width="1" height="13" fill="#16131a" />
      <rect x="17" y="18" width="1" height="14" fill="#16131a" />
      <rect x="14" y="19" width="1" height="12" fill="#262229" />
      <!-- frost-pale seam where it almost has a body -->
      <rect x="15" y="20" width="1" height="8" fill="#3a4a52" />
      <rect x="15" y="22" width="1" height="2" fill="#5a7a86" />

      <!-- Reaching arm — the chill that goes past armour -->
      <rect x="23" y="15" width="6" height="4" fill="#150d08" />
      <rect x="24" y="16" width="4" height="2" fill="#221e26" />
      <rect x="24" y="16" width="4" height="1" fill="#2e2a32" />
      <rect x="26" y="18" width="4" height="4" fill="#150d08" />
      <rect x="27" y="19" width="2" height="2" fill="#1d1a22" />
      <!-- the hand — long bones of cold light -->
      <rect x="28" y="20" width="4" height="1" fill="#150d08" />
      <rect x="29" y="20" width="3" height="1" fill="#5a7a86" />
      <rect x="31" y="20" width="1" height="1" fill="#8fb8c0" />
      <rect x="28" y="22" width="4" height="1" fill="#150d08" />
      <rect x="29" y="22" width="3" height="1" fill="#3a4a52" />
      <rect x="31" y="22" width="1" height="1" fill="#5a7a86" />
      <rect x="28" y="24" width="3" height="1" fill="#150d08" />
      <rect x="29" y="24" width="2" height="1" fill="#3a4a52" />

      <!-- Off arm folded into the robe -->
      <rect x="4" y="16" width="4" height="9" fill="#150d08" />
      <rect x="5" y="17" width="2" height="7" fill="#1d1a22" />
      <rect x="5" y="17" width="1" height="7" fill="#221e26" />

      <!-- The hem — torn to streamers that never touch the floor -->
      <rect x="8" y="33" width="16" height="4" fill="#150d08" />
      <rect x="9" y="34" width="14" height="2" fill="#1a171f" />
      <rect x="9" y="34" width="4" height="2" fill="#1d1a22" />
      <rect x="19" y="34" width="4" height="2" fill="#121017" />
      <!-- streamers -->
      <rect x="9" y="36" width="3" height="3" fill="#16131a" />
      <rect x="10" y="39" width="2" height="2" fill="#121017" opacity="0.8" />
      <rect x="11" y="41" width="1" height="2" fill="#0e0c12" opacity="0.6" />
      <rect x="14" y="36" width="2" height="4" fill="#1a171f" opacity="0.9" />
      <rect x="15" y="40" width="1" height="2" fill="#121017" opacity="0.6" />
      <rect x="18" y="36" width="3" height="3" fill="#121017" opacity="0.85" />
      <rect x="19" y="39" width="2" height="2" fill="#0e0c12" opacity="0.6" />
      <rect x="13" y="37" width="1" height="2" fill="#0e0c12" opacity="0.7" />
      <rect x="22" y="36" width="1" height="2" fill="#0e0c12" opacity="0.6" />

      <!-- The cold leaking off it -->
      <rect x="5" y="8" width="1" height="1" fill="#5a7a86" opacity="0.4" />
      <rect x="26" y="10" width="1" height="1" fill="#3a4a52" opacity="0.45" />
      <rect x="4" y="28" width="1" height="1" fill="#5a7a86" opacity="0.35" />
      <rect x="27" y="30" width="1" height="1" fill="#3a4a52" opacity="0.4" />
      <rect x="16" y="14" width="1" height="1" fill="#8fb8c0" opacity="0.3" />
    </svg>
