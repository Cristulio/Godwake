<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 40 62"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Bugbear Brute"
    >
      <!-- Warm den backlight + ground shadow -->
      <ellipse cx="20" cy="30" rx="19" ry="27" fill="#8c6232" opacity="0.08" />
      <ellipse cx="19" cy="59.6" rx="15" ry="2.2" fill="#000" opacity="0.45" />

      <!-- ══ Spiked club — resting over the shoulder ══ -->
      <!-- haft from the fist up over the right shoulder -->
      <rect x="28" y="14" width="4" height="26" fill="#150d08" />
      <rect x="29" y="15" width="2" height="24" fill="#4a2810" />
      <rect x="29" y="15" width="1" height="24" fill="#6a3a1a" />
      <!-- club head — knotted wood, iron spikes -->
      <rect x="25" y="2" width="11" height="13" fill="#150d08" />
      <rect x="26" y="3" width="9" height="11" fill="#5a3418" />
      <rect x="26" y="3" width="4" height="11" fill="#6e4220" />
      <rect x="26" y="3" width="2" height="7" fill="#82542a" />
      <rect x="32" y="3" width="3" height="11" fill="#46280e" />
      <!-- wood knots -->
      <rect x="28" y="5" width="2" height="2" fill="#3a2010" />
      <rect x="31" y="9" width="2" height="2" fill="#341c0c" />
      <!-- iron spikes -->
      <rect x="24" y="4" width="3" height="2" fill="#150d08" />
      <rect x="24" y="5" width="2" height="1" fill="#8e8a96" />
      <rect x="35" y="6" width="3" height="2" fill="#150d08" />
      <rect x="36" y="7" width="2" height="1" fill="#6e6a78" />
      <rect x="29" y="0" width="2" height="4" fill="#150d08" />
      <rect x="30" y="1" width="1" height="2" fill="#9a96a4" />
      <rect x="33" y="1" width="2" height="3" fill="#150d08" />
      <rect x="34" y="2" width="1" height="1" fill="#8e8a96" />

      <!-- ══ Ragged ears ══ -->
      <rect x="4" y="2" width="5" height="5" fill="#150d08" />
      <rect x="5" y="3" width="3" height="3" fill="#7a5028" />
      <rect x="6" y="4" width="2" height="2" fill="#3a2210" />
      <rect x="22" y="2" width="5" height="5" fill="#150d08" />
      <rect x="23" y="3" width="3" height="3" fill="#5a3818" />
      <rect x="23" y="4" width="2" height="2" fill="#2e1808" />
      <!-- ear notch (an old fight) -->
      <rect x="5" y="2" width="2" height="1" fill="#150d08" />

      <!-- ══ Head — heavy fur brow, underbite ══ -->
      <rect x="5" y="5" width="21" height="14" fill="#150d08" />
      <rect x="6" y="6" width="19" height="12" fill="#7a5028" />
      <rect x="6" y="6" width="7" height="12" fill="#9a6838" />
      <rect x="6" y="6" width="3" height="8" fill="#b07e44" />
      <rect x="21" y="6" width="4" height="12" fill="#5a3818" />
      <rect x="23" y="6" width="2" height="12" fill="#46280e" />
      <!-- shaggy brow clumps -->
      <rect x="6" y="6" width="19" height="2" fill="#5a3818" />
      <rect x="7" y="6" width="3" height="3" fill="#4a2c12" />
      <rect x="13" y="6" width="2" height="3" fill="#4a2c12" />
      <rect x="19" y="6" width="3" height="3" fill="#3e2410" />
      <!-- beady red eyes under the brow -->
      <rect x="8" y="9" width="4" height="3" fill="#1a1410" />
      <rect x="18" y="9" width="4" height="3" fill="#1a1410" />
      <rect x="9" y="10" width="2" height="2" fill="#b5302c" />
      <rect x="19" y="10" width="2" height="2" fill="#8e2420" />
      <rect x="9" y="10" width="1" height="1" fill="#f48a52" />
      <rect x="19" y="10" width="1" height="1" fill="#d4603a" />
      <!-- flat snout -->
      <rect x="13" y="11" width="5" height="4" fill="#5a3818" />
      <rect x="13" y="11" width="2" height="4" fill="#6a4422" />
      <rect x="14" y="12" width="1" height="1" fill="#2e1808" />
      <rect x="16" y="12" width="1" height="1" fill="#2e1808" />
      <!-- underbite jaw with tusks -->
      <rect x="9" y="15" width="13" height="4" fill="#150d08" />
      <rect x="10" y="16" width="11" height="2" fill="#4a2c12" />
      <rect x="10" y="16" width="4" height="1" fill="#5a3818" />
      <rect x="10" y="14" width="2" height="3" fill="#e8dcc4" />
      <rect x="10" y="14" width="1" height="2" fill="#f6f0dc" />
      <rect x="19" y="14" width="2" height="3" fill="#cdbfa2" />

      <!-- ══ Shaggy shoulders + torso ══ -->
      <rect x="2" y="19" width="28" height="9" fill="#150d08" />
      <rect x="3" y="20" width="26" height="8" fill="#7a5028" />
      <rect x="3" y="20" width="9" height="8" fill="#9a6838" />
      <rect x="3" y="20" width="4" height="5" fill="#b07e44" />
      <rect x="24" y="20" width="5" height="8" fill="#5a3818" />
      <rect x="27" y="20" width="2" height="8" fill="#46280e" />
      <!-- fur clump notches on the shoulder line -->
      <rect x="5" y="19" width="2" height="2" fill="#150d08" />
      <rect x="10" y="19" width="1" height="2" fill="#150d08" />
      <rect x="15" y="19" width="2" height="1" fill="#150d08" />
      <rect x="21" y="19" width="1" height="2" fill="#150d08" />
      <rect x="25" y="19" width="2" height="1" fill="#150d08" />
      <!-- torso -->
      <rect x="4" y="28" width="24" height="15" fill="#150d08" />
      <rect x="5" y="29" width="22" height="13" fill="#6a4422" />
      <rect x="5" y="29" width="8" height="13" fill="#7a5028" />
      <rect x="5" y="29" width="3" height="9" fill="#9a6838" />
      <rect x="23" y="29" width="4" height="13" fill="#4a2c12" />
      <!-- fur texture -->
      <rect x="8" y="32" width="2" height="1" fill="#5a3818" />
      <rect x="15" y="34" width="2" height="1" fill="#4a2c12" />
      <rect x="10" y="37" width="2" height="1" fill="#5a3818" />
      <rect x="19" y="39" width="2" height="1" fill="#46280e" />
      <!-- crude hide strap -->
      <rect x="5" y="30" width="22" height="2" fill="#2e2014" />
      <rect x="5" y="30" width="7" height="1" fill="#3c2c1c" />
      <!-- bone toggle -->
      <rect x="13" y="29" width="3" height="4" fill="#150d08" />
      <rect x="14" y="30" width="1" height="2" fill="#cdbfa2" />

      <!-- ══ Left arm — knuckles low, ready ══ -->
      <rect x="0" y="29" width="7" height="9" fill="#150d08" />
      <rect x="1" y="30" width="5" height="7" fill="#7a5028" />
      <rect x="1" y="30" width="2" height="7" fill="#9a6838" />
      <rect x="0" y="36" width="8" height="8" fill="#150d08" />
      <rect x="1" y="37" width="6" height="6" fill="#6a4422" />
      <rect x="1" y="37" width="2" height="6" fill="#7a5028" />
      <!-- heavy knuckled fist -->
      <rect x="1" y="42" width="7" height="6" fill="#150d08" />
      <rect x="2" y="43" width="5" height="4" fill="#9a6838" />
      <rect x="2" y="43" width="2" height="4" fill="#b07e44" />
      <rect x="3" y="45" width="1" height="1" fill="#5a3818" />
      <rect x="5" y="45" width="1" height="1" fill="#5a3818" />
      <rect x="2" y="46" width="1" height="2" fill="#cdbfa2" />
      <rect x="5" y="46" width="1" height="2" fill="#b0a486" />

      <!-- ══ Right arm — fist on the club haft ══ -->
      <rect x="25" y="29" width="7" height="7" fill="#150d08" />
      <rect x="26" y="30" width="5" height="5" fill="#5a3818" />
      <rect x="26" y="30" width="2" height="5" fill="#6a4422" />
      <!-- fist gripping the haft -->
      <rect x="26" y="35" width="8" height="7" fill="#150d08" />
      <rect x="27" y="36" width="6" height="5" fill="#7a5028" />
      <rect x="27" y="36" width="2" height="5" fill="#9a6838" />
      <rect x="29" y="38" width="1" height="1" fill="#46280e" />
      <rect x="31" y="38" width="1" height="1" fill="#46280e" />

      <!-- ══ Hide loincloth + legs ══ -->
      <rect x="4" y="43" width="24" height="5" fill="#150d08" />
      <rect x="5" y="44" width="22" height="3" fill="#2e2014" />
      <rect x="5" y="44" width="8" height="2" fill="#3c2c1c" />
      <rect x="10" y="46" width="3" height="2" fill="#241808" />
      <rect x="19" y="46" width="3" height="2" fill="#241808" />
      <!-- legs -->
      <rect x="5" y="48" width="10" height="8" fill="#150d08" />
      <rect x="6" y="49" width="8" height="7" fill="#6a4422" />
      <rect x="6" y="49" width="3" height="7" fill="#7a5028" />
      <rect x="12" y="49" width="2" height="7" fill="#4a2c12" />
      <rect x="17" y="48" width="10" height="8" fill="#150d08" />
      <rect x="18" y="49" width="8" height="7" fill="#5a3818" />
      <rect x="18" y="49" width="2" height="7" fill="#6a4422" />
      <rect x="24" y="49" width="2" height="7" fill="#46280e" />

      <!-- ══ Clawed feet ══ -->
      <rect x="3" y="55" width="12" height="5" fill="#150d08" />
      <rect x="4" y="56" width="10" height="3" fill="#5a3818" />
      <rect x="4" y="56" width="4" height="3" fill="#6a4422" />
      <rect x="3" y="58" width="2" height="2" fill="#cdbfa2" />
      <rect x="7" y="58" width="2" height="2" fill="#b0a486" />
      <rect x="11" y="58" width="2" height="2" fill="#b0a486" />
      <rect x="16" y="55" width="12" height="5" fill="#150d08" />
      <rect x="17" y="56" width="10" height="3" fill="#4a2c12" />
      <rect x="17" y="58" width="2" height="2" fill="#b0a486" />
      <rect x="21" y="58" width="2" height="2" fill="#988c70" />
      <rect x="25" y="58" width="2" height="2" fill="#988c70" />

      <!-- den motes -->
      <rect x="35" y="22" width="1" height="1" fill="#b07e44" opacity="0.5" />
      <rect x="2" y="14" width="1" height="1" fill="#9a6838" opacity="0.5" />
    </svg>
