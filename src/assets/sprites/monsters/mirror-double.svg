<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 32"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
    >
      <!-- Cold mirror backlight + ground shadow -->
      <ellipse cx="12" cy="15" rx="11" ry="15" fill="#7fb0d0" opacity="0.08" />
      <ellipse cx="12" cy="24" rx="9" ry="6" fill="#16202a" opacity="0.3" />

      <!-- Glassy head — silver-blue ramp, lit upper-left -->
      <ellipse cx="12" cy="8" rx="5" ry="6" fill="#7fa0b4" />
      <ellipse cx="11" cy="7" rx="4" ry="5" fill="#9fbccd" opacity="0.7" />
      <ellipse cx="10" cy="6" rx="2" ry="3" fill="#b8cdd8" opacity="0.6" />
      <rect x="7" y="8" width="10" height="6" fill="#9fbccd" opacity="0.5" />
      <rect x="14" y="5" width="2" height="6" fill="#5e7e92" opacity="0.6" />
      <!-- Hollow eyes + spark -->
      <rect x="9" y="6" width="2" height="2" fill="#1a2630" />
      <rect x="13" y="6" width="2" height="2" fill="#1a2630" />
      <rect x="9" y="6" width="1" height="1" fill="#eef6fa" />
      <rect x="13" y="6" width="1" height="1" fill="#eef6fa" />
      <!-- Fracture lines across the glass face -->
      <line x1="10" y1="2" x2="14" y2="13" stroke="#dceaf2" stroke-width="0.5" opacity="0.8" />
      <line x1="15" y1="5" x2="11" y2="12" stroke="#dceaf2" stroke-width="0.5" opacity="0.6" />

      <!-- Mirror torso — ramp + highlight ribs + crack -->
      <rect x="7" y="13" width="10" height="13" fill="#7fa0b4" />
      <rect x="7" y="13" width="3" height="13" fill="#9fbccd" />
      <rect x="7" y="13" width="1" height="13" fill="#b0cede" />
      <rect x="15" y="13" width="2" height="13" fill="#6a8ca0" />
      <rect x="7" y="13" width="10" height="1" fill="#a4c2d2" />
      <rect x="11" y="14" width="2" height="12" fill="#5e7e92" />
      <rect x="8" y="16" width="1" height="8" fill="#cfe4ee" opacity="0.7" />
      <rect x="15" y="16" width="1" height="8" fill="#b0cede" opacity="0.6" />
      <line x1="9" y1="14" x2="16" y2="25" stroke="#cfe4ee" stroke-width="0.5" opacity="0.55" />
      <rect x="13" y="18" width="1" height="1" fill="#6a8ca0" />

      <!-- Arms -->
      <rect x="3" y="14" width="4" height="2" fill="#7fa0b4" />
      <rect x="3" y="14" width="4" height="1" fill="#9fbccd" />
      <rect x="1" y="15" width="3" height="2" fill="#6a8ca0" />
      <rect x="17" y="14" width="3" height="2" fill="#7fa0b4" />

      <!-- Shard blade — ice ramp + bright specular -->
      <rect x="19" y="13" width="2" height="9" fill="#c8dce8" />
      <rect x="19" y="13" width="2" height="5" fill="#e4f0f6" />
      <rect x="19" y="13" width="1" height="9" fill="#ffffff" opacity="0.7" />
      <polygon points="19,12 20,9 21,13" fill="#eef6fa" />

      <!-- Legs + boots -->
      <rect x="8" y="26" width="3" height="5" fill="#5e7e92" />
      <rect x="13" y="26" width="3" height="5" fill="#5e7e92" />
      <rect x="8" y="26" width="1" height="5" fill="#7fa0b4" />
      <rect x="13" y="26" width="1" height="5" fill="#7fa0b4" />
      <rect x="8" y="30" width="3" height="1" fill="#1a2630" />
      <rect x="13" y="30" width="3" height="1" fill="#1a2630" />

      <!-- Glints -->
      <rect x="5" y="10" width="1" height="1" fill="#eef6fa" opacity="0.6" />
      <rect x="18" y="20" width="1" height="1" fill="#eef6fa" opacity="0.5" />
    </svg>
