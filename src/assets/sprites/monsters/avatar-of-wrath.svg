<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 42 50"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Avatar of Wrath"
    >
      <!-- Godfire backlight + scorched ground shadow -->
      <ellipse cx="21" cy="26" rx="20" ry="21" fill="#e87820" opacity="0.08" />
      <ellipse cx="21" cy="14" rx="12" ry="10" fill="#f4942a" opacity="0.08" />
      <ellipse cx="21" cy="48.3" rx="15" ry="1.9" fill="#000" opacity="0.46" />

      <!-- The burning crown — your father's fire, worn as hair -->
      <rect x="13" y="0" width="3" height="4" fill="#a83a14" />
      <rect x="14" y="1" width="1" height="3" fill="#e87820" />
      <rect x="17" y="0" width="2" height="3" fill="#e87820" />
      <rect x="17" y="0" width="1" height="2" fill="#ffd070" />
      <rect x="20" y="0" width="3" height="4" fill="#f4942a" />
      <rect x="21" y="0" width="1" height="2" fill="#fff4d0" />
      <rect x="24" y="0" width="2" height="3" fill="#e87820" />
      <rect x="24" y="1" width="1" height="2" fill="#ffd070" />
      <rect x="27" y="0" width="2" height="4" fill="#a83a14" />
      <rect x="27" y="1" width="1" height="2" fill="#d4641a" />
      <rect x="15" y="2" width="12" height="2" fill="#d4641a" />
      <rect x="16" y="2" width="6" height="1" fill="#f4942a" />

      <!-- Head — a war-god's face cast in cooling iron -->
      <rect x="13" y="4" width="16" height="11" fill="#150d08" />
      <rect x="14" y="5" width="14" height="9" fill="#48241e" />
      <rect x="14" y="5" width="14" height="1" fill="#683a30" />
      <rect x="14" y="5" width="5" height="1" fill="#8a4a3a" />
      <rect x="14" y="5" width="2" height="8" fill="#5a2e26" />
      <rect x="26" y="6" width="2" height="8" fill="#38181a" />
      <!-- the brow — permanently down -->
      <rect x="15" y="7" width="5" height="1" fill="#150d08" />
      <rect x="22" y="7" width="5" height="1" fill="#150d08" />
      <!-- eyes — pure godfire, no white left -->
      <rect x="16" y="8" width="3" height="2" fill="#f4942a" />
      <rect x="23" y="8" width="3" height="2" fill="#f4942a" />
      <rect x="16" y="8" width="2" height="1" fill="#ffd070" />
      <rect x="23" y="8" width="2" height="1" fill="#ffd070" />
      <rect x="17" y="8" width="1" height="1" fill="#fff4d0" />
      <rect x="24" y="8" width="1" height="1" fill="#fff4d0" />
      <!-- the roar -->
      <rect x="17" y="11" width="8" height="3" fill="#150d08" />
      <rect x="18" y="12" width="6" height="2" fill="#a83a14" />
      <rect x="19" y="12" width="4" height="1" fill="#e87820" />
      <rect x="20" y="12" width="2" height="1" fill="#ffd070" />
      <!-- bared teeth against the fire -->
      <rect x="18" y="11" width="1" height="1" fill="#f0e8da" />
      <rect x="21" y="11" width="1" height="1" fill="#f0e8da" />
      <rect x="23" y="11" width="1" height="1" fill="#f0e8da" />

      <!-- Shoulders — slabs of scorched muscle -->
      <rect x="4" y="13" width="14" height="9" fill="#150d08" />
      <rect x="5" y="14" width="12" height="7" fill="#5a2e26" />
      <rect x="5" y="14" width="12" height="1" fill="#7a3e30" />
      <rect x="5" y="14" width="5" height="1" fill="#96503c" />
      <rect x="5" y="14" width="2" height="6" fill="#683a30" />
      <rect x="14" y="15" width="3" height="6" fill="#48241e" />
      <rect x="24" y="13" width="14" height="9" fill="#150d08" />
      <rect x="25" y="14" width="12" height="7" fill="#48241e" />
      <rect x="25" y="14" width="12" height="1" fill="#5a2e26" />
      <rect x="33" y="15" width="4" height="6" fill="#38181a" />
      <rect x="36" y="15" width="1" height="6" fill="#2e1216" />
      <!-- rage-veins cracking across the shoulders -->
      <rect x="7" y="16" width="4" height="1" fill="#a83a14" />
      <rect x="8" y="16" width="2" height="1" fill="#f4942a" />
      <rect x="28" y="17" width="4" height="1" fill="#a83a14" />
      <rect x="29" y="17" width="2" height="1" fill="#e87820" />

      <!-- Torso — the furnace chest -->
      <rect x="11" y="15" width="20" height="19" fill="#150d08" />
      <rect x="12" y="16" width="18" height="17" fill="#52291f" />
      <rect x="12" y="16" width="18" height="1" fill="#683a30" />
      <rect x="12" y="16" width="7" height="1" fill="#8a4a3a" />
      <rect x="12" y="16" width="2" height="17" fill="#5e3024" />
      <rect x="12" y="16" width="1" height="10" fill="#7a3e30" />
      <rect x="28" y="16" width="2" height="17" fill="#3f1f1a" />
      <rect x="29" y="16" width="1" height="17" fill="#321713" />
      <!-- pectoral cut -->
      <rect x="13" y="20" width="7" height="1" fill="#38181a" />
      <rect x="22" y="20" width="7" height="1" fill="#38181a" />
      <rect x="20" y="17" width="2" height="9" fill="#3f1f1a" />
      <!-- the godfire core, splitting the sternum -->
      <rect x="19" y="21" width="4" height="8" fill="#150d08" />
      <rect x="20" y="22" width="2" height="6" fill="#a83a14" />
      <rect x="20" y="22" width="2" height="3" fill="#e87820" />
      <rect x="20" y="22" width="1" height="2" fill="#ffd070" />
      <rect x="20" y="22" width="1" height="1" fill="#fff4d0" />
      <!-- rage-veins radiating from the core -->
      <rect x="16" y="24" width="3" height="1" fill="#a83a14" />
      <rect x="17" y="24" width="2" height="1" fill="#e87820" />
      <rect x="23" y="25" width="3" height="1" fill="#a83a14" />
      <rect x="23" y="25" width="2" height="1" fill="#d4641a" />
      <rect x="15" y="28" width="2" height="1" fill="#a83a14" opacity="0.8" />
      <rect x="25" y="29" width="2" height="1" fill="#a83a14" opacity="0.7" />
      <!-- abdominal slabs -->
      <rect x="14" y="26" width="5" height="1" fill="#38181a" />
      <rect x="23" y="26" width="5" height="1" fill="#38181a" />
      <rect x="14" y="30" width="5" height="1" fill="#38181a" />
      <rect x="23" y="30" width="5" height="1" fill="#38181a" />

      <!-- Right fist — drawn back for the flurry -->
      <rect x="34" y="18" width="6" height="10" fill="#150d08" />
      <rect x="35" y="19" width="4" height="8" fill="#48241e" />
      <rect x="35" y="19" width="4" height="1" fill="#5a2e26" />
      <rect x="37" y="20" width="2" height="7" fill="#38181a" />
      <!-- the fist, knuckles alight -->
      <rect x="33" y="27" width="8" height="7" fill="#150d08" />
      <rect x="34" y="28" width="6" height="5" fill="#3f1f1a" />
      <rect x="34" y="28" width="6" height="1" fill="#52291f" />
      <rect x="38" y="29" width="2" height="4" fill="#321713" />
      <rect x="34" y="30" width="6" height="1" fill="#a83a14" />
      <rect x="35" y="30" width="3" height="1" fill="#f4942a" />
      <rect x="36" y="30" width="1" height="1" fill="#ffd070" />

      <!-- Left fist — already swinging -->
      <rect x="2" y="20" width="6" height="9" fill="#150d08" />
      <rect x="3" y="21" width="4" height="7" fill="#5a2e26" />
      <rect x="3" y="21" width="4" height="1" fill="#7a3e30" />
      <rect x="3" y="21" width="1" height="6" fill="#683a30" />
      <rect x="1" y="28" width="8" height="7" fill="#150d08" />
      <rect x="2" y="29" width="6" height="5" fill="#52291f" />
      <rect x="2" y="29" width="6" height="1" fill="#683a30" />
      <rect x="2" y="29" width="1" height="4" fill="#5e3024" />
      <rect x="6" y="30" width="2" height="4" fill="#3f1f1a" />
      <rect x="2" y="31" width="6" height="1" fill="#a83a14" />
      <rect x="3" y="31" width="3" height="1" fill="#e87820" />
      <rect x="4" y="31" width="1" height="1" fill="#fff4d0" />

      <!-- War-skirt of scorched plates -->
      <rect x="11" y="34" width="20" height="5" fill="#150d08" />
      <rect x="12" y="35" width="18" height="3" fill="#38181a" />
      <rect x="12" y="35" width="18" height="1" fill="#48241e" />
      <rect x="12" y="35" width="5" height="2" fill="#3f1f1a" />
      <rect x="26" y="36" width="4" height="2" fill="#2e1216" />
      <rect x="16" y="35" width="1" height="4" fill="#150d08" />
      <rect x="21" y="35" width="1" height="4" fill="#150d08" />
      <rect x="26" y="35" width="1" height="4" fill="#150d08" />
      <!-- ember hem -->
      <rect x="13" y="38" width="3" height="1" fill="#a83a14" opacity="0.8" />
      <rect x="23" y="38" width="3" height="1" fill="#d4641a" opacity="0.7" />

      <!-- Legs — pillars mid-stride -->
      <rect x="11" y="38" width="8" height="8" fill="#150d08" />
      <rect x="12" y="39" width="6" height="6" fill="#48241e" />
      <rect x="12" y="39" width="2" height="6" fill="#5a2e26" />
      <rect x="16" y="39" width="2" height="6" fill="#38181a" />
      <rect x="23" y="38" width="8" height="8" fill="#150d08" />
      <rect x="24" y="39" width="6" height="6" fill="#3f1f1a" />
      <rect x="24" y="39" width="1" height="6" fill="#48241e" />
      <rect x="28" y="39" width="2" height="6" fill="#2e1216" />
      <!-- rage-vein down the lead shin -->
      <rect x="13" y="40" width="1" height="4" fill="#a83a14" />
      <rect x="13" y="41" width="1" height="2" fill="#f4942a" />
      <!-- feet that scorch their prints -->
      <rect x="9" y="45" width="10" height="3" fill="#150d08" />
      <rect x="10" y="46" width="8" height="1" fill="#38181a" />
      <rect x="10" y="46" width="4" height="1" fill="#48241e" />
      <rect x="23" y="45" width="10" height="3" fill="#150d08" />
      <rect x="24" y="46" width="8" height="1" fill="#2e1216" />
      <!-- the print already burning -->
      <rect x="8" y="47" width="2" height="1" fill="#a83a14" opacity="0.7" />
      <rect x="32" y="47" width="2" height="1" fill="#d4641a" opacity="0.6" />

      <!-- Sparks the rage throws -->
      <rect x="6" y="10" width="1" height="1" fill="#f4942a" opacity="0.6" />
      <rect x="35" y="8" width="1" height="1" fill="#ffd070" opacity="0.55" />
      <rect x="3" y="16" width="1" height="1" fill="#e87820" opacity="0.5" />
      <rect x="38" y="14" width="1" height="1" fill="#f4942a" opacity="0.5" />
      <rect x="40" y="24" width="1" height="1" fill="#d4641a" opacity="0.45" />
    </svg>
