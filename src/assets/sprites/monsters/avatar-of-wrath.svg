<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 42"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Avatar of Wrath"
    >
      <ellipse cx="16" cy="39" rx="12" ry="1.8" fill="#1a0606" opacity="0.5" />

      <!-- Wrath aura — layered bloom -->
      <ellipse cx="16" cy="22" rx="15" ry="19" fill="#5a1008" opacity="0.16" />
      <ellipse cx="16" cy="20" rx="11" ry="15" fill="#c0301a" opacity="0.13" />
      <ellipse cx="16" cy="20" rx="6" ry="9" fill="#e8501a" opacity="0.1" />

      <!-- Horned head — molten ramp, key light upper-left -->
      <rect x="11" y="3" width="10" height="8" fill="#a02018" />
      <rect x="11" y="3" width="10" height="2" fill="#c43020" />
      <rect x="11" y="3" width="3" height="8" fill="#b52a1c" />
      <rect x="11" y="3" width="1" height="6" fill="#e85030" />
      <rect x="20" y="4" width="1" height="7" fill="#7a1410" />
      <polygon points="11,3 9,-1 13,2" fill="#7a1410" />
      <polygon points="11,3 9,-1 12,1" fill="#a02018" opacity="0.7" />
      <polygon points="21,3 23,-1 19,2" fill="#5a1008" />
      <!-- Burning eyes + spark -->
      <rect x="12" y="6" width="3" height="2" fill="#ffb040" />
      <rect x="17" y="6" width="3" height="2" fill="#ffb040" />
      <rect x="12" y="6" width="1" height="1" fill="#fff0c0" />
      <rect x="17" y="6" width="1" height="1" fill="#fff0c0" />
      <rect x="12" y="6" width="3" height="1" fill="#fff0c0" opacity="0.4" />
      <!-- Roaring maw -->
      <rect x="12" y="9" width="8" height="2" fill="#3a0a06" />
      <rect x="13" y="9" width="1" height="2" fill="#ffb040" />
      <rect x="16" y="9" width="1" height="2" fill="#e8501a" />
      <rect x="18" y="9" width="1" height="2" fill="#ffb040" />

      <!-- Torso — ramp shell over a fire core -->
      <polygon points="8,11 24,11 27,32 5,32" fill="#7a1410" />
      <polygon points="10,11 22,11 24,30 8,30" fill="#a02018" />
      <polygon points="10,11 14,11 12,30 8,30" fill="#b52a1c" opacity="0.7" />
      <rect x="9" y="14" width="14" height="1" fill="#c43020" opacity="0.5" />
      <rect x="10" y="24" width="12" height="1" fill="#5a1008" opacity="0.6" />
      <!-- Heart-furnace -->
      <ellipse cx="16" cy="20" rx="4" ry="5" fill="#e8501a" opacity="0.75" />
      <ellipse cx="16" cy="20" rx="2" ry="3" fill="#ffb040" />
      <rect x="16" y="20" width="1" height="1" fill="#fff0c0" />
      <!-- Ember dither -->
      <rect x="11" y="18" width="1" height="1" fill="#ffb040" opacity="0.5" />
      <rect x="21" y="22" width="1" height="1" fill="#e8501a" opacity="0.5" />
      <rect x="13" y="27" width="1" height="1" fill="#5a1008" />

      <!-- Left arm + flaming fist -->
      <rect x="4" y="12" width="5" height="12" fill="#7a1410" />
      <rect x="4" y="12" width="2" height="12" fill="#a02018" />
      <rect x="4" y="12" width="1" height="10" fill="#b52a1c" />
      <rect x="3" y="22" width="7" height="6" fill="#a02018" />
      <ellipse cx="6" cy="25" rx="4" ry="3" fill="#e8501a" opacity="0.7" />
      <ellipse cx="6" cy="25" rx="2" ry="1.5" fill="#ffb040" />
      <rect x="6" y="24" width="1" height="1" fill="#fff0c0" />

      <!-- Right arm + flaming fist -->
      <rect x="23" y="12" width="5" height="12" fill="#7a1410" />
      <rect x="27" y="12" width="1" height="12" fill="#5a1008" />
      <rect x="22" y="22" width="7" height="6" fill="#a02018" />
      <ellipse cx="26" cy="25" rx="4" ry="3" fill="#e8501a" opacity="0.6" />
      <ellipse cx="26" cy="25" rx="2" ry="1.5" fill="#ffb040" />
      <rect x="26" y="24" width="1" height="1" fill="#fff0c0" />

      <!-- Legs -->
      <rect x="10" y="32" width="5" height="8" fill="#7a1410" />
      <rect x="17" y="32" width="5" height="8" fill="#7a1410" />
      <rect x="10" y="32" width="1" height="8" fill="#a02018" />
      <rect x="17" y="32" width="1" height="8" fill="#a02018" />
      <rect x="14" y="32" width="1" height="8" fill="#3a0a06" />
      <rect x="21" y="32" width="1" height="8" fill="#3a0a06" />
      <rect x="9" y="39" width="7" height="2" fill="#3a0a06" />
      <rect x="16" y="39" width="7" height="2" fill="#3a0a06" />

      <!-- Floating cinders -->
      <rect x="2" y="18" width="1" height="1" fill="#ffb040" opacity="0.6" />
      <rect x="29" y="16" width="1" height="1" fill="#e8501a" opacity="0.6" />
    </svg>
