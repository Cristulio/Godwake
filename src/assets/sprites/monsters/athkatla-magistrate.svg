      <rect x="34" y="43" width="5" height="4" fill="#b6a486" />
      <rect x="34" y="43" width="2" height="4" fill="#cdb994" />
      <!-- gavel — handle right, heavy head -->
      <rect x="38" y="44" width="6" height="3" fill="#150d08" />
      <rect x="39" y="45" width="5" height="1" fill="#6a3a1a" />
      <rect x="39" y="45" width="2" height="1" fill="#8c5226" />
      <rect x="41" y="38" width="7" height="12" fill="#150d08" />
      <rect x="42" y="39" width="5" height="10" fill="#4a2810" />
      <rect x="42" y="39" width="5" height="2" fill="#8c5226" />
      <rect x="42" y="39" width="2" height="1" fill="#b07434" />
      <rect x="42" y="47" width="5" height="2" fill="#2e1808" />
      <!-- silver bands -->
      <rect x="42" y="42" width="5" height="1" fill="#9a9ab0" />
      <rect x="42" y="42" width="2" height="1" fill="#c2c2d4" />
      <rect x="42" y="45" width="5" height="1" fill="#8a8aa0" />

      <!-- ══ Waist + skirt ══ -->
      <rect x="11" y="52" width="26" height="3" fill="#0e1138" />
      <rect x="21" y="52" width="6" height="3" fill="#150d08" />
      <rect x="22" y="52" width="4" height="2" fill="#b5b5c8" />
      <rect x="22" y="52" width="4" height="1" fill="#e8e8f0" />
      <!-- skirt flare -->
      <rect x="10" y="55" width="28" height="13" fill="#150d08" />
      <rect x="11" y="56" width="26" height="11" fill="#1a2050" />
      <rect x="11" y="56" width="7" height="11" fill="#222a5e" />
      <rect x="11" y="56" width="3" height="11" fill="#2c3470" />
      <rect x="32" y="56" width="5" height="11" fill="#141846" />
      <rect x="35" y="56" width="2" height="11" fill="#0e1138" />
      <!-- pleats -->
      <rect x="17" y="56" width="1" height="11" fill="#141846" />
      <rect x="23" y="56" width="2" height="11" fill="#0e1138" />
      <rect x="29" y="56" width="1" height="11" fill="#0e1138" />
      <!-- silver hem -->
      <rect x="11" y="65" width="26" height="1" fill="#9a9ab0" />
      <rect x="11" y="65" width="8" height="1" fill="#c2c2d4" />
      <rect x="11" y="66" width="26" height="1" fill="#15131f" />

      <!-- ══ Shoes ══ -->
      <rect x="15" y="67" width="8" height="5" fill="#150d08" />
      <rect x="16" y="68" width="6" height="3" fill="#26201c" />
      <rect x="16" y="68" width="6" height="1" fill="#3c322a" />
      <rect x="16" y="68" width="2" height="1" fill="#52443a" />
      <!-- silver shoe buckle -->
      <rect x="18" y="69" width="2" height="1" fill="#b5b5c8" />
      <rect x="25" y="67" width="8" height="5" fill="#150d08" />
      <rect x="26" y="68" width="6" height="3" fill="#1e1916" />
      <rect x="26" y="68" width="6" height="1" fill="#2e2620" />
      <rect x="28" y="69" width="2" height="1" fill="#8a8aa0" />
    </svg>
