      <rect x="18" y="15" width="4" height="3" fill="#9a9ab0" />
      <rect x="26" y="15" width="4" height="3" fill="#8a8aa0" />
      <rect x="19" y="16" width="2" height="1" fill="#1a1410" />
      <rect x="27" y="16" width="2" height="1" fill="#1a1410" />
      <rect x="19" y="16" width="1" height="1" fill="#cfdce8" />
      <rect x="27" y="16" width="1" height="1" fill="#a8b8c8" />
      <rect x="22" y="16" width="4" height="1" fill="#9a9ab0" />
      <rect x="18" y="15" width="1" height="1" fill="#e8e8f0" />
      <rect x="26" y="15" width="1" height="1" fill="#c2c2d4" />
      <!-- nose -->
