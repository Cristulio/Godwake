      <rect x="7" y="16" width="5" height="6" fill="#cdb994" />
      <rect x="7" y="16" width="2" height="6" fill="#dcc9a4" />
      <rect x="8" y="13" width="3" height="4" fill="#150d08" />
      <rect x="9" y="14" width="1" height="3" fill="#dcc9a4" />
      <rect x="10" y="14" width="1" height="3" fill="#cdb994" />
      <rect x="11" y="18" width="2" height="2" fill="#b6a486" />

      <!-- ══ Left arm — gavel of the court ══ -->
      <rect x="33" y="29" width="8" height="12" fill="#150d08" />
      <rect x="34" y="30" width="6" height="10" fill="#141846" />
      <rect x="34" y="30" width="2" height="10" fill="#1a2050" />
      <rect x="38" y="30" width="2" height="10" fill="#0e1138" />
      <!-- silver cuff -->
      <rect x="33" y="39" width="8" height="3" fill="#150d08" />
      <rect x="34" y="40" width="6" height="2" fill="#9a9ab0" />
      <rect x="34" y="40" width="2" height="1" fill="#c2c2d4" />
      <!-- hand -->
