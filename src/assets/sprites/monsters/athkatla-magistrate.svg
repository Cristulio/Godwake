      <rect x="9" y="24" width="30" height="6" fill="#150d08" />
      <rect x="10" y="25" width="28" height="4" fill="#d8d2bc" />
      <rect x="10" y="25" width="28" height="1" fill="#f0ecdc" />
      <rect x="10" y="25" width="8" height="2" fill="#ece6d0" />
      <rect x="32" y="25" width="6" height="4" fill="#b8b09a" />
