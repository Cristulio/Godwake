      <rect x="21" y="35" width="6" height="6" fill="#c89a48" />
      <rect x="21" y="35" width="6" height="1" fill="#ecc46a" />
      <rect x="21" y="35" width="2" height="1" fill="#fff0b8" />
      <rect x="26" y="36" width="1" height="5" fill="#8a6420" />
