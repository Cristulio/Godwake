      <rect x="23" y="17" width="1" height="3" fill="#cdb994" />
      <rect x="23" y="20" width="2" height="1" fill="#9a8a6c" />
      <!-- pursed judging mouth + jowls -->
      <rect x="21" y="22" width="6" height="1" fill="#6a4a34" />
      <rect x="19" y="21" width="1" height="2" fill="#a08c6c" />
