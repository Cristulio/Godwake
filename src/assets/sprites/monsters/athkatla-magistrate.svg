      <rect x="17" y="12" width="14" height="12" fill="#cdb994" />
      <rect x="17" y="12" width="6" height="11" fill="#dcc9a4" />
      <rect x="17" y="12" width="3" height="8" fill="#e8dcc4" />
      <rect x="28" y="12" width="3" height="12" fill="#b6a486" />
