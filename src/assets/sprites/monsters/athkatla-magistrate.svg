      <rect x="10" y="9" width="28" height="2" fill="#2c2a40" />
      <rect x="10" y="9" width="10" height="1" fill="#46445c" />
      <rect x="10" y="9" width="4" height="1" fill="#5c5a74" />
      <rect x="32" y="9" width="6" height="2" fill="#1c1a2c" />
      <rect x="10" y="11" width="28" height="1" fill="#15131f" />

