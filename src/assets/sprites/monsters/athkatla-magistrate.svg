      <rect x="11" y="12" width="6" height="12" fill="#150d08" />
      <rect x="12" y="13" width="4" height="10" fill="#d8d2bc" />
      <rect x="12" y="13" width="2" height="10" fill="#ece6d0" />
      <rect x="12" y="13" width="1" height="6" fill="#f8f4e4" />
      <rect x="12" y="16" width="4" height="1" fill="#b0a890" />
      <rect x="12" y="19" width="4" height="1" fill="#b0a890" />
      <rect x="31" y="12" width="6" height="12" fill="#150d08" />
      <rect x="32" y="13" width="4" height="10" fill="#b8b09a" />
      <rect x="32" y="13" width="1" height="10" fill="#cfc8b0" />
      <rect x="32" y="16" width="4" height="1" fill="#948c74" />
