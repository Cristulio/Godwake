      <rect x="15" y="31" width="2" height="1" fill="#ecc46a" />
      <rect x="17" y="32" width="2" height="1" fill="#c89a48" />
      <rect x="19" y="33" width="2" height="1" fill="#ecc46a" />
      <rect x="33" y="30" width="2" height="1" fill="#8a6420" />
      <rect x="31" y="31" width="2" height="1" fill="#c89a48" />
      <rect x="29" y="32" width="2" height="1" fill="#8a6420" />
