      <rect x="9" y="30" width="6" height="6" fill="#222a5e" />
      <rect x="9" y="30" width="3" height="6" fill="#2c3470" />
      <rect x="9" y="30" width="1" height="4" fill="#3a4080" />
      <rect x="6" y="24" width="8" height="8" fill="#150d08" />
      <rect x="7" y="25" width="6" height="6" fill="#2c3470" />
      <rect x="7" y="25" width="2" height="6" fill="#3a4080" />
