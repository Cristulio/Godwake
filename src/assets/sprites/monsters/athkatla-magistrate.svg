<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 38"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="The Magistrate"
    >
      <!-- Cold court backlight + ground shadow -->
      <ellipse cx="12" cy="20" rx="13" ry="18" fill="#3a4080" opacity="0.08" />
      <ellipse cx="12" cy="37" rx="11" ry="1.4" fill="#000" opacity="0.4" />

      <!-- Wide hat brim — slate ramp -->
      <polygon points="6,2 18,2 22,5 2,5" fill="#2a2838" />
      <polygon points="6,2 18,2 21,4 3,4" fill="#3a3848" />
      <polygon points="6,2 18,2 18,3 6,3" fill="#4a4858" opacity="0.6" />
      <rect x="2" y="4" width="20" height="1" fill="#15131f" />
      <!-- Hat crown + gem -->
      <rect x="9" y="0" width="6" height="3" fill="#1a1828" />
      <rect x="9" y="0" width="6" height="1" fill="#3a3848" />
      <rect x="9" y="0" width="2" height="3" fill="#2a2838" />
      <rect x="11" y="-2" width="2" height="2" fill="#8c6232" />
      <circle cx="12" cy="-2" r="1.5" fill="#d4a850" />
      <circle cx="12" cy="-2" r="0.7" fill="#ffe890" />

      <!-- Gold hat pin -->
      <rect x="20" y="5" width="1" height="4" fill="#d4a850" />
      <rect x="20" y="5" width="1" height="2" fill="#ffe890" />
      <rect x="20" y="9" width="2" height="1" fill="#d4a850" />
      <rect x="20" y="10" width="1" height="2" fill="#8c6232" />

      <!-- Face — parchment ramp -->
      <rect x="8" y="5" width="8" height="7" fill="#d2bea2" />
      <rect x="8" y="5" width="8" height="1" fill="#e2d2b8" />
      <rect x="8" y="5" width="3" height="7" fill="#dccaae" />
      <rect x="8" y="5" width="1" height="6" fill="#e8dcc4" />
      <rect x="14" y="6" width="2" height="6" fill="#b6a486" />
      <rect x="15" y="6" width="1" height="6" fill="#a89878" />
      <rect x="8" y="11" width="8" height="1" fill="#9a8a6c" />
      <!-- Spectacles — silver rims + glint -->
      <rect x="6" y="6" width="2" height="2" fill="#b5b5c8" />
      <rect x="16" y="6" width="2" height="2" fill="#9a9ab0" />
      <rect x="6" y="6" width="1" height="1" fill="#e8e8f0" />
      <rect x="9" y="7" width="2" height="1" fill="#1a1410" />
      <rect x="13" y="7" width="2" height="1" fill="#1a1410" />
      <rect x="9" y="7" width="1" height="1" fill="#a8b8c8" />
      <rect x="14" y="7" width="1" height="1" fill="#8a98a8" />
      <!-- Nose + stern mouth -->
      <rect x="11" y="8" width="2" height="2" fill="#a89878" />
      <rect x="10" y="10" width="4" height="1" fill="#3a2010" />

      <!-- Judicial mantle collar — silver ramp -->
      <polygon points="4,12 12,11 20,12 21,15 3,15" fill="#9a9ab0" />
      <polygon points="4,12 12,11 20,12 20,13 4,13" fill="#e8e8f0" />
      <polygon points="4,13 12,12 20,13 20,14 4,14" fill="#c2c2d4" opacity="0.7" />
      <!-- Gold chain + gavel pendant -->
      <line x1="9" y1="13" x2="12" y2="17" stroke="#d4a850" stroke-width="0.6" />
      <line x1="15" y1="13" x2="12" y2="17" stroke="#a87e34" stroke-width="0.6" />
      <rect x="11" y="17" width="3" height="3" fill="#d4a850" />
      <rect x="11" y="17" width="3" height="1" fill="#ffe890" />
      <rect x="11" y="17" width="1" height="1" fill="#fff4c8" />
      <rect x="12" y="18" width="1" height="1" fill="#5a3c1c" />

      <!-- Robe torso — deep court-blue ramp + dither -->
      <rect x="4" y="13" width="16" height="15" fill="#1a2050" />
      <rect x="4" y="13" width="16" height="1" fill="#3a4080" />
      <rect x="4" y="13" width="3" height="15" fill="#222a5e" />
      <rect x="4" y="13" width="1" height="15" fill="#2c3470" />
      <rect x="17" y="14" width="3" height="14" fill="#141846" />
      <rect x="18" y="14" width="1" height="14" fill="#0e1138" />
      <rect x="11" y="13" width="2" height="15" fill="#0a0a28" />
      <rect x="4" y="27" width="16" height="1" fill="#0a0a28" />
      <rect x="7" y="18" width="1" height="1" fill="#2c3470" />
      <rect x="15" y="22" width="1" height="1" fill="#0e1138" />
      <!-- Silver robe buttons -->
      <rect x="11" y="15" width="2" height="1" fill="#b5b5c8" />
      <rect x="11" y="18" width="2" height="1" fill="#b5b5c8" />
      <rect x="11" y="21" width="2" height="1" fill="#b5b5c8" />
      <rect x="11" y="24" width="2" height="1" fill="#9a9ab0" />

      <!-- Shoulders -->
      <rect x="3" y="13" width="2" height="5" fill="#141846" />
      <rect x="19" y="13" width="2" height="5" fill="#0e1138" />

      <!-- Sleeves — ramped -->
      <polygon points="3,15 0,20 0,26 4,22" fill="#1a2050" />
      <polygon points="3,15 1,20 3,22 4,20" fill="#222a5e" opacity="0.7" />
      <polygon points="21,15 24,20 24,26 20,22" fill="#141846" />
      <polygon points="3,15 1,20 3,20" fill="#0a0a28" opacity="0.5" />
      <polygon points="21,15 23,20 21,20" fill="#0a0a28" opacity="0.5" />
      <!-- Silver cuffs -->
      <rect x="0" y="24" width="5" height="1" fill="#b5b5c8" />
      <rect x="19" y="24" width="5" height="1" fill="#9a9ab0" />
      <rect x="0" y="25" width="5" height="1" fill="#7a7a98" />
      <rect x="19" y="25" width="5" height="1" fill="#6a6a88" />

      <!-- Left hand holding the scales of justice -->
      <rect x="0" y="20" width="3" height="3" fill="#1a1410" />
      <rect x="-1" y="20" width="1" height="3" fill="#1a1410" />
      <polygon points="0,20 -2,18 -1,21" fill="#1a1410" />
      <polygon points="0,23 -2,25 -1,22" fill="#1a1410" />
      <circle cx="-1" cy="21" r="3.5" fill="none" stroke="#b5b5c8" stroke-width="0.6" opacity="0.85" />
      <circle cx="-1" cy="21" r="2.5" fill="none" stroke="#e8e8f0" stroke-width="0.4" opacity="0.85" />
      <circle cx="-1" cy="21" r="1.2" fill="#b5b5c8" opacity="0.55" />
      <rect x="-3" y="21" width="4" height="0.5" fill="#e8e8f0" opacity="0.7" />
      <rect x="-1" y="19" width="0.5" height="4" fill="#e8e8f0" opacity="0.7" />

      <!-- Right hand + gold ring -->
      <rect x="21" y="22" width="3" height="3" fill="#1a1410" />
      <rect x="21" y="22" width="1" height="2" fill="#e8dcc4" />
      <rect x="21" y="22" width="1" height="1" fill="#f4ecd8" />
      <rect x="22" y="23" width="2" height="1" fill="#d4a850" />

      <!-- Waist band + clasp -->
      <rect x="4" y="25" width="16" height="2" fill="#0a0a28" />
      <rect x="11" y="25" width="2" height="2" fill="#b5b5c8" />
      <rect x="11" y="25" width="2" height="1" fill="#e8e8f0" />

      <!-- Robe skirt — ramped + scalloped hem -->
      <polygon points="4,28 20,28 22,35 2,35" fill="#1a2050" />
      <polygon points="4,28 20,28 21,33 3,33" fill="#222a5e" opacity="0.8" />
      <polygon points="4,28 20,28 20,30 4,30" fill="#3a4080" opacity="0.4" />
      <rect x="11" y="28" width="2" height="7" fill="#0a0a28" />
      <rect x="2" y="34" width="20" height="1" fill="#9a9ab0" />
      <polygon points="2,35 5,33 8,35" fill="#1a2050" />
      <polygon points="8,35 11,33 14,35" fill="#1a2050" />
      <polygon points="14,35 17,33 20,35" fill="#141846" />

      <!-- Feet -->
      <rect x="9" y="35" width="2" height="2" fill="#0a0808" />
      <rect x="13" y="35" width="2" height="2" fill="#0a0808" />
    </svg>
