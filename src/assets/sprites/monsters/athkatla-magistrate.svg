<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 48 76"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="The Magistrate"
    >
      <!-- Cold court backlight + warm torch key + ground shadow -->
      <ellipse cx="30" cy="34" rx="17" ry="26" fill="#3a4080" opacity="0.09" />
      <ellipse cx="14" cy="26" rx="13" ry="20" fill="#e8a020" opacity="0.06" />
      <ellipse cx="24" cy="73.5" rx="17" ry="2.3" fill="#000" opacity="0.5" />

      <!-- ══ The Sentence — spectral scales hovering over the raised hand ══ -->
      <ellipse cx="8" cy="9" rx="7" ry="7" fill="#d4b062" opacity="0.13" />
      <!-- beam -->
      <rect x="3" y="6" width="11" height="1" fill="#ecc46a" opacity="0.85" />
      <rect x="8" y="4" width="1" height="3" fill="#ecc46a" opacity="0.85" />
      <rect x="8" y="3" width="1" height="1" fill="#fff0b8" />
      <!-- hanging pans -->
      <rect x="3" y="7" width="1" height="3" fill="#c89a48" opacity="0.7" />
      <rect x="13" y="7" width="1" height="3" fill="#c89a48" opacity="0.7" />
      <rect x="1" y="10" width="5" height="1" fill="#ecc46a" opacity="0.85" />
      <rect x="11" y="10" width="5" height="1" fill="#ecc46a" opacity="0.85" />
      <rect x="2" y="11" width="3" height="1" fill="#c89a48" opacity="0.6" />
      <rect x="12" y="11" width="3" height="1" fill="#c89a48" opacity="0.6" />
      <rect x="4" y="5" width="1" height="1" fill="#fff0b8" opacity="0.9" />
      <rect x="12" y="8" width="1" height="1" fill="#fff0b8" opacity="0.7" />

      <!-- ══ Hat — tall crown, wide brim ══ -->
      <!-- crown -->
      <rect x="17" y="0" width="14" height="8" fill="#150d08" />
      <rect x="18" y="1" width="12" height="7" fill="#262438" />
      <rect x="18" y="1" width="4" height="7" fill="#323048" />
      <rect x="18" y="1" width="1" height="7" fill="#46445c" />
      <rect x="28" y="1" width="2" height="7" fill="#1c1a2c" />
      <!-- silver hatband + buckle -->
      <rect x="18" y="6" width="12" height="2" fill="#15131f" />
      <rect x="22" y="6" width="4" height="2" fill="#9a9ab0" />
      <rect x="22" y="6" width="4" height="1" fill="#c2c2d4" />
      <rect x="23" y="6" width="1" height="1" fill="#e8e8f0" />
