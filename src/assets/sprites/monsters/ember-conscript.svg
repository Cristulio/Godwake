<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 32"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Ember-Conscript"
    >
      <!-- Ember backlight + ground shadow -->
      <ellipse cx="12" cy="16" rx="12" ry="16" fill="#d4641a" opacity="0.08" />
      <ellipse cx="12" cy="30" rx="8" ry="1.4" fill="#000" opacity="0.4" />

      <!-- Burnt helm — iron ramp, key light upper-left -->
      <rect x="8" y="2" width="8" height="7" fill="#3a3038" />
      <rect x="8" y="2" width="8" height="1" fill="#5a5058" />
      <rect x="8" y="2" width="2" height="7" fill="#4a4048" />
      <rect x="8" y="2" width="1" height="4" fill="#5a5058" />
      <rect x="15" y="2" width="1" height="7" fill="#2a2028" />
      <rect x="11" y="0" width="2" height="2" fill="#6a3a1a" />
      <rect x="11" y="0" width="1" height="1" fill="#a83a14" />
      <!-- Visor slit — ember-lit eyes -->
      <rect x="9" y="6" width="6" height="2" fill="#1a1410" />
      <rect x="10" y="6" width="2" height="2" fill="#f4942a" />
      <rect x="13" y="6" width="2" height="2" fill="#f4942a" />
      <rect x="10" y="6" width="1" height="1" fill="#ffd070" />
      <rect x="13" y="6" width="1" height="1" fill="#ffd070" />

      <!-- Scorched cuirass — iron ramp with ember cracks -->
      <rect x="7" y="9" width="10" height="13" fill="#3a3038" />
      <rect x="7" y="9" width="10" height="1" fill="#4a4048" />
      <rect x="7" y="9" width="2" height="13" fill="#42383f" />
      <rect x="7" y="9" width="1" height="13" fill="#2a2028" />
      <rect x="15" y="9" width="2" height="13" fill="#2a2028" />
      <rect x="11" y="10" width="2" height="11" fill="#2a2028" />
      <!-- Ember seams glowing through the plate -->
      <rect x="8" y="12" width="1" height="8" fill="#d4641a" opacity="0.55" />
      <rect x="15" y="12" width="1" height="8" fill="#d4641a" opacity="0.5" />
      <rect x="9" y="15" width="6" height="1" fill="#a83a14" opacity="0.7" />
      <rect x="9" y="15" width="2" height="1" fill="#f4942a" opacity="0.6" />
      <rect x="10" y="18" width="3" height="1" fill="#d4641a" opacity="0.5" />

      <!-- Shield arm -->
      <rect x="2" y="11" width="5" height="11" fill="#4a3a2a" />
      <rect x="2" y="11" width="5" height="1" fill="#5a4a36" />
      <rect x="2" y="11" width="1" height="11" fill="#6a5440" />
      <rect x="6" y="11" width="1" height="11" fill="#2a2018" />
      <rect x="3" y="13" width="3" height="3" fill="#2a2018" />
      <rect x="4" y="14" width="1" height="1" fill="#e87820" />
      <rect x="4" y="14" width="1" height="1" fill="#ffd070" opacity="0.7" />

      <!-- Right arm + ember-edged blade -->
      <rect x="17" y="13" width="2" height="3" fill="#3a3038" />
      <rect x="17" y="13" width="1" height="3" fill="#4a4048" />
      <rect x="18" y="4" width="2" height="12" fill="#5a5058" />
      <rect x="18" y="4" width="1" height="12" fill="#7a7078" />
      <!-- Heated cutting edge -->
      <rect x="18" y="4" width="2" height="5" fill="#e87820" />
      <rect x="18" y="4" width="1" height="3" fill="#ffd070" />
      <rect x="18" y="4" width="1" height="1" fill="#fff4d0" />
      <rect x="17" y="15" width="4" height="2" fill="#2a2028" />

      <!-- Legs -->
      <rect x="8" y="22" width="3" height="8" fill="#3a3038" />
      <rect x="13" y="22" width="3" height="8" fill="#3a3038" />
      <rect x="8" y="22" width="1" height="8" fill="#4a4048" />
      <rect x="13" y="22" width="1" height="8" fill="#2a2028" />
      <rect x="8" y="30" width="4" height="2" fill="#1a1410" />
      <rect x="13" y="30" width="4" height="2" fill="#1a1410" />

      <!-- Drifting embers -->
      <rect x="6" y="23" width="1" height="1" fill="#f4942a" opacity="0.6" />
      <rect x="16" y="20" width="1" height="1" fill="#f4942a" opacity="0.55" />
      <rect x="10" y="26" width="1" height="1" fill="#d4641a" opacity="0.5" />
      <rect x="20" y="2" width="1" height="1" fill="#ffd070" opacity="0.5" />
    </svg>
