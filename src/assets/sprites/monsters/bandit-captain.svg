<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 22 36"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
    >
      <!-- Warm tavern backlight + ground shadow -->
      <ellipse cx="11" cy="18" rx="11" ry="16" fill="#7a4028" opacity="0.08" />
      <ellipse cx="11" cy="35" rx="8" ry="1.4" fill="#000" opacity="0.42" />

      <!-- Brimmed hat — leather ramp -->
      <polygon points="3,3 19,3 17,1 5,1" fill="#3a2418" />
      <rect x="3" y="3" width="16" height="2" fill="#3a2418" />
      <rect x="3" y="3" width="16" height="1" fill="#6b4a2e" />
      <rect x="2" y="4" width="18" height="1" fill="#5a4030" />
      <rect x="2" y="4" width="6" height="1" fill="#7a5638" />
      <rect x="6" y="3" width="10" height="1" fill="#1a1410" />
      <rect x="5" y="1" width="6" height="1" fill="#5a4030" />
      <!-- Red feather -->
      <rect x="10" y="2" width="2" height="2" fill="#b53c4a" />
      <rect x="10" y="2" width="1" height="1" fill="#e06a5a" />

      <!-- Face — tan ramp, key upper-left -->
      <rect x="6" y="5" width="10" height="5" fill="#c4986a" />
      <rect x="6" y="5" width="10" height="1" fill="#d4a878" />
      <rect x="6" y="5" width="3" height="4" fill="#d4a878" />
      <rect x="6" y="5" width="1" height="3" fill="#e8c094" />
      <rect x="5" y="6" width="1" height="4" fill="#8a6244" />
      <rect x="14" y="6" width="2" height="4" fill="#a87858" />
      <rect x="16" y="6" width="1" height="4" fill="#7a5440" />

      <!-- Eyes — dark with amber glint -->
      <rect x="7" y="6" width="2" height="2" fill="#0a0808" />
      <rect x="13" y="6" width="2" height="2" fill="#0a0808" />
      <rect x="7" y="6" width="1" height="1" fill="#f4d042" />
      <rect x="13" y="6" width="1" height="1" fill="#f4d042" />
      <rect x="8" y="7" width="1" height="1" fill="#fff4a0" opacity="0.5" />

      <!-- Brow / cheek shadow -->
      <rect x="6" y="8" width="2" height="1" fill="#5a4028" />
      <rect x="14" y="8" width="2" height="1" fill="#5a4028" />

      <!-- Grim mouth -->
      <rect x="8" y="9" width="6" height="1" fill="#3a1a08" />
      <rect x="9" y="9" width="1" height="1" fill="#c4986a" opacity="0.6" />

      <!-- Red scarf — ramp -->
      <rect x="5" y="9" width="12" height="2" fill="#7a2828" />
      <rect x="5" y="9" width="12" height="1" fill="#9a3838" />
      <rect x="5" y="10" width="12" height="1" fill="#5a1818" />
      <rect x="6" y="9" width="3" height="1" fill="#b04a48" />

      <!-- Coat collar -->
      <rect x="4" y="11" width="14" height="3" fill="#5a4030" />
      <rect x="4" y="11" width="14" height="1" fill="#7a5638" />
      <rect x="4" y="13" width="14" height="1" fill="#3a2418" />
      <rect x="4" y="11" width="2" height="3" fill="#6b4a2e" />

      <!-- Coat torso — leather ramp -->
      <rect x="5" y="14" width="12" height="9" fill="#6a3a24" />
      <rect x="5" y="14" width="12" height="1" fill="#8a5232" />
      <rect x="5" y="14" width="2" height="8" fill="#7a4028" />
      <rect x="5" y="14" width="1" height="8" fill="#9a5a38" />
      <rect x="15" y="14" width="2" height="8" fill="#4a2818" />
      <rect x="16" y="14" width="1" height="8" fill="#3a1e10" />
      <!-- Dither texture -->
      <rect x="8" y="18" width="1" height="1" fill="#8a5232" />
      <rect x="13" y="20" width="1" height="1" fill="#4a2818" />

      <!-- Gold sash medallion -->
      <polygon points="11,14 9,18 11,22 13,18" fill="#d4b062" />
      <polygon points="11,14 9,18 11,18" fill="#f4d042" />
      <rect x="10" y="17" width="2" height="2" fill="#5a1208" />
      <rect x="10" y="17" width="1" height="1" fill="#8c2010" />

      <!-- Belt -->
      <rect x="5" y="21" width="12" height="2" fill="#1a1410" />
      <rect x="5" y="21" width="12" height="1" fill="#3a2418" />
      <rect x="10" y="21" width="2" height="2" fill="#d4b062" />
      <rect x="10" y="21" width="1" height="1" fill="#f4d042" />

      <!-- Arms -->
      <rect x="2" y="12" width="2" height="6" fill="#6a3a24" />
      <rect x="2" y="12" width="1" height="6" fill="#7a4028" />
      <rect x="2" y="12" width="2" height="2" fill="#3a2418" />
      <rect x="1" y="17" width="3" height="2" fill="#c4986a" />
      <rect x="1" y="17" width="3" height="1" fill="#d4a878" />

      <rect x="18" y="12" width="2" height="6" fill="#4a2818" />
      <rect x="18" y="12" width="1" height="6" fill="#6a3a24" />
      <rect x="18" y="12" width="2" height="2" fill="#3a2418" />
      <rect x="18" y="17" width="3" height="2" fill="#a87858" />
      <rect x="18" y="17" width="3" height="1" fill="#c4986a" />

      <!-- Saber — steel ramp + specular -->
      <rect x="19" y="6" width="2" height="13" fill="#8a91a4" />
      <rect x="20" y="6" width="1" height="13" fill="#e8eef8" />
      <rect x="19" y="6" width="1" height="13" fill="#6a7080" />
      <rect x="20" y="8" width="1" height="2" fill="#ffffff" />
      <rect x="18" y="19" width="4" height="1" fill="#6b4a2e" />
      <rect x="19" y="20" width="2" height="2" fill="#3a2418" />

      <!-- Flintlock at hip -->
      <rect x="0" y="13" width="2" height="3" fill="#1a1410" />
      <rect x="0" y="13" width="3" height="2" fill="#5a4030" />
      <rect x="0" y="13" width="3" height="1" fill="#7a5638" />
      <circle cx="0" cy="15" r="1" fill="#d4b062" />

      <!-- Coat tails -->
      <rect x="4" y="23" width="14" height="2" fill="#3a2418" />
      <rect x="4" y="23" width="14" height="1" fill="#5a4030" />

      <!-- Legs -->
      <rect x="5" y="25" width="4" height="6" fill="#3a2418" />
      <rect x="13" y="25" width="4" height="6" fill="#2a1810" />
      <rect x="5" y="25" width="1" height="6" fill="#5a4030" />
      <rect x="13" y="25" width="1" height="6" fill="#3a2418" />

      <!-- Boots -->
      <rect x="4" y="31" width="6" height="4" fill="#1a1410" />
      <rect x="12" y="31" width="6" height="4" fill="#140e0a" />
      <rect x="4" y="31" width="6" height="1" fill="#3a2418" />
      <rect x="12" y="31" width="6" height="1" fill="#2a1810" />
    </svg>
