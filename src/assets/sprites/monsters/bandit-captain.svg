<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 49"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Bandit Captain"
    >
      <!-- Warm tavern backlight + ground shadow -->
      <ellipse cx="15" cy="23" rx="14" ry="21" fill="#7a4028" opacity="0.08" />
      <ellipse cx="14" cy="18" rx="10" ry="13" fill="#ffb040" opacity="0.05" />
      <ellipse cx="15" cy="47.6" rx="10" ry="1.8" fill="#000" opacity="0.42" />

      <!-- ── Brimmed hat — swept leather, red feather ── -->
      <rect x="6" y="0" width="17" height="4" fill="#150d08" />
      <rect x="7" y="1" width="15" height="2" fill="#3a2418" />
      <rect x="7" y="1" width="15" height="1" fill="#6b4a2e" />
      <rect x="7" y="1" width="5" height="1" fill="#8a6238" />
      <!-- wide brim -->
      <rect x="3" y="4" width="24" height="3" fill="#150d08" />
      <rect x="4" y="5" width="22" height="1" fill="#5a4030" />
      <rect x="4" y="5" width="8" height="1" fill="#7a5638" />
      <rect x="4" y="6" width="22" height="1" fill="#2a1810" />
      <!-- brim upturn left -->
      <rect x="3" y="3" width="3" height="2" fill="#150d08" />
      <rect x="4" y="4" width="1" height="1" fill="#7a5638" />
      <!-- red feather sweeping right -->
      <rect x="18" y="0" width="6" height="2" fill="#150d08" />
      <rect x="22" y="1" width="4" height="2" fill="#150d08" />
      <rect x="19" y="1" width="3" height="1" fill="#b53c4a" />
      <rect x="19" y="1" width="1" height="1" fill="#e06a5a" />
      <rect x="22" y="2" width="3" height="1" fill="#8c2434" />

      <!-- ── Face — weathered tan, smirk + stubble ── -->
      <rect x="8" y="7" width="14" height="8" fill="#150d08" />
      <rect x="9" y="8" width="12" height="6" fill="#c4986a" />
      <rect x="9" y="8" width="12" height="1" fill="#d4a878" />
      <rect x="9" y="8" width="3" height="6" fill="#d4a878" />
      <rect x="9" y="8" width="1" height="4" fill="#e8c094" />
      <rect x="18" y="8" width="3" height="6" fill="#a87858" />
      <rect x="20" y="9" width="1" height="5" fill="#7a5440" />
      <rect x="20" y="10" width="1" height="2" fill="#3e5650" />
      <!-- hat shadow across the brow -->
      <rect x="9" y="8" width="12" height="1" fill="#5a4028" opacity="0.6" />

      <!-- eyes — sharp amber glint -->
      <rect x="10" y="9" width="3" height="2" fill="#0a0808" />
      <rect x="16" y="9" width="3" height="2" fill="#0a0808" />
      <rect x="10" y="10" width="2" height="1" fill="#f4d042" />
      <rect x="16" y="10" width="2" height="1" fill="#e0b830" />
      <rect x="10" y="10" width="1" height="1" fill="#fff4a0" />
      <rect x="16" y="10" width="1" height="1" fill="#ffe080" />
      <!-- scar through the left brow -->
      <rect x="11" y="8" width="1" height="1" fill="#8a5440" />
      <rect x="12" y="11" width="1" height="1" fill="#8a5440" />
      <!-- nose + crooked smirk -->
      <rect x="14" y="11" width="2" height="1" fill="#a87858" />
      <rect x="11" y="12" width="6" height="1" fill="#3a1a08" />
      <rect x="16" y="13" width="2" height="1" fill="#3a1a08" />
      <!-- stubble dither -->
      <rect x="10" y="13" width="1" height="1" fill="#8a6244" />
      <rect x="13" y="13" width="1" height="1" fill="#8a6244" />
      <rect x="18" y="13" width="1" height="1" fill="#6e4c36" />

      <!-- ── Red scarf knotted at the throat ── -->
      <rect x="8" y="14" width="14" height="3" fill="#150d08" />
      <rect x="9" y="15" width="12" height="2" fill="#7a2828" />
      <rect x="9" y="15" width="12" height="1" fill="#9a3838" />
      <rect x="9" y="15" width="4" height="1" fill="#b04a48" />
      <rect x="18" y="16" width="3" height="1" fill="#5a1818" />
      <!-- knot tail -->
      <rect x="19" y="17" width="3" height="2" fill="#150d08" />
      <rect x="20" y="17" width="1" height="2" fill="#7a2828" />

      <!-- ── Long leather coat — collar + lapels ── -->
      <rect x="4" y="17" width="22" height="5" fill="#150d08" />
      <rect x="5" y="18" width="20" height="3" fill="#5a4030" />
      <rect x="5" y="18" width="20" height="1" fill="#7a5638" />
      <rect x="5" y="18" width="3" height="3" fill="#6b4a2e" />
      <rect x="22" y="18" width="3" height="3" fill="#3a2418" />
      <!-- torso -->
      <rect x="5" y="21" width="20" height="13" fill="#150d08" />
      <rect x="6" y="22" width="18" height="11" fill="#6a3a24" />
      <rect x="6" y="22" width="18" height="1" fill="#8a5232" />
      <rect x="6" y="22" width="3" height="10" fill="#7a4028" />
      <rect x="6" y="22" width="1" height="10" fill="#9a5a38" />
      <rect x="21" y="22" width="3" height="10" fill="#4a2818" />
      <rect x="23" y="23" width="1" height="9" fill="#3a1e10" />
      <!-- coat seam + buttons -->
      <rect x="14" y="22" width="1" height="11" fill="#3a1e10" />
      <rect x="12" y="24" width="1" height="1" fill="#d4b062" />
      <rect x="12" y="27" width="1" height="1" fill="#d4b062" />
      <rect x="12" y="30" width="1" height="1" fill="#9a7e2e" />
      <!-- gold sash medallion across the chest -->
      <rect x="15" y="23" width="4" height="4" fill="#150d08" />
      <rect x="16" y="24" width="2" height="2" fill="#d4b062" />
      <rect x="16" y="24" width="1" height="1" fill="#f4d042" />
      <rect x="17" y="25" width="1" height="1" fill="#9a7e2e" />
      <!-- leather dither -->
      <rect x="9" y="25" width="1" height="1" fill="#8a5232" />
      <rect x="19" y="29" width="1" height="1" fill="#3a1e10" />

      <!-- ── Left arm — flintlock drawn low ── -->
      <rect x="2" y="19" width="5" height="10" fill="#150d08" />
      <rect x="3" y="20" width="3" height="8" fill="#6a3a24" />
      <rect x="3" y="20" width="1" height="8" fill="#7a4028" />
      <rect x="5" y="20" width="1" height="8" fill="#4a2818" />
      <rect x="2" y="28" width="5" height="3" fill="#150d08" />
      <rect x="3" y="29" width="3" height="1" fill="#c4986a" />
      <!-- flintlock pistol -->
      <rect x="0" y="30" width="6" height="3" fill="#150d08" />
      <rect x="1" y="31" width="4" height="1" fill="#5a4030" />
      <rect x="1" y="31" width="2" height="1" fill="#7a5638" />
      <rect x="0" y="31" width="1" height="1" fill="#39424f" />
      <rect x="4" y="32" width="1" height="1" fill="#d4b062" />

      <!-- ── Right arm — saber at rest on the shoulder ── -->
      <rect x="23" y="19" width="5" height="10" fill="#150d08" />
      <rect x="24" y="20" width="3" height="8" fill="#4a2818" />
      <rect x="24" y="20" width="1" height="8" fill="#6a3a24" />
      <rect x="26" y="20" width="1" height="8" fill="#3a1e10" />
      <rect x="24" y="28" width="4" height="3" fill="#150d08" />
      <rect x="25" y="29" width="2" height="1" fill="#a87858" />

      <!-- ── Saber — curved steel, edge specular ── -->
      <rect x="25" y="6" width="4" height="23" fill="#150d08" />
      <rect x="26" y="7" width="1" height="21" fill="#8a91a4" />
      <rect x="27" y="7" width="1" height="20" fill="#5a6478" />
      <rect x="26" y="7" width="1" height="6" fill="#c8cfe0" />
      <rect x="26" y="8" width="1" height="2" fill="#f2f0e4" />
      <!-- curved tip -->
      <rect x="24" y="4" width="3" height="3" fill="#150d08" />
      <rect x="25" y="5" width="1" height="2" fill="#c8cfe0" />
      <!-- guard + grip -->
      <rect x="24" y="28" width="5" height="1" fill="#9a7e2e" />
      <rect x="24" y="28" width="2" height="1" fill="#d4b062" />
      <rect x="26" y="29" width="2" height="3" fill="#150d08" />
      <rect x="26" y="29" width="1" height="2" fill="#3a2418" />

      <!-- ── Belt + coat tails ── -->
      <rect x="5" y="34" width="20" height="2" fill="#150d08" />
      <rect x="6" y="34" width="18" height="1" fill="#3a2418" />
      <rect x="13" y="34" width="3" height="2" fill="#9a7e2e" />
      <rect x="13" y="34" width="2" height="1" fill="#f4d042" />
      <!-- split tails -->
      <rect x="5" y="36" width="9" height="3" fill="#150d08" />
      <rect x="6" y="37" width="7" height="1" fill="#3a2418" />
      <rect x="16" y="36" width="9" height="3" fill="#150d08" />
      <rect x="17" y="37" width="7" height="1" fill="#2a1810" />

      <!-- ── Legs ── -->
      <rect x="7" y="38" width="6" height="6" fill="#150d08" />
      <rect x="8" y="39" width="4" height="5" fill="#3a2418" />
      <rect x="8" y="39" width="1" height="5" fill="#5a4030" />
      <rect x="17" y="38" width="6" height="6" fill="#150d08" />
      <rect x="18" y="39" width="4" height="5" fill="#2a1810" />
      <rect x="18" y="39" width="1" height="5" fill="#3a2418" />

      <!-- ── Tall boots — folded cuffs ── -->
      <rect x="6" y="43" width="8" height="2" fill="#150d08" />
      <rect x="7" y="43" width="6" height="1" fill="#5a4030" />
      <rect x="6" y="44" width="8" height="4" fill="#150d08" />
      <rect x="7" y="45" width="6" height="2" fill="#1f1812" />
      <rect x="7" y="45" width="6" height="1" fill="#3a2418" />
      <rect x="16" y="43" width="8" height="2" fill="#150d08" />
      <rect x="17" y="43" width="6" height="1" fill="#4a3322" />
      <rect x="16" y="44" width="8" height="4" fill="#150d08" />
      <rect x="17" y="45" width="6" height="2" fill="#191310" />
      <rect x="17" y="45" width="6" height="1" fill="#2a1810" />
    </svg>
