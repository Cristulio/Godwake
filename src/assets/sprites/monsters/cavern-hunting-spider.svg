<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 28 22"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Cavern Hunting-Spider"
    >
      <!-- web strands behind -->
      <line x1="2" y1="2" x2="26" y2="4" stroke="#4a4a52" stroke-width="0.4" opacity="0.5" />
      <line x1="3" y1="6" x2="25" y2="3" stroke="#4a4a52" stroke-width="0.4" opacity="0.5" />

      <!-- legs -->
      <line x1="11" y1="12" x2="3" y2="4" stroke="#1a120f" stroke-width="0.9" />
      <line x1="11" y1="13" x2="2" y2="9" stroke="#1a120f" stroke-width="0.9" />
      <line x1="11" y1="15" x2="2" y2="16" stroke="#1a120f" stroke-width="0.9" />
      <line x1="11" y1="16" x2="3" y2="20" stroke="#1a120f" stroke-width="0.9" />
      <line x1="17" y1="12" x2="25" y2="4" stroke="#1a120f" stroke-width="0.9" />
      <line x1="17" y1="13" x2="26" y2="9" stroke="#1a120f" stroke-width="0.9" />
      <line x1="17" y1="15" x2="26" y2="16" stroke="#1a120f" stroke-width="0.9" />
      <line x1="17" y1="16" x2="25" y2="20" stroke="#1a120f" stroke-width="0.9" />

      <!-- abdomen -->
      <ellipse cx="18" cy="14" rx="7" ry="5" fill="#241a14" />
      <ellipse cx="18" cy="13" rx="6" ry="4" fill="#342820" />
      <!-- pale chevron markings -->
      <polygon points="18,10 16,13 20,13" fill="#5a4632" />
      <rect x="17" y="14" width="2" height="1" fill="#5a4632" />

      <!-- cephalothorax + head -->
      <ellipse cx="10" cy="14" rx="5" ry="4" fill="#342820" />
      <ellipse cx="8" cy="13" rx="3" ry="2" fill="#443628" />

      <!-- eyes -->
      <rect x="6" y="12" width="1" height="1" fill="#f4d042" />
      <rect x="8" y="11" width="1" height="1" fill="#f4d042" />
      <rect x="6" y="14" width="1" height="1" fill="#c4a430" />
      <rect x="9" y="13" width="1" height="1" fill="#c4a430" />

      <!-- fangs -->
      <polygon points="5,15 4,18 6,16" fill="#1a120f" />
      <polygon points="7,15 6,18 8,16" fill="#1a120f" />
    </svg>
