<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 40 64"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Szendra"
    >
      <!-- Arcane violet backlight + ground shadow -->
      <ellipse cx="20" cy="30" rx="19" ry="29" fill="#5a30a0" opacity="0.1" />
      <ellipse cx="20" cy="61.6" rx="14" ry="2.2" fill="#000" opacity="0.45" />

      <!-- ══ Orbiting spell-motes ══ -->
      <rect x="4" y="18" width="2" height="2" fill="#a48ee0" opacity="0.9" />
      <rect x="5" y="18" width="1" height="1" fill="#e8d4ff" />
      <ellipse cx="5" cy="19" rx="3" ry="3" fill="#a48ee0" opacity="0.15" />
      <rect x="34" y="26" width="2" height="2" fill="#8a6ec8" opacity="0.85" />
      <rect x="34" y="26" width="1" height="1" fill="#d4c4f8" />
      <ellipse cx="35" cy="27" rx="3" ry="3" fill="#8a6ec8" opacity="0.13" />

      <!-- ══ Spiked gold crown + amethyst ══ -->
      <rect x="12" y="2" width="16" height="4" fill="#150d08" />
      <rect x="13" y="3" width="14" height="3" fill="#c0a040" />
      <rect x="13" y="3" width="5" height="1" fill="#f4d042" />
      <rect x="24" y="3" width="3" height="3" fill="#9a7e2e" />
      <!-- crown spikes -->
      <rect x="13" y="0" width="2" height="3" fill="#150d08" />
      <rect x="14" y="1" width="1" height="2" fill="#f4d042" />
      <rect x="19" y="0" width="2" height="3" fill="#150d08" />
      <rect x="19" y="0" width="1" height="3" fill="#fff4c0" />
      <rect x="25" y="0" width="2" height="3" fill="#150d08" />
      <rect x="25" y="1" width="1" height="2" fill="#c0a040" />
      <!-- amethyst centre -->
      <rect x="18" y="3" width="4" height="3" fill="#150d08" />
      <rect x="19" y="4" width="2" height="2" fill="#a48ee0" />
      <rect x="19" y="4" width="1" height="1" fill="#e8d4ff" />

      <!-- ══ High white coif + face ══ -->
      <!-- swept-up white hair -->
      <rect x="11" y="6" width="18" height="4" fill="#150d08" />
      <rect x="12" y="7" width="16" height="3" fill="#e8e0c4" />
      <rect x="12" y="7" width="6" height="2" fill="#f4eed8" />
      <rect x="24" y="7" width="4" height="3" fill="#cfc6ac" />
      <!-- side falls -->
      <rect x="9" y="9" width="4" height="12" fill="#150d08" />
      <rect x="10" y="10" width="2" height="10" fill="#e8e0c4" />
      <rect x="10" y="10" width="1" height="7" fill="#f4eed8" />
      <rect x="27" y="9" width="4" height="12" fill="#150d08" />
      <rect x="28" y="10" width="2" height="10" fill="#cfc6ac" />
      <rect x="29" y="10" width="1" height="10" fill="#b0a68c" />
      <!-- obsidian face -->
      <rect x="12" y="9" width="16" height="13" fill="#150d08" />
      <rect x="13" y="10" width="14" height="11" fill="#3a2e40" />
      <rect x="13" y="10" width="5" height="11" fill="#4c3c50" />
      <rect x="13" y="10" width="2" height="7" fill="#5e4a5e" />
      <rect x="24" y="10" width="3" height="11" fill="#2e2334" />
      <rect x="26" y="10" width="1" height="11" fill="#241b28" />
      <!-- pointed ears -->
      <rect x="10" y="13" width="3" height="3" fill="#150d08" />
      <rect x="11" y="14" width="2" height="1" fill="#4c3c50" />
      <rect x="27" y="13" width="3" height="3" fill="#150d08" />
      <rect x="27" y="14" width="2" height="1" fill="#2e2334" />
      <!-- cold red eyes -->
      <rect x="15" y="13" width="3" height="2" fill="#0f0a12" />
      <rect x="21" y="13" width="3" height="2" fill="#0f0a12" />
      <rect x="15" y="13" width="2" height="2" fill="#b53c4a" />
      <rect x="22" y="13" width="2" height="2" fill="#8c2838" />
      <rect x="15" y="13" width="1" height="1" fill="#f4d042" />
      <rect x="22" y="13" width="1" height="1" fill="#d4a030" />
      <!-- slim nose + imperious mouth -->
      <rect x="19" y="15" width="1" height="3" fill="#2e2334" />
      <rect x="17" y="19" width="6" height="1" fill="#5e2440" />
      <rect x="17" y="19" width="2" height="1" fill="#7e3454" />

      <!-- ══ Silver-violet vestments ══ -->
      <!-- collar -->
      <rect x="11" y="21" width="18" height="4" fill="#150d08" />
      <rect x="12" y="22" width="16" height="3" fill="#3a1858" />
      <rect x="12" y="22" width="6" height="3" fill="#46206a" />
      <rect x="12" y="22" width="16" height="1" fill="#5a30a0" />
      <rect x="14" y="23" width="1" height="1" fill="#b5b5c8" />
      <rect x="19" y="23" width="1" height="1" fill="#e8e8f0" />
      <rect x="24" y="23" width="1" height="1" fill="#9a9ab0" />
      <!-- robe body -->
      <rect x="10" y="25" width="20" height="24" fill="#150d08" />
      <rect x="11" y="26" width="18" height="23" fill="#2a0f48" />
      <rect x="11" y="26" width="6" height="23" fill="#341458" />
      <rect x="11" y="26" width="3" height="17" fill="#3f1d68" />
      <rect x="25" y="26" width="4" height="23" fill="#220a3a" />
      <rect x="27" y="26" width="2" height="23" fill="#1a0630" />
      <!-- silver web-thread filigree -->
      <rect x="13" y="28" width="3" height="1" fill="#8a82a8" opacity="0.7" />
      <rect x="16" y="29" width="3" height="1" fill="#8a82a8" opacity="0.55" />
      <rect x="24" y="30" width="3" height="1" fill="#8a82a8" opacity="0.5" />
      <rect x="13" y="38" width="2" height="1" fill="#8a82a8" opacity="0.5" />
      <rect x="25" y="40" width="2" height="1" fill="#8a82a8" opacity="0.45" />
      <!-- center seam -->
      <rect x="19" y="26" width="2" height="23" fill="#1a0630" />
      <!-- silver girdle -->
      <rect x="10" y="36" width="20" height="2" fill="#150d08" />
      <rect x="11" y="36" width="18" height="1" fill="#9a9ab0" />
      <rect x="11" y="36" width="6" height="1" fill="#c2c2d4" />

      <!-- ══ Left arm — casting, palm up ══ -->
      <rect x="6" y="25" width="6" height="8" fill="#150d08" />
      <rect x="7" y="26" width="4" height="6" fill="#341458" />
      <rect x="7" y="26" width="2" height="6" fill="#3f1d68" />
      <rect x="4" y="31" width="7" height="7" fill="#150d08" />
      <rect x="5" y="32" width="5" height="5" fill="#2a0f48" />
      <rect x="5" y="32" width="2" height="5" fill="#341458" />
      <!-- wide silk cuff -->
      <rect x="3" y="36" width="8" height="3" fill="#150d08" />
      <rect x="4" y="37" width="6" height="1" fill="#46206a" />
      <!-- obsidian hand, palm up -->
      <rect x="3" y="39" width="7" height="4" fill="#150d08" />
      <rect x="4" y="40" width="5" height="2" fill="#4c3c50" />
      <rect x="4" y="40" width="2" height="2" fill="#5e4a5e" />
      <!-- the spell coalescing above the palm -->
      <rect x="4" y="34" width="3" height="3" fill="#a48ee0" />
      <rect x="4" y="34" width="2" height="2" fill="#d4c4f8" />
      <rect x="4" y="34" width="1" height="1" fill="#f4f0ff" />
      <ellipse cx="6" cy="36" rx="5" ry="4" fill="#a48ee0" opacity="0.16" />

      <!-- ══ Right arm — serpent-staff ══ -->
      <rect x="28" y="25" width="6" height="8" fill="#150d08" />
      <rect x="29" y="26" width="4" height="6" fill="#220a3a" />
      <rect x="29" y="26" width="2" height="6" fill="#2a0f48" />
      <!-- hand on the staff -->
      <rect x="29" y="31" width="6" height="5" fill="#150d08" />
      <rect x="30" y="32" width="4" height="3" fill="#3a2e40" />
      <rect x="30" y="32" width="2" height="3" fill="#4c3c50" />
      <!-- the staff -->
      <rect x="31" y="8" width="4" height="46" fill="#150d08" />
      <rect x="32" y="9" width="2" height="44" fill="#3a2030" />
      <rect x="32" y="9" width="1" height="44" fill="#52304a" />
      <!-- serpent-head finial -->
      <rect x="29" y="2" width="8" height="7" fill="#150d08" />
      <rect x="30" y="3" width="6" height="5" fill="#3a5018" />
      <rect x="30" y="3" width="3" height="5" fill="#4a7022" />
      <rect x="30" y="3" width="1" height="3" fill="#6a9a32" />
      <!-- serpent eye + fangs -->
      <rect x="31" y="4" width="2" height="2" fill="#f4d042" />
      <rect x="31" y="4" width="1" height="1" fill="#fff8d0" />
      <rect x="30" y="8" width="1" height="2" fill="#e8e0cc" />
      <rect x="33" y="8" width="1" height="1" fill="#cdc4ac" />
      <!-- forked tongue -->
      <rect x="28" y="5" width="2" height="1" fill="#b53c4a" />
      <rect x="27" y="4" width="1" height="1" fill="#8c2838" />

      <!-- ══ Skirt + slippers ══ -->
      <rect x="9" y="49" width="22" height="10" fill="#150d08" />
      <rect x="10" y="50" width="20" height="8" fill="#2a0f48" />
      <rect x="10" y="50" width="6" height="8" fill="#341458" />
      <rect x="26" y="50" width="4" height="8" fill="#220a3a" />
      <rect x="16" y="50" width="1" height="8" fill="#220a3a" />
      <rect x="23" y="50" width="1" height="8" fill="#1a0630" />
      <!-- silver hem -->
      <rect x="10" y="56" width="20" height="1" fill="#8a82a8" opacity="0.8" />
      <rect x="10" y="56" width="7" height="1" fill="#b5b5c8" />
      <rect x="10" y="57" width="20" height="1" fill="#100624" />
      <!-- slippers -->
      <rect x="13" y="58" width="6" height="3" fill="#150d08" />
      <rect x="14" y="59" width="4" height="1" fill="#3a2e40" />
      <rect x="22" y="58" width="6" height="3" fill="#150d08" />
      <rect x="23" y="59" width="4" height="1" fill="#2e2334" />

      <!-- arcane motes -->
      <rect x="8" y="12" width="1" height="1" fill="#a48ee0" opacity="0.55" />
      <rect x="36" y="16" width="1" height="1" fill="#8a6ec8" opacity="0.5" />
      <rect x="6" y="50" width="1" height="1" fill="#a48ee0" opacity="0.4" />
      <rect x="36" y="46" width="1" height="1" fill="#d4c4f8" opacity="0.4" />
    </svg>
