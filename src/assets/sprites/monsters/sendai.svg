<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 26 42"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Szendra"
    >
      <!-- Arcane violet backlight + ground shadow -->
      <ellipse cx="13" cy="20" rx="13" ry="20" fill="#5a30a0" opacity="0.1" />
      <ellipse cx="13" cy="40" rx="10" ry="1.8" fill="#000" opacity="0.42" />

      <!-- Spiked gold crown + amethyst -->
      <polygon points="8,1 13,-3 18,1 18,5 8,5" fill="#c0a040" />
      <polygon points="8,1 13,-3 18,1 18,3 8,3" fill="#d8bc58" />
      <polygon points="10,0 13,-3 16,0" fill="#f4d042" />
      <polygon points="11,-1 13,-3 15,-1" fill="#fff0a0" />
      <rect x="12" y="-3" width="2" height="2" fill="#a48ee0" />
      <rect x="12" y="-3" width="1" height="1" fill="#e8d4ff" />
      <rect x="9" y="0" width="1" height="2" fill="#f4d042" />
      <rect x="16" y="0" width="1" height="2" fill="#c0a040" />

      <!-- Drow face — dusk ramp -->
      <rect x="8" y="5" width="10" height="7" fill="#4a3a48" />
      <rect x="8" y="5" width="3" height="7" fill="#544252" />
      <rect x="8" y="5" width="1" height="6" fill="#62505e" />
      <rect x="15" y="5" width="3" height="7" fill="#3a2838" />
      <rect x="16" y="6" width="2" height="6" fill="#302030" />
      <rect x="7" y="6" width="1" height="5" fill="#302030" />
      <!-- Eyes + spark -->
      <rect x="9" y="7" width="2" height="2" fill="#b53c4a" />
      <rect x="15" y="7" width="2" height="2" fill="#b53c4a" />
      <rect x="9" y="7" width="1" height="1" fill="#f4d042" />
      <rect x="15" y="7" width="1" height="1" fill="#f4d042" />
      <rect x="10" y="8" width="1" height="1" fill="#e85a4a" opacity="0.7" />
      <rect x="10" y="10" width="6" height="1" fill="#5a1208" />

      <!-- Shoulder mantle -->
      <rect x="4" y="12" width="18" height="3" fill="#3a1858" />
      <rect x="4" y="12" width="18" height="1" fill="#4a2868" />
      <rect x="4" y="12" width="2" height="3" fill="#1a0428" />
      <rect x="20" y="12" width="2" height="3" fill="#160422" />

      <!-- Robe torso — deep violet ramp + sigil + dither -->
      <rect x="5" y="15" width="16" height="15" fill="#2a0a48" />
      <rect x="5" y="15" width="16" height="2" fill="#3a1858" />
      <rect x="5" y="15" width="3" height="15" fill="#330f50" />
      <rect x="5" y="15" width="1" height="15" fill="#3e1a5e" />
      <rect x="19" y="16" width="2" height="14" fill="#200638" />
      <rect x="20" y="16" width="1" height="14" fill="#1a042e" />
      <polygon points="7,15 9,12 11,15" fill="#3a1858" />
      <polygon points="15,15 17,12 19,15" fill="#330f50" />
      <rect x="8" y="20" width="1" height="1" fill="#3e1a5e" />
      <rect x="17" y="24" width="1" height="1" fill="#1a042e" />
      <!-- Bleeding sigil + amethyst core -->
      <rect x="10" y="18" width="6" height="10" fill="#5a1208" />
      <rect x="12" y="19" width="2" height="8" fill="#8c2010" />
      <rect x="11" y="21" width="4" height="3" fill="#a48ee0" />
      <rect x="12" y="22" width="2" height="1" fill="#e8d4ff" />
      <rect x="12" y="22" width="1" height="1" fill="#ffffff" />

      <!-- Arms + stone hand -->
      <rect x="2" y="13" width="3" height="6" fill="#4a3a48" />
      <rect x="2" y="13" width="3" height="1" fill="#544252" />
      <rect x="0" y="18" width="3" height="3" fill="#6b6a66" />
      <rect x="0" y="18" width="3" height="1" fill="#8a8a86" />
      <rect x="0" y="18" width="1" height="1" fill="#a4a4a0" />
      <rect x="21" y="13" width="3" height="6" fill="#3a2838" />
      <!-- Staff + red gem -->
      <rect x="23" y="2" width="2" height="17" fill="#3a2a20" />
      <rect x="23" y="2" width="1" height="17" fill="#4e3828" />
      <rect x="22" y="0" width="4" height="4" fill="#5a1208" />
      <circle cx="24" cy="1.5" r="1.5" fill="#b53c4a" />
      <rect x="23" y="1" width="2" height="2" fill="#e85a4a" />
      <rect x="23" y="1" width="1" height="1" fill="#ffb0a0" />

      <!-- Robe hem -->
      <rect x="5" y="30" width="16" height="2" fill="#1a0428" />
      <polygon points="5,32 8,39 11,32" fill="#2a0a48" />
      <polygon points="5,32 8,38 10,32" fill="#330f50" opacity="0.7" />
      <polygon points="11,32 13,39 15,32" fill="#240740" />
      <polygon points="15,32 18,39 21,32" fill="#2a0a48" />
      <rect x="8" y="39" width="3" height="3" fill="#1a1410" />
      <rect x="15" y="39" width="3" height="3" fill="#161210" />

      <!-- Arcane motes -->
      <rect x="13" y="23" width="1" height="1" fill="#c8b0ff" opacity="0.7" />
      <rect x="3" y="16" width="1" height="1" fill="#f4d042" opacity="0.5" />
      <rect x="20" y="20" width="1" height="1" fill="#c8b0ff" opacity="0.5" />
    </svg>
