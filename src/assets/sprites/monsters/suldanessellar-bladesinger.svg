<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 34 42"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Corrupted Bladesinger"
    >
      <!-- Bladesong shimmer + ground shadow -->
      <ellipse cx="16" cy="22" rx="15" ry="17" fill="#3a8a52" opacity="0.05" />
      <ellipse cx="20" cy="12" rx="9" ry="8" fill="#a87ae0" opacity="0.07" />
      <ellipse cx="15" cy="40.4" rx="10" ry="1.6" fill="#000" opacity="0.4" />

      <!-- Head tilted into the song -->
      <rect x="9" y="2" width="10" height="10" fill="#150d08" />
      <rect x="10" y="3" width="8" height="8" fill="#d4ad78" />
      <rect x="10" y="3" width="8" height="1" fill="#ecd0a0" />
      <rect x="10" y="3" width="3" height="1" fill="#f8e8c4" />
      <rect x="10" y="3" width="1" height="6" fill="#e0bd88" />
      <rect x="16" y="4" width="2" height="7" fill="#b8905c" />
      <rect x="17" y="5" width="1" height="6" fill="#95714a" />
      <!-- long ear -->
      <rect x="7" y="5" width="3" height="2" fill="#150d08" />
      <rect x="8" y="5" width="2" height="1" fill="#d4ad78" />
      <!-- the singer's hair — long, loose, mid-turn -->
      <rect x="10" y="0" width="10" height="3" fill="#150d08" />
      <rect x="11" y="1" width="8" height="1" fill="#e8dcc4" />
      <rect x="11" y="1" width="4" height="1" fill="#f8f2e2" />
      <rect x="18" y="2" width="3" height="8" fill="#150d08" />
      <rect x="19" y="3" width="1" height="6" fill="#cdbfa2" />
      <rect x="20" y="5" width="1" height="4" fill="#b4a486" />
      <!-- charm-hollow eyes -->
      <rect x="11" y="6" width="2" height="2" fill="#1a1322" />
      <rect x="14" y="6" width="2" height="2" fill="#1a1322" />
      <rect x="11" y="6" width="1" height="1" fill="#a87ae0" />
      <rect x="14" y="6" width="1" height="1" fill="#a87ae0" />
      <!-- lips parted on the song no one chose -->
      <rect x="12" y="9" width="3" height="1" fill="#95714a" />
      <rect x="13" y="9" width="1" height="1" fill="#531320" />

      <!-- Song-glyphs hanging where the blade has been -->
      <rect x="24" y="6" width="1" height="1" fill="#c4b0f0" opacity="0.8" />
      <rect x="27" y="9" width="1" height="1" fill="#a87ae0" opacity="0.7" />
      <rect x="25" y="13" width="1" height="1" fill="#d4c4f8" opacity="0.6" />
      <rect x="29" y="16" width="1" height="1" fill="#a87ae0" opacity="0.5" />
      <rect x="22" y="3" width="1" height="1" fill="#c4b0f0" opacity="0.6" />

      <!-- Robes — elven war-silk, green over gold, cut for the dance -->
      <rect x="8" y="12" width="13" height="14" fill="#150d08" />
      <rect x="9" y="13" width="11" height="12" fill="#2e5e3c" />
      <rect x="9" y="13" width="11" height="1" fill="#3a7a4a" />
      <rect x="9" y="13" width="4" height="1" fill="#4a9a5e" />
      <rect x="9" y="13" width="2" height="12" fill="#356a44" />
      <rect x="9" y="13" width="1" height="8" fill="#3a8a52" />
      <rect x="17" y="13" width="3" height="12" fill="#234a30" />
      <rect x="19" y="13" width="1" height="12" fill="#1e3a28" />
      <!-- gold sash crossing the heart -->
      <rect x="9" y="14" width="2" height="2" fill="#c89a48" />
      <rect x="11" y="16" width="2" height="2" fill="#9a7232" />
      <rect x="13" y="18" width="2" height="2" fill="#c89a48" />
      <rect x="15" y="20" width="2" height="2" fill="#9a7232" />
      <rect x="17" y="22" width="2" height="2" fill="#c89a48" />
      <rect x="9" y="14" width="1" height="1" fill="#ecc46a" />
      <rect x="13" y="18" width="1" height="1" fill="#ecc46a" />
      <!-- rot-violet bleeding up the hem -->
      <rect x="9" y="23" width="3" height="2" fill="#2c1a40" />
      <rect x="16" y="24" width="3" height="1" fill="#2c1a40" />
      <rect x="10" y="23" width="1" height="1" fill="#5a3a8a" />

      <!-- Blade arm sweeping the high arc — the song's crest -->
      <rect x="19" y="12" width="6" height="4" fill="#150d08" />
      <rect x="20" y="13" width="4" height="2" fill="#2e5e3c" />
      <rect x="20" y="13" width="4" height="1" fill="#3a8a52" />
      <rect x="23" y="9" width="4" height="5" fill="#150d08" />
      <rect x="24" y="10" width="2" height="3" fill="#356a44" />
      <rect x="24" y="10" width="2" height="1" fill="#3a8a52" />
      <!-- hand high on the curved hilt -->
      <rect x="24" y="6" width="4" height="4" fill="#150d08" />
      <rect x="25" y="7" width="2" height="2" fill="#d4ad78" />
      <rect x="25" y="7" width="1" height="1" fill="#ecd0a0" />
      <!-- the singing blade — a thin crescent mid-stroke, gold-hilted -->
      <rect x="26" y="5" width="2" height="2" fill="#c89a48" />
      <rect x="26" y="5" width="1" height="1" fill="#ecc46a" />
      <rect x="27" y="1" width="3" height="5" fill="#150d08" />
      <rect x="28" y="2" width="1" height="4" fill="#b8d8e0" />
      <rect x="28" y="2" width="1" height="2" fill="#e8f4f8" />
      <rect x="28" y="1" width="4" height="2" fill="#150d08" />
      <rect x="29" y="1" width="3" height="1" fill="#e8f4f8" />
      <rect x="31" y="0" width="3" height="2" fill="#150d08" />
      <rect x="31" y="0" width="3" height="1" fill="#fff" />
      <!-- the blade's wake — the song made visible -->
      <rect x="29" y="6" width="1" height="1" fill="#c4b0f0" opacity="0.6" />
      <rect x="31" y="5" width="1" height="1" fill="#a87ae0" opacity="0.5" />
      <rect x="30" y="8" width="1" height="1" fill="#d4c4f8" opacity="0.45" />

      <!-- Off arm trailing the counter-line of the dance -->
      <rect x="4" y="14" width="5" height="4" fill="#150d08" />
      <rect x="5" y="15" width="3" height="2" fill="#234a30" />
      <rect x="5" y="15" width="3" height="1" fill="#2e5e3c" />
      <rect x="2" y="16" width="4" height="5" fill="#150d08" />
      <rect x="3" y="17" width="2" height="3" fill="#2e5e3c" />
      <rect x="3" y="17" width="1" height="3" fill="#356a44" />
      <!-- open hand, two fingers extended in the singer's mudra -->
      <rect x="2" y="21" width="4" height="3" fill="#150d08" />
      <rect x="3" y="22" width="2" height="1" fill="#d4ad78" />
      <rect x="1" y="23" width="2" height="1" fill="#150d08" />
      <rect x="1" y="23" width="1" height="1" fill="#ecd0a0" />
      <rect x="4" y="24" width="1" height="1" fill="#d4ad78" />

      <!-- Skirted legs mid-step — the dance never stops -->
      <rect x="8" y="26" width="13" height="4" fill="#150d08" />
      <rect x="9" y="27" width="11" height="2" fill="#234a30" />
      <rect x="9" y="27" width="4" height="1" fill="#2e5e3c" />
      <rect x="17" y="27" width="3" height="2" fill="#1e3a28" />
      <!-- lead leg crossing -->
      <rect x="13" y="29" width="6" height="4" fill="#150d08" />
      <rect x="14" y="30" width="4" height="2" fill="#2e5e3c" />
      <rect x="14" y="30" width="4" height="1" fill="#356a44" />
      <rect x="16" y="32" width="4" height="6" fill="#150d08" />
      <rect x="17" y="33" width="2" height="4" fill="#234a30" />
      <rect x="17" y="33" width="1" height="4" fill="#2e5e3c" />
      <!-- trailing leg on point -->
      <rect x="9" y="29" width="4" height="9" fill="#150d08" />
      <rect x="10" y="30" width="2" height="7" fill="#1e3a28" />
      <rect x="10" y="30" width="1" height="7" fill="#234a30" />
      <!-- soft shoes -->
      <rect x="15" y="37" width="6" height="3" fill="#150d08" />
      <rect x="16" y="37" width="4" height="2" fill="#6a3a1a" />
      <rect x="16" y="37" width="2" height="1" fill="#8c5226" />
      <rect x="8" y="38" width="5" height="2" fill="#150d08" />
      <rect x="9" y="38" width="3" height="1" fill="#4a2810" />

      <!-- Leaves caught in the blade-wake -->
      <rect x="5" y="9" width="1" height="1" fill="#3a8a52" opacity="0.5" />
      <rect x="23" y="28" width="1" height="1" fill="#2e5e3c" opacity="0.5" />
      <rect x="6" y="33" width="1" height="1" fill="#5a3a8a" opacity="0.4" />
    </svg>
