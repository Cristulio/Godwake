<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 50"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Bone Stalker"
    >
      <!-- Cold grave backlight + ground shadow -->
      <ellipse cx="16" cy="24" rx="15" ry="22" fill="#4a8278" opacity="0.08" />
      <ellipse cx="15" cy="18" rx="10" ry="13" fill="#ffb040" opacity="0.04" />
      <ellipse cx="16" cy="48.6" rx="11" ry="1.8" fill="#000" opacity="0.42" />

      <!-- ── Skull-crown headdress — oversized carved skull, key upper-left ── -->
      <rect x="6" y="0" width="20" height="3" fill="#150d08" />
      <rect x="7" y="1" width="18" height="1" fill="#7a6848" />
      <rect x="7" y="1" width="10" height="1" fill="#a89878" />
      <rect x="5" y="2" width="22" height="14" fill="#150d08" />
      <rect x="6" y="3" width="20" height="12" fill="#a89878" />
      <rect x="6" y="3" width="8" height="11" fill="#c2b794" />
      <rect x="6" y="3" width="4" height="8" fill="#d4c8a8" />
      <rect x="6" y="3" width="2" height="5" fill="#f0e6cc" />
      <rect x="22" y="4" width="4" height="11" fill="#8c7a52" />
      <rect x="24" y="5" width="2" height="10" fill="#5a4c34" />
      <rect x="25" y="8" width="1" height="4" fill="#3e5650" />
      <!-- carved sigils across the brow -->
      <rect x="13" y="3" width="4" height="1" fill="#5a4030" />
      <rect x="9" y="5" width="3" height="1" fill="#5a4030" />
      <rect x="19" y="5" width="4" height="1" fill="#5a4030" />
      <rect x="11" y="4" width="1" height="1" fill="#5a4030" />

      <!-- ── Hollow sockets — twin ember sparks, uneven ── -->
      <rect x="8" y="7" width="5" height="4" fill="#0a0806" />
      <rect x="19" y="7" width="5" height="4" fill="#0a0806" />
      <rect x="9" y="8" width="2" height="2" fill="#c43020" />
      <rect x="20" y="8" width="2" height="2" fill="#7a2010" />
      <rect x="9" y="8" width="1" height="1" fill="#ff8a4a" />
      <rect x="20" y="8" width="1" height="1" fill="#d4581e" />
      <rect x="8" y="7" width="5" height="1" fill="#1a1208" />
      <rect x="19" y="7" width="5" height="1" fill="#1a1208" />
      <!-- nasal pits -->
      <rect x="13" y="10" width="2" height="3" fill="#0a0806" />
      <rect x="17" y="10" width="2" height="3" fill="#0a0806" />

      <!-- ── Grin — long carved teeth ── -->
      <rect x="8" y="13" width="16" height="3" fill="#0a0806" />
      <rect x="8" y="13" width="2" height="3" fill="#c2b794" />
      <rect x="11" y="13" width="2" height="3" fill="#a89878" />
      <rect x="14" y="13" width="2" height="3" fill="#c2b794" />
      <rect x="17" y="13" width="2" height="3" fill="#8c7a52" />
      <rect x="20" y="13" width="2" height="3" fill="#a89878" />
      <rect x="23" y="13" width="1" height="3" fill="#6e6244" />

      <!-- ── Jawbone pendant ── -->
      <rect x="12" y="16" width="8" height="3" fill="#150d08" />
      <rect x="13" y="17" width="6" height="1" fill="#7a6848" />
      <rect x="13" y="17" width="3" height="1" fill="#a89878" />

      <!-- ── Mantle of dark rags + bone pauldrons ── -->
      <rect x="2" y="18" width="28" height="6" fill="#150d08" />
      <rect x="3" y="19" width="26" height="4" fill="#3a2418" />
      <rect x="3" y="19" width="26" height="1" fill="#5a3a22" />
      <rect x="3" y="19" width="4" height="4" fill="#241610" />
      <rect x="25" y="19" width="4" height="4" fill="#1a1008" />
      <!-- bone shoulder-caps -->
      <rect x="3" y="18" width="7" height="3" fill="#150d08" />
      <rect x="4" y="19" width="5" height="1" fill="#c2b794" />
      <rect x="4" y="19" width="2" height="1" fill="#e8dcc4" />
      <rect x="4" y="20" width="5" height="1" fill="#8c7a52" />
      <rect x="22" y="18" width="7" height="3" fill="#150d08" />
      <rect x="23" y="19" width="5" height="1" fill="#a89878" />
      <rect x="23" y="20" width="5" height="1" fill="#5a4c34" />

      <!-- ── Leather harness torso — rib bindings over wasted bone ── -->
      <rect x="6" y="24" width="20" height="13" fill="#150d08" />
      <rect x="7" y="25" width="18" height="11" fill="#5a3818" />
      <rect x="7" y="25" width="18" height="1" fill="#7a4828" />
      <rect x="7" y="25" width="3" height="10" fill="#6b4022" />
      <rect x="7" y="25" width="1" height="10" fill="#8a5530" />
      <rect x="22" y="25" width="3" height="10" fill="#3a2418" />
      <rect x="24" y="26" width="1" height="9" fill="#2a1810" />
      <!-- strap rows -->
      <rect x="8" y="27" width="16" height="1" fill="#9a5a30" opacity="0.75" />
      <rect x="8" y="30" width="16" height="1" fill="#8c5028" opacity="0.7" />
      <rect x="8" y="33" width="16" height="1" fill="#7a4828" opacity="0.65" />
      <rect x="10" y="28" width="3" height="1" fill="#2a1810" />
      <rect x="18" y="31" width="3" height="1" fill="#2a1810" />
      <!-- exposed rib glimpses between straps -->
      <rect x="12" y="29" width="2" height="1" fill="#a89878" />
      <rect x="16" y="32" width="2" height="1" fill="#8c7a52" />
      <!-- buckle -->
      <rect x="14" y="35" width="3" height="2" fill="#9a7232" />
      <rect x="14" y="35" width="2" height="1" fill="#c89a48" />

      <!-- ── Left arm bones — lit, hand on a quiver strap ── -->
      <rect x="2" y="21" width="4" height="13" fill="#150d08" />
      <rect x="3" y="22" width="2" height="11" fill="#c2b794" />
      <rect x="3" y="22" width="1" height="11" fill="#e8dcc4" />
      <rect x="3" y="27" width="2" height="1" fill="#8c7a52" />
      <rect x="1" y="33" width="5" height="3" fill="#150d08" />
      <rect x="2" y="34" width="3" height="1" fill="#d4c8a8" />

      <!-- ── Right arm bones — shadow, gripping the bow-stave ── -->
      <rect x="26" y="21" width="4" height="13" fill="#150d08" />
      <rect x="27" y="22" width="2" height="11" fill="#a89878" />
      <rect x="28" y="22" width="1" height="11" fill="#8c7a52" />
      <rect x="27" y="27" width="2" height="1" fill="#5a4c34" />
      <rect x="26" y="33" width="5" height="3" fill="#150d08" />
      <rect x="27" y="34" width="3" height="1" fill="#a89878" />

      <!-- ── Recurved bow — dark yew, strung, beside the body ── -->
      <rect x="29" y="20" width="3" height="3" fill="#150d08" />
      <rect x="30" y="21" width="1" height="2" fill="#5a4030" />
      <rect x="30" y="23" width="3" height="5" fill="#150d08" />
      <rect x="31" y="24" width="1" height="4" fill="#5a4030" />
      <rect x="31" y="24" width="1" height="2" fill="#7a5838" />
      <rect x="30" y="28" width="3" height="6" fill="#150d08" />
      <rect x="31" y="29" width="1" height="5" fill="#6b4a2e" />
      <rect x="30" y="34" width="3" height="5" fill="#150d08" />
      <rect x="31" y="35" width="1" height="4" fill="#5a4030" />
      <rect x="29" y="39" width="3" height="3" fill="#150d08" />
      <rect x="30" y="40" width="1" height="2" fill="#3a2418" />
      <!-- bowstring -->
      <rect x="29" y="23" width="1" height="16" fill="#d4c8a8" opacity="0.5" />

      <!-- ── Quiver at the hip — fletched arrows ── -->
      <rect x="3" y="36" width="5" height="8" fill="#150d08" />
      <rect x="4" y="37" width="3" height="6" fill="#3a2418" />
      <rect x="4" y="37" width="1" height="6" fill="#5a3a22" />
      <rect x="4" y="35" width="1" height="2" fill="#a89878" />
      <rect x="6" y="35" width="1" height="2" fill="#8c7a52" />
      <rect x="5" y="34" width="1" height="2" fill="#7e1f2c" />

      <!-- ── Leg bones — stalking stance ── -->
      <rect x="8" y="37" width="5" height="10" fill="#150d08" />
      <rect x="9" y="38" width="3" height="8" fill="#a89878" />
      <rect x="9" y="38" width="1" height="8" fill="#d4c8a8" />
      <rect x="11" y="38" width="1" height="8" fill="#7a6848" />
      <rect x="9" y="41" width="3" height="1" fill="#5a4c34" />
      <rect x="18" y="37" width="5" height="10" fill="#150d08" />
      <rect x="19" y="38" width="3" height="8" fill="#8c7a52" />
      <rect x="19" y="38" width="1" height="8" fill="#a89878" />
      <rect x="21" y="38" width="1" height="8" fill="#5a4c34" />
      <rect x="19" y="41" width="3" height="1" fill="#3e3424" />

      <!-- ── Feet — bone talons ── -->
      <rect x="6" y="46" width="8" height="3" fill="#150d08" />
      <rect x="7" y="47" width="6" height="1" fill="#a89878" />
      <rect x="7" y="46" width="6" height="1" fill="#c2b794" />
      <rect x="7" y="48" width="1" height="1" fill="#e8dcc4" />
      <rect x="10" y="48" width="1" height="1" fill="#d4c8a8" />
      <rect x="13" y="48" width="1" height="1" fill="#c2b794" />
      <rect x="17" y="46" width="8" height="3" fill="#150d08" />
      <rect x="18" y="47" width="6" height="1" fill="#8c7a52" />
      <rect x="18" y="46" width="6" height="1" fill="#a89878" />
      <rect x="18" y="48" width="1" height="1" fill="#c2b794" />
      <rect x="21" y="48" width="1" height="1" fill="#a89878" />
      <rect x="24" y="48" width="1" height="1" fill="#8c7a52" />
    </svg>
