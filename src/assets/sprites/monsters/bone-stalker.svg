<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 38"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Bone Stalker"
    >
      <!-- Cold grave backlight + ground shadow -->
      <ellipse cx="12" cy="18" rx="12" ry="17" fill="#4a8278" opacity="0.07" />
      <ellipse cx="12" cy="37" rx="9" ry="1.4" fill="#000" opacity="0.42" />

      <!-- Skull-crown headdress — bone ramp, key light upper-left -->
      <rect x="6" y="0" width="13" height="2" fill="#7a6848" />
      <rect x="6" y="0" width="8" height="1" fill="#a89878" />
      <rect x="5" y="2" width="15" height="10" fill="#a89878" />
      <rect x="5" y="2" width="6" height="9" fill="#c2b794" />
      <rect x="5" y="2" width="2" height="6" fill="#d4c8a8" />
      <rect x="5" y="2" width="1" height="4" fill="#f0e6cc" />
      <rect x="4" y="3" width="1" height="8" fill="#5a4c34" />
      <rect x="20" y="3" width="1" height="8" fill="#5a4c34" />
      <rect x="17" y="3" width="2" height="8" fill="#8c7a52" />
      <!-- Carved sigils -->
      <rect x="11" y="2" width="3" height="1" fill="#5a4030" />
      <rect x="8" y="4" width="2" height="1" fill="#5a4030" />
      <rect x="15" y="4" width="3" height="1" fill="#5a4030" />

      <!-- Eye sockets — hollow, ember spark -->
      <rect x="6" y="5" width="3" height="3" fill="#0a0808" />
      <rect x="15" y="5" width="3" height="3" fill="#0a0808" />
      <rect x="7" y="6" width="1" height="1" fill="#c43020" />
      <rect x="16" y="6" width="1" height="1" fill="#7a2010" />
      <rect x="7" y="6" width="1" height="1" fill="#ff7a3a" opacity="0.5" />
      <rect x="9" y="7" width="2" height="2" fill="#0a0808" />
      <rect x="13" y="7" width="2" height="2" fill="#0a0808" />

      <!-- Grin -->
      <rect x="6" y="10" width="13" height="2" fill="#0a0808" />
      <rect x="6" y="10" width="2" height="2" fill="#c2b794" />
      <rect x="9" y="10" width="2" height="2" fill="#a89878" />
      <rect x="12" y="10" width="2" height="2" fill="#c2b794" />
      <rect x="15" y="10" width="2" height="2" fill="#8c7a52" />

      <!-- Jaw -->
      <rect x="10" y="12" width="4" height="2" fill="#7a6848" />
      <rect x="10" y="12" width="2" height="1" fill="#a89878" />
      <rect x="11" y="12" width="2" height="1" fill="#5a4030" />

      <!-- Bone pauldrons + dark mantle -->
      <rect x="3" y="14" width="18" height="4" fill="#3a2418" />
      <rect x="3" y="14" width="3" height="4" fill="#1a1410" />
      <rect x="18" y="14" width="3" height="4" fill="#1a1410" />
      <rect x="9" y="14" width="6" height="4" fill="#a89878" />
      <rect x="9" y="14" width="6" height="1" fill="#c2b794" />
      <rect x="9" y="14" width="2" height="3" fill="#c2b794" />
      <rect x="13" y="14" width="2" height="3" fill="#8c7a52" />

      <!-- Leather harness torso — brown ramp + rib bindings -->
      <rect x="5" y="18" width="14" height="10" fill="#5a3818" />
      <rect x="5" y="18" width="14" height="1" fill="#7a4828" />
      <rect x="5" y="18" width="2" height="9" fill="#6b4022" />
      <rect x="5" y="18" width="1" height="9" fill="#3a2418" />
      <rect x="17" y="18" width="2" height="9" fill="#3a2418" />
      <rect x="5" y="27" width="14" height="1" fill="#1a1410" />
      <rect x="6" y="20" width="12" height="1" fill="#9a5a30" opacity="0.7" />
      <rect x="6" y="23" width="12" height="1" fill="#8c5028" opacity="0.7" />
      <rect x="6" y="26" width="12" height="1" fill="#7a4828" opacity="0.6" />
      <rect x="7" y="21" width="3" height="1" fill="#2a1810" />
      <rect x="14" y="24" width="2" height="1" fill="#2a1810" />

      <!-- Arm bones — ramp + specular -->
      <rect x="2" y="14" width="2" height="9" fill="#a89878" />
      <rect x="2" y="14" width="1" height="9" fill="#d4c8a8" />
      <rect x="20" y="14" width="2" height="9" fill="#8c7a52" />
      <rect x="21" y="14" width="1" height="9" fill="#5a4c34" />
      <rect x="0" y="22" width="4" height="2" fill="#a89878" />
      <rect x="0" y="22" width="4" height="1" fill="#c2b794" />
      <rect x="0" y="23" width="4" height="1" fill="#5a4c34" />
      <rect x="18" y="22" width="6" height="2" fill="#8c7a52" />

      <!-- Recurved bow-stave on the right -->
      <rect x="22" y="23" width="2" height="6" fill="#5a4030" />
      <rect x="22" y="23" width="1" height="6" fill="#3a2418" />
      <rect x="18" y="24" width="2" height="2" fill="#5a4030" />
      <rect x="17" y="26" width="2" height="2" fill="#5a4030" />
      <rect x="18" y="28" width="2" height="2" fill="#5a4030" />
      <rect x="19" y="30" width="2" height="2" fill="#5a4030" />
      <rect x="18" y="32" width="2" height="2" fill="#5a4030" />
      <rect x="18" y="24" width="1" height="8" fill="#7a5838" opacity="0.5" />
      <rect x="17" y="26" width="1" height="6" fill="#3a2418" />
      <rect x="18" y="32" width="2" height="2" fill="#1a1410" />

      <!-- Belt seam -->
      <rect x="5" y="28" width="14" height="2" fill="#1a1410" />

      <!-- Leg bones — ramp -->
      <rect x="6" y="30" width="3" height="6" fill="#a89878" />
      <rect x="14" y="30" width="3" height="6" fill="#a89878" />
      <rect x="6" y="30" width="1" height="6" fill="#d4c8a8" />
      <rect x="14" y="30" width="1" height="6" fill="#c2b794" />
      <rect x="8" y="30" width="1" height="6" fill="#7a6848" />
      <rect x="16" y="30" width="1" height="6" fill="#5a4c34" />
      <rect x="6" y="32" width="3" height="1" fill="#7a6848" />
      <rect x="14" y="32" width="3" height="1" fill="#7a6848" />
      <rect x="6" y="34" width="3" height="1" fill="#5a4c34" />
      <rect x="14" y="34" width="3" height="1" fill="#5a4c34" />

      <!-- Feet -->
      <rect x="5" y="36" width="5" height="2" fill="#1a1410" />
      <rect x="13" y="36" width="5" height="2" fill="#1a1410" />
      <rect x="5" y="36" width="5" height="1" fill="#5a4c34" />
      <rect x="13" y="36" width="5" height="1" fill="#5a4c34" />
    </svg>
