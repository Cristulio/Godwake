<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 28 42"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Herald of the Slainkin"
    >
      <!-- Blood backlight + ground shadow -->
      <ellipse cx="14" cy="22" rx="13" ry="19" fill="#7a1410" opacity="0.14" />
      <ellipse cx="14" cy="40" rx="11" ry="2" fill="#1a0610" opacity="0.4" />

      <!-- Cloak body — dark blood ramp + lit fold + dither -->
      <polygon points="7,12 21,12 24,40 4,40" fill="#1a0a12" />
      <polygon points="7,12 21,12 23,38 5,38" fill="#241018" />
      <polygon points="9,13 19,13 21,30 7,30" fill="#2e1420" />
      <polygon points="7,12 14,40 14,12" fill="#140810" opacity="0.5" />
      <rect x="13" y="14" width="2" height="24" fill="#4a1a1a" opacity="0.6" />
      <rect x="13" y="14" width="1" height="14" fill="#6a2424" opacity="0.5" />
      <rect x="9" y="20" width="1" height="1" fill="#3a1c28" />
      <rect x="18" y="26" width="1" height="1" fill="#140810" />
      <rect x="8" y="31" width="1" height="1" fill="#3a1c28" />

      <!-- Hood + shadowed cavity -->
      <polygon points="9,4 19,4 20,13 8,13" fill="#1a0a12" />
      <polygon points="9,4 19,4 19,11 9,11" fill="#241018" opacity="0.8" />
      <polygon points="9,4 14,1 19,4" fill="#5a1208" />
      <polygon points="10,4 14,1.5 18,4" fill="#7a1810" opacity="0.7" />
      <rect x="13" y="0" width="2" height="2" fill="#8c2010" />
      <rect x="13" y="0" width="1" height="1" fill="#b53c4a" />
      <ellipse cx="14" cy="9" rx="4" ry="5" fill="#0a0408" />
      <!-- Burning eyes + spark -->
      <rect x="11" y="8" width="2" height="2" fill="#b53c4a" />
      <rect x="15" y="8" width="2" height="2" fill="#b53c4a" />
      <rect x="11" y="8" width="1" height="1" fill="#f4d042" />
      <rect x="15" y="8" width="1" height="1" fill="#f4d042" />
      <rect x="12" y="9" width="1" height="1" fill="#e85a4a" opacity="0.7" />

      <!-- Left arm + blood lantern -->
      <rect x="4" y="20" width="2" height="2" fill="#2e1420" />
      <rect x="4" y="20" width="2" height="1" fill="#3a1c28" />
      <rect x="2" y="6" width="1" height="15" fill="#3a2418" />
      <rect x="2" y="6" width="1" height="8" fill="#4e3424" />
      <line x1="2" y1="6" x2="2" y2="3" stroke="#3a2418" stroke-width="1" />
      <ellipse cx="2" cy="22" rx="3.4" ry="2.4" fill="#5a1208" opacity="0.7" />
      <circle cx="2" cy="22" r="1.8" fill="#8c2010" />
      <circle cx="2" cy="22" r="0.9" fill="#e85a4a" />
      <rect x="2" y="22" width="1" height="1" fill="#ffd0a0" />
      <rect x="1" y="24" width="1" height="1" fill="#b53c4a" opacity="0.7" />
      <rect x="3" y="25" width="1" height="1" fill="#b53c4a" opacity="0.6" />
      <rect x="1" y="13" width="1" height="1" fill="#f4d042" opacity="0.5" />

      <!-- Right arm + staff -->
      <rect x="22" y="20" width="2" height="2" fill="#2e1420" />
      <rect x="22" y="20" width="2" height="1" fill="#3a1c28" />
      <rect x="24" y="22" width="1" height="10" fill="#3a2418" />
      <rect x="24" y="22" width="1" height="5" fill="#4e3424" />

      <!-- Hem feet -->
      <rect x="6" y="38" width="6" height="3" fill="#140810" />
      <rect x="6" y="38" width="6" height="1" fill="#241018" />
      <rect x="16" y="38" width="6" height="3" fill="#120610" />
    </svg>
