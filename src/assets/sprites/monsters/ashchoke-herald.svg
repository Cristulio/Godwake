<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 34 44"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Ashchoke Herald"
    >
      <!-- Ash-grey backlight + ground shadow -->
      <ellipse cx="16" cy="26" rx="15" ry="16" fill="#7a7480" opacity="0.07" />
      <ellipse cx="22" cy="10" rx="10" ry="9" fill="#58525c" opacity="0.1" />
      <ellipse cx="15" cy="42.4" rx="11" ry="1.7" fill="#000" opacity="0.44" />

      <!-- The standard — a pole that carries smoke instead of a banner -->
      <rect x="23" y="2" width="3" height="34" fill="#150d08" />
      <rect x="24" y="3" width="1" height="32" fill="#3a3038" />
      <rect x="24" y="3" width="1" height="10" fill="#4a4048" />
      <!-- iron eagle-mount, wings burnt off -->
      <rect x="22" y="2" width="5" height="3" fill="#150d08" />
      <rect x="23" y="3" width="3" height="1" fill="#4a4048" />
      <rect x="23" y="3" width="1" height="1" fill="#6a6068" />
      <!-- the smoke column, billowing up and left of the mount -->
      <rect x="20" y="0" width="9" height="2" fill="#3a363e" opacity="0.85" />
      <rect x="22" y="0" width="5" height="1" fill="#58525c" opacity="0.9" />
      <rect x="18" y="1" width="4" height="2" fill="#2e2a32" opacity="0.8" />
      <rect x="26" y="1" width="4" height="2" fill="#2e2a32" opacity="0.75" />
      <rect x="16" y="2" width="3" height="2" fill="#3a363e" opacity="0.6" />
      <rect x="28" y="3" width="3" height="2" fill="#3a363e" opacity="0.55" />
      <rect x="14" y="3" width="2" height="2" fill="#58525c" opacity="0.4" />
      <rect x="30" y="5" width="2" height="2" fill="#58525c" opacity="0.35" />
      <rect x="13" y="5" width="2" height="1" fill="#7a7480" opacity="0.3" />
      <rect x="19" y="3" width="2" height="1" fill="#7a7480" opacity="0.45" />
      <!-- a dull coal caught up in the column -->
      <rect x="21" y="1" width="1" height="1" fill="#a83a14" opacity="0.7" />
      <rect x="27" y="2" width="1" height="1" fill="#d4641a" opacity="0.5" />

      <!-- Hooded helm — ash-caked iron, ember eyes -->
      <rect x="8" y="6" width="11" height="9" fill="#150d08" />
      <rect x="9" y="7" width="9" height="7" fill="#42383f" />
      <rect x="9" y="7" width="9" height="1" fill="#58525c" />
      <rect x="9" y="7" width="3" height="1" fill="#6e6874" />
      <rect x="9" y="7" width="1" height="6" fill="#544a52" />
      <rect x="16" y="8" width="2" height="6" fill="#2e262c" />
      <!-- ash drift caked on the crown -->
      <rect x="10" y="6" width="6" height="1" fill="#7a7480" />
      <rect x="10" y="6" width="3" height="1" fill="#9a949e" />
      <!-- eye slit, embers far back -->
      <rect x="10" y="10" width="7" height="2" fill="#1a1410" />
      <rect x="11" y="10" width="2" height="2" fill="#d4641a" />
      <rect x="11" y="10" width="1" height="1" fill="#f4942a" />
      <rect x="14" y="10" width="2" height="2" fill="#d4641a" />
      <rect x="14" y="10" width="1" height="1" fill="#f4942a" />
      <!-- breath of ash leaking from the mask's mouth -->
      <rect x="9" y="13" width="3" height="1" fill="#58525c" opacity="0.6" />
      <rect x="7" y="14" width="3" height="1" fill="#3a363e" opacity="0.5" />

      <!-- Cloak + cuirass — ash-grey wool over scorched iron -->
      <rect x="6" y="15" width="15" height="17" fill="#150d08" />
      <rect x="7" y="16" width="13" height="15" fill="#3a363e" />
      <rect x="7" y="16" width="13" height="1" fill="#4e4854" />
      <rect x="7" y="16" width="5" height="1" fill="#5e5864" />
      <rect x="7" y="16" width="2" height="15" fill="#46404c" />
      <rect x="7" y="16" width="1" height="9" fill="#58525c" />
      <rect x="17" y="16" width="3" height="15" fill="#2e2a32" />
      <rect x="19" y="16" width="1" height="15" fill="#262229" />
      <!-- herald's stole — the old colour almost burnt out of it -->
      <rect x="11" y="16" width="3" height="14" fill="#531320" />
      <rect x="11" y="16" width="1" height="14" fill="#7e1f2c" />
      <rect x="11" y="20" width="3" height="1" fill="#3d0e1a" />
      <rect x="11" y="25" width="3" height="1" fill="#3d0e1a" />
      <!-- ash drifts settled in the folds -->
      <rect x="8" y="19" width="2" height="1" fill="#7a7480" opacity="0.8" />
      <rect x="15" y="22" width="3" height="1" fill="#58525c" opacity="0.7" />
      <rect x="8" y="27" width="3" height="1" fill="#7a7480" opacity="0.6" />
      <rect x="16" y="28" width="2" height="1" fill="#58525c" opacity="0.6" />

      <!-- Right arm raised to the standard, gauntlet on the pole -->
      <rect x="18" y="14" width="6" height="4" fill="#150d08" />
      <rect x="19" y="15" width="4" height="2" fill="#42383f" />
      <rect x="19" y="15" width="4" height="1" fill="#544a52" />
      <rect x="22" y="16" width="4" height="4" fill="#150d08" />
      <rect x="23" y="17" width="2" height="2" fill="#332a31" />
      <rect x="23" y="17" width="1" height="1" fill="#4a4048" />

      <!-- Left arm — the long iron crook, held out -->
      <rect x="2" y="16" width="6" height="4" fill="#150d08" />
      <rect x="3" y="17" width="4" height="2" fill="#3a363e" />
      <rect x="3" y="17" width="4" height="1" fill="#4e4854" />
      <!-- crook shaft -->
      <rect x="2" y="8" width="3" height="28" fill="#150d08" />
      <rect x="3" y="9" width="1" height="26" fill="#2a2028" />
      <rect x="3" y="9" width="1" height="8" fill="#3a3038" />
      <!-- the hook — a shepherd's crook beaten from a spear -->
      <rect x="2" y="5" width="5" height="4" fill="#150d08" />
      <rect x="3" y="6" width="3" height="1" fill="#3a3038" />
      <rect x="3" y="6" width="1" height="3" fill="#3a3038" />
      <rect x="5" y="7" width="1" height="2" fill="#2a2028" />
      <rect x="3" y="6" width="1" height="1" fill="#544a52" />
      <!-- gripping gauntlet -->
      <rect x="1" y="19" width="5" height="4" fill="#150d08" />
      <rect x="2" y="20" width="3" height="2" fill="#332a31" />
      <rect x="2" y="20" width="1" height="1" fill="#4a4048" />

      <!-- Skirts — dragging hem, ragged with burn -->
      <rect x="6" y="31" width="15" height="9" fill="#150d08" />
      <rect x="7" y="32" width="13" height="7" fill="#332f37" />
      <rect x="7" y="32" width="13" height="1" fill="#3e3a44" />
      <rect x="7" y="32" width="2" height="7" fill="#3a363e" />
      <rect x="17" y="32" width="3" height="7" fill="#28242c" />
      <!-- the stole's burnt tip -->
      <rect x="11" y="31" width="3" height="4" fill="#3d0e1a" />
      <rect x="11" y="31" width="1" height="4" fill="#531320" />
      <rect x="12" y="34" width="1" height="1" fill="#a83a14" opacity="0.7" />
      <!-- ragged hem bites -->
      <rect x="8" y="38" width="2" height="2" fill="#150d08" />
      <rect x="13" y="39" width="2" height="1" fill="#150d08" />
      <rect x="16" y="38" width="2" height="2" fill="#150d08" />
      <!-- boots under the hem -->
      <rect x="8" y="40" width="4" height="2" fill="#150d08" />
      <rect x="9" y="40" width="2" height="1" fill="#241c22" />
      <rect x="14" y="40" width="4" height="2" fill="#150d08" />
      <rect x="15" y="40" width="2" height="1" fill="#1f181d" />

      <!-- Ash sifting off the figure -->
      <rect x="5" y="24" width="1" height="1" fill="#9a949e" opacity="0.5" />
      <rect x="21" y="26" width="1" height="1" fill="#7a7480" opacity="0.5" />
      <rect x="12" y="36" width="1" height="1" fill="#9a949e" opacity="0.4" />
      <rect x="28" y="12" width="1" height="1" fill="#7a7480" opacity="0.4" />
    </svg>
