<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 36 40"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Blue Wyrmling"
    >
      <!-- Storm-charge backlight + ground shadow -->
      <ellipse cx="18" cy="22" rx="17" ry="15" fill="#3a5288" opacity="0.08" />
      <ellipse cx="18" cy="38.4" rx="12" ry="1.6" fill="#000" opacity="0.4" />

      <!-- Tail whipping behind, charge crackling at the tip -->
      <rect x="1" y="20" width="7" height="3" fill="#150d08" />
      <rect x="2" y="21" width="5" height="1" fill="#1e2c4e" />
      <rect x="2" y="21" width="2" height="1" fill="#2a3c66" />
      <rect x="0" y="17" width="4" height="4" fill="#150d08" />
      <rect x="1" y="18" width="2" height="2" fill="#1e2c4e" />
      <rect x="1" y="18" width="1" height="1" fill="#2a3c66" />
      <!-- charge at the tail-tip -->
      <rect x="0" y="16" width="1" height="1" fill="#8fd8ff" />
      <rect x="2" y="15" width="1" height="1" fill="#c8ecff" opacity="0.7" />

      <!-- Folded wings — too small to fly far, big enough to pounce -->
      <rect x="6" y="6" width="9" height="3" fill="#150d08" />
      <rect x="7" y="7" width="7" height="1" fill="#1e2c4e" />
      <rect x="7" y="7" width="3" height="1" fill="#2a3c66" />
      <rect x="4" y="8" width="5" height="8" fill="#150d08" />
      <rect x="5" y="9" width="3" height="6" fill="#16203a" />
      <rect x="5" y="9" width="1" height="6" fill="#1e2c4e" />
      <!-- membrane folds -->
      <rect x="6" y="10" width="1" height="4" fill="#0f1830" />
      <rect x="7" y="11" width="1" height="3" fill="#16203a" />
      <!-- wing spur -->
      <rect x="4" y="7" width="2" height="2" fill="#150d08" />
      <rect x="4" y="7" width="1" height="1" fill="#8a94ac" />

      <!-- Haunches coiled under -->
      <rect x="6" y="16" width="11" height="10" fill="#150d08" />
      <rect x="7" y="17" width="9" height="8" fill="#22335a" />
      <rect x="7" y="17" width="9" height="1" fill="#2e4474" />
      <rect x="7" y="17" width="4" height="1" fill="#3a5288" />
      <rect x="7" y="17" width="1" height="6" fill="#2a3c66" />
      <rect x="14" y="18" width="2" height="7" fill="#1a2848" />
      <!-- scale rows on the haunch -->
      <rect x="8" y="19" width="6" height="1" fill="#1a2848" />
      <rect x="8" y="22" width="6" height="1" fill="#1a2848" />
      <rect x="9" y="19" width="2" height="1" fill="#3a5288" />
      <!-- rear leg folded, claw planted -->
      <rect x="8" y="25" width="5" height="6" fill="#150d08" />
      <rect x="9" y="26" width="3" height="4" fill="#1e2c4e" />
      <rect x="9" y="26" width="1" height="4" fill="#2a3c66" />
      <rect x="7" y="30" width="7" height="3" fill="#150d08" />
      <rect x="8" y="31" width="5" height="1" fill="#1a2848" />
      <!-- talons -->
      <rect x="6" y="31" width="2" height="1" fill="#150d08" />
      <rect x="6" y="31" width="1" height="1" fill="#c8d0e0" />
      <rect x="12" y="32" width="1" height="1" fill="#c8d0e0" />

      <!-- Chest low, shoulders driving the pounce -->
      <rect x="13" y="12" width="13" height="12" fill="#150d08" />
      <rect x="14" y="13" width="11" height="10" fill="#2a3c66" />
      <rect x="14" y="13" width="11" height="1" fill="#3a5288" />
      <rect x="14" y="13" width="5" height="1" fill="#4a66a4" />
      <rect x="14" y="13" width="1" height="7" fill="#3a5288" />
      <rect x="23" y="14" width="2" height="9" fill="#1e2c4e" />
      <!-- pale storm-belly plates -->
      <rect x="15" y="19" width="9" height="5" fill="#8a94ac" />
      <rect x="15" y="19" width="9" height="1" fill="#aab4c8" />
      <rect x="15" y="19" width="3" height="1" fill="#c8d0e0" />
      <rect x="22" y="20" width="2" height="4" fill="#6a7490" />
      <rect x="15" y="21" width="9" height="1" fill="#6a7490" />
      <!-- charge flickering between the plates -->
      <rect x="18" y="20" width="1" height="1" fill="#8fd8ff" />
      <rect x="20" y="22" width="1" height="1" fill="#c8ecff" opacity="0.8" />
      <!-- foreleg reaching, charged claw spread -->
      <rect x="22" y="22" width="4" height="7" fill="#150d08" />
      <rect x="23" y="23" width="2" height="5" fill="#22335a" />
      <rect x="23" y="23" width="1" height="5" fill="#2e4474" />
      <rect x="21" y="28" width="6" height="3" fill="#150d08" />
      <rect x="22" y="29" width="4" height="1" fill="#1e2c4e" />
      <rect x="26" y="29" width="2" height="1" fill="#150d08" />
      <rect x="26" y="29" width="1" height="1" fill="#c8d0e0" />
      <rect x="20" y="30" width="1" height="1" fill="#c8d0e0" />
      <!-- second foreleg mid-air -->
      <rect x="25" y="20" width="6" height="3" fill="#150d08" />
      <rect x="26" y="21" width="4" height="1" fill="#2a3c66" />
      <rect x="29" y="21" width="3" height="3" fill="#150d08" />
      <rect x="30" y="22" width="1" height="1" fill="#1e2c4e" />
      <rect x="31" y="23" width="1" height="1" fill="#c8d0e0" />

      <!-- Neck arching up-forward into the strike -->
      <rect x="22" y="7" width="7" height="8" fill="#150d08" />
      <rect x="23" y="8" width="5" height="6" fill="#2a3c66" />
      <rect x="23" y="8" width="5" height="1" fill="#3a5288" />
      <rect x="23" y="8" width="1" height="5" fill="#3a5288" />
      <rect x="26" y="9" width="2" height="5" fill="#1e2c4e" />
      <!-- neck ridge spines -->
      <rect x="22" y="6" width="2" height="2" fill="#150d08" />
      <rect x="22" y="6" width="1" height="1" fill="#4a66a4" />
      <rect x="25" y="5" width="2" height="2" fill="#150d08" />
      <rect x="25" y="5" width="1" height="1" fill="#3a5288" />

      <!-- Head — the charged bite, jaws already parting -->
      <rect x="26" y="2" width="9" height="8" fill="#150d08" />
      <rect x="27" y="3" width="7" height="6" fill="#2e4474" />
      <rect x="27" y="3" width="7" height="1" fill="#3a5288" />
      <rect x="27" y="3" width="3" height="1" fill="#4a66a4" />
      <rect x="27" y="3" width="1" height="4" fill="#3a5288" />
      <rect x="32" y="4" width="2" height="5" fill="#22335a" />
      <!-- the wyrmling horn-buds -->
      <rect x="26" y="0" width="3" height="3" fill="#150d08" />
      <rect x="27" y="1" width="1" height="1" fill="#8a94ac" />
      <rect x="30" y="0" width="3" height="2" fill="#150d08" />
      <rect x="31" y="0" width="1" height="1" fill="#aab4c8" />
      <!-- storm eye -->
      <rect x="29" y="5" width="2" height="2" fill="#0e1626" />
      <rect x="29" y="5" width="1" height="1" fill="#ffe066" />
      <rect x="30" y="6" width="1" height="1" fill="#b89a2a" />
      <!-- jaws parting on the charge -->
      <rect x="31" y="8" width="5" height="4" fill="#150d08" />
      <rect x="32" y="9" width="3" height="2" fill="#16203a" />
      <rect x="32" y="9" width="2" height="1" fill="#8fd8ff" />
      <rect x="32" y="9" width="1" height="1" fill="#e8f8ff" />
      <!-- teeth -->
      <rect x="32" y="8" width="1" height="1" fill="#c8d0e0" />
      <rect x="34" y="8" width="1" height="1" fill="#c8d0e0" />
      <rect x="33" y="11" width="1" height="1" fill="#aab4c8" />
      <!-- the arc jumping the jaw-gap -->
      <rect x="35" y="7" width="1" height="1" fill="#c8ecff" />
      <rect x="34" y="5" width="1" height="1" fill="#8fd8ff" opacity="0.8" />
      <rect x="35" y="10" width="1" height="2" fill="#8fd8ff" opacity="0.6" />

      <!-- Stray charge crawling the scales -->
      <rect x="16" y="14" width="1" height="1" fill="#8fd8ff" opacity="0.7" />
      <rect x="11" y="18" width="1" height="1" fill="#c8ecff" opacity="0.5" />
      <rect x="24" y="16" width="1" height="1" fill="#8fd8ff" opacity="0.6" />
      <rect x="9" y="11" width="1" height="1" fill="#8fd8ff" opacity="0.45" />
    </svg>
