<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 36"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Blue Wyrmling"
    >
      <!-- Storm backlight + ground shadow -->
      <ellipse cx="15" cy="18" rx="14" ry="15" fill="#3a64aa" opacity="0.08" />
      <ellipse cx="15" cy="34" rx="11" ry="1.6" fill="#000" opacity="0.42" />

      <!-- Far wing membrane — ribbed, behind the body -->
      <polygon points="1,7 12,13 12,23 2,19" fill="#16305c" />
      <polygon points="2,8 11,13 11,21" fill="#1e3a6e" opacity="0.85" />
      <polygon points="3,9 10,13 10,17" fill="#244a86" opacity="0.6" />
      <rect x="4" y="10" width="1" height="8" fill="#16305c" />
      <rect x="7" y="11" width="1" height="9" fill="#16305c" />
      <rect x="10" y="13" width="1" height="9" fill="#16305c" />
      <polygon points="1,7 4,9 1,10" fill="#2a4e8e" />

      <!-- Tail sweeping to the lower right -->
      <polygon points="18,24 30,30 30,33 19,29" fill="#1e3a6e" />
      <polygon points="18,24 27,28 19,27" fill="#244a86" opacity="0.7" />
      <polygon points="29,29 30,27 30,33 28,32" fill="#16305c" />

      <!-- Haunch + body — scale ramp, lit top-left -->
      <rect x="8" y="16" width="14" height="10" fill="#244a86" />
      <rect x="8" y="16" width="14" height="2" fill="#3a64aa" />
      <rect x="8" y="16" width="6" height="1" fill="#5a84cc" />
      <rect x="8" y="16" width="2" height="9" fill="#2a4e8e" />
      <rect x="20" y="17" width="2" height="9" fill="#16305c" />
      <rect x="8" y="25" width="14" height="1" fill="#16305c" />
      <!-- Belly plates (lighter) -->
      <rect x="10" y="23" width="9" height="2" fill="#3a64aa" />
      <rect x="11" y="23" width="1" height="2" fill="#1e3a6e" />
      <rect x="14" y="23" width="1" height="2" fill="#1e3a6e" />
      <rect x="17" y="23" width="1" height="2" fill="#1e3a6e" />
      <!-- Scale speckle highlights -->
      <rect x="11" y="18" width="1" height="1" fill="#5a84cc" />
      <rect x="15" y="19" width="1" height="1" fill="#5a84cc" />
      <rect x="18" y="18" width="1" height="1" fill="#4a74ba" />

      <!-- Dorsal spine ridge -->
      <polygon points="9,16 11,12 12,16" fill="#16305c" />
      <polygon points="13,16 15,11 16,16" fill="#1e3a6e" />
      <polygon points="17,16 19,12 20,16" fill="#16305c" />

      <!-- Neck rising to the head -->
      <rect x="17" y="11" width="6" height="7" fill="#244a86" />
      <rect x="17" y="11" width="6" height="1" fill="#3a64aa" />
      <rect x="17" y="11" width="2" height="6" fill="#2a4e8e" />
      <rect x="21" y="12" width="2" height="6" fill="#16305c" />

      <!-- Head — snout to the right, ramped -->
      <rect x="19" y="5" width="9" height="7" fill="#2a4e8e" />
      <rect x="19" y="5" width="9" height="2" fill="#3a64aa" />
      <rect x="19" y="5" width="3" height="1" fill="#5a84cc" />
      <rect x="19" y="10" width="9" height="2" fill="#1e3a6e" />
      <!-- Snout tip + nostril -->
      <polygon points="28,6 30,5 29,11" fill="#244a86" />
      <rect x="28" y="7" width="1" height="1" fill="#16305c" />
      <!-- Brow horn -->
      <polygon points="20,4 22,0 23,6" fill="#16305c" />
      <polygon points="20,4 22,0 22,3" fill="#244a86" opacity="0.7" />
      <!-- Lightning eye -->
      <rect x="24" y="8" width="3" height="2" fill="#f4d042" />
      <rect x="25" y="8" width="1" height="2" fill="#fff0b0" />
      <rect x="24" y="8" width="1" height="1" fill="#e89a20" />
      <!-- Jaw + fangs -->
      <polygon points="22,12 28,12 27,15 22,14" fill="#1e3a6e" />
      <polygon points="27,12 28,16 25,14" fill="#e8e0c4" />
      <polygon points="23,12 24,15 21,13" fill="#e8e0c4" />
      <rect x="24" y="13" width="2" height="1" fill="#7a1810" opacity="0.5" />

      <!-- Foreleg + claws -->
      <rect x="9" y="24" width="4" height="8" fill="#244a86" />
      <rect x="9" y="24" width="1" height="8" fill="#2a4e8e" />
      <rect x="12" y="24" width="1" height="8" fill="#16305c" />
      <polygon points="8,32 13,32 8,35" fill="#16305c" />
      <rect x="8" y="32" width="1" height="2" fill="#d8e0f0" />
      <rect x="10" y="32" width="1" height="2" fill="#d8e0f0" />
      <rect x="12" y="32" width="1" height="2" fill="#b8c4e0" />
      <!-- Hindleg + claws -->
      <rect x="15" y="24" width="5" height="8" fill="#1e3a6e" />
      <rect x="15" y="24" width="1" height="8" fill="#244a86" />
      <rect x="19" y="24" width="1" height="8" fill="#16305c" />
      <polygon points="14,32 20,32 15,35" fill="#16305c" />
      <rect x="14" y="32" width="1" height="2" fill="#b8c4e0" />
      <rect x="16" y="32" width="1" height="2" fill="#b8c4e0" />
      <rect x="18" y="32" width="1" height="2" fill="#9aa8cc" />

      <!-- Lightning crackle -->
      <polygon points="22,16 24,18 22,18 24,21" fill="#7ec8ff" opacity="0.7" />
      <rect x="11" y="9" width="1" height="1" fill="#7ec8ff" opacity="0.6" />
      <rect x="26" y="4" width="1" height="1" fill="#7ec8ff" opacity="0.6" />
      <rect x="6" y="20" width="1" height="1" fill="#7ec8ff" opacity="0.5" />
    </svg>
