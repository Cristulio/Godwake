<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 26 32"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Page-Wraith"
    >
      <!-- Haunted backlight + faint ground shadow -->
      <ellipse cx="13" cy="15" rx="13" ry="15" fill="#4a8a82" opacity="0.08" />
      <ellipse cx="13" cy="30" rx="9" ry="1.4" fill="#0a1822" opacity="0.45" />

      <!-- Inner cowl shadow -->
      <polygon points="13,2 20,6 18,14 8,14 6,6" fill="#0e1a22" opacity="0.5" />

      <!-- Page-wings — parchment ramp, lit upper-left + cool rim -->
      <polygon points="4,7 10,9 7,13 2,11" fill="#cfc7ad" opacity="0.92" />
      <polygon points="22,7 16,9 19,13 24,11" fill="#bcb49a" opacity="0.9" />
      <polygon points="4,7 10,9 7,11 3,9" fill="#e6dec4" opacity="0.7" />
      <polygon points="3,13 9,14 6,18 1,16" fill="#bcb49a" opacity="0.82" />
      <polygon points="23,13 17,14 20,18 25,16" fill="#a89a72" opacity="0.8" />
      <polygon points="6,16 12,17 9,22 4,20" fill="#d4ccb2" opacity="0.85" />
      <polygon points="20,16 14,17 17,22 22,20" fill="#bcb49a" opacity="0.8" />
      <!-- Faint script on the wings -->
      <rect x="5" y="9" width="3" height="1" fill="#8a7c5a" opacity="0.5" />
      <rect x="18" y="9" width="3" height="1" fill="#8a7c5a" opacity="0.45" />

      <!-- Hooded head — parchment ramp -->
      <rect x="9" y="4" width="6" height="5" fill="#cfc7ad" />
      <rect x="9" y="4" width="6" height="1" fill="#efe8d2" />
      <rect x="9" y="4" width="2" height="5" fill="#dcd4bc" />
      <rect x="9" y="4" width="1" height="4" fill="#f2ebd6" />
      <rect x="14" y="4" width="1" height="5" fill="#a89a72" />
      <!-- Cold reading eyes + spec -->
      <rect x="10" y="6" width="2" height="2" fill="#10202a" />
      <rect x="14" y="6" width="1" height="2" fill="#10202a" />
      <rect x="10" y="6" width="1" height="1" fill="#7ab0aa" />
      <rect x="10" y="6" width="1" height="1" fill="#a8e0da" opacity="0.6" />

      <!-- Body — open ledger, parchment ramp with ruled text -->
      <rect x="9" y="9" width="8" height="11" fill="#e6dec4" />
      <rect x="9" y="9" width="8" height="1" fill="#f2ebd6" />
      <rect x="9" y="9" width="2" height="11" fill="#efe8d2" />
      <rect x="16" y="9" width="1" height="11" fill="#bcb49a" />
      <rect x="11" y="11" width="4" height="1" fill="#a89a72" opacity="0.7" />
      <rect x="11" y="13" width="4" height="1" fill="#a89a72" opacity="0.7" />
      <rect x="11" y="15" width="4" height="1" fill="#a89a72" opacity="0.7" />
      <rect x="11" y="17" width="3" height="1" fill="#a89a72" opacity="0.7" />

      <!-- Lower page tatters -->
      <polygon points="8,20 13,22 11,28 6,25" fill="#cfc7ad" opacity="0.82" />
      <polygon points="18,20 13,22 15,28 20,25" fill="#bcb49a" opacity="0.78" />
      <polygon points="8,20 13,22 11,26 7,24" fill="#dcd4bc" opacity="0.5" />
      <polygon points="10,26 13,28 16,26 13,31" fill="#bcb49a" opacity="0.7" />

      <!-- Drifting torn scraps -->
      <rect x="3" y="22" width="1" height="1" fill="#dcd4bc" opacity="0.6" />
      <rect x="22" y="23" width="1" height="1" fill="#cfc7ad" opacity="0.5" />
    </svg>
