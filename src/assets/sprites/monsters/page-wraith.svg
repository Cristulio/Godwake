<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 35 43"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Page-Wraith"
    >
      <!-- Parchment backlight + faint hover shadow -->
      <ellipse cx="17" cy="20" rx="17" ry="19" fill="#bcb49a" opacity="0.08" />
      <ellipse cx="17" cy="41.6" rx="9" ry="1.4" fill="#000" opacity="0.3" />

      <!-- ── Loose pages orbiting — torn leaves, drawn first ── -->
      <rect x="1" y="6" width="6" height="7" fill="#150d08" />
      <rect x="2" y="7" width="4" height="5" fill="#a89a72" />
      <rect x="2" y="7" width="4" height="1" fill="#cfc7ad" />
      <rect x="2" y="7" width="1" height="4" fill="#bcb49a" />
      <!-- script lines -->
      <rect x="3" y="9" width="2" height="1" fill="#5a4c34" />
      <rect x="3" y="11" width="2" height="1" fill="#5a4c34" opacity="0.7" />
      <rect x="27" y="3" width="7" height="8" fill="#150d08" />
      <rect x="28" y="4" width="5" height="6" fill="#bcb49a" />
      <rect x="28" y="4" width="5" height="1" fill="#dcd4bc" />
      <rect x="28" y="4" width="1" height="4" fill="#cfc7ad" />
      <rect x="31" y="8" width="2" height="2" fill="#a89a72" />
      <rect x="29" y="6" width="3" height="1" fill="#5a4c34" />
      <rect x="29" y="8" width="2" height="1" fill="#5a4c34" opacity="0.7" />
      <!-- corner torn off this one -->
      <rect x="32" y="4" width="1" height="2" fill="#150d08" />
      <rect x="29" y="33" width="6" height="6" fill="#150d08" />
      <rect x="30" y="34" width="4" height="4" fill="#a89a72" />
      <rect x="30" y="34" width="4" height="1" fill="#cfc7ad" />
      <rect x="31" y="36" width="2" height="1" fill="#5a4c34" opacity="0.8" />
      <rect x="2" y="30" width="5" height="6" fill="#150d08" />
      <rect x="3" y="31" width="3" height="4" fill="#bcb49a" />
      <rect x="3" y="31" width="3" height="1" fill="#dcd4bc" />
      <rect x="4" y="33" width="1" height="1" fill="#5a4c34" />

      <!-- ── The body — a vortex of bound pages in a reader's shape ── -->
      <!-- head: a curled folio -->
      <rect x="11" y="1" width="13" height="11" fill="#150d08" />
      <rect x="12" y="2" width="11" height="9" fill="#bcb49a" />
      <rect x="12" y="2" width="11" height="1" fill="#dcd4bc" />
      <rect x="12" y="2" width="3" height="8" fill="#cfc7ad" />
      <rect x="12" y="2" width="1" height="5" fill="#e8e0c8" />
      <rect x="20" y="3" width="3" height="8" fill="#a89a72" />
      <rect x="22" y="4" width="1" height="7" fill="#92855e" />
      <!-- the page curl at the crown -->
      <rect x="19" y="0" width="5" height="3" fill="#150d08" />
      <rect x="20" y="1" width="3" height="1" fill="#dcd4bc" />
      <rect x="22" y="2" width="1" height="1" fill="#a89a72" />
      <!-- read-me eyes — two inkwell pits -->
      <rect x="13" y="5" width="3" height="3" fill="#1a1410" />
      <rect x="18" y="5" width="3" height="3" fill="#1a1410" />
      <rect x="14" y="6" width="2" height="1" fill="#3e3424" />
      <rect x="19" y="6" width="2" height="1" fill="#322a1c" />
      <rect x="14" y="6" width="1" height="1" fill="#f2ebd6" />
      <rect x="19" y="6" width="1" height="1" fill="#dcd4bc" />
      <!-- a mouth of running script -->
      <rect x="13" y="9" width="9" height="2" fill="#1a1410" />
      <rect x="14" y="9" width="2" height="1" fill="#5a4c34" />
      <rect x="17" y="10" width="2" height="1" fill="#5a4c34" />
      <rect x="20" y="9" width="1" height="1" fill="#5a4c34" />

      <!-- ── Shoulders — sheaves fanned like a ruff ── -->
      <rect x="5" y="12" width="25" height="5" fill="#150d08" />
      <rect x="6" y="13" width="23" height="3" fill="#a89a72" />
      <rect x="6" y="13" width="23" height="1" fill="#cfc7ad" />
      <rect x="6" y="13" width="5" height="2" fill="#bcb49a" />
      <rect x="25" y="13" width="4" height="3" fill="#92855e" />
      <!-- fanned page edges -->
      <rect x="8" y="12" width="1" height="1" fill="#dcd4bc" />
      <rect x="12" y="11" width="1" height="2" fill="#cfc7ad" />
      <rect x="22" y="11" width="1" height="2" fill="#a89a72" />
      <rect x="26" y="12" width="1" height="1" fill="#92855e" />

      <!-- ── Torso — stacked spine of a broken codex ── -->
      <rect x="8" y="17" width="19" height="14" fill="#150d08" />
      <rect x="9" y="18" width="17" height="12" fill="#a89a72" />
      <rect x="9" y="18" width="17" height="1" fill="#bcb49a" />
      <rect x="9" y="18" width="3" height="11" fill="#b4a684" />
      <rect x="9" y="18" width="1" height="8" fill="#cfc7ad" />
      <rect x="23" y="18" width="3" height="11" fill="#92855e" />
      <rect x="25" y="19" width="1" height="10" fill="#7e7250" />
      <!-- page-block striations -->
      <rect x="10" y="20" width="15" height="1" fill="#92855e" />
      <rect x="10" y="23" width="15" height="1" fill="#92855e" opacity="0.8" />
      <rect x="10" y="26" width="15" height="1" fill="#7e7250" opacity="0.8" />
      <rect x="10" y="21" width="5" height="1" fill="#dcd4bc" opacity="0.6" />
      <rect x="10" y="24" width="4" height="1" fill="#cfc7ad" opacity="0.5" />
      <!-- the catalogue brand it tore out — a charred gap -->
      <rect x="15" y="21" width="5" height="4" fill="#1a1410" />
      <rect x="16" y="22" width="3" height="2" fill="#2a2218" />
      <rect x="16" y="22" width="1" height="1" fill="#5a4c34" />

      <!-- ── Arms — sleeves of sliding loose-leaf ── -->
      <rect x="4" y="17" width="6" height="10" fill="#150d08" />
      <rect x="5" y="18" width="4" height="8" fill="#a89a72" />
      <rect x="5" y="18" width="1" height="8" fill="#bcb49a" />
      <rect x="8" y="18" width="1" height="8" fill="#92855e" />
      <rect x="5" y="21" width="4" height="1" fill="#7e7250" />
      <rect x="5" y="24" width="4" height="1" fill="#7e7250" opacity="0.8" />
      <!-- papercut talons -->
      <rect x="3" y="26" width="5" height="3" fill="#150d08" />
      <rect x="4" y="27" width="3" height="1" fill="#cfc7ad" />
      <rect x="3" y="29" width="1" height="2" fill="#150d08" />
      <rect x="5" y="29" width="1" height="2" fill="#150d08" />
      <rect x="7" y="29" width="1" height="2" fill="#150d08" />
      <rect x="3" y="29" width="1" height="1" fill="#f2ebd6" />
      <rect x="5" y="29" width="1" height="1" fill="#dcd4bc" />
      <rect x="7" y="29" width="1" height="1" fill="#cfc7ad" />
      <rect x="25" y="17" width="6" height="10" fill="#150d08" />
      <rect x="26" y="18" width="4" height="8" fill="#92855e" />
      <rect x="26" y="18" width="1" height="8" fill="#a89a72" />
      <rect x="29" y="18" width="1" height="8" fill="#7e7250" />
      <rect x="26" y="21" width="4" height="1" fill="#6a6044" />
      <rect x="26" y="26" width="5" height="3" fill="#150d08" />
      <rect x="27" y="27" width="3" height="1" fill="#a89a72" />
      <rect x="26" y="29" width="1" height="2" fill="#150d08" />
      <rect x="28" y="29" width="1" height="2" fill="#150d08" />
      <rect x="30" y="29" width="1" height="2" fill="#150d08" />
      <rect x="26" y="29" width="1" height="1" fill="#dcd4bc" />
      <rect x="28" y="29" width="1" height="1" fill="#bcb49a" />

      <!-- ── Lower body — pages shuffling apart, never landing ── -->
      <rect x="9" y="31" width="17" height="4" fill="#150d08" />
      <rect x="10" y="32" width="15" height="2" fill="#92855e" />
      <rect x="10" y="32" width="15" height="1" fill="#a89a72" />
      <rect x="8" y="35" width="8" height="3" fill="#150d08" opacity="0.9" />
      <rect x="9" y="36" width="6" height="1" fill="#a89a72" opacity="0.85" />
      <rect x="18" y="35" width="8" height="3" fill="#150d08" opacity="0.85" />
      <rect x="19" y="36" width="6" height="1" fill="#92855e" opacity="0.8" />
      <rect x="11" y="38" width="6" height="2" fill="#150d08" opacity="0.6" />
      <rect x="12" y="38" width="4" height="1" fill="#a89a72" opacity="0.55" />
      <rect x="19" y="38" width="5" height="2" fill="#150d08" opacity="0.55" />
      <rect x="13" y="40" width="4" height="2" fill="#150d08" opacity="0.35" />
      <rect x="19" y="40" width="3" height="1" fill="#150d08" opacity="0.3" />
      <!-- script flaking off the trailing pages -->
      <rect x="13" y="36" width="2" height="1" fill="#5a4c34" opacity="0.6" />
      <rect x="21" y="36" width="2" height="1" fill="#5a4c34" opacity="0.5" />

      <!-- ── Dust of dead words ── -->
      <rect x="6" y="3" width="1" height="1" fill="#dcd4bc" opacity="0.5" />
      <rect x="25" y="1" width="1" height="1" fill="#cfc7ad" opacity="0.45" />
      <rect x="1" y="20" width="1" height="1" fill="#bcb49a" opacity="0.4" />
      <rect x="33" y="20" width="1" height="1" fill="#a89a72" opacity="0.4" />
      <rect x="8" y="40" width="1" height="1" fill="#cfc7ad" opacity="0.3" />
      <rect x="26" y="40" width="1" height="1" fill="#bcb49a" opacity="0.3" />
    </svg>
