<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 49"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Hollow Sage"
    >
      <!-- Teal hollow-light backlight + ground shadow -->
      <ellipse cx="15" cy="23" rx="14" ry="21" fill="#3aa098" opacity="0.09" />
      <ellipse cx="15" cy="47.6" rx="10" ry="1.8" fill="#000" opacity="0.4" />

      <!-- ── Scholar's hood — slate-blue cloth, nothing inside ── -->
      <rect x="10" y="0" width="10" height="3" fill="#150d08" />
      <rect x="11" y="1" width="8" height="2" fill="#3a4858" />
      <rect x="11" y="1" width="4" height="1" fill="#4e5e70" />
      <rect x="8" y="3" width="14" height="6" fill="#150d08" />
      <rect x="9" y="4" width="12" height="5" fill="#3a4858" />
      <rect x="9" y="4" width="12" height="1" fill="#4e5e70" />
      <rect x="9" y="4" width="3" height="5" fill="#425262" />
      <rect x="9" y="4" width="1" height="3" fill="#56687a" />
      <rect x="18" y="5" width="3" height="4" fill="#2a3848" />
      <rect x="20" y="6" width="1" height="3" fill="#22303e" />

      <!-- ── The hood's hollow — teal void where a face was ── -->
      <ellipse cx="15" cy="10.5" rx="6" ry="3.6" fill="#3aa098" opacity="0.3" />
      <rect x="9" y="8" width="12" height="6" fill="#150d08" />
      <rect x="10" y="9" width="10" height="4" fill="#06201e" />
      <!-- teal hollow-light pooling -->
      <rect x="11" y="10" width="8" height="3" fill="#0e3c38" />
      <rect x="12" y="10" width="6" height="2" fill="#1a6058" />
      <!-- twin motes where eyes would be -->
      <rect x="12" y="10" width="2" height="2" fill="#3aa098" />
      <rect x="16" y="10" width="2" height="2" fill="#2a8078" />
      <rect x="12" y="10" width="1" height="1" fill="#a4e8e0" />
      <rect x="16" y="10" width="1" height="1" fill="#7accc2" />
      <!-- light leaking down from the hood lip -->
      <rect x="13" y="13" width="4" height="1" fill="#1a6058" opacity="0.7" />

      <!-- ── Mantle — folded scholar drape ── -->
      <rect x="6" y="14" width="18" height="4" fill="#150d08" />
      <rect x="7" y="15" width="16" height="2" fill="#3a4858" />
      <rect x="7" y="15" width="16" height="1" fill="#4e5e70" />
      <rect x="7" y="15" width="4" height="1" fill="#56687a" />
      <rect x="20" y="15" width="3" height="2" fill="#2a3848" />
      <!-- clasp — a teal vial of the hollow-light -->
      <rect x="13" y="16" width="3" height="3" fill="#150d08" />
      <rect x="14" y="17" width="1" height="2" fill="#3aa098" />
      <rect x="14" y="17" width="1" height="1" fill="#a4e8e0" />

      <!-- ── Robe — slate-blue, glow seeping through every seam ── -->
      <rect x="6" y="18" width="18" height="16" fill="#150d08" />
      <rect x="7" y="19" width="16" height="14" fill="#34424f" />
      <rect x="7" y="19" width="16" height="1" fill="#425262" />
      <rect x="7" y="19" width="3" height="13" fill="#3a4858" />
      <rect x="7" y="19" width="1" height="13" fill="#4e5e70" />
      <rect x="20" y="19" width="3" height="13" fill="#2a3848" />
      <rect x="22" y="20" width="1" height="12" fill="#22303e" />
      <!-- seam glow — the hollow inside leaking out -->
      <rect x="14" y="19" width="1" height="13" fill="#0e3c38" />
      <rect x="14" y="20" width="1" height="4" fill="#1a6058" />
      <rect x="14" y="21" width="1" height="2" fill="#3aa098" />
      <rect x="10" y="23" width="1" height="1" fill="#1a6058" opacity="0.7" />
      <rect x="18" y="26" width="1" height="1" fill="#1a6058" opacity="0.6" />
      <!-- script-charms pinned to the robe -->
      <rect x="9" y="21" width="2" height="3" fill="#d8d0b8" />
      <rect x="9" y="21" width="2" height="1" fill="#ece4cc" />
      <rect x="9" y="22" width="1" height="1" fill="#8a8268" />
      <rect x="17" y="24" width="2" height="3" fill="#c4bca4" />
      <rect x="17" y="24" width="1" height="1" fill="#d8d0b8" />
      <rect x="18" y="25" width="1" height="1" fill="#8a8268" />

      <!-- ── Left sleeve — empty, pinned shut ── -->
      <rect x="3" y="17" width="5" height="10" fill="#150d08" />
      <rect x="4" y="18" width="3" height="8" fill="#34424f" />
      <rect x="4" y="18" width="1" height="8" fill="#3a4858" />
      <rect x="4" y="26" width="4" height="2" fill="#150d08" />
      <rect x="5" y="26" width="2" height="1" fill="#2a3848" />
      <!-- teal light dripping from the empty cuff -->
      <rect x="5" y="28" width="1" height="2" fill="#1a6058" opacity="0.7" />
      <rect x="6" y="30" width="1" height="1" fill="#3aa098" opacity="0.5" />

      <!-- ── Right sleeve — raised, holding the scribe-staff ── -->
      <rect x="22" y="17" width="6" height="9" fill="#150d08" />
      <rect x="23" y="18" width="4" height="7" fill="#2e3c49" />
      <rect x="23" y="18" width="1" height="7" fill="#34424f" />
      <rect x="23" y="25" width="5" height="3" fill="#150d08" />
      <rect x="24" y="26" width="3" height="1" fill="#22303e" />
      <!-- nothing in the cuff but light -->
      <rect x="25" y="26" width="2" height="1" fill="#3aa098" />
      <rect x="25" y="26" width="1" height="1" fill="#a4e8e0" />

      <!-- ── Scribe-staff — iron quill crowned with a teal flame ── -->
      <rect x="26" y="3" width="3" height="40" fill="#150d08" />
      <rect x="27" y="4" width="1" height="38" fill="#3e4a58" />
      <rect x="27" y="4" width="1" height="12" fill="#56687a" />
      <!-- quill-nib finial -->
      <ellipse cx="27.5" cy="3" rx="3.4" ry="3.4" fill="#3aa098" opacity="0.25" />
      <rect x="25" y="0" width="5" height="4" fill="#150d08" />
      <rect x="26" y="1" width="3" height="2" fill="#1a6058" />
      <rect x="26" y="1" width="2" height="1" fill="#3aa098" />
      <rect x="26" y="1" width="1" height="1" fill="#a4e8e0" />
      <rect x="28" y="2" width="1" height="1" fill="#0e3c38" />

      <!-- ── Cord belt with hanging key-charm ── -->
      <rect x="7" y="33" width="16" height="2" fill="#150d08" />
      <rect x="8" y="33" width="14" height="1" fill="#4e5e70" />
      <rect x="11" y="34" width="1" height="3" fill="#3a4858" />
      <rect x="10" y="36" width="2" height="2" fill="#150d08" />
      <rect x="11" y="36" width="1" height="1" fill="#c8a84a" />

      <!-- ── Skirt falling to the floor — no feet, only glow beneath ── -->
      <rect x="6" y="35" width="18" height="10" fill="#150d08" />
      <rect x="7" y="36" width="16" height="8" fill="#34424f" />
      <rect x="7" y="36" width="16" height="1" fill="#425262" />
      <rect x="7" y="36" width="3" height="8" fill="#3a4858" />
      <rect x="7" y="36" width="1" height="6" fill="#4e5e70" />
      <rect x="20" y="36" width="3" height="8" fill="#2a3848" />
      <rect x="22" y="37" width="1" height="7" fill="#22303e" />
      <!-- fold shadows -->
      <rect x="11" y="37" width="1" height="7" fill="#2a3848" />
      <rect x="15" y="37" width="1" height="7" fill="#22303e" />
      <rect x="18" y="37" width="1" height="7" fill="#2a3848" />
      <!-- hem floats clear of the ground — teal spill underneath -->
      <rect x="8" y="44" width="14" height="1" fill="#0e3c38" />
      <rect x="9" y="45" width="12" height="1" fill="#1a6058" opacity="0.7" />
      <rect x="11" y="46" width="8" height="1" fill="#3aa098" opacity="0.5" />
      <rect x="13" y="47" width="4" height="1" fill="#7accc2" opacity="0.35" />

      <!-- ── Drifting glyph-motes ── -->
      <rect x="4" y="12" width="1" height="1" fill="#3aa098" opacity="0.5" />
      <rect x="24" y="13" width="1" height="1" fill="#3aa098" opacity="0.45" />
      <rect x="3" y="31" width="1" height="1" fill="#7accc2" opacity="0.4" />
      <rect x="25" y="33" width="1" height="1" fill="#3aa098" opacity="0.35" />
    </svg>
