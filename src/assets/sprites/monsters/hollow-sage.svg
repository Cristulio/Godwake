<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 22 36"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Hollow Sage"
    >
      <!-- Cold spectral backlight + ground shadow -->
      <ellipse cx="11" cy="18" rx="11" ry="17" fill="#3aa098" opacity="0.08" />
      <ellipse cx="11" cy="35" rx="8" ry="1.6" fill="#000" opacity="0.4" />

      <!-- Peaked hood — slate ramp -->
      <polygon points="8,0 11,-2 14,0 16,5 6,5" fill="#2a3848" />
      <polygon points="8,0 11,-2 14,0 15,3 7,3" fill="#3a4858" />
      <polygon points="10,-1 11,-2 13,0 12,1 10,1" fill="#4a586a" />
      <polygon points="14,1 16,5 15,5 13,3" fill="#1a2030" opacity="0.8" />

      <!-- Hood brim -->
      <rect x="5" y="4" width="12" height="7" fill="#34424f" />
      <rect x="5" y="4" width="12" height="1" fill="#46566a" />
      <rect x="5" y="4" width="2" height="7" fill="#3e4e5e" />
      <rect x="4" y="6" width="1" height="5" fill="#1a2030" />
      <rect x="16" y="5" width="1" height="6" fill="#161c28" />
      <rect x="17" y="6" width="1" height="5" fill="#1a2030" />

      <!-- Hollow face cavity -->
      <rect x="7" y="6" width="8" height="5" fill="#0a0e18" />
      <!-- Wisp eyes -->
      <rect x="8" y="7" width="2" height="2" fill="#0e3a36" />
      <rect x="12" y="7" width="2" height="2" fill="#0e3a36" />
      <rect x="8" y="7" width="2" height="1" fill="#3aa098" />
      <rect x="12" y="7" width="2" height="1" fill="#3aa098" />
      <rect x="8" y="7" width="1" height="1" fill="#a4e8e0" />
      <rect x="12" y="7" width="1" height="1" fill="#a4e8e0" />
      <rect x="9" y="10" width="4" height="1" fill="#1a2030" />

      <!-- Robe body — slate ramp + frost dither + glow vents -->
      <rect x="4" y="11" width="14" height="14" fill="#3a4858" />
      <rect x="4" y="11" width="14" height="1" fill="#46566a" />
      <rect x="4" y="11" width="2" height="14" fill="#44546a" />
      <rect x="4" y="11" width="1" height="14" fill="#52627a" />
      <rect x="16" y="12" width="2" height="13" fill="#2a3848" />
      <rect x="17" y="12" width="1" height="13" fill="#222e3c" />
      <rect x="9" y="13" width="4" height="10" fill="#5a6878" />
      <rect x="10" y="14" width="2" height="8" fill="#46566a" />
      <rect x="6" y="16" width="2" height="2" fill="#3aa098" opacity="0.4" />
      <rect x="14" y="18" width="2" height="2" fill="#3aa098" opacity="0.4" />
      <rect x="8" y="20" width="1" height="1" fill="#52627a" />
      <rect x="14" y="15" width="1" height="1" fill="#2a3848" />

      <!-- Collar / chest light -->
      <rect x="4" y="22" width="14" height="2" fill="#5a6878" />
      <rect x="4" y="22" width="14" height="1" fill="#6a788a" />
      <rect x="10" y="22" width="2" height="3" fill="#5a6878" />
      <rect x="10" y="24" width="2" height="2" fill="#3aa098" />
      <rect x="10" y="24" width="1" height="1" fill="#a4e8e0" />

      <!-- Sleeves + skeletal hands -->
      <rect x="2" y="13" width="2" height="6" fill="#3a4858" />
      <rect x="2" y="13" width="1" height="6" fill="#44546a" />
      <rect x="18" y="13" width="2" height="6" fill="#2a3848" />
      <rect x="19" y="13" width="1" height="6" fill="#222e3c" />
      <rect x="2" y="19" width="2" height="3" fill="#a89878" />
      <rect x="2" y="19" width="2" height="1" fill="#c2b294" />
      <rect x="18" y="19" width="2" height="3" fill="#8c7c5c" />
      <rect x="1" y="20" width="3" height="2" fill="#a89878" />

      <!-- Gnarled staff + teal orb -->
      <rect x="19" y="2" width="2" height="14" fill="#3a2418" />
      <rect x="19" y="2" width="1" height="14" fill="#5a4030" />
      <circle cx="20" cy="1" r="2" fill="#3aa098" opacity="0.7" />
      <circle cx="20" cy="1" r="1" fill="#a4e8e0" />
      <rect x="20" y="0" width="1" height="1" fill="#e8fffb" />
      <rect x="18" y="16" width="4" height="1" fill="#1a2030" />

      <!-- Robe skirt — ragged hem -->
      <rect x="5" y="25" width="12" height="8" fill="#34424f" />
      <rect x="5" y="25" width="12" height="1" fill="#44546a" />
      <rect x="5" y="25" width="2" height="8" fill="#3e4e5e" />
      <rect x="15" y="25" width="2" height="8" fill="#28323e" />
      <polygon points="5,33 7,30 9,33" fill="#34424f" />
      <polygon points="9,33 11,30 13,33" fill="#3a4858" />
      <polygon points="13,33 15,30 17,33" fill="#34424f" />

      <!-- Feet -->
      <rect x="6" y="33" width="3" height="3" fill="#161410" />
      <rect x="13" y="33" width="3" height="3" fill="#161410" />
    </svg>
