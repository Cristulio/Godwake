<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 44 58"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Duergar Taskmaster"
    >
      <!-- Forge backlight + ground shadow -->
      <ellipse cx="22" cy="28" rx="21" ry="25" fill="#e8731e" opacity="0.09" />
      <ellipse cx="22" cy="55.6" rx="16" ry="2.2" fill="#000" opacity="0.48" />

      <!-- ══ The whip — raised, lash arcing overhead ══ -->
      <!-- lash arc -->
      <rect x="4" y="2" width="6" height="2" fill="#150d08" />
      <rect x="9" y="1" width="8" height="2" fill="#150d08" />
      <rect x="16" y="2" width="7" height="2" fill="#150d08" />
      <rect x="22" y="4" width="5" height="2" fill="#150d08" />
      <rect x="5" y="3" width="4" height="1" fill="#5a3418" />
      <rect x="10" y="2" width="6" height="1" fill="#6e4220" />
      <rect x="17" y="3" width="5" height="1" fill="#5a3418" />
      <rect x="23" y="5" width="3" height="1" fill="#4a2810" />
      <!-- lash tip — barbed -->
      <rect x="2" y="3" width="3" height="3" fill="#150d08" />
      <rect x="3" y="4" width="1" height="1" fill="#9a96a4" />
      <!-- whip stock down to the fist -->
      <rect x="25" y="6" width="4" height="10" fill="#150d08" />
      <rect x="26" y="7" width="2" height="9" fill="#4a2810" />
      <rect x="26" y="7" width="1" height="9" fill="#6e4220" />

      <!-- ══ Iron skullcap + head ══ -->
      <rect x="13" y="4" width="18" height="5" fill="#150d08" />
      <rect x="14" y="5" width="16" height="4" fill="#3a3644" />
      <rect x="14" y="5" width="6" height="4" fill="#4a4654" />
      <rect x="14" y="5" width="2" height="3" fill="#5e5a68" />
      <rect x="26" y="5" width="4" height="4" fill="#2e2a38" />
      <rect x="14" y="5" width="16" height="1" fill="#6e6a78" />
      <!-- rivets -->
      <rect x="16" y="6" width="1" height="1" fill="#8e8a96" />
      <rect x="27" y="6" width="1" height="1" fill="#56525e" />
      <!-- stone face -->
      <rect x="13" y="9" width="18" height="11" fill="#150d08" />
      <rect x="14" y="10" width="16" height="10" fill="#565460" />
      <rect x="14" y="10" width="6" height="10" fill="#74707a" />
      <rect x="14" y="10" width="3" height="7" fill="#8e8588" />
      <rect x="26" y="10" width="4" height="10" fill="#46424e" />
      <rect x="28" y="10" width="2" height="10" fill="#343042" />
      <!-- scowling brow -->
      <rect x="14" y="11" width="16" height="2" fill="#46424e" />
      <rect x="14" y="11" width="5" height="1" fill="#5e5a64" />
      <!-- amber eyes -->
      <rect x="15" y="13" width="4" height="2" fill="#1a0e06" />
      <rect x="24" y="13" width="4" height="2" fill="#1a0e06" />
      <rect x="16" y="13" width="2" height="2" fill="#e8731e" />
      <rect x="25" y="13" width="2" height="2" fill="#c05a14" />
      <rect x="16" y="13" width="1" height="1" fill="#ffe8a0" />
      <rect x="25" y="13" width="1" height="1" fill="#ffb347" />
      <!-- broad nose + sneer -->
      <rect x="20" y="14" width="3" height="3" fill="#46424e" />
      <rect x="20" y="14" width="1" height="3" fill="#5e5a64" />
      <rect x="17" y="18" width="9" height="1" fill="#2a2632" />

      <!-- ══ Ash-grey beard, cropped ══ -->
      <rect x="13" y="18" width="18" height="6" fill="#150d08" />
      <rect x="14" y="19" width="16" height="4" fill="#74707e" />
      <rect x="14" y="19" width="5" height="4" fill="#8e8a96" />
      <rect x="26" y="19" width="4" height="4" fill="#5e5a68" />
      <rect x="16" y="23" width="12" height="1" fill="#56525e" />
      <!-- braid channels -->
      <rect x="19" y="19" width="1" height="5" fill="#56525e" />
      <rect x="24" y="19" width="1" height="5" fill="#4a4654" />

      <!-- ══ Half-plate torso ══ -->
      <rect x="9" y="23" width="26" height="16" fill="#150d08" />
      <rect x="10" y="24" width="24" height="14" fill="#3e3a48" />
      <rect x="10" y="24" width="8" height="14" fill="#4e4a58" />
      <rect x="10" y="24" width="3" height="10" fill="#5e5a68" />
      <rect x="30" y="24" width="4" height="14" fill="#2e2a38" />
      <rect x="32" y="24" width="2" height="14" fill="#262230" />
      <!-- plate seam + rivets -->
      <rect x="10" y="29" width="24" height="1" fill="#262230" />
      <rect x="11" y="25" width="1" height="1" fill="#8e8a96" />
      <rect x="31" y="25" width="1" height="1" fill="#56525e" />
      <rect x="11" y="31" width="1" height="1" fill="#8e8a96" />
      <rect x="31" y="31" width="1" height="1" fill="#4a4654" />
      <!-- ember forge-glow at the gut seam -->
      <rect x="18" y="34" width="8" height="1" fill="#a83414" opacity="0.8" />
      <rect x="20" y="34" width="3" height="1" fill="#e8731e" />

      <!-- ══ Right arm raised with the whip ══ -->
      <rect x="27" y="20" width="8" height="6" fill="#150d08" />
      <rect x="28" y="21" width="6" height="4" fill="#46424e" />
      <rect x="28" y="21" width="2" height="4" fill="#56525e" />
      <!-- fist on the whip stock -->
      <rect x="24" y="14" width="8" height="8" fill="#150d08" />
      <rect x="25" y="15" width="6" height="6" fill="#565460" />
      <rect x="25" y="15" width="2" height="6" fill="#74707a" />
      <rect x="27" y="17" width="1" height="1" fill="#46424e" />
      <rect x="29" y="17" width="1" height="1" fill="#46424e" />

      <!-- ══ Left arm — thumb hooked in the belt ══ -->
      <rect x="6" y="24" width="6" height="8" fill="#150d08" />
      <rect x="7" y="25" width="4" height="6" fill="#4e4a58" />
      <rect x="7" y="25" width="2" height="6" fill="#5e5a68" />
      <rect x="5" y="31" width="7" height="8" fill="#150d08" />
      <rect x="6" y="32" width="5" height="6" fill="#3e3a48" />
      <rect x="6" y="32" width="2" height="6" fill="#4e4a58" />
      <!-- hand at the belt -->
      <rect x="6" y="37" width="6" height="5" fill="#150d08" />
      <rect x="7" y="38" width="4" height="3" fill="#565460" />
      <rect x="7" y="38" width="2" height="3" fill="#74707a" />

      <!-- ══ Belt + the chained tally-board ══ -->
      <rect x="9" y="38" width="26" height="4" fill="#150d08" />
      <rect x="10" y="39" width="24" height="2" fill="#3a2a1c" />
      <rect x="10" y="39" width="8" height="1" fill="#5a4228" />
      <!-- buckle -->
      <rect x="19" y="38" width="5" height="4" fill="#150d08" />
      <rect x="20" y="39" width="3" height="2" fill="#6e6a78" />
      <rect x="20" y="39" width="1" height="1" fill="#9a96a4" />
      <!-- chain to the tally-board -->
      <rect x="28" y="42" width="2" height="2" fill="#56525e" />
      <rect x="29" y="44" width="2" height="2" fill="#3a3644" />
      <!-- the quota board — slate with tally marks -->
      <rect x="26" y="45" width="11" height="9" fill="#150d08" />
      <rect x="27" y="46" width="9" height="7" fill="#2e2a38" />
      <rect x="27" y="46" width="3" height="7" fill="#3a3644" />
      <rect x="27" y="46" width="9" height="1" fill="#4a4654" />
      <!-- tallies -->
      <rect x="28" y="48" width="1" height="3" fill="#cdbfa2" />
      <rect x="30" y="48" width="1" height="3" fill="#cdbfa2" />
      <rect x="32" y="48" width="1" height="3" fill="#b0a486" />
      <rect x="34" y="48" width="1" height="3" fill="#b0a486" />
      <rect x="28" y="49" width="7" height="1" fill="#e8dcc4" />

      <!-- ══ Squat legs ══ -->
      <rect x="10" y="42" width="10" height="8" fill="#150d08" />
      <rect x="11" y="43" width="8" height="7" fill="#3e3a48" />
      <rect x="11" y="43" width="3" height="7" fill="#4e4a58" />
      <rect x="17" y="43" width="2" height="7" fill="#2e2a38" />
      <rect x="21" y="42" width="10" height="8" fill="#150d08" />
      <rect x="22" y="43" width="8" height="7" fill="#343042" />
      <rect x="22" y="43" width="2" height="7" fill="#3e3a48" />
      <rect x="28" y="43" width="2" height="7" fill="#262230" />

      <!-- ══ Iron boots ══ -->
      <rect x="8" y="49" width="12" height="6" fill="#150d08" />
      <rect x="9" y="50" width="10" height="4" fill="#3a3644" />
      <rect x="9" y="50" width="10" height="1" fill="#5e5a68" />
      <rect x="9" y="50" width="4" height="1" fill="#74707e" />
      <rect x="9" y="53" width="10" height="1" fill="#1e1a26" />
      <rect x="22" y="49" width="12" height="6" fill="#150d08" />
      <rect x="23" y="50" width="10" height="4" fill="#2e2a38" />
      <rect x="23" y="50" width="10" height="1" fill="#4a4654" />
      <rect x="23" y="53" width="10" height="1" fill="#191522" />

      <!-- ember motes -->
      <rect x="36" y="30" width="1" height="1" fill="#e8731e" opacity="0.7" />
      <rect x="6" y="20" width="1" height="1" fill="#ffb347" opacity="0.5" />
    </svg>
