<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 32"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Duergar Taskmaster"
    >
      <!-- Forge-ember backlight + ground shadow -->
      <ellipse cx="12" cy="16" rx="12" ry="15" fill="#8a3a14" opacity="0.08" />
      <ellipse cx="11" cy="31" rx="9" ry="1.6" fill="#000" opacity="0.42" />

      <!-- Maul — haft + steel head -->
      <rect x="19" y="4" width="2" height="20" fill="#3a2e22" />
      <rect x="19" y="4" width="1" height="20" fill="#4e4030" />
      <rect x="17" y="3" width="6" height="5" fill="#2a2a30" />
      <rect x="17" y="3" width="6" height="1" fill="#5a5a62" />
      <rect x="17" y="3" width="1" height="5" fill="#4a4a52" />
      <rect x="22" y="4" width="1" height="4" fill="#1a1a20" />
      <rect x="18" y="4" width="1" height="3" fill="#7a7a86" />
      <rect x="18" y="4" width="1" height="1" fill="#aab0bc" />

      <!-- Bald gray-dwarf head — ramp -->
      <rect x="6" y="3" width="8" height="6" fill="#5a5a54" />
      <rect x="6" y="3" width="8" height="1" fill="#6e6e66" />
      <rect x="6" y="3" width="3" height="6" fill="#646460" />
      <rect x="6" y="3" width="1" height="5" fill="#74746e" />
      <rect x="12" y="3" width="2" height="6" fill="#46463f" />
      <rect x="13" y="4" width="1" height="5" fill="#3a3a34" />
      <rect x="5" y="4" width="1" height="4" fill="#3a3a34" />
      <!-- Cooling-coal eyes + spark -->
      <rect x="7" y="5" width="2" height="1" fill="#c43a28" />
      <rect x="11" y="5" width="2" height="1" fill="#c43a28" />
      <rect x="7" y="5" width="1" height="1" fill="#ff9050" />
      <rect x="11" y="5" width="1" height="1" fill="#f46a40" />

      <!-- Braided beard -->
      <rect x="6" y="8" width="8" height="5" fill="#3a3a38" />
      <rect x="6" y="8" width="8" height="1" fill="#4a4a48" />
      <rect x="6" y="8" width="2" height="5" fill="#424240" />
      <rect x="8" y="8" width="1" height="5" fill="#2a2a28" />
      <rect x="11" y="8" width="1" height="5" fill="#2a2a28" />
      <rect x="13" y="8" width="1" height="5" fill="#222220" />
      <rect x="7" y="13" width="6" height="1" fill="#222220" />

      <!-- Stocky plate torso — steel ramp + rivets -->
      <rect x="3" y="11" width="14" height="11" fill="#4a4a44" />
      <rect x="3" y="11" width="14" height="1" fill="#62625a" />
      <rect x="3" y="11" width="2" height="11" fill="#56564e" />
      <rect x="3" y="11" width="1" height="11" fill="#62625a" />
      <rect x="15" y="11" width="2" height="11" fill="#383834" />
      <rect x="16" y="11" width="1" height="11" fill="#2e2e2a" />
      <rect x="9" y="11" width="2" height="11" fill="#3a3a36" />
      <rect x="4" y="13" width="12" height="1" fill="#2a2a28" />
      <rect x="4" y="16" width="12" height="1" fill="#2a2a28" />
      <rect x="5" y="14" width="1" height="1" fill="#7a7a72" />
      <rect x="13" y="14" width="1" height="1" fill="#62625a" />
      <rect x="5" y="18" width="1" height="1" fill="#62625a" />

      <!-- Arms + fist -->
      <rect x="1" y="12" width="3" height="8" fill="#5a5a54" />
      <rect x="1" y="12" width="3" height="1" fill="#6a6a64" />
      <rect x="1" y="12" width="1" height="8" fill="#646460" />
      <rect x="16" y="12" width="3" height="8" fill="#46463f" />
      <rect x="18" y="12" width="1" height="8" fill="#3a3a34" />
      <rect x="1" y="19" width="3" height="2" fill="#6a6a64" />

      <!-- Legs -->
      <rect x="4" y="22" width="5" height="7" fill="#3a3a36" />
      <rect x="4" y="22" width="1" height="7" fill="#46463f" />
      <rect x="8" y="22" width="1" height="7" fill="#2a2a28" />
      <rect x="11" y="22" width="5" height="7" fill="#34342f" />
      <rect x="15" y="22" width="1" height="7" fill="#262624" />

      <!-- Iron boots -->
      <rect x="3" y="29" width="6" height="3" fill="#2a2a30" />
      <rect x="3" y="29" width="6" height="1" fill="#4a4a52" />
      <rect x="3" y="29" width="2" height="3" fill="#3a3a42" />
      <rect x="11" y="29" width="6" height="3" fill="#242429" />
      <rect x="11" y="29" width="6" height="1" fill="#42424a" />
    </svg>
