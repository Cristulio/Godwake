<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 48 48"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="The Hollow Gaze"
    >
      <!-- Eldritch violet backlight + hover shadow -->
      <ellipse cx="24" cy="24" rx="23" ry="21" fill="#6a3a9a" opacity="0.09" />
      <ellipse cx="24" cy="44.5" rx="15" ry="2.4" fill="#1a1626" opacity="0.6" />

      <!-- ══ Optic-nerve tendrils trailing beneath ══ -->
      <rect x="14" y="34" width="3" height="4" fill="#150d08" />
      <rect x="13" y="38" width="2" height="4" fill="#150d08" />
      <rect x="14" y="42" width="1" height="3" fill="#251d36" />
      <rect x="14" y="35" width="1" height="3" fill="#3a2c54" />
      <rect x="13" y="39" width="1" height="2" fill="#2e2344" />
      <rect x="22" y="36" width="3" height="4" fill="#150d08" />
      <rect x="23" y="40" width="2" height="4" fill="#150d08" />
      <rect x="23" y="37" width="1" height="3" fill="#3a2c54" />
      <rect x="24" y="41" width="1" height="2" fill="#2e2344" />
      <rect x="23" y="44" width="1" height="2" fill="#251d36" opacity="0.8" />
      <rect x="31" y="34" width="3" height="4" fill="#150d08" />
      <rect x="32" y="38" width="2" height="3" fill="#150d08" />
      <rect x="32" y="35" width="1" height="3" fill="#34284c" />
      <rect x="33" y="39" width="1" height="2" fill="#251d36" />

      <!-- ══ The great orb — violet flesh ══ -->
      <rect x="10" y="6" width="28" height="6" fill="#150d08" />
      <rect x="6" y="10" width="36" height="18" fill="#150d08" />
      <rect x="10" y="26" width="28" height="8" fill="#150d08" />
      <rect x="11" y="7" width="26" height="4" fill="#2a2438" />
      <rect x="7" y="11" width="34" height="16" fill="#322a44" />
      <rect x="11" y="27" width="26" height="6" fill="#251d36" />
      <!-- lit upper-left flesh -->
      <rect x="9" y="9" width="16" height="10" fill="#3e3354" />
      <rect x="9" y="9" width="10" height="6" fill="#4a3e64" />
      <rect x="10" y="9" width="5" height="3" fill="#584a74" />
      <!-- cool shadow lower-right -->
      <rect x="30" y="16" width="11" height="11" fill="#251d36" />
      <rect x="34" y="20" width="7" height="7" fill="#1d1629" />
      <!-- veins crawling the flesh -->
      <rect x="12" y="14" width="3" height="1" fill="#6a3a9a" opacity="0.7" />
      <rect x="14" y="15" width="2" height="1" fill="#6a3a9a" opacity="0.5" />
      <rect x="33" y="12" width="3" height="1" fill="#5a2c8a" opacity="0.6" />
      <rect x="31" y="24" width="3" height="1" fill="#5a2c8a" opacity="0.55" />
      <rect x="17" y="28" width="3" height="1" fill="#4a2278" opacity="0.6" />

      <!-- ══ The great central eye ══ -->
      <rect x="16" y="12" width="16" height="14" fill="#150d08" />
      <rect x="17" y="13" width="14" height="12" fill="#0c0a12" />
      <rect x="18" y="14" width="12" height="10" fill="#e8e0cc" />
      <rect x="18" y="14" width="5" height="10" fill="#f4eedd" />
      <rect x="27" y="14" width="3" height="10" fill="#cdc4ac" />
      <!-- iris — hollow teal ring around a void pupil -->
      <rect x="20" y="15" width="8" height="8" fill="#2e6a62" />
      <rect x="21" y="16" width="6" height="6" fill="#3a8a7a" />
      <rect x="21" y="16" width="3" height="2" fill="#6ac4b0" />
      <!-- the void pupil — nothing behind it -->
      <rect x="22" y="17" width="4" height="4" fill="#060410" />
      <rect x="23" y="18" width="2" height="2" fill="#000000" />
      <!-- wet glint -->
      <rect x="20" y="15" width="2" height="2" fill="#fdfaf0" />
      <rect x="26" y="22" width="1" height="1" fill="#a8f0dc" opacity="0.7" />
      <!-- heavy lid line -->
      <rect x="17" y="13" width="14" height="1" fill="#1d1629" />

      <!-- ══ Orbiting lesser eyes ══ -->
      <!-- upper-left stalk eye -->
      <rect x="6" y="2" width="7" height="7" fill="#150d08" />
      <rect x="7" y="3" width="5" height="5" fill="#e8e0cc" />
      <rect x="7" y="3" width="2" height="5" fill="#f4eedd" />
      <rect x="8" y="4" width="3" height="3" fill="#3a8a7a" />
      <rect x="9" y="5" width="1" height="1" fill="#060410" />
      <rect x="7" y="3" width="1" height="1" fill="#fdfaf0" />
      <!-- its stalk -->
      <rect x="11" y="8" width="2" height="2" fill="#150d08" />
      <rect x="12" y="9" width="2" height="2" fill="#2e2344" />
      <!-- upper-right floating eye -->
      <rect x="36" y="4" width="6" height="6" fill="#150d08" />
      <rect x="37" y="5" width="4" height="4" fill="#cdc4ac" />
      <rect x="38" y="6" width="2" height="2" fill="#6a3a9a" />
      <rect x="38" y="6" width="1" height="1" fill="#060410" />
      <rect x="37" y="5" width="1" height="1" fill="#f4eedd" />
      <!-- right small eye -->
      <rect x="41" y="16" width="5" height="5" fill="#150d08" />
      <rect x="42" y="17" width="3" height="3" fill="#b8b0a0" />
      <rect x="43" y="18" width="1" height="1" fill="#060410" />
      <rect x="42" y="17" width="1" height="1" fill="#e8e0cc" />
      <!-- lower-left small eye -->
      <rect x="2" y="22" width="5" height="5" fill="#150d08" />
      <rect x="3" y="23" width="3" height="3" fill="#cdc4ac" />
      <rect x="4" y="24" width="1" height="1" fill="#060410" />
      <rect x="3" y="23" width="1" height="1" fill="#f4eedd" />
      <!-- left mid eye, lid half-closed -->
      <rect x="1" y="12" width="6" height="5" fill="#150d08" />
      <rect x="2" y="13" width="4" height="3" fill="#e8e0cc" />
      <rect x="2" y="13" width="4" height="1" fill="#3e3354" />
      <rect x="3" y="14" width="2" height="2" fill="#2e6a62" />
      <rect x="3" y="14" width="1" height="1" fill="#060410" />

      <!-- ══ Drifting violet motes ══ -->
      <rect x="44" y="28" width="1" height="1" fill="#a48ee0" opacity="0.6" />
      <rect x="8" y="32" width="1" height="1" fill="#8a6ec8" opacity="0.5" />
      <rect x="40" y="36" width="1" height="1" fill="#6a3a9a" opacity="0.5" />
      <rect x="28" y="2" width="1" height="1" fill="#a48ee0" opacity="0.45" />
    </svg>
