<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 35 43"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Drowned Mnemonic"
    >
      <!-- Memory-water backlight + faint shadow -->
      <ellipse cx="17" cy="20" rx="17" ry="19" fill="#8ad0e0" opacity="0.12" />
      <ellipse cx="17" cy="41.6" rx="9" ry="1.4" fill="#000" opacity="0.28" />

      <!-- ── A remembered person, made of standing water ── -->
      <!-- head — translucent, the room shows through it -->
      <rect x="10" y="2" width="13" height="11" fill="#1a3440" />
      <rect x="11" y="3" width="11" height="9" fill="#23414e" />
      <rect x="11" y="3" width="11" height="1" fill="#356074" />
      <rect x="11" y="3" width="3" height="8" fill="#2a4e60" />
      <rect x="11" y="3" width="1" height="5" fill="#3a6a80" />
      <rect x="19" y="4" width="3" height="8" fill="#1c3642" />
      <!-- the surface ripple where a face should hold still -->
      <rect x="12" y="5" width="9" height="1" fill="#4a7e92" opacity="0.8" />
      <rect x="13" y="8" width="7" height="1" fill="#4a7e92" opacity="0.6" />
      <!-- remembered eyes — bright, too clear, the one sharp detail -->
      <rect x="12" y="6" width="3" height="2" fill="#0c2430" />
      <rect x="17" y="6" width="3" height="2" fill="#0c2430" />
      <rect x="12" y="6" width="2" height="1" fill="#8ad0e0" />
      <rect x="17" y="6" width="2" height="1" fill="#6ab4c8" />
      <rect x="12" y="6" width="1" height="1" fill="#e8fbff" />
      <rect x="17" y="6" width="1" height="1" fill="#c2ecf6" />
      <!-- the mouth keeps re-forming mid-word -->
      <rect x="14" y="10" width="5" height="1" fill="#16303c" />
      <rect x="15" y="10" width="2" height="1" fill="#4a7e92" />
      <!-- crown losing cohesion — droplets rising -->
      <rect x="13" y="1" width="2" height="1" fill="#356074" opacity="0.8" />
      <rect x="18" y="0" width="2" height="2" fill="#2a4e60" opacity="0.6" />
      <rect x="15" y="0" width="1" height="1" fill="#8ad0e0" opacity="0.7" />

      <!-- ── Shoulders — water sheeting downward forever ── -->
      <rect x="5" y="13" width="23" height="5" fill="#1a3440" />
      <rect x="6" y="14" width="21" height="3" fill="#23414e" />
      <rect x="6" y="14" width="21" height="1" fill="#356074" />
      <rect x="6" y="14" width="5" height="2" fill="#2a4e60" />
      <rect x="23" y="14" width="4" height="3" fill="#1c3642" />
      <!-- sheet-fall streaks -->
      <rect x="9" y="15" width="1" height="2" fill="#4a7e92" opacity="0.7" />
      <rect x="14" y="15" width="1" height="2" fill="#4a7e92" opacity="0.55" />
      <rect x="20" y="15" width="1" height="2" fill="#3a6a80" opacity="0.6" />

      <!-- ── Torso — a memory suspended in the chest like a lantern-slide ── -->
      <rect x="7" y="18" width="19" height="14" fill="#1a3440" />
      <rect x="8" y="19" width="17" height="12" fill="#23414e" />
      <rect x="8" y="19" width="17" height="1" fill="#2f5868" />
      <rect x="8" y="19" width="3" height="11" fill="#2a4e60" />
      <rect x="8" y="19" width="1" height="8" fill="#3a6a80" />
      <rect x="22" y="19" width="3" height="11" fill="#16303c" />
      <rect x="24" y="20" width="1" height="10" fill="#10262e" />
      <!-- THE MEMORY — a tiny warm scene held in the cold water -->
      <ellipse cx="16" cy="24" rx="5" ry="4.4" fill="#8ad0e0" opacity="0.2" />
      <rect x="12" y="21" width="9" height="7" fill="#0c2430" />
      <rect x="13" y="22" width="7" height="5" fill="#12303c" />
      <!-- inside: a doorway, a small figure, lamplight — someone's last morning -->
      <rect x="14" y="23" width="2" height="4" fill="#3a3024" />
      <rect x="14" y="23" width="2" height="1" fill="#52442e" />
      <rect x="17" y="24" width="1" height="3" fill="#7e7662" />
      <rect x="17" y="24" width="1" height="1" fill="#a89e84" />
      <rect x="19" y="22" width="1" height="2" fill="#f4d042" />
      <rect x="19" y="22" width="1" height="1" fill="#fff4b0" />
      <ellipse cx="19" cy="23" rx="1.8" ry="1.6" fill="#f4d042" opacity="0.3" />
      <!-- ripple distortion crossing the memory -->
      <rect x="12" y="25" width="9" height="1" fill="#4a7e92" opacity="0.5" />

      <!-- ── Arms — currents that remember holding something ── -->
      <rect x="3" y="18" width="6" height="4" fill="#1a3440" />
      <rect x="4" y="19" width="4" height="2" fill="#23414e" />
      <rect x="4" y="19" width="4" height="1" fill="#2f5868" />
      <rect x="2" y="21" width="4" height="7" fill="#1a3440" />
      <rect x="3" y="22" width="2" height="5" fill="#2a4e60" />
      <rect x="3" y="22" width="1" height="3" fill="#3a6a80" />
      <!-- the hand curls around an absence -->
      <rect x="2" y="28" width="4" height="3" fill="#1a3440" />
      <rect x="3" y="29" width="2" height="1" fill="#4a7e92" />
      <rect x="2" y="31" width="1" height="2" fill="#1a3440" opacity="0.7" />
      <rect x="4" y="31" width="1" height="2" fill="#1a3440" opacity="0.6" />
      <rect x="24" y="18" width="6" height="4" fill="#1a3440" />
      <rect x="25" y="19" width="4" height="2" fill="#1c3642" />
      <rect x="27" y="21" width="4" height="7" fill="#1a3440" opacity="0.9" />
      <rect x="28" y="22" width="2" height="5" fill="#16303c" />
      <rect x="28" y="22" width="1" height="3" fill="#23414e" />
      <!-- this arm is forgetting itself — breaking into drops -->
      <rect x="28" y="28" width="3" height="2" fill="#1a3440" opacity="0.7" />
      <rect x="29" y="31" width="2" height="2" fill="#1a3440" opacity="0.5" />
      <rect x="30" y="34" width="1" height="1" fill="#2a4e60" opacity="0.5" />
      <rect x="28" y="33" width="1" height="1" fill="#8ad0e0" opacity="0.5" />

      <!-- ── Lower body — a column of falling water, stepped fade ── -->
      <rect x="8" y="32" width="17" height="4" fill="#1a3440" />
      <rect x="9" y="33" width="15" height="2" fill="#1e3a46" />
      <rect x="9" y="33" width="15" height="1" fill="#2a4e60" />
      <rect x="7" y="36" width="19" height="3" fill="#1a3440" opacity="0.8" />
      <rect x="8" y="37" width="17" height="1" fill="#23414e" opacity="0.8" />
      <rect x="6" y="39" width="21" height="2" fill="#1a3440" opacity="0.55" />
      <rect x="9" y="41" width="15" height="1" fill="#1a3440" opacity="0.35" />
      <!-- fall-streaks -->
      <rect x="12" y="33" width="1" height="6" fill="#4a7e92" opacity="0.5" />
      <rect x="17" y="34" width="1" height="6" fill="#3a6a80" opacity="0.45" />
      <rect x="21" y="33" width="1" height="5" fill="#4a7e92" opacity="0.4" />
      <!-- the puddle-self it stands in -->
      <ellipse cx="17" cy="41.5" rx="11" ry="1.4" fill="#356074" opacity="0.5" />
      <ellipse cx="17" cy="41.7" rx="7" ry="0.9" fill="#6ab4c8" opacity="0.4" />

      <!-- ── Droplets falling UP — memory running backwards ── -->
      <rect x="6" y="9" width="1" height="1" fill="#8ad0e0" opacity="0.6" />
      <rect x="27" y="7" width="1" height="1" fill="#6ab4c8" opacity="0.55" />
      <rect x="30" y="13" width="1" height="1" fill="#8ad0e0" opacity="0.45" />
      <rect x="3" y="15" width="1" height="1" fill="#c2ecf6" opacity="0.45" />
      <rect x="32" y="24" width="1" height="1" fill="#6ab4c8" opacity="0.4" />
      <rect x="2" y="35" width="1" height="1" fill="#8ad0e0" opacity="0.35" />
    </svg>
