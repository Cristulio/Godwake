<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 26 32"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Drowned Mnemonic"
    >
      <!-- Drowned-light backlight + faint pooled shadow -->
      <ellipse cx="13" cy="16" rx="12" ry="15" fill="#4a8ea8" opacity="0.1" />
      <ellipse cx="13" cy="30" rx="8" ry="1.6" fill="#06121a" opacity="0.35" />

      <!-- Trailing memory-wake — receding translucent layers -->
      <rect x="3" y="6" width="12" height="22" fill="#1e3a4a" opacity="0.3" />
      <rect x="6" y="4" width="12" height="24" fill="#2a4e60" opacity="0.4" />
      <rect x="9" y="3" width="12" height="25" fill="#356074" opacity="0.5" />

      <!-- Sodden head — teal ramp, key upper-left -->
      <rect x="10" y="3" width="8" height="7" fill="#3e6c80" />
      <rect x="10" y="3" width="8" height="1" fill="#2a4e60" />
      <rect x="10" y="3" width="3" height="7" fill="#4a7e92" />
      <rect x="10" y="3" width="1" height="5" fill="#5e92a6" />
      <rect x="17" y="3" width="1" height="7" fill="#2a4e60" />
      <!-- Drowned-cold eyes + spark -->
      <rect x="11" y="5" width="2" height="2" fill="#8ad0e0" />
      <rect x="15" y="5" width="2" height="2" fill="#8ad0e0" />
      <rect x="11" y="5" width="1" height="1" fill="#d4f4ff" />
      <rect x="15" y="5" width="1" height="1" fill="#d4f4ff" />
      <rect x="12" y="8" width="4" height="1" fill="#16323e" />

      <!-- Bloated torso — ramp + sediment shadow + water-runnels -->
      <rect x="8" y="10" width="12" height="15" fill="#356074" />
      <rect x="8" y="10" width="3" height="15" fill="#4a7e92" />
      <rect x="8" y="10" width="1" height="15" fill="#5e92a6" />
      <rect x="18" y="10" width="2" height="15" fill="#23414e" />
      <rect x="8" y="10" width="12" height="1" fill="#23414e" />
      <rect x="13" y="11" width="2" height="14" fill="#23414e" opacity="0.6" />
      <rect x="9" y="13" width="10" height="1" fill="#a8d8e4" opacity="0.4" />
      <rect x="10" y="17" width="8" height="1" fill="#a8d8e4" opacity="0.35" />
      <rect x="10" y="20" width="7" height="1" fill="#a8d8e4" opacity="0.3" />
      <!-- dither at the wet boundary -->
      <rect x="11" y="15" width="1" height="1" fill="#4a7e92" />
      <rect x="16" y="22" width="1" height="1" fill="#23414e" />

      <!-- Drifting arms -->
      <rect x="5" y="13" width="3" height="8" fill="#2a4e60" opacity="0.7" />
      <rect x="20" y="13" width="3" height="8" fill="#3e6c80" />
      <rect x="20" y="13" width="1" height="8" fill="#4a7e92" />

      <!-- Rising bubbles -->
      <rect x="9" y="6" width="2" height="2" fill="#8ad0e0" opacity="0.35" />
      <rect x="6" y="8" width="2" height="2" fill="#8ad0e0" opacity="0.25" />
      <rect x="18" y="7" width="2" height="2" fill="#8ad0e0" opacity="0.3" />
      <rect x="21" y="11" width="1" height="1" fill="#d4f4ff" opacity="0.4" />

      <!-- Dissolving tatters -->
      <polygon points="8,25 11,30 14,25" fill="#356074" />
      <polygon points="13,25 16,30 19,25" fill="#356074" />
      <polygon points="11,25 14,28 17,25" fill="#4a7e92" opacity="0.6" />
    </svg>
