<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 22 36"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Bonebound Test Subject"
    >
      <!-- Sickly arcane backlight + ground shadow -->
      <ellipse cx="11" cy="18" rx="11" ry="17" fill="#5a3a78" opacity="0.08" />
      <ellipse cx="11" cy="35" rx="7" ry="1.4" fill="#000" opacity="0.4" />

      <!-- Restraint strap over the brow -->
      <rect x="6" y="0" width="10" height="2" fill="#3a2838" />
      <rect x="6" y="0" width="10" height="1" fill="#5a4858" />

      <!-- Head — sallow flesh ramp, key light upper-left -->
      <rect x="5" y="2" width="12" height="8" fill="#5a4858" />
      <rect x="5" y="2" width="12" height="1" fill="#7a6a78" />
      <rect x="5" y="2" width="3" height="8" fill="#6a5868" />
      <rect x="5" y="2" width="1" height="6" fill="#8a7888" />
      <rect x="15" y="2" width="2" height="8" fill="#3a2838" />
      <rect x="16" y="3" width="1" height="6" fill="#2a1828" />
      <!-- Cranial stitches -->
      <line x1="6" y1="3" x2="10" y2="5" stroke="#2a1828" stroke-width="0.5" />
      <line x1="12" y1="5" x2="16" y2="3" stroke="#2a1828" stroke-width="0.5" />
      <line x1="8" y1="4" x2="9" y2="6" stroke="#1a0828" stroke-width="0.3" />
      <line x1="13" y1="4" x2="14" y2="6" stroke="#1a0828" stroke-width="0.3" />
      <!-- Sunken eyes with amber spark -->
      <rect x="6" y="5" width="2" height="2" fill="#0a0808" />
      <rect x="14" y="5" width="2" height="2" fill="#0a0808" />
      <rect x="7" y="6" width="1" height="1" fill="#f4d042" />
      <rect x="15" y="6" width="1" height="1" fill="#f4d042" />
      <rect x="7" y="6" width="1" height="1" fill="#fff4a0" opacity="0.6" />
      <!-- Sutured mouth with bone teeth -->
      <rect x="8" y="8" width="6" height="2" fill="#1a0828" />
      <rect x="9" y="8" width="1" height="2" fill="#d4c8a8" />
      <rect x="11" y="8" width="1" height="2" fill="#d4c8a8" />
      <rect x="13" y="8" width="1" height="2" fill="#a89878" />
      <rect x="9" y="10" width="4" height="1" fill="#5a1208" />

      <!-- Collar bolt-band -->
      <rect x="3" y="11" width="16" height="2" fill="#5a4858" />
      <rect x="3" y="11" width="16" height="1" fill="#7a6a78" />
      <rect x="3" y="11" width="2" height="2" fill="#3a2838" />
      <rect x="17" y="11" width="2" height="2" fill="#2a1828" />

      <!-- Torso — flesh ramp with surgical seams -->
      <rect x="4" y="13" width="14" height="11" fill="#5a4858" />
      <rect x="4" y="13" width="14" height="1" fill="#7a6a78" />
      <rect x="4" y="13" width="2" height="11" fill="#6a5868" />
      <rect x="16" y="13" width="2" height="11" fill="#3a2838" />
      <line x1="4" y1="16" x2="18" y2="16" stroke="#2a1828" stroke-width="0.5" />
      <line x1="4" y1="20" x2="18" y2="20" stroke="#2a1828" stroke-width="0.5" />
      <!-- Rib-stitch staples -->
      <rect x="6" y="14" width="1" height="3" fill="#3a2838" />
      <rect x="9" y="14" width="1" height="3" fill="#3a2838" />
      <rect x="12" y="14" width="1" height="3" fill="#3a2838" />
      <rect x="15" y="14" width="1" height="3" fill="#3a2838" />
      <rect x="7" y="17" width="1" height="3" fill="#3a2838" />
      <rect x="10" y="17" width="1" height="3" fill="#3a2838" />
      <rect x="13" y="17" width="1" height="3" fill="#3a2838" />
      <rect x="16" y="17" width="1" height="3" fill="#3a2838" />
      <!-- Exposed bone patch — bone ramp -->
      <rect x="9" y="17" width="4" height="3" fill="#c2b794" />
      <rect x="9" y="17" width="4" height="1" fill="#d4c8a8" />
      <rect x="9" y="17" width="1" height="3" fill="#e8dcc4" />
      <rect x="9" y="19" width="4" height="1" fill="#5a4030" />

      <!-- Arms + bone hands -->
      <rect x="2" y="13" width="2" height="8" fill="#5a4858" />
      <rect x="2" y="13" width="1" height="8" fill="#7a6a78" />
      <rect x="0" y="20" width="3" height="2" fill="#c2b794" />
      <rect x="0" y="20" width="3" height="1" fill="#d4c8a8" />
      <rect x="18" y="13" width="2" height="8" fill="#5a4858" />
      <rect x="19" y="13" width="1" height="8" fill="#3a2838" />
      <rect x="19" y="20" width="3" height="2" fill="#a89878" />
      <rect x="19" y="20" width="3" height="1" fill="#c2b794" />

      <!-- Waist seam -->
      <rect x="4" y="24" width="14" height="2" fill="#3a2838" />
      <rect x="4" y="24" width="14" height="1" fill="#5a4858" />

      <!-- Legs with knee sutures -->
      <rect x="5" y="26" width="4" height="6" fill="#5a4858" />
      <rect x="13" y="26" width="4" height="6" fill="#5a4858" />
      <rect x="5" y="26" width="1" height="6" fill="#7a6a78" />
      <rect x="13" y="26" width="1" height="6" fill="#6a5868" />
      <rect x="8" y="26" width="1" height="6" fill="#3a2838" />
      <rect x="16" y="26" width="1" height="6" fill="#2a1828" />
      <line x1="5" y1="29" x2="9" y2="29" stroke="#2a1828" stroke-width="0.5" />
      <line x1="13" y1="29" x2="17" y2="29" stroke="#2a1828" stroke-width="0.5" />

      <!-- Restraint boots -->
      <rect x="4" y="32" width="5" height="3" fill="#3a2418" />
      <rect x="13" y="32" width="5" height="3" fill="#3a2418" />
      <rect x="4" y="32" width="5" height="1" fill="#5a3a22" />
      <rect x="13" y="32" width="5" height="1" fill="#5a3a22" />
      <rect x="4" y="34" width="5" height="1" fill="#1a1410" />
      <rect x="13" y="34" width="5" height="1" fill="#1a1410" />
    </svg>
