<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 38 62"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Warden Lictor"
    >
      <!-- Steel ward backlight + ground shadow -->
      <ellipse cx="19" cy="30" rx="18" ry="27" fill="#8a98b0" opacity="0.13" />
      <ellipse cx="19" cy="59.6" rx="13" ry="2.2" fill="#000" opacity="0.45" />

      <!-- ══ Rod of office — iron, ward-light cage ══ -->
      <rect x="29" y="8" width="4" height="46" fill="#150d08" />
      <rect x="30" y="9" width="2" height="44" fill="#3a3644" />
      <rect x="30" y="9" width="1" height="44" fill="#4e4a58" />
      <!-- cage finial -->
      <rect x="27" y="0" width="8" height="9" fill="#150d08" />
      <rect x="28" y="1" width="6" height="7" fill="#2e2a38" />
      <rect x="29" y="2" width="4" height="5" fill="#0e0c14" />
      <!-- cage bars -->
      <rect x="28" y="1" width="1" height="7" fill="#56525e" />
      <rect x="33" y="1" width="1" height="7" fill="#46424e" />
      <rect x="30" y="1" width="2" height="1" fill="#6e6a78" />
      <!-- the ward-light inside -->
      <rect x="30" y="3" width="2" height="3" fill="#8a6ec8" />
      <rect x="30" y="3" width="1" height="2" fill="#c4b0f0" />
      <rect x="30" y="3" width="1" height="1" fill="#ece4ff" />
      <ellipse cx="31" cy="4" rx="5" ry="5" fill="#8a6ec8" opacity="0.16" />

      <!-- ══ Faceless iron helm ══ -->
      <rect x="11" y="2" width="16" height="6" fill="#150d08" />
      <rect x="12" y="3" width="14" height="5" fill="#3e3a48" />
      <rect x="12" y="3" width="5" height="5" fill="#4e4a58" />
      <rect x="12" y="3" width="2" height="4" fill="#5e5a68" />
      <rect x="23" y="3" width="3" height="5" fill="#2e2a38" />
      <rect x="12" y="3" width="14" height="1" fill="#74707e" />
      <!-- helm dome ridge -->
      <rect x="18" y="3" width="2" height="5" fill="#56525e" />
      <rect x="18" y="3" width="1" height="5" fill="#66626e" />
      <!-- face plate — featureless, one slit -->
      <rect x="11" y="8" width="16" height="10" fill="#150d08" />
      <rect x="12" y="9" width="14" height="8" fill="#34303e" />
      <rect x="12" y="9" width="5" height="8" fill="#403c4a" />
      <rect x="12" y="9" width="2" height="6" fill="#4e4a58" />
      <rect x="23" y="9" width="3" height="8" fill="#28242f" />
      <!-- the single vision slit — ward-light behind -->
      <rect x="13" y="11" width="12" height="2" fill="#0e0c14" />
      <rect x="15" y="11" width="3" height="1" fill="#8a6ec8" />
      <rect x="15" y="11" width="1" height="1" fill="#c4b0f0" />
      <rect x="21" y="11" width="2" height="1" fill="#5a4488" />
      <!-- rivet line at the jaw -->
      <rect x="13" y="15" width="1" height="1" fill="#56525e" />
      <rect x="16" y="15" width="1" height="1" fill="#56525e" />
      <rect x="19" y="15" width="1" height="1" fill="#46424e" />
      <rect x="22" y="15" width="1" height="1" fill="#46424e" />

      <!-- ══ Gorget + ward-plate ══ -->
      <rect x="9" y="18" width="20" height="4" fill="#150d08" />
      <rect x="10" y="19" width="18" height="3" fill="#3e3a48" />
      <rect x="10" y="19" width="6" height="2" fill="#4e4a58" />
      <rect x="24" y="19" width="4" height="3" fill="#2e2a38" />

      <!-- ══ Half-plate torso — ward-rune chest ══ -->
      <rect x="8" y="22" width="22" height="18" fill="#150d08" />
      <rect x="9" y="23" width="20" height="16" fill="#3e3a48" />
      <rect x="9" y="23" width="7" height="16" fill="#4e4a58" />
      <rect x="9" y="23" width="3" height="11" fill="#5e5a68" />
      <rect x="25" y="23" width="4" height="16" fill="#2e2a38" />
      <rect x="27" y="23" width="2" height="16" fill="#262230" />
      <!-- plate seams -->
      <rect x="9" y="28" width="20" height="1" fill="#262230" />
      <rect x="9" y="34" width="20" height="1" fill="#221e2a" />
      <!-- the ward-rune — etched, faintly alight -->
      <rect x="15" y="24" width="8" height="9" fill="#150d08" />
      <rect x="16" y="25" width="6" height="7" fill="#2e2a38" />
      <!-- rune strokes -->
      <rect x="18" y="26" width="2" height="5" fill="#5a4488" />
      <rect x="17" y="27" width="4" height="1" fill="#8a6ec8" />
      <rect x="18" y="26" width="1" height="1" fill="#c4b0f0" />
      <rect x="16" y="30" width="2" height="1" fill="#5a4488" />
      <rect x="20" y="30" width="2" height="1" fill="#4a3870" />
      <!-- rivets -->
      <rect x="10" y="24" width="1" height="1" fill="#74707e" />
      <rect x="27" y="24" width="1" height="1" fill="#46424e" />
      <rect x="10" y="36" width="1" height="1" fill="#66626e" />
      <rect x="27" y="36" width="1" height="1" fill="#3a3644" />

      <!-- ══ Pauldrons ══ -->
      <rect x="5" y="20" width="9" height="7" fill="#150d08" />
      <rect x="6" y="21" width="7" height="5" fill="#4e4a58" />
      <rect x="6" y="21" width="7" height="2" fill="#5e5a68" />
      <rect x="6" y="21" width="3" height="1" fill="#74707e" />
      <rect x="24" y="20" width="9" height="7" fill="#150d08" />
      <rect x="25" y="21" width="7" height="5" fill="#34303e" />
      <rect x="25" y="21" width="7" height="1" fill="#46424e" />

      <!-- ══ Left arm — iron-gloved fist ══ -->
      <rect x="3" y="26" width="7" height="8" fill="#150d08" />
      <rect x="4" y="27" width="5" height="6" fill="#3e3a48" />
      <rect x="4" y="27" width="2" height="6" fill="#4e4a58" />
      <rect x="2" y="32" width="8" height="8" fill="#150d08" />
      <rect x="3" y="33" width="6" height="6" fill="#34303e" />
      <rect x="3" y="33" width="2" height="6" fill="#403c4a" />
      <!-- fist -->
      <rect x="3" y="38" width="7" height="6" fill="#150d08" />
      <rect x="4" y="39" width="5" height="4" fill="#46424e" />
      <rect x="4" y="39" width="2" height="4" fill="#56525e" />
      <rect x="5" y="41" width="1" height="1" fill="#34303e" />
      <rect x="7" y="41" width="1" height="1" fill="#34303e" />

      <!-- ══ Right arm — to the rod ══ -->
      <rect x="26" y="24" width="7" height="7" fill="#150d08" />
      <rect x="27" y="25" width="5" height="5" fill="#2e2a38" />
      <rect x="27" y="25" width="2" height="5" fill="#34303e" />
      <!-- gauntlet on the rod -->
      <rect x="27" y="30" width="8" height="7" fill="#150d08" />
      <rect x="28" y="31" width="6" height="5" fill="#403c4a" />
      <rect x="28" y="31" width="2" height="5" fill="#4e4a58" />
      <rect x="30" y="33" width="1" height="1" fill="#2e2a38" />
      <rect x="32" y="33" width="1" height="1" fill="#2e2a38" />

      <!-- ══ Belt + key chain ══ -->
      <rect x="8" y="40" width="22" height="3" fill="#150d08" />
      <rect x="9" y="41" width="20" height="1" fill="#3a2a1c" />
      <rect x="9" y="41" width="6" height="1" fill="#4a3824" />
      <rect x="17" y="40" width="4" height="3" fill="#150d08" />
      <rect x="18" y="41" width="2" height="1" fill="#8e8a96" />
      <!-- hanging key -->
      <rect x="12" y="43" width="1" height="4" fill="#9a9ab0" />
      <rect x="11" y="46" width="2" height="1" fill="#c2c2d4" />

      <!-- ══ Legs — greaved ══ -->
      <rect x="9" y="43" width="9" height="10" fill="#150d08" />
      <rect x="10" y="44" width="7" height="9" fill="#34303e" />
      <rect x="10" y="44" width="3" height="9" fill="#403c4a" />
      <rect x="15" y="44" width="2" height="9" fill="#28242f" />
      <rect x="20" y="43" width="9" height="10" fill="#150d08" />
      <rect x="21" y="44" width="7" height="9" fill="#2e2a38" />
      <rect x="21" y="44" width="2" height="9" fill="#34303e" />
      <rect x="26" y="44" width="2" height="9" fill="#221e2a" />
      <!-- knee plates -->
      <rect x="11" y="46" width="5" height="2" fill="#46424e" />
      <rect x="11" y="46" width="2" height="1" fill="#5e5a68" />
      <rect x="22" y="46" width="5" height="2" fill="#3a3644" />

      <!-- ══ Iron sabatons ══ -->
      <rect x="7" y="52" width="12" height="6" fill="#150d08" />
      <rect x="8" y="53" width="10" height="4" fill="#34303e" />
      <rect x="8" y="53" width="10" height="1" fill="#56525e" />
      <rect x="8" y="53" width="4" height="1" fill="#66626e" />
      <rect x="8" y="56" width="10" height="1" fill="#1a1722" />
      <rect x="20" y="52" width="12" height="6" fill="#150d08" />
      <rect x="21" y="53" width="10" height="4" fill="#2e2a38" />
      <rect x="21" y="53" width="10" height="1" fill="#46424e" />
      <rect x="21" y="56" width="10" height="1" fill="#16131e" />

      <!-- ward motes -->
      <rect x="4" y="16" width="1" height="1" fill="#c4b0f0" opacity="0.5" />
      <rect x="35" y="26" width="1" height="1" fill="#8a6ec8" opacity="0.5" />
      <rect x="6" y="48" width="1" height="1" fill="#5a4488" opacity="0.45" />
    </svg>
