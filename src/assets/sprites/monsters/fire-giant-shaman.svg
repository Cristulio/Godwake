<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 36 42"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Fire-Giant Shaman"
    >
      <!-- Forge backlight + ground shadow -->
      <ellipse cx="18" cy="22" rx="17" ry="20" fill="#d4641a" opacity="0.1" />
      <ellipse cx="18" cy="40" rx="13" ry="1.8" fill="#000" opacity="0.42" />

      <!-- Flame crest -->
      <rect x="14" y="0" width="2" height="3" fill="#f4942a" opacity="0.7" />
      <rect x="20" y="0" width="2" height="3" fill="#e87820" opacity="0.7" />
      <rect x="17" y="-1" width="2" height="3" fill="#ffd070" opacity="0.6" />

      <!-- Horned brow — ramp, key light upper-left -->
      <polygon points="11,12 18,1 25,12" fill="#3a1c0e" />
      <polygon points="11,12 18,1 25,12" fill="#5a2e16" opacity="0.7" />
      <polygon points="12,12 18,3 22,9" fill="#7a3e1e" opacity="0.5" />

      <!-- Face — charcoal-skin ramp + smoulder -->
      <rect x="13" y="6" width="10" height="7" fill="#7a3e1e" />
      <rect x="13" y="6" width="10" height="1" fill="#a85a2e" />
      <rect x="13" y="6" width="3" height="7" fill="#8a5236" />
      <rect x="13" y="6" width="1" height="5" fill="#a85a2e" />
      <rect x="22" y="6" width="1" height="7" fill="#3a1c0e" />
      <!-- Glowing eyes + spark -->
      <rect x="14" y="8" width="3" height="2" fill="#ffd070" />
      <rect x="19" y="8" width="3" height="2" fill="#ffd070" />
      <rect x="14" y="8" width="1" height="1" fill="#fff0c0" />
      <rect x="19" y="8" width="1" height="1" fill="#fff0c0" />
      <rect x="14" y="9" width="3" height="1" fill="#e87820" opacity="0.7" />
      <rect x="19" y="9" width="3" height="1" fill="#e87820" opacity="0.7" />
      <rect x="16" y="11" width="4" height="1" fill="#a83a14" />

      <!-- Torso — charred ramp, ember veins glow through -->
      <rect x="9" y="13" width="18" height="16" fill="#3a2418" />
      <rect x="9" y="13" width="18" height="2" fill="#5a2e16" />
      <rect x="9" y="13" width="3" height="16" fill="#4a2a14" />
      <rect x="10" y="14" width="1" height="14" fill="#6a3a1e" opacity="0.6" />
      <rect x="25" y="14" width="2" height="15" fill="#2a1408" />
      <rect x="12" y="16" width="12" height="1" fill="#a83a14" opacity="0.7" />
      <rect x="11" y="19" width="14" height="1" fill="#d4641a" opacity="0.55" />
      <rect x="13" y="22" width="10" height="1" fill="#e87820" opacity="0.5" />
      <rect x="12" y="25" width="11" height="1" fill="#a83a14" opacity="0.45" />
      <rect x="15" y="18" width="1" height="1" fill="#ffb040" opacity="0.5" />
      <rect x="20" y="21" width="1" height="1" fill="#ffb040" opacity="0.4" />

      <!-- Arms — ramp -->
      <rect x="3" y="14" width="6" height="12" fill="#3a2418" />
      <rect x="3" y="14" width="6" height="1" fill="#5a2e16" />
      <rect x="3" y="14" width="2" height="12" fill="#4a2a14" />
      <rect x="27" y="14" width="6" height="12" fill="#3a2418" />
      <rect x="31" y="14" width="2" height="12" fill="#2a1408" />
      <!-- Left hand -->
      <rect x="3" y="24" width="5" height="3" fill="#8a5236" />
      <rect x="3" y="24" width="5" height="1" fill="#a85a2e" />

      <!-- Right hand gripping the fire-staff -->
      <rect x="29" y="20" width="5" height="2" fill="#2a1408" />
      <rect x="29" y="14" width="5" height="6" fill="#3a2a18" />
      <rect x="29" y="14" width="2" height="6" fill="#4a3422" />
      <!-- Brazier head + roaring flame -->
      <ellipse cx="31" cy="13" rx="3" ry="2" fill="#1f140a" />
      <rect x="29" y="9" width="2" height="3" fill="#f4942a" />
      <rect x="31" y="6" width="2" height="5" fill="#ffd070" />
      <rect x="31" y="6" width="1" height="2" fill="#fff0c0" />
      <rect x="33" y="9" width="2" height="3" fill="#e87820" />
      <rect x="30" y="11" width="3" height="2" fill="#a83a14" />

      <!-- Legs — ramp -->
      <rect x="11" y="29" width="6" height="12" fill="#2e1c12" />
      <rect x="19" y="29" width="6" height="12" fill="#2e1c12" />
      <rect x="11" y="29" width="1" height="12" fill="#4a2a14" />
      <rect x="19" y="29" width="1" height="12" fill="#4a2a14" />
      <rect x="16" y="29" width="1" height="12" fill="#1a0e06" />
      <rect x="24" y="29" width="1" height="12" fill="#1a0e06" />
      <rect x="10" y="39" width="8" height="3" fill="#140a04" />
      <rect x="19" y="39" width="8" height="3" fill="#140a04" />

      <!-- Cinders -->
      <rect x="6" y="18" width="1" height="1" fill="#f4942a" opacity="0.5" />
      <rect x="33" y="24" width="1" height="1" fill="#e87820" opacity="0.45" />
    </svg>
