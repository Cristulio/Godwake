<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 42 50"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Fire-Giant Shaman"
    >
      <!-- Rite-fire backlight + ground shadow -->
      <ellipse cx="21" cy="27" rx="20" ry="21" fill="#e87820" opacity="0.07" />
      <ellipse cx="32" cy="12" rx="8" ry="7" fill="#f4942a" opacity="0.09" />
      <ellipse cx="21" cy="48.3" rx="15" ry="1.9" fill="#000" opacity="0.46" />

      <!-- Head — red-iron face, ash-painted, antlered with iron -->
      <rect x="14" y="3" width="14" height="12" fill="#150d08" />
      <rect x="15" y="4" width="12" height="10" fill="#963030" />
      <rect x="15" y="4" width="12" height="1" fill="#b24840" />
      <rect x="15" y="4" width="4" height="1" fill="#c85850" />
      <rect x="15" y="4" width="2" height="9" fill="#a23a38" />
      <rect x="24" y="5" width="3" height="9" fill="#7a2428" />
      <rect x="26" y="5" width="1" height="9" fill="#641c20" />
      <!-- iron antler-crown of the flame-priests -->
      <rect x="11" y="0" width="4" height="4" fill="#150d08" />
      <rect x="12" y="1" width="2" height="2" fill="#3a3038" />
      <rect x="12" y="1" width="1" height="1" fill="#5a5058" />
      <rect x="9" y="0" width="3" height="2" fill="#150d08" />
      <rect x="10" y="0" width="1" height="1" fill="#4a4048" />
      <rect x="27" y="0" width="4" height="4" fill="#150d08" />
      <rect x="28" y="1" width="2" height="2" fill="#2a2028" />
      <rect x="30" y="0" width="3" height="2" fill="#150d08" />
      <rect x="31" y="0" width="1" height="1" fill="#3a3038" />
      <!-- ash-paint band across the eyes -->
      <rect x="15" y="7" width="12" height="3" fill="#241c22" />
      <rect x="15" y="7" width="12" height="1" fill="#332a31" />
      <!-- the eyes burning through the paint -->
      <rect x="17" y="8" width="3" height="2" fill="#1a0c06" />
      <rect x="22" y="8" width="3" height="2" fill="#1a0c06" />
      <rect x="18" y="8" width="2" height="1" fill="#f4942a" />
      <rect x="23" y="8" width="2" height="1" fill="#f4942a" />
      <rect x="18" y="8" width="1" height="1" fill="#fff4d0" />
      <rect x="23" y="8" width="1" height="1" fill="#fff4d0" />
      <!-- chanting mouth, soot-braided beard -->
      <rect x="18" y="11" width="6" height="2" fill="#641c20" />
      <rect x="19" y="11" width="4" height="1" fill="#481018" />
      <rect x="20" y="11" width="2" height="1" fill="#e87820" />
      <rect x="16" y="13" width="10" height="2" fill="#150d08" />
      <rect x="17" y="13" width="8" height="1" fill="#241c22" />
      <rect x="18" y="14" width="2" height="2" fill="#241c22" />
      <rect x="22" y="14" width="2" height="3" fill="#1c161c" />
      <rect x="22" y="15" width="1" height="1" fill="#c89a48" />

      <!-- Robes — ash-grey rite-cloth over red-iron bulk -->
      <rect x="10" y="15" width="22" height="21" fill="#150d08" />
      <rect x="11" y="16" width="20" height="19" fill="#42383f" />
      <rect x="11" y="16" width="20" height="1" fill="#544a52" />
      <rect x="11" y="16" width="7" height="1" fill="#665c64" />
      <rect x="11" y="16" width="3" height="19" fill="#4a4047" />
      <rect x="11" y="16" width="1" height="12" fill="#5a5058" />
      <rect x="28" y="16" width="3" height="19" fill="#332a31" />
      <rect x="30" y="16" width="1" height="19" fill="#2a2228" />
      <!-- the rite-stole — flame-orange, sigil-stitched -->
      <rect x="14" y="16" width="3" height="18" fill="#a83a14" />
      <rect x="14" y="16" width="1" height="18" fill="#d4641a" />
      <rect x="25" y="16" width="3" height="18" fill="#6a1c0a" />
      <rect x="25" y="16" width="1" height="18" fill="#a83a14" />
      <!-- flame sigils down the stole -->
      <rect x="15" y="18" width="1" height="1" fill="#ffd070" />
      <rect x="15" y="23" width="1" height="1" fill="#f4942a" />
      <rect x="15" y="28" width="1" height="1" fill="#ffd070" />
      <rect x="26" y="20" width="1" height="1" fill="#f4942a" />
      <rect x="26" y="25" width="1" height="1" fill="#e87820" />
      <rect x="26" y="30" width="1" height="1" fill="#f4942a" />
      <!-- soot-stains in the folds -->
      <rect x="19" y="20" width="4" height="1" fill="#332a31" />
      <rect x="18" y="26" width="5" height="1" fill="#332a31" />
      <rect x="20" y="31" width="3" height="1" fill="#2a2228" />

      <!-- Summoning arm — raised, cinders streaming up from the fist -->
      <rect x="27" y="14" width="7" height="5" fill="#150d08" />
      <rect x="28" y="15" width="5" height="3" fill="#42383f" />
      <rect x="28" y="15" width="5" height="1" fill="#544a52" />
      <rect x="31" y="10" width="6" height="6" fill="#150d08" />
      <rect x="32" y="11" width="4" height="4" fill="#963030" />
      <rect x="32" y="11" width="4" height="1" fill="#b24840" />
      <rect x="32" y="11" width="1" height="4" fill="#a23a38" />
      <!-- the raised fist full of cinders -->
      <rect x="32" y="6" width="6" height="6" fill="#150d08" />
      <rect x="33" y="7" width="4" height="4" fill="#7a2428" />
      <rect x="33" y="7" width="4" height="1" fill="#963030" />
      <rect x="36" y="8" width="1" height="3" fill="#641c20" />
      <!-- cinders rising from the opened fingers -->
      <rect x="34" y="4" width="2" height="2" fill="#a83a14" />
      <rect x="34" y="4" width="1" height="1" fill="#e87820" />
      <rect x="36" y="2" width="2" height="2" fill="#d4641a" />
      <rect x="36" y="2" width="1" height="1" fill="#ffd070" />
      <rect x="32" y="1" width="2" height="2" fill="#e87820" />
      <rect x="32" y="1" width="1" height="1" fill="#fff4d0" />
      <rect x="38" y="5" width="1" height="1" fill="#f4942a" opacity="0.7" />
      <rect x="39" y="2" width="1" height="1" fill="#d4641a" opacity="0.6" />
      <rect x="35" y="0" width="1" height="1" fill="#f4942a" opacity="0.6" />

      <!-- Staff arm — the coal-brazier crook -->
      <rect x="8" y="16" width="4" height="5" fill="#150d08" />
      <rect x="9" y="17" width="2" height="3" fill="#42383f" />
      <rect x="9" y="17" width="2" height="1" fill="#544a52" />
      <!-- giant red-iron hand on the staff -->
      <rect x="5" y="20" width="6" height="5" fill="#150d08" />
      <rect x="6" y="21" width="4" height="3" fill="#963030" />
      <rect x="6" y="21" width="4" height="1" fill="#b24840" />
      <rect x="9" y="22" width="1" height="2" fill="#7a2428" />
      <!-- the staff — scorched ironwood -->
      <rect x="6" y="4" width="3" height="42" fill="#150d08" />
      <rect x="7" y="5" width="1" height="40" fill="#4a2810" />
      <rect x="7" y="5" width="1" height="14" fill="#6a3a1a" />
      <!-- the brazier-head — a cage of live coals -->
      <rect x="3" y="0" width="9" height="6" fill="#150d08" />
      <rect x="4" y="1" width="7" height="4" fill="#2a2028" />
      <rect x="4" y="1" width="7" height="1" fill="#3a3038" />
      <rect x="5" y="2" width="5" height="3" fill="#6a1c0a" />
      <rect x="5" y="2" width="4" height="2" fill="#a83a14" />
      <rect x="6" y="2" width="2" height="1" fill="#ffd070" />
      <rect x="6" y="3" width="1" height="1" fill="#e87820" />
      <!-- cage bars over the glow -->
      <rect x="5" y="1" width="1" height="4" fill="#241c22" />
      <rect x="8" y="1" width="1" height="4" fill="#241c22" />
      <!-- smoke threading off the brazier -->
      <rect x="2" y="0" width="1" height="2" fill="#58525c" opacity="0.5" />
      <rect x="1" y="3" width="1" height="1" fill="#3a363e" opacity="0.5" />

      <!-- Hem — scorched, dragging through its own embers -->
      <rect x="10" y="36" width="22" height="9" fill="#150d08" />
      <rect x="11" y="37" width="20" height="7" fill="#38303a" />
      <rect x="11" y="37" width="20" height="1" fill="#42383f" />
      <rect x="11" y="37" width="4" height="7" fill="#3e3640" />
      <rect x="27" y="37" width="4" height="7" fill="#2a2228" />
      <!-- stole tips at the hem -->
      <rect x="14" y="37" width="3" height="4" fill="#6a1c0a" />
      <rect x="14" y="37" width="1" height="4" fill="#a83a14" />
      <rect x="25" y="37" width="3" height="4" fill="#481018" />
      <rect x="25" y="37" width="1" height="4" fill="#6a1c0a" />
      <!-- ragged burnt hem bites -->
      <rect x="12" y="42" width="3" height="2" fill="#150d08" />
      <rect x="18" y="43" width="3" height="1" fill="#150d08" />
      <rect x="24" y="42" width="3" height="2" fill="#150d08" />
      <rect x="16" y="41" width="1" height="1" fill="#a83a14" opacity="0.7" />
      <rect x="27" y="41" width="1" height="1" fill="#d4641a" opacity="0.6" />
      <!-- iron-shod feet under the hem -->
      <rect x="13" y="44" width="7" height="4" fill="#150d08" />
      <rect x="14" y="45" width="5" height="2" fill="#2a2028" />
      <rect x="14" y="45" width="2" height="1" fill="#3a3038" />
      <rect x="22" y="44" width="7" height="4" fill="#150d08" />
      <rect x="23" y="45" width="5" height="2" fill="#241c22" />
      <rect x="23" y="45" width="2" height="1" fill="#2a2028" />

      <!-- The dead it keeps lighting, rising as sparks -->
      <rect x="2" y="26" width="1" height="1" fill="#f4942a" opacity="0.5" />
      <rect x="38" y="20" width="1" height="1" fill="#d4641a" opacity="0.5" />
      <rect x="4" y="38" width="1" height="1" fill="#e87820" opacity="0.45" />
      <rect x="36" y="33" width="1" height="1" fill="#a83a14" opacity="0.5" />
    </svg>
