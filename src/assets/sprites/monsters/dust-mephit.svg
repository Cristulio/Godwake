<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 38"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Dust Mephit"
    >
      <!-- Grit backlight + drifting dust shadow -->
      <ellipse cx="15" cy="15" rx="15" ry="16" fill="#9a9088" opacity="0.08" />
      <ellipse cx="15" cy="35.5" rx="11" ry="1.8" fill="#000" opacity="0.3" />

      <!-- ── Left wing — tattered stone-dust membrane, lit edge ── -->
      <rect x="0" y="10" width="2" height="5" fill="#150d08" />
      <rect x="1" y="7" width="3" height="9" fill="#150d08" />
      <rect x="3" y="5" width="3" height="12" fill="#150d08" />
      <rect x="6" y="6" width="3" height="13" fill="#150d08" />
      <rect x="1" y="8" width="2" height="7" fill="#7a7068" />
      <rect x="3" y="6" width="2" height="10" fill="#9a9088" />
      <rect x="5" y="7" width="2" height="11" fill="#7a7068" />
      <rect x="7" y="8" width="2" height="10" fill="#5a5048" />
      <!-- pale lit leading edge -->
      <rect x="3" y="6" width="2" height="1" fill="#d8d0c0" />
      <rect x="1" y="8" width="2" height="1" fill="#b8b0a8" />
      <rect x="5" y="7" width="2" height="1" fill="#9a9088" />
      <!-- wing fingers + tears -->
      <rect x="4" y="6" width="1" height="10" fill="#3a352e" />
      <rect x="7" y="7" width="1" height="11" fill="#3a352e" />
      <rect x="2" y="12" width="1" height="2" fill="#150d08" />
      <rect x="6" y="14" width="1" height="2" fill="#150d08" />

      <!-- ── Right wing — shadow side ── -->
      <rect x="28" y="10" width="2" height="5" fill="#150d08" />
      <rect x="26" y="7" width="3" height="9" fill="#150d08" />
      <rect x="24" y="5" width="3" height="12" fill="#150d08" />
      <rect x="21" y="6" width="3" height="13" fill="#150d08" />
      <rect x="27" y="8" width="2" height="7" fill="#4a443c" />
      <rect x="25" y="6" width="2" height="10" fill="#5a5048" />
      <rect x="23" y="7" width="2" height="11" fill="#4a443c" />
      <rect x="21" y="8" width="2" height="10" fill="#3a352e" />
      <rect x="25" y="6" width="2" height="1" fill="#9a9088" />
      <rect x="27" y="12" width="1" height="2" fill="#3e5650" />
      <rect x="25" y="6" width="1" height="10" fill="#2a2620" />
      <rect x="22" y="7" width="1" height="11" fill="#2a2620" />
      <rect x="26" y="11" width="1" height="2" fill="#150d08" />

      <!-- ── Crumbling horns ── -->
      <rect x="8" y="0" width="3" height="4" fill="#150d08" />
      <rect x="9" y="1" width="1" height="2" fill="#7a7068" />
      <rect x="9" y="1" width="1" height="1" fill="#9a9088" />
      <rect x="19" y="0" width="3" height="4" fill="#150d08" />
      <rect x="20" y="1" width="1" height="2" fill="#4a443c" />
      <!-- chipped tip drifting off -->
      <rect x="21" y="0" width="1" height="1" fill="#3a352e" />

      <!-- ── Head — cracked stone ramp, key upper-left ── -->
      <rect x="8" y="2" width="14" height="8" fill="#150d08" />
      <rect x="9" y="3" width="12" height="6" fill="#5a5048" />
      <rect x="9" y="3" width="12" height="1" fill="#7a7068" />
      <rect x="9" y="3" width="3" height="6" fill="#7a7068" />
      <rect x="9" y="3" width="1" height="4" fill="#9a9088" />
      <rect x="9" y="3" width="1" height="2" fill="#b8b0a8" />
      <rect x="18" y="4" width="3" height="5" fill="#3a352e" />
      <rect x="20" y="5" width="1" height="4" fill="#2a2620" />
      <!-- fissure crack down the brow -->
      <rect x="15" y="3" width="1" height="3" fill="#2a2620" />
      <rect x="16" y="5" width="1" height="1" fill="#2a2620" />

      <!-- ── Eyes — pale grit-light, weary ── -->
      <rect x="10" y="5" width="3" height="2" fill="#1a1410" />
      <rect x="16" y="5" width="3" height="2" fill="#1a1410" />
      <rect x="10" y="5" width="2" height="2" fill="#e0d8c0" />
      <rect x="16" y="5" width="2" height="2" fill="#c8c0b0" />
      <rect x="10" y="5" width="1" height="1" fill="#fff8e8" />
      <rect x="16" y="5" width="1" height="1" fill="#f0e8d8" />

      <!-- ── Grimacing mouth — cracked open, dust sifting out ── -->
      <rect x="10" y="7" width="9" height="2" fill="#1a1410" />
      <rect x="10" y="7" width="1" height="2" fill="#e0d8c0" />
      <rect x="13" y="7" width="1" height="2" fill="#d8d0c0" />
      <rect x="16" y="7" width="1" height="2" fill="#c8c0b0" />
      <rect x="11" y="9" width="2" height="1" fill="#b8b0a8" opacity="0.5" />

      <!-- ── Torso — stone ramp with crumble pits ── -->
      <rect x="9" y="10" width="12" height="12" fill="#150d08" />
      <rect x="10" y="11" width="10" height="10" fill="#5a5048" />
      <rect x="10" y="11" width="10" height="1" fill="#7a7068" />
      <rect x="10" y="11" width="3" height="9" fill="#7a7068" />
      <rect x="10" y="11" width="1" height="7" fill="#9a9088" />
      <rect x="10" y="11" width="1" height="3" fill="#b8b0a8" />
      <rect x="17" y="12" width="3" height="9" fill="#3a352e" />
      <rect x="19" y="13" width="1" height="8" fill="#2a2620" />
      <rect x="19" y="15" width="1" height="3" fill="#3e5650" />
      <!-- crumble pits + dither -->
      <rect x="13" y="13" width="1" height="1" fill="#3a352e" />
      <rect x="15" y="16" width="2" height="1" fill="#2a2620" />
      <rect x="12" y="18" width="1" height="1" fill="#3a352e" />
      <rect x="11" y="14" width="1" height="1" fill="#b8b0a8" />
      <!-- cracked belly seam leaking dust -->
      <rect x="12" y="19" width="6" height="1" fill="#2a2620" />
      <rect x="13" y="20" width="2" height="1" fill="#b8b0a8" opacity="0.6" />

      <!-- ── Arms — ramp + dark talons ── -->
      <rect x="6" y="13" width="4" height="8" fill="#150d08" />
      <rect x="7" y="14" width="2" height="6" fill="#5a5048" />
      <rect x="7" y="14" width="1" height="6" fill="#7a7068" />
      <rect x="5" y="19" width="4" height="4" fill="#150d08" />
      <rect x="6" y="20" width="2" height="2" fill="#7a7068" />
      <rect x="5" y="22" width="1" height="2" fill="#150d08" />
      <rect x="7" y="22" width="1" height="2" fill="#150d08" />
      <rect x="20" y="13" width="4" height="8" fill="#150d08" />
      <rect x="21" y="14" width="2" height="6" fill="#3a352e" />
      <rect x="22" y="14" width="1" height="6" fill="#2a2620" />
      <rect x="21" y="19" width="4" height="4" fill="#150d08" />
      <rect x="22" y="20" width="2" height="2" fill="#3a352e" />
      <rect x="22" y="22" width="1" height="2" fill="#150d08" />
      <rect x="24" y="22" width="1" height="2" fill="#150d08" />

      <!-- ── Stubby legs + talons ── -->
      <rect x="10" y="22" width="4" height="8" fill="#150d08" />
      <rect x="11" y="23" width="2" height="6" fill="#5a5048" />
      <rect x="11" y="23" width="1" height="6" fill="#7a7068" />
      <rect x="16" y="22" width="4" height="8" fill="#150d08" />
      <rect x="17" y="23" width="2" height="6" fill="#3a352e" />
      <rect x="18" y="23" width="1" height="6" fill="#2a2620" />
      <rect x="9" y="30" width="6" height="3" fill="#150d08" />
      <rect x="10" y="31" width="4" height="1" fill="#5a5048" />
      <rect x="10" y="30" width="4" height="1" fill="#7a7068" />
      <rect x="15" y="30" width="6" height="3" fill="#150d08" />
      <rect x="16" y="31" width="4" height="1" fill="#3a352e" />
      <rect x="10" y="32" width="1" height="2" fill="#150d08" />
      <rect x="13" y="32" width="1" height="2" fill="#150d08" />
      <rect x="16" y="32" width="1" height="2" fill="#150d08" />
      <rect x="19" y="32" width="1" height="2" fill="#150d08" />

      <!-- ── Tail crumbling to grit ── -->
      <rect x="14" y="22" width="2" height="6" fill="#150d08" />
      <rect x="14" y="27" width="1" height="3" fill="#3a352e" />
      <rect x="13" y="29" width="1" height="2" fill="#2a2620" />
      <rect x="12" y="31" width="1" height="1" fill="#3a352e" opacity="0.7" />

      <!-- ── Billowing dust skirt at the ground ── -->
      <ellipse cx="15" cy="34.5" rx="11" ry="2" fill="#9a9088" opacity="0.3" />
      <ellipse cx="15" cy="36" rx="8" ry="1.1" fill="#b8b0a8" opacity="0.22" />
      <rect x="5" y="32" width="1" height="1" fill="#b8b0a8" opacity="0.45" />
      <rect x="23" y="33" width="1" height="1" fill="#9a9088" opacity="0.4" />
      <rect x="8" y="35" width="1" height="1" fill="#d8d0c0" opacity="0.35" />
      <rect x="21" y="35" width="1" height="1" fill="#b8b0a8" opacity="0.3" />
    </svg>
