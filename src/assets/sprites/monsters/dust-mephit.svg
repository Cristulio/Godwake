<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 22 28"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Dust Mephit"
    >
      <!-- Grit backlight + drifting dust shadow -->
      <ellipse cx="11" cy="11" rx="11" ry="12" fill="#9a9088" opacity="0.08" />
      <ellipse cx="11" cy="26" rx="8" ry="1.4" fill="#000" opacity="0.32" />

      <!-- Wings — tattered, lit leading edge -->
      <polygon points="0,8 4,4 6,12 4,14" fill="#3a352e" />
      <polygon points="0,8 4,4 6,12 4,14" fill="#5a5048" opacity="0.7" />
      <polygon points="1,9 4,6 5,11" fill="#7a7068" opacity="0.6" />
      <polygon points="2,9 4,6 4,8" fill="#9a9088" opacity="0.5" />
      <polygon points="22,8 18,4 16,12 18,14" fill="#3a352e" />
      <polygon points="22,8 18,4 16,12 18,14" fill="#4a443c" opacity="0.6" />
      <polygon points="21,9 18,6 17,11" fill="#5a5048" opacity="0.5" />
      <line x1="3" y1="6" x2="5" y2="13" stroke="#1a1410" stroke-width="0.4" />
      <line x1="19" y1="6" x2="17" y2="13" stroke="#1a1410" stroke-width="0.4" />

      <!-- Torso — stone ramp, key light upper-left -->
      <rect x="8" y="6" width="6" height="9" fill="#5a5048" />
      <rect x="8" y="6" width="3" height="9" fill="#7a7068" />
      <rect x="8" y="6" width="1" height="7" fill="#9a9088" />
      <rect x="13" y="6" width="1" height="9" fill="#3a352e" />
      <rect x="7" y="7" width="1" height="6" fill="#3a352e" />
      <rect x="14" y="7" width="1" height="6" fill="#2a2620" />
      <rect x="9" y="9" width="1" height="1" fill="#b8b0a8" opacity="0.6" />
      <rect x="11" y="11" width="1" height="1" fill="#3a352e" />

      <!-- Head — ramp + crumbling horns -->
      <rect x="7" y="2" width="8" height="5" fill="#5a5048" />
      <rect x="7" y="2" width="8" height="1" fill="#7a7068" />
      <rect x="7" y="2" width="2" height="5" fill="#7a7068" />
      <rect x="7" y="2" width="1" height="3" fill="#9a9088" />
      <rect x="14" y="2" width="1" height="5" fill="#3a352e" />
      <rect x="7" y="0" width="1" height="3" fill="#5a5048" />
      <rect x="14" y="0" width="1" height="3" fill="#3a352e" />
      <rect x="7" y="0" width="1" height="1" fill="#7a7068" />
      <rect x="6" y="1" width="1" height="1" fill="#5a5048" />
      <rect x="15" y="1" width="1" height="1" fill="#3a352e" />

      <!-- Eyes — pale grit-light + spark -->
      <rect x="8" y="3" width="2" height="2" fill="#1a1410" />
      <rect x="12" y="3" width="2" height="2" fill="#1a1410" />
      <rect x="8" y="3" width="1" height="1" fill="#e0d8c0" />
      <rect x="12" y="3" width="1" height="1" fill="#c8c0b0" />

      <!-- Grimacing mouth -->
      <rect x="8" y="5" width="6" height="2" fill="#1a1410" />
      <rect x="8" y="5" width="1" height="2" fill="#e0d8c0" />
      <rect x="10" y="5" width="1" height="1" fill="#e0d8c0" />
      <rect x="13" y="5" width="1" height="2" fill="#c8c0b0" />

      <!-- Arms — ramp + clawed hands -->
      <rect x="6" y="9" width="2" height="5" fill="#5a5048" />
      <rect x="6" y="9" width="1" height="5" fill="#7a7068" />
      <rect x="14" y="9" width="2" height="5" fill="#5a5048" />
      <rect x="15" y="9" width="1" height="5" fill="#3a352e" />
      <rect x="5" y="13" width="3" height="2" fill="#5a5048" />
      <rect x="5" y="13" width="3" height="1" fill="#7a7068" />
      <rect x="14" y="13" width="3" height="2" fill="#5a5048" />
      <polygon points="5,14 4,16 6,15" fill="#1a1410" />
      <polygon points="7,14 6,16 8,15" fill="#1a1410" />
      <polygon points="15,14 14,16 16,15" fill="#1a1410" />
      <polygon points="17,14 16,16 18,15" fill="#1a1410" />

      <!-- Tail -->
      <rect x="11" y="15" width="1" height="6" fill="#5a5048" />
      <rect x="10" y="20" width="1" height="2" fill="#3a352e" />
      <polygon points="9,22 11,24 10,22" fill="#1a1410" />

      <!-- Legs — ramp + talons -->
      <rect x="8" y="15" width="2" height="6" fill="#5a5048" />
      <rect x="8" y="15" width="1" height="6" fill="#7a7068" />
      <rect x="12" y="15" width="2" height="6" fill="#5a5048" />
      <rect x="13" y="15" width="1" height="6" fill="#3a352e" />
      <rect x="7" y="21" width="4" height="2" fill="#5a5048" />
      <rect x="11" y="21" width="4" height="2" fill="#5a5048" />
      <polygon points="7,23 8,25 9,23" fill="#1a1410" />
      <polygon points="13,23 14,25 15,23" fill="#1a1410" />

      <!-- Billowing dust cloud -->
      <ellipse cx="11" cy="26" rx="8" ry="1.5" fill="#9a9088" opacity="0.3" />
      <ellipse cx="11" cy="27" rx="6" ry="0.8" fill="#b8b0a8" opacity="0.2" />
      <rect x="4" y="24" width="1" height="1" fill="#b8b0a8" opacity="0.4" />
      <rect x="17" y="25" width="1" height="1" fill="#9a9088" opacity="0.35" />
    </svg>
