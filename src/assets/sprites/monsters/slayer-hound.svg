<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 28 24"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Slayer Hound"
    >
      <!-- Hot backlight + ground-contact shadow -->
      <ellipse cx="14" cy="13" rx="14" ry="11" fill="#b8501a" opacity="0.08" />
      <ellipse cx="14" cy="23" rx="11" ry="1.3" fill="#000" opacity="0.42" />

      <!-- Head — hide ramp, key light upper-left -->
      <rect x="2" y="9" width="6" height="6" fill="#5a3018" />
      <rect x="2" y="9" width="6" height="1" fill="#9a5a30" />
      <rect x="2" y="9" width="2" height="5" fill="#7a4028" />
      <rect x="2" y="9" width="1" height="3" fill="#b87440" />
      <rect x="6" y="10" width="2" height="5" fill="#3a1a08" />
      <polygon points="2,9 0,7 0,11" fill="#5a3018" />
      <polygon points="2,9 0,7 1,9" fill="#7a4028" />
      <polygon points="2,12 0,14 2,15" fill="#3a1a08" />

      <!-- Predator eye — gold iris, red core, spark -->
      <rect x="3" y="11" width="1" height="1" fill="#f4d042" />
      <rect x="3" y="11" width="1" height="1" fill="#b53c4a" />
      <rect x="3" y="10" width="1" height="1" fill="#fff0b0" opacity="0.6" />

      <!-- Frayed ears -->
      <polygon points="0,8 2,9 1,11" fill="#3a1a08" />
      <polygon points="3,7 5,9 3,9" fill="#3a1a08" />
      <polygon points="3,7 5,9 4,8" fill="#7a4028" opacity="0.6" />

      <!-- Snout + bared fangs -->
      <rect x="0" y="13" width="3" height="2" fill="#1a1410" />
      <rect x="0" y="14" width="3" height="1" fill="#5a3018" />
      <polygon points="0,14 1,16 2,14" fill="#ffffff" />
      <polygon points="2,14 3,16 4,14" fill="#e8e0c4" />

      <!-- Body — hide ramp, lit ridge, dark belly -->
      <rect x="6" y="9" width="14" height="8" fill="#5a3018" />
      <rect x="6" y="9" width="14" height="1" fill="#9a5a30" />
      <rect x="6" y="10" width="14" height="1" fill="#7a4028" />
      <rect x="6" y="16" width="14" height="1" fill="#3a1a08" />
      <rect x="6" y="9" width="1" height="8" fill="#b87440" opacity="0.6" />

      <!-- Scar mottling -->
      <rect x="8" y="12" width="3" height="2" fill="#3a1a08" />
      <rect x="13" y="13" width="3" height="2" fill="#3a1a08" />
      <rect x="16" y="11" width="2" height="2" fill="#3a1a08" />
      <rect x="9" y="11" width="1" height="1" fill="#9a5a30" opacity="0.6" />
      <rect x="14" y="11" width="1" height="1" fill="#9a5a30" opacity="0.5" />

      <!-- Hackle + spike up-right -->
      <rect x="20" y="8" width="3" height="8" fill="#5a3018" />
      <rect x="20" y="8" width="1" height="8" fill="#7a4028" />
      <polygon points="22,8 28,2 26,8" fill="#5a3018" />
      <polygon points="22,8 27,3 24,4" fill="#3a1a08" />
      <polygon points="23,7 28,2 27,4" fill="#9a5a30" opacity="0.5" />

      <!-- Legs — ramp, shadow on inner edge -->
      <rect x="7" y="17" width="3" height="6" fill="#5a3018" />
      <rect x="11" y="17" width="3" height="6" fill="#5a3018" />
      <rect x="15" y="17" width="3" height="6" fill="#5a3018" />
      <rect x="19" y="17" width="3" height="6" fill="#5a3018" />
      <rect x="7" y="17" width="1" height="6" fill="#7a4028" />
      <rect x="11" y="17" width="1" height="6" fill="#7a4028" />
      <rect x="15" y="17" width="1" height="6" fill="#7a4028" />
      <rect x="19" y="17" width="1" height="6" fill="#7a4028" />
      <rect x="9" y="17" width="1" height="6" fill="#3a1a08" />
      <rect x="13" y="17" width="1" height="6" fill="#3a1a08" />
      <rect x="17" y="17" width="1" height="6" fill="#3a1a08" />
      <rect x="21" y="17" width="1" height="6" fill="#3a1a08" />

      <!-- Claws -->
      <rect x="6" y="22" width="5" height="2" fill="#1a1410" />
      <rect x="11" y="22" width="4" height="2" fill="#1a1410" />
      <rect x="15" y="22" width="4" height="2" fill="#1a1410" />
      <rect x="19" y="22" width="4" height="2" fill="#1a1410" />
      <rect x="7" y="23" width="1" height="1" fill="#d4c8a8" opacity="0.5" />
      <rect x="16" y="23" width="1" height="1" fill="#d4c8a8" opacity="0.5" />

      <!-- Embers -->
      <rect x="24" y="9" width="1" height="1" fill="#f4942a" opacity="0.5" />
      <rect x="18" y="19" width="1" height="1" fill="#b8501a" opacity="0.4" />
    </svg>
