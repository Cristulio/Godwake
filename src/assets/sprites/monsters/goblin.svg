<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 20 32"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Goblin"
    >
      <!-- Atmospheric backlight + ground-contact shadow -->
      <ellipse cx="10" cy="15" rx="10" ry="14" fill="#5e8a2e" opacity="0.07" />
      <ellipse cx="10" cy="31" rx="7" ry="1.4" fill="#000" opacity="0.4" />

      <!-- Ears — green ramp with lit upper edge -->
      <rect x="3" y="3" width="2" height="3" fill="#4a7022" />
      <rect x="3" y="3" width="2" height="1" fill="#5e8a2e" />
      <rect x="2" y="4" width="1" height="2" fill="#2d3f12" />
      <rect x="15" y="3" width="2" height="3" fill="#4a7022" />
      <rect x="15" y="3" width="2" height="1" fill="#5e8a2e" />
      <rect x="17" y="4" width="1" height="2" fill="#2d3f12" />

      <!-- Head — ramp: shadow side right, key light upper-left -->
      <rect x="5" y="2" width="10" height="8" fill="#4a7022" />
      <rect x="5" y="2" width="10" height="1" fill="#2d3f12" />
      <rect x="5" y="3" width="2" height="6" fill="#5e8a2e" />
      <rect x="5" y="3" width="1" height="4" fill="#7faa3e" />
      <rect x="4" y="4" width="1" height="4" fill="#2d3f12" />
      <rect x="13" y="3" width="2" height="6" fill="#3a5018" />
      <rect x="15" y="4" width="1" height="4" fill="#2d3f12" />

      <!-- Snout / nose with occlusion -->
      <rect x="9" y="4" width="2" height="3" fill="#3a5018" />
      <rect x="10" y="5" width="1" height="3" fill="#2d3f12" />
      <rect x="9" y="7" width="1" height="1" fill="#1f3310" />

      <!-- Glaring eyes — yellow with red core + spark -->
      <rect x="5" y="4" width="4" height="1" fill="#22300f" />
      <rect x="11" y="4" width="4" height="1" fill="#22300f" />
      <rect x="6" y="5" width="2" height="1" fill="#f4d042" />
      <rect x="12" y="5" width="2" height="1" fill="#f4d042" />
      <rect x="6" y="5" width="1" height="1" fill="#b5302c" />
      <rect x="13" y="5" width="1" height="1" fill="#b5302c" />
      <rect x="7" y="5" width="1" height="1" fill="#fff4a0" />

      <!-- Snarling mouth — dark with bright fangs -->
      <rect x="6" y="8" width="8" height="2" fill="#160f0a" />
      <rect x="6" y="8" width="1" height="1" fill="#e8dcc4" />
      <rect x="8" y="8" width="1" height="2" fill="#e8dcc4" />
      <rect x="11" y="8" width="1" height="1" fill="#e8dcc4" />
      <rect x="13" y="9" width="1" height="1" fill="#d4c8a8" />
      <rect x="7" y="10" width="6" height="1" fill="#3a5018" />

      <!-- Shoulders -->
      <rect x="3" y="11" width="14" height="2" fill="#4a7022" />
      <rect x="3" y="11" width="14" height="1" fill="#5e8a2e" />
      <rect x="3" y="11" width="2" height="2" fill="#2d3f12" />
      <rect x="15" y="11" width="2" height="2" fill="#2d3f12" />
      <rect x="5" y="11" width="3" height="1" fill="#7faa3e" />

      <!-- Leather torso — brown ramp + rivets -->
      <rect x="5" y="13" width="10" height="7" fill="#5a3a22" />
      <rect x="5" y="13" width="10" height="1" fill="#7a5230" />
      <rect x="5" y="13" width="2" height="6" fill="#6b4a2e" />
      <rect x="5" y="13" width="1" height="6" fill="#3a2418" />
      <rect x="13" y="13" width="2" height="6" fill="#3a2418" />
      <rect x="5" y="20" width="10" height="1" fill="#2a1810" />
      <rect x="6" y="15" width="1" height="1" fill="#a8814a" />
      <rect x="9" y="15" width="1" height="1" fill="#a8814a" />
      <rect x="12" y="15" width="1" height="1" fill="#8c6232" />
      <rect x="7" y="17" width="1" height="1" fill="#8c6232" />
      <rect x="11" y="17" width="1" height="1" fill="#8c6232" />
      <!-- Belt buckle -->
      <rect x="9" y="18" width="2" height="2" fill="#d4b062" />
      <rect x="9" y="18" width="1" height="1" fill="#f4d042" />
      <rect x="10" y="19" width="1" height="1" fill="#9a7e2e" />

      <!-- Arms — green ramp -->
      <rect x="3" y="13" width="2" height="7" fill="#4a7022" />
      <rect x="3" y="13" width="1" height="7" fill="#3a5018" />
      <rect x="15" y="13" width="2" height="7" fill="#4a7022" />
      <rect x="16" y="13" width="1" height="7" fill="#3a5018" />
      <rect x="2" y="19" width="3" height="2" fill="#4a7022" />
      <rect x="2" y="19" width="3" height="1" fill="#5e8a2e" />
      <rect x="15" y="19" width="3" height="2" fill="#4a7022" />

      <!-- Crude dagger — steel ramp + specular -->
      <rect x="17" y="13" width="1" height="6" fill="#8a91a4" />
      <rect x="17" y="13" width="1" height="2" fill="#e8eef8" />
      <rect x="17" y="15" width="1" height="1" fill="#ffffff" />
      <rect x="18" y="19" width="1" height="2" fill="#8a91a4" />
      <rect x="16" y="18" width="2" height="1" fill="#5a3a20" />

      <!-- Loincloth -->
      <rect x="6" y="21" width="8" height="3" fill="#3a2418" />
      <rect x="6" y="21" width="8" height="1" fill="#5a3a20" />
      <rect x="9" y="21" width="2" height="3" fill="#2a1810" />

      <!-- Legs -->
      <rect x="6" y="24" width="3" height="6" fill="#4a7022" />
      <rect x="6" y="24" width="1" height="6" fill="#5e8a2e" />
      <rect x="8" y="24" width="1" height="6" fill="#3a5018" />
      <rect x="11" y="24" width="3" height="6" fill="#4a7022" />
      <rect x="11" y="24" width="1" height="6" fill="#3a5018" />
      <rect x="13" y="26" width="1" height="4" fill="#2d3f12" />

      <!-- Splayed feet -->
      <rect x="5" y="30" width="4" height="2" fill="#3a5018" />
      <rect x="5" y="30" width="4" height="1" fill="#4a7022" />
      <rect x="11" y="30" width="4" height="2" fill="#3a5018" />
      <rect x="11" y="30" width="4" height="1" fill="#4a7022" />
    </svg>
