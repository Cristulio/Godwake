<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 38 33"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Shadow Hound"
    >
      <!-- Umbral backlight + ground-contact shadow -->
      <ellipse cx="19" cy="18" rx="19" ry="15" fill="#7a5ec0" opacity="0.08" />
      <ellipse cx="19" cy="31.6" rx="15" ry="1.7" fill="#000" opacity="0.4" />

      <!-- ── Tail spike — smoke flame streaming up-right ── -->
      <rect x="28" y="10" width="4" height="3" fill="#1a1828" />
      <rect x="31" y="7" width="3" height="4" fill="#1a1828" />
      <rect x="33" y="4" width="3" height="4" fill="#1a1828" opacity="0.85" />
      <rect x="35" y="2" width="3" height="3" fill="#1a1828" opacity="0.6" />
      <rect x="36" y="0" width="2" height="2" fill="#1a1828" opacity="0.35" />
      <rect x="31" y="7" width="1" height="3" fill="#3a3458" />
      <rect x="33" y="4" width="1" height="2" fill="#2a2440" opacity="0.8" />
      <rect x="35" y="2" width="1" height="1" fill="#4a4070" opacity="0.6" />

      <!-- ── Haunches + body — void ramp, lit spine ── -->
      <rect x="8" y="11" width="24" height="11" fill="#100e1c" />
      <rect x="9" y="12" width="22" height="9" fill="#1a1828" />
      <rect x="9" y="12" width="22" height="1" fill="#3a3458" />
      <rect x="9" y="12" width="6" height="1" fill="#4a4070" />
      <rect x="9" y="13" width="3" height="7" fill="#221e36" />
      <rect x="9" y="13" width="1" height="5" fill="#2a2440" />
      <rect x="26" y="13" width="5" height="8" fill="#100e1c" />
      <rect x="29" y="14" width="2" height="7" fill="#0a0a18" />
      <!-- smoke pulling off the flank -->
      <rect x="14" y="10" width="3" height="2" fill="#1a1828" opacity="0.6" />
      <rect x="20" y="9" width="3" height="3" fill="#1a1828" opacity="0.5" />
      <rect x="25" y="10" width="2" height="2" fill="#1a1828" opacity="0.4" />
      <rect x="15" y="10" width="1" height="1" fill="#3a3458" opacity="0.6" />
      <rect x="21" y="9" width="1" height="1" fill="#2a2440" opacity="0.6" />
      <!-- flank dither -->
      <rect x="13" y="14" width="1" height="1" fill="#2a2440" />
      <rect x="18" y="13" width="1" height="1" fill="#3a3458" opacity="0.7" />
      <rect x="23" y="15" width="1" height="1" fill="#0a0a18" />
      <rect x="16" y="18" width="1" height="1" fill="#0a0a18" />
      <!-- starved rib hints -->
      <rect x="17" y="15" width="1" height="4" fill="#0c0a16" />
      <rect x="20" y="15" width="1" height="4" fill="#0c0a16" />

      <!-- ── Neck driving down into the lunge ── -->
      <rect x="6" y="12" width="8" height="8" fill="#100e1c" />
      <rect x="7" y="13" width="6" height="6" fill="#1a1828" />
      <rect x="7" y="13" width="6" height="1" fill="#3a3458" />
      <rect x="7" y="13" width="2" height="5" fill="#2a2440" />

      <!-- ── Head — low, all teeth and eye-light ── -->
      <rect x="1" y="11" width="9" height="8" fill="#100e1c" />
      <rect x="2" y="12" width="7" height="6" fill="#1a1828" />
      <rect x="2" y="12" width="7" height="1" fill="#3a3458" />
      <rect x="2" y="12" width="2" height="5" fill="#2a2440" />
      <rect x="2" y="12" width="1" height="3" fill="#4a4070" />
      <rect x="7" y="13" width="2" height="5" fill="#100e1c" />
      <!-- frayed ears swept back -->
      <rect x="6" y="9" width="3" height="3" fill="#100e1c" />
      <rect x="7" y="10" width="1" height="1" fill="#3a2858" />
      <rect x="9" y="8" width="2" height="4" fill="#100e1c" opacity="0.7" />
      <rect x="10" y="9" width="1" height="1" fill="#2a2440" opacity="0.7" />

      <!-- ── Eyes — violet hunting-light, bloomed ── -->
      <ellipse cx="4" cy="14" rx="2.6" ry="1.8" fill="#a48ee0" opacity="0.4" />
      <rect x="2" y="13" width="3" height="2" fill="#a48ee0" />
      <rect x="2" y="13" width="1" height="1" fill="#e8d4ff" />
      <rect x="4" y="14" width="1" height="1" fill="#7a5ec0" />

      <!-- ── Muzzle peeled open — jagged starlight teeth ── -->
      <rect x="0" y="17" width="8" height="3" fill="#0a0a18" />
      <rect x="0" y="17" width="8" height="1" fill="#5a4e88" />
      <rect x="0" y="18" width="1" height="2" fill="#e8d4ff" />
      <rect x="2" y="18" width="1" height="2" fill="#c4b0ee" />
      <rect x="4" y="18" width="1" height="2" fill="#e8d4ff" />
      <rect x="6" y="18" width="1" height="2" fill="#a494d0" />
      <!-- lower jaw -->
      <rect x="1" y="20" width="7" height="2" fill="#100e1c" />
      <rect x="2" y="20" width="1" height="1" fill="#c4b0ee" />
      <rect x="4" y="20" width="1" height="1" fill="#a494d0" />
      <rect x="6" y="20" width="1" height="1" fill="#8a7ab8" />
      <!-- void-breath drifting from the maw -->
      <rect x="0" y="15" width="2" height="1" fill="#a48ee0" opacity="0.3" />
      <rect x="0" y="22" width="2" height="1" fill="#5a4e88" opacity="0.35" />

      <!-- ── Legs — mid-lunge, fore braced, hind driving ── -->
      <rect x="7" y="20" width="4" height="11" fill="#100e1c" />
      <rect x="8" y="21" width="2" height="9" fill="#221e36" />
      <rect x="8" y="21" width="1" height="9" fill="#2a2440" />
      <rect x="12" y="21" width="4" height="10" fill="#100e1c" />
      <rect x="13" y="22" width="2" height="8" fill="#16142a" />
      <rect x="22" y="20" width="4" height="11" fill="#100e1c" />
      <rect x="23" y="21" width="2" height="9" fill="#221e36" />
      <rect x="23" y="21" width="1" height="9" fill="#2a2440" />
      <rect x="27" y="21" width="4" height="10" fill="#100e1c" />
      <rect x="28" y="22" width="2" height="8" fill="#0e0c1a" />
      <!-- paws dissolving into the floor -->
      <rect x="6" y="30" width="5" height="2" fill="#100e1c" opacity="0.8" />
      <rect x="11" y="30" width="5" height="2" fill="#100e1c" opacity="0.7" />
      <rect x="21" y="30" width="5" height="2" fill="#100e1c" opacity="0.8" />
      <rect x="26" y="30" width="5" height="2" fill="#100e1c" opacity="0.7" />
      <rect x="7" y="31" width="2" height="1" fill="#3a3458" opacity="0.4" />
      <rect x="22" y="31" width="2" height="1" fill="#3a3458" opacity="0.4" />

      <!-- ── Drifting umbral motes ── -->
      <rect x="12" y="7" width="1" height="1" fill="#a48ee0" opacity="0.35" />
      <rect x="24" y="7" width="1" height="2" fill="#a48ee0" opacity="0.28" />
      <rect x="33" y="12" width="1" height="1" fill="#a48ee0" opacity="0.3" />
      <rect x="17" y="23" width="1" height="1" fill="#6a3a82" opacity="0.4" />
    </svg>
