<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 28 24"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Shadow Hound"
    >
      <!-- Umbral backlight + ground-contact shadow -->
      <ellipse cx="14" cy="13" rx="14" ry="11" fill="#7a5ec0" opacity="0.08" />
      <ellipse cx="14" cy="23" rx="11" ry="1.3" fill="#000" opacity="0.4" />

      <!-- Head — shadow ramp, key light upper-left -->
      <rect x="2" y="9" width="6" height="6" fill="#1a1828" />
      <rect x="2" y="9" width="6" height="1" fill="#3a3458" />
      <rect x="2" y="9" width="2" height="5" fill="#2a2440" />
      <rect x="2" y="9" width="1" height="3" fill="#4a4070" />
      <rect x="6" y="10" width="2" height="5" fill="#100e1c" />
      <polygon points="2,9 0,7 0,11" fill="#1a1828" />
      <polygon points="2,9 0,7 1,9" fill="#3a3458" />
      <polygon points="2,12 0,14 2,15" fill="#100e1c" />

      <!-- Eyes — cold violet glow + spark -->
      <rect x="2" y="10" width="2" height="2" fill="#a48ee0" />
      <rect x="2" y="10" width="1" height="1" fill="#e8d4ff" />
      <circle cx="3" cy="11" r="1.4" fill="#a48ee0" opacity="0.45" />

      <!-- Snout + jagged teeth -->
      <rect x="0" y="13" width="3" height="2" fill="#0a0a18" />
      <rect x="0" y="14" width="3" height="1" fill="#5a4e88" />
      <polygon points="0,14 1,16 2,14" fill="#e8d4ff" />
      <polygon points="2,14 3,16 4,14" fill="#c4b0ee" />

      <!-- Frayed ears -->
      <polygon points="0,8 2,9 1,11" fill="#3a2858" />
      <polygon points="0,8 2,9 1,9" fill="#5a4e88" opacity="0.6" />
      <polygon points="3,7 5,9 3,9" fill="#3a2858" />

      <!-- Body — shadow ramp, lit top edge, dark belly -->
      <rect x="6" y="9" width="14" height="8" fill="#1a1828" />
      <rect x="6" y="9" width="14" height="1" fill="#3a3458" />
      <rect x="6" y="10" width="14" height="1" fill="#2a2440" />
      <rect x="6" y="15" width="14" height="2" fill="#0a0a18" />
      <rect x="6" y="9" width="1" height="8" fill="#4a4070" opacity="0.7" />

      <!-- Hackle / shoulder spike + tail spike up-right -->
      <rect x="20" y="8" width="3" height="8" fill="#1a1828" />
      <rect x="20" y="8" width="1" height="8" fill="#3a3458" />
      <polygon points="22,8 28,2 26,8" fill="#1a1828" />
      <polygon points="22,8 28,2 25,5" fill="#2a2440" opacity="0.8" />
      <polygon points="23,7 28,2 27,4" fill="#4a4070" opacity="0.5" />

      <!-- Smoky tone-boundary dither across the flank -->
      <rect x="9" y="11" width="1" height="1" fill="#3a3458" opacity="0.6" />
      <rect x="13" y="11" width="1" height="1" fill="#2a2440" />
      <rect x="16" y="10" width="1" height="1" fill="#3a3458" opacity="0.6" />
      <rect x="11" y="14" width="1" height="1" fill="#0a0a18" />
      <rect x="15" y="14" width="1" height="1" fill="#0a0a18" />

      <!-- Legs — ramp, shadow on left of each -->
      <rect x="7" y="17" width="3" height="6" fill="#1a1828" />
      <rect x="11" y="17" width="3" height="6" fill="#1a1828" />
      <rect x="15" y="17" width="3" height="6" fill="#1a1828" />
      <rect x="19" y="17" width="3" height="6" fill="#1a1828" />
      <rect x="7" y="17" width="1" height="6" fill="#2a2440" />
      <rect x="11" y="17" width="1" height="6" fill="#2a2440" />
      <rect x="15" y="17" width="1" height="6" fill="#2a2440" />
      <rect x="19" y="17" width="1" height="6" fill="#2a2440" />
      <rect x="9" y="17" width="1" height="6" fill="#0a0a18" />
      <rect x="13" y="17" width="1" height="6" fill="#0a0a18" />
      <rect x="17" y="17" width="1" height="6" fill="#0a0a18" />
      <rect x="21" y="17" width="1" height="6" fill="#0a0a18" />

      <!-- Dissolving paws -->
      <rect x="6" y="22" width="5" height="2" fill="#0a0a18" />
      <rect x="11" y="22" width="4" height="2" fill="#0a0a18" />
      <rect x="15" y="22" width="4" height="2" fill="#0a0a18" />
      <rect x="19" y="22" width="4" height="2" fill="#0a0a18" />

      <!-- Drifting umbral motes -->
      <rect x="10" y="12" width="1" height="1" fill="#a48ee0" opacity="0.4" />
      <rect x="24" y="9" width="1" height="1" fill="#a48ee0" opacity="0.35" />
      <rect x="18" y="19" width="1" height="1" fill="#7a5ec0" opacity="0.3" />
    </svg>
