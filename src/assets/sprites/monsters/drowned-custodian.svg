<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 44"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="The Drowned Custodian"
    >
      <!-- Cold tidal backlight + ground shadow -->
      <ellipse cx="16" cy="22" rx="15" ry="20" fill="#3a8278" opacity="0.07" />
      <ellipse cx="16" cy="42" rx="12" ry="2" fill="#000" opacity="0.42" />

      <!-- Ritual ward circle -->
      <circle cx="16" cy="20" r="15" fill="none" stroke="#6a5020" stroke-width="1.4" opacity="0.55" />
      <circle cx="16" cy="20" r="15" fill="none" stroke="#b08840" stroke-width="0.4" opacity="0.4" />
      <circle cx="16" cy="20" r="11" fill="none" stroke="#8a6a2a" stroke-width="0.9" opacity="0.5" />
      <line x1="16" y1="5" x2="16" y2="35" stroke="#6a5020" stroke-width="0.6" opacity="0.5" />
      <line x1="1" y1="20" x2="31" y2="20" stroke="#6a5020" stroke-width="0.6" opacity="0.5" />
      <line x1="5" y1="9" x2="27" y2="31" stroke="#6a5020" stroke-width="0.5" opacity="0.4" />
      <line x1="27" y1="9" x2="5" y2="31" stroke="#6a5020" stroke-width="0.5" opacity="0.4" />
      <circle cx="16" cy="20" r="3" fill="#5a4418" opacity="0.7" />

      <!-- Crown / headdress — teal ramp + gold spikes -->
      <rect x="9" y="3" width="14" height="6" fill="#16302e" />
      <rect x="9" y="3" width="14" height="1" fill="#2a5a56" />
      <rect x="9" y="3" width="2" height="6" fill="#1e3a38" />
      <rect x="21" y="3" width="2" height="6" fill="#102422" />
      <rect x="11" y="1" width="10" height="3" fill="#6a5020" />
      <rect x="11" y="1" width="10" height="1" fill="#b08840" />
      <rect x="11" y="1" width="3" height="1" fill="#d4b062" />
      <rect x="13" y="0" width="2" height="2" fill="#f4d042" opacity="0.8" />
      <rect x="17" y="0" width="2" height="2" fill="#f4d042" opacity="0.7" />

      <!-- Face — pale stone ramp + cold eyes -->
      <ellipse cx="16" cy="11" rx="6" ry="5" fill="#6a7a76" />
      <ellipse cx="16" cy="11" rx="5" ry="4" fill="#8a9a92" />
      <ellipse cx="14.5" cy="10" rx="2.5" ry="2" fill="#a4b4ae" />
      <rect x="12" y="9" width="2" height="3" fill="#8ad0e0" />
      <rect x="18" y="9" width="2" height="3" fill="#8ad0e0" />
      <rect x="12" y="9" width="1" height="1" fill="#d4f4ff" />
      <rect x="18" y="9" width="1" height="1" fill="#d4f4ff" />
      <rect x="14" y="13" width="4" height="1" fill="#1e3838" />
      <rect x="13" y="11" width="1" height="3" fill="#56625e" opacity="0.6" />
      <rect x="18" y="11" width="1" height="3" fill="#56625e" opacity="0.6" />

      <!-- Robe torso — teal ramp + lit fold -->
      <rect x="7" y="16" width="18" height="16" fill="#1a3432" />
      <rect x="7" y="16" width="18" height="1" fill="#2a5a56" />
      <rect x="7" y="16" width="2" height="15" fill="#1e3a38" />
      <rect x="7" y="16" width="1" height="14" fill="#2a5a56" />
      <rect x="23" y="17" width="2" height="14" fill="#102422" />
      <rect x="14" y="17" width="4" height="15" fill="#2a5a56" />
      <rect x="15" y="17" width="2" height="15" fill="#3a706a" />
      <!-- Wet sheen + dither -->
      <rect x="8" y="20" width="16" height="1" fill="#a8c0b8" opacity="0.32" />
      <rect x="9" y="26" width="14" height="1" fill="#a8c0b8" opacity="0.28" />
      <rect x="11" y="23" width="1" height="1" fill="#2a5a56" />
      <rect x="20" y="22" width="1" height="1" fill="#102422" />

      <!-- Side arms + pale webbed claws -->
      <rect x="3" y="18" width="4" height="4" fill="#1e3a38" />
      <rect x="3" y="18" width="4" height="1" fill="#2a5a56" />
      <rect x="1" y="21" width="4" height="4" fill="#6a7a76" />
      <rect x="0" y="24" width="3" height="3" fill="#8a9a92" />
      <rect x="0" y="24" width="3" height="1" fill="#a4b4ae" />
      <rect x="25" y="18" width="4" height="4" fill="#16302e" />
      <rect x="27" y="21" width="4" height="4" fill="#5a6a66" />
      <rect x="29" y="24" width="3" height="3" fill="#7a8a86" />

      <!-- Fin / tendril hem -->
      <rect x="8" y="32" width="16" height="4" fill="#0e2230" />
      <rect x="8" y="32" width="16" height="1" fill="#1a3432" />
      <polygon points="8,36 11,41 14,36" fill="#16302e" />
      <polygon points="8,36 10,41 14,36" fill="#1e3a38" />
      <polygon points="13,36 16,42 19,36" fill="#16302e" />
      <polygon points="18,36 21,41 24,36" fill="#102422" />
      <rect x="2" y="40" width="28" height="4" fill="#0a1822" opacity="0.8" />
      <rect x="2" y="40" width="28" height="1" fill="#14323e" opacity="0.6" />
      <rect x="6" y="38" width="3" height="2" fill="#8ad0e0" opacity="0.3" />
      <rect x="23" y="39" width="3" height="2" fill="#8ad0e0" opacity="0.3" />
    </svg>
