<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 22 28"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Imp Needler"
    >
      <!-- Hellfire backlight + ground-contact shadow -->
      <ellipse cx="11" cy="13" rx="11" ry="13" fill="#5fbf3a" opacity="0.17" />
      <ellipse cx="11" cy="26" rx="7" ry="1.4" fill="#000" opacity="0.42" />

      <!-- Bat wings — membrane ramp, lit upper edge + cool rim -->
      <polygon points="0,9 5,4 7,11 5,14" fill="#5a1010" />
      <polygon points="22,9 17,4 15,11 17,14" fill="#5a1010" />
      <polygon points="1,9 5,5 6,11" fill="#7a1c10" opacity="0.85" />
      <polygon points="21,9 17,5 16,11" fill="#7a1c10" opacity="0.85" />
      <polygon points="2,8 5,5 5,9" fill="#a83018" opacity="0.6" />
      <polygon points="20,8 17,5 17,9" fill="#3a0c08" opacity="0.6" />
      <!-- Wing ribs -->
      <line x1="2" y1="6" x2="6" y2="13" stroke="#1a0606" stroke-width="0.5" />
      <line x1="20" y1="6" x2="16" y2="13" stroke="#1a0606" stroke-width="0.5" />
      <line x1="5" y1="4" x2="5" y2="13" stroke="#1a0606" stroke-width="0.3" />
      <line x1="17" y1="4" x2="17" y2="13" stroke="#1a0606" stroke-width="0.3" />

      <!-- Torso — red ramp, key light upper-left -->
      <rect x="8" y="7" width="6" height="8" fill="#a83018" />
      <rect x="8" y="7" width="6" height="1" fill="#c44a24" />
      <rect x="8" y="7" width="2" height="7" fill="#c44a24" />
      <rect x="8" y="7" width="1" height="5" fill="#e8662c" />
      <rect x="13" y="8" width="1" height="7" fill="#6a1810" />
      <rect x="7" y="8" width="1" height="6" fill="#8c2010" />
      <rect x="14" y="8" width="1" height="6" fill="#3a0c08" />
      <!-- Dither at the belly fold -->
      <rect x="10" y="12" width="1" height="1" fill="#8c2010" />
      <rect x="12" y="11" width="1" height="1" fill="#c44a24" />

      <!-- Head — ramped, snarling -->
      <rect x="7" y="2" width="8" height="5" fill="#a83018" />
      <rect x="7" y="2" width="8" height="1" fill="#c44a24" />
      <rect x="7" y="2" width="2" height="4" fill="#c44a24" />
      <rect x="7" y="2" width="1" height="3" fill="#e8662c" />
      <rect x="14" y="2" width="1" height="5" fill="#6a1810" />
      <rect x="8" y="6" width="6" height="2" fill="#8c2010" />
      <polygon points="9,8 11,10 13,8" fill="#8c2010" />
      <polygon points="9,8 11,10 11,8" fill="#a83018" />

      <!-- Horns — dark ramp -->
      <rect x="6" y="0" width="1" height="3" fill="#3a1208" />
      <rect x="15" y="0" width="1" height="3" fill="#3a1208" />
      <rect x="6" y="0" width="1" height="1" fill="#5a2a14" />
      <rect x="15" y="0" width="1" height="1" fill="#5a2a14" />
      <rect x="5" y="1" width="1" height="2" fill="#2a1006" />
      <rect x="16" y="1" width="1" height="2" fill="#2a1006" />
      <rect x="4" y="2" width="1" height="1" fill="#2a1006" />
      <rect x="17" y="2" width="1" height="1" fill="#2a1006" />

      <!-- Glaring eyes — yellow with red core + spark -->
      <rect x="8" y="3" width="2" height="2" fill="#1a0606" />
      <rect x="12" y="3" width="2" height="2" fill="#1a0606" />
      <rect x="8" y="3" width="2" height="1" fill="#f4d042" />
      <rect x="12" y="3" width="2" height="1" fill="#f4d042" />
      <rect x="8" y="4" width="1" height="1" fill="#b5302c" />
      <rect x="13" y="4" width="1" height="1" fill="#b5302c" />
      <rect x="9" y="3" width="1" height="1" fill="#fff4a0" />

      <!-- Fanged mouth -->
      <rect x="8" y="5" width="6" height="1" fill="#1a0606" />
      <rect x="9" y="6" width="1" height="1" fill="#e8dcc4" />
      <rect x="12" y="6" width="1" height="1" fill="#d4c8a8" />

      <!-- Upper arms -->
      <rect x="5" y="9" width="2" height="5" fill="#a83018" />
      <rect x="5" y="9" width="1" height="5" fill="#c44a24" />
      <rect x="15" y="9" width="2" height="5" fill="#a83018" />
      <rect x="16" y="9" width="1" height="5" fill="#6a1810" />

      <!-- Forearms + clawed hands -->
      <rect x="4" y="13" width="3" height="2" fill="#a83018" />
      <rect x="4" y="13" width="3" height="1" fill="#c44a24" />
      <rect x="15" y="13" width="3" height="2" fill="#a83018" />
      <rect x="15" y="13" width="3" height="1" fill="#c44a24" />
      <polygon points="4,15 3,17 5,16" fill="#3a1208" />
      <polygon points="6,15 5,17 7,16" fill="#3a1208" />
      <polygon points="15,15 14,17 16,16" fill="#3a1208" />
      <polygon points="17,15 16,17 18,16" fill="#3a1208" />

      <!-- Conjured fireball — layered glow + specular -->
      <circle cx="17" cy="14" r="2.6" fill="#8c2828" opacity="0.55" />
      <circle cx="17" cy="14" r="1.8" fill="#e8401a" opacity="0.9" />
      <circle cx="17" cy="14" r="1" fill="#ffb040" />
      <rect x="17" y="14" width="1" height="1" fill="#fff4d0" />

      <!-- Barbed tail -->
      <rect x="11" y="15" width="1" height="3" fill="#a83018" />
      <rect x="12" y="17" width="1" height="2" fill="#a83018" />
      <rect x="13" y="18" width="1" height="2" fill="#8c2010" />
      <rect x="14" y="19" width="1" height="2" fill="#8c2010" />
      <polygon points="14,21 17,21 15,24" fill="#3a1208" />
      <polygon points="14,21 17,21 16,19" fill="#3a1208" />
      <polygon points="14,21 17,21 15,20" fill="#5a2a14" opacity="0.7" />

      <!-- Legs -->
      <rect x="8" y="15" width="2" height="6" fill="#a83018" />
      <rect x="12" y="15" width="2" height="6" fill="#a83018" />
      <rect x="8" y="15" width="1" height="6" fill="#c44a24" />
      <rect x="13" y="15" width="1" height="6" fill="#6a1810" />
      <rect x="9" y="15" width="1" height="6" fill="#8c2010" />

      <!-- Hooves -->
      <rect x="7" y="21" width="4" height="3" fill="#3a1208" />
      <rect x="11" y="21" width="4" height="3" fill="#3a1208" />
      <rect x="7" y="21" width="4" height="1" fill="#5a2a14" />
      <rect x="11" y="21" width="4" height="1" fill="#5a2a14" />
      <rect x="8" y="23" width="1" height="1" fill="#1a0606" />
      <rect x="10" y="23" width="1" height="1" fill="#1a0606" />
      <rect x="12" y="23" width="1" height="1" fill="#1a0606" />
      <rect x="14" y="23" width="1" height="1" fill="#1a0606" />

      <!-- Embers drifting off the fireball -->
      <rect x="19" y="11" width="1" height="1" fill="#ffb040" opacity="0.6" />
      <rect x="16" y="10" width="1" height="1" fill="#e8401a" opacity="0.5" />
    </svg>
