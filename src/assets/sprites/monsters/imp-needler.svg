<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 36 46"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Imp Needler"
    >
      <!-- Venom backlight + ground-contact shadow -->
      <ellipse cx="18" cy="22" rx="17" ry="20" fill="#5fbf3a" opacity="0.15" />
      <ellipse cx="18" cy="43.6" rx="11" ry="1.8" fill="#000" opacity="0.45" />

      <!-- ══ Bat wings — spread wide ══ -->
      <!-- left wing -->
      <rect x="0" y="6" width="4" height="3" fill="#150d08" />
      <rect x="2" y="8" width="6" height="4" fill="#150d08" />
      <rect x="4" y="11" width="7" height="5" fill="#150d08" />
      <rect x="6" y="15" width="6" height="4" fill="#150d08" />
      <rect x="1" y="7" width="2" height="1" fill="#6a2418" />
      <rect x="3" y="9" width="4" height="2" fill="#5a1e14" />
      <rect x="5" y="12" width="5" height="3" fill="#4a1810" />
      <rect x="7" y="16" width="4" height="2" fill="#3a120c" />
      <!-- membrane glow at the top edge -->
      <rect x="3" y="9" width="3" height="1" fill="#8a3424" />
      <rect x="5" y="12" width="2" height="1" fill="#7a2c1e" />
      <!-- right wing -->
      <rect x="32" y="6" width="4" height="3" fill="#150d08" />
      <rect x="28" y="8" width="6" height="4" fill="#150d08" />
      <rect x="25" y="11" width="7" height="5" fill="#150d08" />
      <rect x="24" y="15" width="6" height="4" fill="#150d08" />
      <rect x="33" y="7" width="2" height="1" fill="#4a1810" />
      <rect x="29" y="9" width="4" height="2" fill="#3e140e" />
      <rect x="26" y="12" width="5" height="3" fill="#34100a" />
      <rect x="25" y="16" width="4" height="2" fill="#2a0c08" />

      <!-- ══ Needle-stinger tail — whipping up the right ══ -->
      <rect x="26" y="30" width="4" height="3" fill="#150d08" />
      <rect x="29" y="27" width="4" height="4" fill="#150d08" />
      <rect x="31" y="23" width="4" height="5" fill="#150d08" />
      <rect x="27" y="31" width="2" height="1" fill="#5a1e14" />
      <rect x="30" y="28" width="2" height="2" fill="#4a1810" />
      <rect x="32" y="24" width="2" height="3" fill="#3e140e" />
      <!-- the needle tip — venom bright -->
      <rect x="32" y="18" width="3" height="6" fill="#150d08" />
      <rect x="33" y="19" width="1" height="4" fill="#9ac84a" />
      <rect x="33" y="19" width="1" height="2" fill="#c8e060" />
      <!-- venom drip -->
      <rect x="34" y="16" width="1" height="2" fill="#5fbf3a" opacity="0.8" />

      <!-- ══ Horned head ══ -->
      <rect x="10" y="2" width="16" height="12" fill="#150d08" />
      <rect x="11" y="3" width="14" height="10" fill="#6a2418" />
      <rect x="11" y="3" width="5" height="10" fill="#7e2c1e" />
      <rect x="11" y="3" width="2" height="7" fill="#963626" />
      <rect x="22" y="3" width="3" height="10" fill="#54180e" />
      <rect x="24" y="3" width="1" height="10" fill="#42120a" />
      <!-- little horns -->
      <rect x="10" y="0" width="3" height="3" fill="#150d08" />
      <rect x="11" y="1" width="1" height="1" fill="#e8dcc4" />
      <rect x="23" y="0" width="3" height="3" fill="#150d08" />
      <rect x="24" y="1" width="1" height="1" fill="#cdbfa2" />
      <!-- wicked yellow eyes -->
      <rect x="12" y="6" width="4" height="3" fill="#1a1006" />
      <rect x="20" y="6" width="4" height="3" fill="#1a1006" />
      <rect x="13" y="7" width="2" height="1" fill="#e8b830" />
      <rect x="21" y="7" width="2" height="1" fill="#c89220" />
      <rect x="13" y="7" width="1" height="1" fill="#fff0b0" />
      <rect x="21" y="7" width="1" height="1" fill="#ffe070" />
      <!-- needle-tooth grin -->
      <rect x="13" y="10" width="10" height="2" fill="#1a0a06" />
      <rect x="14" y="10" width="1" height="2" fill="#e8dcc4" />
      <rect x="16" y="10" width="1" height="1" fill="#e8dcc4" />
      <rect x="18" y="10" width="1" height="2" fill="#cdbfa2" />
      <rect x="20" y="10" width="1" height="1" fill="#cdbfa2" />

      <!-- ══ Quill-quiver on the back — bristling needles ══ -->
      <rect x="6" y="12" width="2" height="6" fill="#150d08" />
      <rect x="8" y="11" width="2" height="7" fill="#150d08" />
      <rect x="6" y="13" width="1" height="4" fill="#9ac84a" />
      <rect x="8" y="12" width="1" height="5" fill="#7ab040" />
      <rect x="6" y="13" width="1" height="1" fill="#c8e060" />

      <!-- ══ Small wiry body ══ -->
      <rect x="11" y="14" width="14" height="14" fill="#150d08" />
      <rect x="12" y="15" width="12" height="12" fill="#5a1e14" />
      <rect x="12" y="15" width="4" height="12" fill="#6a2418" />
      <rect x="12" y="15" width="2" height="8" fill="#7e2c1e" />
      <rect x="21" y="15" width="3" height="12" fill="#4a1810" />
      <rect x="23" y="15" width="1" height="12" fill="#3a120c" />
      <!-- bony chest ridges -->
      <rect x="13" y="18" width="9" height="1" fill="#42120a" />
      <rect x="13" y="21" width="9" height="1" fill="#3a100a" />
      <rect x="13" y="17" width="4" height="1" fill="#8a3424" />
      <rect x="13" y="20" width="3" height="1" fill="#7a2c1e" />

      <!-- ══ Left arm — brandishing a needle like a rapier ══ -->
      <rect x="6" y="16" width="7" height="6" fill="#150d08" />
      <rect x="7" y="17" width="5" height="4" fill="#6a2418" />
      <rect x="7" y="17" width="2" height="4" fill="#7e2c1e" />
      <!-- tiny fist -->
      <rect x="4" y="20" width="6" height="5" fill="#150d08" />
      <rect x="5" y="21" width="4" height="3" fill="#7e2c1e" />
      <rect x="5" y="21" width="2" height="3" fill="#963626" />
      <!-- the needle — long, venom-tipped -->
      <rect x="1" y="10" width="3" height="12" fill="#150d08" />
      <rect x="2" y="11" width="1" height="11" fill="#b8c4ba" />
      <rect x="2" y="11" width="1" height="4" fill="#e0e8e0" />
      <rect x="2" y="8" width="1" height="3" fill="#9ac84a" />
      <rect x="2" y="8" width="1" height="1" fill="#c8e060" />

      <!-- ══ Right arm — clawing forward ══ -->
      <rect x="23" y="16" width="6" height="6" fill="#150d08" />
      <rect x="24" y="17" width="4" height="4" fill="#4a1810" />
      <rect x="24" y="17" width="2" height="4" fill="#5a1e14" />
      <rect x="25" y="21" width="5" height="4" fill="#150d08" />
      <rect x="26" y="22" width="3" height="2" fill="#54180e" />
      <rect x="26" y="24" width="1" height="2" fill="#cdbfa2" />
      <rect x="28" y="24" width="1" height="2" fill="#b0a486" />

      <!-- ══ Crouched legs ══ -->
      <rect x="11" y="28" width="6" height="8" fill="#150d08" />
      <rect x="12" y="29" width="4" height="7" fill="#5a1e14" />
      <rect x="12" y="29" width="2" height="7" fill="#6a2418" />
      <rect x="18" y="28" width="6" height="8" fill="#150d08" />
      <rect x="19" y="29" width="4" height="7" fill="#4a1810" />
      <rect x="19" y="29" width="1" height="7" fill="#5a1e14" />
      <!-- digitigrade shins -->
      <rect x="10" y="34" width="6" height="6" fill="#150d08" />
      <rect x="11" y="35" width="4" height="4" fill="#4a1810" />
      <rect x="11" y="35" width="2" height="4" fill="#5a1e14" />
      <rect x="19" y="34" width="6" height="6" fill="#150d08" />
      <rect x="20" y="35" width="4" height="4" fill="#3e140e" />

      <!-- ══ Clawed feet ══ -->
      <rect x="8" y="38" width="9" height="5" fill="#150d08" />
      <rect x="9" y="39" width="7" height="3" fill="#42120a" />
      <rect x="8" y="41" width="2" height="2" fill="#cdbfa2" />
      <rect x="12" y="41" width="2" height="2" fill="#b0a486" />
      <rect x="18" y="38" width="9" height="5" fill="#150d08" />
      <rect x="19" y="39" width="7" height="3" fill="#3a100a" />
      <rect x="19" y="41" width="2" height="2" fill="#b0a486" />
      <rect x="23" y="41" width="2" height="2" fill="#988c70" />

      <!-- venom motes -->
      <rect x="5" y="6" width="1" height="1" fill="#9ac84a" opacity="0.6" />
      <rect x="30" y="12" width="1" height="1" fill="#7ab040" opacity="0.5" />
      <rect x="32" y="36" width="1" height="1" fill="#5fbf3a" opacity="0.45" />
    </svg>
