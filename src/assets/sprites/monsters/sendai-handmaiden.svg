<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 44"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Szendra's Handmaiden"
    >
      <!-- Enclave gloom backlight + ground shadow -->
      <ellipse cx="15" cy="24" rx="14" ry="18" fill="#5a3a8a" opacity="0.06" />
      <ellipse cx="15" cy="42.4" rx="10" ry="1.6" fill="#000" opacity="0.4" />

      <!-- White hair swept back under a silver web-circlet -->
      <rect x="8" y="0" width="13" height="4" fill="#150d08" />
      <rect x="9" y="1" width="11" height="2" fill="#e8dcc4" />
      <rect x="9" y="1" width="5" height="1" fill="#f8f2e2" />
      <rect x="17" y="2" width="3" height="1" fill="#cdbfa2" />
      <rect x="8" y="2" width="2" height="7" fill="#150d08" />
      <rect x="9" y="3" width="1" height="5" fill="#e8dcc4" />
      <rect x="20" y="2" width="2" height="8" fill="#150d08" />
      <rect x="20" y="3" width="1" height="6" fill="#cdbfa2" />
      <!-- the web-circlet -->
      <rect x="9" y="2" width="11" height="1" fill="#8a94ac" />
      <rect x="9" y="2" width="4" height="1" fill="#c8d0e0" />
      <rect x="14" y="1" width="1" height="1" fill="#c8d0e0" />

      <!-- Face — obsidian-violet drow, red Arachne eyes -->
      <rect x="9" y="3" width="11" height="10" fill="#150d08" />
      <rect x="10" y="4" width="9" height="8" fill="#4a3c5e" />
      <rect x="10" y="4" width="9" height="1" fill="#5a4a72" />
      <rect x="10" y="4" width="3" height="1" fill="#6a5a86" />
      <rect x="10" y="4" width="1" height="6" fill="#544868" />
      <rect x="17" y="5" width="2" height="7" fill="#3a2e48" />
      <rect x="18" y="6" width="1" height="6" fill="#2e2438" />
      <!-- long drow ear -->
      <rect x="7" y="6" width="3" height="2" fill="#150d08" />
      <rect x="8" y="6" width="2" height="1" fill="#4a3c5e" />
      <!-- eyes — the Spider Queen's red -->
      <rect x="11" y="7" width="2" height="2" fill="#1a0e12" />
      <rect x="15" y="7" width="2" height="2" fill="#1a0e12" />
      <rect x="11" y="7" width="1" height="1" fill="#c83a3a" />
      <rect x="15" y="7" width="1" height="1" fill="#c83a3a" />
      <!-- the devotee's cold mouth -->
      <rect x="12" y="10" width="4" height="1" fill="#3a2e48" />
      <rect x="13" y="10" width="2" height="1" fill="#7e1f2c" />

      <!-- Vestments — Arachne wine over spider-silk panels -->
      <rect x="7" y="13" width="15" height="15" fill="#150d08" />
      <rect x="8" y="14" width="13" height="13" fill="#481021" />
      <rect x="8" y="14" width="13" height="1" fill="#67192a" />
      <rect x="8" y="14" width="5" height="1" fill="#7e1f2c" />
      <rect x="8" y="14" width="2" height="13" fill="#531320" />
      <rect x="8" y="14" width="1" height="8" fill="#67192a" />
      <rect x="18" y="14" width="3" height="13" fill="#3a0d1a" />
      <rect x="20" y="14" width="1" height="13" fill="#330b16" />
      <!-- the silver web stitched across the breast -->
      <rect x="10" y="16" width="9" height="1" fill="#8a94ac" />
      <rect x="10" y="16" width="3" height="1" fill="#c8d0e0" />
      <rect x="14" y="14" width="1" height="6" fill="#8a94ac" />
      <rect x="11" y="19" width="7" height="1" fill="#6a7490" />
      <rect x="12" y="17" width="1" height="1" fill="#c8d0e0" />
      <rect x="16" y="18" width="1" height="1" fill="#c8d0e0" />
      <!-- the spider sigil at the heart -->
      <rect x="13" y="21" width="3" height="3" fill="#150d08" />
      <rect x="14" y="22" width="1" height="1" fill="#c8d0e0" />
      <!-- silk hip-wrap -->
      <rect x="8" y="25" width="13" height="2" fill="#2e2438" />
      <rect x="8" y="25" width="13" height="1" fill="#3a2e48" />
      <rect x="8" y="25" width="4" height="1" fill="#4a3c5e" />

      <!-- Scourge arm — raised, three poisoned tails -->
      <rect x="19" y="14" width="6" height="4" fill="#150d08" />
      <rect x="20" y="15" width="4" height="2" fill="#481021" />
      <rect x="20" y="15" width="4" height="1" fill="#67192a" />
      <rect x="23" y="11" width="4" height="5" fill="#150d08" />
      <rect x="24" y="12" width="2" height="3" fill="#4a3c5e" />
      <rect x="24" y="12" width="1" height="1" fill="#5a4a72" />
      <!-- scourge handle -->
      <rect x="24" y="8" width="2" height="4" fill="#150d08" />
      <rect x="24" y="9" width="1" height="3" fill="#6a3a1a" />
      <!-- the three tails, barbs beaded with venom -->
      <rect x="25" y="5" width="2" height="4" fill="#150d08" />
      <rect x="26" y="6" width="1" height="3" fill="#3a2c20" />
      <rect x="27" y="3" width="2" height="3" fill="#150d08" />
      <rect x="28" y="4" width="1" height="2" fill="#4a3a2a" />
      <rect x="28" y="2" width="1" height="1" fill="#a8c428" />
      <rect x="23" y="4" width="2" height="3" fill="#150d08" />
      <rect x="24" y="5" width="1" height="2" fill="#3a2c20" />
      <rect x="23" y="3" width="1" height="1" fill="#d4f04a" />
      <rect x="26" y="1" width="1" height="3" fill="#150d08" />
      <rect x="26" y="2" width="1" height="1" fill="#4a3a2a" />
      <rect x="26" y="0" width="1" height="1" fill="#a8c428" />

      <!-- Off hand — the rolled darkness, held low like a lamp of nothing -->
      <rect x="3" y="15" width="5" height="4" fill="#150d08" />
      <rect x="4" y="16" width="3" height="2" fill="#3a0d1a" />
      <rect x="4" y="16" width="3" height="1" fill="#481021" />
      <rect x="2" y="18" width="4" height="4" fill="#150d08" />
      <rect x="3" y="19" width="2" height="2" fill="#4a3c5e" />
      <rect x="3" y="19" width="1" height="1" fill="#5a4a72" />
      <!-- the conjured dark — a sphere that eats the torchlight -->
      <ellipse cx="4.5" cy="25.5" rx="4" ry="3.5" fill="#0e0c12" opacity="0.85" />
      <rect x="2" y="23" width="5" height="5" fill="#0a080e" />
      <rect x="3" y="24" width="3" height="3" fill="#06050a" />
      <rect x="2" y="23" width="2" height="1" fill="#2e2438" />
      <rect x="6" y="27" width="1" height="1" fill="#2e2438" opacity="0.7" />
      <rect x="1" y="25" width="1" height="1" fill="#5a3a8a" opacity="0.5" />
      <rect x="7" y="23" width="1" height="1" fill="#5a3a8a" opacity="0.4" />

      <!-- Skirts — long silk, slit for the gallery walk -->
      <rect x="7" y="28" width="15" height="12" fill="#150d08" />
      <rect x="8" y="29" width="13" height="10" fill="#3d0e1a" />
      <rect x="8" y="29" width="13" height="1" fill="#481021" />
      <rect x="8" y="29" width="3" height="10" fill="#451024" />
      <rect x="18" y="29" width="3" height="10" fill="#330b16" />
      <rect x="20" y="29" width="1" height="10" fill="#2a0912" />
      <!-- the slit, violet leg stepping through -->
      <rect x="13" y="31" width="3" height="8" fill="#150d08" />
      <rect x="14" y="32" width="1" height="7" fill="#4a3c5e" />
      <rect x="14" y="32" width="1" height="3" fill="#5a4a72" />
      <!-- silver web-thread at the hem -->
      <rect x="8" y="37" width="13" height="1" fill="#6a7490" opacity="0.8" />
      <rect x="9" y="37" width="3" height="1" fill="#8a94ac" />
      <!-- soft boots -->
      <rect x="9" y="39" width="5" height="3" fill="#150d08" />
      <rect x="10" y="40" width="3" height="1" fill="#2e2438" />
      <rect x="15" y="39" width="5" height="3" fill="#150d08" />
      <rect x="16" y="40" width="3" height="1" fill="#262030" />

      <!-- Web-glints in the gallery dark -->
      <rect x="24" y="22" width="1" height="1" fill="#c8d0e0" opacity="0.4" />
      <rect x="5" y="10" width="1" height="1" fill="#8a94ac" opacity="0.4" />
      <rect x="25" y="32" width="1" height="1" fill="#6a7490" opacity="0.4" />
    </svg>
