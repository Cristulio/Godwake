<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 49"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Shadow"
    >
      <!-- Cold void backlight so the silhouette reads on a dark room -->
      <ellipse cx="15" cy="22" rx="15" ry="23" fill="#3a2a5a" opacity="0.12" />
      <ellipse cx="15" cy="22" rx="8" ry="15" fill="#2a3a5a" opacity="0.08" />
      <ellipse cx="15" cy="47" rx="9" ry="1.6" fill="#000" opacity="0.4" />

      <!-- ── Wisping crown — smoke pulling off the head ── -->
      <rect x="12" y="0" width="5" height="2" fill="#14101c" opacity="0.4" />
      <rect x="10" y="1" width="2" height="2" fill="#14101c" opacity="0.3" />
      <rect x="17" y="0" width="2" height="1" fill="#241a30" opacity="0.35" />

      <!-- ── Head — layered void, violet rim upper-left ── -->
      <rect x="11" y="2" width="7" height="9" fill="#14101c" />
      <rect x="10" y="3" width="9" height="7" fill="#0a0610" />
      <rect x="10" y="3" width="1" height="6" fill="#2a1e3a" />
      <rect x="11" y="2" width="3" height="1" fill="#382a4e" />
      <rect x="11" y="2" width="1" height="1" fill="#4a3a66" />
      <rect x="17" y="3" width="2" height="7" fill="#060410" />
      <!-- jaw fade -->
      <rect x="11" y="10" width="7" height="1" fill="#0a0610" opacity="0.7" />
      <rect x="12" y="11" width="5" height="1" fill="#0a0610" opacity="0.4" />

      <!-- ── Eyes — cold starlight, no pupils ── -->
      <rect x="11" y="6" width="2" height="2" fill="#9aa2c0" />
      <rect x="15" y="6" width="2" height="2" fill="#7a82a0" />
      <rect x="11" y="6" width="1" height="1" fill="#e8eeff" />
      <rect x="15" y="6" width="1" height="1" fill="#c6d0f0" />
      <ellipse cx="14" cy="7" rx="4.5" ry="2.2" fill="#9aa2c0" opacity="0.14" />

      <!-- ── Hunched shoulders — wide smoke shelf ── -->
      <rect x="4" y="12" width="22" height="6" fill="#0a0610" />
      <rect x="3" y="13" width="24" height="4" fill="#0a0610" />
      <rect x="4" y="12" width="6" height="1" fill="#241a30" />
      <rect x="4" y="12" width="2" height="1" fill="#382a4e" />
      <rect x="3" y="13" width="1" height="3" fill="#1a1424" />
      <rect x="24" y="13" width="3" height="3" fill="#060410" />
      <!-- shoulder wisps -->
      <rect x="2" y="11" width="2" height="2" fill="#14101c" opacity="0.5" />
      <rect x="26" y="12" width="2" height="2" fill="#0a0610" opacity="0.6" />

      <!-- ── Torso — deep void, violet heart-glow ── -->
      <rect x="6" y="18" width="18" height="17" fill="#0a0610" />
      <rect x="5" y="19" width="1" height="14" fill="#1a1424" opacity="0.6" />
      <rect x="6" y="18" width="1" height="10" fill="#241a30" opacity="0.7" />
      <rect x="23" y="19" width="2" height="14" fill="#060410" />
      <!-- the stolen-life core -->
      <ellipse cx="14" cy="25" rx="5" ry="6" fill="#3a1a4a" opacity="0.5" />
      <rect x="12" y="22" width="5" height="7" fill="#3a1a4a" opacity="0.6" />
      <rect x="13" y="24" width="3" height="4" fill="#6a3a82" opacity="0.6" />
      <rect x="13" y="25" width="2" height="2" fill="#9a6ab0" opacity="0.7" />
      <rect x="13" y="25" width="1" height="1" fill="#c89ad8" opacity="0.8" />
      <!-- ribs of darkness over the glow -->
      <rect x="11" y="23" width="7" height="1" fill="#0a0610" opacity="0.8" />
      <rect x="11" y="26" width="7" height="1" fill="#0a0610" opacity="0.8" />
      <!-- edge dither -->
      <rect x="7" y="29" width="1" height="1" fill="#1a1424" opacity="0.6" />
      <rect x="21" y="24" width="1" height="1" fill="#060410" />

      <!-- ── Left arm — reaching long, fingers splaying to claws ── -->
      <rect x="1" y="19" width="6" height="3" fill="#0a0610" />
      <rect x="1" y="19" width="6" height="1" fill="#1a1424" opacity="0.7" />
      <rect x="0" y="21" width="4" height="6" fill="#0a0610" />
      <rect x="0" y="21" width="1" height="5" fill="#241a30" opacity="0.5" />
      <!-- talon streaks -->
      <rect x="0" y="27" width="1" height="4" fill="#0a0610" />
      <rect x="2" y="27" width="1" height="3" fill="#0a0610" />
      <rect x="0" y="27" width="1" height="1" fill="#382a4e" opacity="0.6" />
      <rect x="2" y="30" width="1" height="2" fill="#0a0610" opacity="0.6" />
      <rect x="0" y="31" width="1" height="2" fill="#0a0610" opacity="0.5" />

      <!-- ── Right arm — half-dissolved ── -->
      <rect x="23" y="20" width="6" height="3" fill="#0a0610" />
      <rect x="23" y="20" width="6" height="1" fill="#14101c" opacity="0.6" />
      <rect x="27" y="23" width="3" height="4" fill="#0a0610" opacity="0.8" />
      <rect x="28" y="27" width="2" height="2" fill="#0a0610" opacity="0.5" />
      <rect x="27" y="29" width="1" height="2" fill="#0a0610" opacity="0.35" />

      <!-- ── Dissolving lower body — tatters pulling apart ── -->
      <rect x="7" y="35" width="16" height="4" fill="#0a0610" />
      <rect x="6" y="36" width="18" height="3" fill="#0a0610" opacity="0.85" />
      <rect x="5" y="39" width="20" height="3" fill="#0a0610" opacity="0.6" />
      <rect x="4" y="42" width="22" height="3" fill="#0a0610" opacity="0.38" />
      <rect x="6" y="45" width="18" height="2" fill="#0a0610" opacity="0.22" />
      <!-- torn gaps in the smoke -->
      <rect x="11" y="38" width="2" height="3" fill="#0a0610" opacity="0.15" />
      <rect x="17" y="40" width="2" height="3" fill="#0a0610" opacity="0.12" />
      <rect x="8" y="41" width="2" height="2" fill="#0a0610" opacity="0.1" />
      <!-- violet seep in the tatters -->
      <rect x="9" y="36" width="2" height="2" fill="#241a30" opacity="0.5" />
      <rect x="19" y="37" width="1" height="2" fill="#241a30" opacity="0.4" />

      <!-- ── Drifting cold motes ── -->
      <rect x="7" y="14" width="1" height="2" fill="#9aa2c0" opacity="0.35" />
      <rect x="21" y="15" width="1" height="2" fill="#9aa2c0" opacity="0.3" />
      <rect x="10" y="31" width="1" height="1" fill="#6a3a82" opacity="0.45" />
      <rect x="18" y="33" width="1" height="1" fill="#6a3a82" opacity="0.4" />
      <rect x="24" y="34" width="1" height="1" fill="#9aa2c0" opacity="0.25" />
      <rect x="5" y="34" width="1" height="1" fill="#6a3a82" opacity="0.3" />
    </svg>
