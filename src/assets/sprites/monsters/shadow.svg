<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 22 36"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Shadow"
    >
      <!-- Cold void backlight so the silhouette reads on a dark room -->
      <ellipse cx="11" cy="16" rx="11" ry="17" fill="#3a2a5a" opacity="0.1" />
      <ellipse cx="11" cy="16" rx="6" ry="11" fill="#2a3a5a" opacity="0.07" />
      <ellipse cx="11" cy="34" rx="7" ry="1.3" fill="#000" opacity="0.4" />

      <!-- Wisping crown -->
      <rect x="9" y="0" width="4" height="2" fill="#14101c" opacity="0.45" />

      <!-- Head — layered dark ramp, faint violet rim upper-left -->
      <rect x="9" y="2" width="4" height="6" fill="#14101c" />
      <rect x="8" y="3" width="6" height="5" fill="#0a0610" />
      <rect x="8" y="3" width="1" height="4" fill="#241a30" opacity="0.7" />
      <rect x="9" y="2" width="2" height="1" fill="#2a1e3a" opacity="0.6" />
      <rect x="13" y="3" width="1" height="5" fill="#060410" />

      <!-- Cold eye sparks -->
      <rect x="9" y="5" width="1" height="1" fill="#9aa2c0" />
      <rect x="12" y="5" width="1" height="1" fill="#9aa2c0" />
      <rect x="9" y="5" width="1" height="1" fill="#d6e0ff" opacity="0.5" />

      <!-- Hunched shoulders -->
      <polygon points="3,11 11,8 19,11 19,15 3,15" fill="#0a0610" />
      <polygon points="3,11 11,8 11,11 3,13" fill="#1a1424" opacity="0.5" />
      <polygon points="11,8 19,11 19,13 11,11" fill="#060410" opacity="0.6" />

      <!-- Torso — deep with a violet inner glow -->
      <rect x="5" y="14" width="12" height="14" fill="#0a0610" />
      <rect x="4" y="15" width="1" height="12" fill="#1a1424" opacity="0.5" />
      <rect x="17" y="15" width="1" height="12" fill="#060410" opacity="0.6" />
      <rect x="5" y="14" width="3" height="1" fill="#241a30" opacity="0.5" />
      <!-- Soul-core glow -->
      <rect x="9" y="16" width="4" height="6" fill="#3a1a4a" opacity="0.55" />
      <rect x="10" y="18" width="2" height="3" fill="#6a3a82" opacity="0.55" />
      <rect x="10" y="19" width="1" height="1" fill="#9a6ab0" opacity="0.6" />
      <!-- Dither at the torso edge -->
      <rect x="6" y="23" width="1" height="1" fill="#1a1424" opacity="0.5" />
      <rect x="15" y="20" width="1" height="1" fill="#060410" />

      <!-- Left reaching arm + talons -->
      <rect x="0" y="17" width="5" height="2" fill="#0a0610" />
      <rect x="0" y="17" width="5" height="1" fill="#1a1424" opacity="0.55" />
      <rect x="-1" y="16" width="2" height="4" fill="#0a0610" />
      <polygon points="-1,16 -3,14 -1,17" fill="#0a0610" />
      <polygon points="-1,18 -3,20 -1,19" fill="#0a0610" />
      <polygon points="-1,20 -3,22 -1,21" fill="#0a0610" />

      <!-- Right arm + talon -->
      <rect x="17" y="18" width="4" height="2" fill="#0a0610" />
      <rect x="17" y="18" width="4" height="1" fill="#14101c" opacity="0.5" />
      <polygon points="21,18 23,20 21,20" fill="#0a0610" />

      <!-- Dissolving lower body — fading tatters -->
      <polygon points="5,28 17,28 20,34 2,34" fill="#0a0610" />
      <polygon points="4,30 18,30 21,36 1,36" fill="#0a0610" opacity="0.7" />
      <polygon points="3,32 19,32 22,36 0,36" fill="#0a0610" opacity="0.4" />
      <polygon points="6,28 11,28 9,33 7,33" fill="#1a1424" opacity="0.4" />

      <!-- Drifting cold motes -->
      <rect x="6" y="10" width="1" height="2" fill="#9aa2c0" opacity="0.35" />
      <rect x="15" y="11" width="1" height="2" fill="#9aa2c0" opacity="0.3" />
      <rect x="8" y="24" width="1" height="1" fill="#6a3a82" opacity="0.4" />
      <rect x="13" y="25" width="1" height="1" fill="#6a3a82" opacity="0.35" />
    </svg>
