<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 36 48"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Melissan"
    >
      <ellipse cx="18" cy="46" rx="13" ry="2" fill="#0c0610" opacity="0.55" />

      <!-- Bhaal-essence aura — layered bloom -->
      <ellipse cx="18" cy="26" rx="17" ry="22" fill="#1a0610" opacity="0.5" />
      <ellipse cx="18" cy="24" rx="13" ry="18" fill="#3a0a14" opacity="0.34" />
      <ellipse cx="18" cy="22" rx="7" ry="11" fill="#b53c4a" opacity="0.1" />

      <!-- Robe wings -->
      <polygon points="9,46 8,16 14,11 14,46" fill="#1c0a16" opacity="0.92" />
      <polygon points="27,46 28,16 22,11 22,46" fill="#1c0a16" opacity="0.92" />
      <polygon points="8,16 14,11 14,14 9,19" fill="#36103a" opacity="0.65" />
      <polygon points="28,16 22,11 22,14 27,19" fill="#280c2a" opacity="0.65" />

      <!-- Hooded head + face -->
      <rect x="12" y="3" width="12" height="14" fill="#0e0610" />
      <ellipse cx="18" cy="10" rx="5" ry="6" fill="#d8b8a0" />
      <ellipse cx="16" cy="9" rx="3" ry="4" fill="#e6cab4" opacity="0.7" />
      <ellipse cx="20" cy="11" rx="3" ry="4" fill="#c89888" opacity="0.5" />
      <!-- Burning eyes + spark -->
      <rect x="14" y="8" width="2" height="2" fill="#e23030" />
      <rect x="20" y="8" width="2" height="2" fill="#e23030" />
      <rect x="14" y="8" width="1" height="1" fill="#ff8a6a" />
      <rect x="20" y="8" width="1" height="1" fill="#ff8a6a" />
      <rect x="15" y="8" width="1" height="1" fill="#ffd0b0" />
      <!-- Nose shadow + cruel mouth -->
      <rect x="17" y="11" width="2" height="1" fill="#8c2010" />
      <rect x="16" y="13" width="4" height="1" fill="#7a1810" />
      <rect x="14" y="13" width="1" height="1" fill="#b08070" opacity="0.6" />
      <!-- Veil framing -->
      <rect x="12" y="4" width="12" height="5" fill="#1c0a16" />
      <rect x="11" y="9" width="2" height="9" fill="#1c0a16" />
      <rect x="23" y="9" width="2" height="9" fill="#1c0a16" />

      <!-- Gold crown — ramped, jewelled -->
      <polygon points="11,4 18,-1 25,4 25,7 18,3 11,7" fill="#c0a040" />
      <polygon points="11,4 18,-1 25,4" fill="#f4d042" opacity="0.6" />
      <polygon points="11,4 18,-1 18,2 11,5" fill="#fff4c0" opacity="0.4" />
      <rect x="17" y="-2" width="2" height="3" fill="#f4d042" />
      <rect x="17" y="-2" width="1" height="2" fill="#fff4c0" />
      <polygon points="16,-2 18,-5 20,-2" fill="#e23030" />
      <rect x="17" y="-4" width="1" height="1" fill="#ff8a6a" />
      <rect x="12" y="1" width="1" height="3" fill="#f4d042" />
      <rect x="23" y="1" width="1" height="3" fill="#f4d042" />
      <rect x="14" y="0" width="1" height="3" fill="#f4d042" />
      <rect x="21" y="0" width="1" height="3" fill="#f4d042" />
      <rect x="14" y="0" width="1" height="1" fill="#fff4c0" />

      <!-- Robe torso — dark magenta ramp + divine seams -->
      <rect x="11" y="16" width="14" height="22" fill="#2a0a1e" />
      <rect x="11" y="16" width="14" height="2" fill="#46123a" />
      <rect x="11" y="16" width="14" height="1" fill="#5a1648" />
      <rect x="11" y="16" width="2" height="20" fill="#36103a" />
      <polygon points="11,16 18,38 18,16" fill="#1e0816" opacity="0.4" />
      <!-- Glowing core stripe -->
      <rect x="16" y="18" width="4" height="20" fill="#7a1810" />
      <rect x="17" y="19" width="2" height="18" fill="#b53c4a" opacity="0.8" />
      <rect x="17" y="20" width="1" height="3" fill="#e23030" opacity="0.7" />
      <!-- Gold bands -->
      <rect x="11" y="22" width="14" height="1" fill="#c0a040" opacity="0.7" />
      <rect x="11" y="22" width="7" height="1" fill="#f4d042" opacity="0.5" />
      <rect x="12" y="27" width="12" height="1" fill="#c0a040" opacity="0.6" />
      <rect x="13" y="32" width="10" height="1" fill="#9a7e2e" opacity="0.55" />
      <rect x="12" y="18" width="1" height="18" fill="#5a1648" opacity="0.6" />
      <rect x="23" y="18" width="1" height="18" fill="#5a1648" opacity="0.55" />
      <!-- Robe dither -->
      <rect x="14" y="25" width="1" height="1" fill="#36103a" />
      <rect x="21" y="29" width="1" height="1" fill="#1e0816" />

      <!-- Left arm + hand -->
      <rect x="4" y="18" width="7" height="3" fill="#2a0a1e" />
      <rect x="4" y="18" width="7" height="1" fill="#46123a" />
      <rect x="3" y="20" width="4" height="11" fill="#36103a" />
      <rect x="3" y="20" width="1" height="11" fill="#1e0816" />
      <rect x="3" y="30" width="5" height="3" fill="#d8b8a0" />
      <rect x="3" y="30" width="5" height="1" fill="#e6cab4" />

      <!-- Right arm + staff -->
      <rect x="25" y="18" width="7" height="3" fill="#2a0a1e" />
      <rect x="25" y="18" width="7" height="1" fill="#46123a" />
      <rect x="29" y="20" width="4" height="11" fill="#36103a" />
      <rect x="30" y="30" width="4" height="3" fill="#d8b8a0" />
      <rect x="31" y="2" width="2" height="30" fill="#1c0a16" />
      <rect x="31" y="2" width="1" height="30" fill="#3a2030" />
      <!-- Staff orb — divine blood, layered bloom -->
      <ellipse cx="32" cy="3" rx="5" ry="6" fill="#5a1208" opacity="0.75" />
      <circle cx="32" cy="3" r="3" fill="#b53c4a" />
      <circle cx="32" cy="3" r="1.6" fill="#ff8a6a" />
      <rect x="32" y="3" width="1" height="1" fill="#fff4d0" />
      <polygon points="29,3 32,-3 35,3" fill="#e23030" opacity="0.45" />
      <rect x="32" y="-2" width="1" height="3" fill="#ff8a6a" />

      <!-- Robe hem legs -->
      <rect x="12" y="38" width="6" height="8" fill="#1c0a16" />
      <rect x="19" y="38" width="6" height="8" fill="#1c0a16" />
      <rect x="12" y="38" width="1" height="8" fill="#36103a" />
      <rect x="19" y="38" width="1" height="8" fill="#280c2a" />
      <rect x="11" y="45" width="8" height="2" fill="#0c0610" />
      <rect x="19" y="45" width="8" height="2" fill="#0c0610" />
      <rect x="14" y="40" width="1" height="5" fill="#46123a" opacity="0.5" />
      <rect x="22" y="40" width="1" height="5" fill="#46123a" opacity="0.5" />

      <!-- Drifting essence motes -->
      <rect x="6" y="34" width="1" height="1" fill="#f4d042" opacity="0.55" />
      <rect x="29" y="27" width="1" height="1" fill="#e23030" opacity="0.55" />
      <rect x="18" y="46" width="1" height="1" fill="#b53c4a" opacity="0.5" />
      <rect x="9" y="22" width="1" height="1" fill="#ff8a6a" opacity="0.4" />
    </svg>
