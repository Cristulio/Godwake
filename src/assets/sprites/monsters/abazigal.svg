<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 48 46"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Abazigal"
    >
      <!-- Storm backlight + ground shadow -->
      <ellipse cx="24" cy="24" rx="23" ry="22" fill="#3a64aa" opacity="0.08" />
      <ellipse cx="24" cy="44" rx="15" ry="2" fill="#000" opacity="0.45" />

      <!-- Left wing membrane — ribbed ramp -->
      <polygon points="2,4 16,16 14,28 4,22" fill="#14284e" />
      <polygon points="4,7 14,17 13,24" fill="#1e3a6e" />
      <polygon points="5,9 12,16 11,21" fill="#2a4e8e" />
      <polygon points="6,11 11,16 10,19" fill="#3a64aa" opacity="0.6" />
      <rect x="6" y="11" width="1" height="8" fill="#14284e" />
      <rect x="9" y="13" width="1" height="8" fill="#14284e" />
      <polygon points="2,4 5,6 2,7" fill="#3a64aa" />

      <!-- Right wing membrane -->
      <polygon points="44,4 32,16 34,28 42,22" fill="#102244" />
      <polygon points="42,7 34,17 35,24" fill="#1e3a6e" />
      <polygon points="40,10 35,16 35,22" fill="#244a86" opacity="0.6" />
      <rect x="40" y="11" width="1" height="8" fill="#102244" />
      <rect x="37" y="13" width="1" height="8" fill="#102244" />

      <!-- Torso — scale ramp, lit top-left -->
      <rect x="14" y="16" width="20" height="16" fill="#1e3a6e" />
      <rect x="14" y="16" width="20" height="2" fill="#2a4e8e" />
      <rect x="14" y="16" width="8" height="1" fill="#3a64aa" />
      <rect x="14" y="16" width="2" height="15" fill="#244a86" />
      <rect x="14" y="16" width="1" height="14" fill="#3a64aa" />
      <rect x="32" y="17" width="2" height="15" fill="#14284e" />
      <rect x="33" y="17" width="1" height="15" fill="#0e1f3c" />
      <rect x="14" y="31" width="20" height="1" fill="#14284e" />
      <!-- Belly plates -->
      <rect x="20" y="20" width="8" height="11" fill="#16305c" />
      <rect x="20" y="22" width="8" height="1" fill="#244a86" opacity="0.6" />
      <rect x="20" y="26" width="8" height="1" fill="#244a86" opacity="0.5" />
      <rect x="20" y="29" width="8" height="1" fill="#244a86" opacity="0.4" />
      <!-- Scale speckle -->
      <rect x="17" y="19" width="1" height="1" fill="#5a84cc" />
      <rect x="29" y="20" width="1" height="1" fill="#4a74ba" />

      <!-- Dorsal spine ridge -->
      <polygon points="17,16 20,11 23,16" fill="#16305c" />
      <polygon points="17,16 20,11 20,16" fill="#244a86" />
      <polygon points="22,16 25,10 28,16" fill="#16305c" />
      <polygon points="22,16 25,10 25,16" fill="#244a86" />
      <polygon points="27,16 30,11 33,16" fill="#14284e" />

      <!-- Head — ramp, key upper-left -->
      <rect x="18" y="4" width="12" height="12" fill="#1e3a6e" />
      <rect x="18" y="4" width="12" height="2" fill="#3a64aa" />
      <rect x="18" y="4" width="4" height="1" fill="#5a84cc" />
      <rect x="18" y="4" width="2" height="11" fill="#244a86" />
      <rect x="28" y="5" width="2" height="11" fill="#14284e" />
      <!-- Horns -->
      <polygon points="18,4 14,-1 17,5" fill="#16305c" />
      <polygon points="18,4 15,1 17,5" fill="#244a86" opacity="0.7" />
      <polygon points="30,4 34,-1 31,5" fill="#102244" />
      <!-- Jaw -->
      <polygon points="18,16 24,21 30,16" fill="#16305c" />
      <!-- Lightning eyes + spark -->
      <rect x="20" y="8" width="3" height="3" fill="#f4d042" />
      <rect x="21" y="8" width="1" height="3" fill="#fff0b0" />
      <rect x="20" y="8" width="1" height="1" fill="#e89a20" />
      <rect x="25" y="8" width="3" height="3" fill="#f4d042" />
      <rect x="26" y="8" width="1" height="3" fill="#fff0b0" />
      <rect x="25" y="8" width="1" height="1" fill="#e89a20" />
      <!-- Fangs -->
      <line x1="20" y1="14" x2="28" y2="14" stroke="#e8e0c4" stroke-width="0.8" />
      <rect x="22" y="14" width="1" height="2" fill="#e8e0c4" />
      <rect x="25" y="14" width="1" height="2" fill="#d0c8a8" />

      <!-- Foreleg left + claws -->
      <rect x="8" y="18" width="6" height="4" fill="#1e3a6e" />
      <rect x="8" y="18" width="6" height="1" fill="#2a4e8e" />
      <rect x="6" y="20" width="4" height="11" fill="#16305c" />
      <rect x="6" y="20" width="1" height="11" fill="#244a86" />
      <polygon points="5,31 11,31 8,35" fill="#0e1f3c" />
      <rect x="5" y="31" width="1" height="2" fill="#d8e0f0" />
      <rect x="8" y="31" width="1" height="3" fill="#b8c4e0" />
      <!-- Foreleg right -->
      <rect x="34" y="18" width="6" height="4" fill="#16305c" />
      <rect x="34" y="18" width="6" height="1" fill="#1e3a6e" />
      <rect x="38" y="20" width="4" height="11" fill="#102244" />
      <rect x="38" y="20" width="1" height="11" fill="#16305c" />
      <polygon points="37,31 43,31 40,35" fill="#0a1830" />
      <rect x="37" y="31" width="1" height="2" fill="#b8c4e0" />
      <rect x="40" y="31" width="1" height="3" fill="#9aa8cc" />

      <!-- Legs + talons -->
      <rect x="15" y="32" width="6" height="10" fill="#1e3a6e" />
      <rect x="15" y="32" width="1" height="10" fill="#244a86" />
      <rect x="20" y="32" width="1" height="10" fill="#14284e" />
      <rect x="27" y="32" width="6" height="10" fill="#16305c" />
      <rect x="27" y="32" width="1" height="10" fill="#1e3a6e" />
      <rect x="32" y="32" width="1" height="10" fill="#102244" />
      <polygon points="13,42 22,42 17,46" fill="#0e1f3c" />
      <polygon points="26,42 35,42 31,46" fill="#0a1830" />
      <rect x="14" y="42" width="1" height="3" fill="#b8c4e0" />
      <rect x="27" y="42" width="1" height="3" fill="#9aa8cc" />

      <!-- Tail to the lower right -->
      <polygon points="34,30 47,34 35,36" fill="#16305c" />
      <polygon points="34,30 45,33 36,35" fill="#244a86" opacity="0.5" />
      <polygon points="46,33 47,34 44,35" fill="#0e1f3c" />

      <!-- Lightning crackle -->
      <rect x="23" y="18" width="2" height="3" fill="#7ec8ff" opacity="0.75" />
      <rect x="20" y="24" width="2" height="2" fill="#7ec8ff" opacity="0.55" />
      <rect x="27" y="26" width="2" height="2" fill="#7ec8ff" opacity="0.55" />
      <rect x="24" y="12" width="1" height="1" fill="#bfe4ff" opacity="0.85" />
      <rect x="10" y="14" width="1" height="1" fill="#7ec8ff" opacity="0.5" />
    </svg>
