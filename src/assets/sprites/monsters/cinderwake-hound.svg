<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 38 30"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Cinderwake Hound"
    >
      <!-- Ember backlight + stretched running shadow -->
      <ellipse cx="19" cy="17" rx="17" ry="10" fill="#d4641a" opacity="0.07" />
      <ellipse cx="20" cy="28.4" rx="14" ry="1.5" fill="#000" opacity="0.38" />

      <!-- Spark wake trailing the sprint -->
      <rect x="1" y="9" width="1" height="1" fill="#d4641a" opacity="0.45" />
      <rect x="3" y="13" width="1" height="1" fill="#f4942a" opacity="0.5" />
      <rect x="2" y="17" width="1" height="1" fill="#a83a14" opacity="0.5" />
      <rect x="5" y="7" width="1" height="1" fill="#ffd070" opacity="0.4" />
      <rect x="3" y="20" width="2" height="1" fill="#58525c" opacity="0.4" />
      <rect x="1" y="11" width="2" height="1" fill="#58525c" opacity="0.3" />

      <!-- Tail — a guttering brand streaming flat behind -->
      <rect x="2" y="10" width="7" height="2" fill="#150d08" />
      <rect x="3" y="11" width="5" height="1" fill="#241c22" />
      <rect x="3" y="10" width="3" height="1" fill="#6a1c0a" />
      <rect x="3" y="10" width="2" height="1" fill="#a83a14" />
      <rect x="3" y="10" width="1" height="1" fill="#f4942a" />

      <!-- Hindquarters — bunched for the drive -->
      <rect x="7" y="9" width="9" height="9" fill="#150d08" />
      <rect x="8" y="10" width="7" height="7" fill="#2e262c" />
      <rect x="8" y="10" width="7" height="1" fill="#3e3844" />
      <rect x="8" y="10" width="3" height="1" fill="#4e4854" />
      <rect x="8" y="10" width="1" height="5" fill="#3a3640" />
      <rect x="13" y="11" width="2" height="6" fill="#241c22" />
      <!-- haunch ember crack -->
      <rect x="9" y="12" width="3" height="1" fill="#a83a14" />
      <rect x="10" y="12" width="1" height="1" fill="#f4942a" />
      <rect x="9" y="14" width="1" height="2" fill="#6a1c0a" />

      <!-- Rear leg kicked back full stretch, off the ground -->
      <rect x="3" y="15" width="6" height="3" fill="#150d08" />
      <rect x="4" y="16" width="4" height="1" fill="#241c22" />
      <rect x="1" y="17" width="5" height="3" fill="#150d08" />
      <rect x="2" y="18" width="3" height="1" fill="#2e262c" />
      <rect x="2" y="18" width="1" height="1" fill="#a83a14" opacity="0.7" />
      <!-- Rear leg driving under the body, paw planted -->
      <rect x="12" y="17" width="4" height="7" fill="#150d08" />
      <rect x="13" y="18" width="2" height="5" fill="#2e262c" />
      <rect x="13" y="18" width="1" height="5" fill="#3a3640" />
      <rect x="13" y="21" width="1" height="1" fill="#d4641a" opacity="0.6" />
      <rect x="12" y="24" width="5" height="2" fill="#150d08" />
      <rect x="13" y="24" width="3" height="1" fill="#241c22" />

      <!-- Barrel — slung low and long, belly tucked off the ground -->
      <rect x="14" y="8" width="13" height="8" fill="#150d08" />
      <rect x="15" y="9" width="11" height="6" fill="#332b31" />
      <rect x="15" y="9" width="11" height="1" fill="#423a40" />
      <rect x="15" y="9" width="4" height="1" fill="#544a52" />
      <rect x="24" y="10" width="2" height="5" fill="#241c22" />
      <!-- belly tuck shadow -->
      <rect x="16" y="14" width="7" height="1" fill="#241c22" />
      <!-- burning spine ridge — the identifying feature -->
      <rect x="13" y="7" width="13" height="1" fill="#150d08" />
      <rect x="14" y="7" width="11" height="1" fill="#6a1c0a" />
      <rect x="15" y="6" width="3" height="1" fill="#d4641a" />
      <rect x="16" y="6" width="1" height="1" fill="#ffd070" />
      <rect x="20" y="6" width="2" height="1" fill="#f4942a" />
      <rect x="21" y="5" width="1" height="1" fill="#f4942a" opacity="0.6" />
      <rect x="17" y="5" width="1" height="1" fill="#d4641a" opacity="0.5" />
      <rect x="14" y="6" width="9" height="1" fill="#150d08" />
      <!-- rib-glow where the firebox shows through -->
      <rect x="17" y="10" width="1" height="4" fill="#6a1c0a" />
      <rect x="19" y="10" width="1" height="4" fill="#a83a14" />
      <rect x="19" y="11" width="1" height="2" fill="#f4942a" />
      <rect x="21" y="10" width="1" height="4" fill="#6a1c0a" />
      <rect x="21" y="11" width="1" height="2" fill="#d4641a" />
      <rect x="18" y="11" width="1" height="2" fill="#2a1410" />
      <rect x="20" y="11" width="1" height="2" fill="#2a1410" />

      <!-- Foreleg reaching mid-air for the next stride -->
      <rect x="26" y="13" width="6" height="3" fill="#150d08" />
      <rect x="27" y="14" width="4" height="1" fill="#3a3640" />
      <rect x="30" y="14" width="4" height="3" fill="#150d08" />
      <rect x="31" y="15" width="2" height="1" fill="#2e262c" />
      <rect x="32" y="15" width="1" height="1" fill="#a83a14" opacity="0.8" />
      <!-- Foreleg planted, taking the whole drive -->
      <rect x="23" y="15" width="4" height="9" fill="#150d08" />
      <rect x="24" y="16" width="2" height="7" fill="#332b31" />
      <rect x="24" y="16" width="1" height="7" fill="#423a40" />
      <rect x="24" y="19" width="1" height="2" fill="#a83a14" opacity="0.7" />
      <rect x="23" y="24" width="5" height="2" fill="#150d08" />
      <rect x="24" y="24" width="3" height="1" fill="#241c22" />
      <rect x="26" y="24" width="1" height="1" fill="#d4641a" opacity="0.5" />

      <!-- Neck driving forward and DOWN into the head -->
      <rect x="25" y="6" width="6" height="6" fill="#150d08" />
      <rect x="26" y="7" width="4" height="4" fill="#332b31" />
      <rect x="26" y="7" width="4" height="1" fill="#423a40" />
      <rect x="26" y="7" width="1" height="3" fill="#423a40" />

      <!-- Head — low, level with the chest, jaw open on a furnace -->
      <rect x="29" y="6" width="7" height="6" fill="#150d08" />
      <rect x="30" y="7" width="5" height="4" fill="#332b31" />
      <rect x="30" y="7" width="5" height="1" fill="#4a4250" />
      <rect x="30" y="7" width="2" height="1" fill="#544a52" />
      <!-- cropped ear, singed -->
      <rect x="29" y="4" width="3" height="3" fill="#150d08" />
      <rect x="30" y="5" width="1" height="2" fill="#241c22" />
      <rect x="30" y="5" width="1" height="1" fill="#a83a14" opacity="0.7" />
      <!-- eye — a live coal -->
      <rect x="31" y="8" width="2" height="2" fill="#f4942a" />
      <rect x="31" y="8" width="1" height="1" fill="#ffd070" />
      <!-- muzzle thrust forward -->
      <rect x="34" y="8" width="4" height="3" fill="#150d08" />
      <rect x="35" y="9" width="2" height="1" fill="#2e262c" />
      <!-- open jaw with the furnace behind the teeth -->
      <rect x="31" y="11" width="7" height="3" fill="#150d08" />
      <rect x="32" y="11" width="5" height="2" fill="#6a1c0a" />
      <rect x="32" y="11" width="4" height="1" fill="#d4641a" />
      <rect x="33" y="11" width="1" height="1" fill="#ffd070" />
      <!-- teeth -->
      <rect x="33" y="10" width="1" height="1" fill="#b8b2ba" />
      <rect x="35" y="10" width="1" height="1" fill="#b8b2ba" />
      <rect x="34" y="12" width="1" height="1" fill="#9a949e" />
      <rect x="36" y="12" width="1" height="1" fill="#9a949e" />
      <!-- lower jaw line -->
      <rect x="32" y="13" width="5" height="1" fill="#241c22" />

      <!-- Heat shimmer pulled off the sprint -->
      <rect x="24" y="3" width="1" height="1" fill="#d4641a" opacity="0.4" />
      <rect x="29" y="2" width="1" height="1" fill="#f4942a" opacity="0.35" />
      <rect x="34" y="4" width="1" height="1" fill="#d4641a" opacity="0.3" />
    </svg>
