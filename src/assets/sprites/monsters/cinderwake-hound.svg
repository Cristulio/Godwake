<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 30 24"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Cinderwake Hound"
    >
      <!-- Ember backlight + ground shadow -->
      <ellipse cx="15" cy="13" rx="15" ry="11" fill="#d4641a" opacity="0.09" />
      <ellipse cx="15" cy="22" rx="11" ry="1.4" fill="#000" opacity="0.4" />

      <!-- Tail sweeping left -->
      <polygon points="2,11 6,9 6,13" fill="#2a2228" />
      <polygon points="3,11 6,10 6,12" fill="#3a2e2a" opacity="0.8" />
      <rect x="1" y="10" width="2" height="2" fill="#d4641a" opacity="0.6" />
      <rect x="1" y="10" width="1" height="1" fill="#ffd070" opacity="0.55" />

      <!-- Body — charcoal ramp, key light along the spine -->
      <rect x="6" y="8" width="14" height="7" fill="#3a2e2a" />
      <rect x="6" y="8" width="14" height="1" fill="#5a4640" />
      <rect x="6" y="8" width="14" height="1" fill="#4a3a34" />
      <rect x="6" y="13" width="14" height="2" fill="#2a2228" />
      <rect x="6" y="8" width="2" height="2" fill="#4a3a34" />
      <rect x="18" y="9" width="2" height="6" fill="#1a1410" />
      <!-- Ember cracks across the hide -->
      <rect x="8" y="9" width="2" height="2" fill="#d4641a" opacity="0.7" />
      <rect x="12" y="10" width="3" height="2" fill="#a83a14" opacity="0.75" />
      <rect x="16" y="9" width="2" height="2" fill="#e87820" opacity="0.65" />
      <rect x="8" y="9" width="1" height="1" fill="#ffd070" opacity="0.7" />
      <rect x="13" y="11" width="1" height="1" fill="#f4942a" opacity="0.6" />
      <rect x="10" y="12" width="2" height="1" fill="#6a3a1a" opacity="0.6" />

      <!-- Head to the right — charcoal ramp -->
      <rect x="18" y="6" width="7" height="6" fill="#3a2e2a" />
      <rect x="18" y="6" width="7" height="1" fill="#5a4640" />
      <rect x="18" y="6" width="2" height="6" fill="#4a3a34" />
      <rect x="24" y="7" width="1" height="5" fill="#1a1410" />
      <!-- Snout + maw -->
      <rect x="24" y="7" width="3" height="3" fill="#1a1410" />
      <rect x="25" y="10" width="3" height="1" fill="#6a3a1a" />
      <rect x="25" y="9" width="3" height="1" fill="#a83a14" opacity="0.7" />
      <!-- Ears -->
      <polygon points="19,6 20,2 22,6" fill="#2a2228" />
      <polygon points="23,6 25,3 26,6" fill="#2a2228" />
      <polygon points="19,6 20,3 21,6" fill="#3a2e2a" opacity="0.7" />
      <!-- Burning eye — layered + specular -->
      <rect x="22" y="7" width="2" height="2" fill="#f4942a" />
      <rect x="22" y="7" width="1" height="1" fill="#ffd070" />
      <rect x="23" y="8" width="1" height="1" fill="#a83a14" />

      <!-- Legs — charred, ember-cracked at the paws -->
      <rect x="6" y="14" width="2" height="8" fill="#2a2228" />
      <rect x="10" y="14" width="2" height="8" fill="#1a1410" />
      <rect x="15" y="14" width="2" height="8" fill="#2a2228" />
      <rect x="19" y="14" width="2" height="8" fill="#1a1410" />
      <rect x="6" y="14" width="1" height="8" fill="#3a2e2a" />
      <rect x="15" y="14" width="1" height="8" fill="#3a2e2a" />
      <rect x="6" y="21" width="3" height="2" fill="#3a2e2a" />
      <rect x="15" y="21" width="3" height="2" fill="#3a2e2a" />
      <rect x="6" y="21" width="3" height="1" fill="#a83a14" opacity="0.5" />
      <rect x="15" y="21" width="3" height="1" fill="#a83a14" opacity="0.5" />

      <!-- Heat shimmer + sparks rising -->
      <rect x="9" y="6" width="1" height="2" fill="#f4942a" opacity="0.55" />
      <rect x="13" y="5" width="1" height="2" fill="#e87820" opacity="0.5" />
      <rect x="17" y="6" width="1" height="2" fill="#f4942a" opacity="0.5" />
      <rect x="3" y="8" width="1" height="1" fill="#ffd070" opacity="0.5" />
    </svg>
