<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 36"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Axle-Warden"
    >
      <!-- Brass backlight + ground shadow -->
      <ellipse cx="16" cy="20" rx="15" ry="17" fill="#8a6a2a" opacity="0.08" />
      <ellipse cx="16" cy="34" rx="10" ry="1.5" fill="#000" opacity="0.4" />

      <!-- Gear-halo — twin brass rings + spokes, lit upper-left arc -->
      <circle cx="16" cy="20" r="13" fill="none" stroke="#5a4624" stroke-width="1.5" opacity="0.55" />
      <path d="M5 14 A13 13 0 0 1 24 9" fill="none" stroke="#b08840" stroke-width="0.6" opacity="0.6" />
      <circle cx="16" cy="20" r="9" fill="none" stroke="#6a5424" stroke-width="1" opacity="0.55" />
      <line x1="16" y1="7" x2="16" y2="33" stroke="#5a4624" stroke-width="0.6" opacity="0.5" />
      <line x1="3" y1="20" x2="29" y2="20" stroke="#5a4624" stroke-width="0.6" opacity="0.5" />
      <line x1="7" y1="11" x2="25" y2="29" stroke="#5a4624" stroke-width="0.6" opacity="0.5" />
      <line x1="25" y1="11" x2="7" y2="29" stroke="#5a4624" stroke-width="0.6" opacity="0.5" />

      <!-- Head — brass ramp, key light upper-left -->
      <rect x="10" y="3" width="12" height="9" fill="#7a5e24" />
      <rect x="10" y="3" width="12" height="1" fill="#b08840" />
      <rect x="10" y="3" width="3" height="9" fill="#8a6a2a" />
      <rect x="10" y="3" width="1" height="6" fill="#b08840" />
      <rect x="20" y="3" width="2" height="9" fill="#5a4418" />
      <rect x="21" y="4" width="1" height="7" fill="#3a2c10" />
      <!-- Single glass eye-lens — bronze bezel + glowing core + specular -->
      <circle cx="16" cy="8" r="3" fill="#5a4418" />
      <circle cx="16" cy="8" r="2" fill="#3a2c10" />
      <rect x="15" y="7" width="2" height="2" fill="#f4942a" />
      <rect x="16" y="8" width="1" height="1" fill="#ffd870" />
      <rect x="15" y="5" width="2" height="1" fill="#d4a850" opacity="0.7" />

      <!-- Boiler torso — brass ramp + rivet plates -->
      <rect x="8" y="12" width="16" height="14" fill="#7a5e24" />
      <rect x="8" y="12" width="16" height="1" fill="#9a7a30" />
      <rect x="14" y="12" width="4" height="14" fill="#8a6a2a" />
      <rect x="15" y="12" width="2" height="14" fill="#a07c34" />
      <rect x="8" y="12" width="2" height="14" fill="#6a5020" />
      <rect x="8" y="12" width="1" height="14" fill="#5a4418" />
      <rect x="22" y="13" width="2" height="13" fill="#3a2c10" />
      <!-- Plate seams + rivets + specular -->
      <rect x="8" y="18" width="16" height="1" fill="#5a4418" />
      <rect x="10" y="14" width="1" height="1" fill="#d4a850" />
      <rect x="20" y="14" width="1" height="1" fill="#9a7a30" />
      <rect x="11" y="21" width="1" height="1" fill="#9a7a30" />
      <rect x="19" y="21" width="1" height="1" fill="#7a5e24" />
      <rect x="15" y="15" width="1" height="1" fill="#f4d870" />

      <!-- Left arm + piston fist -->
      <rect x="4" y="14" width="4" height="3" fill="#7a5e24" />
      <rect x="4" y="14" width="4" height="1" fill="#9a7a30" />
      <rect x="2" y="13" width="3" height="2" fill="#8a6a2a" />
      <rect x="2" y="13" width="3" height="1" fill="#b08840" />

      <!-- Right arm + raised wrench-key -->
      <rect x="24" y="14" width="4" height="9" fill="#7a5e24" />
      <rect x="24" y="14" width="1" height="9" fill="#9a7a30" />
      <rect x="27" y="14" width="1" height="9" fill="#5a4418" />
      <rect x="26" y="6" width="3" height="10" fill="#5a4418" />
      <rect x="26" y="6" width="1" height="10" fill="#7a5e24" />
      <rect x="25" y="3" width="5" height="4" fill="#9a7a30" />
      <rect x="25" y="3" width="5" height="1" fill="#d4a850" />
      <rect x="25" y="3" width="1" height="4" fill="#b08840" />
      <rect x="27" y="4" width="1" height="1" fill="#f4d870" />

      <!-- Legs -->
      <rect x="8" y="26" width="6" height="9" fill="#6a5020" />
      <rect x="18" y="26" width="6" height="9" fill="#6a5020" />
      <rect x="8" y="26" width="1" height="9" fill="#8a6a2a" />
      <rect x="18" y="26" width="1" height="9" fill="#8a6a2a" />
      <rect x="13" y="26" width="1" height="9" fill="#3a2c10" />
      <rect x="23" y="26" width="1" height="9" fill="#3a2c10" />
      <rect x="8" y="33" width="6" height="2" fill="#3a2c10" />
      <rect x="18" y="33" width="6" height="2" fill="#3a2c10" />
    </svg>
