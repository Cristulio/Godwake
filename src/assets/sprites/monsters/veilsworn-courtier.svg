<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 32 42"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Veilsworn Courtier"
    >
      <!-- Cold hall backlight + ground shadow -->
      <ellipse cx="15" cy="23" rx="14" ry="17" fill="#58525c" opacity="0.08" />
      <ellipse cx="15" cy="40.4" rx="10" ry="1.6" fill="#000" opacity="0.4" />

      <!-- Plumed half-mask turned full on you -->
      <rect x="9" y="1" width="12" height="12" fill="#150d08" />
      <!-- the plume — wine feathers off the mask's crown -->
      <rect x="7" y="0" width="4" height="3" fill="#150d08" />
      <rect x="8" y="1" width="2" height="1" fill="#7e1f2c" />
      <rect x="8" y="1" width="1" height="1" fill="#a93340" />
      <rect x="5" y="0" width="3" height="2" fill="#150d08" />
      <rect x="6" y="0" width="1" height="1" fill="#c84a64" />
      <!-- porcelain face — the one you failed -->
      <rect x="10" y="2" width="10" height="10" fill="#e8dcc4" />
      <rect x="10" y="2" width="10" height="1" fill="#f8f2e2" />
      <rect x="10" y="2" width="4" height="2" fill="#f8f2e2" />
      <rect x="10" y="2" width="1" height="8" fill="#f0e6d2" />
      <rect x="18" y="3" width="2" height="9" fill="#cdbfa2" />
      <rect x="19" y="4" width="1" height="8" fill="#b4a486" />
      <rect x="11" y="12" width="8" height="1" fill="#cdbfa2" />
      <!-- gilt rim of the half-mask across the brow -->
      <rect x="10" y="4" width="10" height="1" fill="#c89a48" />
      <rect x="10" y="4" width="4" height="1" fill="#ecc46a" />
      <rect x="14" y="3" width="1" height="1" fill="#ecc46a" />
      <!-- the accusing eyes — dark, fixed, lit by a point each -->
      <rect x="11" y="6" width="3" height="3" fill="#0e0c12" />
      <rect x="16" y="6" width="3" height="3" fill="#0e0c12" />
      <rect x="12" y="7" width="1" height="1" fill="#e8f4f8" />
      <rect x="17" y="7" width="1" height="1" fill="#e8f4f8" />
      <!-- the mouth painted mid-condemnation -->
      <rect x="13" y="10" width="4" height="1" fill="#531320" />
      <rect x="14" y="11" width="2" height="1" fill="#7e1f2c" />

      <!-- High court collar, standing fanned behind the head -->
      <rect x="6" y="11" width="4" height="6" fill="#150d08" />
      <rect x="7" y="12" width="2" height="4" fill="#531320" />
      <rect x="7" y="12" width="1" height="4" fill="#7e1f2c" />
      <rect x="20" y="11" width="4" height="6" fill="#150d08" />
      <rect x="21" y="12" width="2" height="4" fill="#3d0e1a" />
      <rect x="21" y="12" width="1" height="4" fill="#531320" />

      <!-- Doublet — wine court-dress kept immaculate by habit -->
      <rect x="7" y="13" width="16" height="16" fill="#150d08" />
      <rect x="8" y="14" width="14" height="14" fill="#67192a" />
      <rect x="8" y="14" width="14" height="1" fill="#7e1f2c" />
      <rect x="8" y="14" width="6" height="1" fill="#a93340" />
      <rect x="8" y="14" width="2" height="14" fill="#7e1f2c" />
      <rect x="8" y="14" width="1" height="9" fill="#a93340" />
      <rect x="19" y="14" width="3" height="14" fill="#531320" />
      <rect x="21" y="14" width="1" height="14" fill="#3d0e1a" />
      <!-- shade showing at the collar where a throat should be -->
      <rect x="12" y="14" width="6" height="2" fill="#221e26" />
      <rect x="13" y="14" width="4" height="1" fill="#2e2a32" />
      <!-- gilt frogging down the breast -->
      <rect x="12" y="17" width="6" height="1" fill="#9a7232" />
      <rect x="12" y="17" width="2" height="1" fill="#ecc46a" />
      <rect x="12" y="20" width="6" height="1" fill="#9a7232" />
      <rect x="12" y="20" width="2" height="1" fill="#c89a48" />
      <rect x="12" y="23" width="6" height="1" fill="#9a7232" />
      <rect x="12" y="23" width="2" height="1" fill="#ecc46a" />
      <!-- moth-wear in the immaculate -->
      <rect x="10" y="25" width="2" height="1" fill="#3d0e1a" />
      <rect x="17" y="26" width="2" height="1" fill="#3d0e1a" />

      <!-- Rapier arm — levelled at you over the off shoulder line -->
      <rect x="21" y="15" width="6" height="4" fill="#150d08" />
      <rect x="22" y="16" width="4" height="2" fill="#67192a" />
      <rect x="22" y="16" width="4" height="1" fill="#7e1f2c" />
      <!-- lace cuff -->
      <rect x="25" y="15" width="3" height="4" fill="#150d08" />
      <rect x="26" y="16" width="1" height="2" fill="#e8dcc4" />
      <!-- gloved hand on the swept hilt -->
      <rect x="26" y="17" width="3" height="3" fill="#150d08" />
      <rect x="27" y="18" width="1" height="1" fill="#3d0e1a" />
      <!-- swept guard, gilt -->
      <rect x="27" y="15" width="2" height="2" fill="#c89a48" />
      <rect x="27" y="15" width="1" height="1" fill="#ecc46a" />
      <!-- the thin blade levelled at your eye-line -->
      <rect x="28" y="13" width="4" height="3" fill="#150d08" />
      <rect x="28" y="14" width="4" height="1" fill="#b8d8e0" />
      <rect x="28" y="14" width="2" height="1" fill="#e8f4f8" />

      <!-- Off arm folded behind the back — duellist's etiquette -->
      <rect x="4" y="15" width="4" height="9" fill="#150d08" />
      <rect x="5" y="16" width="2" height="7" fill="#531320" />
      <rect x="5" y="16" width="1" height="7" fill="#67192a" />

      <!-- Court skirts falling to the floor, no feet, no haste -->
      <rect x="7" y="28" width="16" height="11" fill="#150d08" />
      <rect x="8" y="29" width="14" height="9" fill="#481021" />
      <rect x="8" y="29" width="14" height="1" fill="#531320" />
      <rect x="8" y="29" width="3" height="9" fill="#531320" />
      <rect x="8" y="29" width="1" height="6" fill="#67192a" />
      <rect x="18" y="29" width="4" height="9" fill="#3d0e1a" />
      <rect x="21" y="29" width="1" height="9" fill="#330b16" />
      <!-- gilt hem thread -->
      <rect x="8" y="36" width="14" height="1" fill="#9a7232" opacity="0.8" />
      <rect x="9" y="36" width="3" height="1" fill="#c89a48" />
      <!-- the skirt parts on shade beneath, not legs -->
      <rect x="13" y="32" width="3" height="6" fill="#221e26" />
      <rect x="14" y="33" width="1" height="5" fill="#16131a" />
      <!-- ragged trail where it drags -->
      <rect x="9" y="38" width="2" height="2" fill="#150d08" />
      <rect x="14" y="39" width="3" height="1" fill="#150d08" />
      <rect x="19" y="38" width="2" height="2" fill="#150d08" />

      <!-- Hall-dust stirred by the turn -->
      <rect x="3" y="12" width="1" height="1" fill="#cdbfa2" opacity="0.35" />
      <rect x="25" y="24" width="1" height="1" fill="#9a949e" opacity="0.4" />
      <rect x="5" y="32" width="1" height="1" fill="#7a7480" opacity="0.4" />
    </svg>
