<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 44 38"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Avatar of the Wilds — the Great Bear"
    >
  <!-- 44×38: the capstone primal bear — the biggest, most imposing form.
       Towering shoulder hump, broad barrel, hulking forward-reared stance,
       fierce wide maw, primal scars + grove-rune markings. Clearly out-masses
       the dire beast. Grove glow is stronger/larger (the avatar). -->
  <ellipse cx="22" cy="19" rx="23" ry="19" fill="#5a8a3a" opacity="0.13" />
  <ellipse cx="26" cy="16" rx="19" ry="16" fill="#c8954a" opacity="0.09" />
  <ellipse cx="22" cy="36.7" rx="21" ry="2.2" fill="#000" opacity="0.46" />

  <!-- ── Tail — heavy fur nub, far left ── -->
  <rect x="0" y="13" width="8" height="8" fill="#150d08" />
  <rect x="1" y="14" width="6" height="6" fill="#33241a" />
  <rect x="1" y="14" width="6" height="1" fill="#6e5236" />
  <rect x="1" y="14" width="2" height="1" fill="#8a6a40" />
  <rect x="1" y="19" width="6" height="1" fill="#241812" />

  <!-- ── Body barrel — massive fur mass, lit ridge, deep belly shadow ── -->
  <rect x="2" y="8" width="33" height="22" fill="#150d08" />
  <rect x="3" y="9" width="31" height="20" fill="#33241a" />
  <!-- back ridge light -->
  <rect x="3" y="9" width="31" height="1" fill="#6e5236" />
  <rect x="3" y="10" width="31" height="1" fill="#4f3a26" />
  <rect x="4" y="9" width="12" height="1" fill="#8a6a40" />
  <!-- flank shadow + heavy belly -->
  <rect x="3" y="9" width="2" height="15" fill="#241812" />
  <rect x="3" y="25" width="31" height="4" fill="#1c130c" />
  <rect x="3" y="24" width="12" height="1" fill="#241812" />
  <!-- fur grain dither -->
  <rect x="9" y="14" width="1" height="1" fill="#4f3a26" />
  <rect x="14" y="17" width="1" height="1" fill="#241812" />
  <rect x="18" y="14" width="1" height="1" fill="#4f3a26" />
  <rect x="22" y="18" width="1" height="1" fill="#241812" />
  <rect x="12" y="21" width="1" height="1" fill="#4f3a26" />
  <rect x="16" y="23" width="1" height="1" fill="#241812" />
  <rect x="26" y="20" width="1" height="1" fill="#4f3a26" />
  <rect x="29" y="16" width="1" height="1" fill="#4f3a26" />
  <!-- primal claw-rake scars across the flank -->
  <rect x="7" y="15" width="1" height="5" fill="#5a3a22" />
  <rect x="9" y="15" width="1" height="5" fill="#5a3a22" />
  <rect x="11" y="16" width="1" height="4" fill="#4f3a26" />

  <!-- ── Shoulder hump — towering crown, the apex mass, key-lit ── -->
  <rect x="13" y="0" width="21" height="12" fill="#150d08" />
  <rect x="14" y="1" width="19" height="10" fill="#33241a" />
  <rect x="14" y="1" width="19" height="1" fill="#8a6a40" />
  <rect x="15" y="0" width="12" height="1" fill="#6e5236" />
  <rect x="15" y="0" width="7" height="1" fill="#b88a4a" />
  <rect x="15" y="0" width="3" height="1" fill="#d8ae6a" />
  <rect x="14" y="2" width="2" height="9" fill="#241812" />
  <rect x="32" y="1" width="1" height="10" fill="#241812" />
  <rect x="14" y="1" width="1" height="1" fill="#4f3a26" />
  <!-- grove-rune glint marked into the hump (primal markings) -->
  <rect x="20" y="3" width="1" height="3" fill="#8ac858" opacity="0.55" />
  <rect x="19" y="4" width="3" height="1" fill="#8ac858" opacity="0.45" />
  <rect x="24" y="4" width="1" height="2" fill="#a8d050" opacity="0.5" />
  <!-- hump fur tufts -->
  <polygon points="17,0 18,-2 19,0" fill="#6e5236" />
  <polygon points="21,0 22,-2 23,0" fill="#4f3a26" />
  <polygon points="25,0 26,-2 27,0" fill="#33241a" />
  <polygon points="29,0 30,-1 31,1" fill="#33241a" />
  <!-- ridge tufts down the back -->
  <polygon points="6,9 7,5 9,9" fill="#4f3a26" />
  <polygon points="10,9 11,6 13,9" fill="#33241a" />
  <polygon points="13,8 14,5 16,9" fill="#4f3a26" />

  <!-- ── Neck + massive lowered head, jutting forward-right ── -->
  <!-- ears -->
  <rect x="29" y="5" width="4" height="4" fill="#150d08" />
  <rect x="30" y="6" width="2" height="2" fill="#33241a" />
  <rect x="30" y="6" width="1" height="1" fill="#6e5236" />
  <rect x="34" y="6" width="4" height="4" fill="#150d08" />
  <rect x="35" y="7" width="2" height="2" fill="#33241a" />
  <rect x="35" y="7" width="1" height="1" fill="#4f3a26" />
  <!-- great skull -->
  <rect x="27" y="8" width="14" height="14" fill="#150d08" />
  <rect x="28" y="9" width="12" height="12" fill="#33241a" />
  <rect x="28" y="9" width="12" height="1" fill="#6e5236" />
  <rect x="28" y="10" width="5" height="1" fill="#4f3a26" />
  <rect x="28" y="9" width="1" height="12" fill="#241812" />
  <!-- heavy brow ridge, scarred -->
  <rect x="30" y="12" width="10" height="1" fill="#1c130c" />
  <rect x="31" y="11" width="1" height="2" fill="#5a3a22" />
  <!-- amber eye — bigger glow + hot core (fiercer) -->
  <ellipse cx="35" cy="14.5" rx="4" ry="3" fill="#f4b43a" opacity="0.42" />
  <rect x="33" y="13" width="3" height="2" fill="#0e0a06" />
  <rect x="34" y="13" width="2" height="1" fill="#f4b43a" />
  <rect x="34" y="13" width="1" height="1" fill="#ffe9a8" />
  <!-- cheek fur tuft -->
  <polygon points="28,19 26,22 29,22" fill="#33241a" />

  <!-- ── Muzzle — broad, extending right, black nose, curled lip ── -->
  <rect x="39" y="14" width="5" height="9" fill="#150d08" />
  <rect x="40" y="15" width="3" height="7" fill="#4f3a26" />
  <rect x="40" y="15" width="3" height="1" fill="#6e5236" />
  <rect x="40" y="15" width="2" height="1" fill="#8a6a40" />
  <rect x="42" y="16" width="1" height="6" fill="#33241a" />
  <!-- nose tip -->
  <rect x="42" y="15" width="2" height="3" fill="#150d08" />
  <rect x="42" y="15" width="1" height="2" fill="#0e0a06" />
  <rect x="42" y="15" width="1" height="1" fill="#3a2a1a" />
  <!-- muzzle wrinkle (snarl) -->
  <rect x="40" y="17" width="3" height="1" fill="#33241a" />

  <!-- ── Wide open maw — deep gullet, long white fangs (fiercer) ── -->
  <rect x="32" y="22" width="12" height="6" fill="#150d08" />
  <rect x="33" y="23" width="10" height="4" fill="#2a1410" />
  <rect x="33" y="23" width="10" height="1" fill="#3d1c16" />
  <!-- upper fangs -->
  <polygon points="34,23 35,27 36,23" fill="#fff8e8" />
  <polygon points="38,23 39,27 40,23" fill="#e8dcc0" />
  <polygon points="41,23 42,26 43,23" fill="#d8c8a0" />
  <rect x="34" y="23" width="1" height="1" fill="#fff8e8" />
  <!-- lower jaw + fangs -->
  <rect x="32" y="27" width="11" height="2" fill="#150d08" />
  <rect x="33" y="27" width="9" height="1" fill="#33241a" />
  <polygon points="35,27 35.5,24.5 36,27" fill="#e8dcc0" />
  <polygon points="39,27 39.5,24.5 40,27" fill="#d8c8a0" />
  <!-- breath wisp (grove-tinged) -->
  <rect x="43" y="20" width="1" height="1" fill="#8ac858" opacity="0.5" />

  <!-- ── Front legs — massive, clawed, planted forward ── -->
  <rect x="24" y="26" width="7" height="10" fill="#150d08" />
  <rect x="25" y="27" width="5" height="8" fill="#33241a" />
  <rect x="25" y="27" width="1" height="8" fill="#4f3a26" />
  <rect x="29" y="27" width="1" height="8" fill="#241812" />
  <rect x="32" y="26" width="7" height="10" fill="#150d08" />
  <rect x="33" y="27" width="5" height="8" fill="#2a1d14" />
  <rect x="33" y="27" width="1" height="8" fill="#3f2e1e" />
  <rect x="37" y="27" width="1" height="8" fill="#1c130c" />
  <!-- paws + big claws -->
  <rect x="23" y="33" width="9" height="3" fill="#150d08" />
  <rect x="24" y="34" width="7" height="1" fill="#241812" />
  <polygon points="23,35 24,37.5 25,35" fill="#fff8e8" />
  <polygon points="26,35 27,37.5 28,35" fill="#e8dcc0" />
  <polygon points="29,35 30,37.5 31,35" fill="#d8c8a0" />
  <rect x="32" y="33" width="9" height="3" fill="#150d08" />
  <rect x="33" y="34" width="7" height="1" fill="#1c130c" />
  <polygon points="32,35 33,37.5 34,35" fill="#d8c8a0" />
  <polygon points="35,35 36,37.5 37,35" fill="#fff8e8" />
  <polygon points="38,35 39,37.5 40,35" fill="#e8dcc0" />

  <!-- ── Hind legs — huge haunch + lower leg ── -->
  <rect x="2" y="19" width="9" height="12" fill="#150d08" />
  <rect x="3" y="20" width="7" height="10" fill="#33241a" />
  <rect x="3" y="20" width="7" height="1" fill="#5e4630" />
  <rect x="3" y="20" width="1" height="10" fill="#4f3a26" />
  <rect x="9" y="20" width="1" height="10" fill="#241812" />
  <!-- haunch muscle line -->
  <rect x="5" y="24" width="3" height="1" fill="#241812" />
  <rect x="4" y="28" width="9" height="8" fill="#150d08" />
  <rect x="5" y="29" width="7" height="6" fill="#2a1d14" />
  <rect x="5" y="29" width="1" height="6" fill="#3f2e1e" />
  <!-- second hind leg behind -->
  <rect x="13" y="26" width="6" height="10" fill="#150d08" />
  <rect x="14" y="27" width="4" height="8" fill="#241812" />
  <rect x="14" y="27" width="1" height="8" fill="#33241a" />
  <!-- hind paws + claws -->
  <rect x="3" y="33" width="10" height="3" fill="#150d08" />
  <rect x="4" y="34" width="8" height="1" fill="#241812" />
  <polygon points="3,35 4,37.5 5,35" fill="#d8c8a0" />
  <polygon points="6,35 7,37.5 8,35" fill="#fff8e8" />
  <polygon points="9,35 10,37.5 11,35" fill="#d8c8a0" />
  <rect x="13" y="33" width="7" height="3" fill="#150d08" />
  <rect x="14" y="34" width="5" height="1" fill="#1c130c" />
  <polygon points="13,35 14,37.5 15,35" fill="#d8c8a0" />
  <polygon points="16,35 17,37.5 18,35" fill="#e8dcc0" />

  <!-- ── Drifting grove motes — stronger, the avatar's aura ── -->
  <rect x="11" y="4" width="1" height="1" fill="#8ac858" opacity="0.6" />
  <rect x="37" y="4" width="1" height="1" fill="#8ac858" opacity="0.5" />
  <rect x="6" y="11" width="1" height="1" fill="#5a8a3a" opacity="0.5" />
  <rect x="41" y="11" width="1" height="1" fill="#a8d050" opacity="0.55" />
  <rect x="2" y="24" width="1" height="1" fill="#8ac858" opacity="0.45" />
  <rect x="38" y="26" width="1" height="1" fill="#a8d050" opacity="0.5" />
</svg>
