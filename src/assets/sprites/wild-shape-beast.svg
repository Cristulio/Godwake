<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 44 38"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Wild Shape — Dire Beast"
    >
  <!-- 44×38 HD redraw: dire bear-beast, lowered head jutting right, shoulder
       hump highest, amber eye, open fanged maw. Grove backlight + motes. -->
  <ellipse cx="22" cy="20" rx="22" ry="17" fill="#5a8a3a" opacity="0.08" />
  <ellipse cx="27" cy="18" rx="17" ry="14" fill="#c8954a" opacity="0.06" />
  <ellipse cx="22" cy="36.6" rx="19" ry="2" fill="#000" opacity="0.42" />

  <!-- ── Tail — short fur nub, far left ── -->
  <rect x="0" y="14" width="7" height="7" fill="#150d08" />
  <rect x="1" y="15" width="5" height="5" fill="#33241a" />
  <rect x="1" y="15" width="5" height="1" fill="#6e5236" />
  <rect x="1" y="15" width="2" height="1" fill="#8a6a40" />
  <rect x="1" y="19" width="5" height="1" fill="#241812" />

  <!-- ── Body barrel — long fur mass, lit ridge, dark belly ── -->
  <rect x="3" y="9" width="30" height="19" fill="#150d08" />
  <rect x="4" y="10" width="28" height="17" fill="#33241a" />
  <!-- back ridge light -->
  <rect x="4" y="10" width="28" height="1" fill="#6e5236" />
  <rect x="4" y="11" width="28" height="1" fill="#4f3a26" />
  <rect x="5" y="10" width="10" height="1" fill="#8a6a40" />
  <!-- flank shadow left + belly -->
  <rect x="4" y="10" width="2" height="12" fill="#241812" />
  <rect x="4" y="24" width="28" height="3" fill="#1c130c" />
  <rect x="4" y="23" width="10" height="1" fill="#241812" />
  <!-- fur grain dither -->
  <rect x="9" y="14" width="1" height="1" fill="#4f3a26" />
  <rect x="13" y="17" width="1" height="1" fill="#241812" />
  <rect x="17" y="15" width="1" height="1" fill="#4f3a26" />
  <rect x="21" y="18" width="1" height="1" fill="#241812" />
  <rect x="11" y="20" width="1" height="1" fill="#4f3a26" />
  <rect x="15" y="22" width="1" height="1" fill="#241812" />
  <rect x="24" y="20" width="1" height="1" fill="#4f3a26" />
  <!-- claw-rake scar across the flank -->
  <rect x="8" y="16" width="1" height="3" fill="#241812" />
  <rect x="10" y="16" width="1" height="3" fill="#241812" />

  <!-- ── Shoulder hump — the highest mass, key-lit crown ── -->
  <rect x="16" y="2" width="17" height="10" fill="#150d08" />
  <rect x="17" y="3" width="15" height="8" fill="#33241a" />
  <rect x="17" y="3" width="15" height="1" fill="#8a6a40" />
  <rect x="18" y="2" width="9" height="1" fill="#6e5236" />
  <rect x="18" y="2" width="5" height="1" fill="#b88a4a" />
  <rect x="18" y="2" width="2" height="1" fill="#d8ae6a" />
  <rect x="17" y="4" width="2" height="7" fill="#241812" />
  <rect x="31" y="3" width="1" height="8" fill="#241812" />
  <rect x="17" y="3" width="1" height="1" fill="#4f3a26" />
  <!-- hump fur tufts -->
  <polygon points="20,2 21,0 22,2" fill="#6e5236" />
  <polygon points="24,2 25,0 26,2" fill="#4f3a26" />
  <polygon points="28,2 29,1 30,3" fill="#33241a" />
  <!-- ridge tufts down the back -->
  <polygon points="7,10 8,7 10,10" fill="#4f3a26" />
  <polygon points="11,10 12,8 13,10" fill="#33241a" />
  <polygon points="14,9 15,7 16,10" fill="#4f3a26" />

  <!-- ── Neck + lowered head, jutting forward-right ── -->
  <!-- ear -->
  <rect x="29" y="7" width="4" height="4" fill="#150d08" />
  <rect x="30" y="8" width="2" height="2" fill="#33241a" />
  <rect x="30" y="8" width="1" height="1" fill="#6e5236" />
  <rect x="34" y="8" width="3" height="3" fill="#150d08" />
  <rect x="35" y="9" width="1" height="1" fill="#4f3a26" />
  <!-- skull -->
  <rect x="28" y="10" width="12" height="12" fill="#150d08" />
  <rect x="29" y="11" width="10" height="10" fill="#33241a" />
  <rect x="29" y="11" width="10" height="1" fill="#6e5236" />
  <rect x="29" y="12" width="4" height="1" fill="#4f3a26" />
  <rect x="29" y="11" width="1" height="10" fill="#241812" />
  <!-- heavy brow ridge -->
  <rect x="31" y="13" width="8" height="1" fill="#1c130c" />
  <!-- amber eye — glow + hot core -->
  <ellipse cx="35" cy="15.5" rx="3.5" ry="2.5" fill="#f4b43a" opacity="0.35" />
  <rect x="33" y="14" width="3" height="2" fill="#0e0a06" />
  <rect x="34" y="14" width="2" height="1" fill="#f4b43a" />
  <rect x="34" y="14" width="1" height="1" fill="#ffe9a8" />
  <!-- cheek fur tuft -->
  <polygon points="29,20 27,22 30,22" fill="#33241a" />

  <!-- ── Muzzle — extending right, black nose, curled lip ── -->
  <rect x="38" y="15" width="6" height="8" fill="#150d08" />
  <rect x="39" y="16" width="4" height="6" fill="#4f3a26" />
  <rect x="39" y="16" width="4" height="1" fill="#6e5236" />
  <rect x="39" y="16" width="2" height="1" fill="#8a6a40" />
  <rect x="42" y="17" width="1" height="5" fill="#33241a" />
  <!-- nose tip -->
  <rect x="42" y="16" width="2" height="3" fill="#150d08" />
  <rect x="42" y="16" width="1" height="2" fill="#0e0a06" />
  <rect x="42" y="16" width="1" height="1" fill="#3a2a1a" />
  <!-- muzzle wrinkle -->
  <rect x="39" y="18" width="3" height="1" fill="#33241a" />

  <!-- ── Open maw — dark gullet, white fangs ── -->
  <rect x="34" y="22" width="10" height="5" fill="#150d08" />
  <rect x="35" y="23" width="8" height="3" fill="#2a1410" />
  <rect x="35" y="23" width="8" height="1" fill="#3d1c16" />
  <!-- upper fangs -->
  <polygon points="36,23 37,26 38,23" fill="#e8dcc0" />
  <polygon points="40,23 41,26 42,23" fill="#d8c8a0" />
  <rect x="36" y="23" width="1" height="1" fill="#fff8e8" />
  <!-- lower jaw + fangs -->
  <rect x="34" y="26" width="9" height="2" fill="#150d08" />
  <rect x="35" y="26" width="7" height="1" fill="#33241a" />
  <polygon points="38,26 38.5,24 39,26" fill="#e8dcc0" />
  <polygon points="41,26 41.5,24.5 42,26" fill="#d8c8a0" />
  <!-- breath wisp -->
  <rect x="43" y="21" width="1" height="1" fill="#8ac858" opacity="0.4" />

  <!-- ── Front legs — thick, clawed ── -->
  <rect x="25" y="26" width="6" height="9" fill="#150d08" />
  <rect x="26" y="27" width="4" height="7" fill="#33241a" />
  <rect x="26" y="27" width="1" height="7" fill="#4f3a26" />
  <rect x="29" y="27" width="1" height="7" fill="#241812" />
  <rect x="32" y="26" width="6" height="9" fill="#150d08" />
  <rect x="33" y="27" width="4" height="7" fill="#2a1d14" />
  <rect x="33" y="27" width="1" height="7" fill="#3f2e1e" />
  <rect x="36" y="27" width="1" height="7" fill="#1c130c" />
  <!-- paws + claws -->
  <rect x="24" y="33" width="8" height="3" fill="#150d08" />
  <rect x="25" y="34" width="6" height="1" fill="#241812" />
  <polygon points="24,35 25,37 26,35" fill="#e8dcc0" />
  <polygon points="27,35 28,37 29,35" fill="#d8c8a0" />
  <polygon points="30,35 31,37 32,35" fill="#e8dcc0" />
  <rect x="31" y="33" width="8" height="3" fill="#150d08" />
  <rect x="32" y="34" width="6" height="1" fill="#1c130c" />
  <polygon points="31,35 32,37 33,35" fill="#d8c8a0" />
  <polygon points="34,35 35,37 36,35" fill="#e8dcc0" />
  <polygon points="37,35 38,37 39,35" fill="#d8c8a0" />

  <!-- ── Hind legs — heavy haunch + lower leg ── -->
  <rect x="3" y="20" width="8" height="11" fill="#150d08" />
  <rect x="4" y="21" width="6" height="9" fill="#33241a" />
  <rect x="4" y="21" width="6" height="1" fill="#5e4630" />
  <rect x="4" y="21" width="1" height="9" fill="#4f3a26" />
  <rect x="9" y="21" width="1" height="9" fill="#241812" />
  <!-- haunch muscle line -->
  <rect x="5" y="24" width="3" height="1" fill="#241812" />
  <rect x="5" y="28" width="8" height="7" fill="#150d08" />
  <rect x="6" y="29" width="6" height="5" fill="#2a1d14" />
  <rect x="6" y="29" width="1" height="5" fill="#3f2e1e" />
  <!-- second hind leg behind -->
  <rect x="12" y="26" width="6" height="9" fill="#150d08" />
  <rect x="13" y="27" width="4" height="7" fill="#241812" />
  <rect x="13" y="27" width="1" height="7" fill="#33241a" />
  <!-- hind paws + claws -->
  <rect x="4" y="33" width="9" height="3" fill="#150d08" />
  <rect x="5" y="34" width="7" height="1" fill="#241812" />
  <polygon points="4,35 5,37 6,35" fill="#d8c8a0" />
  <polygon points="7,35 8,37 9,35" fill="#e8dcc0" />
  <polygon points="10,35 11,37 12,35" fill="#d8c8a0" />
  <rect x="12" y="33" width="7" height="3" fill="#150d08" />
  <rect x="13" y="34" width="5" height="1" fill="#1c130c" />
  <polygon points="13,35 14,37 15,35" fill="#d8c8a0" />
  <polygon points="16,35 17,37 18,35" fill="#e8dcc0" />

  <!-- ── Drifting grove motes (druid tie) ── -->
  <rect x="12" y="5" width="1" height="1" fill="#8ac858" opacity="0.5" />
  <rect x="36" y="6" width="1" height="1" fill="#8ac858" opacity="0.4" />
  <rect x="7" y="12" width="1" height="1" fill="#5a8a3a" opacity="0.4" />
  <rect x="40" y="12" width="1" height="1" fill="#a8d050" opacity="0.45" />
</svg>
