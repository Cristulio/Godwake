<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 28 24"
      shape-rendering="crispEdges"
      preserveAspectRatio="xMidYMax meet"
      aria-label="Wild Shape — Dire Beast"
    >
  <!-- Grove backlight (druid tie) + warm amber key + ground-contact shadow -->
  <ellipse cx="14" cy="13" rx="14" ry="11" fill="#5a8a3a" opacity="0.08" />
  <ellipse cx="17" cy="12" rx="11" ry="9" fill="#c8954a" opacity="0.06" />
  <ellipse cx="14" cy="23" rx="12" ry="1.4" fill="#000" opacity="0.42" />

  <!-- Tail (far left) — short, fur ramp -->
  <rect x="0" y="10" width="4" height="4" fill="#33241a" />
  <rect x="0" y="10" width="4" height="1" fill="#6e5236" />
  <rect x="0" y="10" width="1" height="4" fill="#1c130c" />

  <!-- Body mass — bulky barrel, fur ramp, lit top edge, dark belly -->
  <rect x="2" y="7" width="18" height="11" fill="#33241a" />
  <rect x="2" y="7" width="18" height="1" fill="#6e5236" />
  <rect x="2" y="8" width="18" height="1" fill="#4f3a26" />
  <rect x="2" y="7" width="1" height="11" fill="#1c130c" />
  <rect x="2" y="7" width="2" height="7" fill="#3f2c1e" />
  <rect x="2" y="16" width="18" height="2" fill="#1c130c" />

  <!-- Shoulder hump (bear cue) — highest mass, lit crown + specular pop -->
  <rect x="12" y="3" width="9" height="6" fill="#33241a" />
  <rect x="12" y="3" width="9" height="1" fill="#6e5236" />
  <rect x="13" y="2" width="6" height="1" fill="#6e5236" />
  <rect x="13" y="2" width="4" height="1" fill="#8a6a40" />
  <rect x="13" y="2" width="2" height="1" fill="#b88a4a" />
  <rect x="12" y="4" width="2" height="5" fill="#3f2c1e" />
  <rect x="20" y="3" width="1" height="6" fill="#1c130c" />

  <!-- Neck + head, lowered and jutting forward-right -->
  <rect x="19" y="9" width="7" height="7" fill="#33241a" />
  <rect x="19" y="9" width="7" height="1" fill="#5e4630" />
  <rect x="19" y="9" width="1" height="7" fill="#1c130c" />
  <rect x="20" y="9" width="3" height="1" fill="#6e5236" />

  <!-- Ear (upper, back of head) -->
  <polygon points="19,9 18,5 21,8" fill="#33241a" />
  <polygon points="19,9 18,5 20,8" fill="#4f3a26" />
  <polygon points="19,8 18,5 19,7" fill="#6e5236" opacity="0.7" />

  <!-- Brow ridge -->
  <rect x="21" y="10" width="4" height="1" fill="#1c130c" />
  <!-- Amber eye — glow ellipse + bright core -->
  <ellipse cx="23" cy="12" rx="2.4" ry="1.8" fill="#f4b43a" opacity="0.35" />
  <rect x="22" y="11" width="2" height="1" fill="#f4b43a" />
  <rect x="22" y="11" width="1" height="1" fill="#ffe9a8" />

  <!-- Muzzle / snout extending right -->
  <rect x="25" y="12" width="3" height="4" fill="#3f2c1e" />
  <rect x="25" y="12" width="3" height="1" fill="#5e4630" />
  <rect x="27" y="12" width="1" height="4" fill="#1c130c" />
  <!-- Nose tip -->
  <rect x="27" y="12" width="1" height="2" fill="#0e0a06" />
  <rect x="27" y="12" width="1" height="1" fill="#3a2a1a" />

  <!-- Open fanged maw -->
  <rect x="24" y="15" width="4" height="2" fill="#2a1410" />
  <polygon points="24,15 25,17 26,15" fill="#e8dcc0" />
  <polygon points="26,15 27,17 28,15" fill="#d8c8a0" />
  <rect x="24" y="15" width="1" height="1" fill="#ffffff" opacity="0.85" />

  <!-- Shaggy fur tufts along the back ridge -->
  <polygon points="6,7 7,5 8,7" fill="#4f3a26" />
  <polygon points="9,7 10,5 11,7" fill="#4f3a26" />
  <polygon points="15,3 16,1 17,3" fill="#4f3a26" />

  <!-- Front legs (right) — thick, fur ramp + claws -->
  <rect x="18" y="16" width="3" height="7" fill="#33241a" />
  <rect x="22" y="16" width="3" height="7" fill="#33241a" />
  <rect x="18" y="16" width="1" height="7" fill="#4f3a26" />
  <rect x="22" y="16" width="1" height="7" fill="#4f3a26" />
  <rect x="20" y="16" width="1" height="7" fill="#1c130c" />
  <rect x="24" y="16" width="1" height="7" fill="#1c130c" />
  <rect x="17" y="22" width="5" height="2" fill="#1c130c" />
  <rect x="22" y="22" width="5" height="2" fill="#1c130c" />
  <polygon points="17,23 18,24 19,23" fill="#e8dcc0" />
  <polygon points="19,23 20,24 21,23" fill="#d8c8a0" />
  <polygon points="22,23 23,24 24,23" fill="#e8dcc0" />
  <polygon points="24,23 25,24 26,23" fill="#d8c8a0" />

  <!-- Hind legs (left) — heavy haunch + lower leg + claws -->
  <rect x="3" y="15" width="4" height="8" fill="#33241a" />
  <rect x="8" y="16" width="3" height="7" fill="#33241a" />
  <rect x="3" y="15" width="1" height="8" fill="#4f3a26" />
  <rect x="8" y="16" width="1" height="7" fill="#4f3a26" />
  <rect x="6" y="15" width="1" height="8" fill="#1c130c" />
  <rect x="10" y="16" width="1" height="7" fill="#1c130c" />
  <rect x="2" y="22" width="5" height="2" fill="#1c130c" />
  <rect x="7" y="22" width="5" height="2" fill="#1c130c" />
  <polygon points="2,23 3,24 4,23" fill="#d8c8a0" />
  <polygon points="4,23 5,24 6,23" fill="#e8dcc0" />
  <polygon points="7,23 8,24 9,23" fill="#d8c8a0" />
  <polygon points="9,23 10,24 11,23" fill="#e8dcc0" />

  <!-- Flank dither (tone-boundary grain) -->
  <rect x="6" y="11" width="1" height="1" fill="#4f3a26" opacity="0.8" />
  <rect x="9" y="12" width="1" height="1" fill="#1c130c" />
  <rect x="12" y="11" width="1" height="1" fill="#4f3a26" opacity="0.7" />
  <rect x="15" y="13" width="1" height="1" fill="#1c130c" />
  <rect x="11" y="14" width="1" height="1" fill="#3f2c1e" />

  <!-- Drifting grove motes (druid tie) -->
  <rect x="8" y="4" width="1" height="1" fill="#8ac858" opacity="0.5" />
  <rect x="24" y="6" width="1" height="1" fill="#8ac858" opacity="0.4" />
  <rect x="5" y="8" width="1" height="1" fill="#5a8a3a" opacity="0.4" />
</svg>
