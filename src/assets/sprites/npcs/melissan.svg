<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 40" shape-rendering="crispEdges" preserveAspectRatio="xMidYMax meet" aria-label="Maevra">
      <!-- Pale priestess halo + harvest-violet undertone + ground shadow -->
      <ellipse cx="12" cy="19" rx="12" ry="18" fill="#d8c89a" opacity="0.08" />
      <ellipse cx="12" cy="22" rx="9" ry="12" fill="#7a3a6a" opacity="0.07" />
      <ellipse cx="12" cy="39" rx="8" ry="1.5" fill="#000" opacity="0.4" />

      <!-- Pale silver hair, drawn back — cool ash ramp, key light upper-left -->
      <rect x="6" y="3" width="12" height="4" fill="#b8b0a4" />
      <rect x="5" y="5" width="14" height="13" fill="#b8b0a4" />
      <rect x="6" y="3" width="12" height="1" fill="#dcd6c8" />
      <rect x="5" y="5" width="2" height="13" fill="#c7c0b2" />
      <rect x="5" y="5" width="1" height="9" fill="#e0dccf" />
      <rect x="17" y="5" width="2" height="13" fill="#928a7c" />
      <rect x="18" y="5" width="1" height="13" fill="#7c7468" />
      <rect x="5" y="14" width="2" height="5" fill="#a39a8c" />
      <rect x="17" y="14" width="2" height="5" fill="#867e72" />

      <!-- Circlet — thin gold band with a violet soul-stone -->
      <rect x="6" y="6" width="12" height="1" fill="#caa84e" />
      <rect x="6" y="6" width="12" height="1" fill="#e6c66c" opacity="0.5" />
      <rect x="11" y="5" width="2" height="2" fill="#8a50c0" />
      <rect x="11" y="5" width="1" height="1" fill="#d4b0f8" />

      <!-- Serene, cool-fair face — bone ramp -->
      <rect x="8" y="7" width="8" height="10" fill="#e2d2bc" />
      <rect x="8" y="7" width="3" height="10" fill="#ecdcc6" />
      <rect x="8" y="7" width="1" height="9" fill="#f4e8d4" />
      <rect x="14" y="8" width="2" height="9" fill="#cab89e" />
      <rect x="15" y="8" width="1" height="9" fill="#b6a488" />
      <rect x="8" y="14" width="8" height="2" fill="#cebc9e" />

      <!-- Lowered brows — placid, patient -->
      <rect x="9" y="9" width="2" height="1" fill="#8a7a62" />
      <rect x="13" y="9" width="2" height="1" fill="#8a7a62" />
      <!-- Half-lidded eyes — faint violet bloom, serene rather than blazing -->
      <ellipse cx="10" cy="10.5" rx="2" ry="1.3" fill="#9a6ac0" opacity="0.22" />
      <ellipse cx="14" cy="10.5" rx="2" ry="1.3" fill="#9a6ac0" opacity="0.22" />
      <rect x="9" y="10" width="2" height="1" fill="#3a2a44" />
      <rect x="13" y="10" width="2" height="1" fill="#3a2a44" />
      <rect x="9" y="10" width="1" height="1" fill="#b890e0" />
      <rect x="13" y="10" width="1" height="1" fill="#b890e0" />

      <!-- Fine nose + the kind, unreadable smile -->
      <rect x="11" y="11" width="2" height="2" fill="#d4c2aa" />
      <rect x="11" y="11" width="1" height="2" fill="#e2d2bc" />
      <rect x="10" y="14" width="4" height="1" fill="#a06868" />
      <rect x="9" y="14" width="1" height="1" fill="#bc8a78" opacity="0.7" />
      <rect x="14" y="14" width="1" height="1" fill="#bc8a78" opacity="0.7" />

      <!-- Neck + high priestess collar -->
      <rect x="10" y="16" width="4" height="2" fill="#cebc9e" />
      <rect x="5" y="17" width="14" height="2" fill="#2a2230" />
      <rect x="5" y="17" width="14" height="1" fill="#3e3346" />
      <rect x="8" y="17" width="8" height="3" fill="#1c1622" />
      <polygon points="6,19 8,17 8,23" fill="#352a3e" />
      <polygon points="18,19 16,17 16,23" fill="#2a2230" />

      <!-- Bone-and-ash priestess vestment — pale grey ramp, lit left, gold orphrey -->
      <rect x="4" y="19" width="16" height="21" fill="#4e4654" />
      <rect x="4" y="19" width="1" height="21" fill="#2c2632" />
      <rect x="5" y="19" width="1" height="21" fill="#3a3340" />
      <rect x="18" y="19" width="2" height="21" fill="#2c2632" />
      <rect x="6" y="19" width="2" height="19" fill="#5e5566" />
      <rect x="6" y="19" width="1" height="9" fill="#6e6476" />
      <rect x="11" y="20" width="2" height="20" fill="#6a6072" opacity="0.6" />
      <rect x="8" y="31" width="1" height="1" fill="#5e5566" />
      <rect x="15" y="34" width="1" height="1" fill="#2c2632" />
      <!-- Gold orphrey banding down the vestment -->
      <rect x="11" y="20" width="2" height="1" fill="#caa84e" />
      <rect x="11" y="20" width="1" height="1" fill="#e6c66c" />
      <rect x="11" y="24" width="2" height="1" fill="#b8964a" />
      <rect x="11" y="28" width="2" height="1" fill="#caa84e" />
      <line x1="11.5" y1="20" x2="11.5" y2="29" stroke="#2c2632" stroke-width="0.3" />

      <!-- god-essence reliquary at the breast — violet bloom + bright core -->
      <ellipse cx="12" cy="24" rx="4" ry="4" fill="#7a3aa0" opacity="0.26" />
      <rect x="11" y="22" width="2" height="4" fill="#3a1850" />
      <rect x="10" y="23" width="4" height="2" fill="#3a1850" />
      <rect x="11" y="23" width="2" height="2" fill="#8a50c0" />
      <rect x="11" y="23" width="1" height="1" fill="#d4b0f8" />
      <rect x="11" y="22" width="1" height="4" fill="#a86ad0" opacity="0.6" />

      <!-- Vestment shoulder seams + hem -->
      <rect x="6" y="24" width="1" height="14" fill="#3a3340" />
      <rect x="17" y="24" width="1" height="14" fill="#2c2632" />
      <rect x="4" y="38" width="16" height="2" fill="#2c2632" />
</svg>
