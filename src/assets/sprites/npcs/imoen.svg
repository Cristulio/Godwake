<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 40" shape-rendering="crispEdges" preserveAspectRatio="xMidYMax meet" aria-label="Imoen">
      <!-- Warm hearth backlight + ground shadow -->
      <ellipse cx="12" cy="20" rx="11" ry="18" fill="#c87a3a" opacity="0.07" />
      <ellipse cx="12" cy="39" rx="8" ry="1.4" fill="#000" opacity="0.38" />

      <!-- Hair — auburn ramp, key light upper-left -->
      <rect x="6" y="3" width="12" height="12" fill="#a04020" />
      <rect x="5" y="6" width="14" height="9" fill="#a04020" />
      <rect x="6" y="3" width="12" height="1" fill="#c8542a" />
      <rect x="5" y="6" width="3" height="9" fill="#b04a26" />
      <rect x="5" y="6" width="1" height="9" fill="#c8542a" />
      <rect x="16" y="6" width="3" height="9" fill="#7c2e16" />
      <rect x="18" y="6" width="1" height="9" fill="#642410" />
      <rect x="5" y="14" width="2" height="6" fill="#8c3618" />
      <rect x="17" y="14" width="2" height="6" fill="#702a14" />
      <rect x="5" y="14" width="1" height="6" fill="#a04020" />
      <!-- Bangs + sheen -->
      <rect x="7" y="4" width="8" height="2" fill="#c8542a" />
      <rect x="7" y="4" width="8" height="1" fill="#e0703a" />
      <rect x="6" y="6" width="3" height="3" fill="#d4683a" />
      <rect x="7" y="4" width="1" height="2" fill="#f08a52" opacity="0.7" />

      <!-- Face — warm skin ramp -->
      <rect x="8" y="7" width="8" height="9" fill="#f0d0a4" />
      <rect x="8" y="7" width="3" height="9" fill="#f6d8ae" />
      <rect x="8" y="7" width="1" height="8" fill="#fce2bc" />
      <rect x="14" y="8" width="2" height="8" fill="#e0bc92" />
      <rect x="15" y="8" width="1" height="8" fill="#d4ac84" />
      <rect x="8" y="13" width="8" height="3" fill="#e8c098" />
      <!-- Hairline across brow -->
      <rect x="8" y="6" width="8" height="2" fill="#a04020" />
      <rect x="10" y="6" width="4" height="1" fill="#c8542a" />

      <!-- Bright eyes + spark -->
      <rect x="9" y="10" width="2" height="2" fill="#1a1410" />
      <rect x="10" y="10" width="1" height="1" fill="#a8d4ff" />
      <rect x="9" y="10" width="1" height="1" fill="#d8ecff" />
      <rect x="13" y="10" width="2" height="2" fill="#1a1410" />
      <rect x="14" y="10" width="1" height="1" fill="#a8d4ff" />
      <!-- Cheeks + smile -->
      <rect x="9" y="13" width="1" height="1" fill="#e08a78" opacity="0.7" />
      <rect x="14" y="13" width="1" height="1" fill="#e08a78" opacity="0.7" />
      <rect x="10" y="14" width="1" height="1" fill="#a04030" />
      <rect x="11" y="14" width="2" height="1" fill="#b04838" />
      <rect x="13" y="14" width="1" height="1" fill="#a04030" />

      <!-- Neck -->
      <rect x="10" y="16" width="4" height="2" fill="#e8c098" />
      <rect x="10" y="16" width="4" height="1" fill="#f0d0a4" />

      <!-- Collar -->
      <rect x="6" y="18" width="12" height="2" fill="#3a2418" />
      <rect x="5" y="18" width="14" height="1" fill="#5a3624" />

      <!-- Travel-robe body — leather ramp + lit seam + gold studs -->
      <rect x="6" y="20" width="12" height="13" fill="#6b3a22" />
      <rect x="6" y="20" width="12" height="1" fill="#86492c" />
      <rect x="6" y="20" width="2" height="13" fill="#754023" />
      <rect x="6" y="20" width="1" height="13" fill="#824a2c" />
      <rect x="16" y="20" width="2" height="13" fill="#4e2918" />
      <rect x="17" y="20" width="1" height="13" fill="#3a2010" />
      <rect x="11" y="20" width="2" height="13" fill="#5a3018" opacity="0.7" />
      <rect x="9" y="24" width="1" height="1" fill="#824a2c" />
      <rect x="14" y="28" width="1" height="1" fill="#3a2010" />
      <rect x="11" y="22" width="2" height="1" fill="#d4b062" />
      <rect x="11" y="22" width="1" height="1" fill="#f0d27e" />
      <rect x="11" y="25" width="2" height="1" fill="#d4b062" />
      <rect x="11" y="28" width="2" height="1" fill="#bc9a52" />
      <line x1="11.5" y1="22" x2="11.5" y2="29" stroke="#3a2010" stroke-width="0.3" />

      <!-- Belt + buckle -->
      <rect x="6" y="32" width="12" height="2" fill="#1a1008" />
      <rect x="6" y="32" width="12" height="1" fill="#2c1c10" />
      <rect x="11" y="32" width="2" height="2" fill="#d4b062" />
      <rect x="11" y="32" width="2" height="1" fill="#f0d27e" />

      <!-- Hip dagger — steel ramp + specular -->
      <rect x="16" y="29" width="1" height="4" fill="#a8a4b8" />
      <rect x="16" y="29" width="1" height="2" fill="#d2cee0" />
      <rect x="16" y="29" width="1" height="1" fill="#f0eefa" />
      <rect x="15" y="33" width="3" height="1" fill="#5a3624" />
      <rect x="16" y="34" width="1" height="3" fill="#1a1410" />

      <!-- Skirt + boots -->
      <rect x="7" y="34" width="10" height="5" fill="#3a2418" />
      <rect x="7" y="34" width="10" height="1" fill="#4e3220" />
      <rect x="7" y="34" width="2" height="5" fill="#43291b" />
      <rect x="15" y="34" width="2" height="5" fill="#2c1c10" />
      <rect x="7" y="38" width="10" height="2" fill="#1a1008" />
    </svg>
