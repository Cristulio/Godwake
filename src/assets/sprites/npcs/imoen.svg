<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 60" shape-rendering="crispEdges" preserveAspectRatio="xMidYMax meet" aria-label="Inara">
  <!-- 36×60 dialogue portrait: bust-heavy. Warm hearth key upper-left,
       auburn bob, bright eyes, freckles, travel leathers + hip dagger. -->
  <ellipse cx="18" cy="28" rx="17" ry="27" fill="#c87a3a" opacity="0.08" />
  <ellipse cx="24" cy="24" rx="13" ry="20" fill="#7a5db8" opacity="0.04" />
  <ellipse cx="18" cy="58.4" rx="12" ry="2" fill="#000" opacity="0.38" />

  <!-- ── Hair — auburn bob, key-lit upper-left, falls past the jaw ── -->
  <!-- outline -->
  <rect x="8" y="2" width="20" height="3" fill="#150d08" />
  <rect x="6" y="5" width="24" height="14" fill="#150d08" />
  <rect x="7" y="19" width="6" height="11" fill="#150d08" />
  <rect x="23" y="19" width="6" height="11" fill="#150d08" />
  <!-- crown -->
  <rect x="9" y="3" width="18" height="2" fill="#a04020" />
  <rect x="7" y="5" width="22" height="3" fill="#a04020" />
  <rect x="9" y="3" width="9" height="1" fill="#c8542a" />
  <rect x="10" y="3" width="5" height="1" fill="#e0703a" />
  <rect x="11" y="3" width="2" height="1" fill="#f08a52" />
  <!-- side falls -->
  <rect x="7" y="8" width="4" height="11" fill="#a04020" />
  <rect x="7" y="8" width="2" height="11" fill="#b84a26" />
  <rect x="7" y="8" width="1" height="8" fill="#c8542a" />
  <rect x="25" y="8" width="4" height="11" fill="#7c2e16" />
  <rect x="28" y="8" width="1" height="11" fill="#642410" />
  <!-- long falls over the shoulders -->
  <rect x="8" y="19" width="4" height="10" fill="#8c3618" />
  <rect x="8" y="19" width="1" height="10" fill="#a04020" />
  <rect x="8" y="27" width="4" height="2" fill="#702a14" />
  <rect x="24" y="19" width="4" height="10" fill="#702a14" />
  <rect x="27" y="19" width="1" height="10" fill="#5a2210" />
  <!-- bangs -->
  <rect x="9" y="6" width="18" height="3" fill="#b84a26" />
  <rect x="9" y="6" width="10" height="1" fill="#d4683a" />
  <rect x="9" y="6" width="5" height="1" fill="#e0703a" />
  <rect x="10" y="6" width="2" height="1" fill="#f08a52" />
  <!-- bang points over the brow -->
  <rect x="11" y="9" width="2" height="1" fill="#a04020" />
  <rect x="15" y="9" width="1" height="1" fill="#b84a26" />
  <rect x="19" y="9" width="2" height="1" fill="#a04020" />
  <rect x="24" y="9" width="2" height="1" fill="#7c2e16" />
  <!-- strand shadows in the crown -->
  <rect x="14" y="4" width="1" height="2" fill="#7c2e16" />
  <rect x="21" y="4" width="1" height="3" fill="#7c2e16" />

  <!-- ── Face — fair skin, freckles, bright blue eyes, easy grin ── -->
  <rect x="11" y="9" width="14" height="13" fill="#f0d0a4" />
  <rect x="11" y="9" width="2" height="13" fill="#f8dcb4" />
  <rect x="11" y="9" width="1" height="10" fill="#fce8c4" />
  <rect x="22" y="9" width="3" height="13" fill="#e0bc92" />
  <rect x="24" y="9" width="1" height="13" fill="#d0a87e" />
  <!-- brow shadow under the bangs -->
  <rect x="11" y="10" width="14" height="1" fill="#e0bc92" />
  <!-- eyes — big, blue, lit; one brow raised -->
  <rect x="12" y="12" width="4" height="3" fill="#fbf6ea" />
  <rect x="20" y="12" width="4" height="3" fill="#f2e8d4" />
  <rect x="13" y="12" width="2" height="3" fill="#2a6ab0" />
  <rect x="21" y="12" width="2" height="3" fill="#2a6ab0" />
  <rect x="13" y="12" width="2" height="1" fill="#4a9ae0" />
  <rect x="13" y="12" width="1" height="1" fill="#bce4ff" />
  <rect x="21" y="12" width="1" height="1" fill="#bce4ff" />
  <rect x="13" y="14" width="2" height="1" fill="#1a4a80" />
  <rect x="21" y="14" width="2" height="1" fill="#1a4a80" />
  <!-- lash lines + the raised brow -->
  <rect x="12" y="11" width="4" height="1" fill="#7c4a2e" />
  <rect x="20" y="10" width="4" height="1" fill="#7c4a2e" />
  <!-- freckles -->
  <rect x="12" y="16" width="1" height="1" fill="#d0a87e" />
  <rect x="14" y="17" width="1" height="1" fill="#d0a87e" />
  <rect x="21" y="16" width="1" height="1" fill="#c89a6e" />
  <rect x="23" y="17" width="1" height="1" fill="#c89a6e" />
  <!-- nose -->
  <rect x="17" y="15" width="1" height="2" fill="#e0bc92" />
  <rect x="18" y="16" width="1" height="1" fill="#d0a87e" />
  <!-- grin — wide, one corner higher -->
  <rect x="14" y="19" width="7" height="1" fill="#a84030" />
  <rect x="20" y="18" width="2" height="1" fill="#a84030" />
  <rect x="15" y="20" width="5" height="1" fill="#7e2a20" />
  <rect x="16" y="20" width="3" height="1" fill="#fbf6ea" />
  <!-- blush -->
  <rect x="12" y="15" width="2" height="1" fill="#e89a80" opacity="0.65" />
  <rect x="22" y="15" width="2" height="1" fill="#e89a80" opacity="0.55" />
  <!-- chin -->
  <rect x="14" y="21" width="9" height="1" fill="#e0bc92" />

  <!-- ── Neck + collar ── -->
  <rect x="13" y="22" width="10" height="4" fill="#150d08" />
  <rect x="14" y="22" width="8" height="3" fill="#e0bc92" />
  <rect x="14" y="22" width="8" height="1" fill="#f0d0a4" />
  <rect x="21" y="22" width="1" height="3" fill="#d0a87e" />
  <!-- shell pendant on a cord -->
  <rect x="14" y="24" width="8" height="1" fill="#5a3624" />
  <rect x="17" y="25" width="2" height="2" fill="#e8d8c0" />
  <rect x="17" y="25" width="1" height="1" fill="#fbf6ea" />

  <!-- ── Shoulders + travel vest — leather, gold studs ── -->
  <rect x="6" y="26" width="24" height="4" fill="#150d08" />
  <rect x="5" y="29" width="26" height="25" fill="#150d08" />
  <!-- linen shirt -->
  <rect x="7" y="27" width="22" height="3" fill="#cdbfa2" />
  <rect x="7" y="27" width="22" height="1" fill="#e8dcc4" />
  <rect x="7" y="27" width="6" height="1" fill="#f4ecd8" />
  <rect x="25" y="27" width="4" height="3" fill="#a89c80" />
  <!-- vest body -->
  <rect x="6" y="30" width="24" height="23" fill="#6b3a22" />
  <rect x="6" y="30" width="3" height="23" fill="#824a2c" />
  <rect x="6" y="30" width="1" height="23" fill="#96562f" />
  <rect x="26" y="30" width="4" height="23" fill="#4e2918" />
  <rect x="29" y="30" width="1" height="23" fill="#3a2010" />
  <!-- linen sleeve cuffs visible at the sides -->
  <rect x="6" y="33" width="2" height="6" fill="#cdbfa2" />
  <rect x="28" y="33" width="2" height="6" fill="#a89c80" />
  <!-- vest center lacing + gold studs -->
  <rect x="17" y="30" width="2" height="18" fill="#5a3018" />
  <rect x="17" y="31" width="2" height="1" fill="#d4b062" />
  <rect x="17" y="31" width="1" height="1" fill="#f0d27e" />
  <rect x="17" y="35" width="2" height="1" fill="#d4b062" />
  <rect x="17" y="39" width="2" height="1" fill="#bc9a52" />
  <rect x="17" y="43" width="2" height="1" fill="#d4b062" />
  <!-- stitch dither -->
  <rect x="11" y="34" width="1" height="1" fill="#824a2c" />
  <rect x="23" y="37" width="1" height="1" fill="#3a2010" />
  <rect x="9" y="41" width="1" height="1" fill="#824a2c" />
  <rect x="24" y="44" width="1" height="1" fill="#3a2010" />

  <!-- ── Belt + buckle + hip dagger ── -->
  <rect x="6" y="46" width="24" height="4" fill="#150d08" />
  <rect x="7" y="47" width="22" height="2" fill="#2c1c10" />
  <rect x="7" y="47" width="22" height="1" fill="#46301c" />
  <rect x="16" y="46" width="4" height="4" fill="#150d08" />
  <rect x="17" y="47" width="2" height="2" fill="#d4b062" />
  <rect x="17" y="47" width="1" height="1" fill="#f0d27e" />
  <!-- dagger sheathed at the right hip -->
  <rect x="24" y="44" width="4" height="3" fill="#150d08" />
  <rect x="25" y="45" width="2" height="1" fill="#5a3624" />
  <rect x="24" y="47" width="3" height="8" fill="#150d08" />
  <rect x="25" y="48" width="1" height="6" fill="#a8a4b8" />
  <rect x="26" y="48" width="1" height="5" fill="#7e7a90" />
  <rect x="25" y="48" width="1" height="2" fill="#f0eefa" />

  <!-- ── Skirt ── -->
  <rect x="7" y="50" width="22" height="8" fill="#150d08" />
  <rect x="8" y="51" width="20" height="6" fill="#3a2418" />
  <rect x="8" y="51" width="20" height="1" fill="#4e3220" />
  <rect x="8" y="51" width="3" height="6" fill="#46291c" />
  <rect x="8" y="51" width="1" height="6" fill="#553522" />
  <rect x="25" y="51" width="3" height="6" fill="#2c1c10" />
  <rect x="8" y="56" width="20" height="1" fill="#1a1008" />
</svg>
