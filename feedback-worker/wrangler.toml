name = "godwake-feedback"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Two KV namespaces. Replace the placeholder ids with the ones printed by
# `wrangler kv namespace create` (see README). The `id` is for production;
# `preview_id` is used by `wrangler dev`.
[[kv_namespaces]]
binding = "FEEDBACK_RL"
id = "REPLACE_WITH_FEEDBACK_RL_ID"
preview_id = "REPLACE_WITH_FEEDBACK_RL_PREVIEW_ID"

[[kv_namespaces]]
binding = "FEEDBACK_LOG"
id = "REPLACE_WITH_FEEDBACK_LOG_ID"
preview_id = "REPLACE_WITH_FEEDBACK_LOG_PREVIEW_ID"

# TELEGRAM_TOKEN and TELEGRAM_CHAT_ID are SECRETS, never put them here.
# Set them with `wrangler secret put TELEGRAM_TOKEN` / `... TELEGRAM_CHAT_ID`.

# Optional: extra browser origins allowed to POST (comma-separated). The Worker
# already allows *.pages.dev and localhost; add a custom domain here if you have one.
# [vars]
# ALLOWED_ORIGINS = "https://play.example.com"
